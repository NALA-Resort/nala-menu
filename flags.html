<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>Nala · Booking Flags</title>
<link rel="stylesheet" href="nala-ui2.css?v=6">
<style>
  body { padding:28px 24px 60px; }
  /* The save bar is pinned over the foot of the page, so the page has to
     reserve room for it. Without this the last control on the list sits
     under the bar and cannot be tapped, which pub_suite measures.     */
  body.ui2 { padding-bottom:calc(120px + env(safe-area-inset-bottom)); }

  /* This page's own shape and nothing else. Ground, ink, type, spacing, the
     buttons and the hamburger all come from nala-ui2.css.

     The hand copy of the nav that used to live here is gone. It was written
     out because nala-ui.css is a layout system whose colours only exist on a
     tiered body, and this page carries no tier; nala-ui2.css needs none, so
     the copy has nothing left to do. tag.html carried the same block byte
     for byte and flags.html had already drifted from it, which is what a
     "keep this in step by hand" comment is worth.                        */
  .wrap { max-width:520px; margin:0 auto; }
  .navrow { display:flex; margin-bottom:var(--s2); }

  /* Failure is red, and it is the only thing that is. */
  .errbar { position:fixed; top:0; left:0; right:0; z-index:50;
            background:var(--law-red); color:#fff; padding:var(--s3) var(--s4);
            font-size:var(--t2); line-height:1.5;
            transform:translateY(-100%); transition:transform .25s; }
  .errbar.show { transform:translateY(0); }

  .wordmark { font-size:var(--t1); color:var(--mid); text-align:center;
              letter-spacing:.18em; text-transform:uppercase; }
  .pagename { font-size:var(--t4); font-weight:600; text-align:center;
              margin-top:var(--s1); }
  .lede { text-align:center; color:var(--mid); font-size:var(--t2);
          margin:var(--s2) auto 0; line-height:1.5; max-width:52ch; }

  .secthead { font-size:var(--t2); font-weight:500; color:var(--mid);
              margin-top:var(--s5); }

  .addrow { display:flex; gap:var(--s2); margin-top:var(--s3); }
  .addrow input { flex:1; min-width:0; }
  /* One solid primary per surface, and on this page it is Add. */
  .addbtn { margin-top:var(--s2); }

  .mng { margin-top:var(--s3); }
  .mrow { display:flex; align-items:center; justify-content:space-between;
          gap:var(--s3); padding:var(--s3) 0;
          border-bottom:1px solid var(--rule); min-height:var(--tap); }
  .mname { font-size:var(--t3); }
  .mrow.off .mname { color:var(--mid); font-style:italic; }
  .mbtns { display:flex; gap:var(--s2); flex:0 0 auto; }
  /* A chip, so it wears the pill radius, and "shown" is a selected state so
     it wears the interaction accent rather than ink.                     */
  .mtog { border:1px solid var(--rule); background:transparent; color:var(--mid);
          padding:var(--s2) var(--s3); min-height:36px; border-radius:var(--pill);
          font-family:var(--ui-font); font-size:var(--t2); cursor:pointer;
          -webkit-tap-highlight-color:transparent; }
  .mrow.off .mtog { border-color:var(--accent); color:var(--accent); }
  /* Delete destroys something a booking may be using, so it wears the
     destructive dress of the button law: terracotta outline, and it asks
     first. Offered only on a hidden row, so hide comes before delete.
     It was red, which the colour law reserves for failure alone.        */
  .mtog.mdel { border-color:var(--law-terra-b); color:var(--law-terra); }

  /* The one flag nobody manages from here, shown so nobody re-creates it. */
  .autorow { margin-top:var(--s3); padding:var(--s3) 0;
             border-bottom:1px solid var(--rule); font-size:var(--t3); }
  .autorow .g { font-size:var(--t2); color:var(--mid); margin-left:var(--s2); }

  .savebar { position:fixed; bottom:0; left:0; right:0; background:var(--ground);
             border-top:1px solid var(--rule);
             padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
             transform:translateY(110%); transition:transform .25s; }
  .savebar.show { transform:translateY(0); }
  .savebar .in { max-width:520px; margin:0 auto; display:flex; gap:var(--s3);
                 align-items:center; }
  .savebtn { flex:1; }
  .saved { font-size:var(--t2); color:var(--mid); flex:0 0 auto; }
</style>
</head>
<body class="ui2">
<div class="errbar" id="err"></div>
<div class="wrap">
  <div class="navrow">
  <div class="navwrap">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"></div>
  </div>
  </div>
  <div class="wordmark">Nala Resort</div>
  <div class="pagename">Flag Settings</div>
  <div class="lede">Short facts pinned under a guest's name: VIP, Travel agent,
    Breakfast included.<br>Ticked per booking on the Front Desk sheet, admin
    only, and printed on the FOH Sheet.</div>

  <div class="secthead">Add a flag</div>
  <div class="addrow"><input id="newName" placeholder="e.g. Travel agent" autocomplete="off"></div>
  <button class="btn solid addbtn" id="addBtn">Add flag</button>

  <div class="secthead">All flags</div>
  <div class="mng" id="mng"></div>
  <!-- Listed so nobody re-creates it by hand and prints it twice. It is not a
       row in /flags: it rides on the Mews rate the sync stores, and hiding
       it here could not stop the rate arriving. -->
  <div class="autorow" id="autorow" style="display:none">Luxury Escapes<span class="g">automatic - set by the Mews rate</span></div>
</div>

<div class="savebar" id="savebar"><div class="in">
  <button class="btn solid savebtn" id="saveBtn">Save the list</button>
  <span class="saved" id="savedMsg"></span>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=12"></script>
<script src="nala-shared.js?v=49"></script>
<script>
/* Admin only, both by the menu (NAV_NEEDS says manageStaff) and here, because
   a link can be typed. Ticking a flag on the desk is admin only too, so the
   list that feeds the ticks is fenced the same way. Sent to their own board
   rather than refused, since a role with somewhere to be does not need
   telling off - the tag.html gate, word for word. */
(function gate(){
  if (!window.firebase || !firebase.auth ||
      typeof loadStaff !== 'function'){ setTimeout(gate,300); return; }
  var A;
  try { A = firebase.auth(); } catch (e){ setTimeout(gate,300); return; }
  if (!A || typeof A.onAuthStateChanged !== 'function'){ setTimeout(gate,300); return; }
  A.onAuthStateChanged(function(u){
    if (!u) return;
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role;
      if (window.NALA_NAVFILTER) NALA_NAVFILTER(role);
      if (can(role, 'manageStaff') || e) return;
      document.querySelector('.wrap').style.display = 'none';
      document.getElementById('savebar').style.display = 'none';
      var home = homeFor(role);
      if (home) location.replace(home);
      else document.body.insertAdjacentHTML('afterbegin',
        '<div style="padding:16px;font-family:Helvetica,Arial,sans-serif;font-size:12px">' +
        'This login has no access to Flag Settings. See the manager.</div>');
    });
  });
})();

  var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
  /* The owner's own examples, 26 Aug. Seeded only while /flags is empty,
     saved only when somebody presses Save, and each can be hidden: they
     are suggestions, not fixtures. Luxury Escapes is deliberately NOT here -
     it rides on the Mews rate and creating it by hand would print it twice. */
  var DEFAULTS = ['VIP', 'Travel agent', 'Breakfast included'];

  function err(m){ var e=document.getElementById('err');
    e.textContent=m; e.classList.add('show');
    setTimeout(function(){ e.classList.remove('show'); }, 5000); }

  function keyOf(name){ return name.trim().replace(/[.#$\/\[\]]/g,'').replace(/\s+/g,' '); }

  var MASTER={}, dirty=false;
  var LOCKED=null;   // set to a message when the read failed and saving is unsafe

  function markDirty(){ dirty=true;
    document.getElementById('savebar').classList.add('show');
    document.getElementById('savedMsg').textContent=''; }

  function paintMng(){
    var box=document.getElementById('mng'); box.innerHTML='';
    Object.keys(MASTER).sort(function(a,b){
      var da=MASTER[a], db_=MASTER[b];
      return (db_.active?1:0)-(da.active?1:0) || da.name.localeCompare(db_.name);
    }).forEach(function(k){
      var d=MASTER[k];
      var r=document.createElement('div'); r.className='mrow'+(d.active?'':' off');
      var nm=document.createElement('div'); nm.className='mname';
      nm.textContent=d.name;
      var bs=document.createElement('span'); bs.className='mbtns';
      var b=document.createElement('button'); b.className='mtog';
      /* Hide keeps the flag: it comes off the desk's chips but a booking
         already ticked keeps its pill, because the desk paints a stored name
         it no longer offers. Nothing a person recorded is silently dropped.
         The owner's word, 26 Aug: Hide, not Archive. */
      b.textContent=d.active?'Hide':'Show';
      b.onclick=function(){ d.active=!d.active; markDirty(); paintMng(); };
      bs.appendChild(b);
      /* Delete, only from hidden, lands only on Save - so a mis-tap costs a
         re-add, not a flag. It removes the DEFINITION: a booking already
         ticked still keeps its pill until somebody unticks it, same as a
         hidden flag, for the same reason. */
      if (!d.active){
        var x=document.createElement('button'); x.className='mtog mdel';
        x.textContent='Delete';
        x.onclick=function(){ delete MASTER[k]; markDirty(); paintMng(); };
        bs.appendChild(x);
      }
      r.appendChild(nm); r.appendChild(bs); box.appendChild(r);
    });
    document.getElementById('autorow').style.display = '';
  }

  document.getElementById('addBtn').onclick=function(){
    var inp=document.getElementById('newName'), name=inp.value.trim();
    if (!name) return;
    /* The automatic flag cannot be created by hand: it would print twice,
       once from the tick and once from the rate. Said, not swallowed. */
    if (typeof rateFlagLabel === 'function' &&
        name.toLowerCase() === 'luxury escapes'){
      err('Luxury Escapes is automatic: it comes from the Mews rate and needs no flag here.');
      return;
    }
    var k=keyOf(name);
    if (MASTER[k]) MASTER[k].active=true;
    else MASTER[k]={ name:name, active:true, at:new Date().toISOString() };
    inp.value='';
    markDirty(); paintMng();
  };

  document.getElementById('saveBtn').onclick=function(){
    /* Save is a PUT of the whole list, so it is only safe when the list on
       screen is the list in the database - the tag.html lesson, kept. */
    if (LOCKED) return err(LOCKED);
    var btn=this; btn.disabled=true;
    fetch(DB+'/flags.json',{method:'PUT',body:JSON.stringify(MASTER)})
      .then(function(r){
        if (!r.ok) throw new Error('save failed');
        dirty=false; btn.disabled=false;
        document.getElementById('savedMsg').textContent='Saved';
        setTimeout(function(){ if(!dirty) document.getElementById('savebar').classList.remove('show'); },1200);
      }).catch(function(e){ btn.disabled=false; err('Could not save - check the connection and try again.'); });
  };

  window.addEventListener('beforeunload', function(e){
    if (dirty){ e.preventDefault(); e.returnValue=''; } });

  // ── load ──
  /* A read that FAILS is not an empty node: returning null for both would
     seed the defaults over a refused read and Save would write them over the
     real list. The tag.html shape, kept exactly. */
  fetch(DB+'/flags.json?v='+Date.now())
    .then(function(r){ return r.ok ? r.json() : { __failed:r.status }; })
    .catch(function(){ return { __failed:0 }; })
    .then(function(master){
      if (master && master.__failed !== undefined){
        LOCKED = 'Could not read the flag list. Nothing is saved until it ' +
          'loads, so nothing gets overwritten. Sign in again, then refresh.';
        err(LOCKED);
        document.getElementById('saveBtn').disabled = true;
        paintMng();
        return;
      }
      if (master) MASTER=master;
      else DEFAULTS.forEach(function(n){
        MASTER[keyOf(n)]={name:n,active:true,at:new Date().toISOString()}; });
      paintMng();
    });
</script>

<script>
(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  if (!b || !d) return;
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
})();
</script>
</body>
</html>
