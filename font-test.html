<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<title>Nala - font test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root { --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA; --green:#E4EDE2; --greenb:#7E937A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--ink); padding:18px 16px 60px;
         font-family:Helvetica,Arial,sans-serif; }
  h1 { font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--mid);
       font-weight:normal; margin-bottom:4px; }
  .note { font-size:12px; color:var(--mid); line-height:1.6; margin-bottom:22px; }
  .card { border-top:1px solid var(--rule); padding:16px 0 20px; }
  .name { font-family:Helvetica,Arial,sans-serif; font-size:10px; letter-spacing:.18em;
          text-transform:uppercase; color:var(--mid); margin-bottom:12px; }
  .stats { display:flex; justify-content:center; gap:30px; margin:4px 0 14px; }
  .stat { text-align:center; }
  .stat-n { display:block; font-size:27px; line-height:1; }
  .stat-l { display:block; font-size:8px; letter-spacing:.2em; text-transform:uppercase;
            color:var(--mid); margin-top:6px; }
  .row { display:flex; gap:8px; }
  .tile { flex:1; border:1.2px solid var(--rule); border-radius:10px; background:#fff;
          padding:10px 6px; text-align:center; min-height:74px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .tile.ok { background:var(--green); border-color:var(--greenb); }
  .rn { font-size:20px; font-weight:bold; }
  .chip { font-size:9px; font-weight:bold;
          letter-spacing:.08em; text-transform:uppercase; padding:1px 7px;
          border:1.2px solid var(--ink); border-radius:5px; }
  .sub { font-size:9.5px; color:var(--mid); }
  .sample { margin-top:12px; font-size:15px; line-height:1.5; }
</style>
</head>
<body>

<h1>Font test</h1>
<p class="note">Each block below is the same numbers in a different font.
Look at whether 5, 7 and 9 drop below the line and whether 6 and 8 rise above
it. That uneven look is what Georgia is doing now.</p>

<div id="out"></div>

<script>
var FONTS = [
  ['San Francisco - the Apple system font', "-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, sans-serif"],
  ['San Francisco Rounded', "ui-rounded, -apple-system, system-ui, sans-serif"],
  ['Georgia - what we have now', "Georgia, serif"],
  ['New York - the Apple system serif', "ui-serif, 'New York', serif"],
  ['Charter', "Charter, 'Bitstream Charter', serif"],
  ['Iowan Old Style', "'Iowan Old Style', serif"],
  ['Palatino', "Palatino, 'Palatino Linotype', serif"],
  ['Times New Roman', "'Times New Roman', Times, serif"],
  ['Source Serif 4 - webfont', "'Source Serif 4', serif"],
  ['Fraunces - webfont', "'Fraunces', serif"],
  ['Raleway - matches the guest page', "'Raleway', Helvetica, sans-serif"],
  ['Helvetica - no serif at all', "Helvetica, Arial, sans-serif"]
];

document.getElementById('out').innerHTML = FONTS.map(function(f){
  return '<div class="card" style="font-family:'+f[1].replace(/"/g,"&quot;")+'">'+
    '<div class="name">'+f[0]+'</div>'+
    '<div class="stats">'+
      '<div class="stat"><span class="stat-n">8</span><span class="stat-l">Cleans</span></div>'+
      '<div class="stat"><span class="stat-n">5</span><span class="stat-l">Services</span></div>'+
      '<div class="stat"><span class="stat-n">1</span><span class="stat-l">Pre-arrivals</span></div>'+
      '<div class="stat"><span class="stat-n">7</span><span class="stat-l">Done</span></div>'+
    '</div>'+
    '<div class="stats"><div class="stat"><span class="stat-n">1234567890</span>'+
      '<span class="stat-l">every digit</span></div></div>'+
    '<div class="row">'+
      '<div class="tile ok"><span class="rn">6</span><span class="chip">Service</span><span class="sub">Available 12m</span></div>'+
      '<div class="tile"><span class="rn">15</span><span class="chip">Clean</span><span class="sub">Departed</span></div>'+
      '<div class="tile"><span class="rn">3</span><span class="chip">Service</span><span class="sub">Occupied</span></div>'+
    '</div>'+
    '<div class="sample">Wed 12th Aug &middot; Villa 3 &middot; Mark Whitfield</div>'+
  '</div>';
}).join('');
</script>
</body>
</html>
