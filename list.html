<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Nala · Service Sheet</title>
<link rel="stylesheet" href="nala-ui.css?v=17">
<style>
  /* Zero, deliberately, and the margin is put on the body instead.

     A printed page was carrying the browser's own header and footer as well as
     this sheet's: the URL, the date and time again, and a page number, under a
     timestamp the sheet had already printed itself. Those belong to the print
     dialog and no stylesheet can remove them - except that Chrome and Edge
     drop them when the page margin is zero, which is the one lever CSS has.

     So the page keeps no margin and the body takes 10mm of padding, which puts
     the ink in the same place it was. It also gives back the roughly fifteen
     millimetres those two lines were taking, which is about three more rows.

     Not universal. Safari has its own checkbox in the dialog and iOS may offer
     none at all, so this makes the common case right rather than every case. */
  @page { size: A4 portrait; margin: 0; }
  /* The print metrics, once. The @media print block prints with these and the
     .pmeasure box lays out with the same ones, so the measurement that decides
     the blank rows and the paper it is deciding for cannot drift apart. A
     number changed here changes both. --print-w is A4's 210mm minus the two
     10mm body pads. */
  :root { --print-w:190mm;
          --print-td-pad:9px 5px; --print-td-size:10.5px;
          --print-th-size:8px;    --print-th-padb:9px;
          --print-blank-h:30px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--ui-font); color:#111; background:#fff; padding:16px 16px 0; }

  /* .btn and .btn.ghost wear nala-ui.css's tier-print dress. */
  /* One line, one font, one size, one weight. The top of the sheet had the
     date in a bold letter-spaced face, the make-up at fifteen point, the table
     count at eight, and the covers at seventeen: four styles saying one
     sentence. Nothing here is emphasised over anything else, because at a
     glance the whole line is the same fact, which is what tonight looks like.
     The timestamp below keeps its own smaller style: it is about the piece of
     paper and not about the service. */
  /* Half again as large as it was, and bold. It moved to the foot to stop
     competing with the table for the top of the page, and at nine point it
     went the other way and read as small print. It is the one line on the
     sheet that says what tonight is, and whoever sets the room reads it before
     anything else. Room at the foot to be loud.

     One size and one weight across all of it, still. The version at the top
     said this in four sizes and three weights, and making it bigger is not a
     reason to start that again. */
  .pfoot { display:none; font-family:var(--ui-font); font-size:13.5px;
           font-weight:bold; letter-spacing:.1em; text-transform:uppercase;
           color:#1C1C1A; margin-top:12px; }
  .pfoot .sep { color:#999; margin:0 7px; font-weight:normal; }

  .stamp { margin-top:10px; font-size:7.5px; letter-spacing:.1em;
           text-transform:uppercase; color:#999; text-align:right; }

  .scroller { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { width:100%; min-width:760px; border-collapse:separate; border-spacing:0; }
  th { font-size:7px; letter-spacing:.12em; text-transform:uppercase; color:#666;
       text-align:left; padding:0 5px 6px; border-bottom:1px solid #111;
       white-space:nowrap; vertical-align:bottom; }
  th.wrap { white-space:normal; line-height:1.25; text-align:center; }

  /* box the hand-written table columns */
  th.c-dt, td.c-dt { border-left:1px solid #999; }
  th.c-bt, td.c-bt { border-left:1px solid #bbb; border-right:1px solid #999; }
  td { font-size:9.5px; padding:7.5px 5px; border-bottom:1px solid #ddd; vertical-align:top; }
  tr { page-break-inside:avoid; }

  .c-name { width:17%; font-weight:bold; }
  .c-room { width:5%;  text-align:center; }
  .c-din  { width:6%;  text-align:center; }
  .c-pax  { width:4%;  text-align:center; }
  .c-dep  { width:11%; white-space:nowrap; }
  .c-dt   { width:5%;  text-align:center; }
  .c-bt   { width:5%;  text-align:center; }

  .yes { color:#3F7A52; font-weight:bold; }
  .no  { color:#A8321E; }
  .unk { color:#bbb; }
  /* The make-up IS the instruction for whoever sets the room, so it is the
     stat; the count is its checksum and lives in the label. Anchored left and
     right so the row does not slide as the make-up changes length.          */
  .stats { justify-content:space-between; gap:18px; align-items:baseline; }
  /* The make-up grows with the number of party sizes in the house: a full
     mixed night reads "6 twos - 4 threes - 3 fours - 2 fives - 2 sixes" and
     was set never to wrap, so it pushed the covers figure off the right edge
     and the whole page scrolled sideways. Measured 18 Aug at 397pt wide, so
     it bled at 390 as well as 320, not at 320 only as first recorded.
     It wraps now, and covers stays anchored right where the eye expects it. */
  .stat.statmix { text-align:left; min-width:0; flex:1 1 auto; }
  /* The make-up is what a waiter reads to set the room, so it is the biggest
     thing in the header. It used to be the smallest: 15px against covers at
     20px, in the same grey as a label, so the one instruction on the sheet
     had to be hunted for. Covers is the kitchen's number and stays, smaller,
     because nobody sets a table from it. Reported from the printed sheet on
     18 Aug: too small and too grey to read at a glance. */
  .stat.statmix .stat-n { font-size:23px; line-height:1.15; letter-spacing:.01em;
                          font-weight:400; color:var(--ink); }
  .stat.statmix .stat-l { font-size:9px; color:#55554F; }
  .stats .stat:not(.statmix) { flex:0 0 auto; }
  .stats .stat:last-child { text-align:right; }
  .stats .stat:last-child .stat-n { font-size:19px; }
  .row-out td { background:#FAF6F5; }
  .row-unk td { background:#FCFCFB; }

  .sub { display:block; font-size:8px; color:#777; font-weight:normal; margin-top:2px; }
  /* The second guest, set a step up from the externals' phone line. The
     phone is reference; this is a person the waiter greets by name, so it
     sits just under the primary's size rather than in the small print.
     Owner, 26 Aug. */
  .sub.cmp { font-size:9.5px; }
  .allergen { color:#A8321E; font-weight:bold; }
  /* Dietaries and comments share one column at their combined width, so a long
     dietary list lays out horizontally instead of stacking three deep in a
     narrow column. The comment sits on a second line beneath the pills.     */
  .c-dc { width:48%; }
  .dwrap { display:flex; flex-wrap:wrap; gap:5px; align-items:baseline; }
  .dpill { display:inline-block; font-family:var(--ui-font); font-size:8.5px;
           font-weight:bold; letter-spacing:.06em; text-transform:uppercase;
           padding:2px 7px; border-radius:9px;
           background:rgba(168,50,30,.12); color:#A8321E; }
  .dpill-al { background:#A8321E; color:#fff; }
  /* Blue, not red. Red is the allergy colour on this sheet: the flag, the
     pills, the clash lines. A checkout is a fact about the day and not a
     warning, and sharing the warning colour made every departing guest read as
     a problem to be handled. Same blue the cleans board uses. */
  .checkout { color:#2E74C0; font-weight:bold; }

  /* A guest not dining tonight. Their dietaries are still true and are still
     printed, because an allergy does not stop being one, but they are not
     tonight's instruction to the kitchen and must not compete with the rows
     that are. Greyed, not dropped. */
  .row-out .dpill { background:#EFEFEC; color:#55554F; }
  .row-out .dpill-al { background:#9A9A92; color:#fff; }
  .row-out .dnote, .row-out .inote { color:#8A8A82; }
  /* No print-color-adjust here. It is an INHERITED property, so setting it on
     the cell handed it to every coloured thing inside a flagged row: the Yes,
     the No, the checkout date, the clash lines. Browsers honour exact colour
     by rasterising, and rasterised text at this size prints soft where the
     black around it stays sharp. It bought nothing either way, because the
     print rules below drop this tint from paper anyway. */
  .row-conflict td { background:#F7E4DF; }
  .flag { display:inline-block; font-family:var(--ui-font); font-size:7px; font-weight:bold;
          letter-spacing:.12em; border:1.2px solid #A8321E; color:#A8321E; padding:1px 4px;
          margin-right:5px; vertical-align:1px; }
  .dnote { display:block; font-size:8px; color:#333; font-style:italic; margin-top:2px; }
  /* Which dish clashes with what. The FLAG badge said a guest had a conflict
     and never said which one, so the sheet on the pass could tell a waiter
     something was wrong and not what: the detail lived only in the bubble on
     Reservations, which is a screen, and the sheet exists precisely for the
     moments nobody is at a screen. Upright and dark rather than pilled: it is
     read at a glance while carrying plates. */
  .dclash { display:block; font-size:8.5px; color:#A8321E; font-weight:bold;
            margin-top:3px; line-height:1.35; }
  /* The staff note is management's, not the kitchen's, so it must not read as
     one more line of the dinner comment. Upright where the dietary note is
     italic, and with its own label. */
  /* Kept for anything still asking for it; the sheet's own staff line is
     .crow.staff, which takes its rule from the stack. */
  .snote { display:block; font-size:8px; color:#000; margin-top:2px;
           border-top:1px dotted #999; padding-top:2px; }
  .snote b { font-weight:700; }
  .pre { display:inline-block; font-family:var(--ui-font); font-size:7px; font-weight:bold;
         letter-spacing:.12em; border:1px solid #888; color:#555; padding:1px 4px;
         margin-right:5px; vertical-align:1px; }
  tr.g-in td:first-child { border-left:1px solid #8C8C86; }
  tr.g-in td.c-room      { border-right:1px solid #8C8C86; }
  tr.g-first td:first-child, tr.g-first td.c-room { border-top:1px solid #8C8C86; }
  tr.g-last td:first-child,  tr.g-last td.c-room  { border-bottom:1px solid #8C8C86; }
  tr.g-first td:first-child { border-top-left-radius:9px; }
  tr.g-first td.c-room      { border-top-right-radius:9px; }
  tr.g-last td:first-child  { border-bottom-left-radius:9px; }
  tr.g-last td.c-room       { border-bottom-right-radius:9px; }
  .muted { color:#aaa; font-weight:normal; font-style:italic; }

  /* ── the comments area as its own stack ─────────────────────
     The dietaries used to sit inside the row and share its height with the
     name, the villa and the stay, so one allergy held eight columns of white
     space open beside it. Here the column is a stack of ruled lines: dietary
     on one, staff on the next, and always a blank one at the foot to write on.
     Nothing means one line, dietaries two, both three.

     The writing line is the point and it is new. This sheet is a working
     document before it is a report, and until now the only place to write
     "moved to 7pm" against a named guest was the blank rows at the bottom,
     which belong to nobody. It costs height rather than saving it, which was
     weighed and accepted: thirteen guests each gain a line. */
  .cbox { display:block; }
  .crow { display:block; padding:3px 0; border-bottom:1px dotted #ccc; }
  .crow:last-child { border-bottom:none; }
  /* The slot is always in the markup so the note can land in it later. Empty,
     it must take no room and draw no rule. */
  .snotehere:empty { display:none; }
  .crow.write { height:19px; }
  .crow.diet .dwrap { display:inline-flex; vertical-align:middle; margin-right:8px; }
  .crow.diet .dclash { display:inline; margin:0 10px 0 0; }
  .crow.diet .inote { font-style:italic; font-size:8.5px; color:#333;
                      margin-right:10px; }
  .crow.diet .inote.dnote { display:inline; border:0; margin-top:0; padding:0;
                            color:#111; }
  .crow.staff { font-size:8.5px; }
  .crow.staff b { font-family:var(--ui-font); font-size:7px; letter-spacing:.12em;
                  text-transform:uppercase; color:#55554F; margin-right:6px;
                  font-weight:700; }
  /* A booking flag: VIP, Travel agent, the Luxury Escapes rate. Pinned
     under the guest's name, where the owner asked for it, in the row the
     companion's small line already uses. A fact about the booking, not a
     warning, so it is inked plainly - bordered like the PRE badge, never
     red (red is failure, by the colour law) and never the allergy pill's
     fill. Its slot follows the staff-note pattern: always in the markup,
     invisible while empty, filled when the per-booking reads land. */
  .fkhere { display:block; margin-top:3px; line-height:1.9; }
  .fkhere:empty { display:none; }
  .fpill { display:inline-block; font-family:var(--ui-font); font-size:7.5px;
           font-weight:bold; letter-spacing:.1em; text-transform:uppercase;
           border:1.2px solid #55554F; color:#1C1C1A; padding:1px 6px;
           border-radius:9px; margin-right:4px; }

  /* empty write-in rows: one rule only, from the cell border */
  tr.blank td { height:26px; }


  /* The printed-header clone was retired: its selector list was emptied and
     the suite pins that nothing is cloned into the table head any more. The
     .phead dress, the thead slot and the clone script left with it.       */
  .syncwarn { font-size:11px; line-height:1.5; color:#A8321E; margin:10px 0 4px;
              max-width:60ch; }

  /* Screen has the stats row above the table and does not need this as well. */
  .printfoot { display:none; }
  .printfoot > td { border:0; padding:0; }
  /* The screen keeps the standalone stamp under the table; the copy inside the
     footer is for paper only, or both would show. */
  .printstamp { display:none; }

  @media print {
    /* The screen's date buttons and its larger stat row are for a desk.

       Written as plain rules. The previous version used :not() with a
       compound selector inside it, which older engines reject, and a rejected
       selector takes the WHOLE comma-separated rule down with it: the date row
       and the stats would print as well as being replaced. */
    .daterow, .stats { display:none !important; }
    /* table-footer-group, not block: the group is what a browser repeats. */
    .printfoot { display:table-footer-group !important; }
    .pfoot { display:block !important; }
    .printstamp { display:block !important; }
    /* The one outside the table would print a second time, and on its own
       page when the table filled the last one. */
    #stamp { display:none !important; }
  }
  @media print {
    /* The page margin the @page rule gave up, taken here instead. Not less
       than this: printers have an unprintable edge of a few millimetres and
       anything inside it is clipped without warning. */
    body { padding:10mm; }
    .scroller { overflow:visible; }

    /* No tinted rows on paper. On screen they group the sheet at a glance;
       printed they come out as grey slabs that read as a photocopy. The text
       stays lighter, which is enough.                                    */
    .row-out td, .row-unk td, .row-conflict td { background:none; }

    /* Exact colour asked for on the pills alone, and nowhere else, because a
       pill without its fill is a word in a box and the fill is what makes an
       allergy findable at a glance. Everything else on this sheet is coloured
       TEXT, which prints as text and needs no help: asking for exact colour
       there is what made it rasterise and go soft. */
    .dpill { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .dpill * { -webkit-print-color-adjust:economy; print-color-adjust:economy; }
    td, .yes, .no, .checkout, .dclash, .flag, .crow, .inote {
      -webkit-print-color-adjust:economy; print-color-adjust:economy; }

    /* The make-up carries onto paper at full size. The printed sheet is
       where a waiter actually reads it, standing at the pass. */
    .stat.statmix .stat-n { font-size:19px; color:#1C1C1A; }
    .stat.statmix .stat-l { font-size:8.5px; color:#55554F; }

    /* The sheet was filling about three quarters of the page, so it read as
       compressed and left a band of white at the foot. The rows are given
       the height back: this is a working document that gets written on, and
       the writing needs somewhere to go.                                  */
    /* The sheet was filling about three quarters of the page, so it read as
       compressed and left a band of white at the foot. The rows are given
       the height back: this is a working document that gets written on, and
       the writing needs somewhere to go.

       Taken down to 9.5px on 22 Aug to buy room, and put straight back the
       same day: it was too hard to read. That was the wrong lever. The sheet
       ran to a second page because it padded to twenty-one rows whatever the
       house was doing, and capping the total at seventeen is what fixed it.
       Shrinking the type was solving a problem that had already gone, at the
       cost of the one thing this document has to do, which is be read at a
       pass by somebody carrying plates. */
    td { padding:var(--print-td-pad); font-size:var(--print-td-size); }
    th { font-size:var(--print-th-size); padding-bottom:var(--print-th-padb); }
    tr.blank td { height:var(--print-blank-h); }
    table { min-width:0; width:100%; }
    tr { page-break-inside:avoid; }
    thead { display:table-header-group; }
    table { border-collapse:collapse; }   /* Safari repeats headers only when collapsed */
  }

  /* The measuring box: an off-screen copy of the table laid out exactly as
     paper lays it out - the print metrics above, at the printed width - so the
     sheet can ask "how tall will I print?" while it is still on screen. The
     blank write-in rows are decided from this, by height; deciding them by
     count is what printed the day's summary on a page of its own. See the
     note at padBlanks. visibility rather than display, because display:none
     has no layout to measure. Appended, read, removed in one breath: it is
     never left in the page. */
  .pmeasure { position:absolute; left:-9999px; top:0; width:var(--print-w);
              visibility:hidden; }
  .pmeasure table { min-width:0; width:100%; border-collapse:collapse; }
  .pmeasure td { padding:var(--print-td-pad); font-size:var(--print-td-size); }
  .pmeasure th { font-size:var(--print-th-size); padding-bottom:var(--print-th-padb); }
  .pmeasure tr.blank td { height:var(--print-blank-h); }
  .pmeasure .printfoot { display:table-footer-group; }
  .pmeasure .pfoot { display:block; }
  .pmeasure .printstamp { display:block; }
</style>
</head>
<body class="tier-print">




<div class="daterow">
  <button class="dnav today" id="dToday">Today</button>
  <button class="dnav" id="dPrev">&#8249;</button>
  <div class="date" id="title"></div>
  <button class="dnav" id="dNext">&#8250;</button>
  <div class="navwrap">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"></div>
  </div>
</div>
<script>
var SHEET = [];
function stripTags(h){
  var d = document.createElement('div');
  d.innerHTML = h || '';
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });

  /* Role gate, per the matrix in ROLES.md. The sheet is read and print for
     everyone who may see it at all, so there is one question here, not two. */
  window.NALA_ROLE = null;
  (function gate(){
    /* Wait for the helper too, not just firebase: a stubbed SDK calls back
       synchronously, and nala-shared.js loads at the foot of the page.
       auth() itself throws when no app has been initialised, and a partial
       SDK can arrive without onAuthStateChanged, so both are guarded: a
       throw here would take the whole page down with it.               */
    if (!window.firebase || !firebase.auth ||
        typeof loadStaff !== 'function'){ setTimeout(gate,300); return; }
    var A;
    try { A = firebase.auth(); } catch (e){ setTimeout(gate,300); return; }
    if (!A || typeof A.onAuthStateChanged !== 'function'){ setTimeout(gate,300); return; }
    A.onAuthStateChanged(function(u){
      if (!u) return;                 /* auth.js owns the signed-out state */
      loadStaff(function(recs, err){
        var role = roleOf(u);
        window.NALA_ROLE = role;
        window.NALA_NAVFILTER(role);
        showAccess(can(role,'resSheet'), err);
        staffNotesWhenReady(null);
      });
    });
  })();


  /* The filter lives in nala-shared.js. This page carried its own copy, and
     it had fallen behind: it did not know about front-desk, registration or
     pages, so it offered all three to roles that cannot open them.        */

  function showAccess(allowed, err){
    var box = document.getElementById('noAccess');
    var on  = !allowed;
    box.innerHTML = !on ? '' :
      (err ? '<div>Could not check access. This is usually the connection, '
           + 'not your login.</div>'
           + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
           : 'This login has no access to the Reservations Sheet. See the manager.');
    /* A role that cannot see this page but has a board of its own is sent
       there rather than shown a refusal. Only a login with no role at all
       gets the message, because it has nowhere to be sent.             */
    if (on && !err){
      var home = homeFor(window.NALA_ROLE);
      if (home && home !== location.pathname.split('/').pop()){
        location.replace(home); return;
      }
    }
    box.className = 'noaccess' + (on ? ' show' : '');
    ['statsRow','sheetScroller','footBar'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.style.display = on ? 'none' : '';
    });
  }
})();
</script>
<div class="noaccess" id="noAccess"></div>

<div class="stats" id="statsRow">
    <div class="stat statmix"><span class="stat-n" id="tblBreak">&ndash;</span><span class="stat-l"><span id="nTables">&ndash;</span> <span id="nTablesWord">tables</span></span></div>
    <div class="stat"><span class="stat-n" id="nCovers">&ndash;</span><span class="stat-l">Covers</span></div>
  </div>

<div class="syncwarn" id="syncWarn" style="display:none"></div>

<div class="scroller" id="sheetScroller">
  <table>
    <thead>
      <tr>
        <th class="c-name">Name</th>
        <th class="c-room">Villa</th>
        <th class="c-dt wrap">Dinner<br>table</th>
        <th class="c-bt wrap">B'fast<br>table</th>
        <th class="c-din">Dinner</th>
        <th class="c-pax">Pax</th>
        <th class="c-dep">Stay</th>
        <th class="c-dc" colspan="2">Dietaries &amp; dinner notes</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
    <!-- A real table footer, for the same reason the header used to be a table
         header: a browser repeats thead and tfoot on every printed page and
         will not repeat a plain block. As a div after the table this line
         flowed like any other content, so the day it spilled onto a second
         page the summary went with it and page one ended on a cut-off row. -->
    <tfoot class="printfoot">
      <tr><td colspan="9">
        <div class="pfoot" id="pFoot">
          <span id="fDate"></span>
          <span class="sep">&middot;</span><span id="fMix">&ndash;</span>
          <span class="sep">&middot;</span><span id="fTables"></span>
          <span class="sep">&middot;</span><span id="fCovers">&ndash;</span> covers
        </div>
        <!-- The timestamp travels with the summary rather than trailing the
             table. Outside it, it flowed as its own block, and a sheet that
             filled its last page put the stamp alone on the next one: a whole
             sheet of paper carrying one line of small print. -->
        <div class="stamp printstamp" id="stampFoot"></div>
      </td></tr>
    </tfoot>
  </table>
</div>
<div class="stamp" id="stamp"></div>

<div class="foot" id="footBar">
  <button class="btn" onclick="window.print()">Print</button>
  <button class="btn ghost" onclick="location.reload()">Refresh</button>
</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=12"></script>
<script src="nala-shared.js?v=44"></script>
<script>
// date state + header wiring from nala-shared.js
var nav = initDateNav();
var VIEW = nav.VIEW, todayKey = nav.todayKey, isToday = nav.isToday;
function tomorrowKey(){ var d=new Date(VIEW); d.setDate(d.getDate()+1); return dkey(d); }

// paper needs to say which print is current
(function stamp(){
  var n=new Date();
  var hh=n.getHours(), mm=String(n.getMinutes()).padStart(2,'0');
  var ap=hh>=12?'pm':'am'; hh=hh%12||12;
  var stampText =
    'Printed '+n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear()+' '+hh+':'+mm+ap;
  /* Two copies of one fact, and only ever one of them visible: the screen's
     under the table, the printed one inside the table's footer so it cannot be
     orphaned onto a page of its own. */
  ['stamp','stampFoot'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.textContent = stampText;
  });
})();

/* One copy of the write-in row, because it is built in two places now: the
   sheet's own foot and the measuring clone that prices one before it is
   added. */
var BLANK_ROW =
  '<tr class="blank"><td></td><td></td><td class="c-dt"></td><td class="c-bt"></td>'+
  '<td></td><td></td><td></td><td></td><td></td></tr>';

/* How tall the printed table may grow before the sheet must stop adding
   blank rows. A4 is 297mm and the body keeps 10mm top and bottom, which
   leaves 277mm; the rest of the discount is for what no stylesheet can see
   or measure - AirPrint's own margins, Safari's header and footer lines,
   whatever the print dialog is set to. Those took the summary onto a second
   page twice, 22 and 26 Aug, so the allowance is deliberately generous.

   Conservative in the right direction: guessing low costs a heavy night a
   spare write-in line, guessing high prints the day's summary on a page
   carrying nothing else, which is the failure this number exists to end.
   Guest rows are never dropped for it - a house that genuinely overruns a
   page overruns it, blanks left off. */
var PRINT_TABLE_BUDGET_MM = 240;

/* Blank rows to write walk-ins on - as many as the PAGE has room for, up to
   four, and none the page has not.

   They were counted until 26 Aug: pad to fourteen rows, four blanks at most,
   fourteen having been measured on 22 Aug on a night of even rows. Then rows
   stopped being even. The comments column is a stack now, and a staff note
   of nine lines - a raw Mews order dump, that night - is still ONE row, so
   the count could not see it: ten guests plus four blanks measured fine by
   rows and spilled by millimetres, and the last blank went to a second page
   with the day's summary under it. A page whose only ink is a footer.

   So the sheet measures instead of counting. The table is cloned into an
   off-screen box laid out with the print metrics (the .pmeasure rules read
   the same variables the @media print block does), one blank is added to the
   clone to price a blank, and real blanks are added only while the whole
   table - summary footer included, that is what the clone's tfoot is doing
   there - still fits PRINT_TABLE_BUDGET_MM. Run again whenever a row can
   have changed height after the first paint: the staff notes land a beat
   after the sheet draws, and they are exactly what broke the count. */
function padBlanks(){
  var tb = document.getElementById('rows');
  if (!tb || !tb.children.length) return;
  var old = tb.querySelectorAll('tr.blank');
  for (var i = old.length - 1; i >= 0; i--) tb.removeChild(old[i]);
  var box = document.createElement('div');
  box.className = 'pmeasure';
  var clone = document.querySelector('#sheetScroller table').cloneNode(true);
  /* Ids stripped for the same reason the print header's clone strips them:
     a duplicated id makes every getElementById on the page a coin toss. */
  var ids = clone.querySelectorAll('[id]');
  for (var i = 0; i < ids.length; i++) ids[i].removeAttribute('id');
  box.appendChild(clone);
  document.body.appendChild(box);
  var budget = PRINT_TABLE_BUDGET_MM * 96 / 25.4;
  var base = clone.getBoundingClientRect().height;
  clone.tBodies[0].insertAdjacentHTML('beforeend', BLANK_ROW);
  var blankH = clone.getBoundingClientRect().height - base;
  document.body.removeChild(box);
  var n = blankH > 0 ? Math.floor((budget - base) / blankH) : 0;
  n = Math.max(0, Math.min(4, n));
  for (var i = 0; i < n; i++) tb.insertAdjacentHTML('beforeend', BLANK_ROW);
}
/* Where the browser says printing is about to happen, measure again at that
   moment in case anything moved since load. iOS fires no beforeprint - the
   same reason the print header is built at load - so it keeps the load-time
   result, which the staff-notes re-run has already brought up to date. */
window.addEventListener('beforeprint', padBlanks);

// A stay range on ONE line: "Tue 11-Fri 14". Month is omitted - we know it,
// and the ordinal is dropped so the range never wraps to a second row.
// Falls back to just the checkout if no arrival date was captured.
/* An allergy is a solid red pill, a preference a tinted one. The word
   "allergy" is dropped from the label because the fill already says it. */
/* Tonight's clashes, grouped by dish, in the wording the bubble on
   Reservations uses so the paper and the screen say the same thing. One line
   per dish: a guest with two dietaries against one dish reads as one problem,
   which is what it is on a plate.

   Only ever drawn for a guest who is dining. menuConflicts is given an empty
   list otherwise, which is the same guard the row colour uses. */
function escText(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function clashHTML(hits){
  if (!hits || !hits.length) return '';
  var byDish = {}, order = [];
  hits.forEach(function(x){
    if (!byDish[x.dish]) { byDish[x.dish] = []; order.push(x.dish); }
    if (byDish[x.dish].indexOf(x.diet) < 0) byDish[x.dish].push(x.diet);
  });
  return order.map(function(d){
    return '<span class="dclash">' + escText(d) + ' \u2013 ' +
           escText(byDish[d].join(', ')) + '</span>';
  }).join('');
}

/* The comments column, as its own stack of ruled lines.

   One line for a guest with nothing, two with dietaries, three with a staff
   note as well, and the blank writing line always at the foot. It is the
   writing line that justifies the shape: this sheet is worked on at the pass,
   and until now the only place to note "moved to 7pm" against a named guest
   was the spare rows at the bottom, which belong to nobody.

   The staff line is filled in later, by staffNotesWhenReady, because the notes
   are one read per villa and arrive after the sheet has drawn. Its slot is put
   here whether or not a note exists, and stays empty when none does. */
function commentBox(g, hits, row){
  var diet = (dietPills(g.diets) || (g.nodiet ? '<span class="muted">No dietaries</span>' : '')) +
             clashHTML(hits) +
             (g.note ? '<span class="inote">' + g.note + '</span>' : '') +
             /* The dietary note keeps its label. Run together with the dinner
                note behind a single space they read as one sentence, and they
                are two different people's business: one is where the guest
                would like to sit, the other is what will hurt them. */
             (g.dnote ? '<span class="inote dnote">Dietary: ' + g.dnote + '</span>' : '');
  return '<div class="cbox">' +
         (diet.trim() ? '<span class="crow diet">' + diet + '</span>' : '') +
         '<span class="snotehere" data-villa="' + (row.room || '') + '"></span>' +
         '<span class="crow write"></span></div>';
}

function dietPills(diets){
  diets = fixDietList(diets);
  if (!diets.length) return '';
  return '<div class="dwrap">' + diets.map(function(x){
    var al = (typeof ALLERGENS!=='undefined' && ALLERGENS.indexOf(x)>-1) || /allerg/i.test(x);
    var label = al ? x.replace(/\s*allergy\s*/i,'') : x;
    return '<span class="dpill'+(al?' dpill-al':'')+'">'+label+'</span>';
  }).join('') + '</div>';
}

function stayHTML(arrRaw, depRaw){
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var a = parseDepDate(arrRaw), d = parseDepDate(depRaw);
  function one(x){ return days[x.getDay()]+' '+x.getDate(); }
  var out;
  if (a && d)      out = one(a)+'-'+one(d);
  else if (d)      out = '-'+one(d);
  else if (a)      out = one(a)+'-';
  else             return '';
  if (d && dkey(d) === tomorrowKey()) return '<span class="checkout">'+out+'</span>';
  return out;
}

function depHTML(raw){
  var d = parseDepDate(raw);
  if (!d) return '';
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var txt = days[d.getDay()]+' '+d.getDate()+' '+mo[d.getMonth()];
  if (dkey(d) === tomorrowKey()) return '<span class="checkout">'+txt+'</span>';
  return txt;
}

// tonight's tagged menu, for dietary conflict flags
var MENU = null;
function fetchMenu(){
  return fetchMenuAnywhere()
    .then(function(m){
      m = m || {};
      var filled = ['bread','entree','main','dessert'].every(function(k){
        return m[k] && m[k].name && m[k].name.trim() !== '';
      });
      var fresh = false;
      if (m.published) {
        var pub = parseISO(m.published);   // Safari chokes on Python's 6-digit fractions
        fresh = pub ? (dkey(pub) === todayKey()) : false;
      }
      if (filled && fresh) MENU = m;
    })
    .then(function(){
      // dish tags are written by tag.html into Firebase
      return fetch(DB + '/menutags/' + todayKey() + '.json')
        .then(function(r){ return r.json(); })
        .then(function(tags){
          if (tags && MENU) ['bread','entree','main','dessert'].forEach(function(k){
            if (MENU[k] && tags[k]) MENU[k].conflicts = tags[k];
          });
        });
    })
    .catch(function(){});
}

function api(path){ return fetch(DB+path+'.json?v='+Date.now()).then(function(r){return r.json();}); }

/* Staff notes, keyed by villa. Empty until the reads land, and the sheet
   paints without waiting: a note is worth having and never worth holding a
   service sheet for.

   Who may see one. The page opens on the resSheet permission, which a chef and
   a waiter both hold, and this note is neither of theirs: it is the reservation
   note management keeps, and it says things like who is not to be charged. The
   sheet is printed and left on a pass, so the gate is the role, matching the
   front desk. There is no permission for it and inventing one would put a row
   on the Settings grid for a thing nobody asked to delegate. */
var STAFFNOTES = {};
/* The data load starts at once and the role arrives on its own clock, so
   neither can assume the other has happened. Both call this; the second one
   through is the one that does the work. */
var STAYS_FOR_NOTES = null, NOTES_DONE = false;
function staffNotesWhenReady(stays){
  if (stays) STAYS_FOR_NOTES = stays;
  if (NOTES_DONE || !STAYS_FOR_NOTES || !window.NALA_ROLE) return;
  NOTES_DONE = true;
  fetchStaffNotes(STAYS_FOR_NOTES).then(paintStaffNotes);
}
function canInternal(){
  return window.NALA_ROLE === 'admin' || window.NALA_ROLE === 'manager' ||
         window.NALA_ROLE === 'staff';
}
/* One read per occupied villa. The note hangs off the reservation, so the only
   way to it is the booking id on the stay; /internal is readable per id and
   not as a node, which rules out one read for the lot. A failure anywhere here
   leaves that villa noteless and the sheet otherwise whole. */
/* Written with textContent rather than into the row's HTML string: the note is
   typed by a person and the sheet is otherwise built by concatenation, so an
   angle bracket in a name or a note would otherwise land as markup. */
function paintStaffNotes(){
  var slots = document.querySelectorAll('.snotehere');
  for (var i=0; i<slots.length; i++){
    var v = slots[i].getAttribute('data-villa');
    var t = v ? STAFFNOTES[String(v)] : '';
    slots[i].textContent = '';
    if (!t) continue;
    /* A line in the stack, like the dietary line above it, rather than a
       block hanging off the bottom of one. The dotted rule now comes from
       .crow and not from .snote's own border, so the spacing matches. */
    var d = document.createElement('span');
    d.className = 'crow staff';
    var b = document.createElement('b');
    b.textContent = 'Staff';
    d.appendChild(b);
    d.appendChild(document.createTextNode(t));
    slots[i].appendChild(d);
  }
  /* The notes just changed row heights, so the blank-row decision is stale.
     This is not hypothetical: the row that spilled the 26 Aug sheet was a
     staff note. */
  padBlanks();
}
/* The booking flags, two reads per occupied villa: the staff-note shape, but
   ungated, because a flag like Breakfast included is an instruction to
   whoever is serving and every role that can print this sheet may see it.
   The pills are what bookingFlagLabels (nala-shared.js) says: the names the
   desk ticked at /bookflags, and Luxury Escapes when the Mews rate the sync
   stored says so - that rate and no other, the owner's ruling. A failed
   read leaves that villa flagless and the sheet otherwise whole. */
var BOOKFLAGS = {};
function fetchFlags(stays){
  if (!stays) return Promise.resolve();
  return Promise.all(Object.keys(stays).map(function(v){
    var id = stays[v] && stays[v].id;
    if (!id) return null;
    return Promise.all([
      api('/bookings/' + id + '/pms').catch(function(){ return null; }),
      api('/bookflags/' + id).catch(function(){ return null; })
    ]).then(function(res){
        var labels = bookingFlagLabels(res[0], res[1]);
        if (labels.length) BOOKFLAGS[String(v)] = labels;
      })
      .catch(function(){});
  }));
}
/* textContent per pill, never markup: the names are typed by an admin and
   the name cell is otherwise built by concatenation, the staff-note lesson. */
function paintFlags(){
  var slots = document.querySelectorAll('.fkhere');
  for (var i=0; i<slots.length; i++){
    var v = slots[i].getAttribute('data-villa');
    var labels = v ? BOOKFLAGS[String(v)] : null;
    slots[i].textContent = '';
    if (!labels) continue;
    labels.forEach(function(t){
      var s = document.createElement('span');
      s.className = 'fpill';
      s.textContent = t;
      slots[i].appendChild(s);
    });
  }
  /* The flags changed row heights, so the blank-row decision is stale -
     the same reason the staff notes re-measure. */
  padBlanks();
}
function fetchStaffNotes(stays){
  if (!canInternal() || !stays) return Promise.resolve();
  return Promise.all(Object.keys(stays).map(function(v){
    var id = stays[v] && stays[v].id;
    if (!id) return null;
    return api('/internal/' + id)
      .then(function(rec){
        rec = rec || {};
        /* The rewritten note if there is one, otherwise what Mews sent. Same
           order as the desk, so the sheet and the screen never disagree, and
           the same test for presence rather than truth: a note cleared on
           purpose is empty here too, and must not print the Mews original the
           staff just removed. This sheet is printed and left on a pass, so a
           deleted note reappearing on paper is the worst of the three places
           it happened. */
        var t = (rec.note === undefined || rec.note === null)
                  ? (rec.fromMews || '') : rec.note;
        if (t) STAFFNOTES[String(v)] = t;
      })
      .catch(function(){});
  }));
}

Promise.all([ api('/responses/'+todayKey()), api('/manual/'+todayKey()), fetchRoomGuests(todayKey()), fetchMenu(), api('/combined/'+todayKey()), fetchStays(todayKey()) ])
  .then(function(res){
    var responses  = res[0] || {};
    var manual     = res[1] || {};
    var roomguests = overlayStays(resolveRoomGuests(res[2], todayKey()), res[5]);
    /* Fired here and not awaited. The sheet draws on the reads it already has
       and the notes land a moment later into the rows that want them. */
    staffNotesWhenReady(res[5]);
    /* The flags ride the same way, but wait on no role: they are not gated. */
    fetchFlags(res[5]).then(paintFlags);
    var combined   = res[4] || {};
    function groupOf(room){
      for (var gid in combined){
        var rs = (combined[gid] && combined[gid].rooms) || [];
        if (rs.indexOf(String(room)) > -1) return gid;
      }
      return null;
    }
    // ── everyone in house, plus externals dining ──────────
    var rows = [], covers = 0, roomsInHouse = 0, silent = 0;

    for (var n=1; n<=ROOMS; n++){
      var r = roomRecord(n, responses, manual, roomguests);
      var vacant = !!(r && r.status === 'vacant');
      /* Something is known about this villa tonight: a booking Mews sent, or
         an answer somebody gave at a desk. Either is a reason for a line. */
      var known = !!(hasGuestProfile(roomguests[String(n)]) || (r && r.status));
      /* A vacant villa is not a reservation, so it is left off the sheet
         entirely rather than listed as an empty labelled row. The sheet is
         carried into service and read down: every line on it should be
         somebody to look after. Vacancy is the Cleans board's business, and
         it is shown there. */
      if (vacant) continue;

      /* A villa Mews has said nothing about. Until now it printed as a labelled
         line with a dash in the dinner column, and on a seventeen villa sheet
         with nine bookings that is eight lines of nothing, which is what pushed
         this onto a second page.

         Dropped, but counted, because absence is not the same evidence as a
         vacancy. Mews only ever tells us about reservations: there is no
         positive signal for an empty villa, so a sheet willing to read silence
         as an empty house would print a short and confident and wrong list on
         the morning the sync is broken. See the note on the Cleans board and
         Unknown, 19 Aug. The guard below is what makes hiding them safe. */
      if (!known) { silent++; continue; }

      roomsInHouse++;
      rows.push({
        rec: r || { room:String(n) },
        room: n,
        status: (r && r.status) ? r.status : null  // null = no reply yet
      });
      if (r && r.status === 'in') covers += (r.pax || 1);
    }

    var externals = [];
    for (var k in responses){
      var g = responses[k];
      if (g.room) continue;
      if (manual['extcancel-'+k]) continue;
      if (g.status !== 'in') continue;
      g.phone = g.phone || k;
      externals.push({ rec:g, room:null, status:'in', key:k });
      covers += (g.pax || 1);
    }
    for (var k in manual){
      if (k.indexOf('ext-') !== 0) continue;
      if (manual[k].status !== 'in') continue;
      externals.push({ rec:manual[k], room:null, status:'in', key:k });
      covers += (manual[k].pax || 1);
    }
    externals.sort(function(a,b){ return (a.rec.name||'').localeCompare(b.rec.name||''); });
    rows = rows.concat(externals);

    /* Every villa silent, on a resort that is never empty. That is a broken
       sync far more often than it is a closed hotel, and the old sheet said so
       by accident: seventeen dashes were ugly and unmistakable. Now that the
       silent ones are hidden, the sheet would print blank and calm instead, so
       it says it out loud. The line is deliberately not styled as a warning
       pill or a colour: it is the only thing on the page, and it should read
       as a sentence. */
    var silentAll = (silent === ROOMS);
    var warn = document.getElementById('syncWarn');
    if (warn){
      warn.textContent = silentAll
        ? 'No villa has a booking tonight. That is usually the Mews sync, ' +
          'not an empty house. Check before trusting this sheet.'
        : '';
      warn.style.display = silentAll ? '' : 'none';
    }

    document.getElementById('nCovers').textContent = covers;
    document.getElementById('fCovers').textContent = covers;
    /* The date the sheet is FOR, not the day it was printed. Taken from the
       same element the screen shows so the two cannot drift. */
    document.getElementById('fDate').textContent =
      (document.getElementById('title').textContent || '').trim();

    var tb = document.getElementById('rows');

    // combined rooms sit consecutively under their lowest room number,
    // so one boxed block on the sheet = one table
    (function(){
      var roomRows = rows.filter(function(r){ return r.room; });
      var extRows  = rows.filter(function(r){ return !r.room; });
      var placed = {}, ordered = [];
      roomRows.forEach(function(r){
        var rm = String(r.room);
        if (placed[rm]) return;
        var gid = groupOf(rm);
        var members = gid ? combined[gid].rooms.map(String) : [rm];
        members.sort(function(a,b){ return Number(a)-Number(b); });
        members.forEach(function(m){
          var rr = roomRows.filter(function(x){ return String(x.room)===m; })[0];
          if (rr && !placed[m]){
            rr.grp = (gid && members.length>1)
              ? (m===members[0] ? 'first' : (m===members[members.length-1] ? 'last' : 'mid'))
              : null;
            ordered.push(rr); placed[m]=true;
          }
        });
      });
      rows = ordered.concat(extRows);
    })();

    SHEET = [];
    rows.forEach(function(row){
      var g = row.rec;
      var phone = tidyPhone(g.phone);

      // Room rows with no real name are left blank so staff can write on
      // them by hand. Externals still show their phone as a fallback.
      var name = g.name
        ? g.name
        : (row.room ? '' : (phone || ''));
      var nameCell = name + (phone && !row.room ? '<span class="sub">'+phone+'</span>' : '');

      /* The second guest, directly under the name they travel with, in the
         same small grey line the externals use for a phone. Context, not a
         second row: the sheet is read down by booking and the covers column
         already counts them. Escaped, because it is typed by a guest or at
         the desk and the cell is otherwise built by concatenation. */
      var second = row.room
        ? companionOf(PREARRIVAL_BY_VILLA[String(row.room)], g) : '';
      if (second) nameCell += '<span class="sub cmp">'+escText(second)+'</span>';

      /* The booking flags, under the name they describe: VIP, Travel agent,
         the Luxury Escapes rate. The slot is always in the markup and is
         filled in later, like the staff-note line, because the flags are
         per-booking reads that land after the sheet first draws. */
      nameCell += '<span class="fkhere" data-villa="' + (row.room || '') + '"></span>';

      var dinner, cls = '';
      var hits = (row.status === 'in') ? menuConflicts(MENU, g.diets) : [];
      if (row.status === 'in')       dinner = '<span class="yes">Yes</span>';
      else if (row.status === 'out') { dinner = '<span class="no">No</span>'; cls = ' class="row-out"'; }
      /* En dash, matching the stat row above and the house rule: no em
         dashes anywhere, in prose or on screen. */
      else                           { dinner = '<span class="unk">&ndash;</span>'; cls = ' class="row-unk"'; }

      if (hits.length) {
        cls = ' class="row-conflict"';
        nameCell = '<span class="flag">FLAG</span>' + nameCell;
      }
      if (row.status === 'in' && g.premenu) {
        nameCell = '<span class="pre">PRE-MENU</span>' + nameCell;
      }

      /* The PDF is drawn from these, not from the table: reading values back
         out of HTML would break the moment a cell gained a span.        */
      SHEET.push({
        name: name || '',
        flag: hits.length > 0,
        pre: !!(row.status === 'in' && g.premenu),
        villa: row.room ? String(row.room) : 'ext',
        dinner: row.status==='in' ? 'Yes' : row.status==='out' ? 'No' : '-',
        pax: row.status==='in' ? String(g.pax||1) : '',
        stay: stripTags(stayHTML(g.arrives, g.departs)),
        diets: (g.diets||[]).slice(),
        clashes: hits.map(function(x){ return { dish:x.dish, diet:x.diet }; }),
        nodiet: !!g.nodiet,
        note: [g.note||'', g.dnote ? 'Dietary: '+g.dnote : ''].filter(Boolean).join(' '),
        staffNote: row.room ? (STAFFNOTES[String(row.room)] || '') : ''
      });

      var gcls = row.grp ? ' g-in g-'+row.grp : '';
      cls = cls ? cls.replace('class="','class="'+gcls.trim()+' ') : (gcls ? ' class="'+gcls.trim()+'"' : '');
      tb.insertAdjacentHTML('beforeend',
        '<tr'+cls+'>'+
          '<td class="c-name">'+nameCell+'</td>'+
          '<td class="c-room">'+(row.room || '<span class="muted">ext</span>')+'</td>'+
          '<td class="c-dt"></td>'+
          '<td class="c-bt"></td>'+
          '<td class="c-din">'+dinner+'</td>'+
          '<td class="c-pax">'+(row.status==='in' ? (g.pax||1) : '')+'</td>'+
          '<td class="c-dep">'+stayHTML(g.arrives, g.departs)+'</td>'+
          '<td class="c-dc" colspan="2">'+commentBox(g, hits, row)+'</td>'+
        '</tr>');
    });

    // ── total row, aligned under the Pax column ───────────
    // combined rooms share one table; sizes give the set-up breakdown
    var tblPax = {};
    rows.filter(function(r){ return r.status === 'in'; }).forEach(function(r){
      var unit = r.room ? (groupOf(r.room) || 'room-'+r.room) : 'ext-'+r.key;
      tblPax[unit] = (tblPax[unit]||0) + (r.rec.pax||1);
    });
    var tables = Object.keys(tblPax).length;
    var sizes = {};
    for (var u in tblPax) sizes[tblPax[u]] = (sizes[tblPax[u]]||0) + 1;
    /* Plurals are spelled, not built by adding an s: "six" and "seven" would
       come out "sixs" and "sevens" is right but "sixs" is not, and the line is
       the first thing a waiter reads on the sheet. Reported from the printed
       sheet on 18 Aug. */
    var PLURAL = ['', 'ones', 'twos', 'threes', 'fours', 'fives',
                  'sixes', 'sevens', 'eights', 'nines', 'tens'];
    var SINGLE = ['', 'one', 'two', 'three', 'four', 'five',
                  'six', 'seven', 'eight', 'nine', 'ten'];
    var parts = Object.keys(sizes).map(Number).sort(function(a,b){return a-b;})
      .map(function(sz){ var n = sizes[sz];
        var w = (n > 1 ? PLURAL[sz] : SINGLE[sz]) || (sz + (n > 1 ? 's' : ''));
        return n + ' ' + w; });
    document.getElementById('nTables').textContent = tables;
    document.getElementById('tblBreak').textContent = parts.length ? parts.join(' \u00b7 ') : '\u2014';
    document.getElementById('nTablesWord').textContent = (tables === 1) ? 'table' : 'tables';
    document.getElementById('fMix').textContent =
      parts.length ? parts.join(' \u00b7 ') : '\u2014';
    document.getElementById('fTables').textContent =
      tables + ' ' + (tables === 1 ? 'table' : 'tables');

    /* After the summary is written, not before: the footer is part of what
       gets measured, and it should be measured saying what it will print. */
    padBlanks();

  });
</script>

     than printing the page, which kept the text sharp from a phone, but it
     rebuilt the sheet by hand and so carried less than the page it came from.
     A second version of a document that is missing things is worse than no
     second version: whoever picks it up cannot tell what is absent. Print
     still works, and prints the page itself. -->
