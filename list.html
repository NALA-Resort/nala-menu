<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nala — Service Sheet</title>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Helvetica, Arial, sans-serif; color:#111; background:#fff; padding:16px; }

  .bar { margin-bottom:14px; display:flex; gap:8px; }
  .btn { padding:10px 20px; background:#111; color:#fff; border:none;
         font-family:Helvetica,Arial,sans-serif; font-size:10px; letter-spacing:.15em;
         text-transform:uppercase; cursor:pointer; }
  .btn.ghost { background:#fff; color:#111; border:1px solid #111; }
  .stamp { margin-top:8px; font-size:7.5px; letter-spacing:.1em;
           text-transform:uppercase; color:#999; }

  .head { display:flex; justify-content:space-between; align-items:flex-end;
          border-bottom:2px solid #111; padding-bottom:6px; margin-bottom:9px; }
  .brand { font-size:9px; letter-spacing:.4em; text-transform:uppercase; color:#777; }
  .title { font-size:16px; font-weight:bold; margin-top:3px; }
  .counts { display:flex; gap:20px; align-items:baseline; white-space:nowrap; }
  .counts span { font-size:8px; letter-spacing:.14em; text-transform:uppercase; color:#666; }
  .counts b { font-size:17px; color:#111; margin-right:5px; letter-spacing:0; }

  .scroller { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { width:100%; min-width:760px; border-collapse:collapse; }
  th { font-size:7px; letter-spacing:.12em; text-transform:uppercase; color:#666;
       text-align:left; padding:0 5px 6px; border-bottom:1px solid #111;
       white-space:nowrap; vertical-align:bottom; }
  th.wrap { white-space:normal; line-height:1.25; text-align:center; }

  /* box the hand-written table columns */
  th.c-dt, td.c-dt { border-left:1px solid #999; }
  th.c-bt, td.c-bt { border-left:1px solid #bbb; border-right:1px solid #999; }
  td { font-size:9.5px; padding:7.5px 5px; border-bottom:1px solid #ddd; vertical-align:top; }
  tr { page-break-inside:avoid; }

  .c-name { width:17%; font-weight:bold; }
  .c-room { width:5%;  text-align:center; }
  .c-din  { width:6%;  text-align:center; }
  .c-pax  { width:4%;  text-align:center; }
  .c-diet { width:19%; }
  .c-dep  { width:10%; }
  .c-dt   { width:5%;  text-align:center; }
  .c-bt   { width:5%;  text-align:center; }
  .c-com  { width:29%; }

  .yes { color:#3F7A52; font-weight:bold; }
  .no  { color:#A8321E; }
  .unk { color:#bbb; }
  .row-out td { background:#FAF6F5; }
  .row-unk td { background:#FCFCFB; }

  .sub { display:block; font-size:8px; color:#777; font-weight:normal; margin-top:2px; }
  .allergen { color:#A8321E; font-weight:bold; }
  .checkout { color:#A8321E; font-weight:bold; }
  .muted { color:#aaa; font-weight:normal; font-style:italic; }

  /* empty write-in rows: one rule only, from the cell border */
  tr.blank td { height:26px; }


  @media print {
    .bar, .hint, .key { display:none; }
    body { padding:0; }
    .scroller { overflow:visible; }
    table { min-width:0; width:100%; }
    tr { page-break-inside:avoid; }
    thead { display:table-header-group; }
  }
</style>
</head>
<body>

<div class="bar">
  <button class="btn" onclick="window.print()">Print</button>
  <button class="btn ghost" onclick="location.reload()">Refresh</button>
</div>

<div class="head">
  <div>
    <div class="brand">Nala</div>
    <div class="title" id="title"></div>
  </div>
  <div class="counts">
    <span><b id="nTables">–</b> tables</span>
    <span><b id="nCovers">–</b> covers</span>
  </div>
</div>

<div class="scroller">
  <table>
    <thead>
      <tr>
        <th class="c-name">Name</th>
        <th class="c-room">Room</th>
        <th class="c-dt wrap">Dinner<br>table</th>
        <th class="c-bt wrap">B'fast<br>table</th>
        <th class="c-din">Dinner</th>
        <th class="c-pax">Pax</th>
        <th class="c-dep">Departs</th>
        <th class="c-diet">Dietaries</th>
        <th class="c-com">Comments</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>


<script>
var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
var ALLERGENS = ['Nut allergy','Shellfish allergy','Egg allergy'];
var ROOMS = 17;

function key(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayKey(){ return key(new Date()); }
function tomorrowKey(){ var d=new Date(); d.setDate(d.getDate()+1); return key(d); }

function ord(n){
  if (n>3 && n<21) return 'th';
  return ['th','st','nd','rd'][n%10] || 'th';
}
function label(){
  var d=new Date();
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()]+' '+d.getDate()+ord(d.getDate())+' '+m[d.getMonth()];
}
document.getElementById('title').textContent = label();

(function stamp(){
  var el = document.getElementById('stamp');
  if (!el) return;
  var n=new Date();
  var hh=n.getHours(), mm=String(n.getMinutes()).padStart(2,'0');
  var ap=hh>=12?'pm':'am'; hh=hh%12||12;
  el.textContent = 'Printed '+n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear()+' '+hh+':'+mm+ap;
})();

function tidyPhone(p){
  if (!p) return '';
  p = String(p).replace(/[^\d]/g,'');
  if (p.length === 9 && p[0] === '4') p = '0' + p;   // restore a lost leading zero
  return p;
}

function parseDep(s){
  if(!s) return null;
  s = String(s).trim();
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  var d = new Date(s);
  return isNaN(d) ? null : d;
}

function depHTML(raw){
  var d = parseDep(raw);
  if (!d) return '';
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var txt = days[d.getDay()]+' '+d.getDate()+' '+mo[d.getMonth()];
  if (key(d) === tomorrowKey()) return '<span class="checkout">'+txt+'</span>';
  return txt;
}

function dietHTML(diets){
  if(!diets||!diets.length) return '';
  return diets.map(function(d){
    return ALLERGENS.indexOf(d)>-1 ? '<span class="allergen">'+d+'</span>' : d;
  }).join(', ');
}

function api(path){ return fetch(DB+path+'.json?v='+Date.now()).then(function(r){return r.json();}); }

Promise.all([ api('/responses/'+todayKey()), api('/manual/'+todayKey()), api('/roomguests') ])
  .then(function(res){
    var responses  = res[0] || {};
    var manual     = res[1] || {};
    var roomguests = res[2] || {};

    // ── resolve each room to a single record ──────────────
    function roomRecord(n){
      var mk = 'room-'+n, m = manual[mk];
      var best = null;
      for (var k in responses){
        var g = responses[k];
        if (String(g.room) !== String(n)) continue;
        if (!best || (g.at||'') > (best.at||'')) best = g;
      }
      var known = roomguests[String(n)] || {};   // whoever opened the link from this room

      if (m && m.override) {
        // staff overrode the guest — keep the guest's own details underneath
        return Object.assign({}, known, best || {}, m, { room:String(n) });
      }
      if (best) return Object.assign({}, known, best);
      if (m)    return Object.assign({}, known, m, { room:String(n) });
      if (known.name) return Object.assign({}, known, { room:String(n), status:null });
      return null;
    }

    // ── everyone in house, plus externals dining ──────────
    var rows = [], covers = 0, roomsInHouse = 0;

    for (var n=1; n<=ROOMS; n++){
      var r = roomRecord(n);
      if (r && r.status === 'vacant') continue;   // room empty tonight
      roomsInHouse++;
      rows.push({
        rec: r || { room:String(n) },
        room: n,
        status: (r && r.status) ? r.status : null  // null = no reply yet
      });
      if (r && r.status === 'in') covers += (r.pax || 1);
    }

    var externals = [];
    for (var k in responses){
      var g = responses[k];
      if (g.room) continue;
      if (manual['extcancel-'+k]) continue;
      if (g.status !== 'in') continue;
      g.phone = g.phone || k;
      externals.push({ rec:g, room:null, status:'in' });
      covers += (g.pax || 1);
    }
    for (var k in manual){
      if (k.indexOf('ext-') !== 0) continue;
      if (manual[k].status !== 'in') continue;
      externals.push({ rec:manual[k], room:null, status:'in' });
      covers += (manual[k].pax || 1);
    }
    externals.sort(function(a,b){ return (a.rec.name||'').localeCompare(b.rec.name||''); });
    rows = rows.concat(externals);

    document.getElementById('nCovers').textContent = covers;

    var tb = document.getElementById('rows');

    rows.forEach(function(row){
      var g = row.rec;
      var phone = tidyPhone(g.phone);

      var name = g.name
        ? g.name
        : (row.room ? '<span class="muted">Room guest</span>' : (phone || '<span class="muted">Guest</span>'));
      var nameCell = name + (phone && !row.room ? '<span class="sub">'+phone+'</span>' : '');

      var dinner, cls = '';
      if (row.status === 'in')       dinner = '<span class="yes">Yes</span>';
      else if (row.status === 'out') { dinner = '<span class="no">No</span>'; cls = ' class="row-out"'; }
      else                           { dinner = '<span class="unk">—</span>';  cls = ' class="row-unk"'; }

      tb.insertAdjacentHTML('beforeend',
        '<tr'+cls+'>'+
          '<td class="c-name">'+nameCell+'</td>'+
          '<td class="c-room">'+(row.room || '<span class="muted">ext</span>')+'</td>'+
          '<td class="c-dt"></td>'+
          '<td class="c-bt"></td>'+
          '<td class="c-din">'+dinner+'</td>'+
          '<td class="c-pax">'+(row.status==='in' ? (g.pax||1) : '')+'</td>'+
          '<td>'+depHTML(g.departs)+'</td>'+
          '<td>'+dietHTML(g.diets)+'</td>'+
          '<td>'+(g.note||'')+'</td>'+
        '</tr>');
    });

    for (var i=rows.length; i<21; i++){
      tb.insertAdjacentHTML('beforeend',
        '<tr class="blank"><td></td><td></td><td class="c-dt"></td><td class="c-bt"></td>'+
        '<td></td><td></td><td></td><td></td><td></td></tr>');
    }

    var dining = rows.filter(function(r){ return r.status==='in'; }).map(function(r){ return r.rec; });
    var notDining = rows.filter(function(r){ return r.status==='out'; }).map(function(r){ return r.rec; });

    // ── total row, aligned under the Pax column ───────────
    var tables = rows.filter(function(r){ return r.status === 'in'; }).length;
    document.getElementById('nTables').textContent = tables;


  });
</script>
</body>
</html>
