<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--ui-font); color:#111; background:#fff; padding:16px 16px 0; }

  .btn { padding:10px 20px; background:#111; color:#fff; border:none;
         font-family:var(--ui-font); font-size:10px; letter-spacing:.15em;
         text-transform:uppercase; cursor:pointer; }
  .btn.ghost { background:#fff; color:#111; border:1px solid #111; }
  .stamp { margin-top:10px; font-size:7.5px; letter-spacing:.1em;
           text-transform:uppercase; color:#999; text-align:right; }

  .scroller { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { width:100%; min-width:760px; border-collapse:separate; border-spacing:0; }
  th { font-size:7px; letter-spacing:.12em; text-transform:uppercase; color:#666;
       text-align:left; padding:0 5px 6px; border-bottom:1px solid #111;
       white-space:nowrap; vertical-align:bottom; }
  th.wrap { white-space:normal; line-height:1.25; text-align:center; }

  /* box the hand-written table columns */
  th.c-dt, td.c-dt { border-left:1px solid #999; }
  th.c-bt, td.c-bt { border-left:1px solid #bbb; border-right:1px solid #999; }
  td { font-size:9.5px; padding:7.5px 5px; border-bottom:1px solid #ddd; vertical-align:top; }
  tr { page-break-inside:avoid; }

  .c-name { width:17%; font-weight:bold; }
  .c-room { width:5%;  text-align:center; }
  .c-din  { width:6%;  text-align:center; }
  .c-pax  { width:4%;  text-align:center; }
  .c-diet { width:19%; }
  .c-dep  { width:11%; white-space:nowrap; }
  .c-dt   { width:5%;  text-align:center; }
  .c-bt   { width:5%;  text-align:center; }
  .c-com  { width:29%; }

  .yes { color:#3F7A52; font-weight:bold; }
  .no  { color:#A8321E; }
  .unk { color:#bbb; }
  /* The make-up IS the instruction for whoever sets the room, so it is the
     stat; the count is its checksum and lives in the label. Anchored left and
     right so the row does not slide as the make-up changes length.          */
  .stats { justify-content:space-between; gap:18px; align-items:baseline; }
  .stat.statmix { text-align:left; }
  .stat.statmix .stat-n { font-size:15px; letter-spacing:.01em; white-space:nowrap; }
  .stats .stat:last-child { text-align:right; }
  .stats .stat:last-child .stat-n { font-size:20px; }
  .row-out td { background:#FAF6F5; }
  .row-unk td { background:#FCFCFB; }
  .row-vacant td { background:#F4F4F2; color:#B0B0AA; }

  .sub { display:block; font-size:8px; color:#777; font-weight:normal; margin-top:2px; }
  .allergen { color:#A8321E; font-weight:bold; }
  /* Dietaries and comments share one column at their combined width, so a long
     dietary list lays out horizontally instead of stacking three deep in a
     narrow column. The comment sits on a second line beneath the pills.     */
  .c-dc { width:48%; }
  .dwrap { display:flex; flex-wrap:wrap; gap:5px; align-items:baseline; }
  .dcom { font-size:9px; color:#333; margin-top:3px; }
  .dpill { display:inline-block; font-family:var(--ui-font); font-size:8.5px;
           font-weight:bold; letter-spacing:.06em; text-transform:uppercase;
           padding:2px 7px; border-radius:9px;
           background:rgba(168,50,30,.12); color:#A8321E;
           -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .dpill-al { background:#A8321E; color:#fff; }
  .checkout { color:#A8321E; font-weight:bold; }
  .row-conflict td { background:#F7E4DF; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .flag { display:inline-block; font-family:var(--ui-font); font-size:7px; font-weight:bold;
          letter-spacing:.12em; border:1.2px solid #A8321E; color:#A8321E; padding:1px 4px;
          margin-right:5px; vertical-align:1px; }
  .dnote { display:block; font-size:8px; color:#333; font-style:italic; margin-top:2px; }
  .pre { display:inline-block; font-family:var(--ui-font); font-size:7px; font-weight:bold;
         letter-spacing:.12em; border:1px solid #888; color:#555; padding:1px 4px;
         margin-right:5px; vertical-align:1px; }
  tr.g-in td:first-child { border-left:1px solid #8C8C86; }
  tr.g-in td.c-room      { border-right:1px solid #8C8C86; }
  tr.g-first td:first-child, tr.g-first td.c-room { border-top:1px solid #8C8C86; }
  tr.g-last td:first-child,  tr.g-last td.c-room  { border-bottom:1px solid #8C8C86; }
  tr.g-first td:first-child { border-top-left-radius:9px; }
  tr.g-first td.c-room      { border-top-right-radius:9px; }
  tr.g-last td:first-child  { border-bottom-left-radius:9px; }
  tr.g-last td.c-room       { border-bottom-right-radius:9px; }
  .muted { color:#aaa; font-weight:normal; font-style:italic; }

  /* empty write-in rows: one rule only, from the cell border */
  tr.blank td { height:26px; }


  /* Printed sheets repeat everything above the table on every page. A table
     header group is the only thing browsers reliably repeat, so the block is
     cloned into a thead row for paper and the on-screen original is hidden. */
  .printhead { display:none; }
  .printhead > td { border:0; padding:0 0 6px; }
  @media print {
    .printhead { display:table-row; }
    .noprintblock { display:none !important; }
  }
  @media print {
    body { padding:0; }
    .scroller { overflow:visible; }
    table { min-width:0; width:100%; }
    tr { page-break-inside:avoid; }
    thead { display:table-header-group; }
    table { border-collapse:collapse; }   /* Safari repeats headers only when collapsed */
  }
</style>
</head>

<script>
(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
  var so=document.getElementById('navSignout');
  if (so) so.onclick=function(e){ e.preventDefault();
    if (window.NALA_SIGNOUT) NALA_SIGNOUT(); else location.reload(); };

  /* Role gate, per the matrix in ROLES.md. The sheet is read and print for
     everyone who may see it at all, so there is one question here, not two. */
  window.NALA_ROLE = null;
  (function gate(){
    /* Wait for the helper too, not just firebase: a stubbed SDK calls back
       synchronously, and nala-shared.js loads at the foot of the page.
       auth() itself throws when no app has been initialised, and a partial
       SDK can arrive without onAuthStateChanged, so both are guarded: a
       throw here would take the whole page down with it.               */
    if (!window.firebase || !firebase.auth ||
        typeof loadStaff !== 'function'){ setTimeout(gate,300); return; }
    var A;
    try { A = firebase.auth(); } catch (e){ setTimeout(gate,300); return; }
    if (!A || typeof A.onAuthStateChanged !== 'function'){ setTimeout(gate,300); return; }
    A.onAuthStateChanged(function(u){
      if (!u) return;                 /* auth.js owns the signed-out state */
      loadStaff(function(recs, err){
        var role = roleOf(u);
        window.NALA_ROLE = role;
        window.NALA_NAVFILTER(role);
        showAccess(can(role,'resSheet'), err);
      });
    });
  })();


  /* The menu lists only the boards this role may open: offering a link that
     lands on "no access" is a door to nowhere. Cleans needs cleansBoard,
     the sheets need their own permission.                              */
  window.NALA_NAVFILTER = function(role){
    var need = { 'tally.html':'resBoard', 'list.html':'resSheet',
                 'cleaners.html':'cleansBoard', 'housekeeping.html':'cleansBoard' };
    var links = document.querySelectorAll('#navDrop a');
    for (var i=0;i<links.length;i++){
      if (links[i].className.indexOf('signout')>-1) continue;   /* never filtered */
      var href = (links[i].getAttribute('href')||'').split('?')[0];
      links[i].style.display = can(role, need[href]) ? '' : 'none';
    }
  };

  function showAccess(allowed, err){
    var box = document.getElementById('noAccess');
    var on  = !allowed;
    box.innerHTML = !on ? '' :
      (err ? '<div>Could not check access. This is usually the connection, '
           + 'not your login.</div>'
           + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
           : 'This login has no access to the Reservations Sheet. See the manager.');
    /* A role that cannot see this page but has a board of its own is sent
       there rather than shown a refusal. Only a login with no role at all
       gets the message, because it has nowhere to be sent.             */
    if (on && !err){
      var home = homeFor(window.NALA_ROLE);
      if (home && home !== location.pathname.split('/').pop()){
        location.replace(home); return;
      }
    }
    box.className = 'noaccess' + (on ? ' show' : '');
    ['statsRow','sheetScroller','footBar'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.style.display = on ? 'none' : '';
    });
  }
})();
</script>

<script>
// date state + header wiring from nala-shared.js
var nav = initDateNav();
var VIEW = nav.VIEW, todayKey = nav.todayKey, isToday = nav.isToday;
function tomorrowKey(){ var d=new Date(VIEW); d.setDate(d.getDate()+1); return dkey(d); }

// paper needs to say which print is current
(function stamp(){
  var n=new Date();
  var hh=n.getHours(), mm=String(n.getMinutes()).padStart(2,'0');
  var ap=hh>=12?'pm':'am'; hh=hh%12||12;
  document.getElementById('stamp').textContent =
    'Printed '+n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear()+' '+hh+':'+mm+ap;
})();

// A stay range on ONE line: "Tue 11-Fri 14". Month is omitted - we know it,
// and the ordinal is dropped so the range never wraps to a second row.
// Falls back to just the checkout if no arrival date was captured.
/* An allergy is a solid red pill, a preference a tinted one. The word
   "allergy" is dropped from the label because the fill already says it. */
function dietPills(diets){
  if (!diets || !diets.length) return '';
  return '<div class="dwrap">' + diets.map(function(x){
    var al = (typeof ALLERGENS!=='undefined' && ALLERGENS.indexOf(x)>-1) || /allerg/i.test(x);
    var label = al ? x.replace(/\s*allergy\s*/i,'') : x;
    return '<span class="dpill'+(al?' dpill-al':'')+'">'+label+'</span>';
  }).join('') + '</div>';
}

function stayHTML(arrRaw, depRaw){
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var a = parseDepDate(arrRaw), d = parseDepDate(depRaw);
  function one(x){ return days[x.getDay()]+' '+x.getDate(); }
  var out;
  if (a && d)      out = one(a)+'-'+one(d);
  else if (d)      out = '-'+one(d);
  else if (a)      out = one(a)+'-';
  else             return '';
  if (d && dkey(d) === tomorrowKey()) return '<span class="checkout">'+out+'</span>';
  return out;
}

function depHTML(raw){
  var d = parseDepDate(raw);
  if (!d) return '';
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var txt = days[d.getDay()]+' '+d.getDate()+' '+mo[d.getMonth()];
  if (dkey(d) === tomorrowKey()) return '<span class="checkout">'+txt+'</span>';
  return txt;
}

// tonight's tagged menu, for dietary conflict flags
var MENU = null;
function fetchMenu(){
  return fetch('menu.json?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(m){
      m = m || {};
      var filled = ['bread','entree','main','dessert'].every(function(k){
        return m[k] && m[k].name && m[k].name.trim() !== '';
      });
      var fresh = false;
      if (m.published) {
        var pub = parseISO(m.published);   // Safari chokes on Python's 6-digit fractions
        fresh = pub ? (dkey(pub) === todayKey()) : false;
      }
      if (filled && fresh) MENU = m;
    })
    .then(function(){
      // dish tags are written by tag.html into Firebase
      return fetch(DB + '/menutags/' + todayKey() + '.json')
        .then(function(r){ return r.json(); })
        .then(function(tags){
          if (tags && MENU) ['bread','entree','main','dessert'].forEach(function(k){
            if (MENU[k] && tags[k]) MENU[k].conflicts = tags[k];
          });
        });
    })
    .catch(function(){});
}

function api(path){ return fetch(DB+path+'.json?v='+Date.now()).then(function(r){return r.json();}); }

Promise.all([ api('/responses/'+todayKey()), api('/manual/'+todayKey()), fetchRoomGuests(todayKey()), fetchMenu(), api('/combined/'+todayKey()) ])
  .then(function(res){
    var responses  = res[0] || {};
    var manual     = res[1] || {};
    var roomguests = resolveRoomGuests(res[2], todayKey());
    var combined   = res[4] || {};
    function groupOf(room){
      for (var gid in combined){
        var rs = (combined[gid] && combined[gid].rooms) || [];
        if (rs.indexOf(String(room)) > -1) return gid;
      }
      return null;
    }
    // ── everyone in house, plus externals dining ──────────
    var rows = [], covers = 0, roomsInHouse = 0;

    for (var n=1; n<=ROOMS; n++){
      var r = roomRecord(n, responses, manual, roomguests);
      var vacant = !!(r && r.status === 'vacant');
      if (!vacant) roomsInHouse++;
      rows.push({
        rec: vacant ? { room:String(n) } : (r || { room:String(n) }),
        room: n,
        status: vacant ? 'vacant' : ((r && r.status) ? r.status : null)  // null = no reply yet
      });
      if (!vacant && r && r.status === 'in') covers += (r.pax || 1);
    }

    var externals = [];
    for (var k in responses){
      var g = responses[k];
      if (g.room) continue;
      if (manual['extcancel-'+k]) continue;
      if (g.status !== 'in') continue;
      g.phone = g.phone || k;
      externals.push({ rec:g, room:null, status:'in', key:k });
      covers += (g.pax || 1);
    }
    for (var k in manual){
      if (k.indexOf('ext-') !== 0) continue;
      if (manual[k].status !== 'in') continue;
      externals.push({ rec:manual[k], room:null, status:'in', key:k });
      covers += (manual[k].pax || 1);
    }
    externals.sort(function(a,b){ return (a.rec.name||'').localeCompare(b.rec.name||''); });
    rows = rows.concat(externals);

    document.getElementById('nCovers').textContent = covers;

    var tb = document.getElementById('rows');

    // combined rooms sit consecutively under their lowest room number,
    // so one boxed block on the sheet = one table
    (function(){
      var roomRows = rows.filter(function(r){ return r.room; });
      var extRows  = rows.filter(function(r){ return !r.room; });
      var placed = {}, ordered = [];
      roomRows.forEach(function(r){
        var rm = String(r.room);
        if (placed[rm]) return;
        var gid = groupOf(rm);
        var members = gid ? combined[gid].rooms.map(String) : [rm];
        members.sort(function(a,b){ return Number(a)-Number(b); });
        members.forEach(function(m){
          var rr = roomRows.filter(function(x){ return String(x.room)===m; })[0];
          if (rr && !placed[m]){
            rr.grp = (gid && members.length>1)
              ? (m===members[0] ? 'first' : (m===members[members.length-1] ? 'last' : 'mid'))
              : null;
            ordered.push(rr); placed[m]=true;
          }
        });
      });
      rows = ordered.concat(extRows);
    })();

    rows.forEach(function(row){
      var g = row.rec;
      var phone = tidyPhone(g.phone);

      // Room rows with no real name are left blank so staff can write on
      // them by hand. Externals still show their phone as a fallback.
      var name = g.name
        ? g.name
        : (row.room ? '' : (phone || ''));
      var nameCell = name + (phone && !row.room ? '<span class="sub">'+phone+'</span>' : '');

      var dinner, cls = '';
      var hits = (row.status === 'in') ? menuConflicts(MENU, g.diets) : [];
      if (row.status === 'in')       dinner = '<span class="yes">Yes</span>';
      else if (row.status === 'out') { dinner = '<span class="no">No</span>'; cls = ' class="row-out"'; }
      else                           { dinner = '<span class="unk">—</span>';  cls = ' class="row-unk"'; }

      if (hits.length) {
        cls = ' class="row-conflict"';
        nameCell = '<span class="flag">FLAG</span>' + nameCell;
      }
      if (row.status === 'in' && g.premenu) {
        nameCell = '<span class="pre">PRE-MENU</span>' + nameCell;
      }

      // Vacant rooms stay on the sheet, labelled and otherwise empty.
      if (row.status === 'vacant') {
        dinner = '';
        cls = ' class="row-vacant"';
        nameCell = '<span class="muted">Vacant</span>';
      }

      var gcls = row.grp ? ' g-in g-'+row.grp : '';
      cls = cls ? cls.replace('class="','class="'+gcls.trim()+' ') : (gcls ? ' class="'+gcls.trim()+'"' : '');
      tb.insertAdjacentHTML('beforeend',
        '<tr'+cls+'>'+
          '<td class="c-name">'+nameCell+'</td>'+
          '<td class="c-room">'+(row.room || '<span class="muted">ext</span>')+'</td>'+
          '<td class="c-dt"></td>'+
          '<td class="c-bt"></td>'+
          '<td class="c-din">'+dinner+'</td>'+
          '<td class="c-pax">'+(row.status==='in' ? (g.pax||1) : '')+'</td>'+
          '<td class="c-dep">'+stayHTML(g.arrives, g.departs)+'</td>'+
          '<td class="c-dc" colspan="2">'+
            (dietPills(g.diets) || (g.nodiet ? '<div class="muted">No dietaries</div>' : ''))+
            ((g.note||g.dnote) ? '<div class="dcom">'+(g.note||'')+
              (g.dnote ? '<span class="dnote">Dietary: '+g.dnote+'</span>' : '')+'</div>' : '')+
          '</td>'+
        '</tr>');
    });

    for (var i=rows.length; i<21; i++){
      tb.insertAdjacentHTML('beforeend',
        '<tr class="blank"><td></td><td></td><td class="c-dt"></td><td class="c-bt"></td>'+
        '<td></td><td></td><td></td><td></td><td></td></tr>');
    }

    // ── total row, aligned under the Pax column ───────────
    // combined rooms share one table; sizes give the set-up breakdown
    var tblPax = {};
    rows.filter(function(r){ return r.status === 'in'; }).forEach(function(r){
      var unit = r.room ? (groupOf(r.room) || 'room-'+r.room) : 'ext-'+r.key;
      tblPax[unit] = (tblPax[unit]||0) + (r.rec.pax||1);
    });
    var tables = Object.keys(tblPax).length;
    var sizes = {};
    for (var u in tblPax) sizes[tblPax[u]] = (sizes[tblPax[u]]||0) + 1;
    var parts = Object.keys(sizes).map(Number).sort(function(a,b){return a-b;})
      .map(function(sz){ var n=sizes[sz];
        var W=['','one','two','three','four','five','six','seven','eight','nine','ten'];
        var w=W[sz]||sz; return n+' '+w+(n>1?'s':''); });
    document.getElementById('nTables').textContent = tables;
    document.getElementById('tblBreak').textContent = parts.length ? parts.join(' \u00b7 ') : '\u2014';
    document.getElementById('nTablesWord').textContent = (tables === 1) ? 'table' : 'tables';


  });
</script>

<script>
/* clone the above-table block into the printed header so every page carries it */
(function(){
  function fill(){
    var slot = document.getElementById('printHead');
    if (!slot) return;
    slot.innerHTML = '';
    ['.printkick','.daterow','.stats'].join(',').split(',').forEach(function(sel){
      var el = document.querySelector(sel);
      if (!el) return;
      el.classList.add('noprintblock');
      var c = el.cloneNode(true);
      c.classList.remove('noprintblock');
      c.classList.add('printclone');
      c.querySelectorAll('[id]').forEach(function(n){ n.removeAttribute('id'); });
      var nav = c.querySelector('.navwrap'); if (nav) nav.parentNode.removeChild(nav);
      slot.appendChild(c);
    });
  }
  /* iOS Safari does not reliably fire beforeprint, so the clone is built as
     soon as the sheet has data rather than waiting for a print event. It is
     hidden on screen either way. Refilled on beforeprint where supported, in
     case the sheet changed after load.                                     */
  function fillWhenReady(n){
    var rows = document.getElementById('rows');
    if (rows && rows.children.length){ fill(); return; }
    if (n > 0) setTimeout(function(){ fillWhenReady(n-1); }, 400);
  }
  fillWhenReady(15);
  window.addEventListener('beforeprint', fill);
})();
</script>
</body>
</html>
