<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nala Villas">
<link rel="apple-touch-icon" href="nala-icon.png?v=1">
<title>Nala &middot; Pre-arrival SMS</title>
<link rel="stylesheet" href="nala-ui2.css?v=5">
<link rel="stylesheet" href="nala-ui.css?v=17">
<style>
  /* This page's OWN colours, restored 29 Aug. The first conversion
     dropped each page's :root wholesale to remove the tokens the shared
     sheet owns, and took these with them. An undefined custom property
     does not fall back, it computes to nothing: fill:var(--dine) became
     a black fork and color:var(--dine) a black stat, silently.
     --green is not in the shared sheet on purpose - it is a pale fill on
     five pages and a dark ink on two - so it lives here.               */
  :root { --green:#E4EDE2 }

  body { padding:calc(24px + env(safe-area-inset-top)) 18px 0; }
  

  .seclabel { font-size:var(--t2);
              color:var(--mid); margin:22px 0 8px; }
  .seclink  { float:right; font-size:var(--t2);
              text-transform:none; color:var(--mid); text-decoration:underline; }

  /* How far ahead the list looks. A knob, not a date browser: the page's
     question is "who is arriving soon and where is their form", and soon is
     a horizon, not a night. */
  .knob { display:flex; border:1px solid var(--rule); border-radius:8px;
          overflow:hidden; margin-bottom:12px; }
  .knob button { flex:1; padding:9px 0; font-family:var(--ui-font); font-size:var(--t2); background:none;
                 border:none; color:var(--mid); cursor:pointer; }
  .knob button.on { background:var(--ink); color:var(--cream); }

  .vrow { display:flex; align-items:center; gap:12px; width:100%;
          background:none; border:1px solid var(--rule); border-radius:8px;
          padding:11px 13px; margin-bottom:7px; text-align:left;
          font-family:var(--ui-font); color:inherit; cursor:pointer; }
  .vrow:disabled { opacity:.45; cursor:default; }
  /* The five bands, in the site's colour law (CLAUDE.md): white to send,
     AMBER opened-but-not-finished - the front desk's attention colour, not
     terracotta, because red-family paint means failure or a declined answer
     and a guest mid-form is neither - grey waiting (unknown promises
     nothing), green form completed, and cannot-send sunk in the vacant
     voice. Red text is reserved for failures: sends and deliveries. */
  .grp { font-size:var(--t1);
         color:var(--mid); margin:14px 2px 6px; }
  .vrow.b-open { background:var(--amber); border-color:var(--amberb); }
  .vrow.b-open .st { color:var(--amberink); }
  .vrow.b-sent { background:rgba(28,28,26,.045); border-color:var(--rule); }
  .vrow.b-sent .st { color:var(--mid); }
  .vrow.b-done { background:var(--resgreen-t); border-color:var(--resgreen-b); }
  .vrow.b-done .st { color:var(--resgreen); }
  .vrow.b-grey { background:transparent; border-style:dashed; opacity:.62; }
  .vrow.b-grey .tick { visibility:hidden; }
  .vrow .v { font-size:var(--t4); min-width:30px; text-align:center; }
  .vrow .mid { flex:1; min-width:0; }
  .vrow .nm { font-size:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vrow .ph { font-size:var(--t2); color:var(--mid); font-weight:normal; margin-left:7px; }
  /* The confidence mark: a tick where the country's mobile ranges are
     published and this number sits in one, a question mark where nobody can
     tell a mobile from a landline (all of +1, for a start). */
  .vrow .conf { font-size:var(--t2); margin-left:4px; }
  .vrow .conf.ok { color:var(--resgreen); }
  .vrow .conf.un { color:var(--mid); }
  /* The edit pencil. Inside the row button, so its click must not fall
     through to the tick: the handler stops the event. */
  .vrow .pen { font-size:var(--t2); color:var(--mid); margin-left:5px;
               padding:2px 4px; cursor:pointer; }
  .vrow .st { font-size:var(--t2); color:var(--mid); margin-top:2px; }
  .vrow .st .bad { color:var(--red); }
  .tick { flex:0 0 auto; width:24px; height:24px; border:1px solid var(--rule);
          border-radius:var(--pill); display:flex; align-items:center; justify-content:center;
          font-size:var(--t3); color:transparent; }
  .vrow.on { border-color:var(--greenb); }
  .vrow.on .tick { background:var(--green); border-color:var(--greenb); color:var(--ink); }
  /* Select-all wears the row dress so its tick reads like the rows' ticks,
     dashed so it does not read as a guest. */
  .selall { border-style:dashed; margin:0 0 10px; }
  .selall .nm { font-size:var(--t2); }

  select, textarea { width:100%; font-family:var(--ui-font); font-size:var(--t3);
                     color:var(--ink); background:#fff; border:1px solid var(--rule);
                     border-radius:var(--r); padding:11px 13px; }
  select { -webkit-appearance:none; appearance:none; }
  textarea { margin-top:8px; min-height:96px; resize:vertical; line-height:1.45; }
  .msgmeta { display:flex; justify-content:space-between; gap:12px;
             font-size:var(--t2); color:var(--mid); margin-top:6px; }
  .msgmeta .warn { color:var(--red); }
  .linknote { font-size:var(--t2); color:var(--mid); margin-top:4px; line-height:1.5; }

  /* .btn wears nala-ui.css's shared dress; only this page's variants live here. */
  #sendBtn { white-space:normal; line-height:1.4; }
  .btn.arm { background:var(--red); border-color:var(--red); color:#fff; }

  #errBar { font-size:var(--t2); color:var(--red); margin:10px 0; line-height:1.45; }
  .empty { font-size:var(--t2); color:var(--mid); margin:14px 2px; line-height:1.5; }
  .spacer { height:12px; }
</style>
</head>
<body class="tier-app ui2">

<div class="daterow">
  <div class="date" id="title">Pre-arrival SMS</div>
  <div class="navwrap" id="navWrap" style="display:none">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"></div>
  </div>
</div>

<div class="noaccess" id="noAccess"></div>

<div class="knob" id="knob">
  <button data-days="3">Next 3 days</button>
  <button data-days="7" class="on">Next 7 days</button>
  <button data-days="14">Next 14 days</button>
</div>

<div class="stats" id="statsRow">
  <div class="stat"><div class="stat-n" id="nSend">&ndash;</div><div class="stat-l">To send</div></div>
  <div class="stat"><div class="stat-n" id="nWait">&ndash;</div><div class="stat-l">Waiting</div></div>
  <div class="stat"><div class="stat-n" id="nOpen">&ndash;</div><div class="stat-l">Opened</div></div>
  <div class="stat"><div class="stat-n" id="nDone">&ndash;</div><div class="stat-l">Done</div></div>
</div>

<button class="vrow selall" id="selAll" style="display:none">
  <div class="mid"><div class="nm">Select all in To send</div>
    <div class="st">Ticks every guest with a sendable number who has not been
      asked. Guests already messaged are ticked one by one.</div></div>
  <div class="tick">✓</div>
</button>

<div id="board"></div>

<div class="seclabel">Template <a class="seclink" href="templates.html">Edit templates</a></div>
<select id="tmpl" aria-label="Template"></select>
<div class="seclabel">Message</div>
<textarea id="msgBox" aria-label="Message text"></textarea>
<div class="msgmeta"><span id="msgWarn"></span><span id="msgCount"></span></div>
<div class="linknote">The form link is added for each guest automatically, from
  their booking, and cannot be typed into the message.</div>

<div id="errBar"></div>
<div class="spacer"></div>

<div class="foot">
  <button class="btn solid" id="sendBtn" disabled>Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=12"></script>
<script src="nala-shared.js?v=46"></script>
<script>
var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";

/* The sender: the same Worker as Invitations, asked with kind "pre". The
   page proposes booking ids and message words; the Worker re-reads Mews'
   record, takes the phone off it, refuses past arrivals, mints the short
   token and does the sending. worker/send-invites.js. */
var INVITES_URL = 'https://nala-invites.ben-681.workers.dev';

(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
})();
function navFilter(role){ if (window.NALA_NAVFILTER) NALA_NAVFILTER(role); }

/* How far ahead. Front Desk owns the day of arrival; this page owns the
   horizon before it, so its shortest look is still days out. */
var DAYS = 7;
document.getElementById('knob').onclick = function(e){
  var b = e.target.closest('button'); if (!b) return;
  DAYS = +b.dataset.days;
  [].forEach.call(this.querySelectorAll('button'), function(x){
    x.className = x === b ? 'on' : '';
  });
  load();
};

/* ── the message box ─────────────────────────────────────────── */
/* The fallback set. The real one lives at /presmstemplates, edited on
   templates.html beside the invitations set; these serve until that node
   exists or when it cannot be read. <form> marks where the form link goes. */
var BUILTIN_TEMPLATES = [
  { id:'before',   label:'Before you arrive', order:1,
    body:'Good afternoon. Ahead of your stay with us, a few questions so everything is ready when you arrive. Nala Resort\n<form>' },
  { id:'nudge',    label:'A gentle reminder', order:2,
    body:'A reminder, when you have a moment: a few questions ahead of your stay, so everything is ready when you arrive. Nala Resort\n<form>' }
];
var TEMPLATES = BUILTIN_TEMPLATES;

var tmplSel = document.getElementById('tmpl'), msgBox = document.getElementById('msgBox');
function initTemplates(list){
  TEMPLATES = list;
  tmplSel.innerHTML = '';
  TEMPLATES.forEach(function(t){
    var o = document.createElement('option'); o.value = t.id; o.textContent = t.label;
    tmplSel.appendChild(o);
  });
  setTemplate(TEMPLATES[0] && TEMPLATES[0].id);
}
function setTemplate(id){
  var t = TEMPLATES.filter(function(t){ return t.id === id; })[0] || TEMPLATES[0];
  msgBox.value = t ? t.body : '';
  msgChanged();
}
tmplSel.onchange = function(){ setTemplate(tmplSel.value); };
initTemplates(BUILTIN_TEMPLATES);
function loadTemplates(){
  return fetch(DB + '/presmstemplates.json?v=' + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(db){
      var list = Object.keys(db || {}).map(function(k){
        var t = db[k] || {};
        return { id:k, label:String(t.label||k), body:String(t.body||''),
                 order:+t.order || 999 };
      }).filter(function(t){ return t.body; })
        .sort(function(a,b){ return a.order - b.order; });
      if (list.length) initTemplates(list);
    })
    .catch(function(){});
}

function bodyHasUrl(s){ return /(https?:\/\/|www\.)/i.test(s || ''); }
/* The token link to prearrival.html is exactly 52 characters. */
var LINK_SAMPLE = new Array(53).join('x');
function msgChanged(){
  var s = msgBox.value;
  var warn = document.getElementById('msgWarn');
  warn.textContent = bodyHasUrl(s)
    ? 'Links cannot be typed here. The form link is added automatically.' : '';
  warn.className = bodyHasUrl(s) ? 'warn' : '';
  var len = s.replace('<form>', LINK_SAMPLE).replace('<link>', LINK_SAMPLE).length;
  var segs = len <= 160 ? 1 : Math.ceil(len / 153);
  document.getElementById('msgCount').textContent =
    len + ' characters · ' + (segs === 1 ? '1 segment' : 'about ' + segs + ' segments');
  disarm();
}
msgBox.oninput = msgChanged;

/* ── state ───────────────────────────────────────────────────── */
var ROWS = {};          /* booking id -> { stay, pre, invite, state, ticked } */
var ARMED = false;

function timeOf(iso){
  var d = parseISO(iso); if (!d) return '';
  var h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
  return (h % 12 || 12) + ':' + m + (h < 12 ? 'am' : 'pm');
}
function shortDay(key){
  var d = parseISO(key + 'T00:00:00'); if (!d) return key;
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' +
         d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug',
                              'Sep','Oct','Nov','Dec'][d.getMonth()];
}
function akey(s){ return String(s || '').slice(0, 10); }
function nightsOf(stay){
  var a = parseISO(akey(stay.arrive) + 'T00:00:00'),
      b = parseISO(akey(stay.depart) + 'T00:00:00');
  if (!a || !b) return '';
  var n = Math.round((b - a) / 86400000);
  return n > 0 ? ' · ' + n + (n === 1 ? ' night' : ' nights') : '';
}

/* GUEST_ANSWERS and the counting moved to nala-shared.js on 28 Aug. This page
   and the Front Desk each held a copy and they had already drifted: the desk
   had learnt that a noDiets of false says nothing and this page had not, so a
   guest whose dietary had been cleared counted as answered here and not
   there. countGuestAnswers is the one reading now. */
function answersIn(p){ return countGuestAnswers(p); }

/* Five kinds, off the same cells the front desk reads: /bookings/<id>/
   prearrival is the form's own record and /previnvites/<id> is the send's.
   The form's stamps outrank the send's - a guest who finished the form is
   done however the message got to them. */
function stateOf(stay, pre, invite, fix){
  var when = 'arrives ' + shortDay(akey(stay.arrive));
  /* Completed means what the Front Desk means by it, because it is literally
     the same function: formState in nala-shared.js, which wants the stamp, an
     answer behind it, and the mandatory answers still standing. Two readings
     of one state is how this page came to say Form completed about villa 17
     while the desk showed it amber, holding nothing, with the link unsendable
     from here. Reading it this way also puts the records already written back
     where they belong, with nothing to run. */
  if (formState(pre, stay) === 'completed')
    return { kind:'done', tickable:false, ticked:false,
             line:'Completed ' + timeOf(pre.at) + ' · ' + when };
  /* A number fixed at the desk outranks the Mews copy: Mews cannot be
     corrected from here and its next sync would revert any edit made to the
     stay. The Worker reads the same /phonefix record before sending. */
  var raw = String((fix && fix.phone) || (stay && stay.phone) || '').trim();
  var phone = raw ? normalisePhone(raw) : null;
  var started = answersIn(pre);
  if (pre && (pre.openedAt || started))
    return { kind:'open', tickable:!!phone, ticked:false,
             line:'Opened' + (pre.openedAt ? ' ' + timeOf(pre.openedAt) : '') +
                  ' · ' + (started ? 'started, ' + started +
                  (started === 1 ? ' answer' : ' answers') : 'nothing yet') +
                  ' · ' + when };
  if (!raw)
    return { kind:'nophone', tickable:false, fixable:true, ticked:false,
             line:'No phone number on the booking · ' + when };
  if (!phone)
    return { kind:'nophone', tickable:false, fixable:true, ticked:false,
             line:'Not a mobile number · ' + when };
  if (invite && invite.status === 'sent'){
    /* "Sent" is only ClickSend accepting the message; the handset receipt
       is the real answer. A failed delivery is the sender's problem again,
       so it climbs back into To send with the carrier's words. */
    if (invite.delivery === 'failed')
      return { kind:'ready', bad:true, tickable:true, ticked:false,
               line:'Not delivered' +
                    (invite.deliveryText ? ' \u00b7 ' + invite.deliveryText : '') +
                    ' \u00b7 ' + when };
    return { kind:'sent', tickable:true, ticked:false,
             line:'Sent ' + shortDay(akey(invite.sentAt)) + ' ' +
                  timeOf(invite.sentAt) +
                  (invite.delivery === 'delivered' ? ' \u00b7 delivered'
                   : invite.providerId ? ' \u00b7 delivery unconfirmed' : '') +
                  ' \u00b7 ' + when };
  }
  if (invite && invite.status)
    return { kind:'ready', tickable:true, ticked:false, bad:true,
             line:'Send failed ' + timeOf(invite.sentAt) +
                  (invite.error ? ' · ' + invite.error : '') + ' · ' + when };
  return { kind:'ready', tickable:true, ticked:false,
           line:'Not asked · ' + when + nightsOf(stay) };
}

/* The five bands: work first, done sinks. Opened-but-not-finished is the
   follow-up work this page exists for, so it sits directly under To send. */
var BANDS = [
  { kind:'ready',   title:'To send' },
  { kind:'open',    title:'Opened, not finished' },
  { kind:'sent',    title:'Waiting on the form' },
  { kind:'done',    title:'Form completed' },
  { kind:'nophone', title:'Cannot send' }
];
var BAND_CLASS = { open:' b-open', sent:' b-sent', done:' b-done', nophone:' b-grey' };

function render(list){
  var board = document.getElementById('board');
  board.innerHTML = '';
  ROWS = {};
  var rows = { ready:[], open:[], sent:[], done:[], nophone:[] };
  list.forEach(function(it){
    var st = stateOf(it.stay, it.pre, it.invite, it.fix);
    ROWS[it.id] = { stay: it.stay, state: st, ticked: st.ticked };
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'vrow' + (st.ticked ? ' on' : '') + (BAND_CLASS[st.kind] || '');
    b.dataset.booking = it.id;
    b.dataset.villa = it.villa;
    b.dataset.state = st.kind;
    /* An unsendable row is not dead: tapping it fixes the number. */
    b.disabled = !st.tickable && !st.fixable;
    b.setAttribute('aria-pressed', st.ticked ? 'true' : 'false');
    b.innerHTML = '<div class="v">' + it.villa + '</div>' +
      '<div class="mid"><div class="nm trimrow">'+
        '<span class="trim"></span></div><div class="st"></div></div>' +
      '<div class="tick">✓</div>';
    var nm   = b.querySelector('.nm .trim');   /* the name, trims */
    var nmln = b.querySelector('.nm');         /* the line, never trims */
    nm.textContent = ((it.stay.first || '') + ' ' + (it.stay.last || '')).trim() || 'Guest';
    /* The number beside the name, grey and small, with the pencil that edits
       it. Every row carries both: a valid number can still be a WRONG one,
       and the fix outranks Mews either way. Built by the shared helper the
       Front Desk row uses too, so the two screens cannot drift apart. The
       pencil is left off a disabled row: a completed form needs no number
       and a dead pencil reads as a broken one. */
    var rawPh = String((it.fix && it.fix.phone) || it.stay.phone || '').trim();
    nmln.insertAdjacentHTML('beforeend',
      phoneBadgeHTML(rawPh, !!(st.tickable || st.fixable)));
    var pen = nmln.querySelector('.pen');
    if (pen) pen.onclick = function(e){ e.stopPropagation(); fixNumber(it); };
    var line = b.querySelector('.st');
    if (st.bad){ var s = document.createElement('span'); s.className = 'bad';
                 s.textContent = st.line; line.appendChild(s); }
    else line.textContent = st.line;
    /* One party holding more than one villa, in the Front Desk's words from
       the Front Desk's reader. Two bookings under one groupId are two rows
       here and always will be - each villa has its own link and its own
       answers - but until 28 Aug nothing said they were one party, so the
       same handset could be sent two different forms by somebody who thought
       they were texting two guests. Appended rather than built into the line
       so a failure keeps its red on the failure alone. */
    var mates = groupMatesText(it, list);
    if (mates) line.appendChild(document.createTextNode(' \u00b7 ' + mates));
    b.onclick = function(){
      if (st.fixable){ fixNumber(it); return; }
      ROWS[it.id].ticked = !ROWS[it.id].ticked;
      b.classList.toggle('on', ROWS[it.id].ticked);
      b.setAttribute('aria-pressed', ROWS[it.id].ticked ? 'true' : 'false');
      recount();
    };
    ROWS[it.id].el = b;
    rows[st.kind].push(b);
  });
  BANDS.forEach(function(band){
    if (!rows[band.kind].length) return;
    var h = document.createElement('div');
    h.className = 'grp';
    h.textContent = band.title + ' · ' + rows[band.kind].length;
    board.appendChild(h);
    rows[band.kind].forEach(function(b){ board.appendChild(b); });
  });
  if (!list.length){
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'No arrivals in the next ' + DAYS + ' days.';
    board.appendChild(e);
  }
  recount();
}

/* The number editor lives in nala-shared.js now, because the Front Desk
   grew the same pencil: see editPhoneNumber for the prompt, the refusal and
   the /phonefix write. This page's part is only where the words land and
   what reloads after a save. */
function fixNumber(it){
  var err = document.getElementById('errBar');
  editPhoneNumber({
    id: it.id,
    name: ((it.stay.first || '') + ' ' + (it.stay.last || '')).trim(),
    current: (it.fix && it.fix.phone) || it.stay.phone || '',
    was: it.stay.phone || ''
  }, function(msg){
    err.textContent = msg || '';
    if (!msg) load();
  });
}

function selected(){
  return Object.keys(ROWS).filter(function(id){ return ROWS[id].ticked; });
}

/* Select all, scoped to To send on purpose: every guest it ticks has a
   sendable number and has never been asked, so the bulk action cannot
   double-message anyone. A resend stays a deliberate single tick. */
function readyRows(){
  return Object.keys(ROWS).filter(function(id){
    return ROWS[id].state.kind === 'ready' && ROWS[id].state.tickable;
  });
}
document.getElementById('selAll').onclick = function(){
  var ids = readyRows();
  var allOn = ids.length && ids.every(function(id){ return ROWS[id].ticked; });
  ids.forEach(function(id){
    ROWS[id].ticked = !allOn;
    var el = ROWS[id].el;
    if (el){ el.classList.toggle('on', !allOn);
             el.setAttribute('aria-pressed', !allOn ? 'true' : 'false'); }
  });
  recount();
};
function disarm(){
  if (!ARMED) return;
  ARMED = false;
  recount();
}
function recount(){
  var ids = Object.keys(ROWS), sel = selected();
  var n = function(k){ return ids.filter(function(id){ return ROWS[id].state.kind === k; }).length; };
  document.getElementById('nSend').textContent = sel.length;
  document.getElementById('nWait').textContent = n('sent');
  document.getElementById('nOpen').textContent = n('open');
  document.getElementById('nDone').textContent = n('done');

  var again = sel.filter(function(id){ return ROWS[id].state.kind !== 'ready'; }).length;
  var sa = document.getElementById('selAll');
  var ready = readyRows();
  sa.style.display = ready.length ? '' : 'none';
  sa.classList.toggle('on',
    !!ready.length && ready.every(function(id){ return ROWS[id].ticked; }));
  var btn = document.getElementById('sendBtn');
  var label = 'Send to ' + sel.length + ' guest' + (sel.length === 1 ? '' : 's') +
              (again ? ', ' + again + ' of them again' : '');
  if (ARMED) label = 'Please confirm · ' + label.charAt(0).toLowerCase() + label.slice(1);
  btn.textContent = sel.length ? label : 'Send';
  btn.className = 'btn solid' + (ARMED ? ' arm' : '');
  btn.disabled = !sel.length || !window.__idToken;
}

/* ── sending ─────────────────────────────────────────────────── */
document.getElementById('sendBtn').onclick = function(){
  var sel = selected();
  if (!sel.length) return;
  var body = msgBox.value;
  var err = document.getElementById('errBar');
  if (bodyHasUrl(body)){
    err.textContent = 'The message contains a link. Take it out: the form ' +
      'link is added automatically for each guest.';
    return;
  }
  err.textContent = '';
  /* EVERY send takes a second press here, not only resends: this page can
     address a whole fortnight of guests at once, and the red Please confirm
     is what stands between a stray tap and forty messages. */
  if (!ARMED){ ARMED = true; recount(); return; }
  ARMED = false;

  var btn = this;
  btn.disabled = true; btn.textContent = 'Sending…';
  fetch(INVITES_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ idToken: window.__idToken, kind: 'pre',
                           bookings: sel, template: tmplSel.value, body: body })
  })
  .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
  .then(function(res){
    if (!res.ok || !res.j || !res.j.results)
      throw new Error((res.j && res.j.error) || 'the sender did not answer');
    var failed = Object.keys(res.j.results).filter(function(id){
      return res.j.results[id].status !== 'sent';
    }).map(function(id){ return ROWS[id] ? ROWS[id].stay : null; })
      .filter(Boolean)
      .map(function(s){ return ((s.first || '') + ' ' + (s.last || '')).trim() || 'a guest'; });
    if (failed.length)
      err.textContent = 'Did not send to ' + failed.join(', ') +
        '. The reason is on each row.';
    return load();
  })
  .catch(function(e){
    err.textContent = 'Nothing was sent: ' + (e && e.message ? e.message : 'unknown fault') + '.';
  })
  .then(function(){ recount(); });
};

/* ── loading ─────────────────────────────────────────────────── */
/* Arrivals in the window: /stays holds every night mews-sync knows about,
   so a guest arriving on d is the stay at /stays/<d> whose own arrive IS d.
   Then, per booking, the same two records the front desk reads: the form's
   own answers and the send's record. */
function load(){
  var days = [];
  for (var i = 0; i < DAYS; i++){
    var d = new Date(); d.setDate(d.getDate() + i);
    days.push(dkey(d));
  }
  return Promise.all([
    Promise.all(days.map(function(d){
      return fetch(DB + '/stays/' + d + '.json?v=' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
        .then(function(day){ return { d: d, day: day || {} }; });
    })),
    loadTemplates()
  ]).then(function(res){
    var found = [];
    var seen = {};
    res[0].forEach(function(x){
      Object.keys(x.day).sort(function(a, b){ return (+a) - (+b); }).forEach(function(v){
        var stay = x.day[v];
        if (!stay || typeof stay !== 'object' || !stay.id) return;
        if (akey(stay.arrive) !== x.d) return;   /* in house, not arriving */
        if (seen[stay.id]) return;               /* a move lists a booking twice */
        seen[stay.id] = true;
        found.push({ id: stay.id, villa: v, stay: stay });
      });
    });
    return Promise.all(found.map(function(it){
      return Promise.all([
        fetch(DB + '/bookings/' + it.id + '/prearrival.json?v=' + Date.now())
          .then(function(r){ return r.ok ? r.json() : null; })
          .catch(function(){ return null; }),
        fetch(DB + '/previnvites/' + it.id + '.json?v=' + Date.now())
          .then(function(r){ return r.ok ? r.json() : null; })
          .catch(function(){ return null; }),
        fetch(DB + '/phonefix/' + it.id + '.json?v=' + Date.now())
          .then(function(r){ return r.ok ? r.json() : null; })
          .catch(function(){ return null; })
      ]).then(function(rec){
        it.pre = rec[0]; it.invite = rec[1]; it.fix = rec[2];
        return it;
      });
    }));
  }).then(function(list){
    /* Soonest arrival first, villa order within a day: the top of the list
       is the guest reception will meet first. */
    list.sort(function(a, b){
      var d = akey(a.stay.arrive).localeCompare(akey(b.stay.arrive));
      return d !== 0 ? d : (+a.villa) - (+b.villa);
    });
    render(list);
    checkDelivery(list);
  });
}

/* Once per visit, ask the Worker to fetch handset receipts for anything
   sent but unconfirmed; if a verdict landed, reload so the rows say so. */
var CHECKED_DELIVERY = false;
function checkDelivery(list){
  if (CHECKED_DELIVERY || !window.__idToken) return;
  var pending = list.filter(function(it){
    var r = it.invite;
    return r && r.status === 'sent' && r.providerId &&
           r.delivery !== 'delivered' && r.delivery !== 'failed';
  }).map(function(it){ return it.id; });
  if (!pending.length) return;
  CHECKED_DELIVERY = true;
  fetch(INVITES_URL, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ idToken: window.__idToken, kind:'delivery',
                           pres: pending }) })
  .then(function(r){ return r.json(); })
  .then(function(j){ if (j && j.changed) return load(); })
  .catch(function(){});
}

function showAccess(allowed, e){
  var box = document.getElementById('noAccess');
  var on = !allowed;
  box.innerHTML = !on ? '' :
    (e ? '<div>Could not check access. This is usually the connection, '
       + 'not your login.</div>'
       + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
       : 'This login has no access to Pre-arrival SMS. See the manager.');
  if (on && !e){
    var home = homeFor(window.NALA_ROLE);
    if (home && home !== location.pathname.split('/').pop()){
      location.replace(home); return;
    }
  }
  box.className = 'noaccess' + (on ? ' show' : '');
  ['knob','statsRow','selAll','board','sendBtn','tmpl','msgBox'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.style.display = on ? 'none' : '';
  });
  if (!on) load();
}

window.NALA_ROLE = null;
(function gate(){
  if (!window.firebase || !firebase.auth || typeof loadStaff !== 'function')
    return setTimeout(gate, 40);
  var A; try { A = firebase.auth(); } catch(e){ return setTimeout(gate, 40); }
  if (!A || !A.onAuthStateChanged) return setTimeout(gate, 40);
  A.onAuthStateChanged(function(u){
    if (!u) return;                 /* auth.js owns the signed-out state */
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role;
      window.NALA_USER = u;
      document.getElementById('navWrap').style.display = 'block';
      navFilter(role);
      /* The same permission as Invitations and the front desk. */
      showAccess(can(role, 'editBookings'), e);
    });
  });
})();
</script>
