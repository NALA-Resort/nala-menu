<!doctype html>
<html>
<head>
  <meta charset=utf-8>
  <meta name=viewport content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <script src=nala-shared.js></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body { font-family:var(--ui-font); font-size:var(--t2); color:var(--ink);
           background:var(--ground); }
    .head { display:flex; justify-content:space-between; align-items:center;
            padding:12px var(--s4); border-bottom:1px solid var(--rule);
            position:sticky; top:0; background:var(--ground); z-index:100; }
    .head h1 { font-size:var(--t4); font-weight:600; }
    .navbtn { width:var(--ctl); height:var(--ctl); border:0; background:var(--card);
              border-radius:var(--r); display:inline-flex; align-items:center;
              justify-content:center; cursor:pointer; font-size:28px; line-height:1; }
    .navbtn:active { opacity:.7; }
    #board { padding:var(--s4); }
    .therm { position:relative; height:400px; background:var(--rule);
             border-radius:var(--r); overflow:hidden; margin-bottom:var(--s4); }
    .therm-fill { position:absolute; top:0; left:0; right:0;
                  background:var(--law-amber-b); }
    .therm-pip { position:absolute; left:50%; transform:translateX(-50%);
                 width:24px; height:24px; background:var(--ink);
                 border-radius:50%; border:2px solid var(--ground);
                 z-index:10; }
    .line-head { text-align:center; padding:12px 0; font-size:var(--t3);
                 font-weight:600; color:var(--ink); margin-bottom:var(--s3); }
    .line-note { text-align:center; color:var(--mid); font-size:var(--t2);
                 margin-bottom:var(--s4); }
    .node { margin-bottom:var(--s5); }
    .node.info { }
    .card { background:transparent; border-radius:var(--r); padding:var(--s3); }
    .top { display:flex; justify-content:space-between; align-items:center;
           margin-bottom:var(--s3); }
    button.cn { background:transparent; border:none; color:var(--ink);
                font-weight:600; cursor:pointer; font-family:var(--ui-font);
                font-size:var(--t3); padding:0; text-align:left; }
    button.cn:active { opacity:.7; }
    .tag { font-size:var(--t1); color:var(--mid); font-weight:600;
           text-transform:uppercase; letter-spacing:0.5px; }
    .tag.paper { color:var(--law-terra); }
    .cs { font-size:var(--t2); color:var(--mid); margin-bottom:var(--s2); }
    .chips { display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s3); }
    .chip { display:inline-flex; align-items:center; gap:4px;
            padding:4px 8px; border-radius:16px; font-size:var(--t1);
            font-weight:600; }
    .chip.green { background:var(--law-green-t); color:var(--law-green-b); }
    .chip.amber { background:var(--law-amber-b); color:#fff; }
    .chip.terra { background:var(--law-terra); color:#fff; }
    .chip.grey { background:var(--rule); color:var(--mid); }
    .acts { display:flex; gap:var(--s2); flex-wrap:wrap; }
    button.act { padding:8px 12px; border:1px solid var(--rule);
                 border-radius:var(--r); background:transparent;
                 font-family:var(--ui-font); font-size:var(--t2);
                 cursor:pointer; color:var(--mid); }
    button.act:active { background:var(--card); }
    button.act.go { background:var(--law-green); color:#fff; border-color:var(--law-green-b); }
    .key { display:flex; gap:var(--s3); justify-content:center; margin-top:var(--s5);
           font-size:var(--t2); color:var(--mid); flex-wrap:wrap; }
    .key-item { display:flex; align-items:center; gap:6px; }
    .key-box { width:9px; height:9px; border:1px solid currentColor;
              border-radius:1px; }
    .key-box.fill { background:currentColor; }
  </style>
</head>
<body>
  <div class=head>
    <h1>Dashboard</h1>
    <button class=navbtn onclick="location.reload()">⟲</button>
  </div>
  <div id=board></div>
  <script>
    var T = null, LOADED = false, DATA = {};
    var today = nav.todayKey();

    function hhmm(mins) {
      var h = Math.floor(mins / 60), m = mins % 60;
      return h.toString().padStart(2,'0') + ':' + m.toString().padStart(2,'0');
    }

    function gap(mins) {
      var h = Math.floor(mins / 60), m = mins % 60;
      return h + 'h ' + m + 'm';
    }

    function formStateFor(stay, booking) {
      var pre = (booking && booking.prearrival) || {};
      return formState(pre, stay);
    }

    function load() {
      if (!A) return setTimeout(load, 50);
      if (!A.currentUser) return;
      
      Promise.all([
        fetch(DB + '/menu/published.json?v=' + Date.now()).then(r => r.json()).catch(() => null),
        fetch(DB + '/menuhistory/' + today + '.json?v=' + Date.now()).then(r => r.json()).catch(() => null),
        fetch(DB + '/previnvites.json?v=' + Date.now()).then(r => r.json()).catch(() => null),
        fetch(DB + '/dinner/' + today + '.json?v=' + Date.now()).then(r => r.json()).catch(() => null),
        fetch(DB + '/bookings.json?v=' + Date.now()).then(r => r.json()).catch(() => null),
        fetch(DB + '/stays/' + today + '.json?v=' + Date.now()).then(r => r.json()).catch(() => null),
      ]).then(function(results) {
        DATA.menu = results[0] || {};
        DATA.menuHistory = results[1] || {};
        DATA.invites = results[2] || {};
        DATA.dinner = results[3] || {};
        DATA.bookings = results[4] || {};
        DATA.stays = results[5] || {};
        LOADED = true;
        draw();
      }).catch(function(e) {
        console.error('Load error:', e);
        setTimeout(load, 2000);
      });
    }

    function draw() {
      if (!LOADED) return;
      T = T || Math.floor(Date.now() / 60000) * 60;
      var t = T;
      var stays = DATA.stays || {};
      var bookings = DATA.bookings || {};
      var dinner = DATA.dinner || {};
      var invites = DATA.invites || {};
      var menuHistory = DATA.menuHistory || {};

      var L = [];
      var stayIds = Object.keys(stays);
      var N = stayIds.length;

      // Pre-arrival forms
      L.push({
        k: 'forms',
        lab: 'Pre-arrival forms',
        owner: 'desk',
        units: stayIds.map(function(v) {
          var stay = stays[v];
          var booking = bookings[stay.id];
          var st = formStateFor(stay, booking);
          return { id: v, tone: st === 'completed' ? 'green' : (st === 'incomplete' ? 'amber' : 'grey') };
        }),
        note: 'form state',
        nav: 'front-desk.html'
      });

      // Menu published
      var mpub = menuHistory.published || '';
      L.push({
        k: 'menu',
        lab: 'Tonight\'s menu',
        owner: 'chef',
        units: mpub ? [{id: 'm', tone: 'green'}] : [{id: 'm', tone: 'grey'}],
        note: mpub ? 'published ' + mpub.split('T')[1] : 'not yet published',
        nav: 'publish.html'
      });

      // Invitations sent
      var invSent = 0, invAt = '';
      Object.keys(invites).forEach(function(id) {
        var inv = invites[id];
        if (inv && inv.status === 'sent') {
          invSent++;
          if (!invAt || inv.sentAt > invAt) invAt = inv.sentAt;
        }
      });
      L.push({
        k: 'invites',
        lab: 'Dinner invitations',
        owner: 'desk',
        units: invSent > 0 ? [{id: 'i', tone: 'green'}] : [{id: 'i', tone: 'grey'}],
        note: invSent > 0 ? 'sent ' + invAt.split('T')[1] : 'not sent',
        nav: 'invitations.html'
      });

      // Dinner replies
      var replied = 0, lastReplyTime = '';
      Object.keys(dinner).forEach(function(v) {
        var r = dinner[v];
        if (r && r.status) {
          replied++;
          if (r.at && (!lastReplyTime || r.at > lastReplyTime)) lastReplyTime = r.at;
        }
      });
      L.push({
        k: 'replies',
        lab: 'Dinner replies',
        owner: 'guests',
        units: replied > 0 ? [{id: 'r', tone: 'green'}] : [{id: 'r', tone: 'grey'}],
        note: replied + ' replies' + (lastReplyTime ? ' at ' + lastReplyTime.split('T')[1] : ''),
        nav: 'tally.html'
      });

      // Arrival sheets (same as forms)
      L.push({
        k: 'sheets',
        lab: 'Arrival sheets',
        owner: 'paper',
        units: stayIds.map(function(v) {
          var stay = stays[v];
          var booking = bookings[stay.id];
          var st = formStateFor(stay, booking);
          return { id: v, tone: st === 'completed' ? 'green' : (st === 'incomplete' ? 'amber' : 'grey') };
        }),
        note: 'ready to print',
        nav: 'registration.html?v=' + today,
        print: 'sheets'
      });

      // FOH sheet
      L.push({
        k: 'foh',
        lab: 'FOH sheet',
        owner: 'paper',
        units: [{id: 'foh', tone: 'green'}],
        note: 'ready to print',
        nav: 'list.html?v=' + today,
        print: 'foh'
      });

      // Menus
      var covers = 0;
      Object.keys(dinner).forEach(function(v) {
        var r = dinner[v];
        if (r && (r.status === 'in' || r.status === 'guest')) {
          covers += (r.pax || 0);
        }
      });
      var pages = covers > 0 ? Math.ceil(covers / 2) + 1 : 1;
      L.push({
        k: 'menus',
        lab: 'Menus',
        owner: 'paper',
        units: [{id: 'menus', tone: 'green'}],
        note: pages + ' pages (' + covers + ' covers)',
        nav: 'menu-print.html?v=' + today + '&qty=' + pages,
        print: 'menus'
      });

      // Arrivals (info only)
      var arrived = 0;
      stayIds.forEach(function(v) {
        var stay = stays[v];
        var booking = bookings[stay.id] || {};
        var pre = booking.prearrival || {};
        if (pre.checkedInAt) arrived++;
      });
      L.push({
        k: 'arrivals',
        lab: 'Arrivals',
        owner: 'guests',
        units: stayIds.map(function(v) {
          var stay = stays[v];
          var booking = bookings[stay.id] || {};
          var pre = booking.prearrival || {};
          return { id: v, tone: pre.checkedInAt ? 'green' : 'grey' };
        }),
        note: arrived === N ? 'all ' + N + ' in' : arrived + ' in, ' + (N - arrived) + ' to come',
        info: true
      });

      // Render
      var html = '<div class=line-head>' +
                 (t < 840 ? gap(840 - t) + ' <span style="color:var(--mid);">to doors</span>'
                           : hhmm(t) + ' <span style="color:var(--mid);">doors open</span>') +
                 '</div>';
      html += '<div class=therm>' +
              '<div class=therm-fill style="height:' + ((t - 480) / 600 * 100) + '%"></div>' +
              '<div class=therm-pip style="top:' + ((t - 480) / 600 * 100) + '%"></div>' +
              '</div>';

      var trackOpen = true;
      L.forEach(function(d) {
        if (trackOpen && d.info) {
          trackOpen = false;
        }
        
        var btnHtml = '';
        if (can('print') && d.nav) {
          btnHtml = '<button class=cn data-nav="' + d.nav + '">' + d.lab + '</button>';
        } else {
          btnHtml = d.lab;
        }

        html += '<div class=node>';
        html += '<div class=card>';
        html += '<div class=top>' + btnHtml + '<span class="tag' + (d.owner === 'paper' ? ' paper' : '') + '">' + d.owner + '</span></div>';
        html += '<div class=cs>' + d.note + '</div>';
        html += '<div class=chips>';
        d.units.forEach(function(u) {
          var tone = u.tone === 'green' ? 'green' : (u.tone === 'amber' ? 'amber' : (u.tone === 'terra' ? 'terra' : 'grey'));
          html += '<span class="chip ' + tone + '">' + u.id + '</span>';
        });
        html += '</div>';
        if (can('print') && d.print) {
          html += '<div class=acts>';
          html += '<button class="act go" data-print="' + d.print + '">Print</button>';
          html += '<button class=act data-mark="' + d.print + '">Mark done</button>';
          html += '</div>';
        }
        html += '</div>';
        html += '</div>';
      });

      html += '<div class=key>' +
              '<div class=key-item><div class=key-box style="background:var(--law-green);"></div>done</div>' +
              '<div class=key-item><div class=key-box style="background:var(--law-amber-b);"></div>ready</div>' +
              '<div class=key-item><div class=key-box style="background:var(--law-terra);"></div>declined</div>' +
              '<div class=key-item><div class=key-box style="border-color:var(--mid);"></div>pending</div>' +
              '</div>';

      var board = document.getElementById('board');
      board.innerHTML = html;

      // Attach event listeners
      board.querySelectorAll('[data-nav]').forEach(function(btn) {
        btn.onclick = function(e) {
          e.preventDefault();
          var href = this.getAttribute('data-nav');
          navAsk(href);
        };
      });

      board.querySelectorAll('[data-print]').forEach(function(btn) {
        btn.onclick = function(e) {
          e.preventDefault();
          var card = this.getAttribute('data-print');
          if (card === 'sheets') window.open('registration.html?v=' + today);
          else if (card === 'foh') window.open('list.html?v=' + today);
          else if (card === 'menus') window.open('menu-print.html?v=' + today + '&qty=' + pages);
          tickDone(card);
        };
      });

      board.querySelectorAll('[data-mark]').forEach(function(btn) {
        btn.onclick = function(e) {
          e.preventDefault();
          var card = this.getAttribute('data-mark');
          tickDone(card);
        };
      });
    }

    function navAsk(href) {
      if (!confirm('Open ' + href.split('?')[0].replace('.html', '') + '?')) return;
      nav.to(href);
    }

    function tickDone(card) {
      if (!A || !A.currentUser) return alert('Not authenticated');
      var user = A.currentUser;
      var name = user.displayName || user.email;
      var ref = DB + '/dayboard/' + today + '/' + card + '.json';
      var now = new Date().toISOString().split('T')[1].substring(0, 5);
      
      fetch(ref, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ t: Math.floor(Date.now() / 60000), who: name })
      }).then(function() {
        alert(card + ' marked done at ' + now);
        load();
      }).catch(function(e) {
        alert('Error: ' + e.message);
      });
    }

    // Auth gate
    if (A && A.onAuthStateChanged) {
      A.onAuthStateChanged(function(u) {
        if (!u) return nav.to('/');
        load();
      });
    } else {
      setTimeout(function() {
        if (A && A.onAuthStateChanged) {
          A.onAuthStateChanged(function(u) {
            if (!u) return nav.to('/');
            load();
          });
        }
      }, 50);
    }

    // Redraw every minute
    setInterval(function() {
      T = Math.floor(Date.now() / 60000) * 60;
      draw();
    }, 60000);
  </script>
</body>
</html>
