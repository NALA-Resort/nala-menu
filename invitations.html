<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nala Villas">
<link rel="apple-touch-icon" href="nala-icon.png?v=1">
<title>Nala &middot; Invitations</title>
<link rel="stylesheet" href="nala-ui2.css?v=19">
<link rel="stylesheet" href="nala-ui.css?v=18">
<style>
  /* This page's OWN colours, restored 29 Aug. The first conversion
     dropped each page's :root wholesale to remove the tokens the shared
     sheet owns, and took these with them. An undefined custom property
     does not fall back, it computes to nothing: fill:var(--dine) became
     a black fork and color:var(--dine) a black stat, silently.
     --green is not in the shared sheet on purpose - it is a pale fill on
     five pages and a dark ink on two - so it lives here.               */
  :root { --green:#E4EDE2 }

  /* The bottom padding is the fixed footer's room below, two lines of Send
     label included, so the last line scrolls clear of it. */
  body { padding:calc(24px + env(safe-area-inset-top)) 18px
                 calc(100px + env(safe-area-inset-bottom)); }
  /* Fixed, not the shared sticky, and a deliberate exception to nala-ui.css.
     The owner's report of 26 Sep: once Arrivals was opened, the sticky
     footer on his iPhone stopped short and rode up the screen with the
     scroll, rows showing beneath it - the list had grown after the page
     first drew, as All grew Reservations' list on 24 Sep. Chromium never
     shows it, so no suite can. Fixed is what the app's other bottom bars
     use (Publish, Menu Dietaries, the Reservations select bar), and it
     does not depend on how tall the page is. Centred on the page's own
     column, so the button spans the list's width on a desktop too. */
  body > .foot { position:fixed; left:0; right:0; bottom:0; margin:0 auto;
                 max-width:calc(var(--appw) + 2*var(--appgut));
                 padding-left:var(--appgut); padding-right:var(--appgut); }


  .seclabel { font-size:var(--t2);
              color:var(--mid); margin:22px 0 8px; }
  .seclink  { float:right; font-size:var(--t2);
              text-transform:none; color:var(--mid); text-decoration:underline; }

  /* Why this page refuses to send. A tinted pill is status, never tappable.
     One colour per meaning, the Reservations pill's own (the owner, 27 Sep):
     published is the colour law's green pill, not published is amber - chase
     this, the chef has not published yet - and only a read that failed is
     red. Not published was red until 27 Sep, and published wore its border
     colour as its ink. */
  .menupill { display:inline-block; padding:6px 12px; border-radius:var(--r);
              font-size:var(--t2); border:1px solid transparent; }
  .menupill.none { background:var(--law-amber); color:var(--law-amber-ink);
                   border-color:var(--law-amber-b); }
  .menupill.ok   { background:var(--law-save-bg); color:var(--law-green);
                   border-color:var(--law-save-bdr); }
  .menupill.fail { background:rgba(28,28,26,.045); color:var(--law-red);
                   border-color:var(--law-red); }
  .menuwhy { font-size:var(--t2); color:var(--mid); margin-top:6px; line-height:1.45; }
  #menuGate { display:none; margin:14px 0 2px; }
  #menuGate.show { display:block; }

  /* One villa. The whole row is the control surface, the same documented
     exception as the villa tile grid: the row itself is the toggle. */
  .vrow { display:flex; align-items:center; gap:12px; width:100%;
          background:none; border:1px solid var(--rule); border-radius:8px;
          padding:11px 13px; margin-bottom:7px; text-align:left;
          font-family:var(--ui-font); color:inherit; cursor:pointer; }
  .vrow:disabled { opacity:.45; cursor:default; }
  /* The four bands, INVITATIONS-STATUS.md. Work first, done sinks: white to
     send, grey waiting (unknown promises nothing, so it is not green), the
     Reservations tints once answered, and cannot-send sunk in the vacant
     voice. Band classes only tint; the row itself is untouched. */
  .grp { font-size:var(--t1);
         color:var(--mid); margin:14px 2px 6px; }
  .vrow.b-sent { background:rgba(28,28,26,.045); border-color:var(--rule); }
  .vrow.b-sent .st { color:var(--mid); }
  .vrow.b-din { background:var(--resgreen-t); border-color:var(--resgreen-b); }
  .vrow.b-din .st { color:var(--resgreen); }
  .vrow.b-out { background:var(--resterra-t); border-color:var(--resterra-b); }
  .vrow.b-out .st { color:var(--resterra); }
  .vrow.b-grey { background:transparent; border-style:dashed; opacity:.62; }
  .vrow.b-grey .tick { visibility:hidden; }
  .vrow .v { font-size:var(--t4); min-width:30px; text-align:center; }
  .vrow .mid { flex:1; min-width:0; }
  .vrow .nm { font-size:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vrow .ph { font-size:var(--t2); color:var(--mid); font-weight:normal; margin-left:7px; }
  /* The confidence mark: a tick where the country's mobile ranges are
     published and this number sits in one, a question mark where nobody can
     tell a mobile from a landline (all of +1, for a start). */
  .vrow .conf { font-size:var(--t2); margin-left:4px; }
  .vrow .conf.ok { color:var(--resgreen); }
  .vrow .conf.un { color:var(--mid); }
  /* The edit pencil. Inside the row button, so its click must not fall
     through to the tick: the handler stops the event. */
  .vrow .pen { font-size:var(--t2); color:var(--mid); margin-left:5px;
               padding:2px 4px; cursor:pointer; }
  .vrow .st { font-size:var(--t2); color:var(--mid); margin-top:2px; }
  .vrow .st .bad { color:var(--red); }
  /* The tick says what pressing Send will do to this villa. Adjacent steps of
     the type scale, so the mark reads with the row rather than over it. */
  .tick { flex:0 0 auto; width:24px; height:24px; border:1px solid var(--rule);
          border-radius:var(--pill); display:flex; align-items:center; justify-content:center;
          font-size:var(--t3); color:transparent; }
  .vrow.on { border-color:var(--greenb); }
  .vrow.on .tick { background:var(--green); border-color:var(--greenb); color:var(--ink); }

  /* ── the two groups ────────────────────────────────────────────
     An invitation is a thing you send to the guests already in house;
     arriving guests are rarely sent one, so they set aside into a native
     <details> dropdown at the top - collapsed, unticked - and the working
     list below carries an In-house title with its own total. A confirmed
     diner among the arrivals keeps the Reservations green tile, so the colour
     law reads the same on both boards.
     The dress is the class `fold`, not the name: External guests (28 Sep) is
     the same drop-down, the owner's word - "just like the arrivals card" -
     and each keeps a name of its own for the suites to find it by. */
  .grouptitle { display:flex; align-items:baseline; gap:8px; margin:18px 2px 2px; }
  .grouptitle .gt { font-size:var(--t3); font-weight:600; }
  .grouptitle .gc { font-size:var(--t2); color:var(--mid); }

  details.fold { border:1px solid var(--rule); border-radius:10px;
                     background:var(--cream); overflow:hidden; margin:8px 0 2px; }
  details.fold > summary { list-style:none; cursor:pointer; display:flex;
                     align-items:center; gap:11px; padding:12px 13px; }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold .chev { flex:0 0 auto; width:15px; text-align:center;
                     color:var(--mid); font-size:var(--t3); transition:transform .15s ease; }
  details.fold[open] .chev { transform:rotate(90deg); }
  details.fold .albl { flex:1; min-width:0; font-size:var(--t3); font-weight:600; }
  details.fold .asub { font-size:var(--t2); color:var(--mid); font-weight:400; margin-top:2px; }
  details.fold .abadge { flex:0 0 auto; font-size:var(--t2); color:var(--amberink);
                     background:var(--amber); border:1px solid var(--amberb);
                     border-radius:var(--pill); padding:2px 10px; }
  details.fold .abody { padding:0 11px 9px; }
  details.fold .anote { font-size:var(--t1); color:var(--mid); margin:2px 2px 9px; }
  /* Ready arrivals sit white on the cream; answered ones keep their band tint. */
  details.fold .vrow { background:var(--ground); }
  details.fold .vrow.b-din { background:var(--resgreen-t); }
  details.fold .vrow.b-out { background:var(--resterra-t); }
  details.fold .vrow.b-sent { background:rgba(28,28,26,.045); }
  details.fold .vrow.b-grey { background:transparent; }

  /* The message. The box holds the words; the link is never in the box. */
  select, textarea { width:100%; font-family:var(--ui-font); font-size:var(--t3);
                     color:var(--ink); background:#fff; border:1px solid var(--rule);
                     border-radius:var(--r); padding:11px 13px; }
  select { -webkit-appearance:none; appearance:none; }
  textarea { margin-top:8px; min-height:96px; resize:vertical; line-height:1.45; }
  .msgmeta { display:flex; justify-content:space-between; gap:12px;
             font-size:var(--t2); color:var(--mid); margin-top:6px; }
  .msgmeta .warn { color:var(--red); }
  .linknote { font-size:var(--t2); color:var(--mid); margin-top:4px; line-height:1.5; }

  /* .btn wears nala-ui.css's shared dress; only this page's variants live here. */
  /* The one button whose label counts guests. "Send to 17 guests, 3 of them
     again" is longer than a phone, and a label that wraps beats a page that
     scrolls sideways: measured 26px of overflow at 390 before this. */
  #sendBtn { white-space:normal; line-height:1.4; }
  /* The second press. Same shape as Remove on the publish page: the annoying
     action is a stride from the ordinary one. */
  .btn.arm { background:var(--red); border-color:var(--red); color:#fff; }

  /* ── external guests (28 Sep) ─────────────────────────────────────
     Somebody from outside the resort rings for dinner. Their drop-down is
     the Arrivals one; what it adds is a line inside carrying Invite +, and
     on the folded line a text that did not arrive, in red words - a
     failure is never hidden behind a closed drop-down. Its rows are the
     page's .vrow in the page's band tints; the tick gives way to a forward
     mark (.fwd, not .chev: .chev is the drop-down's own arrow, and an open
     drop-down turns every .chev inside it a quarter turn), because an
     external row is not part of the batch Send - it opens its own sheet.
     Mocked in mock-external-invite.html. */
  details.fold .asub .bad { color:var(--red); }
  .extline { display:flex; align-items:center; gap:10px; margin:2px 2px 10px; }
  details.fold .extline .anote { flex:1; min-width:0; margin:0; }
  /* body.ui2 .btn is full width; a button beside a line is its label's width */
  body.ui2 .extline .btn { flex:0 0 auto; width:auto; min-height:36px; padding:0 14px;
                           font-size:var(--t2); }
  .vrow .fwd { flex:0 0 auto; width:24px; text-align:center; color:var(--mid);
               font-size:var(--t4); line-height:1; }

  /* The sheet, Reservations' own (tally.html), over everything: above the
     page's fixed Send (the footer is 40, the menu 500), or a sheet opened
     under the page's primary leaves two Sends on screen. */
  .backdrop { position:fixed; inset:0; background:rgba(28,28,26,.35); display:none;
              align-items:flex-end; justify-content:center; z-index:600; }
  .backdrop.show { display:flex; }
  .sheet { width:100%; max-width:var(--appw); background:var(--cream);
           padding:20px 24px calc(14px + env(safe-area-inset-bottom));
           border-top:1px solid var(--rule); max-height:92vh; overflow-y:auto;
           -webkit-overflow-scrolling:touch; }
  .sheet h3 { font-size:var(--t2); color:var(--mid); font-weight:normal;
              text-align:center; margin:0 44px 12px; }
  .sheet-label { font-size:var(--t1); color:var(--mid); text-align:center; margin-bottom:8px; }
  .sheet input { margin-bottom:8px; }
  .pax-row { display:flex; gap:6px; justify-content:center; margin:4px 0 16px; }
  .pax { width:42px; height:42px; border:1px solid var(--rule); background:transparent;
         border-radius:50%; font-family:var(--ui-font); font-size:var(--t2);
         color:var(--ink); cursor:pointer; padding:0; }
  @supports (aspect-ratio:1){ .pax { height:auto; aspect-ratio:1; } }
  .sheet textarea { margin-top:0; min-height:0; resize:none; overflow:hidden; }
  .sheet .msgmeta { margin-bottom:12px; }
  .sheet select { margin-bottom:16px; }
  .sheet .becomes { font-size:var(--t2); color:var(--mid); line-height:1.45; margin:10px 0 14px; }
  .sheet .facts { font-size:var(--t2); color:var(--mid); text-align:center;
                  line-height:1.5; margin:-4px 0 14px; }
  .sheet .facts .bad { color:var(--red); }
  .sheet .btn { margin-bottom:8px; }
  .sheet .savefail { margin:-2px 0 10px; }

  #errBar { font-size:var(--t2); color:var(--red); margin:10px 0; line-height:1.45; }
  .spacer { height:12px; }

/* ── paper ───────────────────────────────────────────────────────────
   The ground and its tokens live in nala-ui2.css; these are this page's
   surfaces, made solid so the paper never shows through them. Mocked in
   mock-paper.html; the owner, 27 Sep: "Same transparency issue. Don't
   forget!!" Every card, row and tile is solid white and lifted, with its
   state's tint drawn over the white, the same colour it always was.
   The sunk rows (dashed, faded: nothing to do here) are white but not
   lifted, so they still recede. Nothing changes size or place. */
body.paper .vrow { background:var(--surface); box-shadow:var(--lift); }
body.paper .vrow.b-sent { background:linear-gradient(rgba(28,28,26,.045), rgba(28,28,26,.045)), var(--surface); }
body.paper .vrow.b-din { background:linear-gradient(var(--resgreen-t), var(--resgreen-t)), var(--surface); }
body.paper .vrow.b-out { background:linear-gradient(var(--resterra-t), var(--resterra-t)), var(--surface); }
body.paper .vrow.b-grey { background:var(--surface); box-shadow:none; }
body.paper details.fold { background:var(--surface); box-shadow:var(--lift); }
/* the sheet is paper like the page; its covers are white, the picked one's
   grey drawn over the white, as on Reservations' sheets, and its outline
   button is white rather than see-through, as Keys' Cancel is */
body.paper .pax { background:var(--surface); }
body.paper .pax.on { background:linear-gradient(var(--sel-bg), var(--sel-bg)), var(--surface); }
body.paper .sheet .btn.terra { background:var(--surface); }
</style>
</head>
<body class="tier-app ui2 paper">

<div class="daterow">
  <!-- Locked to today, like the hc tally: an invitation is only ever about
       tonight, and a page that can browse to a date can send for it. -->
  <div class="date" id="title"></div>
  <div class="navwrap" id="navWrap" style="display:none">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"></div>
  </div>
</div>

<div class="noaccess" id="noAccess"></div>

<div class="stats" id="statsRow">
  <div class="stat"><div class="stat-n" id="nSend">&ndash;</div><div class="stat-l">To send</div></div>
  <div class="stat"><div class="stat-n" id="nAns">&ndash;</div><div class="stat-l">Answered</div></div>
  <div class="stat"><div class="stat-n" id="nSent">&ndash;</div><div class="stat-l">Sent</div></div>
  <div class="stat"><div class="stat-n" id="nNoPh">&ndash;</div><div class="stat-l">Unsendable</div></div>
</div>

<div id="menuGate">
  <span class="menupill none" id="menuPill">Menu not published</span>
  <div class="menuwhy" id="menuWhy"></div>
</div>

<div id="board"></div>

<div class="seclabel">Template <a class="seclink" href="templates.html">Edit templates</a></div>
<select id="tmpl" aria-label="Template"></select>
<div class="seclabel">Message</div>
<textarea id="msgBox" aria-label="Message text"></textarea>
<div class="msgmeta"><span id="msgWarn"></span><span id="msgCount"></span></div>
<div class="linknote">The menu link is added for each guest automatically, from
  tonight's booking, and cannot be typed into the message.</div>

<div id="errBar"></div>
<div class="spacer"></div>

<div class="foot">
  <button class="btn solid" id="sendBtn" disabled>Send</button>
</div>

<div class="backdrop" id="xBackdrop"><div class="sheet" id="xSheet"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=13"></script>
<script src="nala-shared.js?v=112"></script>
<script>
var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";

/* The sender, INVITES_URL (nala-shared.js). A Cloudflare Worker holding the
   ClickSend credential, which is never in the browser and never in this
   repo. The page proposes villas and a message; the Worker verifies the
   login, re-reads the stays itself, rebuilds every link server side and
   does the sending. worker/send-invites.js. */

/* Locked to today on purpose: the guests to invite are the guests in house
   tonight, and a page that could browse to another date could send for it. */
var TODAY = dkey(new Date());
document.getElementById('title').textContent = dateLabel(new Date());

(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
})();
function navFilter(role){ if (window.NALA_NAVFILTER) NALA_NAVFILTER(role); }

/* ── the link ──────────────────────────────────────────────────
   The page does not build it and never sees it. The Worker mints a six
   character token per send, stores the booking id and villa against it at
   /links/<token>, and the SMS carries menu.nalaresort.com/?t=<token>. The
   booking id is still the secret, held server side; with the villa alone
   anybody can walk ?r=1 through ?r=17 and answer for the whole resort, which
   index.html records as how the previous scheme died. */
/* What the counter assumes the link costs: the token link is exactly 37
   characters. */
var LINK_SAMPLE = new Array(38).join('x');

/* ── templates ─────────────────────────────────────────────────
   Editable before sending. <menu> marks where the link goes (its old name
   <link> still works); it is a marker,
   not a URL, and the box refuses anything that IS a URL. The resort's name is
   on every one: Australian rules require a commercial sender to identify
   itself, and the guest should know who is texting before they open a link. */
/* The link is LAST in every template, on its own line. An iPhone only draws
   the preview card when the URL is the first or last thing in the message;
   proved on 24 Aug, when the signature after the link demoted it to a bare
   blue line. The resort's name still appears, above the link.

   These are the FALLBACK. The real set lives at /smstemplates, edited on
   templates.html; these serve only until that node exists, or when it cannot
   be read. <menu> marks where the link goes (its old name <link> is still
   honoured by the Worker). */
var BUILTIN_TEMPLATES = [
  { id:'ready',    label:'Menu is ready', order:1,
    body:'Tonight\u2019s menu is ready. Nala Resort\n<menu>' },
  { id:'join',     label:'Will you join us', order:2,
    body:'Good afternoon. Tonight\u2019s menu, and a place to tell us if you will join us. Nala Resort\n<menu>' },
  { id:'reminder', label:'Reminder', order:3,
    body:'A reminder that we have not heard about dinner tonight. The menu, and the link to answer, is below. Nala Resort\n<menu>' }
];
var TEMPLATES = BUILTIN_TEMPLATES;

var ROWS = {};          /* villa -> { stay, state, ticked, arriving } */
var EXT = { manual:{}, sends:{} };   /* tonight's /manual and /extinvites */
var EXT_OPEN = false;  /* like ARR_OPEN: an open drop-down stays open across a reload */
var MENU_STATE = null;  /* 'live' | 'none' | 'failed' */
var ARMED = false;      /* the second press for a resend */
var ARR_OPEN = false;   /* whether the Arrivals dropdown is expanded */

/* ── the message box ─────────────────────────────────────────── */
var tmplSel = document.getElementById('tmpl'), msgBox = document.getElementById('msgBox');
function initTemplates(list){
  TEMPLATES = list;
  tmplSel.innerHTML = '';
  TEMPLATES.forEach(function(t){
    var o = document.createElement('option'); o.value = t.id; o.textContent = t.label;
    tmplSel.appendChild(o);
  });
  setTemplate(TEMPLATES[0] && TEMPLATES[0].id);
}
function setTemplate(id){
  var t = TEMPLATES.filter(function(t){ return t.id === id; })[0] || TEMPLATES[0];
  msgBox.value = t ? t.body : '';
  msgChanged();
}
tmplSel.onchange = function(){ setTemplate(tmplSel.value); };
initTemplates(BUILTIN_TEMPLATES);
/* The edited set, when there is one: read once signed in, from load().
   A failed read leaves the fallback in place: an out-of-date template beats
   an empty box at service time. */
function loadTemplates(){
  return fetch(DB + '/smstemplates.json?v=' + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(db){
      var list = Object.keys(db || {}).map(function(k){
        var t = db[k] || {};
        return { id:k, label:String(t.label||k), body:String(t.body||''),
                 order:+t.order || 999 };
      }).filter(function(t){ return t.body; })
        .sort(function(a,b){ return a.order - b.order; });
      if (list.length) initTemplates(list);
    })
    .catch(function(){});
}

/* A URL a human can retype is a URL that goes out wrong to fourteen guests at
   once, which is the failure this page exists to remove. So the box cannot
   contain one, and the same check runs again in the Worker. */
function bodyHasUrl(s){ return /(https?:\/\/|www\.)/i.test(s || ''); }

function msgChanged(){
  var s = msgBox.value;
  var warn = document.getElementById('msgWarn');
  warn.textContent = bodyHasUrl(s)
    ? 'Links cannot be typed here. The menu link is added automatically.' : '';
  warn.className = bodyHasUrl(s) ? 'warn' : '';
  document.getElementById('msgCount').textContent = smsCount(s);
  disarm();
}
/* An SMS is 160 characters and the link costs 37 of them, so a template
   plus the link usually still fits one segment. Shown so the writer knows
   what they are doing. One count for both boxes on the page. */
function smsCount(s){
  var len = s.replace('<menu>', LINK_SAMPLE).replace('<link>', LINK_SAMPLE).length;
  var segs = len <= 160 ? 1 : Math.ceil(len / 153);
  return len + ' characters \u00B7 ' + (segs === 1 ? '1 segment' : 'about ' + segs + ' segments');
}
msgBox.oninput = msgChanged;
setTemplate('ready');

/* ── the board ───────────────────────────────────────────────── */
/* timeOf and stateOf moved to nala-shared.js on 8 Sep, when the Dashboard
   needed the same reading and rebuilt it instead. This page calls stateOf
   with its own TODAY. */

/* The four bands, INVITATIONS-STATUS.md, in the Cleans order: work first,
   done sinks. A band is a GROUPING of stateOf's kinds, not new state, and a
   failed send is kind 'ready' so it lands back in To send, which is the
   sender's question answered. Within a band, villa order as before; dining
   and not-dining stay interleaved. An empty band shows no header. */
var BANDS = [
  { kind:'ready',    title:'To send' },
  { kind:'sent',     title:'Waiting on a reply' },
  { kind:'answered', title:'Answered' },
  { kind:'nophone',  title:'Cannot send' }
];
/* The answered tint comes off the STATE, not off a second read of the cell:
   a form answer has no cell, and re-deriving dining here from DINNER_CELLS
   painted every form-answered diner terracotta. stateOf already decided
   in/out once; this only dresses it. */
function bandClass(st){
  if (st.kind === 'sent') return ' b-sent';
  if (st.kind === 'nophone') return ' b-grey';
  if (st.kind === 'answered') return st.in ? ' b-din' : ' b-out';
  return '';
}

function render(stays, invites, fixes){
  var board = document.getElementById('board');
  board.innerHTML = '';
  ROWS = {};
  renderExt(board);
  var inhouse = { ready:[], sent:[], answered:[], nophone:[] };
  var arriving = [];   /* flat, villa order: the point is they are set aside */
  Object.keys(stays || {}).sort(function(a, b){ return (+a) - (+b); }).forEach(function(v){
    var stay = stays[v];
    if (!stay || typeof stay !== 'object' || !stay.id) return;  /* the older bare id shape */
    var fix = (fixes || {})[stay.id];
    var st = stateOf(v, stay, DINNER_CELLS[v], (invites || {})[v], fix, TODAY);
    /* Arriving tonight, by the one shared reader (isArrivalNight, nala-shared.js),
       so this page and the pre-arrival form cannot disagree about which night a
       booking arrives. Arrivals begin unticked - we rarely invite them. */
    var isArr = isArrivalNight(stay, TODAY);
    var start = isArr ? false : st.ticked;
    ROWS[v] = { stay: stay, state: st, ticked: start, arriving: isArr };
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'vrow' + (start ? ' on' : '') + bandClass(st);
    b.dataset.villa = v;
    b.dataset.state = st.kind;
    /* An unsendable row is not dead: tapping it fixes the number. */
    b.disabled = !st.tickable && !st.fixable;
    b.setAttribute('aria-pressed', start ? 'true' : 'false');
    b.innerHTML = '<div class="v">' + v + '</div>' +
      '<div class="mid"><div class="nm trimrow">'+
        '<span class="trim"></span></div><div class="st"></div></div>' +
      '<div class="tick">\u2713</div>';
    var nm   = b.querySelector('.nm .trim');   /* the name, trims */
    var nmln = b.querySelector('.nm');         /* the line, never trims */
    nm.textContent = ((stay.first || '') + ' ' + (stay.last || '')).trim() || 'Guest';
    /* The number beside the name, grey and small, with the pencil that edits
       it. Every row carries both: a valid number can still be a WRONG one,
       and the fix outranks Mews either way. */
    var ph = document.createElement('span'); ph.className = 'ph';
    var rawPh = String((fix && fix.phone) || stay.phone || '').trim();
    ph.textContent = rawPh || 'no number';
    nmln.appendChild(ph);
    var confidence = rawPh ? phoneConfidence(rawPh) : null;
    if (confidence){
      var cf = document.createElement('span');
      cf.className = 'conf ' + (confidence === 'mobile' ? 'ok' : 'un');
      cf.textContent = confidence === 'mobile' ? '\u2713' : '?';
      cf.title = confidence === 'mobile'
        ? 'Sits in this country\u2019s published mobile ranges'
        : 'A real number, but this country\u2019s mobiles cannot be told from landlines; sending will find out';
      nmln.appendChild(cf);
    }
    var pen = document.createElement('span'); pen.className = 'pen';
    /* Not on a disabled row: a completed form needs no number and a dead
       pencil reads as a broken one. */
    pen.textContent = '✎'; pen.setAttribute('aria-label', 'Edit number');
    pen.onclick = function(e){ e.stopPropagation(); fixNumber(stay, fix); };
    if (st.tickable || st.fixable) nmln.appendChild(pen);
    var line = b.querySelector('.st');
    if (st.bad){ var s = document.createElement('span'); s.className = 'bad';
                 s.textContent = st.line; line.appendChild(s); }
    else line.textContent = st.line;
    b.onclick = function(){
      if (st.fixable){ fixNumber(stay, fix); return; }
      var turningOn = !ROWS[v].ticked;
      /* Inviting an arriving guest who has ALREADY confirmed dining asks first:
         they do not need a menu invitation, so a tap on their green row is more
         likely a slip than an intent. Unticking never asks, and an in-house
         answered guest stays a deliberate one-tap resend as before. */
      if (turningOn && isArr && st.kind === 'answered' && st.in &&
          !window.confirm(nm.textContent + ' has already confirmed dining on ' +
            'their pre-arrival form, so they do not need a menu invitation. ' +
            'Send one anyway?'))
        return;
      ROWS[v].ticked = turningOn;
      b.classList.toggle('on', ROWS[v].ticked);
      b.setAttribute('aria-pressed', ROWS[v].ticked ? 'true' : 'false');
      recount();
    };
    if (isArr) arriving.push(b);
    else (inhouse[st.kind] || inhouse.ready).push(b);
  });

  /* Arrivals first, but folded away in a native <details> so the dropdown
     works with no script and stays open across a reload while the desk is in
     it. Unticked, so nothing here joins a send unless it is deliberately tapped. */
  if (arriving.length){
    var det = document.createElement('details');
    det.className = 'fold arrivals';
    det.open = ARR_OPEN;
    det.addEventListener('toggle', function(){ ARR_OPEN = det.open; });
    var sum = document.createElement('summary');
    sum.innerHTML = '<span class="chev">\u25b6</span>' +
      '<span class="albl">Arrivals<div class="asub">Arriving today \u00b7 rarely invited</div></span>' +
      '<span class="abadge"></span>';
    sum.querySelector('.abadge').textContent =
      arriving.length + ' guest' + (arriving.length === 1 ? '' : 's');
    det.appendChild(sum);
    var abody = document.createElement('div');
    abody.className = 'abody';
    var anote = document.createElement('div');
    anote.className = 'anote';
    anote.textContent = 'Arriving guests are set aside and left unticked. Tap one to invite it anyway.';
    abody.appendChild(anote);
    arriving.forEach(function(b){ abody.appendChild(b); });
    det.appendChild(abody);
    board.appendChild(det);
  }

  /* The working list: in-house guests, under a title with their own total, in
     the four status bands. */
  var inhouseTotal = BANDS.reduce(function(n, band){ return n + inhouse[band.kind].length; }, 0);
  if (inhouseTotal){
    var gt = document.createElement('div');
    gt.className = 'grouptitle';
    gt.innerHTML = '<span class="gt">In house</span><span class="gc"></span>';
    gt.querySelector('.gc').textContent =
      inhouseTotal + ' guest' + (inhouseTotal === 1 ? '' : 's');
    board.appendChild(gt);
  }
  BANDS.forEach(function(band){
    if (!inhouse[band.kind].length) return;
    var h = document.createElement('div');
    h.className = 'grp';
    h.textContent = band.title + ' \u00b7 ' + inhouse[band.kind].length;
    board.appendChild(h);
    inhouse[band.kind].forEach(function(b){ board.appendChild(b); });
  });
  recount();
}

/* ── external guests (28 Sep) ─────────────────────────────────
   Somebody from outside the resort rings for dinner. This drop-down sends
   them tonight's menu and holds the evening's invitations. The Worker makes
   the booking - Reservations' External reservation, Awaiting until the guest
   answers from the link - so, as for the villas, this page proposes and the
   Worker decides: a name, a number, a table size and the words. Where each
   guest stands is extInviteState's (nala-shared.js), which Reservations and
   the Dashboard read too; this page only draws it. */
function renderExt(board){
  var list = extInvites(EXT.manual).map(function(e){
    return { key:e.key, g:e.g, st:extInviteState(e.g, EXT.sends[e.key]) };
  });
  /* Work first, done sinks, as the villas' bands: a text to chase, then
     waiting, then answered; within each, in the order they were invited. */
  var ORDER = { ready:0, sent:1, answered:2 };
  list.sort(function(a, b){
    return (ORDER[a.st.kind] - ORDER[b.st.kind]) ||
           String(a.g.invitedAt || '').localeCompare(String(b.g.invitedAt || ''));
  });
  var bad = list.filter(function(x){ return x.st.bad; }).length;
  var det = document.createElement('details');
  det.className = 'fold extguests';
  det.open = EXT_OPEN;
  det.addEventListener('toggle', function(){ EXT_OPEN = det.open; });
  var sum = document.createElement('summary');
  sum.innerHTML = '<span class="chev">▶</span>' +
    '<span class="albl">External guests<div class="asub"></div></span>';
  var sub = sum.querySelector('.asub');
  sub.appendChild(document.createTextNode('Not staying · '));
  if (bad){
    var s = document.createElement('span'); s.className = 'bad';
    s.textContent = bad + ' not delivered'; sub.appendChild(s);
  } else sub.appendChild(document.createTextNode('invited by SMS'));
  if (list.length){
    var badge = document.createElement('span'); badge.className = 'abadge';
    badge.textContent = list.length + ' guest' + (list.length === 1 ? '' : 's');
    sum.appendChild(badge);
  }
  det.appendChild(sum);
  var body = document.createElement('div');
  body.className = 'abody';
  var line = document.createElement('div');
  line.className = 'extline';
  line.innerHTML = '<div class="anote"></div>' +
    '<button class="btn" type="button" id="extInvite">Invite +</button>';
  line.querySelector('.anote').textContent = list.length
    ? 'Tap a guest to send again or cancel.'
    : 'Guests from outside the resort, invited by SMS.';
  line.querySelector('#extInvite').onclick = openInvite;
  body.appendChild(line);
  list.forEach(function(x){ body.appendChild(extRow(x)); });
  det.appendChild(body);
  board.appendChild(det);
}

function extRow(x){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'vrow' + (x.st.kind === 'sent' ? ' b-sent'
                : x.st.kind === 'answered' ? (x.st.in ? ' b-din' : ' b-out') : '');
  b.dataset.ext = x.key;
  b.innerHTML = '<div class="mid"><div class="nm trimrow"><span class="trim"></span>' +
    '<span class="ph"></span></div><div class="st"></div></div>' +
    '<div class="fwd">›</div>';
  b.querySelector('.trim').textContent = x.g.name || 'Guest';
  b.querySelector('.ph').textContent = x.g.phone || 'no number';
  paintState(b.querySelector('.st'), x.st);
  b.onclick = function(){ openExtRow(x); };
  return b;
}
/* The plain words, then the failure's in red. */
function paintState(el, st){
  el.textContent = st.line + (st.bad ? ' · ' : '');
  if (st.bad){
    var s = document.createElement('span'); s.className = 'bad';
    s.textContent = st.bad; el.appendChild(s);
  }
}

/* The words, with the first name, the table size and the seating in them.
   The link is the Worker's, on its own last line where <menu> stands, as on
   every invitation; the box cannot carry one. The time is written the SMS
   way, "7:30pm", from the one reading of a stored time. */
function extWords(name, pax, time){
  var first = String(name || '').trim().split(/\s+/)[0] || '';
  var t = dinnerTimeLabel(time);
  return 'Hi' + (first ? ' ' + first : '') + ', thanks for your call. Tonight’s ' +
    'menu is below - tap to accept or decline your table for ' + pax +
    (t ? ' at ' + t + 'pm' : '') + '. Nala Resort\n<menu>';
}
/* The seatings, the Reservations wheel's own: DINNER_TIMES (nala-shared.js),
   5pm to 8pm by the quarter hour, or no time at all. */
function seatOptions(){
  return '<option value="">No time</option>' + DINNER_TIMES.map(function(t){
    return '<option value="' + t + '">' + dinnerTimeLabel(t) + ' pm</option>';
  }).join('');
}

/* Why a send cannot go yet, or '' when it can. The menu rule is the page's
   own: the text promises tonight's menu, so nothing sends before the chef
   publishes - the same gate as Send, not a second opinion. */
function extWhyNot(body, name, phone){
  if (name !== undefined && !String(name).trim()) return 'Add the guest’s name.';
  if (phone !== undefined && !normalisePhone(phone))
    return 'That is not a sendable mobile number. Australian numbers can be typed ' +
           'as 04...; anything overseas needs its + country code.';
  if (bodyHasUrl(body))
    return 'The message contains a link. Take it out: the menu link is added automatically.';
  if (MENU_STATE === 'failed')
    return 'Tonight’s menu could not be checked, so nothing sends until it can.';
  if (MENU_STATE !== 'live')
    return 'No menu is published for tonight, so the link would land on a ' +
           'placeholder. Sending opens once the chef publishes.';
  if (!window.__idToken) return 'Still signing in. Try again in a moment.';
  return '';
}

/* One call to the Worker for an external guest. Resolves with its answer
   when the text went; rejects with the reason, worded for the sheet. */
function postExt(fields){
  return fetch(INVITES_URL, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ idToken: window.__idToken, kind: 'ext',
                                         date: TODAY, template: 'ext' }, fields))
  })
  .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
  .then(function(res){
    if (!res.ok || !res.j || !res.j.result)
      throw new Error('Nothing was sent: ' + ((res.j && res.j.error) || 'the sender did not answer') + '.');
    var s = res.j.result.status;
    if (s !== 'sent' && s !== 'sent-unrecorded')
      throw new Error('Nothing was sent: ' + (res.j.result.error || 'unknown fault') + '.');
    return res.j;
  }, function(e){
    if (e && /^Nothing was sent/.test(e.message)) throw e;
    throw new Error('Nothing was sent: the sender could not be reached.');
  });
}

var xBack = document.getElementById('xBackdrop'), xSheet = document.getElementById('xSheet');
function showSheet(html){ xSheet.innerHTML = html; xBack.className = 'backdrop show'; }
function closeSheet(){ xBack.className = 'backdrop'; xSheet.innerHTML = ''; }
function $x(id){ return document.getElementById(id); }

/* A box that shows the whole message at any width, the mock's rule. */
function fitBox(el){ el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }

/* The send button's two presses, the page's own rule since 25 Aug: the
   first arms, the second sends, and any edit between them disarms. */
function armer(btn, rest, confirmLabel){
  var armed = false;
  return {
    armed: function(){ return armed; },
    arm: function(){ armed = true; btn.className = 'btn solid arm';
                     btn.textContent = confirmLabel(); },
    disarm: function(){ armed = false; btn.className = 'btn solid';
                        btn.textContent = rest; btn.disabled = false; }
  };
}

function openInvite(){
  var pax = 2, touched = false;
  showSheet(
    '<h3>Invite an external guest</h3>' +
    '<input id="xName" type="text" placeholder="Name" autocomplete="off" aria-label="Name">' +
    '<input id="xPhone" type="tel" placeholder="Mobile" autocomplete="off" aria-label="Mobile">' +
    '<div class="sheet-label" style="margin-top:14px">Guests</div>' +
    '<div class="pax-row" id="xPax"></div>' +
    '<div class="sheet-label">Time</div>' +
    '<select id="xTime" aria-label="Time of the table">' + seatOptions() + '</select>' +
    '<div class="sheet-label">Message</div>' +
    '<textarea id="xMsg" aria-label="Message to the guest"></textarea>' +
    '<div class="msgmeta"><span id="xWarn"></span><span id="xCount"></span></div>' +
    '<div class="becomes" id="xBecomes"></div>' +
    '<button class="btn solid" id="xSend" type="button">Send invitation</button>' +
    '<div class="savefail" id="xFail"></div>' +
    '<button class="btn" id="xCancel" type="button">Cancel</button>');
  var nameEl = $x('xName'), phEl = $x('xPhone'), msgEl = $x('xMsg'),
      timeEl = $x('xTime'), sendB = $x('xSend'), fail = $x('xFail');
  var arm = armer(sendB, 'Send invitation', function(){
    return 'Please confirm · send to ' + nameEl.value.trim(); });
  function quiet(){ arm.disarm(); fail.className = 'savefail'; }
  function paintPax(){
    var row = $x('xPax'); row.innerHTML = '';
    for (var i = 1; i <= 8; i++) (function(n){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pax' + (n === pax ? ' on' : '');
      b.textContent = n; b.setAttribute('aria-label', n + ' guests');
      b.onclick = function(){ pax = n; paintPax(); refresh(); };
      row.appendChild(b);
    })(i);
  }
  /* Until reception types into the message, it follows the name, the table
     size and the time; after that it is theirs. */
  function refresh(){
    if (!touched) msgEl.value = extWords(nameEl.value, pax, timeEl.value);
    fitBox(msgEl);
    $x('xCount').textContent = smsCount(msgEl.value);
    var url = bodyHasUrl(msgEl.value);
    $x('xWarn').textContent = url ? 'Links cannot be typed here.' : '';
    $x('xWarn').className = url ? 'warn' : '';
    var t = dinnerTimeLabel(timeEl.value);
    $x('xBecomes').textContent = 'The menu link is added automatically. Sending puts ' +
      (nameEl.value.trim() || 'the guest') + ', table for ' + pax +
      (t ? ' at ' + t + ' pm' : '') + ', on tonight’s Reservations as Awaiting.';
    quiet();
  }
  nameEl.oninput = refresh;
  timeEl.onchange = refresh;
  phEl.oninput = quiet;
  msgEl.oninput = function(){ touched = true; refresh(); };
  sendB.onclick = function(){
    var why = extWhyNot(msgEl.value, nameEl.value, phEl.value);
    if (why){ fail.textContent = why; fail.className = 'savefail show'; return; }
    if (!arm.armed()){ arm.arm(); return; }
    sendB.disabled = true; sendB.textContent = 'Sending…';
    postExt({ name: nameEl.value.trim(), phone: phEl.value.trim(), pax: pax,
              time: timeEl.value || undefined, body: msgEl.value })
      .then(function(){ closeSheet(); EXT_OPEN = true; return load(); })
      .catch(function(e){
        arm.disarm();
        fail.textContent = (e && e.message) || 'Nothing was sent.';
        fail.className = 'savefail show';
      });
  };
  $x('xCancel').onclick = closeSheet;
  paintPax(); refresh();
  nameEl.focus();
}

/* One guest already invited tonight: their facts, send again, or cancel. */
function openExtRow(x){
  var g = x.g, pax = dinerPax(g);
  showSheet(
    '<h3 id="xTitle"></h3>' +
    '<div class="facts" id="xFacts"></div>' +
    '<div class="sheet-label">Message</div>' +
    '<textarea id="xMsg" aria-label="Message to the guest"></textarea>' +
    '<div class="msgmeta"><span id="xWarn"></span><span id="xCount"></span></div>' +
    '<button class="btn solid" id="xSend" type="button">Send again</button>' +
    '<div class="savefail" id="xFail"></div>' +
    '<button class="btn terra" id="xDrop" type="button">Cancel invitation</button>' +
    '<button class="btn" id="xClose" type="button">Close</button>');
  $x('xTitle').textContent = g.name || 'Guest';
  var facts = $x('xFacts');
  facts.textContent = (g.phone || 'no number') + ' · ';
  var st = document.createElement('span'); paintState(st, x.st); facts.appendChild(st);
  var msgEl = $x('xMsg'), sendB = $x('xSend'), fail = $x('xFail');
  msgEl.value = extWords(g.name, pax, g.time);
  var arm = armer(sendB, 'Send again', function(){
    return 'Please confirm · send again to ' + (g.name || 'the guest'); });
  function refresh(){
    fitBox(msgEl);
    $x('xCount').textContent = smsCount(msgEl.value);
    var url = bodyHasUrl(msgEl.value);
    $x('xWarn').textContent = url ? 'Links cannot be typed here.' : '';
    $x('xWarn').className = url ? 'warn' : '';
    arm.disarm(); fail.className = 'savefail';
  }
  msgEl.oninput = refresh;
  sendB.onclick = function(){
    var why = extWhyNot(msgEl.value);
    if (why){ fail.textContent = why; fail.className = 'savefail show'; return; }
    if (!arm.armed()){ arm.arm(); return; }
    sendB.disabled = true; sendB.textContent = 'Sending…';
    postExt({ key: x.key, body: msgEl.value })
      .then(function(){ closeSheet(); EXT_OPEN = true; return load(); })
      .catch(function(e){
        arm.disarm();
        fail.textContent = (e && e.message) || 'Nothing was sent.';
        fail.className = 'savefail show';
        /* the send record changed either way: redraw behind the sheet */
        load();
      });
  };
  /* The button law: a walk-back of something a guest holds wears
     terracotta and asks first, naming the guest and the thing. */
  $x('xDrop').onclick = function(){
    if (!window.confirm('Cancel ' + (g.name || 'this guest') + '’s table for ' +
                        pax + ' tonight? Their link will stop working.')) return;
    var btn = this;
    btn.disabled = true;
    fetch(DB + '/manual/' + TODAY + '/' + x.key + '.json', { method: 'DELETE' })
      .then(function(r){
        if (!r.ok) throw new Error();
        closeSheet(); return load();
      })
      .catch(function(){
        btn.disabled = false;
        fail.textContent = 'The invitation was not cancelled. Try again.';
        fail.className = 'savefail show';
      });
  };
  $x('xClose').onclick = closeSheet;
  refresh();
}

/* The number editor, the same one the pre-arrival page carries. A browser
   prompt rather than a drawn form: it is rare, it is one field, and the
   keyboard it summons is the phone's own. Saved normalised, with the raw
   Mews value as `was`; Mews itself stays wrong and should be corrected
   there when somebody is in it. */
function fixNumber(stay, fix){
  var raw = String((fix && fix.phone) || stay.phone || '').trim();
  var err = document.getElementById('errBar');
  var typed = window.prompt(
    'Mobile number for ' + (((stay.first || '') + ' ' +
    (stay.last || '')).trim() || 'this guest') +
    '.\nInclude the country code for an overseas number, e.g. +64 27 487 5277.',
    raw);
  if (typed == null) return;                       /* cancelled */
  var phone = normalisePhone(typed);
  if (!phone){
    err.textContent = 'That is still not a sendable mobile number. Australian ' +
      'numbers can be typed as 04...; anything overseas needs its + country code.';
    return;
  }
  err.textContent = '';
  fetch(DB + '/phonefix/' + stay.id + '.json', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: phone, was: String(stay.phone || ''),
                           by: (window.NALA_USER && NALA_USER.email) || '',
                           at: new Date().toISOString() })
  }).then(function(r){
    if (!r.ok) throw new Error();
    return load();
  }).catch(function(){
    err.textContent = 'The number did not save. Try again.';
  });
}

function selected(){
  return Object.keys(ROWS).filter(function(v){ return ROWS[v].ticked; })
                          .sort(function(a, b){ return (+a) - (+b); });
}

function disarm(){
  if (!ARMED) return;
  ARMED = false;
  recount();
}

function recount(){
  var vs = Object.keys(ROWS), sel = selected();
  /* The strip is the day's totals across both groups; the per-group counts
     live on the Arrivals dropdown and the In-house title. To send is the live
     selection, so a deliberately ticked arrival shows there and in the button. */
  var n = function(k){ return vs.filter(function(v){ return ROWS[v].state.kind === k; }).length; };
  document.getElementById('nSend').textContent = sel.length;
  document.getElementById('nAns').textContent  = n('answered');
  document.getElementById('nSent').textContent = n('sent');
  document.getElementById('nNoPh').textContent = n('nophone');

  var again = sel.filter(function(v){ return ROWS[v].state.kind !== 'ready'; }).length;
  var btn = document.getElementById('sendBtn');
  var label = 'Send to ' + sel.length + ' guest' + (sel.length === 1 ? '' : 's') +
              (again ? ', ' + again + ' of them again' : '');
  if (ARMED) label = 'Please confirm \u00B7 ' + label.charAt(0).toLowerCase() + label.slice(1);
  btn.textContent = sel.length ? label : 'Send';
  btn.className = 'btn solid' + (ARMED ? ' arm' : '');
  btn.disabled = !sel.length || MENU_STATE !== 'live' || !window.__idToken;
}

/* ── nothing sends before the menu is published ───────────────
   The same test the guest page uses, not a second opinion: the shared reader
   already refuses a stale fallback file, and a database menu counts only
   until the midnight ending its publish day. A failed read is NOT an absent
   menu and is worded as the connection, not as no dinner. */
function menuGate(){
  return fetchMenuAnywhere(TODAY).then(function(m){
    var gate = document.getElementById('menuGate'),
        why  = document.getElementById('menuWhy'),
        pill = document.getElementById('menuPill');
    if (m && m.failed){
      MENU_STATE = 'failed';
      pill.className = 'menupill fail';
      pill.textContent = 'Menu could not be checked';
      why.textContent = 'Tonight\u2019s menu could not be read. This is usually ' +
        'the connection, not the menu. Nothing sends until it can be checked.';
      gate.className = 'show';
    } else {
      var live = menuLive(m);
      MENU_STATE = live ? 'live' : 'none';
      if (live){
        /* The opposite state of the amber pill, said out loud: silence read as
           this page not having checked. Just the fact, no timestamp. */
        pill.textContent = 'Menu published';
        pill.className = 'menupill ok';
        why.textContent = '';
        gate.className = 'show';
      }
      else {
        pill.className = 'menupill none';
        pill.textContent = 'Menu not published';
        why.textContent = 'No menu is published for tonight, so the link would ' +
          'land on a placeholder. Sending opens once the chef publishes.';
        gate.className = 'show';
      }
    }
    recount();
  });
}

/* ── sending ─────────────────────────────────────────────────── */
document.getElementById('sendBtn').onclick = function(){
  var sel = selected();
  if (!sel.length || MENU_STATE !== 'live') return;
  var body = msgBox.value;
  var err = document.getElementById('errBar');
  if (bodyHasUrl(body)){
    err.textContent = 'The message contains a link. Take it out: the menu ' +
      'link is added automatically for each guest.';
    return;
  }
  err.textContent = '';
  /* EVERY send takes a second press since 25 Aug, not only resends. Same
     shape as Remove on the publish page: the annoying action is a stride
     from the ordinary one on a phone at service time. */
  if (!ARMED){ ARMED = true; recount(); return; }
  ARMED = false;

  var btn = this;
  btn.disabled = true; btn.textContent = 'Sending\u2026';
  fetch(INVITES_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ idToken: window.__idToken, date: TODAY,
                           villas: sel, template: tmplSel.value, body: body })
  })
  .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
  .then(function(res){
    if (!res.ok || !res.j || !res.j.results)
      throw new Error((res.j && res.j.error) || 'the sender did not answer');
    /* Per villa, not per batch: four of six succeeding is the normal case for
       a bad number, and it must be visible which two did not. Reload from the
       database rather than trusting the summary, so the rows show what was
       actually recorded. */
    var failed = Object.keys(res.j.results).filter(function(v){
      return res.j.results[v].status !== 'sent';
    }).sort(function(a, b){ return (+a) - (+b); });
    if (failed.length)
      err.textContent = 'Did not send to villa' + (failed.length === 1 ? '' : 's') +
        ' ' + failed.join(', ') + '. The reason is on each row.';
    return load();
  })
  .catch(function(e){
    err.textContent = 'Nothing was sent: ' + (e && e.message ? e.message : 'unknown fault') + '.';
  })
  .then(function(){ recount(); });
};

/* ── loading ─────────────────────────────────────────────────── */
function load(){
  return Promise.all([
    fetchStays(TODAY),                  /* fills DINNER_CELLS alongside */
    fetch(DB + '/invites/' + TODAY + '.json?v=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; }),
    menuGate(),
    loadTemplates(),
    fetch(DB + '/phonefix.json?v=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; }),
    /* The external guests: their bookings, where Reservations keeps them,
       and their send records, apart from the villas'. */
    fetch(DB + '/manual/' + TODAY + '.json?v=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; }),
    fetch(DB + '/extinvites/' + TODAY + '.json?v=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })
  ]).then(function(res){
    EXT = { manual: res[5] || {}, sends: res[6] || {} };
    render(res[0] || {}, res[1] || {}, res[4] || {});
    checkDelivery(res[1] || {}, EXT.sends);
  });
}

/* Once per visit, ask the Worker to fetch handset receipts for anything
   sent but unconfirmed; if a verdict landed, reload so the rows say so.
   The flag stops the reload asking again forever. */
var CHECKED_DELIVERY = false;
function checkDelivery(invites, extsends){
  if (CHECKED_DELIVERY || !window.__idToken) return;
  function unsettled(r){
    return r && r.status === 'sent' && r.providerId &&
           r.delivery !== 'delivered' && r.delivery !== 'failed';
  }
  var pending = Object.keys(invites || {}).filter(function(v){ return unsettled(invites[v]); });
  var extPending = Object.keys(extsends || {}).filter(function(k){ return unsettled(extsends[k]); });
  if (!pending.length && !extPending.length) return;
  CHECKED_DELIVERY = true;
  fetch(INVITES_URL, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ idToken: window.__idToken, kind:'delivery',
      invites: pending.map(function(v){ return { date: TODAY, villa: v }; }),
      exts: extPending.map(function(k){ return { date: TODAY, key: k }; }) }) })
  .then(function(r){ return r.json(); })
  .then(function(j){ if (j && j.changed) return load(); })
  .catch(function(){});
}

function showAccess(allowed, e){
  var box = document.getElementById('noAccess');
  var on = !allowed;
  box.innerHTML = !on ? '' :
    (e ? '<div>Could not check access. This is usually the connection, '
       + 'not your login.</div>'
       + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
       : 'This login has no access to Invitations. See the manager.');
  if (on && !e){
    var home = homeFor(window.NALA_ROLE);
    if (home && home !== location.pathname.split('/').pop()){
      location.replace(home); return;
    }
  }
  box.className = 'noaccess' + (on ? ' show' : '');
  ['statsRow','board','sendBtn','tmpl','msgBox'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.style.display = on ? 'none' : '';
  });
  if (!on) load();
}

window.NALA_ROLE = null;
(function gate(){
  if (!window.firebase || !firebase.auth || typeof loadStaff !== 'function')
    return setTimeout(gate, 40);
  var A; try { A = firebase.auth(); } catch(e){ return setTimeout(gate, 40); }
  if (!A || !A.onAuthStateChanged) return setTimeout(gate, 40);
  A.onAuthStateChanged(function(u){
    if (!u) return;                 /* auth.js owns the signed-out state */
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role;
      window.NALA_USER = u;
      document.getElementById('navWrap').style.display = 'block';
      navFilter(role);
      /* Reception's job and the manager's: the same permission that opens the
         front desk, checked rather than assumed. */
      showAccess(canOpen(role, 'invitations.html'), e);
    });
  });
})();
</script>
