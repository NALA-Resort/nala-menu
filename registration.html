<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>Nala &middot; Registration Cards</title>
<link rel="stylesheet" href="nala-ui.css?v=16">
<style>
  @page { size: A4 portrait; margin: 12mm; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--ui-font); color:#111; background:#fff; padding:16px 16px 0; }

  /* .btn and .btn.ghost wear nala-ui.css's tier-print dress. */

  /* One card per arriving villa, one page each. A card that breaks across a
     page is a card somebody hands over half of. Sized so that even a card with
     EVERY question unanswered, boxes and all, fits one A4 page with the
     signature block on it: the 19 Aug sizes did not, and the first real print
     came back with Notes and the signatures orphaned on a second page.

     The card is set in Georgia, per the approved mock and STYLEGUIDE's content
     serif. Screen controls above the cards stay in the UI font.

     Width is the A4 printable width, stated explicitly. Without it the card
     shrank to phone width on screen and every row wrapped into rubble; the
     sideways scroll on #cards only works if the card actually keeps its
     printed width. */
  .card { border:1px solid #111; padding:16px 18px 18px; margin-bottom:18px;
          width:186mm; font-family:Georgia, 'Times New Roman', serif;
          page-break-inside:avoid; page-break-after:always; }
  .card:last-child { page-break-after:auto; }

  /* Sized off the printed card of 19 Aug, which came back with every field
     written over in pen because nothing on it was large enough to read at
     arm's length across a desk. Roughly double throughout, and the card now
     fills at least two thirds of the page rather than a third of it. */
  .c-head { display:flex; align-items:baseline; gap:16px;
            border-bottom:1.5px solid #111; padding-bottom:12px; margin-bottom:10px; }
  .c-villa { font-size:52px; line-height:1; font-weight:bold; }
  .c-who { flex:1; }
  .c-name { font-size:32px; line-height:1.2; }
  .c-stay { font-size:16px; letter-spacing:.015em; text-transform:uppercase;
            color:#444; margin-top:6px; line-height:1.3; }
  /* Nights and party size are what reception says out loud while the guest is
     standing there, so they are set larger than the dates around them and kept
     on one line: a party size that wraps reads as two facts. */
  .c-stay b { font-size:27px; font-weight:bold; color:#111; letter-spacing:.01em;
              white-space:nowrap; }

  .row { display:flex; gap:14px; padding:7px 0; border-bottom:1px solid #ddd; }
  .row:last-of-type { border-bottom:none; }
  .lbl { flex:0 0 22%; font-size:15px; letter-spacing:.12em; text-transform:uppercase;
         color:#555; padding-top:5px; }
  .val { flex:1; font-size:21px; line-height:1.35; min-height:28px; }
  /* An unanswered field prints as a rule to write on, not as blank space.
     Reception fills it in with the guest and the card is the working document. */
  .val.blank { border-bottom:1px solid #999; min-height:30px; }

  /* An unanswered question prints the guest form's own options as boxes, so
     reception ticks rather than writes. Same options in the same order as the
     form, because the guest may answer half of it at the desk and the two
     have to be the same question. */
  .ticks { display:flex; flex-wrap:wrap; gap:6px 20px; }
  .tk { display:flex; align-items:center; gap:8px; font-size:18px; line-height:1.2;
        white-space:nowrap; }
  .tk i { display:block; width:18px; height:18px; border:1.5px solid #333; flex:0 0 18px; }
  .writeline { border-bottom:1px solid #999; height:28px; margin-top:7px; }
  .count { display:flex; align-items:flex-end; gap:10px; font-size:18px; margin-top:8px; }
  .count span { display:block; width:130px; border-bottom:1px solid #999; height:26px; }

  /* Arriving is the one reception reads at a glance while the guest walks in,
     so it is set three times the old size rather than two. No tick boxes: the
     answer is a time and a reason, and six boxes crowd out the room to write
     the reason, which is the part that matters. */
  .row.eta { padding:10px 0; }
  .row.eta .lbl { font-size:22px; padding-top:8px; }
  .row.eta .val { font-size:30px; }
  .row.eta .val.blank { min-height:44px; }

  .notelines div { border-bottom:1px solid #999; height:30px; }

  .flag { color:#9E6455; font-weight:bold; }
  .sig { display:flex; gap:28px; margin-top:12px; padding-top:10px;
         border-top:1.5px solid #111; }
  .sig div { flex:1; font-size:13px; letter-spacing:.12em; text-transform:uppercase;
             color:#555; }
  .sig span { display:block; border-bottom:1px solid #111; height:30px; margin-bottom:6px; }

  .stamp { font-size:7.5px; letter-spacing:.1em; text-transform:uppercase;
           color:#999; text-align:right; margin-top:10px; }
  .empty { font-size:13px; color:#666; font-style:italic; padding:20px 0; }

  /* This page is an A4 sheet, not a board. The card was doubled in size on
     19 Aug so it can be read across a desk, and a 52px villa number does not
     fit a 320pt phone and does not need to: nobody reads a registration card
     on a handset during service, they read the printed one at the desk.

     So the cards scroll sideways on screen rather than being shrunk to fit a
     width that does not apply to them. The page itself still does not, which
     is the rule that matters and the one sweep_suite is actually checking.
     Print is untouched. */
  #cards { overflow-x:auto; }

  @media print {
    body { padding:0; }
    .daterow, .foot, .noaccess { display:none !important; }
    .card { border:none; padding:0; }
    #cards { overflow-x:visible; }
  }
</style>
</head>
<body class="tier-print">

<div class="printkick">Nala &middot; Registration</div>

<div class="daterow">
  <button class="dnav today" id="dToday">Today</button>
  <button class="dnav" id="dPrev">&#8249;</button>
  <div class="date" id="title"></div>
  <button class="dnav" id="dNext">&#8250;</button>
  <div class="navwrap" id="navWrap">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"></div>
  </div>
</div>

<div class="noaccess" id="noAccess"></div>
<div id="cards"></div>
<div class="stamp" id="stamp"></div>

<div class="foot">
  <button class="btn" onclick="window.print()">Print</button>
  <button class="btn ghost" onclick="location.reload()">Refresh</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=12"></script>
<script src="nala-shared.js?v=43"></script>
<script>
var DB  = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
var nav = initDateNav();
var TAGS = null;

(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
})();

function api(path){
  return fetch(DB + path + '.json?v=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); });
}
function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
  });
}
function dkeyOf(v){
  var m = String(v||'').match(/^(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : null;
}

/* Same nine slots and the same keys as the guest form and the front desk. Four
   copies of a list is three chances to disagree, so if a slot is ever added
   it has to be added in all four, effectiveEta in nala-shared.js included. */
var ETA_SLOTS = { before2:'Before 2pm', '14':'Approx 2pm', '1430':'Approx 2:30pm',
                  '15':'Approx 3pm', '1530':'Approx 3:30pm',
                  '16':'Approx 4pm', '1630':'Approx 4:30pm',
                  '17':'Approx 5pm', after5:'After 5pm' };
/* New keys and old: records written before 23 Aug hold mix and out. */
var APPROACH = { most:'Most nights', few:'A few nights',
                 once:'Probably just once', unsure:'Not sure yet',
                 mix:'A mix of in and out', out:'Mostly eating out' };

/* Purpose is stored as one middot separated string, which is what the rules
   validate and what the guest form and the front desk both write. This is the
   same parser those two pages carry. Reading it raw as an array is what killed
   this page for a whole day the moment one guest answered the question. */
var PURPOSE_SEP = ' \u00b7 ';
function purposeList(v){
  if (Array.isArray(v)) return v.filter(Boolean);
  if (typeof v === 'string' && v.trim())
    return v.split(PURPOSE_SEP).map(function(x){ return x.trim(); }).filter(Boolean);
  return [];
}

/* An arrival is a stay whose FIRST night is the printed date. /stays holds one
   row per night, so without this every in house guest would get a card every
   morning of their stay. */
function arrivingOn(day, key){
  var out = [];
  for (var villa in (day || {})){
    var s = day[villa];
    if (!s || typeof s !== 'object' || !s.id) continue;
    if (dkeyOf(s.arrive) !== key) continue;
    out.push({ villa:String(villa), stay:s, pre:null });
  }
  return out.sort(function(a,b){ return (+a.villa) - (+b.villa); });
}

/* One card per booking, whatever /stays says. A guest moved between villas
   leaves an entry behind, and the Worker only clears it on that booking's next
   event. Three cards for one guest is three registration forms at the desk.
   Mews' own villa settles which one to print. */
function oneRowPerBooking(rows){
  var pick = {};
  rows.forEach(function(r){
    var id = r.stay.id;
    if (!id) return;
    var kept = pick[id];
    if (!kept){ pick[id] = r; return; }
    var says = (r.pms && r.pms.villa) || (kept.pms && kept.pms.villa) || null;
    if (says != null) pick[id] = (String(r.villa) === String(says)) ? r : kept;
    else              pick[id] = (+r.villa < +kept.villa) ? r : kept;
  });
  var out = [], seen = {};
  rows.forEach(function(r){
    var id = r.stay.id;
    if (!id || seen[id]) return;
    seen[id] = true; out.push(pick[id]);
  });
  return out;
}

function nightsLabel(s){
  var a = parseDepDate(dkeyOf(s.arrive)), b = parseDepDate(dkeyOf(s.depart));
  if (!a || !b) return '';
  var n = Math.round((b - a) / 86400000);
  return n < 1 ? '' : n + (n === 1 ? ' night' : ' nights');
}
function stayRange(s){
  var a = parseDepDate(dkeyOf(s.arrive)), b = parseDepDate(dkeyOf(s.depart));
  if (!a || !b) return '';
  var D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return D[a.getDay()]+' '+a.getDate()+' '+M[a.getMonth()]+' to '+
         D[b.getDay()]+' '+b.getDate()+' '+M[b.getMonth()];
}
function dayLabel(key){
  var d = parseDepDate(key); if (!d) return key;
  var D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return D[d.getDay()] + ' ' + d.getDate();
}

/* Which of a guest's dietaries the night's menu contains. Same comparison as
   the front desk, against the same /menutags node. On paper it earns its place
   twice over: the card goes to the kitchen, and the kitchen is who acts. */
function conflictsFor(diets){
  var hits = [];
  diets = fixDietList(diets);
  if (!diets.length || !TAGS) return hits;
  ['bread','entree','main','dessert'].forEach(function(course){
    (TAGS[course] || []).forEach(function(tag){
      diets.forEach(function(d){
        if (String(d).toLowerCase() === String(tag).toLowerCase()) hits.push(course);
      });
    });
  });
  return hits.filter(function(c,i,x){ return x.indexOf(c) === i; });
}

/* The options the guest form offers, in the guest form's order. A blank field
   prints these as boxes so reception ticks rather than writes, and so the two
   are visibly the same question when a guest answers half of it at the desk.
   Adding an option to the form means adding it here. */
var DIET_TICKS = ['Gluten','Dairy','Vegetarian','Vegan','Pescatarian',
                  'Nut allergy','Shellfish allergy','Egg allergy','Other'];
var PURPOSE_TICKS = ['Relaxing at Nala','A mix','Out exploring',
                     'Working'];
var APPROACH_TICKS = ['Most nights','A few','Just once','Not sure'];
var DINE_TICKS = ['Dining','Not dining'];
var WELL_TICKS = ['Interested','Not interested'];

function ticks(list){
  return '<div class="ticks">' + list.map(function(t){
    return '<div class="tk"><i></i>' + t + '</div>'; }).join('') + '</div>';
}

/* A value, or something to fill in. The card is the working document at the
   desk, so an unanswered question has to be answerable on paper rather than
   absent. Which form that takes depends on the question:

     opts.ticks   the form's own options, as boxes
     opts.line    a rule under the boxes, for Dietary's "Other"
     opts.count   "How many ____", because Dining alone is not a cover count
     opts.lines   n writing lines, for a question with no fixed answers
     neither      a single rule

   An ANSWERED field prints as plain text with no boxes. A tick row beside a
   filled answer invites a second answer, and the card would then carry two. */
function row(label, value, opts){
  opts = opts || {};
  var inner;
  if (value) inner = '<div class="val">' + value + '</div>';
  else if (opts.ticks) inner = '<div class="val">' + ticks(opts.ticks) +
        (opts.line ? '<div class="writeline"></div>' : '') +
        (opts.count ? '<div class="count">How many <span></span></div>' : '') + '</div>';
  else if (opts.lines) {
    var l = ''; for (var i=0;i<opts.lines;i++) l += '<div></div>';
    inner = '<div class="val notelines">' + l + '</div>';
  }
  else inner = '<div class="val blank"></div>';
  return '<div class="row' + (opts.cls ? ' ' + opts.cls : '') + '">' +
         '<div class="lbl">' + label + '</div>' + inner + '</div>';
}

function cardHTML(r){
  var s = r.stay, p = r.pre || {};
  var h = '<div class="card">' +
    '<div class="c-head">' +
      '<div class="c-villa">' + r.villa + '</div>' +
      '<div class="c-who">' +
        '<div class="c-name">' +
          esc(((s.first||'') + ' ' + (s.last||'')).trim() || 'Guest') + '</div>' +
        '<div class="c-stay">' +
          /* The number staff read in Mews. On paper it is the only way back to
             the PMS record, since the card carries no GUID. */
          (s.number ? 'Mews ' + esc(s.number) + ' \u00b7 ' : '') + stayRange(s) +
          /* Nights and party size in one bold run, on the same line as the
             dates. Reception reads these two out; the dates are reference. */
          ((nightsLabel(s) || s.adults) ? ' \u00b7 <b>' +
            [nightsLabel(s),
             s.adults ? s.adults + (Number(s.adults)===1 ? ' adult' : ' adults') : ''
            ].filter(Boolean).join(' \u00b7 ') + '</b>' : '') + '</div>' +
      '</div>' +
    '</div>';

  h += row('Arriving', p.arriveSlot
        ? esc(ETA_SLOTS[p.arriveSlot] || p.arriveSlot) +
          (p.arriveNote ? ' \u00b7 ' + esc(p.arriveNote) : '')
        : '', { cls:'eta' });

  /* A second adult gets their own line whenever Mews says there is one, and
     whenever anyone has already named one. Named if the guest gave a name at
     pre-arrival or Mews sent one - companionOf holds that order for every
     surface - a rule to write on if not. It is the first thing reception
     asks and there was nowhere to put the answer. */
  var second = companionOf(p, s);
  if (Number(s.adults) > 1 || second)
    h += row('Second guest', second ? esc(second) : '');

  h += row('Dinner tonight', p.dining === undefined ? ''
        : (p.dining ? 'Dining \u00b7 ' + (p.pax || '') +
             (Number(p.pax)===1 ? ' guest' : ' guests') : 'Not dining'),
        { ticks:DINE_TICKS, count:true });

  var diet = p.noDiets ? 'None to declare'
           : ((p.diets && p.diets.length) ? esc(fixDietList(p.diets).join(' \u00b7 ')) : '');
  if (diet && p.dnote) diet += '<br>' + esc(p.dnote);
  /* The kitchen reads this card. If the night's menu contains something the
     guest declared, it says so here in as many words. */
  if (diet && p.dining !== false){
    var clash = conflictsFor(p.diets);
    if (clash.length)
      diet += '<br><span class="flag">Menu conflict: ' + clash.join(', ') + '</span>';
  }
  h += row('Dietary', diet, { ticks:DIET_TICKS, line:true });

  var purp = purposeList(p.purpose).join(' \u00b7 ');
  h += row('Purpose', purp ? esc(purp) : '', { ticks:PURPOSE_TICKS });
  h += row('Dining plans', p.approach ? esc(APPROACH[p.approach] || p.approach) : '',
        { ticks:APPROACH_TICKS });
  h += row('Occasion', p.occasion ? esc(p.occasion) : '');
  h += row('Wellness', p.wellness === undefined ? ''
        : (p.wellness
            ? 'Interested' + (p.wellDay ? ' \u00b7 ' + dayLabel(p.wellDay) : '') +
              (p.wellTime ? ' \u00b7 ' + esc(p.wellTime) : '')
            : 'Not interested'), { ticks:WELL_TICKS });
  h += row('Booking notes', p.note ? esc(p.note) : '', { lines:4 });

  h += '<div class="sig"><div><span></span>Guest signature</div>' +
       '<div><span></span>Checked in by</div></div>';
  return h + '</div>';
}

function render(rows){
  document.getElementById('cards').innerHTML = rows.length
    ? rows.map(cardHTML).join('')
    : '<div class="empty">No arrivals on this date.</div>';
  var d = new Date();
  document.getElementById('stamp').textContent =
    'Printed ' + dateLabel(d) + ' ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function load(){
  var key = nav.todayKey();
  api('/menutags/'+key).then(function(t){ TAGS = fixTagNames(t); }).catch(function(){ TAGS = null; })
    .then(function(){ return api('/stays/'+key); })
    .then(function(day){
      var rows = arrivingOn(day, key);
      render(rows);
      /* One read per booking. /bookings cannot be listed by design. */
      return Promise.all(rows.map(function(r){
        return Promise.all([
          api('/bookings/'+r.stay.id+'/prearrival').catch(function(){ return null; }),
          api('/bookings/'+r.stay.id+'/pms').catch(function(){ return null; })
        ]).then(function(res){ r.pre = res[0]; r.pms = res[1]; });
      })).then(function(){ render(oneRowPerBooking(rows)); });
    })
    .catch(function(e){
      /* The console line is for a device debugger; the second line on screen
         is for everyone else, because reception has a phone and a phone has
         no console. Today's failure gets named where it can be read. */
      console.error('registration load failed:', e);
      document.getElementById('cards').innerHTML =
        '<div class="empty">Could not load arrivals. This is usually the connection.' +
        '<br><span style="font-size:11px">' + esc(e && (e.message || e)) + '</span></div>';
    });
}

/* The shared filter, not a copy. Each of these pages carried its own with its
   own map, all written before nala-shared.js grew one, and none had been
   touched since: they knew nothing of Publish Menu, Dietary or the
   Notifications switch, and they hid whatever they did not recognise rather
   than leaving it alone. So those three vanished on exactly the pages that
   kept a copy and stayed on the pages that did not.

   One copy, and it leaves an unlisted link visible on purpose: a new page
   should be merely ungated until somebody says otherwise, not invisible until
   somebody remembers a second file. */
function navFilter(role){
  if (window.NALA_NAVFILTER) window.NALA_NAVFILTER(role);
}

function showAccess(allowed, e){
  var box = document.getElementById('noAccess');
  var on = !allowed;
  box.innerHTML = !on ? '' :
    (e ? '<div>Could not check access. This is usually the connection, '
       + 'not your login.</div>'
       + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
       : 'This login has no access to registration cards. See the manager.');
  if (on && !e){
    var home = homeFor(window.NALA_ROLE);
    if (home && home !== location.pathname.split('/').pop()){
      location.replace(home); return;
    }
  }
  box.className = 'noaccess' + (on ? ' show' : '');
  ['cards','stamp'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.style.display = on ? 'none' : '';
  });
  if (!on) load();
}

window.NALA_ROLE = null;
(function gate(){
  if (!window.firebase || !firebase.auth || typeof loadStaff !== 'function')
    return setTimeout(gate, 40);
  var A; try { A = firebase.auth(); } catch(e){ return setTimeout(gate, 40); }
  if (!A || !A.onAuthStateChanged) return setTimeout(gate, 40);
  A.onAuthStateChanged(function(u){
    if (!u) return;
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role;
      window.NALA_USER = u;
      document.getElementById('navWrap').style.display = 'block';
      navFilter(role);
      showAccess(can(role, 'editBookings'), e);
    });
  });
})();
</script>
</body>
</html>
