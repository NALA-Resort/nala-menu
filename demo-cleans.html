<style>
/* NALA staff UI - shared controls. See STYLEGUIDE.md.
   Pages declare <body class="tier-app"> or <body class="tier-print">.  */

:root {
  --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA; --red:#A8321E;
  --ui-font:Helvetica,Arial,sans-serif;
}

/* tier surfaces used by controls */
.tier-app   { --ctl-bg:var(--cream); --ctl-bdr:var(--rule); --ctl-ink:var(--ink); }
.tier-print { --ctl-bg:#fff;         --ctl-bdr:#ddd;        --ctl-ink:#111;      }

/* ── one header row: [Today] [<] date [>] ....... [menu] ── */
.navwrap { position:relative; margin-left:auto; z-index:500; font-family:var(--ui-font); }
.navbtn  { border:1px solid var(--ctl-bdr); background:var(--ctl-bg);
           border-radius:8px; cursor:pointer; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:4px; padding:0;
           -webkit-tap-highlight-color:transparent; }
.navbtn span { display:block; width:16px; height:1.6px; background:var(--ctl-ink); }
.navdrop { display:none; position:absolute; right:0; top:42px; background:var(--ctl-bg);
           border:1px solid var(--ctl-bdr); border-radius:9px; min-width:132px;
           box-shadow:0 4px 14px rgba(0,0,0,.09); padding:5px 0; }
.navdrop.open { display:block; }
.navdrop a { display:block; padding:12px 18px; font-size:10px; letter-spacing:.14em;
             text-transform:uppercase; color:var(--ctl-ink); text-decoration:none;
             white-space:nowrap; }

/* ── floating footer ──────────────────────────────────────
   sticky pins it while scrolling long pages; the flex column
   below pins it to the screen bottom on short pages too      */
body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
body > .wrap { flex:1 0 auto; display:flex; flex-direction:column; width:100%; }
.wrap > .foot, body > .foot { margin-top:auto; }
.foot { position:sticky; bottom:0; z-index:40; display:flex; gap:8px; flex-wrap:wrap;
        background:var(--ctl-bg); border-top:1px solid var(--ctl-bdr); margin-top:18px;
        padding:10px 0 calc(10px + env(safe-area-inset-bottom)); }
.foot .btn { flex:1; text-align:center; white-space:nowrap; }
/* the row sits hard against the bottom of the screen: soften only the two
   corners that land in the phone's own rounded corners                     */
.foot .btn:first-child { border-bottom-left-radius:8px; }
.foot .btn:last-child  { border-bottom-right-radius:8px; }

/* ── standard header: kicker, then one date row ─────── */
.daterow { display:flex; align-items:center; gap:8px;
           margin-bottom:12px; font-family:var(--ui-font); }
.daterow .date { font-size:13px; font-weight:bold; letter-spacing:.1em;
                 text-transform:uppercase; color:var(--ctl-ink); white-space:nowrap;
                 padding:0 2px; }
.dnav { width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
        background:var(--ctl-bg); border:1px solid var(--ctl-bdr); border-radius:7px;
        font-size:16px; line-height:1; color:var(--ctl-ink); cursor:pointer; padding:0;
        -webkit-tap-highlight-color:transparent; }
.dnav:active { background:var(--ctl-bdr); }
.dnav.today { width:auto; padding:0 12px; font-size:9.5px; letter-spacing:.13em;
              text-transform:uppercase; }
.dnav.today:disabled { opacity:.35; cursor:default; }
.navbtn { width:42px; height:36px; }
/* page name on paper only - the screen row replaces it */
.printkick { display:none; }
@media print { .printkick { display:block; text-align:center; font-family:var(--ui-font);
  font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:#666;
  margin-bottom:8px; } }

/* ── information is plain typography, never boxed ───── */
.stats { display:flex; justify-content:center; gap:36px; margin:16px 0 6px;
         font-family:var(--ui-font); }
.stat { text-align:center; }
.stat-n { display:block; font-size:27px; line-height:1; color:var(--ctl-ink);
          font-family:Georgia,serif; }
.stat-l { display:block; font-size:8px; letter-spacing:.2em; text-transform:uppercase;
          color:var(--mid); margin-top:6px; }
.stat.warn .stat-n { color:var(--red); }

/* keep controls off paper */
@media print {
  .navwrap, .foot, .dnav { display:none !important; }
  body { display:block; min-height:0; }   /* flex column off paper */
}

</style>

<script>
/* NALA shared helpers - one copy of the logic every staff page repeats.
   Plain globals, same names the pages already use, so page code reads
   unchanged. See STYLEGUIDE.md and AUDIT.md.                      v2 */

var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
var ROOMS = 17;
var ALLERGENS = ['Nut allergy','Shellfish allergy','Egg allergy'];

/* ── dates ─────────────────────────────────────────────────── */
function dkey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// Safari only accepts 3 fractional digits in an ISO date; Python writes 6.
// Trim them so any timestamp parses on every browser.
function parseISO(s){
  if (!s) return null;
  var t = String(s).trim().replace(/(\.\d{3})\d+/, '$1');
  var d = new Date(t);
  if (!isNaN(d)) return d;
  d = new Date(t.replace(/\.\d+/, ''));      // drop fractions entirely
  return isNaN(d) ? null : d;
}

function parseDepDate(s){
  if(!s) return null;
  s = String(s).trim();
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  var i = s.match(/^(\d{4})-(\d{2})-(\d{2})/);       // ISO - build a LOCAL date,
  if (i) return new Date(+i[1], +i[2]-1, +i[3]);     // never via the UTC parser
  var d = new Date(s);
  return isNaN(d) ? null : d;
}

function ord(n){
  var s=['th','st','nd','rd'], v=n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

/* the one date format: Wd Dth Mon (see STYLEGUIDE.md) */
function dateLabel(d){
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()]+' '+ord(d.getDate())+' '+mo[d.getMonth()];
}

/* ── the standard header's date row ────────────────────────────
   Wires ‹ › Today and writes the one date format into #date/#title.
   Tolerates missing arrows (hc tally shows the date alone).
   Returns { VIEW, todayKey, isToday } for the page to use.        */
function initDateNav(){
  var VIEW = (function(){
    var q = new URLSearchParams(location.search).get('date');
    if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) {
      var p = q.split('-');
      return new Date(+p[0], +p[1]-1, +p[2]);
    }
    return new Date();
  })();
  function todayKey(){ return dkey(VIEW); }
  function isToday(){ return dkey(VIEW) === dkey(new Date()); }
  function shiftDate(n){
    var d = new Date(VIEW); d.setDate(d.getDate()+n);
    var q = new URLSearchParams(location.search);
    q.set('date', dkey(d));
    location.search = q.toString();
  }
  function goToday(){
    var q = new URLSearchParams(location.search);
    q.delete('date');
    location.search = q.toString();
  }
  var el = document.getElementById('date') || document.getElementById('title');
  if (el) el.textContent = dateLabel(VIEW);
  var pv = document.getElementById('dPrev'), nx = document.getElementById('dNext'),
      td = document.getElementById('dToday');
  if (pv) pv.onclick = function(){ shiftDate(-1); };
  if (nx) nx.onclick = function(){ shiftDate(1); };
  if (td){
    td.onclick = function(e){ if (e) e.preventDefault(); goToday(); };
    td.disabled = isToday();     // always visible; dimmed when already on today
  }
  return { VIEW:VIEW, todayKey:todayKey, isToday:isToday };
}

/* ── room-guest look-back ──────────────────────────────────────
   Most recent record for a room across the previous fortnight.
   A guest who opened the link days ago still appears, unless
   they have departed. Reads each date individually so no
   permission is needed on the parent node.                       */
function fetchRoomGuests(endKey, days){
  days = days || 14;
  var parts = endKey.split('-');
  var end = new Date(+parts[0], +parts[1]-1, +parts[2]);
  var jobs = [], keys = [];
  for (var i = days - 1; i >= 0; i--) {
    var d = new Date(end); d.setDate(d.getDate() - i);
    var k = dkey(d);
    keys.push(k);
    jobs.push(
      fetch(DB + '/roomguests/' + k + '.json?v=' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
    );
  }
  return Promise.all(jobs).then(function(res){
    var all = {};
    res.forEach(function(day, i){ if (day) all[keys[i]] = day; });
    return all;
  });
}

function resolveRoomGuests(all, todayK){
  var out = {};
  var dates = Object.keys(all || {}).filter(function(d){ return d <= todayK; }).sort();
  dates.forEach(function(d){
    var day = all[d] || {};
    for (var room in day){ out[room] = day[room]; }   // later dates overwrite earlier
  });
  // drop anyone checked out by this sheet's dinner: a guest departing on
  // the sheet date leaves that morning, so their last sheet is the night before
  for (var room in out){
    var dep = out[room] && out[room].departs;
    if (!dep) continue;
    var p = parseDepDate(dep);
    if (p && dkey(p) <= todayK) delete out[room];
  }
  return out;
}

/* ── guest misc ────────────────────────────────────────────── */
function tidyPhone(p){
  if (!p) return '';
  p = String(p).replace(/[^\d]/g,'');
  if (p.length === 9 && p[0] === '4') p = '0' + p;   // restore a lost leading zero
  return p;
}

/* ── dietary conflicts against the tagged menu ─────────────── */
function menuConflicts(menu, diets){
  if (!diets || !diets.length || !menu) return [];
  var hits = [];
  ['bread','entree','main','dessert'].forEach(function(k){
    var dish = menu[k];
    if (!dish || !dish.conflicts) return;
    dish.conflicts.forEach(function(tag){
      diets.forEach(function(d){
        if (String(d).toLowerCase() === String(tag).toLowerCase())
          hits.push({ dish: dish.name || k, diet: d });
      });
    });
  });
  return hits;
}

function dietHTML(diets, sep, cls){
  if(!diets||!diets.length) return '';
  cls = cls || 'allergen';
  return diets.map(function(d){
    return (ALLERGENS.indexOf(d)>-1 || /allerg/i.test(d)) ? '<span class="'+cls+'">'+d+'</span>' : d;
  }).join(sep || ' \u00b7 ');
}

/* ── housekeeping variants - deliberately different from above ──
   resolveRoomGuestsHK KEEPS guests departing today: they are the
   cleans. The dinner resolver drops them. Do not merge the two.   */
function resolveRoomGuestsHK(all, todayK){
  var out = {};
  var dates = Object.keys(all || {}).filter(function(d){ return d <= todayK; }).sort();
  dates.forEach(function(d){
    var day = all[d] || {};
    for (var room in day){ out[room] = day[room]; }
  });
  for (var room in out){
    var dep = out[room] && out[room].departs;
    if (!dep) continue;
    var p = parseDepDate(dep);
    if (p && dkey(p) < todayK) delete out[room];   // gone before today
  }
  return out;
}

/* one room, one record: staff override beats the guest's own answer,
   whoever opened the link fills the gaps                            */
function roomRecord(n, responses, manual, roomguests){
  var mk = 'room-'+n, m = manual[mk];
  var best = null;
  for (var k in responses){
    var g = responses[k];
    if (String(g.room) !== String(n)) continue;
    if (!best || (g.at||'') > (best.at||'')) best = g;
  }
  var known = roomguests[String(n)] || {};
  if (m && m.override) return Object.assign({}, known, best || {}, m, { room:String(n) });
  if (best) return Object.assign({}, known, best);
  if (m)    return Object.assign({}, known, m, { room:String(n) });
  if (known.name) return Object.assign({}, known, { room:String(n), status:null });
  return null;
}

/* clean = departing on the sheet date; service = staying on;
   verify = no usable data. The housekeeping rule, in one place.  */
function hkClassify(rec, todayK, hk){
  /* A manager can set the job for the day by hand - most often on a villa the
     booking data cannot confirm - and that choice beats what the dates imply.
     Stored at /hk/<date>/<villa>/kind so it expires with the day.          */
  if (hk && (hk.kind === 'clean' || hk.kind === 'svc' || hk.kind === 'vac')) return hk.kind;
  if (rec && rec.status === 'vacant') return 'vac';
  if (rec){
    var d = parseDepDate(rec.departs);
    var dk = d ? dkey(d) : null;
    if (dk === todayK) return 'clean';
    if (dk && dk > todayK) return 'svc';
    return 'ver';       // stale or missing departure
  }
  return 'ver';         // no data at all
}

</script>
<script>
// dates, look-back, room records, clean/service rules: nala-shared.js
// this board is locked to today by design - no browsed dates
function todayKey(){ return dkey(new Date()); }
document.getElementById('title').textContent = dateLabel(new Date());

function api(path){ return fetch(DB+path+'.json?v='+Date.now()).then(function(r){return r.json();}); }

var STATE = { rows:[], hk:{} };

function load(){
  return Promise.all([ api('/responses/'+todayKey()), api('/manual/'+todayKey()),
                fetchRoomGuests(todayKey()), api('/hk/'+todayKey()) ])
  .then(function(res){
    var responses=res[0]||{}, manual=res[1]||{}, hk=res[3]||{};
    var roomguests=resolveRoomGuestsHK(res[2]||{}, todayKey());

    var rows=[];
    for (var n=1;n<=ROOMS;n++){
      var r=roomRecord(n, responses, manual, roomguests);
      rows.push({ n:n, kind:hkClassify(r, todayKey(), hk[n]),
                  base:hkClassify(r, todayKey()) });
    }
    // services first: they are attempted during breakfast, before the
    // departure cleans open up. Then cleans, verify, vacant, room order
    // within each block.
    var korder={svc:0, clean:1, ver:2, vac:3};
    rows.sort(function(a,b){ return (korder[a.kind]-korder[b.kind]) || (a.n-b.n); });
    STATE.rows=rows; STATE.hk=hk;
    render();
  });
}

function mins(iso){
  var t=parseISO(iso); if (!t) return null;
  return Math.max(0, Math.round((Date.now()-t.getTime())/60000));
}
function hhmm(iso){
  var t=parseISO(iso); if (!t) return '';
  return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
}

function render(){
  var g=document.getElementById('grid'); g.innerHTML='';
  var nClean=0,nSvc=0,nDone=0;
  STATE.rows.forEach(function(row){
    var h=STATE.hk[row.n]||{};
    if (row.kind==='clean') nClean++;
    if (row.kind==='svc') nSvc++;
    if (h.done) nDone++;

    var cls='tile';
    if (row.kind==='vac') cls+=' vac';
    else if (h.done) cls+=' done';
    else if (h.departed) cls+=' dep';
    else if (h.bfast) cls+=' bfast';

    var chip='';
    if (row.kind==='clean') chip='<span class="chip">Clean</span>';
    else if (row.kind==='svc') chip='<span class="chip svc">Service</span>';
    else if (row.kind==='ver') chip='<span class="chip ver">Unknown</span>';
    else chip='<span class="sub">Vacant</span>';

    var sub='';
    if (row.kind!=='vac'){
      if (h.done) sub='Done '+hhmm(h.done);
      else if (h.departed) sub='Departed';
      else if (h.bfast) sub='B\u2019fast <b>'+mins(h.bfast)+'m</b>';
      else if (row.kind==='ver') sub='';   /* the pill already says Unknown */
      else sub='Occupied';
    }

    var el=document.createElement('button');
    el.className=cls;
    el.innerHTML='<span class="rn">'+row.n+'</span>'+chip+'<span class="sub">'+sub+'</span>';
    el.onclick=function(){ openSheet(row); };
    g.appendChild(el);
  });
  document.getElementById('nClean').textContent=nClean;
  document.getElementById('nSvc').textContent=nSvc;
  document.getElementById('nDone').textContent=nDone;
}

// ── writes ─────────────────────────────────────────────────
function patchRoom(n, obj){
  return fetch(DB+'/hk/'+todayKey()+'/'+n+'.json', {
    method:'PATCH', body:JSON.stringify(obj)
  }).then(function(r){
    if (!r.ok) throw new Error('rejected');
    return r.json();
  });
}
function setField(n, obj, errEl){
  var prev=JSON.parse(JSON.stringify(STATE.hk[n]||{}));
  STATE.hk[n]=Object.assign({},prev,obj);
  for (var k in obj){ if (obj[k]===null) delete STATE.hk[n][k]; }
  render();
  return patchRoom(n,obj).then(function(){ closeSheet(); })
  .catch(function(e){
    STATE.hk[n]=prev; render();
    errEl.textContent = (e && e.message==='rejected')
      ? 'The change was not allowed - tell the manager.'
      : 'No connection - try again.';
  });
}

function setKind(k){
  setField(CUR.n, { kind:k }, document.getElementById('perr'));
}

// ── popup ──────────────────────────────────────────────────
var CUR=null;
function openSheet(row){ CUR=row; drawSheet('menu'); document.getElementById('ov').className='ov show'; }
function closeSheet(){ document.getElementById('ov').className='ov'; CUR=null; }
document.getElementById('ov').onclick=function(e){ if (e.target===this) closeSheet(); };

function drawSheet(mode){
  var b=document.getElementById('sheetBox');
  var n=CUR.n, h=STATE.hk[n]||{};
  var kindName = CUR.kind==='clean' ? 'Clean - departing today'
               : CUR.kind==='svc'   ? 'Service - staying on'
               : CUR.kind==='vac'   ? 'Vacant'
               : 'Unknown';
  if (h.kind) kindName += ' - set by staff';
  var head='<h2>Villa '+n+'</h2><div class="st">'+kindName+'</div>';
  var err='<div class="perr" id="perr"></div>';

  if (mode==='menu'){
    var rows='';
    /* Nothing can be completed on a villa whose job is unknown - decide what
       it is first. Same shape as a vacant villa: job controls only.      */
    if (CUR.kind==='vac' || CUR.kind==='ver'){
      if (window.IS_MANAGER){
        rows+='<div class="pdiv">Job for today</div>';
        rows+='<button class="pbtn" onclick="drawSheet(\'k-clean\')">To be cleaned</button>';
        rows+='<button class="pbtn" onclick="drawSheet(\'k-svc\')">To be serviced</button>';
        if (CUR.kind!=='vac') rows+='<button class="pbtn" onclick="drawSheet(\'k-vac\')">Mark as vacant</button>';
        if (h.kind) rows+='<button class="pbtn warn" onclick="drawSheet(\'k-none\')">'+
          ((CUR.base==='clean'||CUR.base==='svc') ? 'Use booking dates' : 'Back to unknown')+'</button>';
      }
      rows+='<button class="pbtn ghost" onclick="closeSheet()">Close</button>';
      b.innerHTML=head+rows+err;
      return;
    }
    if (h.done){
      rows+='<button class="pbtn warn" onclick="drawSheet(\'undone\')">Undo done</button>';
    } else {
      rows+='<button class="pbtn solid" onclick="drawSheet(\'done\')">Villa done</button>';
      if (h.bfast){
        rows+='<button class="pbtn" disabled style="opacity:.6">Seated at breakfast '+hhmm(h.bfast)+' ('+mins(h.bfast)+'m ago)</button>';
        rows+='<button class="pbtn warn" onclick="drawSheet(\'clearbf\')">Clear breakfast</button>';
      } else {
        rows+='<button class="pbtn" onclick="drawSheet(\'bfast\')">Guest at breakfast</button>';
      }
      if (CUR.kind==='clean'){
        rows += h.departed
          ? '<button class="pbtn warn" onclick="drawSheet(\'undep\')">Undo departed</button>'
          : '<button class="pbtn" onclick="drawSheet(\'dep\')">Guest departed</button>';
      }
    }
    if (window.IS_MANAGER){
      rows+='<div class="pdiv">Job for today</div>';
      if (CUR.kind!=='clean') rows+='<button class="pbtn" onclick="drawSheet(\'k-clean\')">To be cleaned</button>';
      if (CUR.kind!=='svc')   rows+='<button class="pbtn" onclick="drawSheet(\'k-svc\')">To be serviced</button>';
      if (CUR.kind!=='vac')   rows+='<button class="pbtn" onclick="drawSheet(\'k-vac\')">Mark as vacant</button>';
      /* Only offer the dates back when they actually decide something. On a
         villa the dates cannot place, reverting just returns it to unknown,
         so say that instead of pretending there is a booking to fall back on. */
      if (h.kind){
        rows += (CUR.base==='clean' || CUR.base==='svc')
          ? '<button class="pbtn warn" onclick="drawSheet(\'k-none\')">Use booking dates</button>'
          : '<button class="pbtn warn" onclick="drawSheet(\'k-none\')">Back to unknown</button>';
      }
    }
    rows+='<button class="pbtn ghost" onclick="closeSheet()">Close</button>';
    b.innerHTML=head+rows+err;
  }

  var KINDS = {
    'k-clean': { v:'clean', q:'Set villa '+n+' to be cleaned?',   y:'Yes - to be cleaned',  cls:'solid' },
    'k-svc'  : { v:'svc',   q:'Set villa '+n+' to be serviced?',  y:'Yes - to be serviced', cls:'solid' },
    'k-vac'  : { v:'vac',   q:'Mark villa '+n+' as vacant?',      y:'Yes - vacant',         cls:'solid' },
    'k-none' : { v:null,
                 q:(CUR.base==='clean' || CUR.base==='svc')
                   ? 'Go back to the booking dates for villa '+n+'?'
                   : 'Clear the job for villa '+n+'? It will show as unknown.',
                 y:'Yes - clear', cls:'warn' }
  };
  if (KINDS[mode]){
    var K = KINDS[mode];
    b.innerHTML = head +
      '<div class="st" style="margin-bottom:6px">'+K.q+'</div>'+
      '<button class="pbtn '+K.cls+'" id="kGo">'+K.y+'</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
    /* the value is handed over directly rather than serialised into an
       onclick attribute, where its quotes had nowhere safe to go */
    document.getElementById('kGo').onclick = function(){ setKind(K.v); };
    return;
  }

  if (mode==='bfast'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Seated when?</div>'+
      '<button class="pbtn solid" onclick="stampBf(0)">Just now</button>'+
      '<div class="timerow">'+
        '<button class="pbtn" onclick="stampBf(5)">5 min ago</button>'+
        '<button class="pbtn" onclick="stampBf(10)">10 min ago</button>'+
        '<button class="pbtn" onclick="stampBf(15)">15 min ago</button>'+
      '</div>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }

  if (mode==='done'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Mark room '+n+' as done?</div>'+
      '<button class="pbtn solid" onclick="setField('+n+',{done:new Date().toISOString()},document.getElementById(\'perr\'))">Yes - done</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
  if (mode==='undone'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Remove the done mark from room '+n+'?</div>'+
      '<button class="pbtn warn" onclick="setField('+n+',{done:null},document.getElementById(\'perr\'))">Yes - not done</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
  if (mode==='dep'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Has the guest checked out of room '+n+'?</div>'+
      '<button class="pbtn solid" onclick="setField('+n+',{departed:true},document.getElementById(\'perr\'))">Yes - departed</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
  if (mode==='undep'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Undo departed for room '+n+'?</div>'+
      '<button class="pbtn warn" onclick="setField('+n+',{departed:null},document.getElementById(\'perr\'))">Yes - undo</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
  if (mode==='clearbf'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Clear the breakfast mark for room '+n+'?</div>'+
      '<button class="pbtn warn" onclick="setField('+n+',{bfast:null},document.getElementById(\'perr\'))">Yes - clear</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
}
function stampBf(minsAgo){
  var t=new Date(Date.now()-minsAgo*60000).toISOString();
  setField(CUR.n, {bfast:t}, document.getElementById('perr'));
}

load();
setInterval(function(){ if(!CUR) render(); }, 30000);          // tick elapsed times
setInterval(function(){ if(!CUR) load().catch(function(){}); }, 90000);  // background re-fetch
</script>
