<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
  :root { --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA; --red:#A8321E;
          --green:#E4EDE2; --greenb:#7E937A; --amber:#F6EAD5; --amberb:#C29A55;
          --blue:#E7E9EF; --blueb:#8A90A8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--ink); font-family:var(--ui-font);
         padding:calc(24px + env(safe-area-inset-top)) 18px 0;
         -webkit-tap-highlight-color:transparent; }
  /* height, not min-height, and a shrinkable wrap: without these the column
     grows past the screen and the page scrolls, instead of the grid taking
     the space it has and scrolling inside itself.                       */
  body { height:100vh; height:100dvh; }
  /* flex:1 1, not the shared 1 0: a wrap that refuses to shrink pushes the
     page past the screen however small the tiles are told to be.       */
  /* matches the shared "body > .wrap" selector: a plain .wrap rule loses to
     it and silently does nothing. flex:1 1, not the shared 1 0, because a
     wrap that refuses to shrink pushes the page past the screen however
     small the tiles are told to be.                                     */
  body > .wrap { max-width:520px; margin:0 auto; flex:1 1 auto; min-height:0; }

  .brand { font-family:var(--ui-font); font-size:10px; letter-spacing:.35em;
           color:var(--mid); text-transform:uppercase; text-align:center; }
  h1 { font-size:19px; font-weight:bold; text-align:center; margin:8px 0 4px;
       font-family:var(--ui-font); letter-spacing:.02em; }

  /* The board takes whatever height the phone has left after the header,
     stats, legend and footer, and the rows share it. No fixed tile height,
     because a number that fits a 14 Pro overflows an SE and leaves a 15 Plus
     half empty. 17 villas land on one screen on both; the tiles simply
     breathe more on the bigger one.
     The floor is a safety net, NOT the working size: set it near the size
     you want and the rows take exactly that, so a screen one pixel short
     scrolls for no reason. Set low, the rows share the real space and land
     wherever it allows. Below the floor the grid scrolls instead, because
     an unhittable target is worse than a scroll.                        */
  /* On a short phone the furniture is what does not fit, so the furniture
     gives way first: the tiles are the thing being tapped and should be the
     last to shrink.                                                     */
  /* Three columns on any phone held upright, whatever the width. The grid was
     choosing by width alone, so a 320 point screen lost the third column to
     the body's own padding and dropped to two, which is six rows of villas and
     a board that has to be scrolled. Found while fixing landscape, on a size
     the suite was not checking in a browser.

     Named as a count rather than a minimum width, because what has to hold
     here is the number of columns, and a minimum width only implies it. */
  @media (orientation: portrait) and (max-width: 520px) {
    .grid { grid-template-columns:repeat(3, 1fr) !important; }
  }

  /* A short phone held upright: six rows of villas and very little height to
     put them in. The rows give up what they can while staying above the tap
     target, rather than the board scrolling, because the whole point of this
     screen is seeing every villa at once. */
  @media (orientation: portrait) and (max-height: 620px) {
    .grid { grid-auto-rows:minmax(46px, 1fr) !important; gap:7px !important; }
    .tile { padding:6px 6px 5px !important; gap:3px !important; }
    .tile .rn { font-size:19px !important; }
    .tile .sub { font-size:8.5px !important; min-height:10px !important; }
    .legend { padding:4px 5px !important; font-size:6px !important; gap:1px !important; }
    .legend .lgb { width:12px; height:5px; }
  }

  /* Landscape on a phone. The height is what runs out, not the width, and the
     grid was choosing columns by width alone: five columns of seventeen villas
     is four rows, and four rows do not fit 412 points of height. Reported from
     a Galaxy held sideways.

     Six columns makes it three rows, which does. Everything else in the
     furniture gives up what it can, in the same order as the short-screen rule
     below: the tiles are the thing being tapped and shrink last. */
  @media (orientation: landscape) and (max-height: 560px) {
    body { padding-top:calc(6px + env(safe-area-inset-top)); }
    .grid { grid-template-columns:repeat(6, 1fr) !important;
            grid-auto-rows:minmax(46px, 1fr) !important; gap:6px !important; }
    .stats { margin:1px 0 4px !important; gap:10px !important; }
    .stat-n { font-size:13px !important; }
    .stat-l { font-size:6.5px !important; }
    .tile { padding:5px 5px 4px !important; gap:3px !important; }
    .tile .rn { font-size:17px !important; }
    .tile .sub { font-size:8px !important; min-height:10px !important; }
    .tile .who-badge { top:3px; right:3px; min-width:16px; height:16px;
                       font-size:8px; border-radius:8px; }
    .legend { padding:3px 4px !important; font-size:5.5px !important;
              gap:1px !important; }
    .legend .lgb { width:11px; height:5px; }
  }

  @media (max-height: 720px) {
    body { padding-top:calc(12px + env(safe-area-inset-top)); }
    .stats { margin-bottom:6px !important; }
    .stat-n { font-size:22px; }
    .grid { gap:8px !important; }
    .legend { padding:4px 5px !important; font-size:6.5px !important; }
  }

  /* Buttons are matched on the action in their onclick, so the sheet keeps
     building exactly as it did and only the offer changes. Every undo is
     listed on its own: the quote sits before the "un", so a pattern for
     'dep' does NOT catch 'undep', and leaving them off handed the waiter an
     Undo departed button on a villa whose guest had gone.

     Departures are NOT on this list: a waiter clearing breakfast sees a
     guest leave before anyone else does, so they mark it and can take it
     back. What stays hidden is the work itself and the pushing.        */
  body.marks-limited .pbtn[onclick*="'push'"],
  body.marks-limited .pbtn[onclick*="'unpush'"],
  body.marks-limited .pbtn[onclick*="'done'"],
  body.marks-limited .pbtn[onclick*="'undone'"] { display:none; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
          gap:10px; flex:1 1 auto; min-height:0;
          grid-auto-rows:minmax(56px,1fr); overflow-y:auto; }
  .tile { border:1.2px solid var(--rule); border-radius:10px; background:#fff;
          padding:10px 8px 9px; text-align:center; cursor:pointer; color:var(--ink);
          font-family:var(--ui-font); position:relative; min-height:0;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
  .tile .rn { font-size:20px; font-weight:bold; }
  /* Clean is a solid ink pill, Service a faint outline: the two jobs must be
     tellable apart at arm's length, not by reading the word.               */
  /* No words. The job is a bar, read by colour and by pattern, and the words
     are what kept breaking: they wrapped, then they ellipsised, then they had
     to be shrunk until they barely read anyway. A bar cannot wrap.

     The word is still on the element, in aria-label and title, so a screen
     reader says it and a long press shows it. The legend below the grid is
     what teaches the colours. */
  /* Every bar is the same size. Thin against thick was a comparison, and a
     comparison needs both examples on screen at once: on a board that is all
     services you cannot tell a thin bar from a thick one, because there is
     nothing to hold it against. Reported 19 Aug, and it is right.

     So the bar says what the job IS, in its own right, using the colours the
     tiles already use for the same jobs. Blue is a clean and the tile turns
     blue when it is ready to be cleaned; green is a service and the tile turns
     green when it is ready to service. One meaning, two places.

     A clean that also has somebody arriving is half clean blue and half
     arrival amber: the two jobs it actually is, rather than a third mark
     standing for the pair.

     The saturated tones are used, not the tints. The tints are backgrounds
     built to sit behind text; at 9px on cream they would be nearly invisible. */
  .tile .chip { display:block; width:56%; height:9px; padding:0; font-size:0;
                border:1.5px solid var(--blueb); border-radius:5px;
                background:var(--blueb); color:transparent; overflow:hidden; }
  .tile .chip.svc { background:var(--greenb); border-color:var(--greenb); }
  .tile .chip.pre { background:var(--amberb); border-color:var(--amberb); }
  /* Half clean, half arrival: the bar shows the two jobs rather than a third
     pattern standing for them. Stripes said something is different about this
     one and left you to remember what; a split bar says which two, in the
     colours already used for each. The clean half leads because the clean has
     to happen first. */
  .tile .chip.arr { border-color:var(--blueb);
                    background:linear-gradient(90deg,
                      var(--blueb) 0 50%, var(--amberb) 50% 100%); }
  /* Unknown is a gap in what we know, not a job, so it is the only one with
     no fill and the only dashed one. Grey, because red is reserved for
     something being wrong. */
  .tile .chip.ver { background:transparent; border-style:dashed;
                    border-color:var(--mid); }
  /* Who is on it, as a badge in the corner rather than a line of text. Reading
     H doing at the bottom of a tile is reading; a filled circle is seeing, and
     the question it answers is which room to walk to, asked from across a
     corridor while carrying something.

     Initials rather than a person icon. A generic icon says somebody is on it,
     which is one fact; the initials say that same fact and who, in the same
     space. The full name is on the title and the accessible label.

     Yours is inverted rather than given a colour. Colour on this board means
     which job, and a second meaning for the same signal is how a board stops
     being readable. */
  .tile .who-badge { position:absolute; top:5px; right:5px;
                     min-width:20px; height:20px; padding:0 4px;
                     border-radius:10px; border:1.5px solid var(--ink);
                     background:var(--ink); color:var(--cream);
                     font-family:var(--ui-font); font-size:9px; font-weight:bold;
                     letter-spacing:.02em; display:flex; align-items:center;
                     justify-content:center; box-sizing:border-box; }
  .tile .who-badge.mine { background:var(--cream); color:var(--ink); }
  .tile .sub { font-size:9.5px; color:var(--mid); min-height:12px; letter-spacing:.03em; }
  .tile .sub b { color:var(--ink); }
  /* The clock on an available villa, and the only place on this board where
     colour is about time rather than about state. Green for the first ten
     minutes, because a villa turned around inside the window is the thing
     going right and it read identically to one nobody had touched. Ink from
     ten, amber from fifteen, red from twenty: the guest is coming back.

     A darker green than the tile border, because this one is 9.5px text and
     often sits on a green tile. --greenb reads at 2.8 to 1 against that fill,
     which is not a colour anybody picks out on a phone in daylight. This is
     5 to 1 on every background it lands on. */
  .tile .sub b.fresh { color:#4E6B4B; }
  .tile .sub b.soon { color:var(--amberb); }
  .tile .sub b.late { color:var(--red); }

  /* Colour means "this villa is ready to work on now", and which colour says
     which job: blue for a clean once the guest has gone, green for a service
     once someone has noticed it free. Orange is deliberately unused, held
     for a warning state. A finished villa loses its colour entirely: it is
     no longer work, and must stop competing for attention.               */
  .tile.ready-clean { background:var(--blue);  border-color:var(--blueb); }
  .tile.ready-svc   { background:var(--green); border-color:var(--greenb); }
  .tile.done   { background:#F2F2EF; border-color:var(--rule); }
  .tile.done .rn { opacity:.75; }
  /* Done is one rule for every job: the same pill, faded. It used to be hollow
     for most and a faded fill for the clean with an arrival, which is two ways
     of saying one thing and left the striped one looking louder than the work
     that was still outstanding. The tile itself already says done, by its
     colour and by the time underneath, so the pill only has to stay
     recognisable as the job it was. */
  .tile.done .chip { opacity:.4; }
  .tile .who-badge { position:absolute; top:5px; right:5px;
                     min-width:20px; height:20px; padding:0 4px;
                     border-radius:10px; border:1.5px solid var(--ink);
                     background:var(--ink); color:var(--cream);
                     font-family:var(--ui-font); font-size:9px; font-weight:bold;
                     letter-spacing:.02em; display:flex; align-items:center;
                     justify-content:center; box-sizing:border-box; }
  .tile .who-badge.mine { background:var(--cream); color:var(--ink); }
  .tile .sub { font-size:9.5px; color:var(--mid); min-height:12px; letter-spacing:.03em; }
  .tile .sub b { color:var(--ink); }
  /* The clock on an available villa, and the only place on this board where
     colour is about time rather than about state. Green for the first ten
     minutes, because a villa turned around inside the window is the thing
     going right and it read identically to one nobody had touched. Ink from
     ten, amber from fifteen, red from twenty: the guest is coming back.

     A darker green than the tile border, because this one is 9.5px text and
     often sits on a green tile. --greenb reads at 2.8 to 1 against that fill,
     which is not a colour anybody picks out on a phone in daylight. This is
     5 to 1 on every background it lands on. */
  .tile .sub b.fresh { color:#4E6B4B; }
  .tile .sub b.soon { color:var(--amberb); }
  .tile .sub b.late { color:var(--red); }

  /* Colour means "this villa is ready to work on now", and which colour says
     which job: blue for a clean once the guest has gone, green for a service
     once someone has noticed it free. Orange is deliberately unused, held
     for a warning state. A finished villa loses its colour entirely: it is
     no longer work, and must stop competing for attention.               */
  .tile.ready-clean { background:var(--blue);  border-color:var(--blueb); }
  .tile.ready-svc   { background:var(--green); border-color:var(--greenb); }
  .tile.done   { background:#F2F2EF; border-color:var(--rule); }
  .tile.done .rn { opacity:.75; }
  /* pushed reads like finished - it is off today's list - but purple says it
     is deferred rather than done                                         */
  .tile.pushed .chip { color:#6B4E9B; border-color:#C7B6E0; }
  .dtick { width:11px; height:11px; margin-right:4px; vertical-align:-1px;
           display:inline-block; color:#5C7A57; }
  /* a vacant villa is not a job - it stays visible for orientation but must
     not compete with the villas that need work */
  .tile.vac    { opacity:.22; }
  /* Multi-select applies only to villas whose job is undecided, so the ones
     that cannot take part are dimmed rather than removed - the grid keeps
     its shape and nothing jumps.                                        */
  .tile.sel    { outline:2px solid var(--ink); outline-offset:-2px; }
  body.selmode .tile { opacity:.3; }
  body.selmode .tile.selectable { opacity:1; }
  .btn.active  { background:var(--ink); color:var(--cream); }

  .legend { margin-top:20px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
            font-family:var(--ui-font); font-size:9px; letter-spacing:.1em;
            text-transform:uppercase; color:var(--mid); }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px;
              border:1.2px solid var(--rule); vertical-align:-1px; margin-right:5px; }
  .legend .lg { background:var(--green); border-color:var(--greenb); }
  .legend .lb { background:var(--amber); border-color:var(--amberb); }
  .legend .ld { background:var(--blue);  border-color:var(--blueb); }
  .legend .lf { background:#F2F2EF; border-color:var(--rule); }
  /* The key draws the same bars at the same size and in the same colours. A
     key that is a separate drawing can disagree with the thing it explains;
     this one cannot, because it is the thing.

     It lives in the grid's eighteenth cell, so it costs no height of its own.
     That means it has to fit a tile, which is why it is a single narrow
     column rather than the two it used to be. */
  .legend { display:flex !important; flex-direction:column; justify-content:center;
            gap:2px; margin:0 !important; padding:6px 7px; text-align:left;
            border:1.2px solid var(--rule); border-radius:10px;
            background:transparent; font-size:7px; letter-spacing:.06em; }
  .legend span { display:flex; align-items:center; gap:5px; line-height:1.15; }
  .legend .lgb { flex:0 0 auto; width:15px; height:6px; border-radius:3px;
                 border:1.2px solid var(--blueb); background:var(--blueb);
                 vertical-align:0; margin:0; }
  .legend .lgb.svc { background:var(--greenb); border-color:var(--greenb); }
  .legend .lgb.pre { background:var(--amberb); border-color:var(--amberb); }
  .legend .lgb.arr { border-color:var(--blueb);
                     background:linear-gradient(90deg,
                       var(--blueb) 0 50%, var(--amberb) 50% 100%); }
  .legend .lgb.dash { background:transparent; border-style:dashed;
                      border-color:var(--mid); }

  .bar { margin-top:22px; gap:10px; }
  .btn { flex:1; padding:13px 0; text-align:center; font-family:var(--ui-font);
         font-size:11px; letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
         border:1px solid var(--ink); background:transparent; color:var(--ink);
         border-radius:2px; text-decoration:none; }

  /* popup */
  .ov { position:fixed; inset:0; background:rgba(28,28,26,.45); display:none;
        align-items:flex-end; justify-content:center; z-index:40; }
  .ov.show { display:flex; }
  .sheet { background:var(--cream); width:100%; max-width:520px; border-radius:14px 14px 0 0;
           padding:22px 20px 30px; font-family:var(--ui-font); }
  .sheet h2 { font-size:15px; letter-spacing:.04em; margin-bottom:2px; }
  .sheet .st { font-size:10.5px; color:var(--mid); letter-spacing:.08em; text-transform:uppercase;
               margin-bottom:16px; }
  .pbtn { display:block; width:100%; padding:14px; margin-top:9px; font-size:12px;
          letter-spacing:.1em; text-transform:uppercase; background:#fff; color:var(--ink);
          border:1px solid var(--ink); border-radius:6px; cursor:pointer; font-family:inherit; }
  .pbtn.solid { background:var(--ink); color:#fff; }
  .pdiv { font-family:var(--ui-font); font-size:9px; letter-spacing:.18em;
          text-transform:uppercase; color:var(--mid); margin:14px 0 6px; }
  .btick { width:15px; height:15px; margin-right:8px; vertical-align:-2px; display:inline-block; }
  .pbtn.ghost { border-color:var(--rule); color:var(--mid); }
  .pbtn.warn  { border-color:var(--red); color:var(--red); }
  .timerow { display:flex; gap:8px; margin-top:9px; }
  .timerow .pbtn { margin-top:0; padding:13px 0; }
  .perr { color:var(--red); font-size:11px; margin-top:12px; min-height:14px; }
</style>
</head>
<body class="tier-app">

<div class="wrap">
    <div class="daterow">
  <div class="date" id="title"></div>
  <div class="navwrap" id="navWrap" style="display:none">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"><a href="tally.html">Reservations</a><a href="front-desk.html">Front Desk Arrival</a><a href="list.html">Reservations Sheet</a><a href="housekeeping.html">Clean sheet</a><a href="registration.html">Registration</a><a href="staff.html">Settings</a><a href="pages.html">Pages</a><a href="#" class="signout" id="navNotify">Notifications</a><a href="#" class="signout" id="navSignout">Sign out</a></div>
  </div>
</div>
<script>
(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
  var nb=document.getElementById('navNotify');
  function paintNotify(state){
    if (!nb) return;
    nb.textContent = state==='on'        ? 'Notifications on'
                   : state==='off'       ? 'Notifications off'
                   : state==='blocked'   ? 'Notifications blocked'
                   : state==='unsupported' ? 'Notifications unavailable'
                   : 'Notifications';
    nb.setAttribute('data-state', state);
  }
  if (nb){
    /* nala-shared.js loads at the foot of the page, so its helpers are not
       here yet when this runs. Calling one now throws and takes the rest of
       the menu wiring with it, including the sign out link.            */
    (function waitForShared(){
      if (typeof pushState !== 'function'){ setTimeout(waitForShared, 300); return; }
      pushState(paintNotify);
    })();
    nb.onclick = function(e){
      e.preventDefault(); e.stopPropagation();
      var u = firebase.auth().currentUser;
      if (typeof pushOn !== 'function'){ return; }   /* not loaded yet */
      var st = nb.getAttribute('data-state');
      if (st === 'unsupported'){
        paintNotify('unsupported');
        alert('Notifications need the app added to the Home Screen. Open the share menu and choose Add to Home Screen, then try again.');
        return;
      }
      if (st === 'blocked'){
        alert('Notifications are blocked for this site. Turn them on in your phone settings, then try again.');
        return;
      }
      nb.textContent = 'Working...';
      if (st === 'on') pushOff(u, paintNotify);
      else pushOn(u, window.NALA_ROLE, function(r){
        paintNotify(r);
        if (r === 'blocked') alert('Notifications were not allowed. You can turn them on in your phone settings.');
        if (r === 'failed')  alert('Could not turn notifications on. Check the connection and try again.');
      });
    };
  }

  var so=document.getElementById('navSignout');
  if (so) so.onclick=function(e){ e.preventDefault();
    var u = window.NALA_USER || null;
    try { u = firebase.auth().currentUser || u; } catch (ex){}
    var go = function(){ if (window.NALA_SIGNOUT) NALA_SIGNOUT(); else location.reload(); };
    /* Unsubscribe first, while the token is still valid enough to delete the
       record. If it fails, sign out anyway: being stuck signed in would be
       the worse outcome.                                                 */
    if (u && typeof pushOff === 'function'){ pushOff(u, go); } else { go(); }
  };
  /* One gate for the whole page. The role comes from the record at
     /staff/<emailkey>, never from the address - see ROLES.md. The nav menu
     and the job controls both need setJob; the marks need cleansMarks; a
     login the record does not name gets neither and is told so.        */
  window.IS_MANAGER = false;
  window.NALA_ROLE  = null;
  (function gate(){
    /* Wait for the helper too, not just firebase: a stubbed SDK calls back
       synchronously, and nala-shared.js loads at the foot of the page.
       auth() itself throws when no app has been initialised, and a partial
       SDK can arrive without onAuthStateChanged, so both are guarded: a
       throw here would take the whole page down with it.               */
    if (!window.firebase || !firebase.auth ||
        typeof loadStaff !== 'function'){ setTimeout(gate,300); return; }
    var A;
    try { A = firebase.auth(); } catch (e){ setTimeout(gate,300); return; }
    if (!A || typeof A.onAuthStateChanged !== 'function'){ setTimeout(gate,300); return; }
    A.onAuthStateChanged(function(u){
      if (!u) return;                 /* auth.js owns the signed-out state */
      loadStaff(function(recs, err){
        var role = roleOf(u);
        window.NALA_ROLE  = role;
        window.NALA_USER  = u;      /* kept so sign out can unsubscribe */
        window.NALA_ME    = displayNameOf(u);
        window.NALA_KEY   = staffKeyOf(u);
        /* The board paints before sign in resolves, so the first paint does
           not know who you are and your own claim came back at you as your
           name rather than as You. Repaint once it does. */
        if (typeof render === 'function' && STATE && STATE.rows) render();
        if (typeof ensureNotifySettings === 'function') ensureNotifySettings(role);
        window.IS_MANAGER = can(role,'setJob');
        /* A waiter is on this board to say a villa looks free after
           breakfast, nothing more. The other marks are hidden rather than
           disabled: this is about not pressing something by accident, so
           the button simply is not there.                              */
        document.body.classList.toggle('marks-limited', !can(role,'cleansMarks'));
        /* The menu is no longer manager-only. It has to exist for every
           login, because Sign out lives in it and the Cleans board is the
           housekeeping login's only page: hiding the menu from them left
           them with no way out. The LINKS are filtered by role instead, so
           nobody is offered a board that would refuse them.            */
        document.getElementById('navWrap').style.display = 'block';
        navFilter(role);
        showAccess(can(role,'cleansBoard'), err);
        if (document.getElementById('ov').className.indexOf('show')>-1) drawSheet('menu');
      });
    });
  })();

  /* A login with no record is a different thing from a lookup that failed,
     and they are worded differently: sending someone to the manager when
     the database simply did not answer wastes a walk.                  */

  /* Only the boards this role may open. Sign out is never filtered. */
  function navFilter(role){
    var need = { 'tally.html':'resBoard', 'front-desk.html':'editBookings', 'list.html':'resSheet',
                 'cleaners.html':'cleansBoard', 'housekeeping.html':'cleansBoard', 'registration.html':'editBookings',
                 'staff.html':'manageStaff', 'pages.html':'manageStaff' };
    var links = document.querySelectorAll('#navDrop a');
    for (var i=0;i<links.length;i++){
      if (links[i].className.indexOf('signout')>-1) continue;
      var href=(links[i].getAttribute('href')||'').split('?')[0];
      links[i].style.display = can(role, need[href]) ? '' : 'none';
    }
  }

  function showAccess(allowed, err){
    var box = document.getElementById('noAccess');
    var on  = !allowed;
    box.innerHTML = !on ? '' :
      (err ? '<div>Could not check access. This is usually the connection, '
           + 'not your login.</div>'
           + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
           : 'This login has no access to the Cleans board. See the manager.');
    /* A role that cannot see this page but has a board of its own is sent
       there rather than shown a refusal. Only a login with no role at all
       gets the message, because it has nowhere to be sent.             */
    if (on && !err){
      var home = homeFor(window.NALA_ROLE);
      if (home && home !== location.pathname.split('/').pop()){
        location.replace(home); return;
      }
    }
    box.className = 'noaccess' + (on ? ' show' : '');
    ['grid','legend','statsRow','footBar'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.style.display = on ? 'none' : '';
    });
  }
})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
// dates, look-back, room records, clean/service rules: nala-shared.js
// this board is locked to today by design - no browsed dates
function todayKey(){ return dkey(new Date()); }
document.getElementById('title').textContent = dateLabel(new Date());

function api(path){ return fetch(DB+path+'.json?v='+Date.now()).then(function(r){return r.json();}); }

var STATE = { rows:[], hk:{} };
var selectMode = false, selected = {};
var ICON_DTICK = '<svg class="dtick" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
                 'stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">'+
                 '<path d="M4 12.5l5.2 5.2L20 6.9"/></svg>';
var ICON_TICK = '<svg class="btick" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
                'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'+
                '<path d="M4 12.5l5.2 5.2L20 6.9"/></svg>';

document.getElementById('selToggle').onclick = function(){
  if (selectMode && selCount()) { openMulti(); return; }   /* Options */
  selectMode = !selectMode;
  selected = {};
  document.body.classList.toggle('selmode', selectMode);
  selLabel(); render();
};

function load(full){
  var yest = (function(){ var d=new Date(); d.setDate(d.getDate()-1); return dkey(d); })();
  /* Last night as well as tonight. /stays files a guest under the nights they
     SLEEP, arrival inclusive and departure exclusive, so somebody who checked
     out this morning is not in tonight's file at all. They are the person this
     board exists for: the villa needs cleaning precisely because they left.
     Reading only tonight left every departure classified as unknown. */
  return Promise.all([ api('/responses/'+todayKey()), api('/manual/'+todayKey()),
                fetchRoomGuests(todayKey(), 14, !!full), api('/hk/'+todayKey()), api('/hk/'+yest),
                fetchStays(todayKey()), api('/dinner/'+todayKey()),
                api('/stays/'+yest) ])
  .then(function(res){
    var responses=res[0]||{}, manual=res[1]||{}, hk=res[3]||{}, prevHk=res[4]||{};
    /* The one dinner cell. This board only needs it to tell a departure from a
       stay-over, but reading it from the same node the other pages write keeps
       one villa from being two things on two screens. */
    var dinner=res[6]||{};
    var tonight = res[5] || {};
    var lastNight = res[7] || {};
    /* Last night underneath, tonight over the top, so a villa occupied both
       nights reads as tonight's guest and a villa emptied this morning still
       reads as the guest who left. */
    var roomguests = overlayStays(
      overlayStays(resolveRoomGuestsHK(res[2]||{}, todayKey()), lastNight),
      tonight);

    /* A villa nobody slept in last night, with somebody arriving tonight, is
       a preparation rather than a clean. Taken from the two stay files rather
       than from /roomguests, which nothing has written to since the PMS sync
       began writing /stays, so the old check was reading an empty node and
       every arrival looked like an ordinary stay-over. */
    var arriving = {};
    /* Both sources, because a villa can be known through either. /stays comes
       from the PMS sync; the today bucket of /roomguests still carries anyone
       who opened their link, and pages are still being moved across. Reading
       only the new one dropped arrivals the old one knew about. */
    var rgToday = (res[2]||{})[todayKey()] || {};
    for (var rv in rgToday){
      if (rgToday[rv] && rgToday[rv].arrives)
        arriving[rv] = { arrives: rgToday[rv].arrives };
    }
    for (var v in tonight){
      var t = tonight[v] || {};
      if (t.arrive && String(t.arrive).slice(0,10) === todayKey())
        arriving[v] = { arrives: t.arrive };
    }

    var rows=[];
    for (var n=1;n<=ROOMS;n++){
      var r=roomRecord(n, responses, manual, roomguests, dinner);
      var a = arriving[n] && arriving[n].arrives ? parseDepDate(arriving[n].arrives) : null;
      /* A villa pushed yesterday and never finished arrives today as a clean
         that is already departed - the guest left, the work did not happen. */
      var p = prevHk[n] || {};
      var pushedIn = !!(p.pushed && !p.done);
      /* Only this function holds both nights, so it is the only place that can
         tell a same day turnover from a plain arrival. */
      var ln = lastNight[String(n)];
      var left = !!(ln && ln.depart &&
                    String(ln.depart).slice(0,10) === todayKey());
      /* Whether somebody arrives into this villa tonight is a fact about the
         booking, and a manager can say otherwise for the day.

         It is kept separate from the job rather than made a fifth kind. A
         clean with an arrival IS a clean, with something else also true of it,
         and the two combine: making it a kind would need every rule that asks
         is this a clean to learn a second answer. It also needs no change to
         the database rules, which name the four kinds they accept and would
         otherwise have to be pasted in again.

         true forces it on, false forces it off, absent leaves the booking to
         decide. */
      rows.push({ n:n, kind:hkClassify(r, todayKey(), hk[n], left),
                  base: pushedIn ? 'clean' : hkClassify(r, todayKey(), null, left),
                  pushedIn: pushedIn,
                  /* What the BOOKING says. What the board shows is decided at
                     draw time by arrivingNow, because a manager's override is
                     written after this ran and a row built once at load would
                     hold yesterday's answer until a refresh. */
                  arrivingBooked: !!(a && dkey(a) === todayKey()) });
    }
    // services first: they are attempted while the guest is out, before the
    // departure cleans open up. Then cleans, verify, vacant, room order
    // within each block.
    /* Preparations first: an arriving guest has a time attached to them and
       everything else on this board does not. Then services, attempted while
       the guest is out, then the departure cleans they open up. */
    var korder={pre:0, svc:1, clean:2, ver:3, vac:4};
    rows.sort(function(a,b){ return (korder[a.kind]-korder[b.kind]) || (a.n-b.n); });
    STATE.rows=rows; STATE.hk=hk;
    render();
  });
}

function mins(iso){
  var t=parseISO(iso); if (!t) return null;
  return Math.max(0, Math.round((Date.now()-t.getTime())/60000));
}
function hhmm(iso){
  var t=parseISO(iso); if (!t) return '';
  return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
}

/* Does somebody arrive into this villa tonight. The booking decides unless a
   manager has said otherwise for the day: true forces it on, false forces it
   off, anything else leaves the booking to answer.

   Read from the day's record every time rather than from the row, so setting
   it shows immediately instead of at the next refresh. */
function arrivingNow(row, h){
  var set = h && h.arriving;
  if (set === true)  return true;
  if (set === false) return false;
  return !!(row && row.arrivingBooked);
}

/* The key. Held rather than looked up, because every render clears the grid
   it now lives in, and a lookup after the first clear finds nothing. */
var LEGEND = null;

function render(){
  var g=document.getElementById('grid'); g.innerHTML='';
  if (!LEGEND) LEGEND = document.getElementById('legend');
  var nClean=0,nSvc=0,nDone=0,nPre=0;
  /* The job is derived here, not frozen at load, so setting one takes effect
     on the tile immediately instead of waiting for a refresh - and the villa
     re-sorts into its new block at the same time.                        */
  var korder={svc:0, clean:1, pre:2, done:3, pushed:4, ver:5, vac:6};
  STATE.rows.forEach(function(r){
    r.kind = (STATE.hk[r.n] && STATE.hk[r.n].kind) ? STATE.hk[r.n].kind : r.base;
  });
  function rank(r){
    var h = STATE.hk[r.n] || {};
    if (r.kind !== 'vac' && h.done) return korder.done;      /* finished work sinks */
    /* pushed today is not today's work at all, so it sits below even the
       finished villas. Tomorrow it arrives as an ordinary departed clean. */
    if (r.kind !== 'vac' && h.pushed) return korder.pushed;
    return korder[r.kind];
  }
  /* Within services, the guest seated longest is the one most likely to walk
     back in, so it leads. Within cleans: a departed villa with someone
     arriving today first, then any departed villa, then the rest.        */
  function sub(r){
    var h = STATE.hk[r.n] || {};
    var gone = h.departed || r.pushedIn;
    if (r.kind === 'svc') return h.bfast ? 0 : 1;
    if (r.kind === 'clean'){
      if (gone && arrivingNow(r, STATE.hk[r.n])) return 0;
      if (gone) return 1;
      return 2;
    }
    return 0;
  }
  function seated(r){
    var h = STATE.hk[r.n] || {};
    if (r.kind !== 'svc' || !h.bfast) return 0;
    var t = new Date(h.bfast).getTime();
    return isNaN(t) ? 0 : t;      /* earliest first = seated longest */
  }
  STATE.rows.sort(function(a,b){
    return (rank(a)-rank(b)) || (sub(a)-sub(b)) || (seated(a)-seated(b)) || (a.n-b.n);
  });
  STATE.rows.forEach(function(row){
    var h=STATE.hk[row.n]||{};
    if (row.kind==='clean') nClean++;
    if (row.kind==='svc') nSvc++;
    if (row.kind==='pre') nPre++;
    if (h.done) nDone++;

    var cls='tile';
    if (row.kind==='vac') cls+=' vac';
    else if (h.pushed) cls+=' done pushed';
    else if (h.done) cls+=' done';
    else if (row.kind==='clean' && (h.departed || row.pushedIn)) cls+=' ready-clean';
    else if (row.kind==='svc' && h.bfast) cls+=' ready-svc';

    /* The bar. `job` is the machine readable name of what this villa needs,
       and the word is what a screen reader says and a long press shows. The
       shape is what a cleaner reads: see the chip rules for the two axes. */
    function bar(job, word, cls){
      return '<span class="chip'+(cls?' '+cls:'')+'" data-job="'+job+'"'+
             ' role="img" aria-label="'+esc(word)+'" title="'+esc(word)+'">'+
             esc(word)+'</span>';
    }
    var chip='';
    if (row.kind==='clean'){
      var arr = arrivingNow(row, h) && !h.pushed;
      chip = h.pushed ? bar('pushed', 'Pushed')
           : arr ? bar(h.done ? 'cleaned-pre' : 'clean-pre',
                       h.done ? 'Cleaned, ready for arrival' : 'Clean, arriving tonight',
                       'arr')
           : bar(h.done ? 'cleaned' : 'clean', h.done ? 'Cleaned' : 'Clean');
    }
    else if (row.kind==='svc')
      chip = bar(h.done ? 'serviced' : 'svc', h.done ? 'Serviced' : 'Service', 'svc');
    else if (row.kind==='pre')
      chip = bar(h.done ? 'pre-arrived' : 'pre', h.done ? 'Pre-arrived' : 'Pre-arrival',
                 'pre');
    else if (row.kind==='ver') chip = bar('ver', 'Unknown', 'ver');
    else chip='<span class="sub">Empty</span>';



    var sub='';
    var claimed = !!(h.takenBy && !h.done && !h.pushed);
    if (row.kind!=='vac'){
      /* The badge in the corner says who is on it, so this line goes back to
         saying what the room is. It spent two versions saying who instead,
         first as a second pill and then as text, and both cost the tile its
         only line about the villa itself. */
      if (h.pushed) sub='To tomorrow';
      else if (h.done){
        /* Who finished it, shortened: a finished board that cannot say who did
           the work is a board you have to ask about. Older records carry no
           name, so the phrase drops rather than showing an empty by. */
        var who = shortTagFor(h.doneBy);
        sub = who ? 'Done by '+esc(who)+' '+hhmm(h.done) : 'Done '+hhmm(h.done);
      }
      else if (h.departed || row.pushedIn) sub='Departed';
      else if (h.bfast){
        var m = mins(h.bfast);
        var w = m >= 20 ? ' late' : (m >= 15 ? ' soon' : (m < 10 ? ' fresh' : ''));
        sub='Available <b class="el'+w+'">'+m+'m</b>';
      }
      else if (row.kind==='pre') sub='Arriving today';
      else if (row.kind==='clean' && arrivingNow(row, h)) sub='Occupied';
      else if (row.kind==='ver') sub='';   /* the pill already says Unknown */
      else sub='Occupied';
    }

    if (selectMode && selectableRow(row)) cls += ' selectable';
    if (selected[row.n]) cls += ' sel';
    var el=document.createElement('button');
    el.className=cls;
    var badge = '';
    if (claimed){
      /* Compared on the key, with the name as the fallback for records
         written before keys were stored. */
      var mine = h.takenBy === window.NALA_KEY || h.takenBy === window.NALA_ME;
      badge = '<span class="who-badge'+(mine ? ' mine' : '')+'"'+
              ' title="'+esc(fullNameFor(h.takenBy))+' is on this villa"'+
              ' aria-label="'+esc(fullNameFor(h.takenBy))+' is on this villa">'+
              esc(shortTagFor(h.takenBy) || h.takenBy)+'</span>';
    }
    /* The badge is drawn in the corner but comes last in the markup, so the
       tile still READS villa, job, state, person. Put first, the tile's text
       began with somebody's initials instead of the villa number, which is
       the wrong order for a screen reader and for anything matching on it. */
    el.innerHTML='<span class="rn">'+row.n+'</span>'+chip+
                 '<span class="sub">'+sub+'</span>'+badge;
    el.onclick = function(){
      if (selectMode){
        if (!selectableRow(row)) return;
        if (selected[row.n]) delete selected[row.n]; else selected[row.n] = true;
        selLabel(); render(); return;
      }
      openSheet(row);
    };
    g.appendChild(el);
  });
  /* Seventeen villas in three columns leave exactly one cell spare, and the
     key was taking a strip of height below the grid to say something that
     fits in a tile. Moved rather than copied, so there is still one key.

     The node is held rather than looked up. Every render clears the grid, so
     the first pass moved the key in and the second deleted it: after one
     refresh the board had no key at all, and getElementById could never find
     it again. */
  if (LEGEND) g.appendChild(LEGEND);
  document.getElementById('nClean').textContent=nClean;
  document.getElementById('nSvc').textContent=nSvc;
  document.getElementById('nDone').textContent=nDone;
  document.getElementById('nPre').textContent=nPre;
  document.getElementById('preWrap').style.display = nPre ? '' : 'none';
}

/* Names come from the staff list, which a manager types, so they reach the
   board as text and are escaped before they become HTML. */
function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── writes ─────────────────────────────────────────────────
function patchRoom(n, obj){
  return fetch(DB+'/hk/'+todayKey()+'/'+n+'.json', {
    method:'PATCH', body:JSON.stringify(obj)
  }).then(function(r){
    if (!r.ok) throw new Error('rejected');
    return r.json();
  });
}
function setField(n, obj, errEl){
  var prev=JSON.parse(JSON.stringify(STATE.hk[n]||{}));
  STATE.hk[n]=Object.assign({},prev,obj);
  for (var k in obj){ if (obj[k]===null) delete STATE.hk[n][k]; }
  render();
  return patchRoom(n,obj).then(function(){
    /* Only after the write succeeds, and only for the two marks anyone asked
       to be told about. Setting a mark notifies; clearing or undoing one does
       not, because nothing has become available by undoing something.    */
    try {
      if (obj.departed === true)      notifyPush('departed', n, window.NALA_USER);
      else if (obj.bfast && obj.bfast !== null) notifyPush('available', n, window.NALA_USER);
      else if (obj.done && obj.done !== null){
        /* One tap finishes either job, so the villa's own kind decides which
           of the two it was. Anything else finished is not announced.   */
        var k = (STATE.rows||[]).filter(function(r){ return r.n===n; })[0];
        var kind = k && k.kind;
        if (kind === 'clean')     notifyPush('cleaned', n, window.NALA_USER);
        else if (kind === 'svc')  notifyPush('serviced', n, window.NALA_USER);
      }
    } catch (e){}
    closeSheet();
  })
  .catch(function(e){
    STATE.hk[n]=prev; render();
    errEl.textContent = (e && e.message==='rejected')
      ? 'The change was not allowed - tell the manager.'
      : 'No connection - try again.';
  });
}

function setKind(k){
  var err = document.getElementById('perr');
  if (CUR.multi){
    /* several villas at once: apply to each, then leave select mode so the
       board returns to its normal state rather than a half-selected one */
    var ns = CUR.multi.slice();
    Promise.all(ns.map(function(n){ return setField(n, { kind:k }, err); }))
      .then(function(){ exitSelect(); });
    return;
  }
  setField(CUR.n, { kind:k }, err);
}

// ── multi-select ───────────────────────────────────────────
/* Only villas whose job is unknown can be selected: the point is to decide
   several at once, and anything already decided has nothing to decide.  */
function selectableRow(row){ return row.kind === 'ver'; }

function selCount(){ return Object.keys(selected).length; }

function selLabel(){
  var t = document.getElementById('selToggle');
  if (!selectMode) { t.textContent = 'Select multiple'; t.className = 'btn'; return; }
  t.className = 'btn active';
  t.textContent = selCount() ? 'Options' : 'Cancel';
}

function exitSelect(){ selectMode = false; selected = {}; document.body.classList.remove('selmode');
                       selLabel(); render(); }

function openMulti(){
  var ns = Object.keys(selected).map(Number).sort(function(a,b){ return a-b; });
  if (!ns.length) return;
  CUR = { n:ns.join(', '), kind:'ver', base:'ver', multi:ns };
  drawSheet('menu');
  document.getElementById('ov').className = 'ov show';
}

// ── popup ──────────────────────────────────────────────────
var CUR=null;
function openSheet(row){ CUR=row; drawSheet('menu'); document.getElementById('ov').className='ov show'; }
function closeSheet(){ document.getElementById('ov').className='ov'; CUR=null; }
document.getElementById('ov').onclick=function(e){ if (e.target===this) closeSheet(); };

function drawSheet(mode){
  var b=document.getElementById('sheetBox');
  var n=CUR.n, h=STATE.hk[n]||{};
  var kindName = CUR.kind==='clean' ? 'Clean - departing today'
               : CUR.kind==='svc'   ? 'Service - staying on'
               : CUR.kind==='pre'   ? 'Pre-arrival - guest arriving today'
               : CUR.kind==='vac'   ? 'Empty'
               : 'Unknown';
  if (h.kind) kindName += ' - set by staff';
  var head='<h2>'+(CUR.multi ? (CUR.multi.length+' villas') : 'Villa '+n)+
           '</h2><div class="st">'+(CUR.multi ? 'Villas '+n : kindName)+'</div>';
  var err='<div class="perr" id="perr"></div>';

  if (mode==='menu'){
    var rows='';
    /* Nothing can be completed on a villa whose job is unknown - decide what
       it is first. Same shape as a vacant villa: job controls only.      */
    if (CUR.kind==='vac' || CUR.kind==='ver'){
      if (window.IS_MANAGER){
        rows+='<div class="pdiv">Admin options</div>';
        rows+='<button class="pbtn" onclick="drawSheet(\'k-clean\')">To be cleaned</button>';
        rows+='<button class="pbtn" onclick="drawSheet(\'k-svc\')">To be serviced</button>';
        if (CUR.kind!=='pre') rows+='<button class="pbtn" onclick="drawSheet(\'k-pre\')">Set as pre-arrival</button>';
        if (CUR.kind!=='vac') rows+='<button class="pbtn" onclick="drawSheet(\'k-vac\')">Mark as empty</button>';
        if (h.kind) rows+='<button class="pbtn warn" onclick="drawSheet(\'k-none\')">'+
          ((CUR.base==='clean'||CUR.base==='svc') ? 'Use booking dates' : 'Back to unknown')+'</button>';
      }
      rows+='<button class="pbtn ghost" onclick="closeSheet()">Close</button>';
      b.innerHTML=head+rows+err;
      return;
    }
    /* A pre-arrival is a single job with a single outcome: do it, or decide it
       was never one. Nothing else applies - no availability, no departure, no
       pushing, and no switching it to a clean or a service.              */
    if (CUR.kind==='pre'){
      rows += h.done
        ? '<button class="pbtn warn" onclick="drawSheet(\'undone\')">Undo done</button>'
        : '<button class="pbtn solid" onclick="drawSheet(\'done\')">'+ICON_TICK+'Mark as pre-arrived</button>';
      if (window.IS_MANAGER)
        rows+='<button class="pbtn warn" onclick="drawSheet(\'k-none\')">Back to unknown</button>';
      rows+='<button class="pbtn ghost" onclick="closeSheet()">Close</button>';
      b.innerHTML=head+rows+err;
      return;
    }
    /* Taking a job. The problem is two cleaners walking to the same villa, so
       what matters is that the claim is visible and easy to give back: a claim
       nobody can release becomes a villa nobody cleans the moment somebody
       goes home. Anyone can take over one already held, without a warning
       screen, because plans change constantly during a turnaround and asking
       twice would just teach people to tap through it. */
    if (!h.done && !CUR.multi){
      if (!h.takenBy){
        rows+='<button class="pbtn" onclick="drawSheet(\'take\')">I\u2019ll take this one</button>';
      } else if (h.takenBy === window.NALA_KEY || h.takenBy === window.NALA_ME){
        rows+='<button class="pbtn" disabled style="opacity:.6">You took this at '+hhmm(h.takenAt)+'</button>';
        rows+='<button class="pbtn warn" onclick="drawSheet(\'untake\')">Hand it back</button>';
      } else {
        rows+='<button class="pbtn" disabled style="opacity:.6">'+esc(fullNameFor(h.takenBy))+' took this at '+hhmm(h.takenAt)+'</button>';
        rows+='<button class="pbtn" onclick="drawSheet(\'take\')">Take it over</button>';
      }
    }

    if (h.done){
      rows+='<button class="pbtn warn" onclick="drawSheet(\'undone\')">Undo done</button>';
    } else {
      rows+='<button class="pbtn solid" onclick="drawSheet(\'done\')">'+ICON_TICK+
            (CUR.kind==='clean' ? 'Mark as cleaned'
             : CUR.kind==='pre' ? 'Mark as pre-arrived' : 'Mark as serviced')+'</button>';
      /* Breakfast only means something while the guest is still here. Once
         they have departed, seating them is impossible, not just unlikely,
         so the option goes rather than sitting there inviting a mistake.
         A stale mark can still be cleared.                              */
      var stillHere = !(h.departed || CUR.pushedIn) && CUR.kind !== 'pre';
      if (h.bfast){
        rows+='<button class="pbtn" disabled style="opacity:.6">Marked available '+hhmm(h.bfast)+' ('+mins(h.bfast)+'m ago)</button>';
        rows+='<button class="pbtn warn" onclick="drawSheet(\'clearbf\')">Clear availability</button>';
      } else if (stillHere && CUR.kind === 'svc') {
        /* Only a service can be "possibly available": it is a way in to a
           villa whose guest is staying on. A clean is decided by whether the
           guest has departed, not by whether someone glanced in. An existing
           mark stays visible above whatever the villa's job is, so a stale
           one can always be cleared.                                      */
        rows+='<button class="pbtn" onclick="drawSheet(\'bfast\')">Possibly available</button>';
      }
      if (CUR.kind==='clean' && !arrivingNow(CUR, h)){
        rows += h.pushed
          ? '<button class="pbtn warn" onclick="drawSheet(\'unpush\')">Undo push</button>'
          : '<button class="pbtn" onclick="drawSheet(\'push\')">Push villa</button>';
      }
      if (CUR.kind==='clean'){
        /* A villa pushed in from yesterday is departed as a matter of fact -
           the guest left yesterday - not because anyone marked it. Offering
           "Guest departed" there invites a mark that changes nothing, and
           undoing that mark then appears to do nothing, because the tile was
           never reading it. So: undo only what was actually set, and offer
           nothing where the departure is inherent.                        */
        if (h.departed)
          rows += '<button class="pbtn warn" onclick="drawSheet(\'undep\')">Undo departed</button>';
        else if (!CUR.pushedIn)
          rows += '<button class="pbtn" onclick="drawSheet(\'dep\')">Guest departed</button>';
      }
    }
    if (window.IS_MANAGER){
      /* Only offer jobs the villa's state actually allows. Once the guest has
         gone the villa can only be cleaned: it cannot be serviced, and it
         cannot be called vacant while it is still standing dirty.        */
      var gone       = !!(h.departed || CUR.pushedIn);
      var canService = !gone;
      var canVacant  = !gone;
      var jobs='';
      if (CUR.kind!=='clean') jobs+='<button class="pbtn" onclick="drawSheet(\'k-clean\')">To be cleaned</button>';
      if (CUR.kind!=='svc' && canService)
        jobs+='<button class="pbtn" onclick="drawSheet(\'k-svc\')">To be serviced</button>';
      if (CUR.kind!=='vac' && canVacant)
        jobs+='<button class="pbtn" onclick="drawSheet(\'k-vac\')">Mark as empty</button>';
      /* Only offer the dates back when they actually decide something. On a
         villa the dates cannot place, reverting just returns it to unknown,
         so say that instead of pretending there is a booking to fall back on. */
      /* Whether somebody arrives tonight is separate from what the job is, so
         it is its own control rather than a fifth job.

         Only on a clean. A service is a guest staying on, so nobody is
         arriving; a pre-arrival already IS the arrival and has its own sheet
         with one outcome; and an empty or unknown villa has no job to attach
         it to. Offering it there would be a control that changes nothing. */
      if (CUR.kind === 'clean'){
        jobs += arrivingNow(CUR, h)
          ? '<button class="pbtn" onclick="drawSheet(\'a-off\')">No arrival tonight</button>'
          : '<button class="pbtn" onclick="drawSheet(\'a-on\')">Arriving tonight</button>';
        /* Only offer the booking back when it disagrees with what is set, or
           the button undoes nothing and says so to nobody. */
        if (h.arriving !== undefined && h.arriving !== null &&
            !!h.arriving !== CUR.arrivingBooked)
          jobs += '<button class="pbtn warn" onclick="drawSheet(\'a-none\')">Use the booking for arrivals</button>';
      }
      if (h.kind){
        jobs += (CUR.base==='clean' || CUR.base==='svc')
          ? '<button class="pbtn warn" onclick="drawSheet(\'k-none\')">Use booking dates</button>'
          : '<button class="pbtn warn" onclick="drawSheet(\'k-none\')">Back to unknown</button>';
      }
      if (jobs) rows+='<div class="pdiv">Admin options</div>'+jobs;
    }
    rows+='<button class="pbtn ghost" onclick="closeSheet()">Close</button>';
    b.innerHTML=head+rows+err;
  }

  var who = CUR.multi ? (CUR.multi.length+' villas') : 'villa '+n;
  var KINDS = {
    'k-clean': { v:'clean', q:'Set '+who+' to be cleaned?',   y:'Yes - to be cleaned',  cls:'solid' },
    'k-svc'  : { v:'svc',   q:'Set '+who+' to be serviced?',  y:'Yes - to be serviced', cls:'solid' },
    'k-pre'  : { v:'pre',   q:'Set '+who+' as a pre-arrival?', y:'Yes - pre-arrival',    cls:'solid' },
    'k-vac'  : { v:'vac',   q:'Mark '+who+' as empty?',       y:'Yes - empty',          cls:'solid' },
    'k-none' : { v:null,
                 q:(CUR.base==='clean' || CUR.base==='svc')
                   ? 'Go back to the booking dates for villa '+n+'?'
                   : 'Clear the job for villa '+n+'? It will show as unknown.',
                 y:'Yes - clear', cls:'warn' }
  };
  if (KINDS[mode]){
    var K = KINDS[mode];
    b.innerHTML = head +
      '<div class="st" style="margin-bottom:6px">'+K.q+'</div>'+
      '<button class="pbtn '+K.cls+'" id="kGo">'+K.y+'</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
    /* the value is handed over directly rather than serialised into an
       onclick attribute, where its quotes had nowhere safe to go */
    document.getElementById('kGo').onclick = function(){ setKind(K.v); };
    return;
  }

  if (mode==='bfast'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Marked available when?</div>'+
      '<button class="pbtn solid" onclick="stampBf(0)">Just now</button>'+
      '<div class="timerow">'+
        '<button class="pbtn" onclick="stampBf(5)">5 min ago</button>'+
        '<button class="pbtn" onclick="stampBf(10)">10 min ago</button>'+
        '<button class="pbtn" onclick="stampBf(15)">15 min ago</button>'+
      '</div>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }

  /* Taking a job writes straight through rather than asking are you sure.
     It is reversible in one tap, it stops somebody else walking to the same
     villa, and a confirm screen between a cleaner and a claim is the reason
     they would stop bothering to claim at all. */
  /* Arrivals are set straight through, like the claim: one tap, reversible in
     one tap, and it changes what the tile says rather than what anybody has
     already done. */
  if (mode==='a-on' || mode==='a-off' || mode==='a-none'){
    setField(n, { arriving: mode==='a-on' ? true : mode==='a-off' ? false : null },
             document.getElementById('perr'));
    return;
  }

  if (mode==='take'){
    setField(n, { takenBy: window.NALA_KEY || window.NALA_ME || 'Someone',
                  takenAt: new Date().toISOString() },
             document.getElementById('perr'));
    return;
  }
  if (mode==='untake'){
    setField(n, { takenBy:null, takenAt:null }, document.getElementById('perr'));
    return;
  }

  if (mode==='done'){
    var doneWord = CUR.kind==='clean' ? 'cleaned'
                 : CUR.kind==='pre' ? 'pre-arrived' : 'serviced';
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Mark villa '+n+' as '+doneWord+'?</div>'+
      '<button class="pbtn solid" id="doneGo">'+ICON_TICK+'Yes - '+doneWord+'</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
    /* Wired rather than serialised into an onclick, so the name can carry an
       apostrophe without breaking the attribute it is sitting in. */
    document.getElementById('doneGo').onclick = function(){
      setField(n, { done: new Date().toISOString(),
                    doneBy: window.NALA_KEY || window.NALA_ME || null },
               document.getElementById('perr'));
    };
    return;
  }
  if (mode==='undone'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Remove the done mark from room '+n+'?</div>'+
      '<button class="pbtn warn" onclick="setField('+n+',{done:null,doneBy:null},document.getElementById(\'perr\'))">Yes - not done</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
  if (mode==='push'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Push villa '+n+' to tomorrow? '+
      'It will appear tomorrow as a clean, already departed.</div>'+
      '<button class="pbtn solid" onclick="setField('+n+',{pushed:new Date().toISOString()},document.getElementById(\'perr\'))">Yes - push</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
    return;
  }
  if (mode==='unpush'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Bring villa '+n+' back to today?</div>'+
      '<button class="pbtn warn" onclick="setField('+n+',{pushed:null},document.getElementById(\'perr\'))">Yes - bring back</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
    return;
  }
  if (mode==='dep'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Has the guest checked out of room '+n+'?</div>'+
      '<button class="pbtn solid" onclick="setField('+n+',{departed:true},document.getElementById(\'perr\'))">Yes - departed</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
  if (mode==='undep'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Undo departed for room '+n+'?</div>'+
      '<button class="pbtn warn" onclick="setField('+n+',{departed:null},document.getElementById(\'perr\'))">Yes - undo</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
  if (mode==='clearbf'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Clear the availability mark on villa '+n+'?</div>'+
      '<button class="pbtn warn" onclick="setField('+n+',{bfast:null},document.getElementById(\'perr\'))">Yes - clear it</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
}
function stampBf(minsAgo){
  var t=new Date(Date.now()-minsAgo*60000).toISOString();
  setField(CUR.n, {bfast:t}, document.getElementById('perr'));
}

load(true);
setInterval(function(){ if(!CUR) render(); }, 30000);          // tick elapsed times

/* Twenty seconds, and only the four paths that actually move: a fortnight of
   roomguests is held in the cache in nala-shared.js, so this costs four
   requests rather than nineteen. CUR is a villa sheet being open, and the
   board never redraws under someone's hand.                             */
setInterval(function(){
  if (!CUR && !document.hidden) load().catch(function(){});
}, 20000);

/* Returning to the app is when a stale board is most obvious, and when the
   poll has been asleep. Full, because the phone may have been away a while. */
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && !CUR) load(true).catch(function(){});
});
</script>
</body>
</html>
