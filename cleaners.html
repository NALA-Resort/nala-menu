<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nala Villas">
<link rel="apple-touch-icon" href="nala-logo.png">
<title>Nala · Cleaners</title>
<link rel="stylesheet" href="nala-ui.css?v=8">
<style>
  :root { --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA; --red:#A8321E;
          --green:#E4EDE2; --greenb:#7E937A; --amber:#F6EAD5; --amberb:#C29A55;
          --blue:#E7E9EF; --blueb:#8A90A8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--ink); font-family:Georgia,serif;
         padding:24px 18px 0; -webkit-tap-highlight-color:transparent; }
  .wrap { max-width:520px; margin:0 auto; }

  .brand { font-family:Helvetica,Arial,sans-serif; font-size:10px; letter-spacing:.35em;
           color:var(--mid); text-transform:uppercase; text-align:center; }
  h1 { font-size:19px; font-weight:bold; text-align:center; margin:8px 0 4px;
       font-family:Helvetica,Arial,sans-serif; letter-spacing:.02em; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; }
  .tile { border:1.2px solid var(--rule); border-radius:10px; background:#fff;
          padding:12px 8px 10px; text-align:center; cursor:pointer; color:var(--ink);
          font-family:Helvetica,Arial,sans-serif; position:relative; min-height:96px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
  .tile .rn { font-size:20px; font-weight:bold; }
  /* Clean is a solid ink pill, Service a faint outline: the two jobs must be
     tellable apart at arm's length, not by reading the word.               */
  .tile .chip { display:inline-block; border:1.2px solid var(--ink); border-radius:5px;
                padding:1px 8px; font-weight:bold; font-size:9px; letter-spacing:.08em;
                background:var(--ink); color:var(--cream); text-transform:uppercase; }
  .tile .chip.svc { background:transparent; border-color:#B5B5AD; color:#6A6A63;
                    font-weight:normal; letter-spacing:.12em; }
  /* Unknown is a gap in what we know, not an alarm. Dashed to say "not
     settled", but grey - red is reserved for something being wrong.     */
  .tile .chip.ver { background:transparent; border-style:dashed; border-color:var(--mid);
                    color:var(--mid); }
  .tile .sub { font-size:9.5px; color:var(--mid); min-height:12px; letter-spacing:.03em; }
  .tile .sub b { color:var(--ink); }

  .tile.done   { background:var(--green); border-color:var(--greenb); }
  .tile.bfast  { background:var(--amber); border-color:var(--amberb); }
  .tile.dep    { background:var(--blue);  border-color:var(--blueb); }
  /* a vacant villa is not a job - it stays visible for orientation but must
     not compete with the villas that need work */
  .tile.vac    { opacity:.22; }

  .legend { margin-top:20px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
            font-family:Helvetica,Arial,sans-serif; font-size:9px; letter-spacing:.1em;
            text-transform:uppercase; color:var(--mid); }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px;
              border:1.2px solid var(--rule); vertical-align:-1px; margin-right:5px; }
  .legend .lg { background:var(--green); border-color:var(--greenb); }
  .legend .lb { background:var(--amber); border-color:var(--amberb); }
  .legend .ld { background:var(--blue);  border-color:var(--blueb); }

  .bar { margin-top:22px; gap:10px; }
  .btn { flex:1; padding:13px 0; text-align:center; font-family:Helvetica,Arial,sans-serif;
         font-size:11px; letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
         border:1px solid var(--ink); background:transparent; color:var(--ink);
         border-radius:2px; text-decoration:none; }

  /* popup */
  .ov { position:fixed; inset:0; background:rgba(28,28,26,.45); display:none;
        align-items:flex-end; justify-content:center; z-index:40; }
  .ov.show { display:flex; }
  .sheet { background:var(--cream); width:100%; max-width:520px; border-radius:14px 14px 0 0;
           padding:22px 20px 30px; font-family:Helvetica,Arial,sans-serif; }
  .sheet h2 { font-size:15px; letter-spacing:.04em; margin-bottom:2px; }
  .sheet .st { font-size:10.5px; color:var(--mid); letter-spacing:.08em; text-transform:uppercase;
               margin-bottom:16px; }
  .pbtn { display:block; width:100%; padding:14px; margin-top:9px; font-size:12px;
          letter-spacing:.1em; text-transform:uppercase; background:#fff; color:var(--ink);
          border:1px solid var(--ink); border-radius:6px; cursor:pointer; font-family:inherit; }
  .pbtn.solid { background:var(--ink); color:#fff; }
  .pdiv { font-family:Helvetica,Arial,sans-serif; font-size:9px; letter-spacing:.18em;
          text-transform:uppercase; color:var(--mid); margin:14px 0 6px; }
  .btick { width:15px; height:15px; margin-right:8px; vertical-align:-2px; display:inline-block; }
  .pbtn.ghost { border-color:var(--rule); color:var(--mid); }
  .pbtn.warn  { border-color:var(--red); color:var(--red); }
  .timerow { display:flex; gap:8px; margin-top:9px; }
  .timerow .pbtn { margin-top:0; padding:13px 0; }
  .perr { color:var(--red); font-size:11px; margin-top:12px; min-height:14px; }
</style>
</head>
<body class="tier-app">

<div class="wrap">
    <div class="daterow">
  <div class="date" id="title"></div>
  <div class="navwrap" id="navWrap" style="display:none">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"><a href="tally.html">Reservations</a><a href="list.html">Reservations Sheet</a><a href="housekeeping.html">Clean sheet</a></div>
  </div>
</div>
<script>
(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
  /* One gate for the whole page: the nav menu and the job controls are both
     management-only and stay hidden for the housekeeping login.          */
  window.IS_MANAGER = false;
  (function gate(){
    if (!window.firebase || !firebase.auth){ setTimeout(gate,300); return; }
    firebase.auth().onAuthStateChanged(function(u){
      var e=((u&&u.email)||'').toLowerCase();
      window.IS_MANAGER = !!(u && e.indexOf('housekeeping')!==0);
      document.getElementById('navWrap').style.display =
        window.IS_MANAGER ? 'block' : 'none';
      if (document.getElementById('ov').className.indexOf('show')>-1) drawSheet('menu');
    });
  })();
})();
</script>
  <div class="stats">
    <div class="stat"><span class="stat-n" id="nClean">&ndash;</span><span class="stat-l">Cleans</span></div>
    <div class="stat"><span class="stat-n" id="nSvc">&ndash;</span><span class="stat-l">Services</span></div>
    <div class="stat"><span class="stat-n" id="nDone">&ndash;</span><span class="stat-l">Done</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="legend">
    <span><i class="lb"></i>At breakfast</span>
    <span><i class="ld"></i>Departed</span>
    <span><i class="lg"></i>Done</span>
  </div>

  <div class="foot bar">
    <button class="btn" onclick="location.reload()">Refresh</button>
  </div>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheetBox"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=7"></script>
<script src="nala-shared.js?v=5"></script>
<script>
// dates, look-back, room records, clean/service rules: nala-shared.js
// this board is locked to today by design - no browsed dates
function todayKey(){ return dkey(new Date()); }
document.getElementById('title').textContent = dateLabel(new Date());

function api(path){ return fetch(DB+path+'.json?v='+Date.now()).then(function(r){return r.json();}); }

var STATE = { rows:[], hk:{} };
var ICON_TICK = '<svg class="btick" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
                'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'+
                '<path d="M4 12.5l5.2 5.2L20 6.9"/></svg>';

function load(){
  return Promise.all([ api('/responses/'+todayKey()), api('/manual/'+todayKey()),
                fetchRoomGuests(todayKey()), api('/hk/'+todayKey()) ])
  .then(function(res){
    var responses=res[0]||{}, manual=res[1]||{}, hk=res[3]||{};
    var roomguests=resolveRoomGuestsHK(res[2]||{}, todayKey());

    var rows=[];
    for (var n=1;n<=ROOMS;n++){
      var r=roomRecord(n, responses, manual, roomguests);
      rows.push({ n:n, kind:hkClassify(r, todayKey(), hk[n]),
                  base:hkClassify(r, todayKey()) });
    }
    // services first: they are attempted during breakfast, before the
    // departure cleans open up. Then cleans, verify, vacant, room order
    // within each block.
    var korder={svc:0, clean:1, ver:2, vac:3};
    rows.sort(function(a,b){ return (korder[a.kind]-korder[b.kind]) || (a.n-b.n); });
    STATE.rows=rows; STATE.hk=hk;
    render();
  });
}

function mins(iso){
  var t=parseISO(iso); if (!t) return null;
  return Math.max(0, Math.round((Date.now()-t.getTime())/60000));
}
function hhmm(iso){
  var t=parseISO(iso); if (!t) return '';
  return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
}

function render(){
  var g=document.getElementById('grid'); g.innerHTML='';
  var nClean=0,nSvc=0,nDone=0;
  /* The job is derived here, not frozen at load, so setting one takes effect
     on the tile immediately instead of waiting for a refresh - and the villa
     re-sorts into its new block at the same time.                        */
  var korder={svc:0, clean:1, ver:2, vac:3};
  STATE.rows.forEach(function(r){
    r.kind = (STATE.hk[r.n] && STATE.hk[r.n].kind) ? STATE.hk[r.n].kind : r.base;
  });
  STATE.rows.sort(function(a,b){ return (korder[a.kind]-korder[b.kind]) || (a.n-b.n); });
  STATE.rows.forEach(function(row){
    var h=STATE.hk[row.n]||{};
    if (row.kind==='clean') nClean++;
    if (row.kind==='svc') nSvc++;
    if (h.done) nDone++;

    var cls='tile';
    if (row.kind==='vac') cls+=' vac';
    else if (h.done) cls+=' done';
    else if (h.departed) cls+=' dep';
    else if (h.bfast) cls+=' bfast';

    var chip='';
    if (row.kind==='clean') chip='<span class="chip">'+(h.done?'Cleaned':'Clean')+'</span>';
    else if (row.kind==='svc') chip='<span class="chip svc">'+(h.done?'Serviced':'Service')+'</span>';
    else if (row.kind==='ver') chip='<span class="chip ver">Unknown</span>';
    else chip='<span class="sub">Vacant</span>';

    var sub='';
    if (row.kind!=='vac'){
      if (h.done) sub='Done '+hhmm(h.done);
      else if (h.departed) sub='Departed';
      else if (h.bfast) sub='B\u2019fast <b>'+mins(h.bfast)+'m</b>';
      else if (row.kind==='ver') sub='';   /* the pill already says Unknown */
      else sub='Occupied';
    }

    var el=document.createElement('button');
    el.className=cls;
    el.innerHTML='<span class="rn">'+row.n+'</span>'+chip+'<span class="sub">'+sub+'</span>';
    el.onclick=function(){ openSheet(row); };
    g.appendChild(el);
  });
  document.getElementById('nClean').textContent=nClean;
  document.getElementById('nSvc').textContent=nSvc;
  document.getElementById('nDone').textContent=nDone;
}

// ── writes ─────────────────────────────────────────────────
function patchRoom(n, obj){
  return fetch(DB+'/hk/'+todayKey()+'/'+n+'.json', {
    method:'PATCH', body:JSON.stringify(obj)
  }).then(function(r){
    if (!r.ok) throw new Error('rejected');
    return r.json();
  });
}
function setField(n, obj, errEl){
  var prev=JSON.parse(JSON.stringify(STATE.hk[n]||{}));
  STATE.hk[n]=Object.assign({},prev,obj);
  for (var k in obj){ if (obj[k]===null) delete STATE.hk[n][k]; }
  render();
  return patchRoom(n,obj).then(function(){ closeSheet(); })
  .catch(function(e){
    STATE.hk[n]=prev; render();
    errEl.textContent = (e && e.message==='rejected')
      ? 'The change was not allowed - tell the manager.'
      : 'No connection - try again.';
  });
}

function setKind(k){
  setField(CUR.n, { kind:k }, document.getElementById('perr'));
}

// ── popup ──────────────────────────────────────────────────
var CUR=null;
function openSheet(row){ CUR=row; drawSheet('menu'); document.getElementById('ov').className='ov show'; }
function closeSheet(){ document.getElementById('ov').className='ov'; CUR=null; }
document.getElementById('ov').onclick=function(e){ if (e.target===this) closeSheet(); };

function drawSheet(mode){
  var b=document.getElementById('sheetBox');
  var n=CUR.n, h=STATE.hk[n]||{};
  var kindName = CUR.kind==='clean' ? 'Clean - departing today'
               : CUR.kind==='svc'   ? 'Service - staying on'
               : CUR.kind==='vac'   ? 'Vacant'
               : 'Unknown';
  if (h.kind) kindName += ' - set by staff';
  var head='<h2>Villa '+n+'</h2><div class="st">'+kindName+'</div>';
  var err='<div class="perr" id="perr"></div>';

  if (mode==='menu'){
    var rows='';
    /* Nothing can be completed on a villa whose job is unknown - decide what
       it is first. Same shape as a vacant villa: job controls only.      */
    if (CUR.kind==='vac' || CUR.kind==='ver'){
      if (window.IS_MANAGER){
        rows+='<div class="pdiv">Job for today</div>';
        rows+='<button class="pbtn" onclick="drawSheet(\'k-clean\')">To be cleaned</button>';
        rows+='<button class="pbtn" onclick="drawSheet(\'k-svc\')">To be serviced</button>';
        if (CUR.kind!=='vac') rows+='<button class="pbtn" onclick="drawSheet(\'k-vac\')">Mark as vacant</button>';
        if (h.kind) rows+='<button class="pbtn warn" onclick="drawSheet(\'k-none\')">'+
          ((CUR.base==='clean'||CUR.base==='svc') ? 'Use booking dates' : 'Back to unknown')+'</button>';
      }
      rows+='<button class="pbtn ghost" onclick="closeSheet()">Close</button>';
      b.innerHTML=head+rows+err;
      return;
    }
    if (h.done){
      rows+='<button class="pbtn warn" onclick="drawSheet(\'undone\')">Undo done</button>';
    } else {
      rows+='<button class="pbtn solid" onclick="drawSheet(\'done\')">'+ICON_TICK+
            (CUR.kind==='clean' ? 'Mark as cleaned' : 'Mark as serviced')+'</button>';
      if (h.bfast){
        rows+='<button class="pbtn" disabled style="opacity:.6">Seated at breakfast '+hhmm(h.bfast)+' ('+mins(h.bfast)+'m ago)</button>';
        rows+='<button class="pbtn warn" onclick="drawSheet(\'clearbf\')">Clear breakfast</button>';
      } else {
        rows+='<button class="pbtn" onclick="drawSheet(\'bfast\')">Guest at breakfast</button>';
      }
      if (CUR.kind==='clean'){
        rows += h.departed
          ? '<button class="pbtn warn" onclick="drawSheet(\'undep\')">Undo departed</button>'
          : '<button class="pbtn" onclick="drawSheet(\'dep\')">Guest departed</button>';
      }
    }
    if (window.IS_MANAGER){
      rows+='<div class="pdiv">Job for today</div>';
      if (CUR.kind!=='clean') rows+='<button class="pbtn" onclick="drawSheet(\'k-clean\')">To be cleaned</button>';
      if (CUR.kind!=='svc')   rows+='<button class="pbtn" onclick="drawSheet(\'k-svc\')">To be serviced</button>';
      if (CUR.kind!=='vac')   rows+='<button class="pbtn" onclick="drawSheet(\'k-vac\')">Mark as vacant</button>';
      /* Only offer the dates back when they actually decide something. On a
         villa the dates cannot place, reverting just returns it to unknown,
         so say that instead of pretending there is a booking to fall back on. */
      if (h.kind){
        rows += (CUR.base==='clean' || CUR.base==='svc')
          ? '<button class="pbtn warn" onclick="drawSheet(\'k-none\')">Use booking dates</button>'
          : '<button class="pbtn warn" onclick="drawSheet(\'k-none\')">Back to unknown</button>';
      }
    }
    rows+='<button class="pbtn ghost" onclick="closeSheet()">Close</button>';
    b.innerHTML=head+rows+err;
  }

  var KINDS = {
    'k-clean': { v:'clean', q:'Set villa '+n+' to be cleaned?',   y:'Yes - to be cleaned',  cls:'solid' },
    'k-svc'  : { v:'svc',   q:'Set villa '+n+' to be serviced?',  y:'Yes - to be serviced', cls:'solid' },
    'k-vac'  : { v:'vac',   q:'Mark villa '+n+' as vacant?',      y:'Yes - vacant',         cls:'solid' },
    'k-none' : { v:null,
                 q:(CUR.base==='clean' || CUR.base==='svc')
                   ? 'Go back to the booking dates for villa '+n+'?'
                   : 'Clear the job for villa '+n+'? It will show as unknown.',
                 y:'Yes - clear', cls:'warn' }
  };
  if (KINDS[mode]){
    var K = KINDS[mode];
    b.innerHTML = head +
      '<div class="st" style="margin-bottom:6px">'+K.q+'</div>'+
      '<button class="pbtn '+K.cls+'" id="kGo">'+K.y+'</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
    /* the value is handed over directly rather than serialised into an
       onclick attribute, where its quotes had nowhere safe to go */
    document.getElementById('kGo').onclick = function(){ setKind(K.v); };
    return;
  }

  if (mode==='bfast'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Seated when?</div>'+
      '<button class="pbtn solid" onclick="stampBf(0)">Just now</button>'+
      '<div class="timerow">'+
        '<button class="pbtn" onclick="stampBf(5)">5 min ago</button>'+
        '<button class="pbtn" onclick="stampBf(10)">10 min ago</button>'+
        '<button class="pbtn" onclick="stampBf(15)">15 min ago</button>'+
      '</div>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }

  if (mode==='done'){
    var doneWord = CUR.kind==='clean' ? 'cleaned' : 'serviced';
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Mark villa '+n+' as '+doneWord+'?</div>'+
      '<button class="pbtn solid" onclick="setField('+n+',{done:new Date().toISOString()},document.getElementById(\'perr\'))">'+ICON_TICK+'Yes - '+doneWord+'</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
  if (mode==='undone'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Remove the done mark from room '+n+'?</div>'+
      '<button class="pbtn warn" onclick="setField('+n+',{done:null},document.getElementById(\'perr\'))">Yes - not done</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
  if (mode==='dep'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Has the guest checked out of room '+n+'?</div>'+
      '<button class="pbtn solid" onclick="setField('+n+',{departed:true},document.getElementById(\'perr\'))">Yes - departed</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
  if (mode==='undep'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Undo departed for room '+n+'?</div>'+
      '<button class="pbtn warn" onclick="setField('+n+',{departed:null},document.getElementById(\'perr\'))">Yes - undo</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
  if (mode==='clearbf'){
    b.innerHTML=head+
      '<div class="st" style="margin-bottom:6px">Clear the breakfast mark for room '+n+'?</div>'+
      '<button class="pbtn warn" onclick="setField('+n+',{bfast:null},document.getElementById(\'perr\'))">Yes - clear</button>'+
      '<button class="pbtn ghost" onclick="drawSheet(\'menu\')">Back</button>'+err;
  }
}
function stampBf(minsAgo){
  var t=new Date(Date.now()-minsAgo*60000).toISOString();
  setField(CUR.n, {bfast:t}, document.getElementById('perr'));
}

load();
setInterval(function(){ if(!CUR) render(); }, 30000);          // tick elapsed times
setInterval(function(){ if(!CUR) load().catch(function(){}); }, 90000);  // background re-fetch
</script>
</body>
</html>
