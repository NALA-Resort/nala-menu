<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nala Villas">
<link rel="apple-touch-icon" href="nala-icon.png?v=1">
<title>Nala &middot; Calendar</title>
<link rel="stylesheet" href="nala-ui2.css?v=6">
<link rel="stylesheet" href="nala-ui.css?v=17">
<style>
  /* Built from mock-calendar.html, approved 12 Sep. This page sets LAYOUT
     only; controls take their dress from the shared sheets. */

  /* Body padding is hand-set on every page rather than by the shared
     sheet (nala-ui2's page-frame note). Missing here on first publish,
     which put the header at the screen's absolute top, under the phone's
     own status bar - the owner's 12 Sep screenshot. Dashboard's pattern,
     safe-area aware. */
  body { padding:calc(24px + env(safe-area-inset-top)) 18px
                 calc(10px + env(safe-area-inset-bottom)); }
  .wrap { max-width:520px; margin:0 auto; }

  /* ── the chart ──────────────────────────────────────────────────────
     One scroll container. The villa column is sticky inside it, so the
     numbers stay put while the days slide under them. Everything else is
     absolutely positioned off two constants: DAY (a day's width) and ROW
     (a villa row's height). At 390pt wide, 64px days show five clear of
     the villa column, which is the floor the owner set. */
  .chartwrap { border:1.2px solid var(--rule); border-radius:10px; background:#fff;
    overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .chart { position:relative; }
  .monthrow { font-family:var(--ui-font); font-size:9px; /* off-scale: micro-caption, the shared sheet's stat-l size */ letter-spacing:.16em;
    text-transform:uppercase; color:var(--mid); padding:8px 0 0; }
  /* the month rides the scroll AND follows it: the window spans three
     months since it grew to 61 days, so the label names the month under
     the board's left edge, rewritten as you swipe. A label computed once
     from the window's first day said August into mid-September. */
  .month { position:sticky; left:40px; display:inline-block; white-space:nowrap; }
  .dayhead { position:relative; height:26px; border-bottom:1.2px solid var(--rule); }
  .dh { position:absolute; top:0; height:100%; display:flex; align-items:center;
    justify-content:center; font-family:var(--ui-font);
    font-size:11px; /* off-scale: the board is a fixed-density grid, the approved mock's sizes; --t1 overflows a compressed row */
    color:var(--mid); white-space:nowrap; }
  .dh b { font-weight:600; color:var(--ink); margin-left:4px; }
  .dh.today { color:var(--ink); font-weight:600; }
  .grid { position:relative; }
  /* day columns: hairline left edge each; weekends take the faintest wash */
  .col { position:absolute; top:0; bottom:0; border-left:1px solid rgba(28,28,26,.05); }
  .col.wkend { background:rgba(28,28,26,.02); }
  /* today: a hairline down the whole board, ink not red - red is failure's */
  .nowline { position:absolute; top:0; bottom:0; width:1.6px;
    background:rgba(28,28,26,.45); z-index:3; }
  .vrow { position:relative; border-bottom:1px solid rgba(28,28,26,.06); }
  .vrow:last-child { border-bottom:0; }
  /* the villa number, riding the left edge of the scroll */
  .vnum { position:sticky; left:0; z-index:4; width:34px; height:100%; display:flex;
    align-items:center; justify-content:center; font-family:var(--ui-font);
    color:var(--ink); background:rgba(255,255,255,.92);
    border-right:1.2px solid var(--rule); }
  /* a stay's fill is the pre-arrival form's state, the Front Desk's own
     three tints (ruled 12 Sep): green completed, amber incomplete, grey
     not started. Edge times: check-in 2pm, checkout 10am (ARRIVE_H /
     DEPART_H below). A bar is an <a> when the login may open the profile
     behind it, and a plain div when it may not - the board is broad, the
     detail behind it is not. */
  .bar { position:absolute; display:flex; align-items:center; background:#fff;
    border:1.2px solid #C9C9C1; z-index:2; color:var(--ink);
    text-decoration:none; }
  .bar .n { font-family:var(--ui-font); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; position:sticky; left:40px; }
  .bar.fdone { background:rgba(122,160,130,.26); border-color:rgba(122,160,130,.65); }
  .bar.fpart { background:#F6EAD5; border-color:#C29A55; }
  .bar.ftodo { background:rgba(28,28,26,.045); border-color:#C9C9C1; }
  /* a stay running off either edge of the loaded window squares that end
     off: the booking continues, the board just stops */
  .bar.cutL { border-top-left-radius:0 !important; border-bottom-left-radius:0 !important;
    border-left-style:dashed; }
  .bar.cutR { border-top-right-radius:0 !important; border-bottom-right-radius:0 !important;
    border-right-style:dashed; }

  /* ── the board's one size ───────────────────────────────────────────
     The whole house on one screen, no vertical scroll: fitRows() below
     measures where the grid starts and what sits below it, and divides
     what the screen actually has by 17, re-measuring on rotate and
     resize; the calc is only the pre-measurement fallback. */
  /* declared here so the token has a defined life before fitRows()
     measures: the initial value IS the pre-measurement fallback */
  :root { --rowh: calc((100vh - 204px)/17); }
  .vrow { height:var(--rowh); min-height:22px; }
  .bar { top:3px; height:calc(100% - 7px); padding:0 7px; border-radius:6px; }
  .bar .n { font-size:11px; } /* off-scale: fits the fitted board's 15px bars */
  .vnum { font-size:13px; } /* off-scale: a step above the bar text */

  /* a board that could not be read says so; it never shows as empty */
  .boardnote { font-family:var(--ui-font); font-size:var(--t1); color:var(--mid);
    margin:8px 2px; }
</style>
</head>
<body class="tier-app ui2">

<div class="errbar" id="errBar"></div>

<div class="wrap">
  <div class="daterow">
    <button class="dnav today" id="dToday">Today</button>
    <button class="dnav" id="dPrev">&#8249;</button>
    <div class="date" id="date"></div>
    <button class="dnav" id="dNext">&#8250;</button>
    <div class="navwrap" id="navWrap" style="display:none">
      <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="navdrop" id="navDrop"></div>
    </div>
  </div>

  <div class="noaccess" id="noAccess"></div>

  <div class="stats" id="statsRow">
    <div class="stat"><div class="stat-n" id="nIn">&ndash;</div><div class="stat-l">In house</div></div>
    <div class="stat"><div class="stat-n" id="nArr">&ndash;</div><div class="stat-l">Arriving</div></div>
    <div class="stat"><div class="stat-n" id="nDep">&ndash;</div><div class="stat-l">Departing</div></div>
  </div>

  <div class="chartwrap" id="wrap"><div class="chart" id="chart"></div></div>
  <div class="boardnote" id="boardNote"></div>
</div><!-- /wrap -->

<script>
(function(){
  var b = document.getElementById('navBtn'), d = document.getElementById('navDrop');
  b.onclick = function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click', function(){ d.classList.remove('open'); });
})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=12"></script>
<script src="nala-shared.js?v=67"></script>
<script>
/* The whole house across a month: villas down the side, days across, each
   stay a bar. A reader in the rule-7 sense - every value here is owned
   elsewhere:

     the stays and their dates    /stays/<date>, parseDepDate
     a bar's fill                 formState()          Front Desk's three states
     the massage half of that     /spa/<booking>, via formState's spa argument
     the viewed day               initDateNav()        the standard daterow

   WHY THE BOARD HOLDS A MONTH EACH WAY AND NO MORE. Three reasons:
   1. Reads. One /stays/<date> read per day column - two months is ~61
      reads on open, fine for a glance page; a season is hundreds.
   2. Fingers. At 64px a day, a month each way is ~2,000px of swipe in
      either direction - about the limit where swiping beats the date
      picker. The picker and the arrows exist for the long jump only,
      the owner's rule of 12 Sep: everything near is a swipe.
   3. Need. The board answers "who is in, and who is coming"; a booking
      two months out changes nothing anybody does today. */

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

var nav = initDateNav();
var VIEW = nav.VIEW;

var ROOMS_N = (typeof ROOMS === 'number' ? ROOMS : 17);
var DAY = 64, VCOL = 34;      /* px: day width, villa column - the mock's numbers */
var FROM = -30, DAYS = 61;    /* a month back, a month forward - the owner's rule,
                                 12 Sep: swiping covers everything near, so the date
                                 controls keep only the long jump */
/* where a bar's edges sit inside a day, ruled by the owner 12 Sep:
   check-in 2pm on the arrival day, checkout 10am on the departure day,
   so a same-day turnover shows the four-hour changeover gap. */
var ARRIVE_H = 14/24, DEPART_H = 10/24;

var WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* a date's day-offset from the window's first day. Midday-anchored local
   dates from parseDepDate, so a full ISO stamp and a bare date land the
   same - never a string slice (CLAUDE.md rule 7's closing law). */
function dayOff(d){
  var a = new Date(VIEW.getFullYear(), VIEW.getMonth(), VIEW.getDate() + FROM, 12);
  var b = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
  return Math.round((b - a) / 864e5);
}

var ROLE = null, CAN_OPEN = false, LOADED = false;

/* ── the read ──────────────────────────────────────────────────
   One /stays night per day column, /spa whole (the node Dashboard and
   Pre-arrival SMS already read whole), then one prearrival per unique
   booking - not per night, a stay's answers are one record. */
function readDay(dk){
  return fetch(DB + '/stays/' + dk + '.json?v=' + Date.now())
    .then(function(r){ if (!r.ok) return { failed:true };
                       return r.json().then(function(d){ return { data:d }; }); })
    .catch(function(){ return { failed:true }; });
}

function load(){
  var d0 = new Date(VIEW.getFullYear(), VIEW.getMonth(), VIEW.getDate() + FROM, 12);
  var dks = [];
  for (var i = 0; i < DAYS; i++){
    var dt = new Date(d0); dt.setDate(d0.getDate() + i);
    dks.push(dkey(dt));
  }
  return Promise.all(
    dks.map(readDay).concat([
      fetch(DB + '/spa.json?v=' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
    ])
  ).then(function(res){
    var spa = res[DAYS] || {};
    var failedDays = 0, bookings = {};
    for (var i = 0; i < DAYS; i++){
      if (res[i].failed){ failedDays++; continue; }
      var night = res[i].data || {};
      for (var v in night){
        var s = night[v];
        if (!s || typeof s !== 'object' || !s.id) continue;
        if (!bookings[s.id]) bookings[s.id] = { id:s.id, villa:String(v), stay:s };
      }
    }
    var ids = Object.keys(bookings);
    return Promise.all(ids.map(function(id){
      return fetch(DB + '/bookings/' + id + '/prearrival.json?v=' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
        .then(function(p){ bookings[id].pre = p; });
    })).then(function(){
      LOADED = true;
      render(bookings, spa, failedDays);
    });
  });
}

/* ── the drawing - the mock's generator, verbatim in shape ───── */
function render(bookings, spa, failedDays){
  var W = VCOL + DAYS * DAY;
  var d0 = new Date(VIEW.getFullYear(), VIEW.getMonth(), VIEW.getDate() + FROM, 12);
  var h = '<div class="monthrow" style="width:' + W + 'px;height:22px">' +
          '<span class="month" id="monthLbl"></span>' +
          '</div><div class="dayhead" style="width:' + W + 'px">';
  var todayOff = dayOff(new Date());
  for (var i = 0; i < DAYS; i++){
    var dt = new Date(d0); dt.setDate(d0.getDate() + i);
    h += '<div class="dh' + (i === todayOff ? ' today' : '') +
         '" style="left:' + (VCOL + i * DAY) + 'px;width:' + DAY + 'px">' +
         WD[dt.getDay()] + '<b>' + dt.getDate() + '</b></div>';
  }
  h += '</div><div class="grid" style="width:' + W + 'px">';
  var cols = '';
  for (var i = 0; i < DAYS; i++){
    var dt = new Date(d0); dt.setDate(d0.getDate() + i);
    var we = dt.getDay() === 0 || dt.getDay() === 6;
    cols += '<div class="col' + (we ? ' wkend' : '') +
            '" style="left:' + (VCOL + i * DAY) + 'px;width:' + DAY + 'px"></div>';
  }
  /* today's line sits at midday, inside the 10am-2pm changeover window;
     drawn only when today is on the board at all */
  var nowline = (todayOff >= 0 && todayOff < DAYS)
    ? '<div class="nowline" style="left:' + (VCOL + (todayOff + .5) * DAY) + 'px"></div>'
    : '';

  var stats = { inh:0, arr:0, dep:0 };
  var byVilla = {};
  Object.keys(bookings).forEach(function(id){
    var b = bookings[id];
    (byVilla[b.villa] = byVilla[b.villa] || []).push(b);
  });

  for (var v = 1; v <= ROOMS_N; v++){
    h += '<div class="vrow">' + cols + nowline;
    (byVilla[String(v)] || []).forEach(function(b){
      var a = parseDepDate(b.stay.arrive), dep = parseDepDate(b.stay.depart);
      if (!a || !dep) return;
      /* the viewed day's tally: in house is a night being slept here */
      if (dayOff(a) <= 0 - FROM && dayOff(dep) > 0 - FROM) stats.inh++;
      if (dkey(a) === nav.todayKey()) stats.arr++;
      if (dkey(dep) === nav.todayKey()) stats.dep++;
      var x1 = (dayOff(a) + ARRIVE_H) * DAY, x2 = (dayOff(dep) + DEPART_H) * DAY;
      var cutL = x1 < 0, cutR = x2 > DAYS * DAY;
      x1 = Math.max(x1, 0); x2 = Math.min(x2, DAYS * DAY);
      if (x2 <= 0 || x1 >= DAYS * DAY) return;
      var name = [b.stay.last, b.stay.first].filter(Boolean).join(', ');
      var st = formState(b.pre, { arrive:b.stay.arrive, depart:b.stay.depart },
                         (spa || {})[b.id]);
      var cls = st === 'completed' ? 'fdone' : st === 'incomplete' ? 'fpart' : 'ftodo';
      var open = CAN_OPEN
        ? '<a class="bar ' + cls + (cutL ? ' cutL' : '') + (cutR ? ' cutR' : '') +
          '" href="guest.html?b=' + encodeURIComponent(b.id) + '"'
        : '<div class="bar ' + cls + (cutL ? ' cutL' : '') + (cutR ? ' cutR' : '') + '"';
      h += open + ' style="left:' + (VCOL + x1) + 'px;width:' + (x2 - x1) + 'px">' +
           '<span class="n">' + esc(name) + '</span>' + (CAN_OPEN ? '</a>' : '</div>');
    });
    h += '<div class="vnum">' + v + '</div></div>';
  }
  h += '</div>';
  document.getElementById('chart').innerHTML = h;
  document.getElementById('nIn').textContent = stats.inh;
  document.getElementById('nArr').textContent = stats.arr;
  document.getElementById('nDep').textContent = stats.dep;
  /* a failed read is not an empty day, and must never look like one */
  document.getElementById('boardNote').textContent = failedDays
    ? failedDays + (failedDays === 1 ? ' day' : ' days') + ' could not be read'
    : '';
  /* open on the viewed day with yesterday against the villa column -
     the month behind is there to swipe to, not to land on */
  var wrap = document.getElementById('wrap');
  wrap.onscroll = paintMonth;
  wrap.scrollLeft = (0 - FROM - 1) * DAY;
  paintMonth();
  fitRows();
}

/* the month under the board's left edge, kept true while swiping */
function paintMonth(){
  var lbl = document.getElementById('monthLbl');
  var wrap = document.getElementById('wrap');
  if (!lbl || !wrap) return;
  var i = Math.min(DAYS - 1, Math.max(0, Math.floor(wrap.scrollLeft / DAY)));
  var dt = new Date(VIEW.getFullYear(), VIEW.getMonth(), VIEW.getDate() + FROM + i, 12);
  lbl.textContent = MO[dt.getMonth()] + ' ' + dt.getFullYear();
}

/* All 17 villas on one screen, from what the screen actually has: the
   space under the grid's real top edge, shared evenly. Re-measured on
   rotate and resize. min-height in the CSS guards the smallest phones. */
function fitRows(){
  var grid = document.querySelector('.grid');
  if (!grid) return;
  var gr = grid.getBoundingClientRect();
  var top = gr.top + window.scrollY;
  /* everything below the grid - borders, the board note, the body's own
     bottom padding - measured rather than assumed, like the top */
  var below = document.documentElement.scrollHeight - (gr.bottom + window.scrollY);
  var avail = window.innerHeight - top - below;
  document.documentElement.style.setProperty('--rowh',
    Math.max(22, Math.floor(avail / ROOMS_N * 10) / 10) + 'px');
}
window.addEventListener('resize', fitRows);
window.addEventListener('orientationchange', fitRows);

function navFilter(role){ if (window.NALA_NAVFILTER) NALA_NAVFILTER(role); }

/* ── access ──────────────────────────────────────────────────── */
function showAccess(allowed, e){
  var box = document.getElementById('noAccess');
  var on = !allowed;
  box.innerHTML = !on ? '' :
    (e ? '<div>Could not check access. This is usually the connection, '
       + 'not your login.</div>'
       + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
       : 'This login has no access to the Calendar. See the manager.');
  if (on && !e){
    var home = homeFor(window.NALA_ROLE);
    if (home && home !== location.pathname.split('/').pop()){
      location.replace(home); return;
    }
  }
  box.className = 'noaccess' + (on ? ' show' : '');
  var els = [document.getElementById('statsRow'), document.getElementById('wrap')];
  els.forEach(function(el){ if (el) el.style.display = on ? 'none' : ''; });
  if (!on) load().catch(function(){});
}

window.NALA_ROLE = null;
(function gate(){
  if (!window.firebase || !firebase.auth || typeof loadStaff !== 'function')
    return setTimeout(gate, 40);
  var A; try { A = firebase.auth(); } catch(e){ return setTimeout(gate, 40); }
  if (!A || !A.onAuthStateChanged) return setTimeout(gate, 40);
  A.onAuthStateChanged(function(u){
    if (!u) return;                 /* auth.js owns the signed-out state */
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role; window.NALA_USER = u;
      ROLE = role;
      /* The board opens to cleansBoard - the grounds and housekeeping
         logins are who it is for. A bar is a door to the Guest Profile,
         which answers to resBoard, so the door only exists for a login
         holding that key - the Dashboard's own doors rule. */
      CAN_OPEN = can(role, 'resBoard');
      document.getElementById('navWrap').style.display = 'block';
      navFilter(role);
      showAccess(can(role, 'cleansBoard'), e);
    });
  });
})();

/* Coming back to the app is when a stale board is most obvious. */
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && LOADED) load().catch(function(){});
});
</script>
</body>
</html>
