<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nala Villas">

<title>Nala &middot; Calendar</title>
<link rel="stylesheet" href="nala-ui2.css?v=7">
<link rel="stylesheet" href="nala-ui.css?v=17">
<style>
  /* Built from mock-calendar.html, approved 12 Sep. This page sets LAYOUT
     only; controls take their dress from the shared sheets. */

  /* Body padding is hand-set on every page rather than by the shared
     sheet (nala-ui2's page-frame note). Missing here on first publish,
     which put the header at the screen's absolute top, under the phone's
     own status bar - the owner's 12 Sep screenshot. Dashboard's pattern,
     safe-area aware. */
  body { padding:calc(24px + env(safe-area-inset-top)) 18px
                 calc(10px + env(safe-area-inset-bottom)); }
  .wrap { max-width:var(--appw); margin:0 auto; }

  /* ── the chart ──────────────────────────────────────────────────────
     One scroll container. The villa column is sticky inside it, so the
     numbers stay put while the days slide under them. Everything else is
     absolutely positioned off two constants: DAY (a day's width) and ROW
     (a villa row's height). At 390pt wide, 64px days show five clear of
     the villa column, which is the floor the owner set. */
  .chartwrap { border:1.2px solid var(--rule); border-radius:10px; background:#fff;
    overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .chart { position:relative; }
  .monthrow { font-family:var(--ui-font); font-size:9px; /* off-scale: micro-caption, the shared sheet's stat-l size */ letter-spacing:.16em;
    text-transform:uppercase; color:var(--mid); padding:8px 0 0; }
  /* the month rides the scroll AND follows it: the window spans three
     months since it grew to 61 days, so the label names the month under
     the board's left edge, rewritten as you swipe. A label computed once
     from the window's first day said August into mid-September. */
  .month { position:sticky; left:40px; display:inline-block; white-space:nowrap; }
  .dayhead { position:relative; height:26px; border-bottom:1.2px solid var(--rule); }
  .dh { position:absolute; top:0; height:100%; display:flex; align-items:center;
    justify-content:center; font-family:var(--ui-font);
    font-size:11px; /* off-scale: the board is a fixed-density grid, the approved mock's sizes; --t1 overflows a compressed row */
    color:var(--mid); white-space:nowrap; }
  .dh b { font-weight:600; color:var(--ink); margin-left:4px; }
  .dh.today { color:var(--ink); font-weight:600; }
  .grid { position:relative; }
  /* day columns: hairline left edge each; weekends take the faintest wash */
  .col { position:absolute; top:0; bottom:0; border-left:1px solid rgba(28,28,26,.05); }
  .col.wkend { background:rgba(28,28,26,.02); }
  /* today: a hairline down the whole board, ink not red - red is failure's */
  .nowline { position:absolute; top:0; bottom:0; width:1.6px;
    background:rgba(28,28,26,.45); z-index:3; }
  .vrow { position:relative; border-bottom:1px solid rgba(28,28,26,.06); }
  .vrow:last-child { border-bottom:0; }
  /* the villa number, riding the left edge of the scroll */
  .vnum { position:sticky; left:0; z-index:4; width:34px; height:100%; display:flex;
    align-items:center; justify-content:center; font-family:var(--ui-font);
    color:var(--ink); background:rgba(255,255,255,.92);
    border-right:1.2px solid var(--rule); }
  /* a stay's fill is the pre-arrival form's state, the Front Desk's own
     three tints (ruled 12 Sep): green completed, amber incomplete, grey
     not started. Edge times: check-in 2pm, checkout 10am (ARRIVE_H /
     DEPART_H below). A bar is an <a> when the login may open the profile
     behind it, and a plain div when it may not - the board is broad, the
     detail behind it is not. */
  .bar { position:absolute; display:flex; align-items:center; background:#fff;
    border:1.2px solid #C9C9C1; z-index:2; color:var(--ink);
    text-decoration:none; }
  .bar .n { font-family:var(--ui-font); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; position:sticky; left:40px; }
  /* A bar's fill is the selected dimension. Every bar carries a class for
     each dimension at once (f* pre-arrival, d* dining, s* spa); the mode
     class on #wrap lights exactly one, so switching modes repaints nothing
     but the CSS match. Pre-arrival (m-form) is the default and the look the
     board shipped with. The colours are the colour law's, verbatim, so the
     board reads the same as Reservations, the Front Desk and Spa. */
  #wrap.m-form   .bar.fdone { background:rgba(122,160,130,.26); border-color:rgba(122,160,130,.65); }
  #wrap.m-form   .bar.fpart { background:#F6EAD5; border-color:#C29A55; }
  #wrap.m-form   .bar.ftodo { background:rgba(28,28,26,.045); border-color:#C9C9C1; }
  #wrap.m-dining .bar.din   { background:rgba(122,160,130,.26); border-color:rgba(122,160,130,.65); }
  #wrap.m-dining .bar.dout  { background:rgba(184,106,90,.16); border-color:rgba(184,106,90,.45); }
  #wrap.m-dining .bar.dnone { background:rgba(28,28,26,.045); border-color:#C9C9C1; }
  #wrap.m-spa    .bar.sbooked { background:rgba(122,160,130,.26); border-color:rgba(122,160,130,.65); }
  #wrap.m-spa    .bar.ssugg   { background:#F6EAD5; border-color:#C29A55; }
  #wrap.m-spa    .bar.swait   { background:rgba(28,28,26,.045); border-color:#C9C9C1; }
  #wrap.m-spa    .bar.sdecl   { background:rgba(184,106,90,.16); border-color:rgba(184,106,90,.45); }
  #wrap.m-spa    .bar.snone   { background:transparent; border-style:dashed;
    border-color:var(--mid); opacity:.62; }
  /* Clean is the ROOM's status, not the booking's, so its screen greys every
     pill and the meaning moves to the villa number's colour (below). Nothing
     is double-encoded: pill colour never fights the room's colour. */
  #wrap.m-clean  .bar        { background:rgba(28,28,26,.045); border-color:#C9C9C1;
    color:var(--mid); }

  /* Clean screen: the villa NUMBER carries the state, so nothing crowds the
     narrow cell. The cell fills are OPAQUE so a bar's name cannot show through
     from behind it. Cleaned (vacant, ready) sits in the pastel green; in house
     (occupied) is a neutral grey; requires cleaning stays plain white; the
     flag turns it amber (below). And the grey pills' names are muted here -
     the booking is not the point on this screen, the room is. */
  #wrap.m-clean .vrow .vnum        { background:#fff; }
  #wrap.m-clean .vrow.rm-clean   .vnum { background:#E4EDE2; }
  #wrap.m-clean .vrow.rm-inhouse .vnum { background:#EAEAE6; }
  #wrap.m-clean .bar .n            { color:rgba(28,28,26,.32); }
  /* the flag: a room that requires cleaning AND has an arrival within
     CLEAN_FLAG_DAYS. Amber - attention, chase this - the colour law. Rides
     the sticky cell so it stays put while the days scroll. Clean screen only. */
  #wrap.m-clean .vrow.flag { background:rgba(246,234,213,.5); }
  #wrap.m-clean .vrow.flag .vnum { background:#F6EAD5; box-shadow:inset 3px 0 0 #C29A55; }

  /* ── the colour-state selector ──────────────────────────────────────
     A segmented control; the lit segment wears the Selected dress (grey
     fill, ink border), the same treatment Expand carries elsewhere. */
  .selrow { display:flex; align-items:center; gap:8px; margin:2px 0 7px; }
  .selcap { font-family:var(--ui-font); font-size:9px; /* off-scale: micro-caption below --t1, the shared sheet's stat-l size - the "Colour by" label, matching the monthrow's 9px */ letter-spacing:.14em;
    text-transform:uppercase; color:var(--mid); white-space:nowrap; }
  .modes { display:flex; gap:6px; flex:1; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .mbtn { flex:0 0 auto; height:30px; padding:0 11px; border:1px solid var(--rule);
    border-radius:8px; background:none; color:var(--mid); font-family:var(--ui-font);
    font-size:var(--t1); white-space:nowrap; }
  .mbtn.on { background:rgba(28,28,26,.045); border-color:var(--ink);
    color:var(--ink); font-weight:600; }
  .clegend { display:none; flex-wrap:wrap; gap:4px 12px; margin:0 2px 8px;
    font-family:var(--ui-font); font-size:11px; /* off-scale: the legend rides the compressed selector row, a step below --t1 */ color:var(--mid); }
  .clegend.show { display:flex; }
  .clegend .lg { display:inline-flex; align-items:center; gap:5px; }
  .clegend .sw { width:12px; height:12px; border-radius:4px; border:1.2px solid var(--rule);
    box-sizing:border-box; }
  .sw-green { background:rgba(122,160,130,.26); border-color:rgba(122,160,130,.65); }
  .sw-amber { background:#F6EAD5; border-color:#C29A55; }
  .sw-terra { background:rgba(184,106,90,.16); border-color:rgba(184,106,90,.45); }
  .sw-grey  { background:rgba(28,28,26,.045); border-color:#C9C9C1; }
  .sw-sunk  { background:transparent; border-style:dashed; border-color:var(--mid); opacity:.7; }
  .sw-clean { background:#E4EDE2; border-color:#7E937A; }
  .sw-inhouse { background:#EAEAE6; border-color:#C9C9C1; }
  .sw-plain { background:#fff; border-color:#C9C9C1; }
  .blk-amber { display:inline-block; width:12px; height:12px; border-radius:3px;
    background:#F6EAD5; box-shadow:inset 3px 0 0 #C29A55; }
  /* a stay running off either edge of the loaded window squares that end
     off: the booking continues, the board just stops */
  .bar.cutL { border-top-left-radius:0 !important; border-bottom-left-radius:0 !important;
    border-left-style:dashed; }
  .bar.cutR { border-top-right-radius:0 !important; border-bottom-right-radius:0 !important;
    border-right-style:dashed; }

  /* ── the board's one size ───────────────────────────────────────────
     The whole house on one screen, no vertical scroll: fitRows() below
     measures where the grid starts and what sits below it, and divides
     what the screen actually has by 17, re-measuring on rotate and
     resize; the calc is only the pre-measurement fallback. */
  /* declared here so the token has a defined life before fitRows()
     measures: the initial value IS the pre-measurement fallback */
  :root { --rowh: calc((100vh - 204px)/17); }
  .vrow { height:var(--rowh); min-height:22px; }
  .bar { top:3px; height:calc(100% - 7px); padding:0 7px; border-radius:6px; }
  .bar .n { font-size:11px; } /* off-scale: fits the fitted board's 15px bars */
  .vnum { font-size:13px; } /* off-scale: a step above the bar text */

  /* a board that could not be read says so; it never shows as empty */
  .boardnote { font-family:var(--ui-font); font-size:var(--t1); color:var(--mid);
    margin:8px 2px; }
</style>
</head>
<body class="tier-app ui2">

<div class="errbar" id="errBar"></div>

<div class="wrap">
  <div class="daterow">
    <button class="dnav today" id="dToday">Today</button>
    <button class="dnav" id="dPrev">&#8249;</button>
    <div class="date" id="date"></div>
    <button class="dnav" id="dNext">&#8250;</button>
    <div class="navwrap" id="navWrap" style="display:none">
      <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="navdrop" id="navDrop"></div>
    </div>
  </div>

  <div class="colorbar" id="colorBar">
    <div class="selrow">
      <div class="selcap">Colour by</div>
      <div class="modes" id="modes">
        <button class="mbtn on" data-m="form">Pre-arrival</button>
        <button class="mbtn" data-m="clean">Clean</button>
        <button class="mbtn" data-m="dining">Dining</button>
        <button class="mbtn" data-m="spa">Spa</button>
      </div>
    </div>
    <div class="clegend show" data-leg="form">
      <span class="lg"><span class="sw sw-green"></span>Completed</span>
      <span class="lg"><span class="sw sw-amber"></span>Incomplete</span>
      <span class="lg"><span class="sw sw-grey"></span>Not started</span>
    </div>
    <div class="clegend" data-leg="clean">
      <span class="lg"><span class="sw sw-clean"></span>Cleaned</span>
      <span class="lg"><span class="sw sw-inhouse"></span>In house</span>

    </div>

      <span class="lg"><span class="sw sw-green"></span>Dining</span>

  <div class="stats" id="statsRow">

    <div class="stat"><div class="stat-n" id="nArr">&ndash;</div><div class="stat-l">Arriving</div></div>
    <div class="stat"><div class="stat-n" id="nDep">&ndash;</div><div class="stat-l">Departing</div></div>
  </div>

  <div class="chartwrap m-form" id="wrap"><div class="chart" id="chart"></div></div>
  <div class="boardnote" id="boardNote"></div>
</div><!-- /wrap -->

<script>
(function(){
  var b = document.getElementById('navBtn'), d = document.getElementById('navDrop');
  b.onclick = function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click', function(){ d.classList.remove('open'); });
})();

/* The colour-state selector. It swaps a single class on #wrap; the fills are
   pure CSS off that class, so a mode change repaints without re-reading a
   thing. Every bar already carries all four dimensions' classes and every
   row its clean state, drawn once at render. */
(function(){
  var modes = document.getElementById('modes'), wrap = document.getElementById('wrap');
  if (!modes || !wrap) return;
  modes.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.mbtn') : null;
    if (!b) return;
    var m = b.getAttribute('data-m');
    wrap.className = wrap.className.replace(/\bm-[a-z]+\b/g, '').replace(/\s+/g, ' ').trim()
                    + ' m-' + m;
    Array.prototype.forEach.call(modes.querySelectorAll('.mbtn'), function(x){
      x.classList.toggle('on', x === b); });
    Array.prototype.forEach.call(document.querySelectorAll('.clegend'), function(l){
      l.classList.toggle('show', l.getAttribute('data-leg') === m); });
  });
})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=12"></script>
<script src="nala-shared.js?v=77"></script>
<script>
/* The whole house across a month: villas down the side, days across, each
   stay a bar. A reader in the rule-7 sense - every value here is owned
   elsewhere:

     the stays and their dates    /stays/<date>, parseDepDate
     a bar's fill                 formState()          Front Desk's three states
       or, by the selector        diningState()        the dinner intent
       or                         massageState()       the spa loop
     the massage half of that     /spa/<booking>, via formState's spa argument
     the room's clean state       roomCleanState()     hkClassify + the done flag
     the clean flag window        arrivalFlagsClean()  CLEAN_FLAG_DAYS, owner 20 Sep
     the viewed day               initDateNav()        the standard daterow

   The colour-state selector swaps which of those paints the pills. Pre-arrival,
   Dining and Spa are the booking's status and colour the bar; Clean is the
   ROOM's status and instead greys the pills, draws a dot by the villa number,
   and turns a row amber when a requires-cleaning room has an arrival due.

   WHY THE BOARD HOLDS A MONTH EACH WAY AND NO MORE. Three reasons:
   1. Reads. The window is ONE ranged /stays read (orderBy="$key" across
      it, the Worker's own pattern), so a wider window costs the same one
      request it does now - the read is no longer the reason for the cap.
      What is: a season of bars is more than a glance page should draw and
      the fingers and the need below still hold.
   2. Fingers. At 64px a day, a month each way is ~2,000px of swipe in
      either direction - about the limit where swiping beats the date
      picker. The picker and the arrows exist for the long jump only,
      the owner's rule of 12 Sep: everything near is a swipe.
   3. Need. The board answers "who is in, and who is coming"; a booking
      two months out changes nothing anybody does today. */

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

var nav = initDateNav();
var VIEW = nav.VIEW;

var ROOMS_N = (typeof ROOMS === 'number' ? ROOMS : 17);
var DAY = 64, VCOL = 34;      /* px: day width, villa column - the mock's numbers */
var FROM = -30, DAYS = 61;    /* a month back, a month forward - the owner's rule,
                                 12 Sep: swiping covers everything near, so the date
                                 controls keep only the long jump */
/* where a bar's edges sit inside a day, ruled by the owner 12 Sep:
   check-in 2pm on the arrival day, checkout 10am on the departure day,
   so a same-day turnover shows the four-hour changeover gap. */
var ARRIVE_H = 14/24, DEPART_H = 10/24;

var WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* a date's day-offset from the window's first day. Midday-anchored local
   dates from parseDepDate, so a full ISO stamp and a bare date land the
   same - never a string slice (CLAUDE.md rule 7's closing law). */
function dayOff(d){
  var a = new Date(VIEW.getFullYear(), VIEW.getMonth(), VIEW.getDate() + FROM, 12);
  var b = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
  return Math.round((b - a) / 864e5);
}

var ROLE = null, CAN_OPEN = false, LOADED = false;

/* ── the read ──────────────────────────────────────────────────
   ONE ranged read over /stays for the whole window - orderBy="$key" from
   the window's first day to its last - in place of a fetch per day column.
   The Worker's own pattern (worker/mews-sync.js): ordering by key needs no
   index, and the 61 round trips this page opened with become one, which is
   what made the board slow to load. An un-indexed query may hand back keys
   outside the asked range, so load() keys the result back into the days it
   asked for and drops the rest (the Worker's note). /spa whole (the node
   Dashboard and Pre-arrival SMS already read whole), and /bookings whole
   for every bar's pre-arrival answers - one read, not a fetch per booking
   (readBookings below; the HTTP/1.1 staircase that made the board slow). */
function readStays(loK, hiK){
  var url = DB + '/stays.json?orderBy=' + encodeURIComponent('"$key"') +
            '&startAt=' + encodeURIComponent('"' + loK + '"') +
            '&endAt='   + encodeURIComponent('"' + hiK + '"') +
            '&v=' + Date.now();
  return fetch(url)
    .then(function(r){ if (!r.ok) return { failed:true };
                       return r.json().then(function(d){ return { data:d || {} }; }); })
    .catch(function(){ return { failed:true }; });
}

/* One whole /bookings read for every bar's pre-arrival answers, in place
   of a fetch per booking. The RTDB REST endpoint is HTTP/1.1 (the network
   trace, 22 Sep), so the browser runs six reads at a time: a two-month
   window's ~100 bookings queued into ~17 waves and made the board take
   seconds - the prearrival staircase that dwarfed the stays reads. This is
   the node the spa badge (nala-shared) and spa.html already read whole. */
function readBookings(){
  return fetch(DB + '/bookings.json?v=' + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .catch(function(){ return null; });
}

function load(){
  var d0 = new Date(VIEW.getFullYear(), VIEW.getMonth(), VIEW.getDate() + FROM, 12);
  var dks = [];
  for (var i = 0; i < DAYS; i++){
    var dt = new Date(d0); dt.setDate(d0.getDate() + i);
    dks.push(dkey(dt));
  }
  /* /hk/<today> is the day's housekeeping record, read whole like /spa; the
     Clean dot reads cleaned-vs-requires-cleaning from it through
     roomCleanState, the same node and the same done flag cleaners.html letters
     its chips from. Always today's - the dot is a room's state now, not the
     viewed day's - so it is one read whatever the board is scrolled to.
     Three reads on open now - the stays window, /spa, /hk - not sixty-odd. */
  return Promise.all([
    readStays(dks[0], dks[DAYS - 1]),
    fetch(DB + '/spa.json?v=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; }),
    fetch(DB + '/hk/' + nav.todayKey() + '.json?v=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })
  ]).then(function(res){
    var staysRes = res[0], spa = res[1] || {}, hk = res[2] || {};
    var allNights = staysRes.failed ? {} : (staysRes.data || {});
    /* one read either brings the window or it does not: a failure is the
       whole window at once now, not a per-day count */
    var readFailed = !!staysRes.failed;
    var bookings = {}, nightBy = {};
    for (var i = 0; i < DAYS; i++){
      /* key the ranged result back to the window: a key handed back beyond
         the asked range is dropped, a day it did not return is an empty
         night - not a failed read (readFailed above owns that). */
      var night = allNights[dks[i]] || {};
      nightBy[dks[i]] = night;
      for (var v in night){
        var s = night[v];
        if (!s || typeof s !== 'object' || !s.id) continue;
        if (!bookings[s.id]) bookings[s.id] = { id:s.id, villa:String(v), stay:s };
      }
    }
    /* pluck each in-window booking's pre-arrival out of the one whole read.
       A booking with no record, or a whole read that failed, leaves pre
       null - formState then reads it as not-started, the same as a missing
       per-booking read did before. */
    return readBookings().then(function(all){
      all = all || {};
      Object.keys(bookings).forEach(function(id){
        var rec = all[id];
        bookings[id].pre = (rec && rec.prearrival) ? rec.prearrival : null;
      });
      LOADED = true;
      render(bookings, spa, readFailed, hk, nightBy);
    });
  });
}

/* ── the drawing - the mock's generator, verbatim in shape ───── */
function render(bookings, spa, readFailed, hk, nightBy){
  var W = VCOL + DAYS * DAY;
  var d0 = new Date(VIEW.getFullYear(), VIEW.getMonth(), VIEW.getDate() + FROM, 12);
  var h = '<div class="monthrow" style="width:' + W + 'px;height:22px">' +
          '<span class="month" id="monthLbl"></span>' +
          '</div><div class="dayhead" style="width:' + W + 'px">';
  var todayOff = dayOff(new Date());
  for (var i = 0; i < DAYS; i++){
    var dt = new Date(d0); dt.setDate(d0.getDate() + i);
    h += '<div class="dh' + (i === todayOff ? ' today' : '') +
         '" style="left:' + (VCOL + i * DAY) + 'px;width:' + DAY + 'px">' +
         WD[dt.getDay()] + '<b>' + dt.getDate() + '</b></div>';
  }
  h += '</div><div class="grid" style="width:' + W + 'px">';
  var cols = '';
  for (var i = 0; i < DAYS; i++){
    var dt = new Date(d0); dt.setDate(d0.getDate() + i);
    var we = dt.getDay() === 0 || dt.getDay() === 6;
    cols += '<div class="col' + (we ? ' wkend' : '') +
            '" style="left:' + (VCOL + i * DAY) + 'px;width:' + DAY + 'px"></div>';
  }
  /* today's line sits at midday, inside the 10am-2pm changeover window;
     drawn only when today is on the board at all */
  var nowline = (todayOff >= 0 && todayOff < DAYS)
    ? '<div class="nowline" style="left:' + (VCOL + (todayOff + .5) * DAY) + 'px"></div>'
    : '';

  var stats = { inh:0, arr:0, dep:0 };
  var byVilla = {};
  Object.keys(bookings).forEach(function(id){
    var b = bookings[id];
    (byVilla[b.villa] = byVilla[b.villa] || []).push(b);
  });

  /* the Clean layer, drawn as the villa number's colour. Two facts decide it:
       has a guest in it tonight   the booking, which the calendar owns from
                                   the bars it draws (arrive <= today < depart)
       requires cleaning           roomCleanState (hkClassify + the done flag),
                                   the housekeeping fact the cleaning boards own
     A room with a guest in it reads grey (in house); a vacant room reads green
     when ready or plain when a clean is owed; and either way, a room that needs
     cleaning with an arrival within CLEAN_FLAG_DAYS is flagged amber - the one
     thing to act on. The calendar reads both facts, it does not work the clean
     state out for itself (rule 7). */
  var todayK = nav.todayKey(), realToday = new Date();
  var yObj = new Date(); yObj.setDate(yObj.getDate() - 1);
  var todayNight = (nightBy && nightBy[todayK]) || {};
  var yestNight  = (nightBy && nightBy[dkey(yObj)]) || {};
  function cleanOf(v){
    var tn = todayNight[String(v)];
    var rec = tn ? { arrives:tn.arrive, departs:tn.depart, status:tn.status } : null;
    var yn = yestNight[String(v)];
    /* same-day turnover: the guest left this morning, so tonight's record is
       already the new arrival and only yesterday's shows the departure -
       cleaners.html's `left`, the one thing that tells a turnover from a
       plain arrival. */
    var left = !!(yn && yn.depart && dkey(parseDepDate(yn.depart)) === todayK);
    return roomCleanState(rec, todayK, (hk || {})[String(v)] || {}, left);
  }

  for (var v = 1; v <= ROOMS_N; v++){
    var mine = byVilla[String(v)] || [];
    var dirty = cleanOf(v) === 'dirty';
    /* a guest sleeping here tonight = the room has a booking = grey */
    var occupied = mine.some(function(b){
      var a = parseDepDate(b.stay.arrive), d = parseDepDate(b.stay.depart);
      return a && d && dkey(a) <= todayK && dkey(d) > todayK;
    });
    var flag = dirty && mine.some(function(b){
      return arrivalFlagsClean(b.stay.arrive, realToday);
    });
    /* flag first (act on it), then a booking greys the room, then a clean owed
       on a vacant room, else vacant and ready */
    var rmcls = flag ? 'rm-dirty' : occupied ? 'rm-inhouse'
              : dirty ? 'rm-dirty' : 'rm-clean';
    h += '<div class="vrow ' + rmcls + (flag ? ' flag' : '') + '">' + cols + nowline;
    (byVilla[String(v)] || []).forEach(function(b){
      var a = parseDepDate(b.stay.arrive), dep = parseDepDate(b.stay.depart);
      if (!a || !dep) return;
      /* the viewed day's tally: in house is a night being slept here */
      if (dayOff(a) <= 0 - FROM && dayOff(dep) > 0 - FROM) stats.inh++;
      if (dkey(a) === nav.todayKey()) stats.arr++;
      if (dkey(dep) === nav.todayKey()) stats.dep++;
      var x1 = (dayOff(a) + ARRIVE_H) * DAY, x2 = (dayOff(dep) + DEPART_H) * DAY;
      var cutL = x1 < 0, cutR = x2 > DAYS * DAY;
      x1 = Math.max(x1, 0); x2 = Math.min(x2, DAYS * DAY);
      if (x2 <= 0 || x1 >= DAYS * DAY) return;
      var name = [b.stay.last, b.stay.first].filter(Boolean).join(', ');
      /* every bar carries a class for all four dimensions at once; the mode
         class on #wrap lights one. Each state comes from the fact's owner:
         formState (pre-arrival), diningState (the dinner intent),
         massageState (the spa loop). */
      var st = formState(b.pre, { arrive:b.stay.arrive, depart:b.stay.depart },
                         (spa || {})[b.id]);
      var fcls = st === 'completed' ? 'fdone' : st === 'incomplete' ? 'fpart' : 'ftodo';
      var dcls = 'd' + diningState(b.pre);          /* din / dout / dnone */
      var ms = massageState((spa || {})[b.id], b.pre);
      var scls = ms === 'done' ? 'sbooked' : ms === 'sugg' ? 'ssugg'
               : ms === 'wait' ? 'swait'   : ms === 'decl' ? 'sdecl' : 'snone';
      var cls = fcls + ' ' + dcls + ' ' + scls +
                (cutL ? ' cutL' : '') + (cutR ? ' cutR' : '');
      var open = CAN_OPEN
        ? '<a class="bar ' + cls + '" href="guest.html?b=' + encodeURIComponent(b.id) + '"'
        : '<div class="bar ' + cls + '"';
      h += open + ' style="left:' + (VCOL + x1) + 'px;width:' + (x2 - x1) + 'px">' +
           '<span class="n">' + esc(name) + '</span>' + (CAN_OPEN ? '</a>' : '</div>');
    });
    h += '<div class="vnum">' + v + '</div></div>';
  }
  h += '</div>';
  document.getElementById('chart').innerHTML = h;
  document.getElementById('nIn').textContent = stats.inh;
  document.getElementById('nArr').textContent = stats.arr;
  document.getElementById('nDep').textContent = stats.dep;
  /* a failed read is not an empty day, and must never look like one. One
     ranged read now, so it is the whole window that failed, not a count of
     days - the note says the board could not be read rather than naming a
     number it can no longer know. */
  document.getElementById('boardNote').textContent = readFailed
    ? 'The board could not be read. This is usually the connection, not the data.'
    : '';
  /* open on the viewed day with yesterday against the villa column -
     the month behind is there to swipe to, not to land on */
  var wrap = document.getElementById('wrap');
  wrap.onscroll = paintMonth;
  wrap.scrollLeft = (0 - FROM - 1) * DAY;
  paintMonth();
  fitRows();
}

/* the month under the board's left edge, kept true while swiping */
function paintMonth(){
  var lbl = document.getElementById('monthLbl');
  var wrap = document.getElementById('wrap');
  if (!lbl || !wrap) return;
  var i = Math.min(DAYS - 1, Math.max(0, Math.floor(wrap.scrollLeft / DAY)));
  var dt = new Date(VIEW.getFullYear(), VIEW.getMonth(), VIEW.getDate() + FROM + i, 12);
  lbl.textContent = MO[dt.getMonth()] + ' ' + dt.getFullYear();
}

/* All 17 villas on one screen, from what the screen actually has: the
   space under the grid's real top edge, shared evenly. Re-measured on
   rotate and resize. min-height in the CSS guards the smallest phones. */
function fitRows(){
  var grid = document.querySelector('.grid');
  if (!grid) return;
  var gr = grid.getBoundingClientRect();
  var top = gr.top + window.scrollY;
  /* everything below the grid - borders, the board note, the body's own
     bottom padding - measured rather than assumed, like the top */
  var below = document.documentElement.scrollHeight - (gr.bottom + window.scrollY);
  var avail = window.innerHeight - top - below;
  document.documentElement.style.setProperty('--rowh',
    Math.max(22, Math.floor(avail / ROOMS_N * 10) / 10) + 'px');
}
window.addEventListener('resize', fitRows);
window.addEventListener('orientationchange', fitRows);

function navFilter(role){ if (window.NALA_NAVFILTER) NALA_NAVFILTER(role); }

/* ── access ──────────────────────────────────────────────────── */
function showAccess(allowed, e){
  var box = document.getElementById('noAccess');
  var on = !allowed;
  box.innerHTML = !on ? '' :
    (e ? '<div>Could not check access. This is usually the connection, '
       + 'not your login.</div>'
       + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
       : 'This login has no access to the Calendar. See the manager.');
  if (on && !e){
    var home = homeFor(window.NALA_ROLE);
    if (home && home !== location.pathname.split('/').pop()){
      location.replace(home); return;
    }
  }
  box.className = 'noaccess' + (on ? ' show' : '');
  var els = [document.getElementById('colorBar'),
             document.getElementById('statsRow'), document.getElementById('wrap')];
  els.forEach(function(el){ if (el) el.style.display = on ? 'none' : ''; });
  if (!on) load().catch(function(){});
}

window.NALA_ROLE = null;
(function gate(){
  if (!window.firebase || !firebase.auth || typeof loadStaff !== 'function')
    return setTimeout(gate, 40);
  var A; try { A = firebase.auth(); } catch(e){ return setTimeout(gate, 40); }
  if (!A || !A.onAuthStateChanged) return setTimeout(gate, 40);
  A.onAuthStateChanged(function(u){
    if (!u) return;                 /* auth.js owns the signed-out state */
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role; window.NALA_USER = u;
      ROLE = role;
      /* The board opens to cleansBoard - the grounds and housekeeping
         logins are who it is for. A bar is a door to the Guest Profile, so
         the door exists exactly when that page's own gate would let this
         login in - the Dashboard's own doors rule, asked of the page
         rather than of the capability it happens to borrow. */
      CAN_OPEN = canOpen(role, 'guest.html');
      document.getElementById('navWrap').style.display = 'block';
      navFilter(role);
      showAccess(canOpen(role, 'calendar.html'), e);
    });
  });
})();

/* Coming back to the app is when a stale board is most obvious. */
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && LOADED) load().catch(function(){});
});
</script>
