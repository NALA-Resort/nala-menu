<style>
/* NALA staff UI - shared controls. See STYLEGUIDE.md.
   Pages declare <body class="tier-app"> or <body class="tier-print">.  */

:root {
  --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA; --red:#A8321E;
  /* Staff tools use the Apple system font: it is what every other app on the
     phone uses, its figures line up, and it is built for small sizes. The
     guest pages do NOT use these tokens - they carry the brand and set their
     own font, so this can change without touching them.                  */
  --ui-font:-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto,
            Helvetica, Arial, sans-serif;
  --num-font:var(--ui-font);
}

/* Double tap to zoom is a hazard on a board of tap targets: a quick second
   tap on a villa tile zooms the page instead of doing the thing. This turns
   that gesture off while LEAVING pinch zoom alone, so nobody who needs to
   magnify the page loses it. The old user-scalable=no meta does not do this;
   iOS ignores it on purpose.                                             */
body.tier-app, body.tier-print { touch-action:manipulation; }

/* tier surfaces used by controls */
.tier-app   { --ctl-bg:var(--cream); --ctl-bdr:var(--rule); --ctl-ink:var(--ink); }
.tier-print { --ctl-bg:#fff;         --ctl-bdr:#ddd;        --ctl-ink:#111;      }

/* ── one header row: [Today] [<] date [>] ....... [menu] ── */
.navwrap { position:relative; margin-left:auto; z-index:500; font-family:var(--ui-font); }
.navbtn  { border:1px solid var(--ctl-bdr); background:var(--ctl-bg);
           border-radius:8px; cursor:pointer; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:4px; padding:0;
           -webkit-tap-highlight-color:transparent; }
.navbtn span { display:block; width:16px; height:1.6px; background:var(--ctl-ink); }
.navdrop { display:none; position:absolute; right:0; top:42px; background:var(--ctl-bg);
           border:1px solid var(--ctl-bdr); border-radius:9px; min-width:132px;
           box-shadow:0 4px 14px rgba(0,0,0,.09); padding:5px 0; }
.navdrop.open { display:block; }
.navdrop a { display:block; padding:12px 18px; font-size:10px; letter-spacing:.14em;
             text-transform:uppercase; color:var(--ctl-ink); text-decoration:none;
             white-space:nowrap; }
/* Signing out is an action, not a destination, so it sits below a rule rather
   than reading as one more page in the list. It is never filtered by role:
   every login has to be able to get out.                                  */
.navdrop a.signout { border-top:1px solid var(--ctl-bdr); margin-top:5px;
                     padding-top:13px; color:var(--mid); }

/* ── floating footer ──────────────────────────────────────
   sticky pins it while scrolling long pages; the flex column
   below pins it to the screen bottom on short pages too      */
body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
body > .wrap { flex:1 0 auto; display:flex; flex-direction:column; width:100%; }
.wrap > .foot, body > .foot { margin-top:auto; }
.foot { position:sticky; bottom:0; z-index:40; display:flex; gap:8px; flex-wrap:wrap;
        background:var(--ctl-bg); border-top:1px solid var(--ctl-bdr); margin-top:18px;
        padding:10px 0 calc(10px + env(safe-area-inset-bottom)); }
.foot .btn { flex:1; text-align:center; white-space:nowrap; }
/* the row sits hard against the bottom of the screen: soften only the two
   corners that land in the phone's own rounded corners                     */
.foot .btn:first-child { border-bottom-left-radius:8px; }
.foot .btn:last-child  { border-bottom-right-radius:8px; }

/* ── standard header: kicker, then one date row ─────── */
.daterow { display:flex; align-items:center; gap:8px;
           margin-bottom:12px; font-family:var(--ui-font); }
.daterow .date { font-size:13px; font-weight:bold; letter-spacing:.1em;
                 text-transform:uppercase; color:var(--ctl-ink); white-space:nowrap;
                 padding:0 2px; }
.dnav { width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
        background:var(--ctl-bg); border:1px solid var(--ctl-bdr); border-radius:7px;
        font-size:16px; line-height:1; color:var(--ctl-ink); cursor:pointer; padding:0;
        -webkit-tap-highlight-color:transparent; }
.dnav:active { background:var(--ctl-bdr); }
.dnav.today { width:auto; padding:0 12px; font-size:9.5px; letter-spacing:.13em;
              text-transform:uppercase; }
.dnav.today:disabled { opacity:.35; cursor:default; }
.navbtn { width:42px; height:36px; }
/* page name on paper only - the screen row replaces it */
.printkick { display:none; }
@media print { .printkick { display:block; text-align:center; font-family:var(--ui-font);
  font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:#666;
  margin-bottom:8px; } }

/* ── information is plain typography, never boxed ───── */
.stats { display:flex; justify-content:center; gap:36px; margin:16px 0 6px;
         font-family:var(--ui-font); }
.stat { text-align:center; }
.stat-n { display:block; font-size:27px; line-height:1; color:var(--ctl-ink);
          font-family:var(--num-font); }
.stat-l { display:block; font-size:8px; letter-spacing:.2em; text-transform:uppercase;
          color:var(--mid); margin-top:6px; }
.stat.warn .stat-n { color:var(--red); }

/* ── access message ───────────────────────────────────────
   Stands in for a board the signed-in login may not see. Plain typography,
   never a bordered or filled box: that dress belongs to buttons alone, and
   a message wearing it reads as something to tap. One statement, not a
   fact stacked under a fact. The retry action IS a button, so it wears
   the page's .btn.                                                       */
.noaccess { display:none; font-family:var(--ui-font); font-size:15px;
            line-height:1.5; color:var(--ctl-ink); max-width:420px;
            margin:24px 0; }
.noaccess.show { display:block; }
.noaccess .na-retry { margin-top:16px; display:block; width:max-content; }

/* keep controls off paper */
@media print {
  .navwrap, .foot, .dnav { display:none !important; }
  body { display:block; min-height:0; }   /* flex column off paper */
}

</style>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--ui-font); color:#111; background:#fff; padding:16px 16px 0; }

  .btn { padding:10px 20px; background:#111; color:#fff; border:none;
         font-family:var(--ui-font); font-size:10px; letter-spacing:.15em;
         text-transform:uppercase; cursor:pointer; }
  .btn.ghost { background:#fff; color:#111; border:1px solid #111; }
  .stamp { margin-top:10px; font-size:7.5px; letter-spacing:.1em;
           text-transform:uppercase; color:#999; text-align:right; }

  .scroller { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { width:100%; min-width:760px; border-collapse:separate; border-spacing:0; }
  th { font-size:7px; letter-spacing:.12em; text-transform:uppercase; color:#666;
       text-align:left; padding:0 5px 6px; border-bottom:1px solid #111;
       white-space:nowrap; vertical-align:bottom; }
  th.wrap { white-space:normal; line-height:1.25; text-align:center; }

  /* box the hand-written table columns */
  th.c-dt, td.c-dt { border-left:1px solid #999; }
  th.c-bt, td.c-bt { border-left:1px solid #bbb; border-right:1px solid #999; }
  td { font-size:9.5px; padding:7.5px 5px; border-bottom:1px solid #ddd; vertical-align:top; }
  tr { page-break-inside:avoid; }

  .c-name { width:17%; font-weight:bold; }
  .c-room { width:5%;  text-align:center; }
  .c-din  { width:6%;  text-align:center; }
  .c-pax  { width:4%;  text-align:center; }
  .c-diet { width:19%; }
  .c-dep  { width:11%; white-space:nowrap; }
  .c-dt   { width:5%;  text-align:center; }
  .c-bt   { width:5%;  text-align:center; }
  .c-com  { width:29%; }

  .yes { color:#3F7A52; font-weight:bold; }
  .no  { color:#A8321E; }
  .unk { color:#bbb; }
  /* The make-up IS the instruction for whoever sets the room, so it is the
     stat; the count is its checksum and lives in the label. Anchored left and
     right so the row does not slide as the make-up changes length.          */
  .stats { justify-content:space-between; gap:18px; align-items:baseline; }
  .stat.statmix { text-align:left; }
  .stat.statmix .stat-n { font-size:15px; letter-spacing:.01em; white-space:nowrap; }
  .stats .stat:last-child { text-align:right; }
  .stats .stat:last-child .stat-n { font-size:20px; }
  .row-out td { background:#FAF6F5; }
  .row-unk td { background:#FCFCFB; }
  .row-vacant td { background:#F4F4F2; color:#B0B0AA; }

  .sub { display:block; font-size:8px; color:#777; font-weight:normal; margin-top:2px; }
  .allergen { color:#A8321E; font-weight:bold; }
  /* Dietaries and comments share one column at their combined width, so a long
     dietary list lays out horizontally instead of stacking three deep in a
     narrow column. The comment sits on a second line beneath the pills.     */
  .c-dc { width:48%; }
  .dwrap { display:flex; flex-wrap:wrap; gap:5px; align-items:baseline; }
  .dcom { font-size:9px; color:#333; margin-top:3px; }
  .dpill { display:inline-block; font-family:var(--ui-font); font-size:8.5px;
           font-weight:bold; letter-spacing:.06em; text-transform:uppercase;
           padding:2px 7px; border-radius:9px;
           background:rgba(168,50,30,.12); color:#A8321E;
           -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .dpill-al { background:#A8321E; color:#fff; }
  .checkout { color:#A8321E; font-weight:bold; }
  .row-conflict td { background:#F7E4DF; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .flag { display:inline-block; font-family:var(--ui-font); font-size:7px; font-weight:bold;
          letter-spacing:.12em; border:1.2px solid #A8321E; color:#A8321E; padding:1px 4px;
          margin-right:5px; vertical-align:1px; }
  .dnote { display:block; font-size:8px; color:#333; font-style:italic; margin-top:2px; }
  .pre { display:inline-block; font-family:var(--ui-font); font-size:7px; font-weight:bold;
         letter-spacing:.12em; border:1px solid #888; color:#555; padding:1px 4px;
         margin-right:5px; vertical-align:1px; }
  tr.g-in td:first-child { border-left:1px solid #8C8C86; }
  tr.g-in td.c-room      { border-right:1px solid #8C8C86; }
  tr.g-first td:first-child, tr.g-first td.c-room { border-top:1px solid #8C8C86; }
  tr.g-last td:first-child,  tr.g-last td.c-room  { border-bottom:1px solid #8C8C86; }
  tr.g-first td:first-child { border-top-left-radius:9px; }
  tr.g-first td.c-room      { border-top-right-radius:9px; }
  tr.g-last td:first-child  { border-bottom-left-radius:9px; }
  tr.g-last td.c-room       { border-bottom-right-radius:9px; }
  .muted { color:#aaa; font-weight:normal; font-style:italic; }

  /* empty write-in rows: one rule only, from the cell border */
  tr.blank td { height:26px; }


  /* Printed sheets repeat everything above the table on every page. A table
     header group is the only thing browsers reliably repeat, so the block is
     cloned into a thead row for paper and the on-screen original is hidden. */
  .printhead { display:none; }
  .printhead > td { border:0; padding:0 0 6px; }
  @media print {
    .printhead { display:table-row; }
    .noprintblock { display:none !important; }
  }
  @media print {
    body { padding:0; }
    .scroller { overflow:visible; }
    table { min-width:0; width:100%; }
    tr { page-break-inside:avoid; }
    thead { display:table-header-group; }
    table { border-collapse:collapse; }   /* Safari repeats headers only when collapsed */
  }
</style>

 "0400 000 017", "at": "~D0~T09:17:00"}}, "roomguests": {"1": {"name": "James Harrington", "arrives": "~D-2~", "departs": "~D+2~"}, "2": {"name": "Elena Petrova", "arrives": "~D-2~", "departs": "~D+2~"}, "3": {"name": "Mark Whitfield", "arrives": "~D-2~", "departs": "~D+2~"}, "4": {"name": "Lucy Whitfield", "arrives": "~D-2~", "departs": "~D+2~"}, "5": {"name": "David Chen", "arrives": "~D-2~", "departs": "~D0~"}, "6": {"name": "Priya Sharma", "arrives": "~D-2~", "departs": "~D+2~"}, "7": {"name": "Tom Ashby", "arrives": "~D-2~", "departs": "~D+2~"}, "8": {"name": "Ruby Vance", "arrives": "~D-2~", "departs": "~D+2~"}, "9": {"name": "Claire Donnelly", "arrives": "~D-2~", "departs": "~D+2~"}, "10": {"name": "Sam Okafor", "arrives": "~D-2~", "departs": "~D0~"}, "11": {"name": "Nina Brandt", "arrives": "~D-2~", "departs": "~D+2~"}, "12": {"name": "Owen Reilly", "arrives": "~D-2~", "departs": "~D+2~"}, "13": {"name": "Hana Sato", "arrives": "~D-2~", "departs": "~D+2~"}, "14": {"name": "Marco Bianchi", "arrives": "~D-2~", "departs": "~D+2~"}, "15": {"name": "Freya Lindqvist", "arrives": "~D-2~", "departs": "~D0~"}, "16": {"name": "Jonah Adeyemi", "arrives": "~D-2~", "departs": "~D+2~"}, "17": {"name": "Iris Kovac", "arrives": "~D-2~", "departs": "~D+2~"}}, "hk": {"1": {"bfast": "~D0~T07:51:00"}, "2": {"bfast": "~D0~T07:52:00"}, "5": {"done": "~D0~T10:05:00"}, "10": {"done": "~D0~T10:010:00"}, "15": {"departed": true}}, "manual": {"ext-1": {"status": "in", "pax": 2, "name": "Cane", "source": "manual", "diets": ["Dairy free"], "external": true}, "ext-2": {"status": "in", "pax": 2, "name": "Jill", "source": "manual", "external": true}, "ext-3": {"status": "in", "pax": 2, "name": "Larry", "source": "manual", "note": "Birthday", "external": true}}, "combined": {"g1": {"rooms": ["3", "4"]}, "g2": {"rooms": ["7", "8", "9"]}}};

<script>
(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
  var so=document.getElementById('navSignout');
  if (so) so.onclick=function(e){ e.preventDefault();
    if (window.NALA_SIGNOUT) NALA_SIGNOUT(); else location.reload(); };

  /* Role gate, per the matrix in ROLES.md. The sheet is read and print for
     everyone who may see it at all, so there is one question here, not two. */
  window.NALA_ROLE = null;
  (function gate(){
    /* Wait for the helper too, not just firebase: a stubbed SDK calls back
       synchronously, and nala-shared.js loads at the foot of the page.
       auth() itself throws when no app has been initialised, and a partial
       SDK can arrive without onAuthStateChanged, so both are guarded: a
       throw here would take the whole page down with it.               */
    if (!window.firebase || !firebase.auth ||
        typeof loadStaff !== 'function'){ setTimeout(gate,300); return; }
    var A;
    try { A = firebase.auth(); } catch (e){ setTimeout(gate,300); return; }
    if (!A || typeof A.onAuthStateChanged !== 'function'){ setTimeout(gate,300); return; }
    A.onAuthStateChanged(function(u){
      if (!u) return;                 /* auth.js owns the signed-out state */
      loadStaff(function(recs, err){
        var role = roleOf(u);
        window.NALA_ROLE = role;
        window.NALA_NAVFILTER(role);
        showAccess(can(role,'resSheet'), err);
      });
    });
  })();


  /* The menu lists only the boards this role may open: offering a link that
     lands on "no access" is a door to nowhere. Cleans needs cleansBoard,
     the sheets need their own permission.                              */
  window.NALA_NAVFILTER = function(role){
    var need = { 'tally.html':'resBoard', 'list.html':'resSheet',
                 'cleaners.html':'cleansBoard', 'housekeeping.html':'cleansBoard',
                 'staff.html':'manageStaff' };
    var links = document.querySelectorAll('#navDrop a');
    for (var i=0;i<links.length;i++){
      if (links[i].className.indexOf('signout')>-1) continue;   /* never filtered */
      var href = (links[i].getAttribute('href')||'').split('?')[0];
      links[i].style.display = can(role, need[href]) ? '' : 'none';
    }
  };

  function showAccess(allowed, err){
    var box = document.getElementById('noAccess');
    var on  = !allowed;
    box.innerHTML = !on ? '' :
      (err ? '<div>Could not check access. This is usually the connection, '
           + 'not your login.</div>'
           + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
           : 'This login has no access to the Reservations Sheet. See the manager.');
    /* A role that cannot see this page but has a board of its own is sent
       there rather than shown a refusal. Only a login with no role at all
       gets the message, because it has nowhere to be sent.             */
    if (on && !err){
      var home = homeFor(window.NALA_ROLE);
      if (home && home !== location.pathname.split('/').pop()){
        location.replace(home); return;
      }
    }
    box.className = 'noaccess' + (on ? ' show' : '');
    ['statsRow','sheetScroller','footBar'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.style.display = on ? 'none' : '';
    });
  }
})();
</script>

<script>
/* NALA shared helpers - one copy of the logic every staff page repeats.
   Plain globals, same names the pages already use, so page code reads
   unchanged. See STYLEGUIDE.md and AUDIT.md.                      v2 */

var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
var ROOMS = 17;
var ALLERGENS = ['Nut allergy','Shellfish allergy','Egg allergy'];

/* ── dates ─────────────────────────────────────────────────── */
function dkey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// Safari only accepts 3 fractional digits in an ISO date; Python writes 6.
// Trim them so any timestamp parses on every browser.
function parseISO(s){
  if (!s) return null;
  var t = String(s).trim().replace(/(\.\d{3})\d+/, '$1');
  var d = new Date(t);
  if (!isNaN(d)) return d;
  d = new Date(t.replace(/\.\d+/, ''));      // drop fractions entirely
  return isNaN(d) ? null : d;
}

function parseDepDate(s){
  if(!s) return null;
  s = String(s).trim();
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  var i = s.match(/^(\d{4})-(\d{2})-(\d{2})/);       // ISO - build a LOCAL date,
  if (i) return new Date(+i[1], +i[2]-1, +i[3]);     // never via the UTC parser
  var d = new Date(s);
  return isNaN(d) ? null : d;
}

function ord(n){
  var s=['th','st','nd','rd'], v=n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

/* the one date format: Wd Dth Mon (see STYLEGUIDE.md) */
function dateLabel(d){
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()]+' '+ord(d.getDate())+' '+mo[d.getMonth()];
}

/* ── the standard header's date row ────────────────────────────
   Wires ‹ › Today and writes the one date format into #date/#title.
   Tolerates missing arrows (hc tally shows the date alone).
   Returns { VIEW, todayKey, isToday } for the page to use.        */
function initDateNav(){
  var VIEW = (function(){
    var q = new URLSearchParams(location.search).get('date');
    if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) {
      var p = q.split('-');
      return new Date(+p[0], +p[1]-1, +p[2]);
    }
    return new Date();
  })();
  function todayKey(){ return dkey(VIEW); }
  function isToday(){ return dkey(VIEW) === dkey(new Date()); }
  function shiftDate(n){
    var d = new Date(VIEW); d.setDate(d.getDate()+n);
    var q = new URLSearchParams(location.search);
    q.set('date', dkey(d));
    location.search = q.toString();
  }
  function goToday(){
    var q = new URLSearchParams(location.search);
    q.delete('date');
    location.search = q.toString();
  }
  var el = document.getElementById('date') || document.getElementById('title');
  if (el) el.textContent = dateLabel(VIEW);
  var pv = document.getElementById('dPrev'), nx = document.getElementById('dNext'),
      td = document.getElementById('dToday');
  if (pv) pv.onclick = function(){ shiftDate(-1); };
  if (nx) nx.onclick = function(){ shiftDate(1); };
  if (td){
    td.onclick = function(e){ if (e) e.preventDefault(); goToday(); };
    td.disabled = isToday();     // always visible; dimmed when already on today
  }
  return { VIEW:VIEW, todayKey:todayKey, isToday:isToday };
}

/* ── room-guest look-back ──────────────────────────────────────
   Most recent record for a room across the previous fortnight.
   A guest who opened the link days ago still appears, unless
   they have departed. Reads each date individually so no
   permission is needed on the parent node.                       */
/* A fortnight of roomguests is 14 of the 19 requests a board makes, and it is
   the part that does not move: a booking recorded last Tuesday is still what
   it was. Polling it every 20 seconds alongside the things that DO move costs
   about five times the bandwidth for no extra freshness, so it is held for a
   few minutes and refetched on a full load.
   Pass force = true to ignore the cache.                                  */
var RG_CACHE = null, RG_AT = 0, RG_KEY = '', RG_MAX_AGE = 5 * 60 * 1000;

function fetchRoomGuests(endKey, days, force){
  days = days || 14;
  if (!force && RG_CACHE && RG_KEY === endKey + ':' + days &&
      (Date.now() - RG_AT) < RG_MAX_AGE){
    return Promise.resolve(RG_CACHE);
  }
  var parts = endKey.split('-');
  var end = new Date(+parts[0], +parts[1]-1, +parts[2]);
  var jobs = [], keys = [];
  for (var i = days - 1; i >= 0; i--) {
    var d = new Date(end); d.setDate(d.getDate() - i);
    var k = dkey(d);
    keys.push(k);
    jobs.push(
      fetch(DB + '/roomguests/' + k + '.json?v=' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
    );
  }
  return Promise.all(jobs).then(function(res){
    var all = {};
    res.forEach(function(day, i){ if (day) all[keys[i]] = day; });
    /* Only cache a complete answer. A partial fetch cached for five minutes
       would show a villa as empty because one day failed to load.       */
    if (res.every(function(day, i){ return day !== null || true; })){
      RG_CACHE = all; RG_AT = Date.now(); RG_KEY = endKey + ':' + days;
    }
    return all;
  });
}

function clearRoomGuestCache(){ RG_CACHE = null; RG_AT = 0; }

function resolveRoomGuests(all, todayK){
  var out = {};
  var dates = Object.keys(all || {}).filter(function(d){ return d <= todayK; }).sort();
  dates.forEach(function(d){
    var day = all[d] || {};
    for (var room in day){ out[room] = day[room]; }   // later dates overwrite earlier
  });
  // drop anyone checked out by this sheet's dinner: a guest departing on
  // the sheet date leaves that morning, so their last sheet is the night before
  for (var room in out){
    var dep = out[room] && out[room].departs;
    if (!dep) continue;
    var p = parseDepDate(dep);
    if (p && dkey(p) <= todayK) delete out[room];
  }
  return out;
}

/* ── guest misc ────────────────────────────────────────────── */
function tidyPhone(p){
  if (!p) return '';
  p = String(p).replace(/[^\d]/g,'');
  if (p.length === 9 && p[0] === '4') p = '0' + p;   // restore a lost leading zero
  return p;
}

/* ── dietary conflicts against the tagged menu ─────────────── */
function menuConflicts(menu, diets){
  if (!diets || !diets.length || !menu) return [];
  var hits = [];
  ['bread','entree','main','dessert'].forEach(function(k){
    var dish = menu[k];
    if (!dish || !dish.conflicts) return;
    dish.conflicts.forEach(function(tag){
      diets.forEach(function(d){
        if (String(d).toLowerCase() === String(tag).toLowerCase())
          hits.push({ dish: dish.name || k, diet: d });
      });
    });
  });
  return hits;
}

function dietHTML(diets, sep, cls){
  if(!diets||!diets.length) return '';
  cls = cls || 'allergen';
  return diets.map(function(d){
    return (ALLERGENS.indexOf(d)>-1 || /allerg/i.test(d)) ? '<span class="'+cls+'">'+d+'</span>' : d;
  }).join(sep || ' \u00b7 ');
}

/* ── housekeeping variants - deliberately different from above ──
   resolveRoomGuestsHK KEEPS guests departing today: they are the
   cleans. The dinner resolver drops them. Do not merge the two.   */
function resolveRoomGuestsHK(all, todayK){
  var out = {};
  var dates = Object.keys(all || {}).filter(function(d){ return d <= todayK; }).sort();
  dates.forEach(function(d){
    var day = all[d] || {};
    for (var room in day){ out[room] = day[room]; }
  });
  for (var room in out){
    var dep = out[room] && out[room].departs;
    if (!dep) continue;
    var p = parseDepDate(dep);
    if (p && dkey(p) < todayK) delete out[room];   // gone before today
  }
  return out;
}

/* one room, one record: staff override beats the guest's own answer,
   whoever opened the link fills the gaps                            */
function roomRecord(n, responses, manual, roomguests){
  var mk = 'room-'+n, m = manual[mk];
  var best = null;
  for (var k in responses){
    var g = responses[k];
    if (String(g.room) !== String(n)) continue;
    if (!best || (g.at||'') > (best.at||'')) best = g;
  }
  var known = roomguests[String(n)] || {};
  if (m && m.override) return Object.assign({}, known, best || {}, m, { room:String(n) });
  if (best) return Object.assign({}, known, best);
  if (m)    return Object.assign({}, known, m, { room:String(n) });
  if (known.name) return Object.assign({}, known, { room:String(n), status:null });
  return null;
}

/* clean = departing on the sheet date; service = staying on;
   verify = no usable data. The housekeeping rule, in one place.  */
function hkClassify(rec, todayK, hk){
  /* A manager can set the job for the day by hand - most often on a villa the
     booking data cannot confirm - and that choice beats what the dates imply.
     Stored at /hk/<date>/<villa>/kind so it expires with the day.          */
  if (hk && (hk.kind === 'clean' || hk.kind === 'svc' ||
             hk.kind === 'pre'   || hk.kind === 'vac')) return hk.kind;
  if (rec && rec.status === 'vacant') return 'vac';
  if (rec){
    var d = parseDepDate(rec.departs);
    var dk = d ? dkey(d) : null;
    if (dk === todayK) return 'clean';
    if (dk && dk > todayK) return 'svc';
    return 'ver';       // stale or missing departure
  }
  return 'ver';         // no data at all
}

/* ── roles and access ──────────────────────────────────────────
   Who may do what. The role comes from the record at /staff/<emailkey>,
   never from the address - the email only finds the record. Pages ask
   can(), never the email, so a permission changes in one place.
   Matrix and rationale in ROLES.md.                                   */

var STAFF_RECORDS = null;    /* the /staff map once loaded, null until then */

/* Firebase keys cannot hold a dot, so the key is the lowercased email with
   EVERY dot turned into a comma. Note the global regex: a plain
   replace('.', ',') changes only the first, which would key
   staff@nalaresort.com.au as staff@nalaresort,com.au and match nothing. */
function emailKey(email){
  return String(email || '').trim().toLowerCase().replace(/\./g, ',');
}

var ROLE_GRANTS = {
  admin:        ['cleansBoard','cleansMarks','setJob','resBoard','editBookings','resSheet','publishMenu','manageStaff'],
  chef:         ['resBoard','resSheet','publishMenu'],
  waiter:       ['cleansBoard','resBoard','editBookings','resSheet'],
  housekeeping: ['cleansBoard','cleansMarks']
};

function isRole(r){ return Object.prototype.hasOwnProperty.call(ROLE_GRANTS, r); }

/* The full access role was called "staff" until the word collided with the
   /staff node, the staff@ login and the "staff" tier of user generally. It is
   "admin" now. Records written before the rename still say staff, so they are
   read as admin rather than as nothing: renaming a role must never be the
   thing that locks the owner out. Drop this once no record says staff.   */
function normaliseRole(r){ return r === 'staff' ? 'admin' : r; }

/* null means no usable record, and no record is no access. Deliberately not
   the lowest role: a typo in an address would otherwise grant something. */
function roleOf(user){
  var e = user && (typeof user === 'string' ? user : user.email);
  if (!e || !STAFF_RECORDS) return null;
  var rec = STAFF_RECORDS[emailKey(e)];
  var r = normaliseRole(rec && rec.role);
  return isRole(r) ? r : null;
}

function can(role, what){
  var g = ROLE_GRANTS[normaliseRole(role)];
  return !!(g && g.indexOf(what) > -1);
}

/* Where a role should land. Housekeeping opening the app got the Reservations
   board, which they may not see, so their first screen was a refusal. A role
   that cannot see the page it arrived on is a routing problem, not an access
   one: send them to their own board instead of telling them off.        */
var ROLE_HOME = { admin:'tally.html', chef:'tally.html', waiter:'tally.html',
                  housekeeping:'cleaners.html' };
function homeFor(role){ return ROLE_HOME[normaliseRole(role)] || null; }

function setStaffRecords(map){
  STAFF_RECORDS = (map && typeof map === 'object') ? map : {};
  return STAFF_RECORDS;
}

/* Loads /staff once. On a network or permission failure the records stay
   null, which still grants nothing, but it is a DIFFERENT state from
   "signed in and not on the list" and the pages word it differently:
   telling someone to see the manager when the database simply did not
   answer sends them down the hall for nothing.                        */
function loadStaff(cb){
  fetch(DB + '/staff.json')
    .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
    .then(function(j){ cb(setStaffRecords(j), null); })
    .catch(function(err){ STAFF_RECORDS = null; cb(null, err); });
}

/* ── staying inside the home screen app ────────────────────────
   A page saved to the home screen opens without Safari's bars, which is the
   whole point of saving it. Tapping an ordinary link from there hands the
   next page back to Safari, bars and all, so the app view lasts exactly one
   screen. Navigating by script instead keeps it inside.

   Only runs in standalone mode, so nothing changes in an ordinary tab. Links
   that leave the site, open a new tab, or do something on the page rather
   than go somewhere are left alone.                                     */
(function(){
  /* navigator.standalone is a Safari property and is undefined in Chrome,
     where a saved page still opens without the bars. Asking only Safari
     meant this did nothing at all on half the phones, which is why the app
     view kept being handed back to the browser.                        */
  function inApp(){
    if (window.navigator && window.navigator.standalone) return true;
    try {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.matchMedia('(display-mode: fullscreen)').matches ||
             window.matchMedia('(display-mode: minimal-ui)').matches;
    } catch (e){ return false; }
  }
  if (!inApp()) return;
  document.addEventListener('click', function(e){
    var a = e.target;
    while (a && a.nodeName !== 'A') a = a.parentNode;
    if (!a || !a.getAttribute) return;
    var href = a.getAttribute('href');
    if (!href || href.charAt(0) === '#') return;        /* in-page, or an action */
    if (a.target && a.target !== '_self') return;       /* meant for a new tab */
    if (/^(mailto|tel|sms):/i.test(href)) return;
    if (a.host && a.host !== location.host) return;     /* off site, let it go */
    e.preventDefault();
    /* Routed through a replaceable function purely so this can be tested:
       no browser but Safari does the breakout being worked around here, so
       the only checkable part is that the link is taken over at all.   */
    (window.NALA_GO || function(u){ location.href = u; })(a.href);
  });
})();

/* ── notifications ─────────────────────────────────────────────
   A phone subscribes once, from a tap, and the subscription is stored under
   its own login. The sending is done by a worker that holds the signing key:
   nothing secret lives here. The public key below is meant to be public.

   iOS only allows this for a site added to the Home Screen. In an ordinary
   tab the browser reports no support at all, so the toggle says why rather
   than failing silently.                                                 */
var VAPID_PUBLIC = 'BEP_gBL_c7YGzV9EoU8Bv5DeA79I32NUxjGA2atk1239hSBZXEatGYrIfI7nofzLwdVZ1fWw1ycBZ1lWrKlOZGs';
var PUSH_URL = 'https://nala-push.ben-681.workers.dev';

function pushSupported(){
  return !!(window.navigator && 'serviceWorker' in navigator &&
            'PushManager' in window && 'Notification' in window);
}

/* A stable id per phone, so re-subscribing replaces that phone's record
   instead of leaving a dead one behind every time.                      */
function deviceId(){
  var k = 'nala-device';
  try {
    var v = localStorage.getItem(k);
    if (!v){ v = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
             localStorage.setItem(k, v); }
    return v;
  } catch (e){ return 'd-nostore'; }
}

function b64ToU8(base64){
  var pad = '='.repeat((4 - base64.length % 4) % 4);
  var s = (base64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  var raw = atob(s);
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

function subPath(user){
  return '/pushsubs/' + emailKey(user && user.email) + '/' + deviceId() + '.json';
}

/* Whether this phone is currently subscribed. Asked of the browser rather
   than of a saved flag, because the browser is the thing that decides: a
   subscription can be dropped by iOS without telling anyone.            */
function pushState(cb){
  if (!pushSupported()) return cb('unsupported');
  if (Notification.permission === 'denied') return cb('blocked');
  navigator.serviceWorker.getRegistration().then(function(reg){
    if (!reg) return cb('off');
    reg.pushManager.getSubscription().then(function(sub){ cb(sub ? 'on' : 'off'); },
                                          function(){ cb('off'); });
  }, function(){ cb('off'); });
}

function pushOn(user, role, cb){
  if (!pushSupported()) return cb('unsupported');
  navigator.serviceWorker.register('/sw.js').then(function(reg){
    return Notification.requestPermission().then(function(perm){
      if (perm !== 'granted') throw new Error('denied');
      return reg.pushManager.subscribe({
        userVisibleOnly: true,                 /* iOS requires this */
        applicationServerKey: b64ToU8(VAPID_PUBLIC)
      });
    });
  }).then(function(sub){
    var j = sub.toJSON();
    return fetch(DB + subPath(user), {
      method: 'PUT',
      body: JSON.stringify({ endpoint: j.endpoint, keys: j.keys,
                             role: role, at: new Date().toISOString() })
    });
  }).then(function(){ cb('on'); })
    .catch(function(e){ cb((e && e.message === 'denied') ? 'blocked' : 'failed'); });
}

/* Off means gone from the database as well: a record left behind would keep
   the phone on the list and the notification would arrive anyway.        */
function pushOff(user, cb){
  var done = function(){ cb('off'); };
  fetch(DB + subPath(user), { method: 'DELETE' }).catch(function(){}).then(function(){
    if (!pushSupported()) return done();
    navigator.serviceWorker.getRegistration().then(function(reg){
      if (!reg) return done();
      reg.pushManager.getSubscription().then(function(sub){
        if (!sub) return done();
        sub.unsubscribe().then(done, done);
      }, done);
    }, done);
  });
}

/* Tell the worker something happened. Deliberately not awaited by whatever
   called it: a notification that fails must never cost someone their mark,
   which is already saved by the time this runs.                          */
function notifyPush(event, villa, user){
  if (!PUSH_URL || !window.__idToken) return;
  try {
    fetch(PUSH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken: window.__idToken, event: event,
                             villa: villa, actor: emailKey(user && user.email) })
    }).catch(function(){});
  } catch (e){}
}

/* The notification settings, written by the app the first time an admin opens
   a board and finds none. Typing this into the console by hand was slow and
   easy to get wrong, and every new event type would mean doing it again.
   Only an admin may write /notify, which the rules enforce, so this quietly
   does nothing for everyone else.                                        */
var NOTIFY_DEFAULTS = {
  on: true,
  hours: { from: '07:30', to: '18:00' },
  events: {
    departed:  { housekeeping:true, admin:true, waiter:false, chef:false },
    available: { housekeeping:true, admin:true, waiter:false, chef:false },
    cleaned:   { housekeeping:true, admin:true, waiter:true,  chef:false },
    serviced:  { housekeeping:true, admin:true, waiter:true,  chef:false }
  }
};

function ensureNotifySettings(role){
  if (normaliseRole(role) !== 'admin') return;
  fetch(DB + '/notify.json')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(cfg){
      /* Only fill in what is missing. Overwriting would undo the manager's
         own choices every time a board loaded.                          */
      if (cfg && cfg.events && cfg.hours) return;
      var merged = {
        on:     (cfg && typeof cfg.on === 'boolean') ? cfg.on : NOTIFY_DEFAULTS.on,
        hours:  (cfg && cfg.hours) ? cfg.hours : NOTIFY_DEFAULTS.hours,
        events: (cfg && cfg.events) ? cfg.events : NOTIFY_DEFAULTS.events
      };
      return fetch(DB + '/notify.json', { method:'PUT', body: JSON.stringify(merged) });
    })
    .catch(function(){});
}

</script>
<script>
// date state + header wiring from nala-shared.js
var nav = initDateNav();
var VIEW = nav.VIEW, todayKey = nav.todayKey, isToday = nav.isToday;
function tomorrowKey(){ var d=new Date(VIEW); d.setDate(d.getDate()+1); return dkey(d); }

// paper needs to say which print is current
(function stamp(){
  var n=new Date();
  var hh=n.getHours(), mm=String(n.getMinutes()).padStart(2,'0');
  var ap=hh>=12?'pm':'am'; hh=hh%12||12;
  document.getElementById('stamp').textContent =
    'Printed '+n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear()+' '+hh+':'+mm+ap;
})();

// A stay range on ONE line: "Tue 11-Fri 14". Month is omitted - we know it,
// and the ordinal is dropped so the range never wraps to a second row.
// Falls back to just the checkout if no arrival date was captured.
/* An allergy is a solid red pill, a preference a tinted one. The word
   "allergy" is dropped from the label because the fill already says it. */
function dietPills(diets){
  if (!diets || !diets.length) return '';
  return '<div class="dwrap">' + diets.map(function(x){
    var al = (typeof ALLERGENS!=='undefined' && ALLERGENS.indexOf(x)>-1) || /allerg/i.test(x);
    var label = al ? x.replace(/\s*allergy\s*/i,'') : x;
    return '<span class="dpill'+(al?' dpill-al':'')+'">'+label+'</span>';
  }).join('') + '</div>';
}

function stayHTML(arrRaw, depRaw){
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var a = parseDepDate(arrRaw), d = parseDepDate(depRaw);
  function one(x){ return days[x.getDay()]+' '+x.getDate(); }
  var out;
  if (a && d)      out = one(a)+'-'+one(d);
  else if (d)      out = '-'+one(d);
  else if (a)      out = one(a)+'-';
  else             return '';
  if (d && dkey(d) === tomorrowKey()) return '<span class="checkout">'+out+'</span>';
  return out;
}

function depHTML(raw){
  var d = parseDepDate(raw);
  if (!d) return '';
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var txt = days[d.getDay()]+' '+d.getDate()+' '+mo[d.getMonth()];
  if (dkey(d) === tomorrowKey()) return '<span class="checkout">'+txt+'</span>';
  return txt;
}

// tonight's tagged menu, for dietary conflict flags
var MENU = null;
function fetchMenu(){
  return fetch('menu.json?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(m){
      m = m || {};
      var filled = ['bread','entree','main','dessert'].every(function(k){
        return m[k] && m[k].name && m[k].name.trim() !== '';
      });
      var fresh = false;
      if (m.published) {
        var pub = parseISO(m.published);   // Safari chokes on Python's 6-digit fractions
        fresh = pub ? (dkey(pub) === todayKey()) : false;
      }
      if (filled && fresh) MENU = m;
    })
    .then(function(){
      // dish tags are written by tag.html into Firebase
      return fetch(DB + '/menutags/' + todayKey() + '.json')
        .then(function(r){ return r.json(); })
        .then(function(tags){
          if (tags && MENU) ['bread','entree','main','dessert'].forEach(function(k){
            if (MENU[k] && tags[k]) MENU[k].conflicts = tags[k];
          });
        });
    })
    .catch(function(){});
}

function api(path){ return fetch(DB+path+'.json?v='+Date.now()).then(function(r){return r.json();}); }

Promise.all([ api('/responses/'+todayKey()), api('/manual/'+todayKey()), fetchRoomGuests(todayKey()), fetchMenu(), api('/combined/'+todayKey()) ])
  .then(function(res){
    var responses  = res[0] || {};
    var manual     = res[1] || {};
    var roomguests = resolveRoomGuests(res[2], todayKey());
    var combined   = res[4] || {};
    function groupOf(room){
      for (var gid in combined){
        var rs = (combined[gid] && combined[gid].rooms) || [];
        if (rs.indexOf(String(room)) > -1) return gid;
      }
      return null;
    }
    // ── everyone in house, plus externals dining ──────────
    var rows = [], covers = 0, roomsInHouse = 0;

    for (var n=1; n<=ROOMS; n++){
      var r = roomRecord(n, responses, manual, roomguests);
      var vacant = !!(r && r.status === 'vacant');
      if (!vacant) roomsInHouse++;
      rows.push({
        rec: vacant ? { room:String(n) } : (r || { room:String(n) }),
        room: n,
        status: vacant ? 'vacant' : ((r && r.status) ? r.status : null)  // null = no reply yet
      });
      if (!vacant && r && r.status === 'in') covers += (r.pax || 1);
    }

    var externals = [];
    for (var k in responses){
      var g = responses[k];
      if (g.room) continue;
      if (manual['extcancel-'+k]) continue;
      if (g.status !== 'in') continue;
      g.phone = g.phone || k;
      externals.push({ rec:g, room:null, status:'in', key:k });
      covers += (g.pax || 1);
    }
    for (var k in manual){
      if (k.indexOf('ext-') !== 0) continue;
      if (manual[k].status !== 'in') continue;
      externals.push({ rec:manual[k], room:null, status:'in', key:k });
      covers += (manual[k].pax || 1);
    }
    externals.sort(function(a,b){ return (a.rec.name||'').localeCompare(b.rec.name||''); });
    rows = rows.concat(externals);

    document.getElementById('nCovers').textContent = covers;

    var tb = document.getElementById('rows');

    // combined rooms sit consecutively under their lowest room number,
    // so one boxed block on the sheet = one table
    (function(){
      var roomRows = rows.filter(function(r){ return r.room; });
      var extRows  = rows.filter(function(r){ return !r.room; });
      var placed = {}, ordered = [];
      roomRows.forEach(function(r){
        var rm = String(r.room);
        if (placed[rm]) return;
        var gid = groupOf(rm);
        var members = gid ? combined[gid].rooms.map(String) : [rm];
        members.sort(function(a,b){ return Number(a)-Number(b); });
        members.forEach(function(m){
          var rr = roomRows.filter(function(x){ return String(x.room)===m; })[0];
          if (rr && !placed[m]){
            rr.grp = (gid && members.length>1)
              ? (m===members[0] ? 'first' : (m===members[members.length-1] ? 'last' : 'mid'))
              : null;
            ordered.push(rr); placed[m]=true;
          }
        });
      });
      rows = ordered.concat(extRows);
    })();

    rows.forEach(function(row){
      var g = row.rec;
      var phone = tidyPhone(g.phone);

      // Room rows with no real name are left blank so staff can write on
      // them by hand. Externals still show their phone as a fallback.
      var name = g.name
        ? g.name
        : (row.room ? '' : (phone || ''));
      var nameCell = name + (phone && !row.room ? '<span class="sub">'+phone+'</span>' : '');

      var dinner, cls = '';
      var hits = (row.status === 'in') ? menuConflicts(MENU, g.diets) : [];
      if (row.status === 'in')       dinner = '<span class="yes">Yes</span>';
      else if (row.status === 'out') { dinner = '<span class="no">No</span>'; cls = ' class="row-out"'; }
      else                           { dinner = '<span class="unk">—</span>';  cls = ' class="row-unk"'; }

      if (hits.length) {
        cls = ' class="row-conflict"';
        nameCell = '<span class="flag">FLAG</span>' + nameCell;
      }
      if (row.status === 'in' && g.premenu) {
        nameCell = '<span class="pre">PRE-MENU</span>' + nameCell;
      }

      // Vacant rooms stay on the sheet, labelled and otherwise empty.
      if (row.status === 'vacant') {
        dinner = '';
        cls = ' class="row-vacant"';
        nameCell = '<span class="muted">Vacant</span>';
      }

      var gcls = row.grp ? ' g-in g-'+row.grp : '';
      cls = cls ? cls.replace('class="','class="'+gcls.trim()+' ') : (gcls ? ' class="'+gcls.trim()+'"' : '');
      tb.insertAdjacentHTML('beforeend',
        '<tr'+cls+'>'+
          '<td class="c-name">'+nameCell+'</td>'+
          '<td class="c-room">'+(row.room || '<span class="muted">ext</span>')+'</td>'+
          '<td class="c-dt"></td>'+
          '<td class="c-bt"></td>'+
          '<td class="c-din">'+dinner+'</td>'+
          '<td class="c-pax">'+(row.status==='in' ? (g.pax||1) : '')+'</td>'+
          '<td class="c-dep">'+stayHTML(g.arrives, g.departs)+'</td>'+
          '<td class="c-dc" colspan="2">'+
            (dietPills(g.diets) || (g.nodiet ? '<div class="muted">No dietaries</div>' : ''))+
            ((g.note||g.dnote) ? '<div class="dcom">'+(g.note||'')+
              (g.dnote ? '<span class="dnote">Dietary: '+g.dnote+'</span>' : '')+'</div>' : '')+
          '</td>'+
        '</tr>');
    });

    for (var i=rows.length; i<21; i++){
      tb.insertAdjacentHTML('beforeend',
        '<tr class="blank"><td></td><td></td><td class="c-dt"></td><td class="c-bt"></td>'+
        '<td></td><td></td><td></td><td></td><td></td></tr>');
    }

    // ── total row, aligned under the Pax column ───────────
    // combined rooms share one table; sizes give the set-up breakdown
    var tblPax = {};
    rows.filter(function(r){ return r.status === 'in'; }).forEach(function(r){
      var unit = r.room ? (groupOf(r.room) || 'room-'+r.room) : 'ext-'+r.key;
      tblPax[unit] = (tblPax[unit]||0) + (r.rec.pax||1);
    });
    var tables = Object.keys(tblPax).length;
    var sizes = {};
    for (var u in tblPax) sizes[tblPax[u]] = (sizes[tblPax[u]]||0) + 1;
    var parts = Object.keys(sizes).map(Number).sort(function(a,b){return a-b;})
      .map(function(sz){ var n=sizes[sz];
        var W=['','one','two','three','four','five','six','seven','eight','nine','ten'];
        var w=W[sz]||sz; return n+' '+w+(n>1?'s':''); });
    document.getElementById('nTables').textContent = tables;
    document.getElementById('tblBreak').textContent = parts.length ? parts.join(' \u00b7 ') : '\u2014';
    document.getElementById('nTablesWord').textContent = (tables === 1) ? 'table' : 'tables';


  });
</script>

<script>
/* clone the above-table block into the printed header so every page carries it */
(function(){
  function fill(){
    var slot = document.getElementById('printHead');
    if (!slot) return;
    slot.innerHTML = '';
    ['.printkick','.daterow','.stats'].join(',').split(',').forEach(function(sel){
      var el = document.querySelector(sel);
      if (!el) return;
      el.classList.add('noprintblock');
      var c = el.cloneNode(true);
      c.classList.remove('noprintblock');
      c.classList.add('printclone');
      c.querySelectorAll('[id]').forEach(function(n){ n.removeAttribute('id'); });
      var nav = c.querySelector('.navwrap'); if (nav) nav.parentNode.removeChild(nav);
      slot.appendChild(c);
    });
  }
  /* iOS Safari does not reliably fire beforeprint, so the clone is built as
     soon as the sheet has data rather than waiting for a print event. It is
     hidden on screen either way. Refilled on beforeprint where supported, in
     case the sheet changed after load.                                     */
  function fillWhenReady(n){
    var rows = document.getElementById('rows');
    if (rows && rows.children.length){ fill(); return; }
    if (n > 0) setTimeout(function(){ fillWhenReady(n-1); }, 400);
  }
  fillWhenReady(15);
  window.addEventListener('beforeprint', fill);
})();
</script>
