<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  body { padding:calc(24px + env(safe-area-inset-top)) 18px 0; }
  

  .grp { font-size:var(--t1);
         color:var(--mid); margin:14px 2px 6px; }

  .vrow { display:flex; align-items:center; gap:12px; width:100%;
          background:#fff; border:1px solid var(--rule); border-radius:10px;
          padding:11px 13px; margin-bottom:7px; text-align:left;
          font-family:var(--ui-font); color:inherit; cursor:pointer; }
  .vrow .v { font-size:var(--t4); min-width:30px; text-align:center; }
  .vrow .mid { flex:1; min-width:0; }
  /* The tile's anatomy, ruled 27 Aug: name with the when beside it, the
     companion under, the service offering last - one kind of fact per
     line, the same place on every tile, and no line wraps. The card holds
     the whole story; ellipsis is honest about being a glance. */
  .vrow .top, .card .top { display:flex; align-items:baseline; gap:10px; }
  .vrow .nm { flex:1; min-width:0; font-size:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vrow .when, .card .when { font-size:var(--t2); color:var(--ink); white-space:nowrap; }
  .vrow .st { font-size:var(--t2); color:var(--mid); margin-top:2px; line-height:1.4;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vrow.b-done { background:var(--resgreen-t); border-color:var(--resgreen-b); }
  .vrow.b-done .st { color:var(--resgreen); }
  .vrow.b-sugg { background:var(--amber); border-color:var(--amberb); }
  .vrow.b-sugg .st { color:var(--ambert); }
  .vrow.b-decl { background:var(--terra-t); border-color:var(--terra-b); }
  .vrow.b-decl .st { color:var(--terra); }
  .vrow.b-grey { background:transparent; border-style:dashed; opacity:.62; }

  /* A tapped tile grows its controls in place rather than opening a second
     screen: the masseuse answers with the list still in view. */
  .card { border:1.2px solid var(--ink); border-radius:10px; background:#fff;
          padding:11px 13px; margin-bottom:7px; }
  .card.b-sugg { background:var(--amber); border-color:var(--amberb); }
  .card.b-sugg .st { color:var(--ambert); }
  .card.b-decl { background:var(--terra-t); border-color:var(--terra-b); }
  .card.b-decl .st { color:var(--terra); }
  .card .head { display:flex; align-items:center; gap:12px; }
  .card .v { font-size:var(--t4); min-width:30px; text-align:center; }
  .card .mid { flex:1; min-width:0; }
  .card .nm { flex:1; min-width:0; font-size:var(--t3); white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }
  .card .st { font-size:var(--t2); color:var(--mid); margin-top:2px; line-height:1.4;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* The second guest's line, under the name on tile and card alike. Always
     the resting grey: it is who is coming, not a state, so it never takes
     the band's colour the way .st does. */
  .vrow .cmp, .card .cmp { font-size:var(--t2); color:var(--mid); margin-top:1px; line-height:1.4;
                           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { font-size:var(--t2);
         color:var(--mid); margin:12px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:var(--t2); padding:7px 11px; border:1px solid var(--rule);
          border-radius:16px; background:#fff; color:var(--ink);
          font-family:var(--ui-font); cursor:pointer; }
  .chip.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .card select { width:100%; font-size:var(--t3); border:1px solid var(--rule);
                 border-radius:var(--r); padding:10px 12px; background:#fff;
                 font-family:var(--ui-font); margin-top:2px; color:var(--ink);
                 -webkit-appearance:none; appearance:none; }
  /* The notes box, the same dress as the select above it. True white: an
     editable surface, the colour law's one meaning for it. */
  .card textarea { width:100%; font-size:var(--t3); border:1px solid var(--rule);
                   border-radius:var(--r); padding:10px 12px; background:#fff;
                   font-family:var(--ui-font); margin-top:2px; color:var(--ink);
                   line-height:1.45; resize:vertical; }
  /* Three buttons can stand here and the labels carry a day and a time, so
     the row wraps rather than pushing the page sideways at 320. */
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .cbtn { flex:1 1 auto; min-width:0; text-align:center; padding:12px 4px; border:1px solid var(--ink);
          border-radius:8px; background:none; color:var(--ink); font-family:var(--ui-font);
          font-size:var(--t2);
          white-space:nowrap; cursor:pointer; }
  .cbtn.solid { background:var(--ink); color:var(--cream); }
  .cbtn.quiet { border-color:var(--rule); color:var(--mid); flex:0 0 auto; padding:12px 14px; }
  /* Remind masseuse is an sms: link wearing the button dress; a link is
     blue and underlined by default, which reads as neither. */
  a.cbtn { text-decoration:none; display:block; }
  /* The button law, STYLEGUIDE.md: destructive wears terracotta outline,
     never solid ink and never red, and always confirms before writing. */
  .cbtn.danger { border-color:var(--terra-b); color:var(--terra); flex:0 0 auto; padding:12px 14px; }
  .hint { font-size:var(--t2); color:var(--mid); margin-top:8px; line-height:1.45; }

  /* The desk's find-the-guest box. True white: an editable surface, the
     colour law's one meaning for it. */
  .addsearch { width:100%; font-size:var(--t3); border:1px solid var(--rule);
               border-radius:var(--r); padding:11px 13px; background:#fff;
               font-family:var(--ui-font); color:var(--ink); margin-bottom:7px;
               -webkit-appearance:none; appearance:none; }
  .addsearch::placeholder { color:var(--mid); }

  /* The stats are buttons here and only here, so the dress is this page's to
     set: no border and no fill, exactly as the shared .stat draws, and the
     pressed one carries an amber rule under its number. */
  button.stat { background:none; border:0; font-family:var(--ui-font); color:inherit;
                cursor:pointer; -webkit-tap-highlight-color:transparent; }
  button.stat .stat-n { border-bottom:2px solid transparent; }
  button.stat.on .stat-n { border-bottom-color:var(--amberb); }

  #errBar { font-size:var(--t2); color:var(--red); margin:10px 0; line-height:1.45; }
  .empty { font-size:var(--t2); color:var(--mid); margin:14px 2px; line-height:1.5; }
  .spacer { height:80px; }
</style>
</head>
<body class="tier-app ui2">

<div class="daterow">
  <button class="dnav today" id="dToday">Today</button>
  <button class="dnav" id="dPrev">&#8249;</button>
  <div class="date" id="title"></div>
  <button class="dnav" id="dNext">&#8250;</button>
  <div class="navwrap" id="navWrap" style="display:none">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"></div>
  </div>
</div>

<div class="noaccess" id="noAccess"></div>

<!-- Four numbers, four filters, and All leads as the default: the owner
     ruled it a fourth heading rather than a separate drop, 25 Aug, after the
     button-and-drop version drew the same tile twice on one screen. Buttons
     wearing the stat dress, which bends the affordance rule knowingly, and
     the pressed one carries the amber underline so the board never filters
     silently. -->
<div class="stats" id="statsRow">
  <button class="stat" data-f="all"><div class="stat-n" id="nAll">&ndash;</div><div class="stat-l">All</div></button>
  <button class="stat" data-f="requested"><div class="stat-n" id="nAsk">&ndash;</div><div class="stat-l">To answer</div></button>
  <button class="stat" data-f="suggested"><div class="stat-n" id="nSugg">&ndash;</div><div class="stat-l">Suggested</div></button>
  <button class="stat" data-f="booked"><div class="stat-n" id="nDay">&ndash;</div><div class="stat-l">Booked today</div></button>
</div>

<div id="board"></div>

<div id="errBar"></div>
<div class="spacer"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=12"></script>
<script src="nala-shared.js?v=66"></script>
<script>
var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";

/* ── the page in one paragraph ─────────────────────────────────
   The masseuse's single screen, and the desk's window into it. A guest's
   interest lives where the guest wrote it, /bookings/<id>/prearrival, and is
   never edited here. What happens to it lives at /spa/<booking>/<tid>, one
   record per treatment, so a stay can hold two. Four states carry the whole
   text-message loop this replaces: requested (white, the masseuse's queue),
   suggested (amber, the masseuse offered a different day or time and the
   desk has not put it to the guest yet), booked (green), declined (red,
   nothing free - the desk lets the guest down). Approving a suggestion is
   the desk's tap; a fresh ask after a decline is the desk's too. */

(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
})();
function navFilter(role){ if (window.NALA_NAVFILTER) NALA_NAVFILTER(role); }

/* Browsed dates, the standard header. todayKey() is the viewed day. */
var nav = initDateNav();
var VIEW = nav.VIEW, todayKey = nav.todayKey, isToday = nav.isToday;

/* How far ahead the board reads. 45 because the invite Worker refuses a
   pre-arrival SMS for an arrival more than 45 days out
   (worker/send-invites.js), so this window holds every ask a guest can
   lodge. It was 21 - "requests arrive about a week out" - until 27 Aug,
   when a form answer for a stay beyond three weeks proved invisible here:
   load() also fetches the viewed day, so the ask surfaced only when the
   date navigation reached its stay, which read as cards locked to their
   date. spa_suite pins this number to the Worker's, so neither can move
   without the other. An answer the desk types against a booking even
   further out still waits at the same cliff, 45 days before arrival. */
var HORIZON = 45;

/* The add list's resting window: who can be standing at the desk asking.
   Anyone further out asked by email or phone, with a name attached, and
   the search is how the desk reaches them. */
var SOON = 7;

/* Treatment hours: SPA_SLOTS in nala-shared.js, one list for every staff
   page, pinned with the guest form's copy to tests/slots.json. */
var SLOTS = SPA_SLOTS;
var slotLabel = spaSlotLabel;

function akey(s){ return String(s || '').slice(0, 10); }
function shortDay(key){
  var d = parseISO(key + 'T00:00:00'); if (!d) return key;
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + d.getDate();
}
/* The styleguide's date: Wd Dth Mon. A bare "Wed 2" on a tile was the
   owner's 27 Aug finding - past the month's edge nobody knows which
   Wednesday that is. Chips keep shortDay: they live inside one stay. */
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ordinal(n){
  var t = n % 10, h = n % 100;
  return n + (h >= 11 && h <= 13 ? 'th' : t === 1 ? 'st' : t === 2 ? 'nd' : t === 3 ? 'rd' : 'th');
}
function niceDay(key){
  var d = parseISO(key + 'T00:00:00'); if (!d) return key;
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' +
         ordinal(d.getDate()) + ' ' + MONTHS[d.getMonth()];
}
/* The one-line stay range, month said once when it is the same month and
   twice when the stay crosses one: Sun 20th - Tue 22nd Aug. */
function stayRange(bk){
  if (!bk || !bk.arrive) return '';
  var a = parseISO(akey(bk.arrive) + 'T00:00:00'),
      z = parseISO(akey(bk.depart) + 'T00:00:00');
  if (!a || !z) return '';
  var an = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][a.getDay()] + ' ' + ordinal(a.getDate());
  if (a.getMonth() !== z.getMonth()) an += ' ' + MONTHS[a.getMonth()];
  return an + ' - ' + niceDay(akey(bk.depart));
}

/* ── state ───────────────────────────────────────────────────── */
var BOOKINGS = {};   /* id -> { id, first, last, arrive, depart, villaByDate, pre } */
var SPA = {};        /* id -> { tid -> record } */
var OPEN = null;     /* { id, tid } of the one card open, tid 'new' for an add */
var SEL = null;      /* { day, time } while a card is open */
var FILTER = 'all'; /* the pressed stat; All is the resting state */
var ADDQ = '';      /* the desk's find-the-guest text, kept across repaints */
var SPACONTACT = null; /* /spacontact once loaded - the masseuse's mobile,
                          set in Settings, Prices; read only by the logins
                          that hold the Remind masseuse button */
function masseusePhone(){
  /* Judged again on the way out, not just on the way in: a number typed
     straight into the console must still be sendable or the sms: link
     would carry it to Messages as-is. */
  return (SPACONTACT && normalisePhone(SPACONTACT.phone)) || '';
}
/* The SMS's link back: ?open=<booking> opens that guest's waiting card, so
   the masseuse lands where the answer goes rather than on the whole board.
   One shot - closing the card must not have it spring back on the reload
   that follows every save. */
var OPENQ = (function(){
  var q = new URLSearchParams(location.search).get('open');
  return (q && /^[A-Za-z0-9-]{1,64}$/.test(q)) ? q : '';
})();

function nameOf(id, rec){
  var bk = BOOKINGS[id];
  if (bk) return ((bk.first || '') + ' ' + (bk.last || '')).trim() || 'Guest';
  return (rec && rec.name) || 'Guest';
}
/* The small line under the name: the second guest, when anyone has named
   one. companionOf in nala-shared.js holds the one precedence rule. */
function withLine(id){
  var bk = BOOKINGS[id];
  var c = bk ? companionOf(bk.pre, bk) : '';
  return c ? 'With ' + c : '';
}
/* Written with textContent by every caller, never into an HTML string: the
   name is typed by a guest or at the desk. */
function setCmp(el, id){
  var cm = el.querySelector('.cmp'), w = withLine(id);
  if (w) cm.textContent = w; else cm.remove();
}
function villaOf(id, day){
  var bk = BOOKINGS[id];
  if (!bk) return '';
  return bk.villaByDate[day] || bk.villa || '';
}
/* Chip days: the guest's own stay, from today forward - the one guard the
   whole feature was asked to carry: a treatment cannot land outside the
   stay, because the day control never offers such a day. */
function stayDays(id){
  var bk = BOOKINGS[id], out = [];
  if (!bk || !bk.arrive || !bk.depart) return out;
  var a = parseISO(akey(bk.arrive) + 'T00:00:00'),
      z = parseISO(akey(bk.depart) + 'T00:00:00');
  if (!a || !z) return out;
  var floor = parseISO(dkey(new Date()) + 'T00:00:00');
  for (var d = new Date(a); d <= z && out.length < 30; d.setDate(d.getDate()+1))
    if (d >= floor) out.push(dkey(d));
  return out;
}

/* dayOf moved to nala-shared.js, 8 Sep: the Dashboard needs the same
   reading for its spa reminder. */
function asRequested(rec){
  /* True of the time as well as the day. Until 9 Sep only the day was
     compared, so a 4pm ask booked at 1pm wore "as requested" - which is
     how a moved booking read as fine at a glance. The ask's time can be
     free text ("afternoon"); only one that names a slot can disagree. */
  if (rec.reqDay && rec.day !== rec.reqDay) return false;
  var t = spaSlotFromText(rec.reqTime);
  return !(t && rec.time && t !== rec.time);
}

/* The tile's anatomy, ruled 27 Aug: every line holds one kind of fact, in
   the same place on every tile, and no line wraps - the card carries the
   full story, the tile the glance. Beside the name, when: the treatment's
   own day and time (booked and suggested), or the guest's ask. Under it,
   who else. Last, the service offering and its state. */
function whenOf(rec){
  if (rec.status === 'booked' || rec.status === 'suggested')
    return niceDay(rec.day) + ' · ' + slotLabel(rec.time);
  if (rec.reqAny)
    return SPA_ANY_DAY_LABEL + (rec.reqTime ? ' · ' + rec.reqTime : '');
  if (rec.reqDay)
    return niceDay(rec.reqDay) + (rec.reqTime ? ' · ' + rec.reqTime : '');
  return rec.reqTime ? 'No day · ' + rec.reqTime : 'No day picked';
}
function serviceOf(rec, id){
  /* Both lengths on a pair, in order - '1.5 hr + 1 hr' - because the
     masseuse plans his day by time and length, and a hidden second length
     was the bug that forced the pair onto one tile. */
  var what = spaOffering(rec);
  var bk = BOOKINGS[id];
  var ask = (rec.reqAny ? 'any day' : rec.reqDay ? niceDay(rec.reqDay) : 'no day') +
            (rec.reqTime ? ', ' + rec.reqTime : '');
  if (rec.status === 'requested' || rec.virtual)
    return what + (bk ? ' · staying ' + stayRange(bk) : '');
  if (rec.status === 'suggested')
    return what + ' · suggested instead of ' + ask;
  if (rec.status === 'booked')
    return what + (asRequested(rec) ? ' · as requested'
                                    : ' · moved from ' + ask) +
           (rec.manual ? ' · approved at the desk' : '');
  if (rec.status === 'declined')
    return what + ' · declined' + (rec.note ? ' · ' + rec.note : '') +
           (rec.told ? ' · guest told' : ' · let the guest know');
  return what;
}

var BAND_CLASS = { suggested:' b-sugg', booked:' b-done', declined:' b-decl' };

/* ── items: every treatment, real or still only an ask ─────────
   A booking whose form says wellness yes, with no record born from that
   request yet, IS a request - the masseuse must see it before anything
   exists at /spa. It renders as a virtual record; answering it writes the
   real one, marked source prearrival so the ask stops showing as pending. */
function items(){
  var out = [];
  Object.keys(SPA).forEach(function(id){
    Object.keys(SPA[id]).forEach(function(tid){
      var r = SPA[id][tid];
      if (r && typeof r === 'object' && r.status)
        out.push({ id: id, tid: tid, rec: r });
    });
  });
  Object.keys(BOOKINGS).forEach(function(id){
    var p = BOOKINGS[id].pre;
    if (!p || p.wellness !== true) return;
    /* One ask for the whole request, however many massages it holds. Two
       tiles for a pair hid the second massage's length behind the first,
       the owner ruled 26 Aug: the pair travels together - one day, one
       time, a length each - and the card shows both. Answering writes a
       prearrival-source record, which is the ask spoken for. */
    /* The same test the hamburger badge applies, so a board showing an
       ask and a badge counting it can never disagree: nala-shared.js. */
    var have = spaAskSpokenFor(SPA[id]);
    /* "Any day" never becomes a reqDay: that field's rule takes a date or
       the empty string and would refuse it, so the masseuse would tap Book
       and get an error. It rides as a flag on the virtual record instead,
       which is read-only and never written - save() builds its body key by
       key and never copies this. */
    /* Only the chip says Any day. An empty day is a record from before the
       chip existed, or one the desk cleared, and it still reads "No day
       picked" - saying Any day for it would put words in a guest's mouth
       they never said. The guest form asks those guests again. */
    var anyDay = isAnyDay(p.wellDay);
    if (!have)
      out.push({ id: id, tid: 'ask0', rec: {
        virtual: true, status: 'requested', reqAny: anyDay,
        reqDay: anyDay ? '' : (p.wellDay || ''), reqTime: p.wellTime || '',
        qty: p.wellQty === 2 ? 2 : 1,
        dur: spaDur(p.wellDur) ? p.wellDur : 0,
        dur2: p.wellQty === 2 && spaDur(p.wellDur2) ? p.wellDur2 : 0
      } });
  });
  return out;
}

/* ── rendering ───────────────────────────────────────────────── */
function tile(it){
  var rec = it.rec;
  var el = document.createElement('button');
  el.type = 'button';
  el.className = 'vrow' + (BAND_CLASS[rec.status] || '');
  el.dataset.booking = it.id;
  el.dataset.tid = it.tid;
  el.dataset.status = rec.status;
  el.innerHTML = '<div class="v"></div>' +
    '<div class="mid"><div class="top"><span class="nm"></span><span class="when"></span></div>' +
    '<div class="cmp"></div><div class="st"></div></div>';
  el.querySelector('.v').textContent = villaOf(it.id, dayOf(rec) || todayKey());
  el.querySelector('.nm').textContent = nameOf(it.id, rec);
  el.querySelector('.when').textContent = whenOf(rec);
  setCmp(el, it.id);
  el.querySelector('.st').textContent = serviceOf(rec, it.id);
  el.onclick = function(){
    OPEN = { id: it.id, tid: it.tid };
    SEL = null;
    paint();
  };
  return el;
}

function greyTile(id, line, addable){
  var el = document.createElement('button');
  el.type = 'button';
  el.className = 'vrow b-grey';
  el.dataset.booking = id;
  el.dataset.status = 'none';
  el.innerHTML = '<div class="v"></div>' +
    '<div class="mid"><div class="nm"></div><div class="cmp"></div><div class="st"></div></div>';
  el.querySelector('.v').textContent = villaOf(id, todayKey()) || villaOf(id, dkey(new Date()));
  el.querySelector('.nm').textContent = nameOf(id, null);
  setCmp(el, id);
  el.querySelector('.st').textContent = line;
  if (addable) el.onclick = function(){ OPEN = { id: id, tid: 'new' }; SEL = null; paint(); };
  else el.disabled = true;
  return el;
}

function band(parent, title, els){
  if (!els.length) return;
  var h = document.createElement('div');
  h.className = 'grp';
  h.textContent = title + ' · ' + els.length;
  parent.appendChild(h);
  els.forEach(function(e){ parent.appendChild(e); });
}

/* The open card. One selection, two owners: the masseuse books or suggests,
   the desk approves or asks again. The primary button always names the day
   and time it will write, so the tap and the record cannot disagree. */
function card(it){
  var rec = it.rec, id = it.id;
  var isNew = it.tid === 'new';
  var role = normaliseRole(window.NALA_ROLE);
  var masseuse = role === 'spa';
  var days = stayDays(id);
  if (!days.length && rec.day) days = [rec.day];
  /* The selection opens on what the guest asked for. reqTime was free text
     until 25 Aug and can still arrive as a wish ("afternoon"), so the parse
     may return null and mid-morning stands in - but a request that names a
     slot must never open on a different one: the first live test booked a
     2pm ask at the 10am default. */
  if (!SEL) SEL = {
    day: rec.day || (rec.reqDay && days.indexOf(rec.reqDay) > -1 ? rec.reqDay : days[0] || ''),
    time: rec.time || spaSlotFromText(rec.reqTime) || '10:00',
    qty: rec.qty === 2 ? 2 : 1,
    dur: spaDur(rec.dur) ? rec.dur : 60,
    dur2: spaDur(rec.dur2) ? rec.dur2 : 60
  };

  var el = document.createElement('div');
  el.className = 'card' + (BAND_CLASS[rec.status] || '');
  el.dataset.booking = id;
  el.dataset.tid = it.tid;
  var head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = '<div class="v"></div>' +
    '<div class="mid"><div class="top"><span class="nm"></span><span class="when"></span></div>' +
    '<div class="cmp"></div><div class="st"></div></div>';
  head.querySelector('.v').textContent = villaOf(id, SEL.day || todayKey());
  head.querySelector('.nm').textContent = nameOf(id, rec);
  head.querySelector('.when').textContent = isNew ? '' : whenOf(rec);
  setCmp(head, id);
  head.querySelector('.st').textContent = isNew
    ? 'A new treatment · staying ' + stayRange(BOOKINGS[id])
    : serviceOf(rec, id);
  head.onclick = function(){ OPEN = null; SEL = null; paint(); };
  el.appendChild(head);

  var subD = document.createElement('div'); subD.className = 'sub';
  subD.textContent = 'Day'; el.appendChild(subD);
  var chips = document.createElement('div'); chips.className = 'chips';
  days.forEach(function(dk2){
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip' + (SEL.day === dk2 ? ' on' : '');
    c.textContent = shortDay(dk2);
    c.onclick = function(){ SEL.day = dk2; paint(); };
    chips.appendChild(c);
  });
  if (!days.length){
    var noDays = document.createElement('div');
    noDays.className = 'hint';
    noDays.textContent = 'No nights of this stay are still to come.';
    chips.appendChild(noDays);
  }
  el.appendChild(chips);

  var subT = document.createElement('div'); subT.className = 'sub';
  subT.textContent = 'Time'; el.appendChild(subT);
  var sel = document.createElement('select');
  sel.setAttribute('aria-label', 'Time');
  SLOTS.forEach(function(t){
    var o = document.createElement('option');
    o.value = t; o.textContent = slotLabel(t);
    if (t === SEL.time) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = function(){ SEL.time = sel.value; paint(); };
  el.appendChild(sel);

  /* How many, then a length for each - the pair edited whole from this
     card, by the desk and the masseuse alike, the owner's ruling of
     26 Aug after two tiles hid the second massage's length. */
  var subQ = document.createElement('div'); subQ.className = 'sub';
  subQ.textContent = 'Massages'; el.appendChild(subQ);
  var qrow = document.createElement('div'); qrow.className = 'chips';
  [1, 2].forEach(function(n){
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip' + (SEL.qty === n ? ' on' : '');
    c.textContent = n === 1 ? 'One' : 'Two';
    c.onclick = function(){ SEL.qty = n; paint(); };
    qrow.appendChild(c);
  });
  el.appendChild(qrow);
  function lenRow(label, key){
    var subL = document.createElement('div'); subL.className = 'sub';
    subL.textContent = label; el.appendChild(subL);
    var lens = document.createElement('div'); lens.className = 'chips';
    SPA_DURS.forEach(function(x){
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'chip' + (SEL[key] === x.m ? ' on' : '');
      c.textContent = x.label;
      c.onclick = function(){ SEL[key] = x.m; paint(); };
      lens.appendChild(c);
    });
    el.appendChild(lens);
  }
  lenRow(SEL.qty === 2 ? '1st length' : 'Length', 'dur');
  if (SEL.qty === 2) lenRow('2nd length', 'dur2');

  var btns = document.createElement('div'); btns.className = 'btns';
  var remind = false;
  var when = shortDay(SEL.day) + ' ' + slotLabel(SEL.time);
  /* A guest who said Any day has asked for every day of their stay, so any
     day the masseuse picks IS the ask and he books it outright. Sending a
     suggestion back to the desk to be put to a guest who already said they
     did not mind is the round trip this chip exists to save. */
  var matchesAsk = rec.reqAny ? !!SEL.day : (!!rec.reqDay && SEL.day === rec.reqDay);
  var changed = SEL.day !== rec.day || SEL.time !== rec.time;
  var hint = '';

  function btn(label, cls, fn){
    var x = document.createElement('button');
    x.type = 'button'; x.className = 'cbtn ' + cls; x.textContent = label;
    x.onclick = fn; btns.appendChild(x); return x;
  }
  function saveAs(status, extra){
    return function(){ save(it, status, extra || {}); };
  }
  /* A decline travels with its why: the guest's first question at the desk
     is the reason, and a no with no reason sends the desk back to the
     masseuse's phone - the loop this page exists to end. A browser prompt
     rather than a drawn field, the phonefix pattern: it is rare and it is
     one line. Cancel on the prompt aborts the decline, which also guards a
     mis-tap; an empty answer declines with no note. */
  function declineWith(it2){
    return function(){
      var why = window.prompt('Nothing free - any reason to pass on? ' +
                              'The guest will ask. Optional.', '');
      if (why === null) return;
      save(it2, 'declined', { note: why.trim() });
    };
  }
  /* The button law: cancelling a booking a guest holds asks first, naming
     the guest and the thing, and the dialog's Cancel costs nothing. */
  function cancelWith(it2){
    return function(){
      if (!window.confirm('Cancel ' + nameOf(id, rec) + '\u2019s ' +
                          niceDay(rec.day) + ' ' + slotLabel(rec.time) +
                          ' massage? The guest will need to be told.')) return;
      save(it2, 'declined', {});
    };
  }

  if (!days.length){
    /* Nothing can be picked; only a decline still makes sense. */
    if (!isNew) btn('Decline', 'danger', declineWith(it));
  } else if (masseuse){
    if (isNew){
      /* The masseuse adding one was asked in person and knows his own
         book, so it goes straight to booked, as requested. */
      btn('Book ' + when, 'solid', saveAs('booked', { req: true }));
    } else if (rec.status === 'booked'){
      if (changed) btn('Suggest ' + when, 'solid', saveAs('suggested'));
      btn(changed ? 'Cancel' : 'Cancel booking', 'danger', cancelWith(it));
      if (changed) hint = 'A change to a booked treatment goes back through ' +
        'the front desk, so the guest hears before it moves.';
    } else {
      if (matchesAsk) btn('Confirm ' + when, 'solid', saveAs('booked'));
      btn('Suggest ' + when, matchesAsk ? 'quiet' : 'solid', saveAs('suggested'));
      btn('Decline', 'danger', declineWith(it));
      hint = rec.reqAny
        ? 'The guest said any day of their stay suits them, so pick one and ' +
          'Confirm books it. Suggest is for a day outside the stay or a ' +
          'change worth putting to them first. Decline is for a stay with ' +
          'nothing free.'
        : matchesAsk
        ? 'Confirm books it. Suggest offers this time as a change instead, ' +
          'amber until the front desk approves it with the guest. Decline ' +
          'is for a stay with nothing free.'
        : 'A different day goes to the guest as a suggestion - amber until ' +
          'the front desk approves it.';
    }
  } else {
    if (isNew){
      btn('Ask the masseuse', 'solid', saveAs('requested', { req: true }));
      hint = 'The ask lands in the masseuse’s To answer list, ' +
             'the same as a request from the form.';
    } else if (rec.status === 'suggested'){
      if (rec.day === SEL.day && rec.time === SEL.time){
        btn('Approve ' + when, 'solid', saveAs('booked'));
        btn('Decline', 'danger', declineWith(it));
        hint = 'Approve once the guest has said yes - the booking turns ' +
               'green for everyone. The guest’s original ask stays on ' +
               'the record.';
      } else {
        btn('Ask again for ' + when, 'solid', saveAs('requested', { req: true }));
        btn('Decline', 'danger', declineWith(it));
        hint = 'A different day or time goes back to the masseuse as a ' +
               'fresh ask.';
      }
    } else if (rec.status === 'declined'){
      /* The decline's other half: the desk telling the guest IS the action
         the terracotta tile and the menu icon are chasing, so it gets a
         tap of its own. Told, the tile stops instructing and the icon
         stops counting it - the same self-clearing as every queue. */
      if (!rec.told)
        btn('Guest told', 'solid', saveAs('declined', { told: true }));
      btn('Ask again for ' + when, rec.told ? 'solid' : 'quiet',
          saveAs('requested', { req: true }));
    } else if (rec.status === 'booked'){
      if (changed) btn('Ask again for ' + when, 'solid', saveAs('requested', { req: true }));
      btn(changed ? 'Cancel' : 'Cancel booking', 'danger', cancelWith(it));
    } else {
      /* requested: normally the masseuse's to answer - but a verbal yes is
         an answer too. Manually approve books the selection directly,
         stamped as the desk's doing, for the time he agreed in person or
         on the phone and was never going to tap himself. The ask path
         stays for everything he has not agreed to. */
      btn('Manually approve ' + when, 'solid',
          saveAs('booked', { manual: true }));
      if (changed || rec.virtual)
        btn('Ask for ' + when, 'quiet', saveAs('requested', { req: true }));
      hint = 'Manually approve is only for a time the masseuse has already ' +
             'agreed to out loud - it books without his tap and the tile ' +
             'says the desk did it. Anything else waits on him.';
      /* The nudge, the owner's ask of 7 Sep: an ask he has not answered can
         be chased. Admin and manager only - a waiter holding spaBoard works
         the board, chasing the masseuse is management's. An SMS rather than
         a push, his ruling of the same day: the masseuse can have
         notifications off, and a reminder that only reaches a phone already
         listening reminds nobody. The button opens Messages with the text
         written - his number, the ask, a link that opens this card - and
         the desk presses send, so the send is seen rather than trusted. */
      if (role === 'admin' || role === 'manager'){
        remind = true;
        hint += ' Remind masseuse opens a text to him carrying this ask ' +
                'and a link back to it; nothing here changes until he answers.';
        if (!masseusePhone())
          hint += ' His mobile is not stored yet - Settings, Prices holds ' +
                  'it - so the text opens with the To box empty.';
      }
    }
  }
  /* The text, written for him to act on from the lock screen: who, where,
     what they asked, and a link that lands on this very card. "?&" before
     body is the one form iPhone and Android both read. */
  function remindHref(){
    var msg = 'Nala: villa ' + (villaOf(id, dayOf(rec) || todayKey()) || '?') +
              ', ' + nameOf(id, rec) + ' - massage request (' + whenOf(rec) +
              ') is waiting on you. Answer it here: ' + location.origin +
              '/spa.html?open=' + encodeURIComponent(id);
    return 'sms:' + masseusePhone() + '?&body=' + encodeURIComponent(msg);
  }
  /* Editing the details is its own act. Confirm and Suggest carry the
     pills with them, but a booked treatment being resized, or the desk
     correcting an ask, changes nothing about the state - so the moment
     how-many or a length differs from the record, Save changes appears
     and writes the edit with the status it found. Day and time stay out
     of it: moving a treatment goes through the buttons above, where the
     guest hears about it. */
  var lensChanged = !isNew && !changed &&
    (SEL.qty !== (rec.qty === 2 ? 2 : 1) ||
     SEL.dur !== (spaDur(rec.dur) ? rec.dur : 60) ||
     (SEL.qty === 2 && SEL.dur2 !== (spaDur(rec.dur2) ? rec.dur2 : 60)));
  if (lensChanged && days.length){
    var sb = btn('Save changes', rec.status === 'booked' ? 'solid' : 'quiet',
                 saveAs(rec.status || 'requested'));
    if (rec.status === 'booked') btns.insertBefore(sb, btns.firstChild);
  }
  /* The notes area, the owner's ask of 7 Sep: the accommodation booking's
     staff note, translated to a treatment. Free text about this massage -
     pressure, access, who was told what - on the record itself, so the desk
     and the masseuse read the same line, and never a guest: /spa is
     staff-only by rule. It rides every save, so answering an ask keeps it;
     Save note writes it alone and quietly - a note is bookkeeping, nobody's
     queue, so it must not buzz (the told stamp's precedent). Only a real
     record holds one: an ask still virtual has nothing to pin it to. */
  if (!isNew && !rec.virtual){
    var subN = document.createElement('div'); subN.className = 'sub';
    subN.textContent = 'Notes'; el.appendChild(subN);
    var ta = document.createElement('textarea');
    ta.rows = 2;
    ta.placeholder = 'For staff and the masseuse. The guest cannot see this.';
    ta.setAttribute('aria-label', 'Notes');
    ta.value = (typeof SEL.notes === 'string') ? SEL.notes : (rec.staffNote || '');
    el.appendChild(ta);
    var nrow = document.createElement('div'); nrow.className = 'btns';
    nrow.style.marginTop = '8px';
    var nb = document.createElement('button');
    nb.type = 'button'; nb.className = 'cbtn quiet'; nb.textContent = 'Save note';
    nb.onclick = function(){
      /* Day and time stay out of it, the Save changes rule: moving a
         treatment goes through the buttons above, where the guest hears
         about it - a stray chip tap must not ride out on a note. */
      if (rec.day){ SEL.day = rec.day; SEL.time = rec.time; }
      save(it, rec.status || 'requested', { quiet: true });
    };
    nrow.appendChild(nb);
    el.appendChild(nrow);
    var noteDiffers = function(){
      return ta.value.trim() !== (rec.staffNote || '').trim();
    };
    nrow.style.display = noteDiffers() ? 'flex' : 'none';
    /* Typing repaints nothing - a repaint takes the keyboard's focus, the
       find-the-guest lesson - so the button reveals itself imperatively. */
    ta.oninput = function(){
      SEL.notes = ta.value;
      nrow.style.display = noteDiffers() ? 'flex' : 'none';
    };
  }
  el.appendChild(btns);
  /* Its own row, under the primary: a nudge is not an answer, so it never
     competes with the buttons that move the record. */
  if (remind){
    var rrow = document.createElement('div');
    rrow.className = 'btns'; rrow.style.marginTop = '8px';
    var rb = document.createElement('a');
    rb.className = 'cbtn quiet';
    rb.href = remindHref();
    rb.textContent = 'Remind masseuse';
    rrow.appendChild(rb);
    el.appendChild(rrow);
  }
  if (hint){
    var h = document.createElement('div');
    h.className = 'hint'; h.textContent = hint;
    el.appendChild(h);
  }
  return el;
}

/* ── the sanity read ─────────────────────────────────────────
   Seen live 9 Sep: one guest, three records - a decline still standing and
   the same two-massage treatment booked twice at the same hour. Every
   screen is a snapshot from its own last load and nothing pushes changes
   to the others, so after a decline and a phoned-in change of plan, the
   desk and the masseuse each answered the ask their stale board still
   showed. A virtual ask mints a fresh record id on every answer, which is
   how one request became three records.

   So every save re-reads the guest's records first and refuses, writing
   NOTHING, when the world has moved since the board drew:

     - an ask already answered on another screen is not answered again
       (each answer minting a fresh id is where the duplicates came from);
     - a record that changed since this board drew it is not overwritten
       blind (the `at` stamp is the generation mark);
     - a day and time the guest already holds is not booked twice.

   The refusal reloads the board on the spot, so the screen that was
   behind catches up and the person sees what actually stands before
   going again. Client-side only, and knowingly so: the database rules
   cannot iterate a guest's sibling records, and the one second between
   read and write is a far smaller window than the stale board this
   closes, which could be hours wide.                                  */
function saveRefusal(cur, it, tid, rec, body){
  var minted = it.tid.indexOf('ask') === 0 || it.tid === 'new';
  if (it.tid.indexOf('ask') === 0 && spaAskSpokenFor(cur))
    return 'Already answered on another screen - nothing was written. ' +
           'The board has caught up below; check it before going again.';
  if (!minted){
    var held = cur[it.tid];
    if (!held || typeof held !== 'object' || held.status !== rec.status ||
        String(held.at || '') !== String(rec.at || ''))
      return 'This changed on another screen since the board loaded - ' +
             'nothing was written. The board has caught up below; check ' +
             'it and go again if the change still applies.';
  }
  if (body.day && body.time){
    for (var t2 in cur){
      var r2 = cur[t2];
      if (t2 === tid || !r2 || typeof r2 !== 'object') continue;
      if ((r2.status === 'booked' || r2.status === 'suggested') &&
          r2.day === body.day && r2.time === body.time)
        return nameOf(it.id, rec) + ' already holds a massage at ' +
               niceDay(body.day) + ' ' + slotLabel(body.time) +
               ' - nothing was written. Cancel that one first if this ' +
               'is meant to replace it.';
    }
  }
  return '';
}

/* One write, the whole record. PUT rather than PATCH so a record can never
   hold two generations at once: the fields of the state it left do not
   linger under the state it entered. */
function save(it, status, opts){
  var rec = it.rec, id = it.id;
  var tid = (it.tid.indexOf('ask') === 0 || it.tid === 'new')
    ? 't' + Date.now() : it.tid;
  var body = {
    status: status,
    name: nameOf(id, rec),
    source: rec.virtual ? 'prearrival'
          : rec.source || (normaliseRole(window.NALA_ROLE) === 'spa' ? 'spa' : 'desk'),
    by: (window.NALA_USER && (NALA_USER.email || '')) || '',
    at: new Date().toISOString()
  };
  /* The ask travels with the record whatever happens to it, so "moved from"
     and "asked for" never need the form re-read. A desk re-ask replaces it:
     that IS the new ask. */
  if (opts.req){ body.reqDay = SEL.day; body.reqTime = slotLabel(SEL.time); }
  else { body.reqDay = rec.reqDay || ''; if (rec.reqTime) body.reqTime = rec.reqTime; }
  if (status === 'booked' || status === 'suggested'){
    body.day = SEL.day; body.time = SEL.time;
  }
  var why = (opts.note !== undefined) ? opts.note : rec.note;
  if (status === 'declined' && why) body.note = why;
  if (SEL && spaDur(SEL.dur)) body.dur = SEL.dur;
  else if (spaDur(rec.dur)) body.dur = rec.dur;
  /* A pair is one record: qty 2 and a second length. A PUT of qty one
     simply carries neither, which is what makes One a real answer. */
  var qty = SEL ? SEL.qty : (rec.qty === 2 ? 2 : 1);
  if (qty === 2){
    body.qty = 2;
    body.dur2 = (SEL && spaDur(SEL.dur2)) ? SEL.dur2
              : (spaDur(rec.dur2) ? rec.dur2 : 60);
  }
  if (status === 'booked' && (opts.manual || rec.manual))
    body.manual = rec.manual || new Date().toISOString();
  if (status === 'declined' && (opts.told || rec.told))
    body.told = rec.told || new Date().toISOString();
  /* The staff note survives whatever happens to the record: a PUT that
     dropped it would eat the note on every answer. An emptied box saves
     as nothing, which is the way back. staffNote, not note - note is the
     decline's reason and the two must never blur. */
  var nv = (SEL && typeof SEL.notes === 'string') ? SEL.notes.trim()
                                                  : (rec.staffNote || '');
  if (nv) body.staffNote = nv;
  var err = document.getElementById('errBar');
  /* The card is redrawn out of existence by load() below, so the answer has
     to be seen before that happens rather than after: the write says Saving,
     lands green on the button that was pressed, and only then does the board
     reload underneath it.                                                 */
  return saveFeedback(pressedButton(), function(){
  /* The sanity read, above: what stands at /spa for this guest right now,
     not what this board loaded. One guest's few records - cheap - and the
     only thing between two stale screens and three records of one ask.
     A read that cannot be made is its own failure, worded by status like
     the write's below: writing blind because the check was unreachable
     would be the bug this exists to close. */
  return fetch(DB + '/spa/' + id + '.json?v=' + Date.now()).then(function(r){
    if (!r.ok) throw new Error('spa read failed ' + r.status);
    return r.json();
  }).then(function(cur){
    cur = (cur && typeof cur === 'object') ? cur : {};
    var no = saveRefusal(cur, it, tid, rec, body);
    if (no){
      /* The refused screen is the stale one, so it catches up on the
         spot: the red line says what happened, the board what stands. */
      OPEN = null; SEL = null; load();
      var e2 = new Error(no); e2.said = true; throw e2;
    }
    return fetch(DB + '/spa/' + id + '/' + tid + '.json', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }).then(function(r){
    /* The STATUS goes into the error, not a bare one. The shared
       saveFailWords reads the message to tell a refusal - a permission,
       which needs the manager - from a write that never arrived, which
       needs another go; handed nothing at all it could recognise neither,
       so a rules rejection here read as "check the connection" and sent
       the masseuse to the wrong remedy entirely. */
    if (!r.ok) throw new Error('spa save failed ' + r.status);
    /* The buzz, the owner's ask of 27 Aug: every save moves a treatment
       somewhere the other side acts on, so each fires its event and the
       push Worker routes it - the masseuse hears the desk's asks and
       cancellations, the desk hears his answers, and neither watches a
       board to find out. The one exception is the told stamp on an
       already-declined record: bookkeeping, nobody's queue. A guest's own
       form ask has no tap here to fire from; the mews-sync sweep
       announces those. */
    var ev = status === 'requested' ? 'spaRequest'
           : status === 'suggested' ? 'spaSuggested'
           : status === 'booked'    ? 'spaBooked'
           : (rec.status !== 'declined') ? 'spaCancelled'
           : null;
    if (ev && !opts.quiet)
      notifyPush(ev, villaOf(id, (SEL && SEL.day) || dayOf(rec) || todayKey()),
                 window.NALA_USER);
  });
  }, {
    done:'Saved ✓', hold:400,
    then:function(){ OPEN = null; SEL = null; load(); },
    fail:function(msg){ err.textContent = msg; }
  });
}

function paint(){
  var list = items();
  var day = todayKey(), real = dkey(new Date());

  /* The masseuse's whole queue, not the viewed day's slice: the number is
     "what is waiting on me", wherever it sits in the calendar. All counts
     every live tile its band shows, grey add-tiles aside. */
  document.getElementById('nAll').textContent =
    list.filter(function(it){
      var st = it.rec.status, d0 = dayOf(it.rec);
      if (st === 'requested' || st === 'suggested') return true;
      return !d0 || d0 >= real;
    }).length;
  document.getElementById('nAsk').textContent =
    list.filter(function(it){ return it.rec.status === 'requested'; }).length;
  document.getElementById('nSugg').textContent =
    list.filter(function(it){ return it.rec.status === 'suggested'; }).length;
  document.getElementById('nDay').textContent =
    list.filter(function(it){ return it.rec.status === 'booked' && dayOf(it.rec) === day; }).length;
  document.getElementById('nDay').nextElementSibling.textContent =
    isToday() ? 'Booked today' : 'Booked this day';

  /* The one open card draws once, whichever band reaches its item first:
     two live copies of one form is a bug waiting for a tap. */
  var cardDrawn = false;
  function el(it){
    if (OPEN && OPEN.id === it.id && OPEN.tid === it.tid && !cardDrawn){
      cardDrawn = true;
      return card(it);
    }
    return tile(it);
  }

  /* Four filters, one board. All is the resting state and holds the whole
     horizon in bands - every open ask wherever it sits, every suggestion,
     everything booked from today on, recent declines, and (for the desk
     alone) every stay with no treatment yet, tappable to add one. The other
     three stats narrow to their own queue: horizon-wide for To answer and
     Suggested, the viewed day for Booked, matching the labels they sit
     under. Tapping the pressed one returns to All. */
  var statBtns = document.querySelectorAll('#statsRow .stat');
  for (var sb = 0; sb < statBtns.length; sb++)
    statBtns[sb].className = 'stat' +
      (FILTER === statBtns[sb].getAttribute('data-f') ? ' on' : '');

  var of = function(st, keep){ return list.filter(function(it){
    return it.rec.status === st && (!keep || keep(it)); }); };
  var upcoming = function(it){ var d0 = dayOf(it.rec); return !d0 || d0 >= real; };
  var byDay = function(a, b){
    return ((dayOf(a.rec) || '9999') + (a.rec.time || ''))
      .localeCompare((dayOf(b.rec) || '9999') + (b.rec.time || ''));
  };

  var board = document.getElementById('board');
  board.innerHTML = '';
  if (FILTER === 'all'){
    band(board, 'To answer', of('requested').sort(byDay).map(el));
    band(board, 'Suggested · waiting on the guest', of('suggested').sort(byDay).map(el));
    band(board, 'Booked', of('booked', upcoming).sort(byDay).map(el));
    band(board, 'Declined', of('declined', upcoming).sort(byDay).map(el));
    /* The masseuse sees the guests who want him and nobody else: a stay
       with no request is none of an outside contractor's business, the
       owner ruled, 25 Aug. The desk keeps the add path, because the desk
       is who adds a treatment when a guest asks - and since the board
       reads the invite Worker's whole 45 days, finding the guest IS the
       path. The old band simply listed every treatmentless stay in the
       window, which at 45 days is a wall of grey nobody could read as
       anything (the owner, 27 Aug). So the resting list is only who can
       be standing at the desk - in a villa now or arriving within the
       week - and the search reaches everyone else in the window, the
       guests who ask by email, by name or by villa number. */
    if (normaliseRole(window.NALA_ROLE) !== 'spa'){
      var covered = {};
      list.forEach(function(it){ covered[it.id] = true; });
      var byArrive = function(a, b){
        return akey(BOOKINGS[a].arrive).localeCompare(akey(BOOKINGS[b].arrive));
      };
      var pool = Object.keys(BOOKINGS).filter(function(id){ return !covered[id]; })
        .sort(byArrive);
      /* Guests already on the board, reachable through the SEARCH alone
         (the owner, 11 Sep): a party can want a second massage, and until
         now the only bookings the search could find were ones with
         nothing. Search-only, never the resting list - their records ARE
         the board above, and a second tile at rest is the wall of grey
         of 27 Aug again. The tile names what they already hold, so an
         add here is knowingly an ADDITIONAL massage rather than the same
         one keyed twice - the double-decline accident, closed with words
         (the same-day-and-time refusal in saveRefusal stays the hard
         stop behind them). */
      var heldPool = Object.keys(BOOKINGS).filter(function(id){ return covered[id]; })
        .sort(byArrive);
      if (pool.length || heldPool.length){
        var hAdd = document.createElement('div');
        hAdd.className = 'grp';
        hAdd.textContent = 'Add a treatment';
        board.appendChild(hAdd);
        var find = document.createElement('input');
        find.type = 'text'; find.id = 'addFind'; find.className = 'addsearch';
        find.placeholder = 'Find the guest · name or villa';
        find.setAttribute('aria-label', 'Find the guest');
        find.autocomplete = 'off';
        find.value = ADDQ;
        board.appendChild(find);
        var tilesBox = document.createElement('div');
        board.appendChild(tilesBox);
        var soonEnd = (function(){
          var d = new Date(); d.setDate(d.getDate() + SOON); return dkey(d);
        })();
        var addTile = function(id){
          var bk = BOOKINGS[id], p = bk.pre;
          var here = akey(bk.arrive) <= real;
          var line = (here ? 'In villa until ' + niceDay(akey(bk.depart))
                           : 'Arrives ' + niceDay(akey(bk.arrive)) +
                             ', until ' + niceDay(akey(bk.depart)));
          if (p && p.wellness === false)
            line = 'Said no thank you on the form · ' + line.charAt(0).toLowerCase() + line.slice(1);
          else line += ' · tap to add one';
          return greyTile(id, line, true);
        };
        /* A found guest who is already on the board: their tile says what
           stands, in the board's own order of what matters - a suggestion
           owed, then a booking held, an ask waiting, a decline - so the
           add is made knowing it is a second massage. */
        var heldTile = function(id){
          var recs = SPA[id] || {}, best = null;
          var rank = { suggested: 0, booked: 1, requested: 2, declined: 3 };
          Object.keys(recs).forEach(function(tid){
            var t = recs[tid];
            if (!t || typeof t !== 'object' || !(t.status in rank)) return;
            if (!best || rank[t.status] < rank[best.status]) best = t;
          });
          var line;
          if (!best)
            /* Covered only by the form's own ask, no record yet. */
            line = 'Asked on the form · waiting on the masseuse';
          else {
            var d = (best.status === 'booked' || best.status === 'suggested')
              ? (best.day || '') : (best.reqDay || '');
            line = { suggested:'Suggested', booked:'Booked',
                     requested:'Asked', declined:'Declined' }[best.status] +
                   (d ? ' ' + niceDay(d) : '') +
                   (best.time ? ' · ' + slotLabel(best.time) : '');
          }
          return greyTile(id, line + ' · tap to add another', true);
        };
        var addHint = function(t){
          var e2 = document.createElement('div');
          e2.className = 'hint'; e2.textContent = t;
          tilesBox.appendChild(e2);
        };
        /* Typing refills only the tiles, never the board: a repaint would
           take the keyboard's focus with it on every letter. */
        var fillAdd = function(){
          tilesBox.innerHTML = '';
          /* An add in progress: the grey tile has no record behind it, so
             the open card is built from nothing but the booking - and it
             stays on screen whatever the search box says. */
          var openNew = (OPEN && OPEN.tid === 'new' && BOOKINGS[OPEN.id])
            ? OPEN.id : null;
          if (openNew)
            tilesBox.appendChild(card({ id: openNew, tid: 'new',
                                        rec: { status: '', reqDay: '', reqTime: '' } }));
          var q = ADDQ.trim().toLowerCase();
          /* The villa answers only to its exact number: a typed 1 must
             not drag in villas 12 and 15 the way a name fragment may. */
          var hits = function(id){
            return nameOf(id, null).toLowerCase().indexOf(q) > -1 ||
                   String(villaOf(id, todayKey()) || '') === q;
          };
          var rest = pool.filter(function(id){ return id !== openNew; });
          var shown = rest.filter(function(id){
            if (!q) return akey(BOOKINGS[id].arrive) <= soonEnd;
            return hits(id);
          });
          shown.forEach(function(id){ tilesBox.appendChild(addTile(id)); });
          /* The already-on-the-board guests answer to a typed search only,
             after the treatmentless ones, each marked with what they hold. */
          var held = !q ? [] : heldPool.filter(function(id){
            return id !== openNew && hits(id);
          });
          held.forEach(function(id){ tilesBox.appendChild(heldTile(id)); });
          if (!q && rest.length > shown.length)
            addHint((rest.length - shown.length) +
                    ' more arrive later in the next ' + HORIZON +
                    ' days. The search finds them by name or villa.');
          if (q && !shown.length && !held.length)
            addHint('No guest by that name or villa ' +
                    'in the next ' + HORIZON + ' days.');
        };
        find.oninput = function(){ ADDQ = find.value; fillAdd(); };
        fillAdd();
      }
    }
    if (!board.children.length){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Nothing on the books in the next ' + HORIZON +
        ' days. Requests from the pre-arrival form appear here on their own.';
      board.appendChild(e);
    }
  } else {
    var matches = list.filter(function(it){
      if (it.rec.status !== FILTER) return false;
      return FILTER === 'booked' ? dayOf(it.rec) === day : true;
    }).sort(byDay);
    var title = FILTER === 'requested' ? 'Every open ask'
              : FILTER === 'suggested' ? 'Suggested · waiting on the guest'
              : 'Booked · ' + (isToday() ? 'today' : 'this day');
    band(board, title, matches.map(el));
    if (!matches.length){
      var e0 = document.createElement('div');
      e0.className = 'empty';
      e0.textContent = 'Nothing in this queue. Tap All for everything.';
      board.appendChild(e0);
    }
  }
}

document.getElementById('statsRow').onclick = function(e){
  var b = e.target.closest('button.stat'); if (!b) return;
  var f = b.getAttribute('data-f');
  FILTER = (FILTER === f) ? 'all' : f;
  paint();
};

/* ── loading ─────────────────────────────────────────────────── */
/* /stays day by day, the same read every board makes, then the two records
   this page lives on: the whole /spa node in one ask - a small resort's
   treatments fit in one response - and each booking's own prearrival for
   the wellness answer. Everything else about a guest stays unread here,
   and the rules hold the masseuse's login to that. */
function load(){
  var real = dkey(new Date());
  var days = [], seen = {};
  for (var i = 0; i < HORIZON; i++){
    var d = new Date(); d.setDate(d.getDate() + i);
    days.push(dkey(d));
  }
  if (days.indexOf(todayKey()) < 0) days.push(todayKey());
  return Promise.all([
    Promise.all(days.map(function(dk2){
      return fetch(DB + '/stays/' + dk2 + '.json?v=' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
        .then(function(day){ return { d: dk2, day: day || {} }; });
    })),
    fetch(DB + '/spa.json?v=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; }),
    /* Only the two logins that draw the button read the number; the rules
       hold everyone else to that, so asking would only collect a 401. */
    (function(){
      var r = normaliseRole(window.NALA_ROLE);
      if (r !== 'admin' && r !== 'manager') return Promise.resolve(null);
      return fetch(DB + '/spacontact.json?v=' + Date.now())
        .then(function(r2){ return r2.ok ? r2.json() : null; })
        .catch(function(){ return null; });
    })(),
    /* The whole node, because the badge counts from it. This board built its
       list from a WINDOW of /stays, so a guest who ticked wellness and is not
       staying inside that window had no card - while the hamburger counted
       their ask all the same. A badge nobody can clear from the screen it
       belongs to is worse than no badge, and waiting for the guest to arrive
       is not an answer to a question they asked weeks ago. */
    fetch(DB + '/bookings.json?v=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })
  ]).then(function(res){
    SPACONTACT = res[2];
    BOOKINGS = {};
    res[0].forEach(function(x){
      Object.keys(x.day).forEach(function(v){
        var s = x.day[v];
        if (!s || typeof s !== 'object' || !s.id) return;
        var bk = BOOKINGS[s.id];
        if (!bk){
          bk = BOOKINGS[s.id] = { id: s.id, first: s.first || '', last: s.last || '',
                                  companion: s.companion || '',
                                  arrive: s.arrive, depart: s.depart,
                                  villaByDate: {}, pre: null };
        }
        /* Nights synced before the Worker carried the companion lack it;
           any later night that has it fills the gap. */
        if (!bk.companion && s.companion) bk.companion = s.companion;
        bk.villaByDate[x.d] = v;
        if (!bk.villa) bk.villa = v;
      });
    });
    SPA = {};
    var spa = res[1] || {};
    Object.keys(spa).forEach(function(id){
      if (spa[id] && typeof spa[id] === 'object') SPA[id] = spa[id];
    });
    /* Anyone the window missed who is still owed an answer. The guards are
       the badge's own, in spaOwedCounts: a cancelled booking is not a request
       anybody can act on, and neither is one whose guest has already left. */
    var all = res[3] || {}, todayK = todayKey();
    Object.keys(all).forEach(function(id){
      if (BOOKINGS[id]) return;
      var b = all[id] || {}, p = b.prearrival, pms = b.pms || {};
      if (!p || typeof p !== 'object' || p.wellness !== true) return;
      if (String(pms.state || '').toLowerCase() === 'cancelled') return;
      var dep = String(pms.depart || '').slice(0, 10);
      if (dep && dep < todayK) return;
      if (spaAskSpokenFor(SPA[id])) return;
      BOOKINGS[id] = { id:id, first:pms.first || '', last:pms.last || '',
                       companion:'', arrive:pms.arrive, depart:pms.depart,
                       villaByDate:{}, villa:pms.villa ? String(pms.villa) : '',
                       pre:p, offWindow:true };
    });

    /* Those carry their pre already, from the node they came out of. */
    return Promise.all(Object.keys(BOOKINGS).filter(function(id){
      return !BOOKINGS[id].offWindow;
    }).map(function(id){
      return fetch(DB + '/bookings/' + id + '/prearrival.json?v=' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
        .then(function(p){ BOOKINGS[id].pre = p; });
    }));
  }).then(function(){
    if (OPENQ){
      /* The waiting ask first - the SMS link's target - else whatever the
         booking holds, so the desk's Manage button (11 Sep) lands on the
         guest's card in any state rather than on the whole board. */
      var mine = items().filter(function(x){ return x.id === OPENQ; });
      var hit = mine.filter(function(x){
        return x.rec.status === 'requested'; })[0] || mine[0];
      if (hit) OPEN = { id: hit.id, tid: hit.tid };
      OPENQ = '';
    }
    paint();
  });
}

function showAccess(allowed, e){
  var box = document.getElementById('noAccess');
  var on = !allowed;
  box.innerHTML = !on ? '' :
    (e ? '<div>Could not check access. This is usually the connection, '
       + 'not your login.</div>'
       + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
       : 'This login has no access to the Spa board. See the manager.');
  if (on && !e){
    var home = homeFor(window.NALA_ROLE);
    if (home && home !== location.pathname.split('/').pop()){
      location.replace(home); return;
    }
  }
  box.className = 'noaccess' + (on ? ' show' : '');
  ['statsRow','board'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.style.display = on ? 'none' : '';
  });
  if (!on) load();
}

window.NALA_ROLE = null;
(function gate(){
  if (!window.firebase || !firebase.auth || typeof loadStaff !== 'function')
    return setTimeout(gate, 40);
  var A; try { A = firebase.auth(); } catch(e){ return setTimeout(gate, 40); }
  if (!A || !A.onAuthStateChanged) return setTimeout(gate, 40);
  A.onAuthStateChanged(function(u){
    if (!u) return;                 /* auth.js owns the signed-out state */
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role;
      window.NALA_USER = u;
      document.getElementById('navWrap').style.display = 'block';
      navFilter(role);
      showAccess(can(role, 'spaBoard'), e);
    });
  });
})();
</script>
