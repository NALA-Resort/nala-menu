<style>
  :root { --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA; --red:#A8321E;
          /* The colour law, CLAUDE.md: booked wears the Reservations green,
             a suggestion wears amber (attention, chase this), and declined
             wears terracotta - a negative answer, not a failure. Red never
             fills a tile; it keeps to the error bar, where it means one. */
          --resgreen:#5E7D67; --resgreen-t:rgba(122,160,130,.26);
          --resgreen-b:rgba(122,160,130,.65);
          --amber:#F6EAD5; --amberb:#C29A55; --ambert:#8A6A1E;
          --terra:#9E6455; --terra-t:rgba(184,106,90,.16);
          --terra-b:rgba(184,106,90,.45); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--ink); font-family:var(--ui-font);
         padding:calc(24px + env(safe-area-inset-top)) 18px 0;
         -webkit-tap-highlight-color:transparent; }

  .grp { font-size:9px; letter-spacing:.16em; text-transform:uppercase;
         color:var(--mid); margin:14px 2px 6px; }

  .vrow { display:flex; align-items:center; gap:12px; width:100%;
          background:#fff; border:1px solid var(--rule); border-radius:10px;
          padding:11px 13px; margin-bottom:7px; text-align:left;
          font-family:inherit; color:inherit; cursor:pointer; }
  .vrow .v { font-size:20px; min-width:30px; text-align:center; }
  .vrow .mid { flex:1; min-width:0; }
  .vrow .nm { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vrow .st { font-size:11px; color:var(--mid); margin-top:2px; line-height:1.4; }
  .vrow.b-done { background:var(--resgreen-t); border-color:var(--resgreen-b); }
  .vrow.b-done .st { color:var(--resgreen); }
  .vrow.b-sugg { background:var(--amber); border-color:var(--amberb); }
  .vrow.b-sugg .st { color:var(--ambert); }
  .vrow.b-decl { background:var(--terra-t); border-color:var(--terra-b); }
  .vrow.b-decl .st { color:var(--terra); }
  .vrow.b-grey { background:transparent; border-style:dashed; opacity:.62; }

  /* A tapped tile grows its controls in place rather than opening a second
     screen: the masseuse answers with the list still in view. */
  .card { border:1.2px solid var(--ink); border-radius:10px; background:#fff;
          padding:11px 13px; margin-bottom:7px; }
  .card.b-sugg { background:var(--amber); border-color:var(--amberb); }
  .card.b-sugg .st { color:var(--ambert); }
  .card.b-decl { background:var(--terra-t); border-color:var(--terra-b); }
  .card.b-decl .st { color:var(--terra); }
  .card .head { display:flex; align-items:center; gap:12px; }
  .card .v { font-size:20px; min-width:30px; text-align:center; }
  .card .mid { flex:1; min-width:0; }
  .card .nm { font-size:15px; }
  .card .st { font-size:11px; color:var(--mid); margin-top:2px; line-height:1.4; }
  /* The second guest's line, under the name on tile and card alike. Always
     the resting grey: it is who is coming, not a state, so it never takes
     the band's colour the way .st does. */
  .vrow .cmp, .card .cmp { font-size:11px; color:var(--mid); margin-top:1px; line-height:1.4; }
  .sub { font-size:11px; letter-spacing:.12em; text-transform:uppercase;
         color:var(--mid); margin:12px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:11px; padding:7px 11px; border:1px solid var(--rule);
          border-radius:16px; background:#fff; color:var(--ink);
          font-family:inherit; cursor:pointer; }
  .chip.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .card select { width:100%; font-size:15px; border:1px solid var(--rule);
                 border-radius:8px; padding:10px 12px; background:#fff;
                 font-family:inherit; margin-top:2px; color:var(--ink);
                 -webkit-appearance:none; appearance:none; }
  /* Three buttons can stand here and the labels carry a day and a time, so
     the row wraps rather than pushing the page sideways at 320. */
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .cbtn { flex:1 1 auto; min-width:0; text-align:center; padding:12px 4px; border:1px solid var(--ink);
          border-radius:8px; background:none; color:var(--ink); font-family:inherit;
          font-size:11px; letter-spacing:.12em; text-transform:uppercase;
          white-space:nowrap; cursor:pointer; }
  .cbtn.solid { background:var(--ink); color:var(--cream); }
  .cbtn.quiet { border-color:var(--rule); color:var(--mid); flex:0 0 auto; padding:12px 14px; }
  .hint { font-size:11px; color:var(--mid); margin-top:8px; line-height:1.45; }

  /* The stats are buttons here and only here, so the dress is this page's to
     set: no border and no fill, exactly as the shared .stat draws, and the
     pressed one carries an amber rule under its number. */
  button.stat { background:none; border:0; font-family:inherit; color:inherit;
                cursor:pointer; -webkit-tap-highlight-color:transparent; }
  button.stat .stat-n { border-bottom:2px solid transparent; }
  button.stat.on .stat-n { border-bottom-color:var(--amberb); }

  #errBar { font-size:13px; color:var(--red); margin:10px 0; line-height:1.45; }
  .empty { font-size:13px; color:var(--mid); margin:14px 2px; line-height:1.5; }
  .spacer { height:80px; }
</style>
</head>

     button-and-drop version drew the same tile twice on one screen. Buttons
     wearing the stat dress, which bends the affordance rule knowingly, and

<script>
var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";

/* ── the page in one paragraph ─────────────────────────────────
   The masseuse's single screen, and the desk's window into it. A guest's
   interest lives where the guest wrote it, /bookings/<id>/prearrival, and is
   never edited here. What happens to it lives at /spa/<booking>/<tid>, one
   record per treatment, so a stay can hold two. Four states carry the whole
   text-message loop this replaces: requested (white, the masseuse's queue),
   suggested (amber, the masseuse offered a different day or time and the
   desk has not put it to the guest yet), booked (green), declined (red,
   nothing free - the desk lets the guest down). Approving a suggestion is
   the desk's tap; a fresh ask after a decline is the desk's too. */

(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
  var so=document.getElementById('navSignout');
  if (so) so.onclick=function(e){ e.preventDefault();
    if (window.NALA_SIGNOUT) NALA_SIGNOUT(); else location.reload(); };
})();
function navFilter(role){ if (window.NALA_NAVFILTER) NALA_NAVFILTER(role); }

/* Browsed dates, the standard header. todayKey() is the viewed day. */
var nav = initDateNav();
var VIEW = nav.VIEW, todayKey = nav.todayKey, isToday = nav.isToday;

/* How far ahead the board reads. Pre-arrival requests arrive about a week
   out, so three weeks covers every ask that can exist plus the stays the
   desk would add one to. A knob can come later if it ever falls short. */
var HORIZON = 21;

/* Treatment hours: SPA_SLOTS in nala-shared.js, one list for every staff
   page, pinned with the guest form's copy to tests/slots.json. */
var SLOTS = SPA_SLOTS;
var slotLabel = spaSlotLabel;

function akey(s){ return String(s || '').slice(0, 10); }
function shortDay(key){
  var d = parseISO(key + 'T00:00:00'); if (!d) return key;
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + d.getDate();
}
/* The styleguide's one-line stay range: Tue 11-Fri 14. */
function stayRange(bk){
  if (!bk || !bk.arrive) return '';
  return shortDay(akey(bk.arrive)) + '-' + shortDay(akey(bk.depart));
}

/* ── state ───────────────────────────────────────────────────── */
var BOOKINGS = {};   /* id -> { id, first, last, arrive, depart, villaByDate, pre } */
var SPA = {};        /* id -> { tid -> record } */
var OPEN = null;     /* { id, tid } of the one card open, tid 'new' for an add */
var SEL = null;      /* { day, time } while a card is open */
var FILTER = 'all'; /* the pressed stat; All is the resting state */

function nameOf(id, rec){
  var bk = BOOKINGS[id];
  if (bk) return ((bk.first || '') + ' ' + (bk.last || '')).trim() || 'Guest';
  return (rec && rec.name) || 'Guest';
}
/* The small line under the name: the second guest, when anyone has named
   one. companionOf in nala-shared.js holds the one precedence rule. */
function withLine(id){
  var bk = BOOKINGS[id];
  var c = bk ? companionOf(bk.pre, bk) : '';
  return c ? 'With ' + c : '';
}
/* Written with textContent by every caller, never into an HTML string: the
   name is typed by a guest or at the desk. */
function setCmp(el, id){
  var cm = el.querySelector('.cmp'), w = withLine(id);
  if (w) cm.textContent = w; else cm.remove();
}
function villaOf(id, day){
  var bk = BOOKINGS[id];
  if (!bk) return '';
  return bk.villaByDate[day] || bk.villa || '';
}
/* Chip days: the guest's own stay, from today forward - the one guard the
   whole feature was asked to carry: a treatment cannot land outside the
   stay, because the day control never offers such a day. */
function stayDays(id){
  var bk = BOOKINGS[id], out = [];
  if (!bk || !bk.arrive || !bk.depart) return out;
  var a = parseISO(akey(bk.arrive) + 'T00:00:00'),
      z = parseISO(akey(bk.depart) + 'T00:00:00');
  if (!a || !z) return out;
  var floor = parseISO(dkey(new Date()) + 'T00:00:00');
  for (var d = new Date(a); d <= z && out.length < 30; d.setDate(d.getDate()+1))
    if (d >= floor) out.push(dkey(d));
  return out;
}

/* Which day a record belongs to on the board. A booked or suggested
   treatment sits on its own day; a request and a decline sit on the day the
   guest asked about, because that is when somebody will look for them. */
function dayOf(rec){
  if (rec.status === 'booked' || rec.status === 'suggested') return rec.day || '';
  return rec.reqDay || rec.day || '';
}
function asRequested(rec){
  return !rec.reqDay || rec.day === rec.reqDay;
}

function lineOf(rec, id){
  var bk = BOOKINGS[id];
  var stay = bk ? ' · staying ' + stayRange(bk) : '';
  var ask = (rec.reqDay ? shortDay(rec.reqDay) : 'no day picked') +
            (rec.reqTime ? ' · ' + rec.reqTime : ' · no time given');
  var len = spaDur(rec.dur) ? ' · ' + spaDur(rec.dur).short : '';
  if (rec.status === 'requested' || rec.virtual)
    return (rec.reqDay ? 'Asked for ' + ask
                       : 'Interested, no day picked' +
                         (rec.reqTime ? ' · ' + rec.reqTime : '')) + len + stay;
  if (rec.status === 'suggested')
    return 'Suggested ' + shortDay(rec.day) + ' ' + slotLabel(rec.time) + len +
           ' · asked for ' + ask;
  if (rec.status === 'booked')
    return shortDay(rec.day) + ' ' + slotLabel(rec.time) + len +
           (asRequested(rec) ? ' · as requested'
                             : ' · moved from ' + (rec.reqDay ? shortDay(rec.reqDay) : 'no day') +
                               (rec.reqTime ? ', ' + rec.reqTime : '')) +
           (rec.manual ? ' · approved at the desk' : '');
  if (rec.status === 'declined')
    return 'Declined' + (rec.note ? ' · ' + rec.note : '') +
           (rec.told ? ' · guest told' : ' · let the guest know');
  return '';
}

var BAND_CLASS = { suggested:' b-sugg', booked:' b-done', declined:' b-decl' };

/* ── items: every treatment, real or still only an ask ─────────
   A booking whose form says wellness yes, with no record born from that
   request yet, IS a request - the masseuse must see it before anything
   exists at /spa. It renders as a virtual record; answering it writes the
   real one, marked source prearrival so the ask stops showing as pending. */
function items(){
  var out = [];
  Object.keys(SPA).forEach(function(id){
    Object.keys(SPA[id]).forEach(function(tid){
      var r = SPA[id][tid];
      if (r && typeof r === 'object' && r.status)
        out.push({ id: id, tid: tid, rec: r });
    });
  });
  Object.keys(BOOKINGS).forEach(function(id){
    var p = BOOKINGS[id].pre;
    if (!p || p.wellness !== true) return;
    /* The form says how many; each unanswered one is its own white tile
       with its own length. Answering writes a prearrival-source record,
       and the count of those is how many of the asks are spoken for. */
    var want = p.wellQty === 2 ? 2 : 1;
    var have = Object.keys(SPA[id] || {}).filter(function(tid){
      return (SPA[id][tid] || {}).source === 'prearrival';
    }).length;
    for (var i = have; i < want; i++)
      out.push({ id: id, tid: 'ask' + i, rec: {
        virtual: true, status: 'requested',
        reqDay: p.wellDay || '', reqTime: p.wellTime || '',
        dur: i === 0 ? (spaDur(p.wellDur) ? p.wellDur : 0)
                     : (spaDur(p.wellDur2) ? p.wellDur2 : 0)
      } });
  });
  /* Which of the pair a tile is. Counted over what exists - real records
     and open asks together - so a desk-added second massage numbers the
     pair the same as a form ask, and a lone massage says nothing. */
  var perBk = {};
  out.forEach(function(it){ perBk[it.id] = (perBk[it.id] || 0) + 1; });
  var seen = {};
  out.forEach(function(it){
    if (perBk[it.id] < 2) return;
    seen[it.id] = (seen[it.id] || 0) + 1;
    it.pair = 'Massage ' + seen[it.id] + ' of ' + perBk[it.id];
  });
  return out;
}

/* ── rendering ───────────────────────────────────────────────── */
function tile(it){
  var rec = it.rec;
  var el = document.createElement('button');
  el.type = 'button';
  el.className = 'vrow' + (BAND_CLASS[rec.status] || '');
  el.dataset.booking = it.id;
  el.dataset.tid = it.tid;
  el.dataset.status = rec.status;
  el.innerHTML = '<div class="v"></div>' +
    '<div class="mid"><div class="nm"></div><div class="cmp"></div><div class="st"></div></div>';
  el.querySelector('.v').textContent = villaOf(it.id, dayOf(rec) || todayKey());
  el.querySelector('.nm').textContent = nameOf(it.id, rec);
  setCmp(el, it.id);
  el.querySelector('.st').textContent =
    (it.pair ? it.pair + ' · ' : '') + lineOf(rec, it.id);
  el.onclick = function(){
    OPEN = { id: it.id, tid: it.tid };
    SEL = null;
    paint();
  };
  return el;
}

function greyTile(id, line, addable){
  var el = document.createElement('button');
  el.type = 'button';
  el.className = 'vrow b-grey';
  el.dataset.booking = id;
  el.dataset.status = 'none';
  el.innerHTML = '<div class="v"></div>' +
    '<div class="mid"><div class="nm"></div><div class="cmp"></div><div class="st"></div></div>';
  el.querySelector('.v').textContent = villaOf(id, todayKey()) || villaOf(id, dkey(new Date()));
  el.querySelector('.nm').textContent = nameOf(id, null);
  setCmp(el, id);
  el.querySelector('.st').textContent = line;
  if (addable) el.onclick = function(){ OPEN = { id: id, tid: 'new' }; SEL = null; paint(); };
  else el.disabled = true;
  return el;
}

function band(parent, title, els){
  if (!els.length) return;
  var h = document.createElement('div');
  h.className = 'grp';
  h.textContent = title + ' · ' + els.length;
  parent.appendChild(h);
  els.forEach(function(e){ parent.appendChild(e); });
}

/* The open card. One selection, two owners: the masseuse books or suggests,
   the desk approves or asks again. The primary button always names the day
   and time it will write, so the tap and the record cannot disagree. */
function card(it){
  var rec = it.rec, id = it.id;
  var isNew = it.tid === 'new';
  var role = normaliseRole(window.NALA_ROLE);
  var masseuse = role === 'spa';
  var days = stayDays(id);
  if (!days.length && rec.day) days = [rec.day];
  /* The selection opens on what the guest asked for. reqTime was free text
     until 25 Aug and can still arrive as a wish ("afternoon"), so the parse
     may return null and mid-morning stands in - but a request that names a
     slot must never open on a different one: the first live test booked a
     2pm ask at the 10am default. */
  if (!SEL) SEL = {
    day: rec.day || (rec.reqDay && days.indexOf(rec.reqDay) > -1 ? rec.reqDay : days[0] || ''),
    time: rec.time || spaSlotFromText(rec.reqTime) || '10:00',
    dur: spaDur(rec.dur) ? rec.dur : 60
  };

  var el = document.createElement('div');
  el.className = 'card' + (BAND_CLASS[rec.status] || '');
  el.dataset.booking = id;
  el.dataset.tid = it.tid;
  var head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = '<div class="v"></div>' +
    '<div class="mid"><div class="nm"></div><div class="cmp"></div><div class="st"></div></div>';
  head.querySelector('.v').textContent = villaOf(id, SEL.day || todayKey());
  head.querySelector('.nm').textContent = nameOf(id, rec);
  setCmp(head, id);
  head.querySelector('.st').textContent = isNew
    ? 'A new treatment · staying ' + stayRange(BOOKINGS[id])
    : (it.pair ? it.pair + ' · ' : '') + lineOf(rec, id);
  head.onclick = function(){ OPEN = null; SEL = null; paint(); };
  el.appendChild(head);

  var subD = document.createElement('div'); subD.className = 'sub';
  subD.textContent = 'Day'; el.appendChild(subD);
  var chips = document.createElement('div'); chips.className = 'chips';
  days.forEach(function(dk2){
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip' + (SEL.day === dk2 ? ' on' : '');
    c.textContent = shortDay(dk2);
    c.onclick = function(){ SEL.day = dk2; paint(); };
    chips.appendChild(c);
  });
  if (!days.length){
    var noDays = document.createElement('div');
    noDays.className = 'hint';
    noDays.textContent = 'No nights of this stay are still to come.';
    chips.appendChild(noDays);
  }
  el.appendChild(chips);

  var subT = document.createElement('div'); subT.className = 'sub';
  subT.textContent = 'Time'; el.appendChild(subT);
  var sel = document.createElement('select');
  sel.setAttribute('aria-label', 'Time');
  SLOTS.forEach(function(t){
    var o = document.createElement('option');
    o.value = t; o.textContent = slotLabel(t);
    if (t === SEL.time) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = function(){ SEL.time = sel.value; paint(); };
  el.appendChild(sel);

  var subL = document.createElement('div'); subL.className = 'sub';
  subL.textContent = 'Length'; el.appendChild(subL);
  var lens = document.createElement('div'); lens.className = 'chips';
  SPA_DURS.forEach(function(x){
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip' + (SEL.dur === x.m ? ' on' : '');
    c.textContent = x.label;
    c.onclick = function(){ SEL.dur = x.m; paint(); };
    lens.appendChild(c);
  });
  el.appendChild(lens);

  var btns = document.createElement('div'); btns.className = 'btns';
  var when = shortDay(SEL.day) + ' ' + slotLabel(SEL.time);
  var matchesAsk = !!rec.reqDay && SEL.day === rec.reqDay;
  var changed = SEL.day !== rec.day || SEL.time !== rec.time;
  var hint = '';

  function btn(label, cls, fn){
    var x = document.createElement('button');
    x.type = 'button'; x.className = 'cbtn ' + cls; x.textContent = label;
    x.onclick = fn; btns.appendChild(x); return x;
  }
  function saveAs(status, extra){
    return function(){ save(it, status, extra || {}); };
  }
  /* A decline travels with its why: the guest's first question at the desk
     is the reason, and a no with no reason sends the desk back to the
     masseuse's phone - the loop this page exists to end. A browser prompt
     rather than a drawn field, the phonefix pattern: it is rare and it is
     one line. Cancel on the prompt aborts the decline, which also guards a
     mis-tap; an empty answer declines with no note. */
  function declineWith(it2){
    return function(){
      var why = window.prompt('Nothing free - any reason to pass on? ' +
                              'The guest will ask. Optional.', '');
      if (why === null) return;
      save(it2, 'declined', { note: why.trim() });
    };
  }

  if (!days.length){
    /* Nothing can be picked; only a decline still makes sense. */
    if (!isNew) btn('Decline', 'quiet', declineWith(it));
  } else if (masseuse){
    if (isNew){
      /* The masseuse adding one was asked in person and knows his own
         book, so it goes straight to booked, as requested. */
      btn('Book ' + when, 'solid', saveAs('booked', { req: true }));
    } else if (rec.status === 'booked'){
      if (changed) btn('Suggest ' + when, 'solid', saveAs('suggested'));
      btn(changed ? 'Cancel' : 'Cancel booking', changed ? 'quiet' : 'solid',
          saveAs('declined'));
      if (changed) hint = 'A change to a booked treatment goes back through ' +
        'the front desk, so the guest hears before it moves.';
    } else {
      if (matchesAsk) btn('Confirm ' + when, 'solid', saveAs('booked'));
      btn('Suggest ' + when, matchesAsk ? 'quiet' : 'solid', saveAs('suggested'));
      btn('Decline', 'quiet', declineWith(it));
      hint = matchesAsk
        ? 'Confirm books it. Suggest offers this time as a change instead, ' +
          'amber until the front desk approves it with the guest. Decline ' +
          'is for a stay with nothing free.'
        : 'A different day goes to the guest as a suggestion - amber until ' +
          'the front desk approves it.';
    }
  } else {
    if (isNew){
      btn('Ask the masseuse', 'solid', saveAs('requested', { req: true }));
      hint = 'The ask lands in the masseuse’s To answer list, ' +
             'the same as a request from the form.';
    } else if (rec.status === 'suggested'){
      if (rec.day === SEL.day && rec.time === SEL.time){
        btn('Approve ' + when, 'solid', saveAs('booked'));
        btn('Decline', 'quiet', declineWith(it));
        hint = 'Approve once the guest has said yes - the booking turns ' +
               'green for everyone. The guest’s original ask stays on ' +
               'the record.';
      } else {
        btn('Ask again for ' + when, 'solid', saveAs('requested', { req: true }));
        btn('Decline', 'quiet', declineWith(it));
        hint = 'A different day or time goes back to the masseuse as a ' +
               'fresh ask.';
      }
    } else if (rec.status === 'declined'){
      /* The decline's other half: the desk telling the guest IS the action
         the terracotta tile and the menu icon are chasing, so it gets a
         tap of its own. Told, the tile stops instructing and the icon
         stops counting it - the same self-clearing as every queue. */
      if (!rec.told)
        btn('Guest told', 'solid', saveAs('declined', { told: true }));
      btn('Ask again for ' + when, rec.told ? 'solid' : 'quiet',
          saveAs('requested', { req: true }));
    } else if (rec.status === 'booked'){
      if (changed) btn('Ask again for ' + when, 'solid', saveAs('requested', { req: true }));
      btn(changed ? 'Cancel' : 'Cancel booking', changed ? 'quiet' : 'solid',
          saveAs('declined'));
    } else {
      /* requested: normally the masseuse's to answer - but a verbal yes is
         an answer too. Manually approve books the selection directly,
         stamped as the desk's doing, for the time he agreed in person or
         on the phone and was never going to tap himself. The ask path
         stays for everything he has not agreed to. */
      btn('Manually approve ' + when, 'solid',
          saveAs('booked', { manual: true }));
      if (changed || rec.virtual)
        btn('Ask for ' + when, 'quiet', saveAs('requested', { req: true }));
      hint = 'Manually approve is only for a time the masseuse has already ' +
             'agreed to out loud - it books without his tap and the tile ' +
             'says the desk did it. Anything else waits on him.';
    }
  }
  el.appendChild(btns);
  if (hint){
    var h = document.createElement('div');
    h.className = 'hint'; h.textContent = hint;
    el.appendChild(h);
  }
  return el;
}

/* One write, the whole record. PUT rather than PATCH so a record can never
   hold two generations at once: the fields of the state it left do not
   linger under the state it entered. */
function save(it, status, opts){
  var rec = it.rec, id = it.id;
  var tid = (it.tid.indexOf('ask') === 0 || it.tid === 'new')
    ? 't' + Date.now() : it.tid;
  var body = {
    status: status,
    name: nameOf(id, rec),
    source: rec.virtual ? 'prearrival'
          : rec.source || (normaliseRole(window.NALA_ROLE) === 'spa' ? 'spa' : 'desk'),
    by: (window.NALA_USER && (NALA_USER.email || '')) || '',
    at: new Date().toISOString()
  };
  /* The ask travels with the record whatever happens to it, so "moved from"
     and "asked for" never need the form re-read. A desk re-ask replaces it:
     that IS the new ask. */
  if (opts.req){ body.reqDay = SEL.day; body.reqTime = slotLabel(SEL.time); }
  else { body.reqDay = rec.reqDay || ''; if (rec.reqTime) body.reqTime = rec.reqTime; }
  if (status === 'booked' || status === 'suggested'){
    body.day = SEL.day; body.time = SEL.time;
  }
  var why = (opts.note !== undefined) ? opts.note : rec.note;
  if (status === 'declined' && why) body.note = why;
  if (SEL && spaDur(SEL.dur)) body.dur = SEL.dur;
  else if (spaDur(rec.dur)) body.dur = rec.dur;
  if (status === 'booked' && (opts.manual || rec.manual))
    body.manual = rec.manual || new Date().toISOString();
  if (status === 'declined' && (opts.told || rec.told))
    body.told = rec.told || new Date().toISOString();
  var err = document.getElementById('errBar');
  err.textContent = '';
  fetch(DB + '/spa/' + id + '/' + tid + '.json', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){
    if (!r.ok) throw new Error();
    OPEN = null; SEL = null;
    return load();
  }).catch(function(){
    err.textContent = 'The treatment did not save. Try again.';
  });
}

function paint(){
  var list = items();
  var day = todayKey(), real = dkey(new Date());

  /* The masseuse's whole queue, not the viewed day's slice: the number is
     "what is waiting on me", wherever it sits in the calendar. All counts
     every live tile its band shows, grey add-tiles aside. */
  document.getElementById('nAll').textContent =
    list.filter(function(it){
      var st = it.rec.status, d0 = dayOf(it.rec);
      if (st === 'requested' || st === 'suggested') return true;
      return !d0 || d0 >= real;
    }).length;
  document.getElementById('nAsk').textContent =
    list.filter(function(it){ return it.rec.status === 'requested'; }).length;
  document.getElementById('nSugg').textContent =
    list.filter(function(it){ return it.rec.status === 'suggested'; }).length;
  document.getElementById('nDay').textContent =
    list.filter(function(it){ return it.rec.status === 'booked' && dayOf(it.rec) === day; }).length;
  document.getElementById('nDay').nextElementSibling.textContent =
    isToday() ? 'Booked today' : 'Booked this day';

  /* The one open card draws once, whichever band reaches its item first:
     two live copies of one form is a bug waiting for a tap. */
  var cardDrawn = false;
  function el(it){
    if (OPEN && OPEN.id === it.id && OPEN.tid === it.tid && !cardDrawn){
      cardDrawn = true;
      return card(it);
    }
    return tile(it);
  }

  /* Four filters, one board. All is the resting state and holds the whole
     horizon in bands - every open ask wherever it sits, every suggestion,
     everything booked from today on, recent declines, and (for the desk
     alone) every stay with no treatment yet, tappable to add one. The other
     three stats narrow to their own queue: horizon-wide for To answer and
     Suggested, the viewed day for Booked, matching the labels they sit
     under. Tapping the pressed one returns to All. */
  var statBtns = document.querySelectorAll('#statsRow .stat');
  for (var sb = 0; sb < statBtns.length; sb++)
    statBtns[sb].className = 'stat' +
      (FILTER === statBtns[sb].getAttribute('data-f') ? ' on' : '');

  var of = function(st, keep){ return list.filter(function(it){
    return it.rec.status === st && (!keep || keep(it)); }); };
  var upcoming = function(it){ var d0 = dayOf(it.rec); return !d0 || d0 >= real; };
  var byDay = function(a, b){
    return ((dayOf(a.rec) || '9999') + (a.rec.time || ''))
      .localeCompare((dayOf(b.rec) || '9999') + (b.rec.time || ''));
  };

  var board = document.getElementById('board');
  board.innerHTML = '';
  if (FILTER === 'all'){
    band(board, 'To answer', of('requested').sort(byDay).map(el));
    band(board, 'Suggested · waiting on the guest', of('suggested').sort(byDay).map(el));
    band(board, 'Booked', of('booked', upcoming).sort(byDay).map(el));
    band(board, 'Declined', of('declined', upcoming).sort(byDay).map(el));
    /* The masseuse sees the guests who want him and nobody else: a stay
       with no request is none of an outside contractor's business, the
       owner ruled, 25 Aug. The desk keeps the band, because the desk is
       who adds a treatment when a guest asks in person. */
    if (normaliseRole(window.NALA_ROLE) !== 'spa'){
      var covered = {};
      list.forEach(function(it){ covered[it.id] = true; });
      var none = Object.keys(BOOKINGS).filter(function(id){ return !covered[id]; })
        .sort(function(a, b){
          return akey(BOOKINGS[a].arrive).localeCompare(akey(BOOKINGS[b].arrive));
        }).map(function(id){
          /* An add in progress: the grey tile has no record behind it, so
             the open card is built from nothing but the booking. */
          if (OPEN && OPEN.id === id && OPEN.tid === 'new' && !cardDrawn){
            cardDrawn = true;
            return card({ id: id, tid: 'new',
                          rec: { status: '', reqDay: '', reqTime: '' } });
          }
          var bk = BOOKINGS[id], p = bk.pre;
          var here = akey(bk.arrive) <= real;
          var line = (here ? 'In villa until ' + shortDay(akey(bk.depart))
                           : 'Arrives ' + shortDay(akey(bk.arrive)) +
                             ', until ' + shortDay(akey(bk.depart)));
          if (p && p.wellness === false)
            line = 'Said no thank you on the form · ' + line.charAt(0).toLowerCase() + line.slice(1);
          else line += ' · tap to add one';
          return greyTile(id, line, true);
        });
      band(board, 'No treatment · staying or arriving', none);
    }
    if (!board.children.length){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Nothing on the books in the next ' + HORIZON +
        ' days. Requests from the pre-arrival form appear here on their own.';
      board.appendChild(e);
    }
  } else {
    var matches = list.filter(function(it){
      if (it.rec.status !== FILTER) return false;
      return FILTER === 'booked' ? dayOf(it.rec) === day : true;
    }).sort(byDay);
    var title = FILTER === 'requested' ? 'Every open ask'
              : FILTER === 'suggested' ? 'Suggested · waiting on the guest'
              : 'Booked · ' + (isToday() ? 'today' : 'this day');
    band(board, title, matches.map(el));
    if (!matches.length){
      var e0 = document.createElement('div');
      e0.className = 'empty';
      e0.textContent = 'Nothing in this queue. Tap All for everything.';
      board.appendChild(e0);
    }
  }
}

document.getElementById('statsRow').onclick = function(e){
  var b = e.target.closest('button.stat'); if (!b) return;
  var f = b.getAttribute('data-f');
  FILTER = (FILTER === f) ? 'all' : f;
  paint();
};

/* ── loading ─────────────────────────────────────────────────── */
/* /stays day by day, the same read every board makes, then the two records
   this page lives on: the whole /spa node in one ask - a small resort's
   treatments fit in one response - and each booking's own prearrival for
   the wellness answer. Everything else about a guest stays unread here,
   and the rules hold the masseuse's login to that. */
function load(){
  var real = dkey(new Date());
  var days = [], seen = {};
  for (var i = 0; i < HORIZON; i++){
    var d = new Date(); d.setDate(d.getDate() + i);
    days.push(dkey(d));
  }
  if (days.indexOf(todayKey()) < 0) days.push(todayKey());
  return Promise.all([
    Promise.all(days.map(function(dk2){
      return fetch(DB + '/stays/' + dk2 + '.json?v=' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
        .then(function(day){ return { d: dk2, day: day || {} }; });
    })),
    fetch(DB + '/spa.json?v=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })
  ]).then(function(res){
    BOOKINGS = {};
    res[0].forEach(function(x){
      Object.keys(x.day).forEach(function(v){
        var s = x.day[v];
        if (!s || typeof s !== 'object' || !s.id) return;
        var bk = BOOKINGS[s.id];
        if (!bk){
          bk = BOOKINGS[s.id] = { id: s.id, first: s.first || '', last: s.last || '',
                                  companion: s.companion || '',
                                  arrive: s.arrive, depart: s.depart,
                                  villaByDate: {}, pre: null };
        }
        /* Nights synced before the Worker carried the companion lack it;
           any later night that has it fills the gap. */
        if (!bk.companion && s.companion) bk.companion = s.companion;
        bk.villaByDate[x.d] = v;
        if (!bk.villa) bk.villa = v;
      });
    });
    SPA = {};
    var spa = res[1] || {};
    Object.keys(spa).forEach(function(id){
      if (spa[id] && typeof spa[id] === 'object') SPA[id] = spa[id];
    });
    return Promise.all(Object.keys(BOOKINGS).map(function(id){
      return fetch(DB + '/bookings/' + id + '/prearrival.json?v=' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
        .then(function(p){ BOOKINGS[id].pre = p; });
    }));
  }).then(paint);
}

function showAccess(allowed, e){
  var box = document.getElementById('noAccess');
  var on = !allowed;
  box.innerHTML = !on ? '' :
    (e ? '<div>Could not check access. This is usually the connection, '
       + 'not your login.</div>'
       + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
       : 'This login has no access to the Spa board. See the manager.');
  if (on && !e){
    var home = homeFor(window.NALA_ROLE);
    if (home && home !== location.pathname.split('/').pop()){
      location.replace(home); return;
    }
  }
  box.className = 'noaccess' + (on ? ' show' : '');
  ['statsRow','board'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.style.display = on ? 'none' : '';
  });
  if (!on) load();
}

window.NALA_ROLE = null;
(function gate(){
  if (!window.firebase || !firebase.auth || typeof loadStaff !== 'function')
    return setTimeout(gate, 40);
  var A; try { A = firebase.auth(); } catch(e){ return setTimeout(gate, 40); }
  if (!A || !A.onAuthStateChanged) return setTimeout(gate, 40);
  A.onAuthStateChanged(function(u){
    if (!u) return;                 /* auth.js owns the signed-out state */
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role;
      window.NALA_USER = u;
      document.getElementById('navWrap').style.display = 'block';
      navFilter(role);
      showAccess(can(role, 'spaBoard'), e);
    });
  });
})();
