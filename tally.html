<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nala — Tonight's Numbers</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA; --red:#A8321E; }
  body { background:var(--cream); color:var(--ink); font-family:Georgia,serif;
         padding:28px 24px 80px; -webkit-tap-highlight-color:transparent; }
  .wrap { max-width:520px; margin:0 auto; }

  .wordmark { font-family:Helvetica,Arial,sans-serif; font-size:9px; letter-spacing:.45em;
              text-transform:uppercase; color:var(--mid); text-align:center; }
  .date { text-align:center; font-family:Helvetica,Arial,sans-serif; font-size:13px; font-weight:bold;
          letter-spacing:.1em; text-transform:uppercase; margin-top:6px; }

  .totals { display:flex; gap:8px; margin:22px 0 26px; }
  .tot { flex:1; text-align:center; padding:14px 4px; border:1px solid var(--rule); }
  .tot-n { font-size:28px; line-height:1; }
  .tot-l { font-family:Helvetica,Arial,sans-serif; font-size:7px; letter-spacing:.2em;
           text-transform:uppercase; color:var(--mid); margin-top:7px; }
  .tot.warn { border-color:var(--red); }
  .tot.warn .tot-n { color:var(--red); }

  .sec { font-family:Helvetica,Arial,sans-serif; font-size:8px; letter-spacing:.3em;
         text-transform:uppercase; color:var(--mid); margin:26px 0 12px;
         display:flex; justify-content:space-between; align-items:baseline; }
  .sec a { color:var(--mid); text-decoration:none; border-bottom:1px solid var(--rule);
           font-size:8px; letter-spacing:.15em; }

  /* room grid */
  .rooms { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .room {
    aspect-ratio:1; border:1px solid var(--rule); background:transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:Helvetica,Arial,sans-serif; cursor:pointer; padding:0;
  }
  .room-n { font-size:13px; color:var(--ink); }
  .room-p { font-size:8px; color:var(--mid); margin-top:2px; min-height:10px; }
  .room { position:relative; }
  .room.in     { background:rgba(122,160,130,.26); border-color:rgba(122,160,130,.65); }
  .room.in .room-n { color:var(--ink); }
  .room.in .room-p { color:#5E7D67; }
  .room.out    { background:rgba(184,106,90,.16); border-color:rgba(184,106,90,.45); }
  .room.out .room-n { color:var(--ink); opacity:.6; text-decoration:line-through; }
  .room.vacant { border-style:solid; border-color:rgba(87,87,94,.28);
                 background:rgba(87,87,94,.10); }
  .room.vacant .room-n { color:var(--mid); }
  .room.await  { border-style:dashed; border-color:var(--mid); }

  /* source icon */
  .mark { position:absolute; top:4px; right:4px; width:10px; height:10px; opacity:.75; }
  .mark svg { width:100%; height:100%; display:block; }
  .room.in  .mark svg { fill:#5E7D67; stroke:#5E7D67; }
  .room.out .mark svg { fill:#9E6455; stroke:#9E6455; }

  .legend { display:flex; gap:14px; justify-content:center; margin-top:12px;
            font-family:Helvetica,Arial,sans-serif; font-size:8px;
            letter-spacing:.12em; text-transform:uppercase; color:var(--mid); }
  .legend span { display:flex; align-items:center; gap:5px; }
  .sw { width:9px; height:9px; border:1px solid var(--rule); display:inline-block; }
  .sw.in { background:rgba(122,160,130,.26); border-color:rgba(122,160,130,.65); }
  .sw.out { background:rgba(184,106,90,.16); border-color:rgba(184,106,90,.45); }
  .sw.await { border-style:dashed; border-color:var(--mid); }
  .sw.vacant { border-color:rgba(87,87,94,.28); background:rgba(87,87,94,.10); }
  .legend2 { margin-top:7px; }
  .ico { width:11px; height:11px; display:inline-block; }
  .ico svg { width:100%; height:100%; display:block; fill:var(--mid); stroke:var(--mid); }

  /* rows */
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
         padding:9px 0; border-bottom:1px solid var(--rule); }
  .row-name { font-size:14px; }
  .row-name .rm { font-family:Helvetica,Arial,sans-serif; font-size:11px;
                  letter-spacing:.08em; color:var(--mid); margin-right:2px; }
  .row-name .tag { font-family:Helvetica,Arial,sans-serif; font-size:8px;
                   letter-spacing:.18em; text-transform:uppercase; color:var(--mid);
                   border:1px solid var(--rule); padding:2px 6px; margin-left:8px;
                   border-radius:10px; vertical-align:middle; }
  .row-sub { font-style:italic; font-size:11px; color:var(--mid); }
  .row-pax { font-family:Helvetica,Arial,sans-serif; font-size:12px; white-space:nowrap; }
  .row.tappable { cursor:pointer; }
  .row-right { display:flex; align-items:center; gap:10px; white-space:nowrap; }
  .edit { width:13px; height:13px; opacity:.4; display:block; }
  .edit svg { width:100%; height:100%; display:block; fill:var(--mid); }
  .alrg { color:var(--red); font-style:normal; }
  .empty { font-style:italic; color:var(--mid); font-size:12px; padding:8px 0; }

  .actions { margin-top:34px; display:flex; gap:10px; }
  .btn { flex:1; text-align:center; padding:13px; border:1px solid var(--ink);
         font-family:Helvetica,Arial,sans-serif; font-size:10px; letter-spacing:.15em;
         text-transform:uppercase; color:var(--ink); text-decoration:none;
         background:transparent; cursor:pointer; }
  .btn.solid { background:var(--ink); color:var(--cream); }

  /* sheet */
  .backdrop { position:fixed; inset:0; background:rgba(28,28,26,.35);
              display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .backdrop.show { display:flex; }
  .sheet { width:100%; max-width:520px; background:var(--cream);
           padding:26px 24px 34px; border-top:1px solid var(--rule);
           max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sheet h3 { font-family:Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:.2em;
              text-transform:uppercase; color:var(--mid); font-weight:normal;
              text-align:center; margin-bottom:18px; }
  .opt { width:100%; padding:15px; margin-bottom:8px; border:1px solid transparent;
         font-family:Helvetica,Arial,sans-serif; font-size:12px;
         letter-spacing:.12em; text-transform:uppercase; color:#fff; cursor:pointer; }
  /* matches the room tile palette */
  .opt.solid { background:#5E7D67; border-color:#5E7D67; }   /* dining  — green */
  .opt.out   { background:#9E6455; border-color:#9E6455; }   /* not dining — red */
  .opt.vac   { background:#57575E; border-color:#57575E; }   /* vacant — slate */
  .opt.quiet { background:transparent; border-color:var(--rule); color:var(--mid); }
  .pax-row { display:flex; gap:6px; justify-content:center; margin:4px 0 16px; }
  .pax { width:38px; height:38px; border:1px solid var(--rule); background:transparent;
         border-radius:50%; font-family:Helvetica,Arial,sans-serif; font-size:13px;
         color:var(--ink); cursor:pointer; }
  .pax.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:4px; }
  .chip { padding:7px 12px; border:1px solid var(--rule); background:transparent;
          border-radius:20px; font-family:Helvetica,Arial,sans-serif; font-size:10px;
          color:var(--mid); cursor:pointer; }
  .chip.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }

  .note-box { font-style:italic; font-size:13px; color:var(--mid); text-align:center;
              line-height:1.6; padding:0 4px 16px; }
  .sheet-label { font-family:Helvetica,Arial,sans-serif; font-size:8px; letter-spacing:.25em;
                 text-transform:uppercase; color:var(--mid); text-align:center; margin-bottom:8px; }
  .txt { width:100%; padding:12px; margin-bottom:8px; border:1px solid var(--rule);
         background:transparent; font-family:Georgia,serif; font-size:16px; color:var(--ink); }
  .txt::placeholder { color:var(--mid); font-style:italic; }
  .txt:focus { outline:none; border-color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">Nala</div>
  <div class="date" id="date"></div>

  <div class="totals">
    <div class="tot"><div class="tot-n" id="nCovers">–</div><div class="tot-l">Covers</div></div>
    <div class="tot"><div class="tot-n" id="nOut">–</div><div class="tot-l">Rooms out</div></div>
    <div class="tot" id="tileAwait"><div class="tot-n" id="nAwait">–</div><div class="tot-l">Rooms awaiting</div></div>
  </div>

  <div class="sec">Rooms</div>
  <div class="rooms" id="rooms"></div>
  <div class="legend">
    <span><i class="sw in"></i>Dining</span>
    <span><i class="sw out"></i>Not dining</span>
    <span><i class="sw await"></i>Awaiting</span>
    <span><i class="sw vacant"></i>Vacant</span>
  </div>
  <div class="legend legend2">
    <span><i class="ico" id="legGuest"></i>Guest replied</span>
    <span><i class="ico" id="legStaff"></i>Added by staff</span>
  </div>

  <div class="sec">
    <span>Bookings</span>
    <a href="#" id="addExt">+ Add external</a>
  </div>
  <div id="listBookings"></div>

  <div class="actions">
    <a class="btn solid" href="list.html">Print list</a>
    <button class="btn" onclick="location.reload()">Refresh</button>
  </div>
</div>

<div class="backdrop" id="backdrop">
  <div class="sheet" id="sheet"></div>
</div>

<script>
var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
var ROOMS = 17;
var ALLERGENS = ['Nut allergy','Shellfish allergy','Egg allergy'];
var DIETARIES = ['Gluten free','Dairy free','Vegetarian','Vegan','Pescatarian',
                 'Nut allergy','Shellfish allergy','Egg allergy'];

function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function label(){var d=new Date();
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var m=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return days[d.getDay()]+' '+d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear();}
document.getElementById('date').textContent = label();


var ICON_GUEST = '<svg viewBox="0 0 24 24" stroke-width="0"><circle cx="12" cy="7.5" r="4"/>'+
                 '<path d="M12 13.5c-4.2 0-7.5 2.9-7.5 6.5h15c0-3.6-3.3-6.5-7.5-6.5z"/></svg>';
var ICON_EDIT = '<svg viewBox="0 0 24 24"><path d="M3 17.2V21h3.8L17.9 9.9l-3.8-3.8L3 17.2z"/>'+
                '<path d="M20.7 7.1c.4-.4.4-1 0-1.4l-2.4-2.4c-.4-.4-1-.4-1.4 0l-1.8 1.8 3.8 3.8 1.8-1.8z"/></svg>';
var ICON_GUEST_X = '<svg viewBox="0 0 24 24" stroke-width="0"><circle cx="12" cy="7.5" r="4"/>'+
                   '<path d="M12 13.5c-4.2 0-7.5 2.9-7.5 6.5h15c0-3.6-3.3-6.5-7.5-6.5z"/>'+
                   '<line x1="2" y1="22" x2="22" y2="2" stroke-width="2.6" stroke-linecap="round"/></svg>';
var ICON_STAFF = '<svg viewBox="0 0 24 24" stroke-width="0"><path d="M4 21V4.5C4 3.7 4.7 3 5.5 3h9c.8 0 1.5.7 1.5 1.5V21H4z"/>'+
                 '<path d="M17.5 21V9h2C20.3 9 21 9.7 21 10.5V21h-3.5z"/>'+
                 '<rect x="6.5" y="6" width="2.6" height="2.6" fill="#F9F7F4"/>'+
                 '<rect x="10.9" y="6" width="2.6" height="2.6" fill="#F9F7F4"/>'+
                 '<rect x="6.5" y="10.6" width="2.6" height="2.6" fill="#F9F7F4"/>'+
                 '<rect x="10.9" y="10.6" width="2.6" height="2.6" fill="#F9F7F4"/>'+
                 '<rect x="8.7" y="15.6" width="2.6" height="5.4" fill="#F9F7F4"/></svg>';

var responses = {};   // keyed by phone (digital) or manual key
var cancelledExt = {};
var manual = {};      // keyed by 'room-N' or 'ext-<id>'

function api(path, method, body){
  var o = { method: method||'GET' };
  if (body !== undefined) { o.headers={'Content-Type':'application/json'}; o.body=JSON.stringify(body); }
  return fetch(DB+path+'.json'+(method?'':'?v='+Date.now()), o).then(function(r){return r.json();});
}

// ── build a unified view keyed by room ─────────────────────
function roomState(n){
  var mk = 'room-'+n;
  var m  = manual[mk];

  // latest digital response for this room
  var best = null;
  for (var k in responses){
    var g = responses[k];
    if (String(g.room) !== String(n)) continue;
    if (!best || (g.at || '') > (best.g.at || '')) best = { src:'digital', key:k, g:g };
  }

  // a staff override always wins over the guest's own answer
  if (m && m.override) {
    return { src:'manual', key:mk, g:m, override:true, guest: best ? best.g : null };
  }
  if (best) return best;
  if (m) return { src:'manual', key:mk, g:m };
  return null;
}

function dietHTML(diets){
  if(!diets||!diets.length) return '';
  return diets.map(function(d){
    return ALLERGENS.indexOf(d)>-1 ? '<span class="alrg">'+d+'</span>' : d;
  }).join(' · ');
}

function render(){
  var covers=0, notDining=0, awaiting=0;

  // rooms
  var grid = document.getElementById('rooms');
  grid.innerHTML='';
  for (var n=1; n<=ROOMS; n++){
    (function(n){
      var st = roomState(n);
      var cls = 'room await', pax='';
      if (st){
        if (st.g.status==='in'){ cls='room in'; pax=(st.g.pax||1)+'p'; }
        else if (st.g.status==='out'){ cls='room out'; }
        else if (st.g.status==='vacant'){ cls='room vacant'; }
      } else awaiting++;

      var mark = '';
      if (st && (st.g.status==='in' || st.g.status==='out')) {
        var ic;
        if (st.override && st.guest) ic = ICON_GUEST_X;      // guest replied, staff cancelled
        else if (st.src === 'digital') ic = ICON_GUEST;
        else ic = ICON_STAFF;
        mark = '<span class="mark">'+ic+'</span>';
      }
      var b=document.createElement('button');
      b.className=cls;
      b.innerHTML=mark+'<span class="room-n">'+n+'</span><span class="room-p">'+pax+'</span>';
      b.onclick=function(){ openRoom(n, st); };
      grid.appendChild(b);
    })(n);
  }

  // one combined bookings list
  var rows = [];

  for (var n2=1; n2<=ROOMS; n2++){
    var s = roomState(n2);
    if (s && s.g.status==='in') rows.push({ g:s.g, room:n2, src:s.src, key:s.key });
  }

  for (var k in responses){
    var g = responses[k];
    if (!g.room && g.status==='in' && !cancelledExt[k] && !manual['extcancel-'+k])
      rows.push({ g:g, room:null, src:'digital', key:k });
  }
  for (var k in manual){
    if (k.indexOf('ext-')!==0) continue;
    if (manual[k].status!=='in') continue;
    rows.push({ g:manual[k], room:null, src:'manual', key:k });
  }

  rows.forEach(function(r){ covers += (r.g.pax||1); });

  // declines — counted as rooms, matching the Awaiting tile
  for (var n2=1; n2<=ROOMS; n2++){
    var s = roomState(n2);
    if (s && s.g.status==='out') notDining++;
  }

  var el = document.getElementById('listBookings');
  el.innerHTML='';
  if(!rows.length) el.innerHTML='<div class="empty">No bookings yet</div>';

  rows.forEach(function(r){
    var g = r.g;
    var title;
    if (r.room) {
      title = '<span class="rm">Room '+r.room+'</span>' + (g.name ? '  '+g.name : '');
    } else {
      title = (g.name || g.phone || 'Guest') + '<span class="tag">External</span>';
    }

    var sub = [];
    var d = dietHTML(g.diets); if(d) sub.push(d);
    if (g.note) sub.push('“'+g.note+'”');
    if (g.phone) sub.push(g.phone);

    var row = document.createElement('div');
    row.className = 'row tappable';
    row.innerHTML =
      '<div><div class="row-name">'+title+'</div>'+
      (sub.length ? '<div class="row-sub">'+sub.join(' · ')+'</div>' : '')+
      '</div>'+
      '<div class="row-right"><span class="row-pax">'+(g.pax||1)+' pax</span>'+
      '<span class="edit">'+ICON_EDIT+'</span></div>';
    row.onclick = (function(rr){
      return function(){
        if (rr.room) openRoom(rr.room, roomState(rr.room));
        else editExt(rr.key, rr.g);
      };
    })(r);
    el.appendChild(row);
  });

  document.getElementById('nCovers').textContent = covers;
  document.getElementById('nOut').textContent    = notDining;
  document.getElementById('nAwait').textContent  = awaiting;
  document.getElementById('tileAwait').className = 'tot' + (awaiting>0 ? ' warn':'');
}

// ── sheet ──────────────────────────────────────────────────
var bd = document.getElementById('backdrop');
var sheet = document.getElementById('sheet');
bd.onclick = function(e){ if(e.target===bd) close(); };
function close(){ bd.className='backdrop'; }

// replaces the whole sheet with a single question, so nothing else is on screen
function confirmSheet(title, question, confirmLabel, onConfirm, onBack){
  sheet.innerHTML =
    '<h3>'+title+'</h3>'+
    '<div class="note-box">'+question+'</div>'+
    '<button class="opt out" id="cYes">'+confirmLabel+'</button>'+
    '<button class="opt quiet" id="cNo">Back</button>';
  bd.className='backdrop show';
  revealAction();
  document.getElementById('cYes').onclick = onConfirm;
  document.getElementById('cNo').onclick  = onBack;
}

function revealAction(){
  requestAnimationFrame(function(){
    var target = sheet.querySelector('.opt.solid') || sheet.querySelector('.opt');
    if (target && target.scrollIntoView) {
      target.scrollIntoView({ block:'nearest', behavior:'smooth' });
    }
  });
}

function openRoom(n, st){
  var pax = (st && st.g.pax) || 2;
  var guestAnswer = st && (st.src==='digital' ? st.g : st.guest);
  var isOverride  = st && st.override;

  function shell(inner){
    sheet.innerHTML = '<h3>Room '+n+'</h3>' + inner;
    bd.className='backdrop show';
    revealAction();
  }

  function paxBlock(){
    return '<div class="sheet-label">Guests</div><div class="pax-row" id="paxRow"></div>';
  }
  function paintPax(){
    var r=document.getElementById('paxRow'); if(!r) return;
    r.innerHTML='';
    for(var i=1;i<=6;i++)(function(v){
      var b=document.createElement('button');
      b.className='pax'+(pax===v?' on':''); b.textContent=v;
      b.onclick=function(){ pax=v; paintPax(); };
      r.appendChild(b);
    })(i);
  }

  function writeManual(rec){
    manual['room-'+n] = rec;
    api('/manual/'+todayKey()+'/room-'+n, 'PUT', rec);
    close(); render();
  }
  function clearManual(){
    delete manual['room-'+n];
    api('/manual/'+todayKey()+'/room-'+n, 'DELETE');
    close(); render();
  }

  // ── staff has cancelled a guest's booking ───────────────
  if (isOverride && guestAnswer) {
    shell(
      '<div class="note-box">Cancelled by staff.<br>'+
      'The guest had confirmed '+(guestAnswer.pax||1)+
      (guestAnswer.pax===1?' guest':' guests')+
      (guestAnswer.name ? ' \u2014 '+guestAnswer.name : '')+'.</div>'+
      '<button class="opt solid" id="oRestore">Restore booking</button>'+
      '<button class="opt quiet" id="oClose">Close</button>'
    );
    document.getElementById('oRestore').onclick = clearManual;
    document.getElementById('oClose').onclick = close;
    return;
  }

  // ── guest answered themselves ───────────────────────────
  if (st && st.src==='digital') {
    if (st.g.status==='in') {
      pax = st.g.pax || 2;
      shell(
        '<div class="note-box">Confirmed by the guest'+
        (st.g.name ? ' \u2014 '+st.g.name : '')+'.</div>'+
        paxBlock()+
        '<button class="opt solid" id="oSave">Update guests</button>'+
        '<button class="opt out" id="oCancel">Cancel booking</button>'+
        '<button class="opt quiet" id="oClose">Close</button>'
      );
      paintPax();
      document.getElementById('oSave').onclick = function(){
        writeManual({ status:'in', pax:pax, room:String(n), override:true, source:'manual' });
      };
      document.getElementById('oCancel').onclick = function(){
        confirmSheet('Room '+n,
          'Cancel this booking?<br>The guest confirmed it themselves.',
          'Yes, cancel booking',
          function(){ writeManual({ status:'out', pax:0, room:String(n), override:true, source:'manual' }); },
          function(){ openRoom(n, st); });
      };
      document.getElementById('oClose').onclick = close;
    } else {
      shell(
        '<div class="note-box">The guest declined.</div>'+
        paxBlock()+
        '<button class="opt solid" id="oIn">Dining after all</button>'+
        '<button class="opt quiet" id="oClose">Close</button>'
      );
      paintPax();
      document.getElementById('oIn').onclick = function(){
        writeManual({ status:'in', pax:pax, room:String(n), override:true, source:'manual' });
      };
      document.getElementById('oClose').onclick = close;
    }
    return;
  }

  // ── no guest answer: plain staff entry ──────────────────
  shell(
    paxBlock()+
    '<button class="opt solid" id="oIn">Dining</button>'+
    '<button class="opt out" id="oOut">Not dining</button>'+
    '<button class="opt vac" id="oVac">Vacant tonight</button>'+
    (st ? '<button class="opt quiet" id="oClear">Clear</button>' : '')+
    '<button class="opt quiet" id="oClose">Close</button>'
  );
  paintPax();
  document.getElementById('oIn').onclick  = function(){ writeManual({ status:'in',  pax:pax, room:String(n), source:'manual' }); };
  document.getElementById('oOut').onclick = function(){ writeManual({ status:'out', pax:0,  room:String(n), source:'manual' }); };
  document.getElementById('oVac').onclick = function(){ writeManual({ status:'vacant', pax:0, room:String(n), source:'manual' }); };
  var cl = document.getElementById('oClear');
  if (cl) cl.onclick = function(){
    confirmSheet('Room '+n,
      'Clear this room back to awaiting?',
      'Yes, clear',
      clearManual,
      function(){ openRoom(n, st); });
  };
  document.getElementById('oClose').onclick = close;
}

document.getElementById('addExt').onclick = function(e){
  e.preventDefault();
  var pax=2, diets=[];
  sheet.innerHTML =
    '<h3>External guest</h3>'+
    '<input class="txt" id="xName" type="text" placeholder="Name" autocomplete="off">'+
    '<input class="txt" id="xPhone" type="tel" placeholder="Phone" autocomplete="off">'+
    '<div class="sheet-label" style="margin-top:14px">Guests</div>'+
    '<div class="pax-row" id="paxRow"></div>'+
    '<div class="sheet-label">Dietary requirements</div>'+
    '<div class="chips" id="dietChips"></div>'+
    '<input class="txt" id="xNote" type="text" placeholder="Comments" autocomplete="off" style="margin-top:14px">'+
    '<button class="opt solid" id="oIn" style="margin-top:8px">Add</button>'+
    '<button class="opt quiet" id="oCancel">Cancel</button>';
  bd.className='backdrop show';
  revealAction();

  function paintPax(){
    var r=document.getElementById('paxRow'); r.innerHTML='';
    for(var i=1;i<=8;i++)(function(v){
      var b=document.createElement('button');
      b.className='pax'+(pax===v?' on':''); b.textContent=v;
      b.onclick=function(){ pax=v; paintPax(); };
      r.appendChild(b);
    })(i);
  }
  function paintChips(){
    var box=document.getElementById('dietChips'); box.innerHTML='';
    DIETARIES.forEach(function(d){
      var b=document.createElement('button');
      b.className='chip'+(diets.indexOf(d)>-1?' on':''); b.textContent=d;
      b.onclick=function(){
        var i=diets.indexOf(d);
        if(i>-1) diets.splice(i,1); else diets.push(d);
        paintChips();
      };
      box.appendChild(b);
    });
  }
  paintPax(); paintChips();

  document.getElementById('oIn').onclick=function(){
    var nm=document.getElementById('xName').value.trim();
    var ph=document.getElementById('xPhone').value.trim();
    var nt=document.getElementById('xNote').value.trim();
    if(!nm){ document.getElementById('xName').focus(); return; }
    var id='ext-'+Date.now();
    var rec={ status:'in', pax:pax, name:nm, phone:ph, note:nt, diets:diets, source:'manual' };
    manual[id]=rec;
    api('/manual/'+todayKey()+'/'+id, 'PUT', rec);
    close(); render();
  };
  document.getElementById('oCancel').onclick=close;
};

function editExt(key, g){
  var pax = g.pax || 2;
  var isManual = key.indexOf('ext-') === 0;

  sheet.innerHTML =
    '<h3>'+(g.name || 'External guest')+'</h3>'+
    (g.phone ? '<div class="note-box">'+g.phone+'</div>' : '')+
    (isManual ? '<div class="sheet-label">Guests</div><div class="pax-row" id="paxRow"></div>' : '')+
    (isManual ? '<button class="opt solid" id="oSave">Update guests</button>' : '')+
    '<button class="opt out" id="oDel">Cancel booking</button>'+
    '<button class="opt quiet" id="oClose">Close</button>';
  bd.className='backdrop show';
  revealAction();

  if (isManual){
    (function paintPax(){
      var r=document.getElementById('paxRow'); r.innerHTML='';
      for(var i=1;i<=8;i++)(function(v){
        var b=document.createElement('button');
        b.className='pax'+(pax===v?' on':''); b.textContent=v;
        b.onclick=function(){ pax=v; paintPax(); };
        r.appendChild(b);
      })(i);
    })();
    document.getElementById('oSave').onclick = function(){
      g.pax = pax;
      manual[key] = g;
      api('/manual/'+todayKey()+'/'+key, 'PUT', g);
      close(); render();
    };
  }

  document.getElementById('oDel').onclick = function(){
    confirmSheet(g.name || 'External guest',
      'Cancel this booking?',
      'Yes, cancel booking',
      doCancel,
      function(){ editExt(key, g); });
  };

  function doCancel(){
    if (isManual){
      delete manual[key];
      api('/manual/'+todayKey()+'/'+key, 'DELETE');
    } else {
      // guest booked via the link — record a staff cancellation
      var rec = { status:'out', pax:0, override:true, source:'manual',
                  name:g.name||'', phone:g.phone||'' };
      manual['extcancel-'+key] = rec;
      api('/manual/'+todayKey()+'/extcancel-'+key, 'PUT', rec);
      cancelledExt[key] = true;
    }
    close(); render();
  }
  document.getElementById('oClose').onclick = close;
}

// ── load ───────────────────────────────────────────────────
document.getElementById('legGuest').innerHTML = ICON_GUEST;
document.getElementById('legStaff').innerHTML = ICON_STAFF;

Promise.all([
  api('/responses/'+todayKey()),
  api('/manual/'+todayKey())
]).then(function(r){
  responses = r[0] || {};
  manual    = r[1] || {};
  render();
});
</script>
