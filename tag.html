<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>Nala · Menu Dietaries</title>
<link rel="stylesheet" href="nala-ui2.css?v=6">
<style>
  body { padding:28px 24px 60px; }
  /* The save bar is pinned over the foot of the page, so the page has to
     reserve room for it. Without this the last control on the list sits
     under the bar and cannot be tapped, which pub_suite measures.     */
  body.ui2 { padding-bottom:calc(120px + env(safe-area-inset-bottom)); }

  /* This page's own shape and nothing else. Ground, ink, type, spacing, the
     buttons and the hamburger come from nala-ui2.css.

     The hand copy of the nav is gone. Its comment said nala-ui.css "holds
     the ruling copy of this dress - keep this one in step with it", and it
     had not been: publish.html and this page were identical, flags.html had
     drifted from both. nala-ui2.css needs no tier class, which was the only
     reason the copy existed.                                             */
  .wrap { max-width:520px; margin:0 auto; }
  .navrow { display:flex; margin-bottom:var(--s2); }

  .errbar { position:fixed; top:0; left:0; right:0; z-index:50;
            background:var(--law-red); color:#fff; padding:var(--s3) var(--s4);
            font-size:var(--t2); line-height:1.5;
            transform:translateY(-100%); transition:transform .25s; }
  .errbar.show { transform:translateY(0); }

  .wordmark { font-size:var(--t1); color:var(--mid); text-align:center;
              letter-spacing:.18em; text-transform:uppercase; }
  .pagename { font-size:var(--t4); font-weight:600; text-align:center;
              margin-top:var(--s1); }
  .lede { text-align:center; color:var(--mid); font-size:var(--t2);
          margin:var(--s2) auto 0; line-height:1.5; max-width:52ch; }

  /* There is no .tick on this page and there has not been for some time -
     the chef ticks which dietaries a dish does not suit on PUBLISH, and the
     owner ruled that pill's dress on 27 Aug: grey fill, red only as a ring.
     The rules removed 29 Aug were orphans, still solid red, above a comment
     asking for a ruling that had already been made. Twice I read the comment
     and reported the tag board as an open question on the colour law. Dead
     CSS is not inert when it carries a description of the app with it. */
  .rule { border:none; border-top:1px solid var(--rule); margin-top:var(--s5); }

  .secthead { font-size:var(--t2); font-weight:500; color:var(--mid);
              margin-top:var(--s5); }
  .addrow { display:flex; gap:var(--s2); margin-top:var(--s3); }
  .addrow input { flex:1; min-width:0; }
  /* Which list a new dietary joins. A segmented choice, so selected wears
     the interaction accent rather than ink.                              */
  .grp { display:flex; gap:var(--s2); margin-top:var(--s2); }
  .grp button { flex:1; padding:var(--s3); min-height:var(--tap);
                border:1px solid var(--rule); background:transparent;
                border-radius:var(--r); font-family:var(--ui-font);
                font-size:var(--t2); color:var(--ink); cursor:pointer;
                -webkit-tap-highlight-color:transparent; }
  .grp button.on { background:var(--accent); color:var(--accent-ink);
                   border-color:var(--accent); }
  .addbtn { margin-top:var(--s2); }

  .mng { margin-top:var(--s3); }
  .mrow { display:flex; align-items:center; justify-content:space-between;
          gap:var(--s3); padding:var(--s3) 0;
          border-bottom:1px solid var(--rule); min-height:var(--tap); }
  .mname { font-size:var(--t3); }
  .mname .g { font-size:var(--t2); color:var(--mid); margin-left:var(--s2); }
  .mrow.off .mname { color:var(--mid); font-style:italic; }
  .mbtns { display:flex; gap:var(--s2); flex:0 0 auto; }
  .mtog { border:1px solid var(--rule); background:transparent; color:var(--mid);
          padding:var(--s2) var(--s3); min-height:36px; border-radius:var(--pill);
          font-family:var(--ui-font); font-size:var(--t2); cursor:pointer;
          -webkit-tap-highlight-color:transparent; }
  .mrow.off .mtog { border-color:var(--accent); color:var(--accent); }
  /* Destroys something a booking may be using, so it wears the button law's
     destructive dress and asks first. Offered only on a hidden row: hide
     comes before delete. It was red, which is failure's colour.          */
  .mtog.mdel { border-color:var(--law-terra-b); color:var(--law-terra); }

  .savebar { position:fixed; bottom:0; left:0; right:0; background:var(--ground);
             border-top:1px solid var(--rule);
             padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
             transform:translateY(110%); transition:transform .25s; }
  .savebar.show { transform:translateY(0); }
  .savebar .in { max-width:520px; margin:0 auto; display:flex; gap:var(--s3);
                 align-items:center; }
  .savebtn { flex:1; }
  .saved { font-size:var(--t2); color:var(--mid); flex:0 0 auto; }
</style>
</head>
<body class="ui2">
<div class="errbar" id="err"></div>
<div class="wrap">
  <div class="navrow">  <!-- Every other staff page has this and these two did not, so a chef who
       opened the dietary list had no way off it but the browser's back button,
       and one opened in a new tab had none at all. Publishing is the natural
       place to go back to from the dietary list, so it leads. -->
  <div class="navwrap">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"></div>
  </div>
  </div>
  <div class="wordmark">Nala Resort</div>
  <div class="pagename">Dietary Settings</div>
  <div class="lede">The list a guest chooses from when they tell us what they
    cannot eat.<br>Tonight's dishes are tagged on the publish page.</div>

  <div class="secthead">Add a dietary</div>
  <div class="addrow"><input id="newName" placeholder="e.g. Red pepper spice" autocomplete="off"></div>
  <div class="grp">
    <button id="gCommon" class="on">Common - always listed</button>
    <button id="gMenu">This menu only</button>
  </div>
  <button class="btn solid addbtn" id="addBtn">Add dietary</button>

  <div class="secthead">All dietaries</div>
  <div class="mng" id="mng"></div>
</div>

<div class="savebar" id="savebar"><div class="in">
  <button class="btn solid savebtn" id="saveBtn">Save the list</button>
  <span class="saved" id="savedMsg"></span>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=12"></script>
<script src="nala-shared.js?v=50"></script>
<script>
/* Tagging a menu is the chef's job and the manager's. Until 18 Aug there was
   no gate at all, so a cleaner could archive the dietary list. Sent to their
   own board rather than refused, since a role with somewhere to be does not
   need telling off. */
(function gate(){
  if (!window.firebase || !firebase.auth ||
      typeof loadStaff !== 'function'){ setTimeout(gate,300); return; }
  var A;
  try { A = firebase.auth(); } catch (e){ setTimeout(gate,300); return; }
  if (!A || typeof A.onAuthStateChanged !== 'function'){ setTimeout(gate,300); return; }
  A.onAuthStateChanged(function(u){
    if (!u) return;
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role;
      if (can(role, 'publishMenu') || e) return;
      document.querySelector('.wrap').style.display = 'none';
      document.getElementById('savebar').style.display = 'none';
      var home = homeFor(role);
      if (home) location.replace(home);
      else document.body.insertAdjacentHTML('afterbegin',
        '<div style="padding:16px;font-family:Helvetica,Arial,sans-serif;font-size:12px">' +
        'This login has no access to Menu Dietaries. See the manager.</div>');
    });
  });
})();

  var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
  var COURSES = [['bread','Bread'],['entree','Entr\u00e9e'],['main','Main'],['dessert','Dessert']];
  var DEFAULTS = ['Gluten','Dairy','Vegetarian','Vegan','Pescatarian',
                  'Nut allergy','Shellfish allergy','Egg allergy'];

  function err(m){ var e=document.getElementById('err');
    e.textContent=m; e.classList.add('show');
    setTimeout(function(){ e.classList.remove('show'); }, 5000); }

  function todayKey(){ var d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function keyOf(name){ return name.trim().replace(/[.#$\/\[\]]/g,'').replace(/\s+/g,' '); }

  var MENU=null, MASTER={}, TAGS={}, newGroup='common', dirty=false;
  var LOCKED=null;   // set to a message when a read failed and saving is unsafe

  function markDirty(){ dirty=true;
    document.getElementById('savebar').classList.add('show');
    document.getElementById('savedMsg').textContent=''; }

  function activeNames(){
    return Object.keys(MASTER).filter(function(k){ return MASTER[k].active; })
      .map(function(k){ return MASTER[k].name; })
      .sort(function(a,b){
        var ga=MASTER[keyOf(a)].group==='menu'?1:0, gb=MASTER[keyOf(b)].group==='menu'?1:0;
        return ga-gb || a.localeCompare(b); });
  }

  /* Tonight's dishes are tagged on the publish page, where they are being
     written. This page drew them too, and both wrote the whole of /menutags,
     so whichever saved second replaced the other's ticks without saying so.
     One writer now. What is left here is the list itself. */
  function paintCourses(){ /* retired 22 Aug, see above */ }

  function paintMng(){
    var box=document.getElementById('mng'); box.innerHTML='';
    Object.keys(MASTER).sort(function(a,b){
      var da=MASTER[a], db_=MASTER[b];
      return (db_.active?1:0)-(da.active?1:0) ||
             (da.group==='menu'?1:0)-(db_.group==='menu'?1:0) ||
             da.name.localeCompare(db_.name);
    }).forEach(function(k){
      var d=MASTER[k];
      var r=document.createElement('div'); r.className='mrow'+(d.active?'':' off');
      var nm=document.createElement('div'); nm.className='mname';
      nm.innerHTML=d.name+'<span class="g">'+(d.group==='menu'?'this menu':'common')+'</span>';
      var bs=document.createElement('span'); bs.className='mbtns';
      var b=document.createElement('button'); b.className='mtog';
      /* The owner's word, 26 Aug: Hide, not Archive - the same rename as
         Flag Settings, so the two Settings pages speak alike. */
      b.textContent=d.active?'Hide':'Show';
      b.onclick=function(){
        d.active=!d.active;
        if (!d.active) Object.keys(TAGS).forEach(function(c){
          var i=(TAGS[c]||[]).indexOf(d.name); if(i>-1) TAGS[c].splice(i,1);
        });
        markDirty(); paintMng(); paintCourses();
      };
      bs.appendChild(b);
      /* Delete, only from hidden, lands only on Save - a mis-tap costs a
         re-add, not a dietary. Hiding already pulled it off tonight's tags;
         a guest record carrying the name keeps it as text, exactly as it
         keeps a hidden one. */
      if (!d.active){
        var x=document.createElement('button'); x.className='mtog mdel';
        x.textContent='Delete';
        x.onclick=function(){ delete MASTER[k]; markDirty(); paintMng(); paintCourses(); };
        bs.appendChild(x);
      }
      r.appendChild(nm); r.appendChild(bs); box.appendChild(r);
    });
  }

  document.getElementById('gCommon').onclick=function(){ newGroup='common';
    this.classList.add('on'); document.getElementById('gMenu').classList.remove('on'); };
  document.getElementById('gMenu').onclick=function(){ newGroup='menu';
    this.classList.add('on'); document.getElementById('gCommon').classList.remove('on'); };

  document.getElementById('addBtn').onclick=function(){
    var inp=document.getElementById('newName'), name=inp.value.trim();
    if (!name) return;
    var k=keyOf(name);
    if (MASTER[k]){ MASTER[k].active=true; MASTER[k].group=newGroup; }
    else MASTER[k]={ name:name, active:true, group:newGroup };
    inp.value='';
    markDirty(); paintMng(); paintCourses();
  };

  document.getElementById('saveBtn').onclick=function(){
    /* Save is a PUT of the whole master list, so it is only safe when the list
       on screen is the list in the database. If the read failed, it is not, and
       saving would replace the chef's dietaries with the eight defaults.
       Locked rather than trusted.

       Tonight's tags are NOT written here any more, 22 Aug. This page and the
       publish page both wrote /menutags, both wrote the whole map rather than
       a field, and whichever saved second silently replaced the other's work.
       Tagging moved to publishing, where the dishes are; this page keeps the
       list those tags are made from. */
    if (LOCKED) return err(LOCKED);
    var btn=this; btn.disabled=true;
    Promise.all([
      fetch(DB+'/dietaries.json',{method:'PUT',body:JSON.stringify(MASTER)})
    ]).then(function(rs){
      if (rs.some(function(r){ return !r.ok; })) throw new Error('save failed');
      dirty=false; btn.disabled=false;
      document.getElementById('savedMsg').textContent='Saved';
      setTimeout(function(){ if(!dirty) document.getElementById('savebar').classList.remove('show'); },1200);
    }).catch(function(e){ btn.disabled=false; err('Could not save - check the connection and try again.'); });
  };

  window.addEventListener('beforeunload', function(e){
    if (dirty){ e.preventDefault(); e.returnValue=''; } });

  // ── load ──
  /* A read that FAILS is not an empty node. Returning null for both made a
     refused request look like a database with no dietaries in it, the eight
     defaults were seeded on top, and Save would then have written them over
     the real list. Same shape of bug as the Clean Slate one, with worse
     consequences, because this one had a button that overwrote. */
  function readNode(path){
    return fetch(DB+path+'.json?v='+Date.now())
      .then(function(r){ return r.ok ? r.json() : { __failed:r.status }; })
      .catch(function(){ return { __failed:0 }; });
  }
  function failedRead(v){ return !!(v && v.__failed !== undefined); }

  Promise.all([
    /* Tonight's menu, from wherever it was published. Publishing moved off
       GitHub into the database at /menu, so the repo file is no longer
       written and reading it alone showed a chef the menu he published
       before the move. fetchMenuAnywhere tries the database first and falls
       back to the file, which is what every other reader does. */
    fetchMenuAnywhere(),
    readNode('/dietaries'),
    readNode('/menutags/'+todayKey())
  ]).then(function(res){
    var menu=res[0], master=res[1], tags=res[2];

    /* Tonight's menu, whatever the chef put on it. This used to insist on a
       bread course by name, so a menu without bread was treated as no menu at
       all and the chef was told to publish one that was already published. */
    var freshToday = menu && menu.published &&
      new Date(menu.published).toDateString() === new Date().toDateString();
    var hasCourse = menu && COURSES.some(function(c){ return menu[c[0]] && menu[c[0]].name; });
    if (freshToday && hasCourse) MENU=menu;

    if (failedRead(master) || failedRead(tags)){
      LOCKED = 'Could not read ' +
        (failedRead(master) ? 'the dietary list' : "tonight's tags") +
        '. Nothing is saved until it loads, so nothing gets overwritten. ' +
        'Sign in again, then refresh.';
      err(LOCKED);
      document.getElementById('saveBtn').disabled = true;
      if (!failedRead(master) && master) MASTER = fixDietMaster(master);
      if (!failedRead(tags) && tags) TAGS = tags;
      paintCourses(); paintMng();
      return;
    }

    /* Read through the rename table (nala-shared.js): a list saved before the
       26 Aug renames shows under the new names. That means the screen and the
       database disagree, which on this page is exactly what the Save bar is
       for - offered, not auto-saved, because saving is a PUT of the whole
       list and stays a person's decision. Guest answers saved under the old
       names need no sweep: every reader maps them. */
    if (master){
      MASTER = fixDietMaster(master);
      if (dietMasterRenamed(master)) markDirty();
    }
    else DEFAULTS.forEach(function(n){ MASTER[keyOf(n)]={name:n,active:true,group:'common'}; });
    if (tags) TAGS=tags;
    paintCourses(); paintMng();
  }).catch(function(e){ err('Could not load - refresh to try again.'); });
</script>

<script>
(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  if (!b || !d) return;
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
})();
</script>
</body>
</html>
