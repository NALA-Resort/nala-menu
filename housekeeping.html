<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nala Villas">
<link rel="apple-touch-icon" href="nala-icon.png?v=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>Nala · Housekeeping Sheet</title>
<link rel="stylesheet" href="nala-ui.css?v=17">
<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--ui-font); color:#111; background:#fff; padding:16px 16px 0; }

  /* .btn and .btn.ghost wear nala-ui.css's tier-print dress. */
  .stamp { margin-top:10px; font-size:7.5px; letter-spacing:.1em;
           text-transform:uppercase; color:#999; text-align:right; }

  .scroller { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { width:100%; min-width:760px; border-collapse:separate; border-spacing:0; }
  th { font-size:7px; letter-spacing:.12em; text-transform:uppercase; color:#666;
       text-align:left; padding:0 5px 6px; border-bottom:1px solid #111;
       white-space:nowrap; vertical-align:bottom; }
  th.wrap { white-space:normal; line-height:1.25; text-align:center; }

  td { font-size:9px; padding:5px; border-bottom:1px solid #ddd; vertical-align:middle; }
  tr { page-break-inside:avoid; }

  .c-room  { width:8%;  text-align:center; font-weight:bold; }
  .c-svc   { width:12%; text-align:center; }
  .c-arr   { width:12%; }
  .c-dep   { width:12%; }
  .c-done  { width:6%;  text-align:center; }
  .c-notes { width:42%; }
  .c-insp  { width:8%;  text-align:center; }
  /* rows are sized so a full house - every room a job, plus the write-ins -
     still lands on one A5 page. Do not loosen without re-checking the fit. */
  tbody td { padding-top:4px; padding-bottom:4px; height:22px; }

  .chip { display:inline-block; border:1.2px solid #111; border-radius:5px;
          padding:1px 7px; font-weight:bold; font-size:8px; letter-spacing:.08em;
          background:#111; color:#fff; text-transform:uppercase;
          -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .chip.pre { background:transparent; border-color:#111; color:#111; font-weight:bold; }
  .chip.svc { background:transparent; border-color:#aaa; color:#555;
              font-weight:normal; letter-spacing:.12em; }
  .donemark { font-weight:bold; font-size:9px; white-space:nowrap; }
  .subtag { font-size:7.5px; color:#555; margin-top:1px; letter-spacing:.04em; }
  .chip.ver { background:transparent; border-style:dashed; border-color:#A8321E; color:#A8321E; }
  .box  { width:15px; height:15px; border:1.2px solid #333; border-radius:3px;
          display:inline-block; vertical-align:middle; }
  tr.vac td { color:#c2c2c2; }
  .mgrstrip { margin:8px 0 12px; }
  .mgrline { display:flex; gap:10px; align-items:flex-end; margin:6px 0 0; }
  .mgrline span { font-size:8px; letter-spacing:.14em; text-transform:uppercase;
                  color:#666; white-space:nowrap; padding-bottom:2px; }
  .mgrline i { flex:1; border-bottom:1px solid #999; height:13px; }

  .muted { color:#aaa; font-weight:normal; font-style:italic; }

  /* Printed sheets repeat everything above the table on every page. A table
     header group is the only thing browsers reliably repeat, so the block is
     cloned into a thead row for paper and the on-screen original is hidden. */
  .printhead { display:none; }
  .printhead > td { border:0; padding:0 0 6px; }
  @media print {
    .printhead { display:table-row; }
    .noprintblock { display:none !important; }
  }
  @media print {
    body { padding:0; }
    .scroller { overflow:visible; }
    table { min-width:0; width:100%; }
    tr { page-break-inside:avoid; }
    thead { display:table-header-group; }
    table { border-collapse:collapse; }   /* Safari repeats headers only when collapsed */
  }
</style>
</head>
<body class="tier-print">



<div class="printkick">Nala &middot; HC print</div>
<div class="daterow">
  <button class="dnav today" id="dToday">Today</button>
  <button class="dnav" id="dPrev">&#8249;</button>
  <div class="date" id="title"></div>
  <button class="dnav" id="dNext">&#8250;</button>
  <div class="navwrap">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"></div>
  </div>
</div>
<script>
(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
  /* Gated like every other page, from 23 Aug.

     It was the only page in the menu with no gate at all: any signed-in login
     could open it, and it carries guest names and villa assignments. Not a
     public leak, since the rules require a login to read /stays, but no role
     restriction either.

     The inconsistency was already visible in the app's own behaviour. The
     menu hid this link from anyone without cleansBoard, so the app was
     already asserting that those roles should not have it, and the page was
     simply not enforcing what its own menu implied. A chef with a bookmark or
     a typed address walked straight in.

     cleansBoard, the same permission as the board it prints. The sheet IS the
     board on paper and there is no argument for the paper being looser than
     the screen. */
  (function gate(){
    if (!window.firebase || !firebase.auth ||
        typeof loadStaff !== 'function'){ setTimeout(gate,300); return; }
    var A;
    try { A = firebase.auth(); } catch (e){ setTimeout(gate,300); return; }
    if (!A || typeof A.onAuthStateChanged !== 'function'){ setTimeout(gate,300); return; }
    A.onAuthStateChanged(function(u){
      if (!u) return;
      loadStaff(function(recs, e){
        var role = roleOf(u);
        window.NALA_ROLE = role;
        /* A failed staff read is not a refusal. Locking the sheet because the
           list would not load would keep housekeepers off their own work over
           a bad minute of signal. */
        if (can(role, 'cleansBoard') || e){
          window.NALA_NAVFILTER(role);
          return;
        }
        /* This page has no single wrapper: it is a print sheet built from
           top level blocks. Hidden by name so a refused login never sees a
           flash of the villas before the redirect lands. */
        ['printkick','daterow','stats','mgrstrip','scroller','stamp','foot']
          .forEach(function(c){
            var el = document.querySelector('.' + c);
            if (el) el.style.display = 'none';
          });
        var home = homeFor(role);
        if (home) location.replace(home);
        else document.body.insertAdjacentHTML('afterbegin',
          '<div style="padding:16px;font-family:Helvetica,Arial,sans-serif;font-size:12px">' +
          'This login has no access to the Clean Sheet. See the manager.</div>');
      });
    });
  })();

})();
</script>
<div class="stats">
    <div class="stat"><span class="stat-n" id="nClean">&ndash;</span><span class="stat-l">Cleans</span></div>
    <div class="stat"><span class="stat-n" id="nSvc">&ndash;</span><span class="stat-l">Services</span></div>
    <div class="stat" id="verWrap" style="display:none"><span class="stat-n" id="nVer">&ndash;</span><span class="stat-l">To verify</span></div>
  </div>

<div class="mgrstrip">
  <div class="mgrline"><span>Assigned to</span><i></i></div>
  <div class="mgrline"><span>Manager notes</span><i></i></div>
</div>

<div class="scroller">
  <table>
    <thead>
      <tr class="printhead"><td colspan="7"><div id="printHead"></div></td></tr>
      <tr>
        <th class="c-room">Villa</th>
        <th class="c-svc">Service</th>
        <th class="c-arr">Arrival</th>
        <th class="c-dep">Departs</th>
        <th class="c-done">Done</th>
        <th class="c-notes">Housekeeper notes</th>
        <th class="c-insp">Insp.</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div class="stamp" id="stamp"></div>

<div class="foot">
  <button class="btn" onclick="window.print()">Print</button>
  <button class="btn ghost" onclick="location.reload()">Refresh</button>
</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=12"></script>
<script src="nala-shared.js?v=49"></script>
<script>
// date state + header wiring, dates, look-back: nala-shared.js
var nav = initDateNav();
var VIEW = nav.VIEW, todayKey = nav.todayKey, isToday = nav.isToday;

// paper needs to say which print is current
(function stamp(){
  var n=new Date();
  var hh=n.getHours(), mm=String(n.getMinutes()).padStart(2,'0');
  var ap=hh>=12?'pm':'am'; hh=hh%12||12;
  document.getElementById('stamp').textContent =
    'Printed '+n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear()+' '+hh+':'+mm+ap;
})();

function api(path){ return fetch(DB+path+'.json?v='+Date.now()).then(function(r){return r.json();}); }

/* The most recent day before the viewed one with hk records, walking back a
   fortnight, exactly as the Cleans board does: a strip marked Saturday still
   reaches Monday's sheet. Read only. The board owns writing the carry. */
function lastHk(maxDays){
  function step(i){
    if (i >= maxDays) return Promise.resolve({ key:null, data:{} });
    var d = new Date(VIEW); d.setDate(d.getDate()-1-i);
    return api('/hk/'+dkey(d)).then(function(v){
      if (v && typeof v === 'object' && Object.keys(v).length) return { data:v };
      return step(i+1);
    });
  }
  return step(0);
}

var yest = (function(){ var d=new Date(VIEW); d.setDate(d.getDate()-1); return dkey(d); })();

/* Last night as well as tonight, the fix the board got on 19 Aug and this
   sheet did not: /stays files a guest under the nights they SLEEP, so
   somebody who checked out this morning is not in tonight's file at all.
   They are the person this sheet exists for. Reading only tonight printed a
   same day turnover as a Pre-arrival and dropped a plain departure into the
   To verify count, off the paper entirely. */
Promise.all([ api('/responses/'+todayKey()), api('/manual/'+todayKey()),
              fetchRoomGuests(todayKey()), api('/hk/'+todayKey()), fetchStays(todayKey()),
              api('/stays/'+yest), lastHk(14) ])
  .then(function(res){
    var responses  = res[0] || {};
    var manual     = res[1] || {};
    var hk         = res[3] || {};
    var tonight    = res[4] || {};
    var lastNight  = res[5] || {};
    var prevHk     = (res[6] || {}).data || {};
    /* Last night underneath, tonight over the top, like the board: a villa
       occupied both nights reads as tonight's guest, and a villa emptied
       this morning still reads as the guest who left. */
    var roomguests = overlayStays(
      overlayStays(resolveRoomGuestsHK(res[2] || {}, todayKey()), lastNight),
      tonight);

    /* Somebody arrives into the villa today, from either source, with the
       manager's override read the way the board reads it at draw time. */
    var arriving = {};
    var rgToday = (res[2] || {})[todayKey()] || {};
    for (var rv in rgToday){ if (rgToday[rv] && rgToday[rv].arrives) arriving[rv] = true; }
    for (var sv in tonight){
      var t = tonight[sv] || {};
      if (t.arrive && String(t.arrive).slice(0,10) === todayKey()) arriving[sv] = true;
    }

    function fmtT(iso){
      var d = parseISO(iso);
      if (!d) return '';
      var h=d.getHours(), m=d.getMinutes();
      return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
    }

    // clean = departing today; service = staying on; verify = no usable data
    var rows=[], nClean=0, nSvc=0, nVer=0;
    for (var n=1; n<=ROOMS; n++){
      var r = roomRecord(n, responses, manual, roomguests);
      var ct = hk[n] || {}, cp = prevHk[n] || {};
      /* The carry, derived the way the board derives it before writing it:
         a departure or a push left open on the newest previous day is a
         departed clean today, however many midnights ago that became true.
         Derived in memory only. */
      var pushedIn = !!(cp.pushed && !cp.done);
      var carriedDep = !!(ct.carried && ct.departed && !ct.done) ||
        (!(ct.carried || ct.done || cp.done) &&
         (cp.departed || cp.pushed) && ct.departed === undefined);
      var goneIn = pushedIn || carriedDep;
      /* Same day turnover: only the two night files can tell it from a plain
         arrival, and it is a clean first, exactly as on the board. */
      var ln = lastNight[String(n)];
      var left = !!(ln && ln.depart &&
                    String(ln.depart).slice(0,10) === todayKey());
      var kOver = (ct.kind==='clean'||ct.kind==='svc'||ct.kind==='pre'||ct.kind==='vac')
                  ? ct.kind : null;
      var kind = kOver || (goneIn ? 'clean' : hkClassify(r, todayKey(), null, left));
      var arr = ct.arriving === true ? true
              : ct.arriving === false ? false : !!arriving[n];
      if (kind==='clean') nClean++;
      else if (kind==='svc') nSvc++;
      else if (kind==='ver') nVer++;
      rows.push({ n:n, rec:r||{}, kind:kind, arr:arr,
                  departed: !!(ct.departed || carriedDep) });
    }

    var order={svc:0, clean:1, pre:2, ver:3, vac:4};   // services first: done at breakfast
    rows.sort(function(a,b){ return (order[a.kind]-order[b.kind]) || (a.n-b.n); });

    document.getElementById('nClean').textContent = nClean;
    document.getElementById('nSvc').textContent   = nSvc;
    if (nVer){ document.getElementById('nVer').textContent = nVer;
               document.getElementById('verWrap').style.display=''; }

    function fmtD(raw){
      var d = parseDepDate(raw);
      if (!d) return '';
      var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      return days[d.getDay()]+' '+ord(d.getDate());
    }

    var tb = document.getElementById('rows');
    // Only real jobs go on paper. Verify and vacant rooms are not jobs, and
    // printing all 17 pushed the sheet off A4. The three blank rows below are
    // for the manager to pen in anything the board could not confirm; the
    // 'To verify' count above says how many that might be.
    rows = rows.filter(function(r){ return r.kind==='svc' || r.kind==='clean' || r.kind==='pre'; });
    rows.forEach(function(row){
      var g = row.rec;
      var chip='', cls='';
      if (row.kind==='pre') chip='<span class="chip pre">Pre-arrival</span>';
      else if (row.kind==='clean') chip='<span class="chip">Clean</span>';
      else if (row.kind==='svc') chip='<span class="chip svc">Service</span>';
      else if (row.kind==='ver') chip='<span class="chip ver">Verify</span>';
      else { cls=' class="vac"'; chip='<span class="muted">Empty</span>'; }
      var boxes = (row.kind==='vac') ? ['',''] : ['<span class="box"></span>','<span class="box"></span>'];
      var mk = hk[String(row.n)] || {};
      if (mk.done) boxes[0] = '<span class="donemark">&#10003; '+fmtT(mk.done)+'</span>';
      /* Pushed off today's list is not done and not waiting for a tick, and
         a tick box on it invites the wrong mark. */
      else if (mk.pushed) boxes[0] = '<span class="muted">Pushed</span>';
      if (row.kind!=='vac'){
        if (row.departed)     chip += '<div class="subtag">Departed</div>';
        else if (mk.bfast && !mk.done) chip += '<div class="subtag">At breakfast '+fmtT(mk.bfast)+'</div>';
      }
      /* When the guest lands, beside the day they land, resolved by the same
         shared rule the board draws: stated times only, so a silent 2pm
         stays silent on paper too. */
      var arrCell = fmtD(g.arrives);
      if (row.arr && (row.kind==='clean' || row.kind==='pre')){
        var ev = effectiveEta(row.n);
        if (ev.disp) arrCell += (arrCell ? ' · ' : '') + ev.disp;
      }
      tb.insertAdjacentHTML('beforeend',
        '<tr'+cls+'>'+
          '<td class="c-room">'+row.n+'</td>'+
          '<td class="c-svc">'+chip+'</td>'+
          '<td class="c-arr">'+arrCell+'</td>'+
          '<td class="c-dep">'+fmtD(g.departs)+'</td>'+
          '<td class="c-done">'+boxes[0]+'</td>'+
          '<td class="c-notes"></td>'+
          '<td class="c-insp">'+boxes[1]+'</td>'+
        '</tr>');
    });

    for (var w=0; w<3; w++){
      tb.insertAdjacentHTML('beforeend',
        '<tr class="writein">'+
          '<td class="c-room"></td><td class="c-svc"></td>'+
          '<td class="c-arr"></td><td class="c-dep"></td>'+
          '<td class="c-done"><span class="box"></span></td>'+
          '<td class="c-notes"></td>'+
          '<td class="c-insp"><span class="box"></span></td>'+
        '</tr>');
    }
  })
  .catch(function(e){
    document.getElementById('rows').innerHTML =
      '<tr><td colspan="7" style="padding:20px;color:#A8321E">Could not load - check connection and refresh.</td></tr>';
  });
</script>

<script>
/* clone the above-table block into the printed header so every page carries it */
(function(){
  function fill(){
    var slot = document.getElementById('printHead');
    if (!slot) return;
    slot.innerHTML = '';
    ['.printkick','.daterow','.stats','.mgrstrip'].join(',').split(',').forEach(function(sel){
      var el = document.querySelector(sel);
      if (!el) return;
      el.classList.add('noprintblock');
      var c = el.cloneNode(true);
      c.classList.remove('noprintblock');
      c.classList.add('printclone');
      c.querySelectorAll('[id]').forEach(function(n){ n.removeAttribute('id'); });
      var nav = c.querySelector('.navwrap'); if (nav) nav.parentNode.removeChild(nav);
      slot.appendChild(c);
    });
  }
  /* iOS Safari does not reliably fire beforeprint, so the clone is built as
     soon as the sheet has data rather than waiting for a print event. It is
     hidden on screen either way. Refilled on beforeprint where supported, in
     case the sheet changed after load.                                     */
  function fillWhenReady(n){
    var rows = document.getElementById('rows');
    if (rows && rows.children.length){ fill(); return; }
    if (n > 0) setTimeout(function(){ fillWhenReady(n-1); }, 400);
  }
  fillWhenReady(15);
  window.addEventListener('beforeprint', fill);
})();
</script>
</body>
</html>
