function api(path, method, body){
  var o = { method: method||'GET' };
  if (body !== undefined) { o.headers={'Content-Type':'application/json'}; o.body=JSON.stringify(body); }
  return fetch(DB+path+'.json'+(method?'':'?v='+Date.now()), o)
    .then(function(r){
      if (!r.ok && method) {
        return r.text().then(function(t){
          showError('Not saved - the database rejected the change. ' +
                    'Check the Realtime Database rules allow writes.');
          var err = new Error(t); err.shown = true; throw err;
        });
      }
      return r.json();
    })
    .catch(function(e){
      if (method && !e.shown) showError('Not saved - no connection to the database.');
      throw e;
    });
}

var errTimer;
function showError(msg){
  var el = document.getElementById('errBar');
  el.textContent = msg;
  el.className = 'errbar show';
  clearTimeout(errTimer);
  errTimer = setTimeout(function(){ el.className='errbar'; }, 6000);
}

// a room's reservation details survive any status write, in any order
function withExtras(key, rec){
  var prev = manual[key];
  if (prev){
    ['name','phone','diets','note','dnote','nodiet'].forEach(function(k){
      if (rec[k] === undefined && prev[k] !== undefined) rec[k] = prev[k];
    });
  }
  return rec;
}

// ── every /manual write goes through here: optimistic update,
//    rolled back if the database rejects it (same pattern as saveCombined)
/* Every write from this board goes through here, and it goes to the one dinner
   cell at /dinner/<date>/<villa>.

   It used to write /manual/<date>/room-<villa>, which is how a dietary added
   here became invisible at the front desk: the desk read the booking, this
   board wrote /manual, and the next save from either wiped the other. Three
   nodes held `diets` and none of them owned it.

   Villa-keyed records move across. `ext-<id>` keys are external diners with no
   villa and no booking, and they stay in /manual until they have somewhere
   better to be: they are not a villa on a night, which is what the cell is. */
/* A dietary belongs to the guest, not to tonight.

   This board writes the one dinner cell, which lives under a date and is gone
   at midnight, so a dietary typed here was right this evening and gone
   tomorrow, and nothing said so: the guest still had a booking and the board
   still looked right. The front desk had always written both places, so the
   same allergy survived from one screen and not the other.

   The cell keeps its copy, because tonight's service reads the cell and
   nothing else. The booking gets one too, which is what the desk, the sheet
   and tomorrow read. See NOTES-AUDIT.md: this is the first of the four notes
   to be put where it belongs, and the dietary still has one move left in it,
   onto the customer, so it outlives the booking as well as the night. */
function persistDietary(villa, rec){
  var kn = roomguests[String(villa)];
  var id = kn && kn.bookingId;
  if (!id) return;                 /* a walk in has no booking to carry it */
  if (!('diets' in rec) && !('dnote' in rec)) return;
  var patch = {};
  if ('diets' in rec) patch.diets = rec.diets || [];
  if ('dnote' in rec) patch.dnote = rec.dnote || '';
  /* The same answer under the booking's name for it. A dietary chosen here
     contradicts a stored "none to declare", and left standing it read the
     front desk's pill back on beside the allergy it denies. */
  if ('nodiet' in rec) patch.noDiets = !!rec.nodiet;
  else if (patch.diets && patch.diets.length) patch.noDiets = false;
  /* Quietly. A failure here must not undo the save that succeeded, and the
     cell already carries the answer for tonight either way. */
  api('/bookings/' + id + '/prearrival', 'PATCH', patch).catch(function(){});
  /* And onto the person, so next year they are not asked again. */
  rememberDietary(id, patch.diets, patch.dnote);
}

function saveManual(key, rec){
  var had  = Object.prototype.hasOwnProperty.call(manual, key);
  var prev = manual[key];
  if (rec === undefined) delete manual[key]; else manual[key] = rec;

  var villa = /^room-(\d+)$/.test(key) ? key.slice(5) : null;
  var path, body = rec;
  if (villa){
    path = '/dinner/'+todayKey()+'/'+villa;
    if (rec !== undefined){
      /* Staff, because this board is staff only. That is what stops a guest
         overwriting it from their link afterwards. */
      body = Object.assign({}, rec, { by:'staff', at:new Date().toISOString() });
      /* Staff overwriting a guest's own answer keeps that answer underneath.
         With two nodes the guest's record simply stayed where it was and the
         board merged them; with one cell there is nowhere else for it to be,
         and losing it would lose the fact that the guest had booked at all.
         That is what draws the crossed-out guest icon. */
      var was = dinner[villa];
      if (was && was.by === 'guest') body.guest = was;
      else if (was && was.guest)     body.guest = was.guest;
      else {
        /* Transitional: a guest answer given before this board moved across
           still sits in /responses. Overriding it has to carry it into the
           cell, or the fact that the guest booked at all is lost the first
           time staff touch the villa. Harmless once nothing writes there:
           no response, no guest. */
        var had = roomState(+villa);
        /* roomState already sees the optimistic staff record set above, so it
           reports the override branch rather than the guest one. The guest's
           own answer is what it puts under `guest`. */
        var gst = had && (had.guest || (had.src === 'digital' ? had.g : null));
        if (gst) body.guest = gst;
      }
      dinner[villa] = body;
    } else {
      delete dinner[villa];
    }
  } else {
    path = '/manual/'+todayKey()+'/'+key;
  }

  var req = (rec === undefined)
    ? api(path, 'DELETE')
    : api(path, 'PUT', body);
  req.catch(function(){
    if (had) manual[key] = prev; else delete manual[key];
    if (villa){ if (prev) dinner[villa] = prev; else delete dinner[villa]; }
    render();
  });
  return req;
}

// ── build a unified view keyed by room ─────────────────────
/* Every node roomStateRaw consults is partitioned by date, so what it returns
   is tonight's answer. roomguests is not: it is carried forward across a stay
   so a guest keeps their villa, and any note or dietary left on an old record
   there belongs to an earlier night. Stamping which is which here means the
   bubble can say so rather than presenting both as tonight's. */
function roomState(n){
  var s = roomStateRaw(n);
  if (s && s.g){
    s.g = withDineProvenance(Object.assign({}, s.g), s.g, roomguests[String(n)]);
    /* Same rule as roomRecord: the reservation's dietaries win when it has
       any. This board builds its record here rather than through roomRecord,
       so the overlay has to be applied here too or the two screens disagree
       about somebody's allergy. */
    s.g = overlayReservationDiets(s.g, n);
  }
  return s;
}

function roomStateRaw(n){
  var mk = 'room-'+n;
  var m  = manual[mk];

  /* The one dinner cell, at /dinner/<date>/<villa>. It holds the whole answer
     whoever gave it, so when it exists there is nothing to merge and the two
     older nodes below are not consulted at all.

     `by` says who set it, and it drives the icon the same way src did: a guest
     answering from their link, or staff typing it at a desk. */
  var cell = dinnerElsewhere(dinner, n, roomguests) ? null : dinner[String(n)];
  if (cell && typeof cell === 'object' && !vacantIsStale(cell, roomguests[String(n)] || {}))
    return { src: (cell.by === 'guest' ? 'digital' : 'manual'),
             key: mk, cell: true,
             /* The guest's own answer, kept under the staff one so nothing
                they told us is lost: their pre-menu acknowledgement and their
                "no dietaries" confirmation both live there and are never
                re-entered by staff. */
             g: cell.guest ? Object.assign({}, cell.guest, cell) : cell,
             override: !!cell.override,
             guest: cell.guest || null };

  // latest digital response for this room
  var best = null;
  for (var k in responses){
    var g = responses[k];
    if (String(g.room) !== String(n)) continue;
    if (!best || (g.at || '') > (best.g.at || '')) best = { src:'digital', key:k, g:g };
  }

  // A staff override wins on the fields it sets, but the guest's own answer is
  // merged underneath so nothing they told us is lost - their pre-menu
  // acknowledgement and their "no dietaries" confirmation both live there and
  // are never re-entered by staff. Same merge rule as roomRecord().
  if (m && m.override) {
    var g = best ? Object.assign({}, best.g, m) : m;
    return { src:'manual', key:mk, g:g, override:true, guest: best ? best.g : null };
  }
  if (best) return best;
  if (m) return { src:'manual', key:mk, g:m };

  /* Nobody has said anything about tonight - so read what the GUEST said,
     on their own form, days ago.

     Their pre-arrival form asks about the first night and the answer has
     always sat on the reservation, but nothing ever carried it here. So a
     guest who told us on Tuesday they were dining showed on this board as
     awaiting, and on an arrival night nothing else would ever move it: the
     nightly dinner request is not sent to somebody who has not checked in,
     so the ONLY thing that put them in front of the chef was a person at
     the desk re-typing an answer we already had. The owner's ruling, 28
     Aug: there is no scenario where reception would decline to pass it on,
     so it should not be theirs to pass on.

     Read, never written. This adds no second writer and no second node -
     the cell above still wins outright the moment anyone sets one, and this
     falls away for good at that point, which is what keeps "the dinner cell
     is one cell" true. It is the effectiveEta shape: the authoritative
     answer, then the guest's own, then nothing.

     Only on the night they ARRIVE. PREARRIVAL_BY_VILLA holds a record for
     every occupied villa, and the form asks about the first night alone, so
     without this gate one answer would speak for every night of the stay.

     Any answer they gave, not only a form they finished. The guest page
     saves each question as it is left, so an abandoned form still holds
     real answers, and an answer given is a thing the kitchen should know -
     the owner's ruling, 28 Aug. */
  var pre = PREARRIVAL_BY_VILLA[String(n)];
  var kn  = roomguests[String(n)] || {};
  if (pre && (pre.dining === true || pre.dining === false) &&
      kn.arrives && dkey(parseDepDate(kn.arrives)) === todayKey()){
    return { src:'digital', key:mk, fromForm:true, g:{
      status: pre.dining ? 'in' : 'out',
      pax:    pre.dining ? (pre.pax || kn.adults || 2) : 0,
      room:   String(n),
      diets:  pre.diets || [],
      nodiet: !!pre.noDiets,
      dnote:  pre.dnote || '',
      note:   pre.note || '',
      by:     'guest'
    } };
  }
  return null;
}


/* The bubble's colour is decided here and nowhere else. Worst wins.
   red: act before cooking tonight. amber: kitchen content to read. grey:
   context for the house, nothing the chef acts on. A bubble that is only
   grey opens only Booking notes. See NOTES-AUDIT.md, the bubble. */
function bubbleState(personDiets, g, hits, bookNote){
  if (hits.length) return 'red';
  if (personDiets.indexOf(DIET_OTHER) > -1 && !g.dineDnote) return 'red';
  if (g.dineDnote || g.dineNote ||
      g.prevNote || g.prevDnote || (g.prevDiets || []).length) return 'amber';
  if (bookNote) return 'grey';
  return '';
}

function openNotes(title, g, hits, bookNote){
  var h = '<div class="pop-who">' + title + '</div>';
  var prev = !!(g.prevNote || g.prevDnote || (g.prevDiets || []).length);

  /* The dietary section: the note and tonight's menu conflicts, and it only
     appears when there is something dietary to show. It used to be headed
     "Tonight's dining notes" and to print "No note from the guest yet" even
     when only a dinner note existed: an empty section apologising for being
     empty, above the one real note. A dietary is person-level now, so it
     needs no tonight stamp; the dinner notes below keep theirs. 20 Aug. */
  if (hits.length || g.dineDnote) {
    h += '<div class="pop-h dh">Dietary notes</div>';
    if (hits.length) {
      var byDish = {};
      hits.forEach(function(x){ (byDish[x.dish] = byDish[x.dish] || []).push(x.diet); });
      h += '<div class="pop-t">' + Object.keys(byDish).map(function(dk){

      }).join('<br>') + '</div>';
    }
    if (g.dineDnote) h += '<div class="pop-t">\u201C' + g.dineDnote + '\u201D</div>';
  }
  if (g.dineNote) {
    h += '<div class="pop-h">Dinner notes</div>' +
         '<div class="pop-t">\u201C' + g.dineNote + '\u201D</div>';
  }
  /* The guest's context for the whole stay, off the reservation. It is why
     a bubble can be grey: something for the house to read that the kitchen

  if (bookNote) {
    h += '<div class="pop-h">Booking notes</div>' +
         '<div class="pop-t">\u201C' + esc(bookNote) + '\u201D</div>';
  }

  if (prev) {
    h += '<div class="pop-h dh">Previous dining notes</div>';
    if ((g.prevDiets || []).length) {
      h += '<div class="pop-t">' + dietHTML(g.prevDiets, ', ', 'alrg') + '</div>';
    }
    if (g.prevDnote) h += '<div class="pop-t">Dietary notes \u00b7 \u201C' + g.prevDnote + '\u201D</div>';
    if (g.prevNote)  h += '<div class="pop-t">Dinner notes \u00b7 \u201C' + g.prevNote + '\u201D</div>';
    h += '<div class="pop-t"><i>From an earlier night, not confirmed for ' +
         'tonight. Ask before cooking to it.</i></div>';
  }

  h += '<button class="btn solid" style="width:100%" id="npClose">Close</button>';
  sheet.innerHTML = h;
  document.getElementById('npClose').onclick = close;
  showSheet();
}

// tiles follow the same order as the bookings list: combined rooms
// adjacent under the lowest number, ringed as one group
function computeTileOrder(){
  var order = [], placed = {};
  for (var n=1; n<=ROOMS; n++){
    var rm = String(n);
    if (placed[rm]) continue;
    var gid = groupOf(rm);
    var members = gid ? combined[gid].rooms.map(String).filter(function(m){
      return Number(m)>=1 && Number(m)<=ROOMS; }) : [rm];
    members.sort(function(a,b){ return Number(a)-Number(b); });
    members.forEach(function(m){ placed[m]=true; });
    order.push({ grouped: !!gid && members.length>1, members: members });
  }
  return order;
}

function roomTile(n){
  var st = roomState(n);
  /* Two empty states, and they are not the same question. A villa with nobody
     booked into it is vacant: there is nothing to chase. A villa with a guest
     in it who has not answered is awaiting: somebody has to ask them. The
     default is vacant, and a Mews reservation is what turns it to awaiting for
     every night of that stay. */
  var cls = hasGuestProfile(roomguests[String(n)]) ? 'room await' : 'room vacant';
  var pax = '';
  if (st){
    if (st.g.status==='in'){ cls='room in'; pax=(st.g.pax||1)+'p'; }
    else if (st.g.status==='out'){ cls='room out'; }
    else if (st.g.status==='vacant'){ cls='room vacant'; }
  }

  var mark = '';
  /* Opened tonight's link and has not answered tonight. Both halves matter.

     Until 19 Aug this was inferred from a guest written /roomguests record,
     which worked until the guest page stopped writing one on 17 Aug. The
     condition survived and its evidence did not, so no villa had carried this
     icon for two days. It now reads the mark the guest page writes per night,
     which is also what makes it mean tonight rather than some night. */
  if (!st && openedTonight(n)) {
    mark = '<span class="mark seen">'+ICON_LINK+'</span>';   // opened, no answer yet
  }
  if (st && (st.g.status==='in' || st.g.status==='out')) {
    var ic;
    if (st.override && st.guest && st.g.status === 'out') ic = ICON_GUEST_X;  // guest replied, staff cancelled
    else if (st.src === 'digital') ic = ICON_GUEST;
    else ic = ICON_STAFF;
    mark = '<span class="mark">'+ic+'</span>';
  }
  var b=document.createElement('button');
  b.className=cls + (selected[n] ? ' sel' : '');
  b.innerHTML=mark+'<span class="room-n">'+n+'</span><span class="room-p">'+pax+'</span>';
  b.onclick=function(){
    if (selectMode){
      if (selected[n]) delete selected[n]; else selected[n]=true;
      render();
      selCountUpdate();
    } else {
      openRoom(n, st);
    }
  };
  return b;
}

function paintTiles(){
  var grid = document.getElementById('rooms');
  grid.innerHTML='';
  computeTileOrder().forEach(function(unit){
    var host = grid;
    if (unit.grouped){
      host = document.createElement('div');
      host.className = 'tilegrp';
      host.style.gridColumn = 'span ' + Math.min(unit.members.length, 6);
      host.style.gridTemplateColumns = 'repeat(' + Math.min(unit.members.length, 6) + ',1fr)';
      grid.appendChild(host);
    }
    /* One bad record must cost one tile, not every tile after it. On 20 Aug
       a single villa's data killed the loop mid-render: three tiles drawn,
       fourteen missing, stats left as dashes, and nothing anywhere said why.
       The bad villa now renders as a tile that names its own error, because
       the phones this board lives on have no console to read. */
    unit.members.forEach(function(m){
      try { host.appendChild(roomTile(Number(m))); }
      catch(e){
        console.error('villa '+m+' tile failed:', e);
        var t = document.createElement('button');
        t.className = 'room vacant';
        t.innerHTML = '<span class="room-n">'+m+'</span>'+
          '<span class="room-p" style="font-size:8px;color:var(--red)">'+
          String(e && (e.message||e)).slice(0,60)+'</span>';
        host.appendChild(t);
      }
    });
  });
}

function render(){
  paintTiles();

  // one combined bookings list
  var rows = [];

  for (var n2=1; n2<=ROOMS; n2++){
    var s = roomState(n2);
    if (s && s.g.status==='in') rows.push({ g:s.g, room:n2, src:s.src, key:s.key });
  }

  /* An external diner has no villa, so there is no carried forward record to
     confuse theirs with. Everything they have said is tonight's. */
  for (var k in responses){
    var g = responses[k];
    if (!g.room && g.status==='in' && !cancelledExt[k] && !manual['extcancel-'+k])
      rows.push({ g:withDineProvenance(Object.assign({}, g), g, null),
                  room:null, src:'digital', key:k });
  }
  for (var k in manual){
    if (k.indexOf('ext-')!==0) continue;
    if (manual[k].status!=='in') continue;
    rows.push({ g:withDineProvenance(Object.assign({}, manual[k]), manual[k], null),
                room:null, src:'manual', key:k });
  }

  var covers=0, notDining=0, awaiting=0;
  rows.forEach(function(r){ covers += (r.g.pax||1); });
  for (var n2=1; n2<=ROOMS; n2++){
    var s = roomState(n2);
    /* Only a villa with somebody in it is awaiting an answer. An empty villa
       is not an outstanding question, and counting it as one meant the figure
       read seventeen on a quiet night and nobody could act on it. */
    if (!s){ if (hasGuestProfile(roomguests[String(n2)])) awaiting++; }
    else if (s.g.status==='out') notDining++;    // declined rooms
  }

  var el = document.getElementById('listBookings');
  el.innerHTML='';
  if(!rows.length) el.innerHTML='<div class="empty">No bookings yet</div>';

  // combined rooms sit together, boxed, under the lowest room number;
  // members without an answer yet show as quiet stubs so the pairing reads
  function unitKeyOf(r){ return r.room ? (groupOf(r.room) || 'room-'+r.room) : 'ext-'+r.key; }
  function unitSort(rowlist){
    var units = {};
    rowlist.forEach(function(r){
      var k = unitKeyOf(r);
      (units[k] = units[k] || []).push(r);
    });
    // stubs for grouped rooms that haven't answered
    for (var gid in combined){
      if (!units[gid]) continue;
      var have = units[gid].map(function(r){ return String(r.room); });
      (combined[gid].rooms||[]).forEach(function(rm){
        if (have.indexOf(String(rm)) < 0) units[gid].push({ room:String(rm), stub:true, g:{} });
      });
      units[gid].sort(function(a,b){ return Number(a.room)-Number(b.room); });
    }
    var keys = Object.keys(units);
    function low(k){
      var rs = units[k];
      var roomNums = rs.filter(function(r){ return r.room; }).map(function(r){ return Number(r.room); });
      return roomNums.length ? Math.min.apply(null, roomNums) : 1000;   // externals last
    }
    keys.sort(function(a,b){ return low(a)-low(b); });
    return keys.map(function(k){ return { gid:(combined[k]?k:null), members:units[k] }; });
  }

  unitSort(rows).forEach(function(unit){
    var host = el;
    if (unit.gid && unit.members.length > 1){
      host = document.createElement('div');
      host.className = 'grpbox';
      el.appendChild(host);
    }
    unit.members.forEach(function(r){
      if (r.stub){
        var st = document.createElement('div');
        st.className = 'row stubrow';
        var kn = roomguests[String(r.room)] || {};
        /* The dietaries belong to the person, not to the night, so a villa
           that has not answered TONIGHT still shows its allergy. Without this
           the allergy looked stuck to the date it was typed on: flip the board
           a day forward, the villa turns into an awaiting stub, and the stub
           said nothing but the name. */
        var od = overlayReservationDiets({}, r.room);
        var stubPre = PREARRIVAL_BY_VILLA[String(r.room)];
        var dline = (od.diets && od.diets.length)
          ? '<div class="row-sub">' + dietHTML(od.diets) +
            (od.dnote ? ' \u00b7 ' + od.dnote : '') + '</div>'
          /* The declared "none" is as much the person's as an allergy is,
             so the stub shows it the same way tonight's rows do. */
          : (stubPre && stubPre.noDiets
              ? '<div class="dietline"><span class="dpill dpill-ok">No dietaries</span></div>'
              : '');
        /* The awaiting stub carries the companion too: a villa that has not
           answered tonight is still a named party, and this board is where
           reception looks a booking up mid-service. */
        var second = companionOf(PREARRIVAL_BY_VILLA[String(r.room)], kn);
        st.innerHTML = '<div><div class="row-name"><span class="rm">'+r.room+'</span>'+
          (kn.name ? '  '+kn.name : '')+'</div>'+
          (second ? '<div class="row-sub">With '+esc(second)+'</div>' : '')+
          '<div class="row-sub">Awaiting reply</div>'+dline+'</div>';
        host.appendChild(st);
        return;
      }
      host.appendChild(buildRow(r));
    });
  });

  function buildRow(r){
    var g = r.g;
    var known = (r.room && roomguests[String(r.room)]) || {};
    var shownName = g.name || known.name || '';
    var title;
    if (r.room) {
      title = '<span class="rm">'+r.room+'</span>' + (shownName ? '  '+shownName : '');
    } else {
      title = (g.name || g.phone || 'Guest') + '<span class="tag">External</span>';
    }

    if (g.premenu) title += '<span class="tag">Pre-menu</span>';

    var sub = [];
    /* The second guest, in the small print under the name. The board is
       worked by name, and the person beside the booker is part of who the
       table is. One shared reading - see companionOf in nala-shared.js. */
    var second = r.room
      ? companionOf(PREARRIVAL_BY_VILLA[String(r.room)], known) : '';
    if (second) sub.push('With ' + esc(second));
    var dietLine = '';
    /* The person's dietaries, wherever they were typed. This block used to
       show tonight's answer only, on the old rule that a carried-over dietary
       was not an answer to tonight's invitation. NOTES-AUDIT.md corrected the
       model: there is one dietary list per person and it lives on the
       reservation, because an allergy is not true on Tuesday and false on
       Wednesday. g.diets already carries reservation-first with the night as
       fallback; a row that hid it until somebody re-typed it tonight was the
       bug. The menu conflict check runs on the same list, since the kitchen
       cooks for the person, not for the night's paperwork. */
    var personDiets = fixDietList((g.diets && g.diets.length) ? g.diets : (g.dineDiets || []));
    if (personDiets.length) {
      dietLine = '<div class="dietline">' + personDiets.map(function(x){
        var al = ALLERGENS.indexOf(x) > -1 || /allerg/i.test(x);
        var label = al ? x.replace(/\s*allergy\s*/i,'') : x;
        return '<span class="dpill'+(al?' dpill-al':'')+'">'+label+'</span>';
      }).join('') + '</div>';
    } else if (g.nodiet) {
      /* A dietary answer, not the absence of one, so it rides in the
         dietline like the rest. It feeds neither menuConflicts nor the
         bubble: there is nothing for the kitchen to act on, only the fact
         that we asked and the guest ruled it out. */
      dietLine = '<div class="dietline"><span class="dpill dpill-ok">No dietaries</span></div>';
    }


    var hits = menuConflicts(MENU, personDiets);
    var pre = r.room ? (PREARRIVAL_BY_VILLA[String(r.room)] || null) : null;
    var bookNote = (pre && pre.note) ? String(pre.note) : '';
    var bubState = bubbleState(personDiets, g, hits, bookNote);

    var row = document.createElement('div');
    row.className = 'row' + (hits.length ? ' conflict' : '');
    row.innerHTML =
      '<div class="row-main"><div class="row-name"><span class="nm">'+title+'</span></div>'+
      (sub.length ? '<div class="row-sub">'+sub.join(' · ')+'</div>' : '')+
      '</div>'+
      '<div class="row-right">'+
      (bubState
        ? '<button class="bub'+(bubState==='red' ? ' flag'
                              : bubState==='amber' ? ' kitchen' : ' info')+'">'+
          ICON_BUBBLE+'</button>'
        : '<span class="bub-slot"></span>')+
      '<span class="row-pax">'+(g.pax||1)+' pax</span>'+
      '<span class="edit">'+ICON_EDIT+'</span></div>'+ dietLine;
    var bub = row.querySelector('.bub');
    if (bub) bub.onclick = (function(tt, gg, hh, bn){
      return function(ev){ ev.stopPropagation(); openNotes(tt, gg, hh, bn); };
    })(title, g, hits, bookNote);
    row.querySelector('.edit').onclick = (function(rr){
      return function(ev){
        ev.stopPropagation();
        if (rr.room) openRoom(rr.room, roomState(rr.room));
        else editExt(rr.key, rr.g);
      };
    })(r);
    return row;
  }

  // tables: each combined group is one table; everyone else is their own
  var tblPax = {};   // unit key -> summed pax
  rows.forEach(function(r){
    var unit = r.room ? (groupOf(r.room) || 'room-'+r.room) : 'ext-'+r.key;
    tblPax[unit] = (tblPax[unit]||0) + (r.g.pax||1);
  });
  var sizes = {};
  for (var u in tblPax) sizes[tblPax[u]] = (sizes[tblPax[u]]||0) + 1;
  var tblCount = Object.keys(tblPax).length;
  var parts = Object.keys(sizes).map(Number).sort(function(a,b){return a-b;})
    .map(function(sz){ var n=sizes[sz];
      var W=['','one','two','three','four','five','six','seven','eight','nine','ten'];
      var w=W[sz]||sz; return n+' '+w+(n>1?'s':''); });
  var tl = document.getElementById('tablesLine');
  tl.textContent = parts.length
    ? parts.join(' \u00b7 ') + ' \u00b7 ' + tblCount + (tblCount === 1 ? ' table' : ' tables')
    : '';

  document.getElementById('nCovers').textContent = covers;
  document.getElementById('nOut').textContent    = notDining;
  document.getElementById('nAwait').textContent  = awaiting;
  document.getElementById('tileAwait').className = 'stat' + (awaiting>0 ? ' warn':'');
}

// ── combined tables ────────────────────────────────────────
// /combined/<date> = { <gid>: { rooms:["10","11"] } } - rooms dining as one table
var combined = {};

function groupOf(room){
  for (var gid in combined){
    var rs = (combined[gid] && combined[gid].rooms) || [];
    if (rs.indexOf(String(room)) > -1) return gid;
  }
  return null;
}
function groupMates(room){
  var gid = groupOf(room);
  if (!gid) return [];
  return combined[gid].rooms.filter(function(r){ return String(r)!==String(room); });
}
function saveCombined(prev){
  api('/combined/'+todayKey(), 'PUT', combined)
    .catch(function(){
      combined = prev || {};   // failed write: roll back so the screen matches the database
      render();
    });
}

// ── multi-select ───────────────────────────────────────────
var selectMode = false;
var selected = {};

var selBar = document.getElementById('selBar');

function selEqualsGroup(){
  // the current selection exactly matches one existing group -> offer uncombine
  var sel = Object.keys(selected).map(String).sort();
  if (sel.length < 2) return null;
  for (var gid in combined){
    var rs = ((combined[gid] && combined[gid].rooms) || []).map(String).sort();
    if (rs.length === sel.length && rs.join(',') === sel.join(',')) return gid;
  }
  return null;
}
function selCountUpdate(){
  var n = Object.keys(selected).length;
  document.getElementById('selCount').textContent =
    n ? n + (n===1 ? ' room selected' : ' rooms selected') : 'Tap rooms to select';
  var cb = document.getElementById('sbComb');
  cb.disabled = n < 2;
  cb.textContent = selEqualsGroup() ? 'Seat separately' : 'Seat together';
  selBar.className = 'selbar' + (selectMode ? ' show' : '');
}

function exitSelect(){
  selectMode = false;
  selected = {};
  var tgl = document.getElementById('selToggle');
  tgl.textContent = 'Select multiple';
  tgl.className = '';
  selBar.className = 'selbar';
  render();
}

document.getElementById('selToggle').onclick = function(e){
  e.preventDefault();
  selectMode = !selectMode;
  selected = {};
  this.textContent = selectMode ? 'Cancel' : 'Select multiple';
  this.className = selectMode ? 'active' : '';
  selCountUpdate();
  render();
};

function applyToSelected(status){
  var keys = Object.keys(selected);
  if (!keys.length) return;

  keys.forEach(function(n){
    if (status === null){ saveManual('room-'+n); return; }
    // if the guest replied for this room, mark it as an override
    var hasGuest = false;
    for (var k in responses){ if (String(responses[k].room) === String(n)) hasGuest = true; }
    var prev = manual['room-'+n];
    var keepPax = (status==='in' && prev && prev.status==='in' && prev.pax) ? prev.pax : null;
    var rec = { status:status, pax:(status==='in' ? (keepPax||2) : 0), room:String(n), source:'manual' };
    if (hasGuest) rec.override = true;
    /* Same stamp as the single villa path. Without it a multi-select vacant
       would be dropped by the next render, since an unstamped vacant on a PMS
       villa reads as stale. */
    var kn = roomguests[String(n)] || {};
    if (status === 'vacant' && kn.bookingId) rec.pmsUpdated = kn.pmsUpdated || null;
    saveManual('room-'+n, withExtras('room-'+n, rec));
  });

  exitSelect();
}

document.getElementById('sbComb').onclick = function(){
  var keys = Object.keys(selected).map(String);
  if (keys.length < 2) return;
  var prev = JSON.parse(JSON.stringify(combined));
  var gid = selEqualsGroup();
  if (gid){
    delete combined[gid];               // uncombine
  } else {
    // pull the rooms out of any existing groups first
    keys.forEach(function(r){
      var g = groupOf(r);
      if (g){
        combined[g].rooms = combined[g].rooms.filter(function(x){ return String(x)!==r; });
        if (combined[g].rooms.length < 2) delete combined[g];
      }
    });
    combined['g'+Date.now()] = { rooms: keys };
  }
  saveCombined(prev);
  exitSelect();
};

document.getElementById('sbVac').onclick   = function(){ applyToSelected('vacant'); };
document.getElementById('sbDin').onclick   = function(){ applyToSelected('in'); };
document.getElementById('sbOut').onclick   = function(){ applyToSelected('out'); };
document.getElementById('sbClear').onclick = function(){ applyToSelected(null); };
document.getElementById('sbDone').onclick  = exitSelect;

// ── sheet ──────────────────────────────────────────────────
var bd = document.getElementById('backdrop');
var sheet = document.getElementById('sheet');
bd.onclick = function(e){ if(e.target===bd) close(); };
var actionsEl = document.querySelector('.actions');
function showSheet(){ bd.className='backdrop show'; if(actionsEl) actionsEl.classList.add('hidden'); }
function close(){ bd.className='backdrop'; if(actionsEl) actionsEl.classList.remove('hidden'); }

// replaces the whole sheet with a single question, so nothing else is on screen
function confirmSheet(title, question, confirmLabel, onConfirm, onBack){
  sheet.innerHTML =
    '<h3>'+title+'</h3>'+
    '<div class="note-box">'+question+'</div>'+
    '<button class="opt out" id="cYes">'+confirmLabel+'</button>'+
    '<button class="opt quiet" id="cNo">Back</button>';
  showSheet();
  revealAction();
  document.getElementById('cYes').onclick = onConfirm;
  document.getElementById('cNo').onclick  = onBack;
}

function revealAction(){
  requestAnimationFrame(function(){
    var target = sheet.querySelector('.opt.solid') || sheet.querySelector('.opt');
    if (target && target.scrollIntoView) {
      target.scrollIntoView({ block:'nearest', behavior:'smooth' });
    }
  });
}

// one pax picker for every sheet that needs it
function paxPicker(max, get, set){
  function paint(){
    var r=document.getElementById('paxRow'); if(!r) return;
    r.innerHTML='';
    /* A read-only role still needs the number - covers are the chef's whole
       reason for opening this - but not the picker. Six buttons that set a
       value nothing can save is a control that does nothing. Plain
       typography instead, which is what a fact is supposed to wear.    */
    if (window.CAN_EDIT === false){
      var f=document.createElement('span');
      f.className='pax-fact'; f.textContent=get();
      r.appendChild(f); return;
    }
    for(var i=1;i<=max;i++)(function(v){
      var b=document.createElement('button');
      b.className='pax'+(get()===v?' on':''); b.textContent=v;
      b.onclick=function(){ set(v); paint(); };
      r.appendChild(b);
    })(i);
  }
  paint();
}

function guestDataHTML(g, knownName, known){
  g = g || {};
  known = known || {};
  var name = g.name || knownName || '';
  var top = [];
  if (name) top.push(name);
  if (g.phone) top.push(g.phone);
  /* Mews knows how many people are booked into the villa. The app was storing
     that and showing it nowhere, which is half of the brief's complaint about
     a board with missing guest data.

     Deliberately NOT folded into the covers picker below. Covers is how many
     are eating tonight and belongs to the kitchen; this is how many are
     staying and belongs to Mews. They are often the same and sometimes are
     not, and defaulting covers to it would silently inflate the kitchen's
     count for every villa that has not replied. Shown as a fact, not as an
     answer.                                                                */
  /* The head count used to sit here as well. It is a row in the snapshot now,
     and printing it twice on one sheet was what pushed a long name onto a
     second line and into the menu button. */
  var d = dietHTML(g.diets, ' \u00b7 ', 'alrg');
  var h = '';
  /* The name is the control. An eye beside it was one more thing in a row
     already tight against the menu button, and the name is the obvious thing
     to press for more about the person. Rendered as a button only when there
     is something behind it, so nothing is offered that leads nowhere. */
  if (top.length){
    var line = top.join(' \u00b7 ');
    h += snapshotRows(g, known).length
      ? '<button class="gd-name" id="gdEye" type="button" aria-expanded="false"'+
        ' aria-controls="gdPanel" title="Guest details">'+ line +'</button>'
      : line;
  }
  /* The eye goes beside the name, and only when there is something behind it.
     A control that opens an empty panel teaches people not to press it. */

  if (d) h += '<span class="gd-sub">'+d+'</span>';
  if (g.note)  h += '<span class="gd-note">Dinner notes \u00b7 \u201C'+g.note+'\u201D</span>';
  if (g.dnote) h += '<span class="gd-note">Dietary notes \u00b7 \u201C'+g.dnote+'\u201D</span>';
  h += '<div class="gd-panel" id="gdPanel"></div>';
  return h ? '<div class="gd">'+h+'</div>' : '';
}

function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* One night is not a range, and "18 Aug to 18 Aug" reads like a mistake. */
function stayLine(known){
  var a = known.arrives, d = known.departs;
  if (!a && !d) return null;
  var txt = (a ? prettyDay(a) : '?') + ' to ' + (d ? prettyDay(d) : '?');
  var n = nightsBetween(a, d);
  if (n != null) txt += ' \u00b7 ' + n + (n === 1 ? ' night' : ' nights');
  return txt;
}

function prettyDay(v){
  var d = new Date(String(v).slice(0,10) + 'T00:00:00');
  if (isNaN(d)) return String(v).slice(0,10);
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + M[d.getMonth()];
}

function nightsBetween(a, d){
  if (!a || !d) return null;
  var x = new Date(String(a).slice(0,10)+'T00:00:00');
  var y = new Date(String(d).slice(0,10)+'T00:00:00');
  if (isNaN(x) || isNaN(y)) return null;
  var n = Math.round((y - x) / 86400000);
  return n >= 0 ? n : null;
}

/* What the app actually holds, in the order reception asks for it. Rows with
   no value are left out rather than shown empty: a blank beside a label reads
   as data that failed to load, and this panel is meant to settle questions
   rather than raise them. */
var SNAP_VILLA = null;

function snapshotRows(g, known){
  g = g || {}; known = known || {};
  var rows = [];
  var stay = stayLine(known);
  if (stay) rows.push(['Staying', stay]);
  if (known.adults)
    rows.push(['In villa', known.adults + (Number(known.adults) === 1 ? ' adult' : ' adults')]);
  var phone = g.phone || known.phone;
  if (phone) rows.push(['Phone', spacedPhone(phone), false, telHref(phone)]);
  if (known.number) rows.push(['Booking', known.number]);
  /* groupId is on every Mews reservation, not only the ones that span villas,
     so its presence proves nothing and reading it that way put "Booked with
     another villa" on all seventeen. The real question is whether another
     villa tonight carries the same group, which groupVillas answers, and
     naming the villa is what reception actually wants: it is the difference
     between a fact and a riddle. */
  var mates = (typeof groupVillas === 'function' && SNAP_VILLA != null)
    ? groupVillas(roomguests, SNAP_VILLA) : [];
  if (mates.length)
    rows.push(['Group', 'Booked with villa ' + mates.join(' & ')]);
  /* Where the record came from, and whether the guest has been in touch. Two
     different facts, which the app is careful never to conflate, so they are
     two rows rather than one sentence.

     The first version made them one sentence and got it wrong: it read the
     source flag on the villa record, which says only that Mews wrote it, and
     announced that a guest who had plainly answered had never opened their
     link. Whether they answered is what the answer itself says. */
  if (known.bookingId) rows.push(['Source', 'From Mews']);
  else if (known.name || known.phone)
    rows.push(['Source', 'The guest opened their link. Not in Mews']);
  if (g.status)
    rows.push(['Tonight', g.by === 'staff'
      ? 'Answered at the desk'
      : 'The guest answered themselves']);
  else if (known.bookingId && known.source !== 'mews')
    rows.push(['Tonight', 'Link opened, no answer yet']);
  return rows;
}

/* Opening and shutting the panel, and going after the pre-arrival answers only
   when somebody asks for them. Those live under /bookings/<id>/prearrival,
   which this board does not read: fetching them for eighteen villas on every
   render to serve the one villa somebody opens would be eighteen requests an
   hour for nothing. So the eye pays for itself, once, on the villa in hand. */
var PRE_CACHE = {};
var INT_CACHE = {};
var SPA_CACHE = {};   /* /spa/<booking>: the wellness row's first source */

function wireGuestPanel(g, known){
  var eye = document.getElementById('gdEye');
  var panel = document.getElementById('gdPanel');
  if (!eye || !panel) return;
  known = known || {};
  /* The edit-mode flag rides on the panel element because paint() is built
     inside loadPrearrival, a sibling function: a closure variable here
     would be out of its reach. Shut on every wiring. */
  panel._intEditing = false;

  panel.innerHTML = panelHTML(snapshotRows(g, known));

  function setOpen(open){
    panel.classList.toggle('open', open);
    eye.classList.toggle('on', open);
    eye.setAttribute('aria-expanded', open ? 'true' : 'false');
    /* The panel drops DOWN from the name into the sheet's standing bottom
       padding: the padding is permanent, so the card sits in one place on
       every login and opening the panel lays nothing out. Floating it up
       instead was tried on 20 Aug and collided with the top of the screen
       on the logins whose sheets are tall. The panel's height is capped to
       the room the sheet actually has below the name, with its own scroll
       for the booking that carries more than the room can take. */
    if (open){
      /* Measured against the VIEWPORT, not the sheet. The sheet's bottom is
         wherever that login's buttons end, so measuring it gave the chef a
         panel allowance that ran off the screen while the admin's fitted:
         the one bug reported twice on 20 Aug. The screen is the same fact
         for every login, so the panel's room is too, and anything longer
         scrolls inside the panel. */
      var eyR = eye.getBoundingClientRect();
      var room = Math.max(140,
        Math.floor((window.innerHeight || 800) - eyR.bottom - 28));
      panel.style.maxHeight = room + 'px';
    }
  }

  /* Delegated, because the panel's contents are replaced when the pre-arrival
     answers land and a handler bound to the old Close would go with them. */
  panel.addEventListener('input', function(e){
    var t = e.target;
    if (t && t.id === 'gdIntNote'){
      var sv = document.getElementById('gdIntSave');
      var it = INT_CACHE[known.bookingId];
      if (sv) sv.disabled =
        t.value.trim() === ((it && it.note) || '').trim();
    }
  });
  panel.addEventListener('click', function(e){
    var t = e.target;
    if (t && t.id === 'gdIntEdit'){
      panel._intEditing = true;
      if (panel._paint) panel._paint();
      var ta = document.getElementById('gdIntNote');
      if (ta) try { ta.focus(); } catch (err) {}
      return;
    }
    if (t && t.id === 'gdIntSave' && !t.disabled){
      var ta = document.getElementById('gdIntNote');
      if (!ta || !known.bookingId) return;
      var note = ta.value.trim();
      t.disabled = true; t.textContent = 'Saving\u2026';
      /* The front desk's own write shape for the same node: the note, when,
         and who, PATCHed so the fromMews original survives a rewrite. */
      api('/internal/' + known.bookingId, 'PATCH',
          { note: note, editedAt: new Date().toISOString(),
            editedBy: window.NALA_ME || '' })
        .then(function(){
          /* The empty string kept as the empty string. Collapsing it to null
             here would put the cache back into the state the read was just
             fixed for, and the Mews original would return on the next open
             without a request being made. */
          INT_CACHE[known.bookingId] = { ok: true, note: note };
          /* Back to reading: the saved note takes its place as a row. */
          panel._intEditing = false;
          if (panel._paint) panel._paint();
        })
        .catch(function(){
          /* api() already showed the toast; the button owns up too rather
             than sitting on "Saving" forever. */
          t.disabled = false; t.textContent = 'Save staff notes';
        });
      return;
    }
    if (t && t.id === 'gdClose'){
      setOpen(false);
      /* Back to the control that opened it, so the next thing pressed is a
         deliberate choice rather than whatever happened to be under a thumb
         once the panel collapsed. */
      try { eye.focus(); } catch (err) {}
    }
  });

  eye.onclick = function(e){
    e.stopPropagation();
    var open = !panel.classList.contains('open');
    setOpen(open);
    if (open) loadPrearrival(known, panel, g);
  };

  /* Floating over the card means a tap outside it is a tap on something the
     panel is covering. Shut first and let that tap land nowhere, rather than
     have somebody set a villa vacant through a panel they were trying to get
     rid of. */
  panel.addEventListener('click', function(e){ e.stopPropagation(); });
  var host = document.getElementById('sheet') || document;
  host.addEventListener('click', function(e){
    /* Capture phase, so this runs BEFORE the handlers on the panel and the
       name. That is what makes the tap land nowhere, and it is also why the
       name has to be exempt: without this check the capture shut the panel
       and the name's own handler then reopened it, so the name could open the
       panel and never close it again. */
    if (eye.contains(e.target) || panel.contains(e.target)) return;
    if (!panel.classList.contains('open')) return;
    setOpen(false);
    /* Swallowed, not merely intercepted. Closing without stopping the event
       let the tap carry on to whatever the panel was covering, so dismissing
       the snapshot could set a villa vacant on the way past. The first tap
       shuts the panel and does nothing else; the second does what it looks
       like it does. */
    e.stopPropagation();
    e.preventDefault();
  }, true);
}

/* Every render of the panel ends with its own way out. Put here rather than at
   each call site so a path that forgets it cannot exist. */
function panelHTML(rows){
  return rowsHTML(rows) +
    '<button class="gd-close" id="gdClose" type="button">Close details</button>';
}

function rowsHTML(rows){
  return rows.map(function(r){
    /* A fourth entry makes the value a link. Only the phone uses it: reception
       reads this panel with the guest in front of them or the phone in hand,
       and a number you have to retype is a number you get wrong. iOS was
       linking it by guessing at the text, which works until it does not. */
    var v = r[3] ? '<a class="gd-tel" href="'+esc(r[3])+'">'+esc(r[1])+'</a>'
                 : esc(r[1]);
    return '<div class="gd-row"><div class="gd-k">'+esc(r[0])+'</div>'+
           '<div class="gd-v'+(r[2] ? ' quiet' : '')+'">'+v+'</div></div>';
  }).join('');
}

/* Mews stores an Australian mobile as +61411426666 and a GuestTouch link
   carries 0411426666. Same number, and reception should not have to translate
   between them at the desk, so both are shown the way it is said out loud.

   Anything that is not an Australian mobile is left exactly as it came:
   inventing spaces in a landline or an overseas number makes it harder to
   read, not easier, and guessing wrong about a number somebody is about to
   dial is worse than leaving it plain. */
function auMobile(p){
  var d = String(p == null ? '' : p).replace(/[^\d]/g, '');
  if (/^61(4\d{8})$/.test(d)) return '0' + d.slice(2);
  if (/^04\d{8}$/.test(d))    return d;
  if (/^4\d{8}$/.test(d))     return '0' + d;   // a lost leading zero
  return null;
}

function spacedPhone(p){
  var m = auMobile(p);
  if (!m) return String(p);
  return m.slice(0,4) + ' ' + m.slice(4,7) + ' ' + m.slice(7);
}

/* The plus is kept. Stripping it turns an international number into a local
   one and the call goes somewhere else entirely, which is the kind of bug that
   only shows up when it matters. */
function telHref(p){
  var m = auMobile(p);
  if (m) return 'tel:' + m;
  var raw = String(p == null ? '' : p).replace(/[^\d+]/g, '');
  return 'tel:' + raw;
}

var ETA_WORDS = { before2:'Before 2pm', '14':'Around 2pm', '15':'Around 3pm',
                  '16':'Around 4pm', '17':'Around 5pm', after5:'After 5pm' };
/* New keys and old: records written before 23 Aug hold mix and out. */
var APPROACH_WORDS = { most:'Most nights', few:'A few nights',
                       once:'Probably just once', unsure:'Not sure yet',
                       mix:'A mix of meals in and out', out:'Mostly eating out' };

/* The panel's short day: Thu 28, the styleguide's own shape. */
function wellDayLabel(key){
  var d = parseDepDate(key); if (!d) return String(key);
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + d.getDate();
}

function preRows(pre, spa){
  var p = (pre && typeof pre === 'object') ? pre : null;
  var rows = [];
  if (p && p.arriveSlot)
    rows.push(['Arriving', ETA_WORDS[p.arriveSlot] || String(p.arriveSlot)]);
  /* No arrival note here by decision, 20 Aug: it dies at check-in and
     belongs to the arrivals views. This panel is the booking's notes. */
  if (p && p.purpose)    rows.push(['Here for', p.purpose]);
  if (p && p.occasion)   rows.push(['Occasion', p.occasion]);
  if (p && p.approach)
    rows.push(['Dining', APPROACH_WORDS[p.approach] || String(p.approach)]);
  /* Wellness is the Spa board's truth, not the form's - the front desk
     sheet's rule of 27 Aug, kept here so the two views cannot disagree:
     a record at /spa/<booking> outranks the form's Interested, which
     stands in only while nobody has answered it. Spa rows render even
     with no form at all: a desk-added massage belongs to the booking. */
  var answered = false;
  Object.keys(spa || {}).sort().forEach(function(tid){
    var t = spa[tid];
    if (!t || typeof t !== 'object' || !t.status) return;
    if (t.source === 'prearrival') answered = true;
    var two = t.qty === 2 ? 'Two massages \u00B7 ' : '';
    var when = (t.day ? wellDayLabel(t.day) : '') +
               (t.time ? ' \u00B7 ' + spaSlotLabel(t.time) : '');
    if (t.status === 'booked')
      rows.push(['Wellness', two + 'Booked \u00B7 ' + when +
                 (t.manual ? ' \u00B7 approved at the desk' : '')]);
    else if (t.status === 'suggested')
      rows.push(['Wellness', two + 'Suggested ' + when + ' \u00B7 waiting on the guest']);
    else if (t.status === 'requested')
      rows.push(['Wellness', two + 'Asked' +
                 (t.reqDay ? ' \u00B7 ' + wellDayLabel(t.reqDay) : '') +
                 (t.reqTime ? ' \u00B7 ' + t.reqTime : '') +
                 ' \u00B7 waiting on the masseuse']);
    else if (t.status === 'declined')
      rows.push(['Wellness', 'Declined' + (t.note ? ' \u00B7 ' + t.note : '') +
                 (t.told ? ' \u00B7 guest told' : ' \u00B7 let the guest know')]);
  });
  if (p && p.wellness && !answered)
    rows.push(['Wellness', 'Interested'
      + (p.wellDay ? ', ' + wellDayLabel(p.wellDay) : '')
      + (p.wellTime ? ' ' + p.wellTime : '')
      + ' \u00B7 waiting on the masseuse']);
  if (!p) return rows;
  if (pre.note)       rows.push(['Booking notes', '\u201C'+pre.note+'\u201D']);
  /* The dietaries themselves, not only the note about them. This panel showed
     the note and skipped the list, so an allergy on the reservation was
     invisible here exactly when the viewed night had no dinner cell to carry
     a copy. One list per person: it lives on the reservation. */
  if (pre.diets && pre.diets.length)
    rows.push(['Dietaries', fixDietList(pre.diets).join(' \u00b7 ')]);
  if (pre.dnote)      rows.push(['Dietary notes', '\u201C'+pre.dnote+'\u201D']);
  return rows;
}

function loadPrearrival(known, panel, g){
  var id = known.bookingId;
  var base = snapshotRows(g, known);
  if (!id){
    /* No booking means no pre-arrival form was ever sent, which is worth
       saying: an empty panel looks like a failed load. */
    if (!base.length)
      panel.innerHTML = panelHTML([['', 'Nothing recorded for this villa yet', true]]);
    return;
  }
  var paint = panel._paint = function(){
    var extra = preRows(PRE_CACHE[id], SPA_CACHE[id]);
    /* The staff note is the whole team's, decided 20 Aug: every staff
       login reads it and writes it, because the chef holding the phone
       at service is exactly who it is for. The rules enforce the only
       real boundary, staff against guest. The editor renders only when
       the read SUCCEEDED: on a refused or failed read there is no
       section at all, both because not existing is the correct
       rendering of not being allowed, and because an editor opened on
       an unverified blank would invite overwriting a note nobody saw. */
    var it = INT_CACHE[id];
    /* Reading first: a saved note renders as a row like every other note,
       in full. The box is a MODE, entered by asking to edit and left by
       saving, because a note permanently stuck inside a small editor
       cannot be read, which was the reported problem with the first
       version of this. */
    if (it && it.ok && it.note && !panel._intEditing)
      extra = extra.concat([['Staff notes', '\u201C'+it.note+'\u201D']]);
    var body = rowsHTML(base.concat(
      extra.length ? extra : [['', 'No pre-arrival answers yet', true]]));
    if (it && it.ok){
      if (panel._intEditing){
        body += '<div class="gd-int"><label for="gdIntNote">Staff notes</label>'
              + '<textarea id="gdIntNote" rows="3">'
              + esc(it.note || '') + '</textarea>'
              + '<button class="gd-int-save" id="gdIntSave" type="button"'
              + ' disabled>Save staff notes</button></div>';
      } else {
        body += '<button class="gd-int-link" id="gdIntEdit" type="button">'
              + (it.note ? 'Edit staff notes' : 'Add staff notes')
              + '</button>';
      }
    }
    panel.innerHTML = body +
      '<button class="gd-close" id="gdClose" type="button">Close details</button>';
  }
  if (PRE_CACHE[id] !== undefined && INT_CACHE[id] !== undefined &&
      SPA_CACHE[id] !== undefined){ paint(); return; }
  panel.innerHTML = panelHTML(base.concat([['', 'Looking for the pre-arrival answers', true]]));
  var pPre = PRE_CACHE[id] !== undefined ? Promise.resolve()
    : api('/bookings/'+id+'/prearrival').then(function(pre){ PRE_CACHE[id] = pre || null; });
  var pSpa = SPA_CACHE[id] !== undefined ? Promise.resolve()
    : api('/spa/'+id).then(function(s){ SPA_CACHE[id] = s || null; })
        .catch(function(){ SPA_CACHE[id] = null; });
  var pInt = INT_CACHE[id] !== undefined ? Promise.resolve()
    : api('/internal/'+id).then(function(rec){
        rec = rec || {};
        /* The edited note if there is one, otherwise what Mews said: the
           same precedence the front desk uses for the same node. A rules
           refusal arrives as an error body, not a rejection. */
        /* Presence, not truth. An edited note of '' means somebody cleared
           it on purpose, and collapsing that to the Mews original made a
           cleared note reappear on the next open. */
        INT_CACHE[id] = rec.error ? { ok: false }
                      : { ok: true,
                          note: (rec.note === undefined || rec.note === null)
                                  ? (rec.fromMews || null) : rec.note };
      }).catch(function(){ INT_CACHE[id] = { ok: false }; });
  Promise.all([pPre, pInt, pSpa]).then(paint).catch(function(){
      /* A failed read is not an empty one, and saying "none" here would be a
         lie that reception would act on. */
      panel.innerHTML = panelHTML(base.concat(
        [['', 'Could not load the pre-arrival answers. Usually the connection', true]]));
    });
}

function editRoomDetails(n, st){
  var g = st.g || {};
  var known = (roomguests[String(n)]||{});
  /* The chips open showing the person's dietaries, wherever they were typed.
     The night's record wins when it has any, then the reservation. Opening
     blank on a villa that answered last week is what made an allergy look
     stuck to the date it was typed on. */
  var od = overlayReservationDiets({}, n);
  var diets = fixDietList((g.diets && g.diets.length) ? g.diets : (od.diets || []));
  sheet.innerHTML =
    '<h3>Villa '+n+' \u00b7 details</h3>'+
    '<input class="txt" id="xName" type="text" placeholder="Name" autocomplete="off">'+
    '<input class="txt" id="xPhone" type="tel" placeholder="Phone" autocomplete="off">'+
    '<div class="sheet-label">Dietary requirements</div>'+
    '<div class="chips" id="dietChips"></div>'+
    '<div class="sheet-label" id="xDnoteLab" style="display:none">Dietary notes</div>'+
    '<input class="txt" id="xDnote" type="text" placeholder="Dietary notes" autocomplete="off" style="margin-top:10px;display:none">'+
    '<div class="sheet-label">Dinner notes</div>'+
    '<input class="txt" id="xNote" type="text" placeholder="Dinner notes" autocomplete="off" style="margin-top:14px">'+
    '<button class="opt solid" id="oSave" style="margin-top:8px">Save details</button>'+
    '<button class="opt quiet" id="oBack">Back</button>';
  showSheet();
  revealAction();
  document.getElementById('xName').value  = g.name  || known.name || '';
  document.getElementById('xPhone').value = g.phone || '';
  document.getElementById('xNote').value  = g.note  || '';
  /* The dietary note belongs to the person and rides with the dietaries to
     the reservation. Comments stays a note about tonight. Before this, an
     Other dietary FORCED its explanation into Comments, so the one text that
     must follow the guest was stored in the box that expires at midnight. */
  document.getElementById('xDnote').value = g.dnote || od.dnote || '';
  function syncDnote(){
    var el=document.getElementById('xDnote');
    el.style.display = (diets.length || el.value) ? '' : 'none';
    var lb=document.getElementById('xDnoteLab');
    if (lb) lb.style.display = el.style.display;
  }
  (function paintChips(){
    var box=document.getElementById('dietChips'); box.innerHTML='';
    DIETARIES.concat([DIET_OTHER]).forEach(function(d){
      var b=document.createElement('button');
      b.className='chip'+(diets.indexOf(d)>-1?' on':''); b.textContent=d;
      b.onclick=function(){
        var i=diets.indexOf(d);
        if(i>-1) diets.splice(i,1); else diets.push(d);
        paintChips(); syncDnote();
      };
      box.appendChild(b);
    });
  })();
  syncDnote();
  document.getElementById('oSave').onclick = function(){
    var rec = { status:'in', pax:(g.pax||2), room:String(n), source:'manual' };
    if (st.src==='digital' || st.override) rec.override = true;
    rec.name  = document.getElementById('xName').value.trim();
    rec.phone = document.getElementById('xPhone').value.trim();
    rec.note  = document.getElementById('xNote').value.trim();
    var dn = document.getElementById('xDnote').value.trim();
    if (otherNeedsNote(diets, dn)){
      syncDnote();
      showError('Write the allergy in the dietary note, or it reaches nobody.');
      document.getElementById('xDnote').style.display='';
      document.getElementById('xDnote').focus();
      return;
    }
    rec.diets = diets.slice();
    /* The no-allergies answer survives a details edit, and yields to a
       chosen dietary: the two contradict, and the chips as saved are the
       statement of record. Dropped from the PUT entirely, it read back as
       a deselected pill at the front desk - the same one-fact-two-nodes
       bug the cell exists to end. */
    rec.nodiet = diets.length ? false : !!g.nodiet;
    if (dn) rec.dnote = dn;
    else if (g.dnote) rec.dnote = g.dnote;   // the guest's own dietary note stays theirs
    saveManual('room-'+n, rec);
    persistDietary(n, rec);
    close(); render();
  };
  document.getElementById('oBack').onclick = function(){ openRoom(n, st); };
}

function openRoom(n, st){
  var pax = (st && st.g.pax) || 2;
  var guestAnswer = st && (st.src==='digital' ? st.g : st.guest);
  var isOverride  = st && st.override;
  var knownName   = (roomguests[String(n)]||{}).name;

  function shell(inner){
    var mates = groupMates(n);
    var combHtml = mates.length
      ? '<div class="comb-note">Seated with Villa '+mates.join(' & ')+
        '<button class="comb-undo" id="oUncomb">Seat separately</button></div>'
      : '';
    SNAP_VILLA = n;
    sheet.innerHTML = '<h3>Villa '+n+'</h3>' + combHtml +
      guestDataHTML(st && st.g, knownName, roomguests[String(n)]) + inner;
    SNAP_VILLA = n;
    wireGuestPanel(st && st.g, roomguests[String(n)]);
    showSheet();
    revealAction();
    var u = document.getElementById('oUncomb');
    if (u) u.onclick = function(){
      var prev = JSON.parse(JSON.stringify(combined));
      var gid = groupOf(n);
      if (gid) delete combined[gid];
      saveCombined(prev);
      close(); render();
    };
  }

  function paxBlock(){
    return '<div class="sheet-label">Guests</div><div class="pax-row" id="paxRow"></div>';
  }
  function paintPax(){ paxPicker(6, function(){return pax;}, function(v){pax=v;}); }

  /* Closing and repainting waits for the write now, rather than happening a
     tenth of a second after the tap with nothing said in between. The record
     itself is still updated the moment the button is pressed - saveManual
     does that before its request leaves, and rolls it back itself if the
     request is refused - so only the repaint waits, and what fills the wait
     is the button saying Saving and then Saved. */
  function afterWrite(){ close(); render(); }
  function writeManual(rec){
    return saveFeedback(pressedButton(), function(){
      return saveManual('room-'+n, withExtras('room-'+n, rec));
    }, { done:'Saved ✓', hold:400, then:afterWrite });
  }
  function clearManual(){
    return saveFeedback(pressedButton(), function(){
      return saveManual('room-'+n);
    }, { done:'Saved ✓', hold:400, then:afterWrite });
  }

  // ── staff cancelled a booking the guest had made ────────
  if (isOverride && guestAnswer && st.g.status === 'out') {
    shell(
      '<div class="note-box">Cancelled by staff.<br>'+
      'The guest had confirmed '+(guestAnswer.pax||1)+
      (guestAnswer.pax===1?' guest':' guests')+
      (guestAnswer.name ? ' - '+guestAnswer.name : '')+'.</div>'+
      '<button class="opt solid" id="oRestore">Restore booking</button>'+
      '<button class="opt quiet" id="oClose">Close</button>'
    );
    document.getElementById('oRestore').onclick = clearManual;
    document.getElementById('oClose').onclick = close;
    return;
  }

  // ── staff amended a booking the guest had made ──────────
  if (isOverride && st.g.status === 'in') {
    pax = st.g.pax || 2;
    shell(
      '<div class="note-box">'+
        (guestAnswer
          ? 'Amended by staff.<br>The guest originally confirmed '+(guestAnswer.pax||1)+
            (guestAnswer.pax===1?' guest':' guests')+
            (guestAnswer.name ? ' - '+guestAnswer.name : '')+'.'
          : 'Added by staff.')+
      '</div>'+
      paxBlock()+
      '<button class="opt solid" id="oSave">Update guests</button>'+
      '<button class="opt quiet" id="oDetails">Edit details</button>'+
      '<button class="opt out" id="oCancel">Cancel booking</button>'+
      (guestAnswer ? '<button class="opt quiet" id="oRevert">Revert to guest\u2019s answer</button>' : '')+
      '<button class="opt quiet" id="oClose">Close</button>'
    );
    paintPax();
    document.getElementById('oSave').onclick = function(){
      writeManual({ status:'in', pax:pax, room:String(n), override:true, source:'manual' });
    };
    document.getElementById('oCancel').onclick = function(){
      confirmSheet('Villa '+n, 'Cancel this booking?', 'Yes, cancel booking',
        function(){ writeManual({ status:'out', pax:0, room:String(n), override:true, source:'manual' }); },
        function(){ openRoom(n, st); });
    };
    var rv = document.getElementById('oRevert');
    if (rv) rv.onclick = clearManual;
    document.getElementById('oDetails').onclick = function(){ editRoomDetails(n, st); };
    document.getElementById('oClose').onclick = close;
    return;
  }

  // ── guest answered themselves ───────────────────────────
  if (st && st.src==='digital') {
    if (st.g.status==='in') {
      pax = st.g.pax || 2;
      shell(
        '<div class="note-box">Confirmed by the guest'+
        (st.g.name ? ' - '+st.g.name : '')+'.</div>'+
        paxBlock()+
        '<button class="opt solid" id="oSave">Update guests</button>'+
        '<button class="opt quiet" id="oDetails">Edit details</button>'+
        '<button class="opt out" id="oCancel">Cancel booking</button>'+
        '<button class="opt quiet" id="oClose">Close</button>'
      );
      paintPax();
      document.getElementById('oSave').onclick = function(){
        writeManual({ status:'in', pax:pax, room:String(n), override:true, source:'manual' });
      };
      document.getElementById('oDetails').onclick = function(){ editRoomDetails(n, st); };
      document.getElementById('oCancel').onclick = function(){
        confirmSheet('Villa '+n,
          'Cancel this booking?<br>The guest confirmed it themselves.',
          'Yes, cancel booking',
          function(){ writeManual({ status:'out', pax:0, room:String(n), override:true, source:'manual' }); },
          function(){ openRoom(n, st); });
      };
      document.getElementById('oClose').onclick = close;
    } else {
      shell(
        '<div class="note-box">The guest declined.</div>'+
        paxBlock()+
        '<button class="opt din" id="oIn">Dining after all</button>'+
        '<button class="opt quiet" id="oClose">Close</button>'
      );
      paintPax();
      document.getElementById('oIn').onclick = function(){
        writeManual({ status:'in', pax:pax, room:String(n), override:true, source:'manual' });
      };
      document.getElementById('oClose').onclick = close;
    }
    return;
  }

  // ── no guest answer: plain staff entry ──────────────────
  /* Same source as the tile icon, so the sheet cannot disagree with the tile
     that opened it. The name still comes from the villa record: the mark knows
     a link was pressed, not who pressed it. */
  var seen = openedTonight(n) ? (roomguests[String(n)] || {}) : null;
  shell(
    (!st && seen
      ? '<div class="note-box">'+
        (seen.name ? seen.name+' has' : 'The guest has')+
        ' opened the link but not replied.</div>'
      : '')+
    paxBlock()+
    '<button class="opt din" id="oIn">Dining</button>'+
    (st && st.g.status==='in' ? '<button class="opt quiet" id="oDetails">Edit details</button>' : '')+
    '<button class="opt out" id="oOut">Not dining</button>'+
    '<button class="opt vac" id="oVac">Vacant tonight</button>'+
    (st ? '<button class="opt quiet" id="oClear">Clear</button>' : '')+
    '<button class="opt quiet" id="oClose">Close</button>'
  );
  paintPax();
  document.getElementById('oIn').onclick  = function(){ writeManual({ status:'in',  pax:pax, room:String(n), source:'manual' }); };
  document.getElementById('oOut').onclick = function(){ writeManual({ status:'out', pax:0,  room:String(n), source:'manual' }); };
  /* Vacant contradicts the PMS rather than filling a gap in it, so it warns
     first on a villa Mews knows about. Allowed, not blocked: reception can see
     the villa and Mews cannot. The decision is stamped with the PMS version it
     was made against, so it stands until Mews changes the booking and then
     stops, rather than outliving the facts behind it. */
  document.getElementById('oVac').onclick = function(){
    var kn = roomguests[String(n)] || {};
    var rec = { status:'vacant', pax:0, room:String(n), source:'manual' };
    if (kn.bookingId) rec.pmsUpdated = kn.pmsUpdated || null;
    if (!kn.bookingId) return writeManual(rec);
    /* Dates on screen use the one format in the styleguide. The raw value here
       is a dkey from Mews, which is what the database wants and not what a
       person reads. */
    var dep = kn.departs ? parseDepDate(kn.departs) : null;
    confirmSheet('Villa '+n,
      'Mews has a booking here'+(kn.name ? ' for '+kn.name : '')+
      (dep ? ', departing '+dateLabel(dep) : '')+
      '. Marking it vacant will hold until Mews changes this booking.',
      'Mark vacant anyway',
      function(){ writeManual(rec); },
      function(){ openRoom(n, st); });
  };
  var dt = document.getElementById('oDetails');
  if (dt) dt.onclick = function(){ editRoomDetails(n, st); };
  var cl = document.getElementById('oClear');
  if (cl) cl.onclick = function(){
    confirmSheet('Villa '+n,
      'Clear this room back to awaiting?',
      'Yes, clear',
      clearManual,
      function(){ openRoom(n, st); });
  };
  document.getElementById('oClose').onclick = close;
}

document.getElementById('addExt').onclick = function(e){
  e.preventDefault();
  var pax=2, diets=[], dest=null;   // dest null = external, otherwise room number
  sheet.innerHTML =
    '<h3>Add reservation</h3>'+
    '<div class="seg">'+
      '<button id="segExt" class="on">External</button>'+
      '<button id="segRoom">In-house room</button>'+
    '</div>'+
    '<div class="rm-row" id="rmRow" style="display:none"></div>'+
    '<input class="txt" id="xName" type="text" placeholder="Name" autocomplete="off">'+
    '<input class="txt" id="xPhone" type="tel" placeholder="Phone" autocomplete="off">'+
    '<div class="sheet-label" style="margin-top:14px">Guests</div>'+
    '<div class="pax-row" id="paxRow"></div>'+
    '<div class="sheet-label">Dietary requirements</div>'+
    '<div class="chips" id="dietChips"></div>'+
    '<div class="sheet-label" id="xDnoteLab" style="display:none">Dietary notes</div>'+
    '<input class="txt" id="xDnote" type="text" placeholder="Dietary notes" autocomplete="off" style="margin-top:10px;display:none">'+
    '<div class="sheet-label">Dinner notes</div>'+
    '<input class="txt" id="xNote" type="text" placeholder="Dinner notes" autocomplete="off" style="margin-top:14px">'+
    '<button class="opt solid" id="oIn" style="margin-top:8px">Add</button>'+
    '<button class="opt quiet" id="oCancel">Cancel</button>';
  showSheet();
  revealAction();

  var segE=document.getElementById('segExt'), segR=document.getElementById('segRoom');
  var rmRow=document.getElementById('rmRow');
  function paintSeg(){
    segE.className = dest===null ? 'on' : '';
    segR.className = dest===null ? '' : 'on';
    rmRow.style.display = dest===null ? 'none' : 'grid';
  }
  function paintRooms(){
    rmRow.innerHTML='';
    for (var i=1;i<=ROOMS;i++)(function(v){
      var b=document.createElement('button');
      b.className='rmp'+(dest===v?' on':''); b.textContent=v;
      b.onclick=function(){ dest=v; paintRooms(); };
      rmRow.appendChild(b);
    })(i);
  }
  segE.onclick=function(){ dest=null; paintSeg(); };
  segR.onclick=function(){ if(dest===null) dest=1; paintRooms(); paintSeg(); };

  function paintPax(){ paxPicker(8, function(){return pax;}, function(v){pax=v;}); }
  function syncDnote(){
    var el=document.getElementById('xDnote');
    el.style.display = (diets.length || el.value) ? '' : 'none';
    var lb=document.getElementById('xDnoteLab');
    if (lb) lb.style.display = el.style.display;
  }
  function paintChips(){
    var box=document.getElementById('dietChips'); box.innerHTML='';
    DIETARIES.concat([DIET_OTHER]).forEach(function(d){
      var b=document.createElement('button');
      b.className='chip'+(diets.indexOf(d)>-1?' on':''); b.textContent=d;
      b.onclick=function(){
        var i=diets.indexOf(d);
        if(i>-1) diets.splice(i,1); else diets.push(d);
        paintChips(); syncDnote();
      };
      box.appendChild(b);
    });
  }
  paintPax(); paintChips(); paintSeg(); syncDnote();

  document.getElementById('oIn').onclick=function(){
    var nm=document.getElementById('xName').value.trim();
    var ph=document.getElementById('xPhone').value.trim();
    var nt=document.getElementById('xNote').value.trim();
    var dn=document.getElementById('xDnote').value.trim();
    if (otherNeedsNote(diets, dn)){
      showError('Write the allergy in the dietary note, or it reaches nobody.');
      document.getElementById('xDnote').style.display='';
      document.getElementById('xDnote').focus();
      return;
    }
    if (dest===null){
      if(!nm){ document.getElementById('xName').focus(); return; }
      var id='ext-'+Date.now();
      var rec={ status:'in', pax:pax, name:nm, phone:ph, note:nt, diets:diets, source:'manual' };
      if (dn) rec.dnote=dn;
      saveManual(id, rec);
    } else {
      var rec2={ status:'in', pax:pax, room:String(dest), source:'manual' };
      // staff booking over a guest's own answer counts as an override
      for (var k in responses){ if (String(responses[k].room)===String(dest)) rec2.override=true; }
      if (nm) rec2.name=nm;
      if (ph) rec2.phone=ph;
      if (nt) rec2.note=nt;
      if (dn) rec2.dnote=dn;
      if (diets.length) rec2.diets=diets.slice();
      saveManual('room-'+dest, rec2);
      persistDietary(dest, rec2);
    }
    close(); render();
  };
  document.getElementById('oCancel').onclick=close;
};

function editExt(key, g){
  var pax = g.pax || 2;
  var isManual = key.indexOf('ext-') === 0;
  var diets = fixDietList(g.diets);

  if (isManual){
    sheet.innerHTML =
      '<h3>'+(g.name || 'Reservation')+'</h3>'+
      '<input class="txt" id="xName" type="text" placeholder="Name" autocomplete="off">'+
      '<input class="txt" id="xPhone" type="tel" placeholder="Phone" autocomplete="off">'+
      '<div class="sheet-label" style="margin-top:14px">Guests</div>'+
      '<div class="pax-row" id="paxRow"></div>'+
      '<div class="sheet-label">Dietary requirements</div>'+
      '<div class="chips" id="dietChips"></div>'+
      '<div class="sheet-label" id="xDnoteLab" style="display:none">Dietary notes</div>'+
      '<input class="txt" id="xDnote" type="text" placeholder="Dietary notes" autocomplete="off" style="margin-top:10px;display:none">'+
      '<div class="sheet-label">Dinner notes</div>'+
      '<input class="txt" id="xNote" type="text" placeholder="Dinner notes" autocomplete="off" style="margin-top:14px">'+
      '<button class="opt solid" id="oSave" style="margin-top:8px">Save changes</button>'+
      '<button class="opt out" id="oDel">Cancel booking</button>'+
      '<button class="opt quiet" id="oClose">Close</button>';
    showSheet();
    revealAction();
    document.getElementById('xName').value  = g.name  || '';
    document.getElementById('xPhone').value = g.phone || '';
    document.getElementById('xNote').value  = g.note  || '';
    document.getElementById('xDnote').value = g.dnote || '';
    function syncDnote(){
      var el=document.getElementById('xDnote');
      el.style.display = (diets.length || el.value) ? '' : 'none';
      var lb=document.getElementById('xDnoteLab');
      if (lb) lb.style.display = el.style.display;
    }
    paxPicker(8, function(){return pax;}, function(v){pax=v;});
    (function paintChips(){
      var box=document.getElementById('dietChips'); box.innerHTML='';
      DIETARIES.concat([DIET_OTHER]).forEach(function(d){
        var b=document.createElement('button');
        b.className='chip'+(diets.indexOf(d)>-1?' on':''); b.textContent=d;
        b.onclick=function(){
          var i=diets.indexOf(d);
          if(i>-1) diets.splice(i,1); else diets.push(d);
          paintChips(); syncDnote();
        };
        box.appendChild(b);
      });
    })();
    syncDnote();
    document.getElementById('oSave').onclick = function(){
      var rec = JSON.parse(JSON.stringify(g));
      rec.name  = document.getElementById('xName').value.trim() || rec.name;
      rec.phone = document.getElementById('xPhone').value.trim();
      rec.note  = document.getElementById('xNote').value.trim();
      var dn = document.getElementById('xDnote').value.trim();
      if (otherNeedsNote(diets, dn)){
        showError('Write the allergy in the dietary note, or it reaches nobody.');
        document.getElementById('xDnote').style.display='';
        document.getElementById('xDnote').focus();
        return;
      }
      rec.diets = diets.slice();
      if (dn) rec.dnote = dn; else delete rec.dnote;
      rec.pax   = pax;
      saveManual(key, rec);
      close(); render();
    };
  } else {
    sheet.innerHTML =
      '<h3>'+(g.name || 'External guest')+'</h3>'+
      guestDataHTML(g, null) +
      '<div class="note-box">Booked by the guest - details are theirs to change.</div>'+
      '<button class="opt out" id="oDel">Cancel booking</button>'+
      '<button class="opt quiet" id="oClose">Close</button>';
    showSheet();
    revealAction();
  }

  document.getElementById('oDel').onclick = function(){
    confirmSheet(g.name || 'External guest',
      'Cancel this booking?',
      'Yes, cancel booking',
      doCancel,
      function(){ editExt(key, g); });
  };

  function doCancel(){
    if (isManual){
      saveManual(key);
    } else {
      // guest booked via the link - record a staff cancellation
      var rec = { status:'out', pax:0, override:true, source:'manual',
                  name:g.name||'', phone:g.phone||'' };
      cancelledExt[key] = true;
      saveManual('extcancel-'+key, rec).catch(function(){
        delete cancelledExt[key];   // failed: let the row come back
        render();
      });
    }
    close(); render();
  }
  document.getElementById('oClose').onclick = close;
}
