<title>DEMO · Nala · Tonight's Numbers</title>
<style>
/* NALA staff UI, second dress. See STYLEGUIDE.md and mock-style.html.

   WHY THIS IS A SECOND FILE AND NOT AN EDIT TO nala-ui.css
   --------------------------------------------------------
   The dress changes shared tokens, and nala-ui.css is linked by thirteen
   pages. Editing it restyles all of them in one publish, on a live system,
   with no way to move one page at a time. So the new dress is opt in: a
   page joins it by adding `ui2` to its body class and linking this file,
   and every page that has not joined is untouched, byte for byte.

   This file is a MIGRATION SEAM, not a permanent second stylesheet. When
   the last page carries `ui2`, its contents move into nala-ui.css, the
   class goes, and this file is deleted. Until then, two dresses is the
   price of moving five pages instead of twenty two at once.

   It is also SELF SUFFICIENT on purpose. nala-ui.css turned out to be a
   layout system as well as a control sheet: it sets body to a flex column
   and takes its colours from --ctl-* tokens that only exist on a body
   carrying tier-app or tier-print, so a page that linked it for the
   hamburger alone got a reflow, and a page without a tier class drew a
   menu button nobody could see. That is why tag.html, flags.html and
   publish.html each hand copied the nav instead. Nothing here needs a tier
   class, so those copies can go.                                      */

/* The reset every page already carries, identical in all twenty of them. */
*{ margin:0; padding:0; box-sizing:border-box; }

/* ── the colour law · values unchanged from nala-ui.css and the boards ──
   A dress may say what a control looks like. It may not say what a colour
   means. Every value below is the one the live boards use today.      */
:root{
  --law-green:#5E7D67;  --law-green-t:rgba(122,160,130,.26);
  --law-green-b:rgba(122,160,130,.65);
  --law-terra:#9E6455;  --law-terra-t:rgba(184,106,90,.16);
  --law-terra-b:rgba(184,106,90,.45);
  --law-amber:#F6EAD5;  --law-amber-b:#C29A55;  --law-amber-ink:#8A6A2F;
  --law-red:#A8321E;
  --law-wait:rgba(28,28,26,.045);
  --law-save-bg:#E4EDE2; --law-save-bdr:#7E937A; --law-save-ink:#5E7D67;
}

body.ui2{
  /* ── ground and ink ────────────────────────────────────────────────
     White rather than cream: these are tools, and every tool the owner
     pointed at (Drive, Earth, Zoom) sits on white with one accent.   */
  --ground:#FFFFFF;
  --card:#F5F6F8;          /* a quiet fill for secondary buttons and cards */
  --ink:#1B1B19;
  /* #999990 measured 2.69:1 on cream. WCAG AA wants 4.5:1 for text this
     size, and this token carries most of the app's secondary text at
     11px. #5F5F58 is 4.9:1 on white and keeps the warm grey.         */
  --mid:#5F5F58;
  --rule:#E6E6E1;

  /* ── one accent, and it means one thing ────────────────────────────
     "You can act here, or this is selected." Blue because it is the
     only hue not already spoken for: sage is done, terracotta is
     declined, amber is chase this, red is failed. An accent that
     borrowed one of those would put interaction and state in the same
     channel, which is what the boards already suffer from.          */
  --accent:#1A66C2;
  --accent-ink:#FFFFFF;
  --accent-soft:#E8F0FE;

  /* ── what a SELECTED pill looks like ───────────────────────────────
     Ruled by the owner, 29 Aug: a selected pill gives grey feedback,
     not black and not blue. Before this it was blue on six pages, ink
     on five and green on two, and a black circle sat beside a blue
     segment on the same sheet.

     Grey, and deliberately not the colour law's waiting grey, which is
     a fifth of this and carries no border: this is a control saying
     "you picked me", not a record saying "sent, waiting". The ink
     border is what does the work - a dark edge reads as chosen at a
     glance without spending a colour that means something.          */
  --sel-bg:rgba(28,28,26,.10);
  --sel-bdr:var(--ink);

  /* ── scales · pick from these, never by eye ────────────────────────
     Spacing is a 4px grid, which is what Material, Bootstrap and Apple
     all land on. The type scale is the styleguide's own 8/11/15/20/27
     with the bottom two steps raised: 8px and 9px text is not density,
     it is unreadable, and it is most of why the boards look busy.   */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --t1:12px; --t2:14px; --t3:16px; --t4:20px; --t5:27px;
  --r:8px;            /* every control and card */
  --pill:999px;       /* chips and status pills only */
  --tap:44px;         /* Apple HIG minimum; Material says 48 */

  --ui-font:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,
            Helvetica,Arial,sans-serif;

  /* ── aliases, transitional ─────────────────────────────────────────
     A converted page keeps its own component rules, and those rules ask
     for the token names the old sheet used. Rather than find-and-replace
     hundreds of them and risk a typo per page, the old names are kept
     here pointing at the new values. An undefined custom property does
     not fall back, it computes to nothing: var(--cream) with no --cream
     is a transparent background and var(--ink) is inherited text, which
     is exactly how the hamburger came to be invisible. These go with the
     seam, when the last page has joined and the names can be swept.   */
  --cream:var(--ground);
  --paper:var(--ground);
  /* --green and --greent are deliberately NOT aliased. --green is #E4EDE2,
     a pale fill, on five pages and #5E7D67, a dark ink, on two. Claiming
     one of those meanings in the shared sheet would repeat exactly the
     fault this work exists to fix, and would turn the Cleans board's ready
     tint into a dark green. The pages keep their own until the name is
     split properly, which is the de-aliasing job still outstanding.    */
  --green-t:var(--law-green-t);  --green-b:var(--law-green-b);
  --greenb:var(--law-save-bdr);
  --resgreen:var(--law-green);   --resgreen-t:var(--law-green-t);
  --resgreen-b:var(--law-green-b);
  --terra:var(--law-terra);      --terra-t:var(--law-terra-t);
  --terra-b:var(--law-terra-b);
  --resterra:var(--law-terra);   --resterra-t:var(--law-terra-t);
  --resterra-b:var(--law-terra-b);
  --amber:var(--law-amber);      --amberb:var(--law-amber-b);
  --ambert:var(--law-amber-ink); --amberink:var(--law-amber-ink);
  --red:var(--law-red);
  --save-bg:var(--law-save-bg);  --save-bdr:var(--law-save-bdr);
  --save-ink:var(--law-save-ink);
  --num-font:var(--ui-font);
  /* nala-ui.css's tier tokens, so a page that links both sheets and still
     has rules reaching for --ctl-* keeps drawing while it is converted. */
  --ctl-bg:var(--ground); --ctl-bdr:var(--rule); --ctl-ink:var(--ink);
  --ctl-soft:#454540;

  background:var(--ground);
  color:var(--ink);
  font-family:var(--ui-font);
  -webkit-tap-highlight-color:transparent;
  /* Double tap to zoom is a hazard on a board of tap targets. This turns
     that gesture off while LEAVING pinch zoom alone, which is why the
     user-scalable=no meta comes off these pages: it took pinch zoom
     from anyone who needs it and did not do this job.               */
  touch-action:manipulation;
}

/* ── sentence case, everywhere ───────────────────────────────────────
   The loudest single difference between this dress and the last. Not
   one label in Drive, Earth or Zoom is uppercase or letterspaced; the
   look dates to Material 1 and Bootstrap 3. Where a page still asks for
   caps, this overrides it rather than requiring every rule be found. */
body.ui2 .seclabel, body.ui2 .stat-l, body.ui2 .legend,
body.ui2 .btn, body.ui2 .sec > span, body.ui2 .sec a,
body.ui2 .dnav.today, body.ui2 h1, body.ui2 .date{
  text-transform:none; letter-spacing:0;
}

/* ── page frame ──────────────────────────────────────────────────────
   Deliberately NOT a flex column. nala-ui.css makes body one, which is
   the rule that reflowed pages that only wanted a button.           */
/* Page padding is the PAGE's business and is not set here. It was, and at
   body.ui2, which outranks every `body { padding-top: ... }` a page has
   inside a media query: the Cleans board's landscape rule asks for 6px at
   the top so seventeen tiles fit a 320px-tall screen, and a sheet-level
   shorthand quietly held it at 24 and pushed the grid off the screen.  */
body.ui2 h1{ font-size:var(--t4); font-weight:600; margin-bottom:var(--s1); }
body.ui2 .lede{ font-size:var(--t2); color:var(--mid); line-height:1.55;
                margin-bottom:var(--s2); max-width:58ch; }
body.ui2 .seclabel{ font-size:var(--t2); font-weight:500; color:var(--mid);
                    margin:var(--s5) 0 var(--s2); }
body.ui2 .secnote{ font-size:var(--t2); color:var(--mid); line-height:1.5;
                   margin-bottom:var(--s3); max-width:58ch; }

/* ── header row ──────────────────────────────────────────────────────
   Same shape as today: one row, in flow, controls at 40px, menu right.
   Floating corner menus stay banned.                                 */
body.ui2 .daterow{ display:flex; align-items:center; gap:var(--s2);
                   margin-bottom:var(--s4); }
body.ui2 .date{ flex:1; font-size:var(--t4); font-weight:600; }
/* 36px, not the 44px tap floor: the header law in STYLEGUIDE.md rules that
   every control in this row is 36 and tally_suite measures it. The project's
   own rule outranks the general one.                                      */
body.ui2 .dnav{ width:36px; height:36px; display:inline-flex; align-items:center;
                justify-content:center; border:0; background:var(--card);
                border-radius:var(--pill); color:var(--ink); cursor:pointer;
                font-family:var(--ui-font); font-size:var(--t3); }
body.ui2 .dnav.today{ width:auto; padding:0 var(--s3); font-size:var(--t2); }
/* The corner law: the footer row sits hard against the bottom of the screen,
   so it squares off, and only the outer lower corners round. body.ui2 .btn
   outranks .foot .btn in nala-ui.css, so the law has to be restated here or
   the row grows four rounded corners and floats.                          */
body.ui2 .foot .btn{ border-radius:0; }
body.ui2 .foot .btn:first-child{ border-bottom-left-radius:var(--r); }
body.ui2 .foot .btn:last-child { border-bottom-right-radius:var(--r); }
body.ui2 .dnav:disabled{ opacity:.35; cursor:default; }
body.ui2 .dnav:active{ background:var(--accent-soft); }

/* ── the hamburger and its menu ──────────────────────────────────────
   Written against real colours, not --ctl-*, so a page with no tier
   class still draws it. That was the whole reason for the copies.   */
body.ui2 .navwrap{ position:relative; margin-left:auto; z-index:500; }
body.ui2 .navbtn{ width:42px; height:36px; border:0; background:transparent;
                  border-radius:var(--pill); display:flex; flex-direction:column;
                  align-items:center; justify-content:center; gap:4px;
                  cursor:pointer; -webkit-tap-highlight-color:transparent; }
body.ui2 .navbtn:active{ background:var(--card); }
body.ui2 .navbtn span{ display:block; width:17px; height:1.7px;
                       background:var(--ink); border-radius:2px; }
body.ui2 .navdrop{ display:none; position:absolute; right:0; top:42px;
                   background:var(--ground); border:1px solid var(--rule);
                   border-radius:var(--r); min-width:200px; padding:var(--s1) 0;
                   box-shadow:0 2px 6px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.10); }
body.ui2 .navdrop.open{ display:block; }
body.ui2 .navdrop a{ display:block; padding:var(--s3) var(--s4);
                     font-size:var(--t2); line-height:1.3; color:var(--ink);
                     text-decoration:none; }
body.ui2 .navdrop a:active{ background:var(--accent-soft); }
body.ui2 .navgrp{ display:flex; align-items:center; justify-content:space-between;
                  gap:var(--s4); width:100%; padding:var(--s3) var(--s4);
                  font-size:var(--t2); line-height:1.3; font-family:inherit;
                  text-align:left; color:var(--ink); background:none; border:0;
                  border-top:1px solid var(--rule); cursor:pointer; }
body.ui2 .navchev{ flex:0 0 auto; color:var(--mid); transition:transform .15s ease; }
body.ui2 .navgroup.open .navchev{ transform:rotate(180deg); }
body.ui2 .navsub{ display:none; }
body.ui2 .navgroup.open .navsub{ display:block; }
body.ui2 .navsub a{ padding-left:var(--s6); }
body.ui2 .navdrop a.navaction,
body.ui2 .navdrop a.hasact{ display:flex; align-items:center;
                            justify-content:space-between; gap:var(--s4); }
body.ui2 .navmark{ display:inline-flex; flex:0 0 auto; }
body.ui2 .navmark.on{ color:#3F7A52; }
body.ui2 .navmark.off{ color:#9A9A92; }
body.ui2 .navnote{ flex:0 0 auto; font-size:var(--t1); color:var(--mid); }
body.ui2 .navdrop a.signout{ border-top:1px solid var(--rule);
                             margin-top:var(--s1); padding-top:var(--s3);
                             color:var(--mid); }
body.ui2 .navbadge{ flex:0 0 auto; min-width:20px; height:20px; padding:0 6px;
                    border-radius:var(--pill); background:var(--accent);
                    color:var(--accent-ink); font-size:var(--t1);
                    display:inline-flex; align-items:center; justify-content:center; }

/* ── buttons · the button law, redressed but not rewritten ───────────
   One solid primary per surface; quiet is secondary; destructive wears
   terracotta outline and always asks first. Only the dress changed:
   the solid is the accent rather than ink, and quiet is a fill rather
   than an outline, so a screen of secondary actions stops reading as a
   screen of identical bordered rectangles.                          */
body.ui2 .btn{ display:inline-flex; align-items:center; justify-content:center;
               width:100%; padding:var(--s3) var(--s4); min-height:var(--tap);
               border:0; border-radius:var(--r); background:var(--card);
               color:var(--ink); font-family:var(--ui-font); font-size:var(--t3);
               font-weight:500; cursor:pointer; text-decoration:none; }
/* ── the four roles, and there are only four ───────────────────────────
   Ruled 29 Aug, after three screenshots in which the primary action was
   green on Reservations, black on Spa and absent on Front Desk, where
   Save, Close and Confirm were the same button three times.

   PRIMARY      the one thing a surface is for. Solid accent. One per
                surface. Never confirms: if it feels like it needs a
                warning the label is wrong, not the dialog missing.
   SECONDARY    everything else that writes nothing. Quiet grey fill.
   DESTRUCTIVE  destroys or walks back something a guest holds.
                Terracotta outline, and it always asks first.
   SELECTED     a pill you picked. Grey fill, ink border. Not an action.

   A page may set the LAYOUT of the row its buttons sit in. It may not
   dress them again.                                                   */
body.ui2 .btn.solid,
body.ui2 .is-primary    { background:var(--accent); color:var(--accent-ink);
                          border:0; font-weight:500; }
body.ui2 .is-secondary,
body.ui2 .opt.quiet,
body.ui2 .cbtn.quiet,
body.ui2 .pbtn.ghost    { background:var(--card); color:var(--ink); border:0; }
body.ui2 .is-destructive{ background:transparent; color:var(--law-terra);
                          border:1px solid var(--law-terra-b); }
/* Each page's own name for "the primary action on this surface". They are
   aliases, not new dresses: one fill, defined once above.              */
body.ui2 .pubbtn, body.ui2 .savebtn, body.ui2 .addbtn,
body.ui2 .cbtn.solid, body.ui2 .pbtn.solid, body.ui2 .opt.solid,
body.ui2 .sum-btns button.go, body.ui2 .selbtn.comb
                        { background:var(--accent); color:var(--accent-ink);
                          border:0; font-weight:500; }
/* Armed to delete. It was solid red on two pages, and red is failure's
   alone: a delete waiting for a second press is not a failure, it is a
   destructive action mid-confirmation.                                */
body.ui2 .btn.arm, body.ui2 .mtog.mdel, body.ui2 .rmbtn.arm,
body.ui2 .del.arm       { background:transparent; color:var(--law-terra);
                          border:1px solid var(--law-terra); font-weight:500; }
/* Selected, everywhere: chips, segments, pickers, toggles, day pills. */
body.ui2 .is-selected,
body.ui2 .chip.on, body.ui2 .pax.on, body.ui2 .seg button.on,
body.ui2 .rmp.on, body.ui2 .grp button.on, body.ui2 .sfbtn.on,
body.ui2 .knob button.on, body.ui2 .sec a.active,
body.ui2 .opt.on, body.ui2 .allbtn.on
                        { background:var(--sel-bg); color:var(--ink);
                          border-color:var(--sel-bdr); font-weight:500; }
/* Reservations' three state segments and its select bar show what the
   record will BECOME, in the colour law's own dining green, declined
   terracotta and vacant slate. Grey would throw the meaning away to win
   an argument about consistency.                                     */
body.ui2 .opt.din, body.ui2 .opt.out, body.ui2 .opt.vac,
body.ui2 .selbtn.din, body.ui2 .selbtn.out, body.ui2 .selbtn.vac
                        { color:#fff; border:0; font-weight:500; }
body.ui2 .btn.ghost{ background:transparent; border:1px solid var(--rule);
                     color:var(--ink); }
body.ui2 .btn.terra{ background:transparent; border:1px solid var(--law-terra-b);
                     color:var(--law-terra); }
body.ui2 .btn.warn { background:transparent; border:1px solid var(--law-terra-b);
                     color:var(--law-terra); }
body.ui2 .btn:disabled{ opacity:.35; cursor:default; }
body.ui2 .btn:active{ filter:brightness(.94); }

/* What a press says back. Grey while writing is the colour law's "sent,
   waiting on the other side"; green is "done", and is worn only after
   the write. Saved rests until there is more to save.               */
body.ui2 .btn.saving, body.ui2 .btn.saved{ opacity:1; cursor:default; }
body.ui2 .btn.saving{ background:var(--law-wait); color:var(--mid); }
body.ui2 .btn.saved { background:var(--law-save-bg); color:var(--law-save-ink); }
/* Failure is words, in red, under the button that failed. Never a red
   fill: a red tile reads as a state the record is in, and the record is
   simply unsaved.                                                    */
body.ui2 .savefail{ display:none; font-size:var(--t2); line-height:1.45;
                    color:var(--law-red); margin-top:var(--s2); }
body.ui2 .savefail.show{ display:block; }

/* ── rows and lists ──────────────────────────────────────────────────
   Separated by an inset hairline rather than boxed. A tinted row keeps
   its own corner, because a tint that runs to the screen edge stops
   reading as one record.                                             */
body.ui2 .rowlist > * + *{ border-top:1px solid var(--rule); }

/* ── the access message ──────────────────────────────────────────────
   Plain typography, never a bordered or filled box: that dress belongs
   to buttons, and a message wearing it reads as something to tap.   */
body.ui2 .noaccess{ display:none; font-size:var(--t3); line-height:1.5;
                    color:var(--ink); max-width:52ch; margin:var(--s5) 0; }
body.ui2 .noaccess.show{ display:block; }
body.ui2 .noaccess .na-retry{ margin-top:var(--s4); display:block;
                              width:max-content; }

/* ── stats · plain type, never boxed ─────────────────────────────── */
body.ui2 .stats{ display:flex; justify-content:center; gap:var(--s6);
                 margin:var(--s4) 0 var(--s2); }
body.ui2 .stat{ text-align:center; }
body.ui2 .stat-n{ display:block; font-size:var(--t5); line-height:1;
                  color:var(--ink); font-variant-numeric:tabular-nums; }
body.ui2 .stat-l{ display:block; font-size:var(--t2); color:var(--mid);
                  margin-top:var(--s1); }
body.ui2 .stat.warn .stat-n{ color:var(--law-red); }

/* ── inputs ──────────────────────────────────────────────────────────
   16px minimum, always: anything smaller and iOS zooms the page on
   focus and does not zoom back.                                      */
body.ui2 input, body.ui2 select, body.ui2 textarea{
  font-family:var(--ui-font); font-size:var(--t3); color:var(--ink);
  background:#fff; border:1px solid var(--rule); border-radius:var(--r);
  padding:var(--s3); width:100%; min-height:var(--tap); }
body.ui2 input:focus, body.ui2 textarea:focus, body.ui2 select:focus{
  outline:none; border-color:var(--accent); }

/* ── keyboard focus ──────────────────────────────────────────────────
   Nothing in the app has this today: zero pages use :focus-visible and
   six declare outline:none. A keyboard or switch user currently has no
   idea where they are.                                               */
body.ui2 :focus-visible{ outline:2px solid var(--accent); outline-offset:2px;
                         border-radius:var(--r); }

@media (prefers-reduced-motion:reduce){
  body.ui2 *{ transition:none !important; }
}

/* keep controls off paper */
@media print{
  body.ui2 .navwrap, body.ui2 .foot, body.ui2 .dnav{ display:none !important; }
}

</style>
<style>
/* NALA staff UI - shared controls. See STYLEGUIDE.md.
   Pages declare <body class="tier-app"> or <body class="tier-print">.  */

:root {
  --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA; --red:#A8321E;
  /* The destructive dress's colours (the button law, STYLEGUIDE.md) and the
     green a save lands on. Named --save-* rather than --green-*: four pages
     already define a --green of their own, two of them to different values,
     and a page's :root wins over this file's. A token a page can silently
     redefine is not a token, it is a coincidence.                        */
  --terra:#9E6455; --terra-b:rgba(184,106,90,.45); --terra-t:rgba(184,106,90,.16);
  --save-bg:#E4EDE2; --save-bdr:#7E937A; --save-ink:#5E7D67;
  /* Staff tools use the Apple system font: it is what every other app on the
     phone uses, its figures line up, and it is built for small sizes. The
     guest pages do NOT use these tokens - they carry the brand and set their
     own font, so this can change without touching them.                  */
  --ui-font:-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto,
            Helvetica, Arial, sans-serif;
  --num-font:var(--ui-font);
}

/* Double tap to zoom is a hazard on a board of tap targets: a quick second
   tap on a villa tile zooms the page instead of doing the thing. This turns
   that gesture off while LEAVING pinch zoom alone, so nobody who needs to
   magnify the page loses it. The old user-scalable=no meta does not do this;
   iOS ignores it on purpose.                                             */
body.tier-app, body.tier-print { touch-action:manipulation; }

/* tier surfaces used by controls */
/* --ctl-soft is the solid button's RESTING fill: a step off full ink, so the
   press has somewhere darker to go. Ruled by the owner, 27 Aug - pressed and
   idle were the same pixels before it.                                    */
.tier-app   { --ctl-bg:var(--cream); --ctl-bdr:var(--rule); --ctl-ink:var(--ink);
              --ctl-soft:#454540; }
.tier-print { --ctl-bg:#fff;         --ctl-bdr:#ddd;        --ctl-ink:#111;
              --ctl-soft:#3A3A38; }

/* ── one header row: [Today] [<] date [>] ....... [menu] ── */
.navwrap { position:relative; margin-left:auto; z-index:500; font-family:var(--ui-font); }
.navbtn  { border:1px solid var(--ctl-bdr); background:var(--ctl-bg);
           border-radius:8px; cursor:pointer; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:4px; padding:0;
           -webkit-tap-highlight-color:transparent; }
.navbtn span { display:block; width:16px; height:1.6px; background:var(--ctl-ink); }
.navdrop { display:none; position:absolute; right:0; top:42px; background:var(--ctl-bg);
           border:1px solid var(--ctl-bdr); border-radius:9px; min-width:176px;
           box-shadow:0 4px 14px rgba(0,0,0,.09); padding:5px 0; }
.navdrop.open { display:block; }
/* Menu rows read as ordinary text - the owner's word, 26 Aug: no caps, no
   tracking, the standard UI font at a size a thumb can hit. One padding and
   line-height shared with .navgrp, so links and submenu headers sit as one
   list. */
.navdrop a { display:block; padding:10px 18px; font-size:14px; line-height:18px;
             color:var(--ctl-ink); text-decoration:none; white-space:nowrap; }
/* Signing out is an action, not a destination, so it sits below a rule rather
   than reading as one more page in the list. It is never filtered by role:
   every login has to be able to get out.                                  */
/* Submenus instead of dividers, 26 Aug: seventeen rows under two grey
   headings was too many to scan for one page. Print, SMS and Settings fold
   instead. The header is a real button dressed as a row - it IS a choice
   now, unlike the old signpost - and the chevron says so, pointing down
   while there is more, rolling over once it is out. */
.navgrp { display:flex; align-items:center; justify-content:space-between; gap:14px;
          width:100%; padding:10px 18px; font-size:14px; line-height:18px;
          font-family:inherit; text-align:left; color:var(--ctl-ink);
          background:none; border:0; border-top:1px solid var(--ctl-bdr);
          cursor:pointer; -webkit-tap-highlight-color:transparent; }
.navchev { flex:0 0 auto; color:var(--mid); transition:transform .15s ease; }
.navgroup.open .navchev { transform:rotate(180deg); }
.navsub { display:none; }
.navgroup.open .navsub { display:block; }
/* Indented under their header, so an open submenu still reads as one menu. */
.navsub a { padding-left:32px; }
.navdrop a.navaction { display:flex; align-items:center; justify-content:space-between;
                      gap:14px; color:var(--ctl-ink); }
/* The mark carries the state, so it has to be legible at a glance and never
   read as another thing to press. Green for on, grey for off: off is a choice
   somebody made, not a fault, and a red cross would say otherwise. */
.navmark { display:inline-flex; flex:0 0 auto; }
.navmark.on  { color:#3F7A52; }
.navmark.off { color:#B0B0A8; }
/* Blocked and unavailable get words, because no mark can say "you cannot fix
   this from here". */
.navnote { flex:0 0 auto; font-size:11px; color:#B0B0A8; }
.navdrop a.signout { border-top:1px solid var(--ctl-bdr); margin-top:5px;
                     padding-top:13px; color:var(--mid); }
/* ── the action icon ─────────────────────────────────────────
   A number beside a menu entry meaning: something in there waits on you.
   Amber, the colour law's word for "attention, chase this", and it stays
   until the queue it counts is empty, because it is recomputed from the
   queue itself on every load and never stored. First carried by Spa for
   suggestions awaiting the desk; any entry may carry one. */
.navdrop a.hasact { display:flex; align-items:center; justify-content:space-between;
                    gap:14px; }
/* Solid gold rather than the pastel tint: the first live look, 25 Aug,
   found the tinted version invisible at arm's length, and a count nobody
   sees is a queue nobody clears. Still the amber family - attention, not
   failure. */
.navbadge { flex:0 0 auto; min-width:20px; height:20px; padding:0 6px;
            border-radius:10px; background:#C29A55; color:#FFFDF8;
            font-size:11px; letter-spacing:0; font-weight:600;
            display:inline-flex; align-items:center; justify-content:center; }

/* ── floating footer ──────────────────────────────────────
   sticky pins it while scrolling long pages; the flex column
   below pins it to the screen bottom on short pages too      */
body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
body > .wrap { flex:1 0 auto; display:flex; flex-direction:column; width:100%; }
.wrap > .foot, body > .foot { margin-top:auto; }
.foot { position:sticky; bottom:0; z-index:40; display:flex; gap:8px; flex-wrap:wrap;
        background:var(--ctl-bg); border-top:1px solid var(--ctl-bdr); margin-top:18px;
        padding:10px 0 calc(10px + env(safe-area-inset-bottom)); }
/* The corner law outranks the 8px the free-standing button took on 27 Aug:
   this row sits hard against the bottom of the screen, so it squares off
   again and softens only the two corners that land in the phone's own
   rounded corners.                                                        */
.foot .btn { flex:1; text-align:center; white-space:nowrap; border-radius:0; }
.foot .btn:first-child { border-bottom-left-radius:8px; }
.foot .btn:last-child  { border-bottom-right-radius:8px; }

/* ── standard header: kicker, then one date row ─────── */
.daterow { display:flex; align-items:center; gap:8px;
           margin-bottom:12px; font-family:var(--ui-font); }
.daterow .date { font-size:13px; font-weight:bold; letter-spacing:.1em;
                 text-transform:uppercase; color:var(--ctl-ink); white-space:nowrap;
                 padding:0 2px; }
.dnav { width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
        background:var(--ctl-bg); border:1px solid var(--ctl-bdr); border-radius:7px;
        font-size:16px; line-height:1; color:var(--ctl-ink); cursor:pointer; padding:0;
        -webkit-tap-highlight-color:transparent; }
.dnav:active { background:var(--ctl-bdr); }
.dnav.today { width:auto; padding:0 12px; font-size:9.5px; letter-spacing:.13em;
              text-transform:uppercase; }
.dnav.today:disabled { opacity:.35; cursor:default; }
.navbtn { width:42px; height:36px; }
/* page name on paper only - the screen row replaces it */
.printkick { display:none; }
@media print { .printkick { display:block; text-align:center; font-family:var(--ui-font);
  font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:#666;
  margin-bottom:8px; } }

/* ── information is plain typography, never boxed ───── */
.stats { display:flex; justify-content:center; gap:36px; margin:16px 0 6px;
         font-family:var(--ui-font); }
.stat { text-align:center; }
.stat-n { display:block; font-size:27px; line-height:1; color:var(--ctl-ink);
          font-family:var(--num-font); }
.stat-l { display:block; font-size:8px; letter-spacing:.2em; text-transform:uppercase;
          color:var(--mid); margin-top:6px; }
.stat.warn .stat-n { color:var(--red); }

/* ── the button dress ─────────────────────────────────────
   One quiet dress and one solid, here rather than pasted per page: five
   pages emitted class="btn" with no rule behind it and the no-access
   Try again stood as a bare browser button (found 27 Aug), while the
   pages that did paste the dress had drifted apart - 10px against 11px,
   .15em against .14em, one all-corner radius against the footer corner
   law. The dress lives here; layout (flex, width) stays with each page's
   container rules, and a page's own variants (.arm, .warn, .active)
   stay its own. Per the button law (STYLEGUIDE.md): .solid is THE
   primary, at most one per surface.                                    */
.btn { padding:13px; text-align:center; border:1px solid var(--ctl-ink);
       border-radius:8px;
       background:transparent; color:var(--ctl-ink);
       font-family:var(--ui-font); font-size:11px; letter-spacing:.14em;
       text-transform:uppercase; cursor:pointer; white-space:nowrap;
       text-decoration:none; -webkit-tap-highlight-color:transparent;
       transition:background .08s ease, color .08s ease, border-color .08s ease; }
.btn.solid { background:var(--ctl-soft); border-color:var(--ctl-soft);
             color:var(--ctl-bg); }
/* The destructive dress, per the button law: outline only, never a fill and
   never red - red is failure's alone. It always confirms before writing. */
.btn.terra { border-color:var(--terra-b); color:var(--terra); background:transparent; }
.btn:disabled { opacity:.35; cursor:default; }
/* The print sheets' own pair, identical on all three until it lived here:
   solid ink on white paper stock, a size down from the boards. It sits
   ABOVE the press and save states rather than below them: it matches on
   the same specificity as .btn.saved, so read the other way round it won
   and a print-tier save would have gone grey in the green's place.     */
.tier-print .btn { padding:10px 20px; background:var(--ctl-soft); color:#fff;
                   border:none; font-size:10px; letter-spacing:.15em; }
.tier-print .btn.ghost { background:#fff; color:#111; border:1px solid #111; }

/* ── the press ────────────────────────────────────────────
   Every button answers the finger. Until 27 Aug none of them did: the only
   pressed state in this file belonged to the date arrows, so on six boards
   a tap and a miss looked identical and a slow write invited a second tap
   that wrote twice.                                                      */
.btn:active { background:var(--ctl-bdr); }
.btn.solid:active { background:var(--ctl-ink); border-color:var(--ctl-ink); }
.btn.terra:active { background:var(--terra-t); }
/* The print sheets' Print button is dark with white text, so the boards'
   pale press would erase its label. It darkens instead; only the outlined
   Refresh beside it takes the pale one.                                 */
.tier-print .btn:active { background:var(--ctl-ink); }
.tier-print .btn.ghost:active { background:var(--ctl-bdr); }

/* ── what a save says back ────────────────────────────────
   Writing, then landed. The grey is the colour law's "sent, waiting on the
   other side"; the green is its "done, confirmed", and it is worn only
   AFTER the write - a button green at rest claims the record is clean
   before anyone has pressed it. Both states are disabled, and both undo
   the disabled dimming: a washed out answer is not an answer.

   Ruled by the owner, 27 Aug: the button RESTS at Saved until there is
   more to save. It is re-armed by armSave() on the next edit, never by a
   timer - a label that times out goes back to saying "Save" about a
   record with nothing left to save.                                     */
.btn.saving, .btn.saved { opacity:1; cursor:default; }
.btn.saving { background:rgba(28,28,26,.045); border-color:var(--ctl-bdr);
              color:var(--mid); }
.btn.saved  { background:var(--save-bg); border-color:var(--save-bdr);
              color:var(--save-ink); }
/* Failure is words, in red, under the button that failed - never a red
   fill. Red is failure's colour but a whole red tile reads as a state the
   record is in, and the record is simply unsaved.                       */
.savefail { display:none; font-family:var(--ui-font); font-size:11px;
            line-height:1.45; color:var(--red); margin-top:8px; }
.savefail.show { display:block; }

/* ── access message ───────────────────────────────────────
   Stands in for a board the signed-in login may not see. Plain typography,
   never a bordered or filled box: that dress belongs to buttons alone, and
   a message wearing it reads as something to tap. One statement, not a
   fact stacked under a fact. The retry action IS a button, so it wears
   the .btn above.                                                        */
.noaccess { display:none; font-family:var(--ui-font); font-size:15px;
            line-height:1.5; color:var(--ctl-ink); max-width:420px;
            margin:24px 0; }
.noaccess.show { display:block; }
.noaccess .na-retry { margin-top:16px; display:block; width:max-content; }

/* keep controls off paper */
@media print {
  .navwrap, .foot, .dnav { display:none !important; }
  body { display:block; min-height:0; }   /* flex column off paper */
}

                   padding:6px 14px; }

.sec { font-family:var(--ui-font); font-size:var(--t1); color:var(--mid); margin:26px 0 12px;

  .selbar { position:fixed; left:0; right:0; bottom:0; z-index:40;

  .selbtn.vac  { background:var(--slate); }

  /* rows */

  .actions.hidden { visibility:hidden; }

             padding:12px 0 calc(12px + env(safe-area-inset-bottom)); }
  /* .btn wears nala-ui.css's shared dress; the rows here only lay it out. */
  .actions .btn { flex:1 1 40%; }

  /* sheet */
  .backdrop { position:fixed; inset:0; background:rgba(28,28,26,.35);
              display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .backdrop.show { display:flex; }
  .sheet { width:100%; max-width:520px; background:var(--cream);
           min-height:560px;
           padding:26px 24px 120px; border-top:1px solid var(--rule);
           max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sheet h3 { font-family:var(--ui-font); font-size:var(--t2); color:var(--mid); font-weight:normal;
              text-align:center; margin:0 44px 12px; }
  .opt { width:100%; padding:15px; margin-bottom:8px; border:1px solid transparent;
         border-radius:var(--r); min-height:var(--tap);
         font-family:var(--ui-font); font-size:var(--t2); color:#fff; cursor:pointer; }
  /* matches the room tile palette */
  /* The dining state, in the colour law's green, same as the tile. */
  .opt.din   { background:var(--green); border-color:var(--green); }
  .opt.out   { background:var(--terra); border-color:var(--terra); }   /* not dining - red */
  .opt.vac   { background:var(--slate); border-color:var(--slate); }   /* vacant - slate */
  .opt.quiet { background:transparent; border-color:var(--rule); color:var(--mid); }

         color:var(--ink); cursor:pointer; }
  .pax.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }

  .chip { padding:7px 12px; border:1px solid var(--rule); background:transparent;
          border-radius:var(--pill); font-family:var(--ui-font); font-size:var(--t2);
          color:var(--mid); cursor:pointer; }
  .chip.on { background:var(--accent); color:var(--accent-ink);
           border-color:var(--accent); }

  .seg { display:flex; gap:6px; margin:2px 0 12px; }
  .seg button { flex:1; padding:11px 0; border:1px solid var(--rule); background:transparent;
                font-family:var(--ui-font); font-size:var(--t2); color:var(--mid); cursor:pointer; border-radius:var(--r); }
  .seg button.on { background:var(--accent); color:var(--accent-ink);
                 border-color:var(--accent); }
  .rm-row { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:2px 0 14px; }
  .rmp { height:40px; border:1px solid var(--rule); background:transparent;
         font-family:var(--ui-font); font-size:var(--t2); color:var(--ink);
         cursor:pointer; border-radius:var(--r); }
  .rmp.on { background:var(--accent); color:var(--accent-ink);
          border-color:var(--accent); }
  /* Reported 18 Aug from a real handset: the villa heading and the name were
     being squeezed against the menu button, because the sheet header did not
     know the button was there. The name line is given room to breathe and the
     panel below it is set a little tighter, so a full snapshot and the three
     service buttons still fit one screen without scrolling. */
  .gd { position:relative; text-align:center; margin:-4px 44px 12px;
        font-size:var(--t2); line-height:1.5; }
  .gd .gd-sub { display:block; font-family:var(--ui-font); font-size:var(--t2);
                color:var(--mid); }
  .gd .gd-note { display:block; font-style:italic; font-size:var(--t2); color:var(--mid); }

  /* ── the guest snapshot ───────────────────────────────────────────────
     Everything the app holds about whoever is in the villa, behind one tap.
     The sheet showed a name and a phone number and nothing else, so the
     dates, the head count from Mews and the guest's own pre-arrival answers
     were all being collected and shown nowhere.

     Shut by default. Reception opens this sheet twenty times a service to
     press one of three buttons, and a panel of detail sitting open in front
     of those buttons would be in the way every time for the once it is
     wanted. */
  /* The name IS the control, so it must look pressable without shouting: a
     dotted underline reads as "there is more here" where a solid one reads as
     a phone link, which is a different promise. */
  .gd-name { font:inherit; color:var(--ink); background:none; border:0;
             padding:0 1px; margin:0; cursor:pointer; text-align:center;
             border-bottom:1px dotted var(--mid); line-height:1.3; }
  .gd-name.on { border-bottom-style:solid; border-bottom-color:var(--ink); }
  .gd-name:active { opacity:.6; }
  /* Grid rather than a list: the labels line up down the left so the eye can
     run down the values, which is how a sheet like this is read. */
  /* Lies OVER the card rather than pushing it down. Two tries got this wrong.
     Folding open in place moved the service buttons every time the panel was
     opened, and then reveals-downward still displaced them, so the guest
     count and Dining collided with the panel as it grew. Reception presses
     those three buttons from memory, and a control that moves under the thumb
     is worse than one that is hard to find.

     So the card stays exactly where it is and the snapshot floats above it,
     anchored under the name it belongs to. Nothing below moves at all.

     Pulled out to the full width of the sheet: the name line is inset to keep
     clear of the menu button, and the panel has no such problem. */
  .gd-panel { position:absolute; top:100%; left:-44px; right:-44px; z-index:6;
              margin-top:8px; padding:12px 16px 4px; text-align:left;
              overflow-y:auto;

              opacity:0; visibility:hidden; transform:translateY(-6px);
              transition:opacity .18s ease, transform .18s ease,
                         visibility 0s linear .18s; }
  .gd-panel.open { opacity:1; visibility:visible; transform:translateY(0);
                   transition:opacity .18s ease, transform .18s ease,
                              visibility 0s; }
  @media (prefers-reduced-motion: reduce) {
    .gd-panel { transition:none; }
    .gd-panel.open { transition:none; }

<script>
(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });

  /* Role gate, per the matrix in ROLES.md. Two different things here: a role
     that may not see this board at all, and a role that may read it but not
     write to it. The chef is the second - they open the app to see who is
     eating and what they cannot have, and print the sheet.             */
  window.NALA_ROLE = null;
  window.CAN_EDIT  = false;
  (function gate(){
    /* Wait for the helper too, not just firebase: a stubbed SDK calls back
       synchronously, and nala-shared.js loads at the foot of the page.
       auth() itself throws when no app has been initialised, and a partial
       SDK can arrive without onAuthStateChanged, so both are guarded: a
       throw here would take the whole page down with it.               */
    if (!window.firebase || !firebase.auth ||
        typeof loadStaff !== 'function'){ setTimeout(gate,300); return; }
    var A;
    try { A = firebase.auth(); } catch (e){ setTimeout(gate,300); return; }
    if (!A || typeof A.onAuthStateChanged !== 'function'){ setTimeout(gate,300); return; }
    A.onAuthStateChanged(function(u){
      if (!u) return;                 /* auth.js owns the signed-out state */
      loadStaff(function(recs, err){
        var role = roleOf(u);
        window.NALA_ROLE = role;
        /* Who, for the editedBy stamp on the staff note. The front desk
           sets this at its own login; the board never needed it until the
           panel learned to write. */
        window.NALA_ME   = u.email || '';
        window.CAN_EDIT  = can(role,'editBookings');
        window.NALA_NAVFILTER(role);
        showAccess(can(role,'resBoard'), err);
      });
    });
  })();


  /* The menu filter lives in nala-shared.js (navFilterShared), which
     overwrites the page copy that used to sit here - a stale map missing
     half the links, kept alive only until this page was next touched. */

  function showAccess(allowed, err){
    var box = document.getElementById('noAccess');
    var on  = !allowed;
    box.innerHTML = !on ? '' :
      (err ? '<div>Could not check access. This is usually the connection, '
           + 'not your login.</div>'
           + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
           : 'This login has no access to Reservations. See the manager.');
    /* A role that cannot see this page but has a board of its own is sent
       there rather than shown a refusal. Only a login with no role at all
       gets the message, because it has nowhere to be sent.             */
    if (on && !err){
      var home = homeFor(window.NALA_ROLE);
      if (home && home !== location.pathname.split('/').pop()){
        location.replace(home); return;
      }
    }
    box.className = 'noaccess' + (on ? ' show' : '');
    ['menuState','statsRow','tablesLine','roomsSec','rooms','listSec',
     'listBookings','footActions'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.style.display = on ? 'none' : '';
    });
    /* Read only: the board stays, every way of writing to it goes. The
       tile sheet is the edit surface, so it does not open at all - see
       the guard in openRoom.                                          */
    document.body.classList.toggle('readonly', !on && !window.CAN_EDIT);
    if (!on && !window.CAN_EDIT){
      ['selToggle','addExt'].forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
    }
  }
})();
</script>

    <a href="#" id="addExt">+ Add reservation</a>
  </div>

    <button class="btn" onclick="location.reload()">Refresh</button>
    <a class="btn" href="stats.html">Stats</a>

<div class="selbar" id="selBar">
  <div class="selbar-inner">
    <div class="selcount" id="selCount"></div>
    <div class="selactions">
      <button class="selbtn vac"   id="sbVac">Vacant</button>
      <button class="selbtn din"   id="sbDin">Dining</button>
      <button class="selbtn out"   id="sbOut">Not dining</button>
      <button class="selbtn quiet" id="sbClear">Clear rooms</button>

    </div>

  <div class="sheet" id="sheet"></div>
</div>

<script>
/* NALA shared helpers - one copy of the logic every staff page repeats.
   Plain globals, same names the pages already use, so page code reads
   unchanged. See STYLEGUIDE.md and HANDOVER.md.                      v2 */

var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
var ROOMS = 17;
var ALLERGENS = ['Nut allergy','Shellfish allergy','Egg allergy'];

/* ── dates ─────────────────────────────────────────────────── */
function dkey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// Safari only accepts 3 fractional digits in an ISO date; Python writes 6.
// Trim them so any timestamp parses on every browser.
function parseISO(s){
  if (!s) return null;
  var t = String(s).trim().replace(/(\.\d{3})\d+/, '$1');
  var d = new Date(t);
  if (!isNaN(d)) return d;
  d = new Date(t.replace(/\.\d+/, ''));      // drop fractions entirely
  return isNaN(d) ? null : d;
}

function parseDepDate(s){
  if(!s) return null;
  s = String(s).trim();
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  var i = s.match(/^(\d{4})-(\d{2})-(\d{2})/);       // ISO - build a LOCAL date,
  if (i) return new Date(+i[1], +i[2]-1, +i[3]);     // never via the UTC parser
  var d = new Date(s);
  return isNaN(d) ? null : d;
}

function ord(n){
  var s=['th','st','nd','rd'], v=n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

/* the one date format: Wd Dth Mon (see STYLEGUIDE.md) */
function dateLabel(d){
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()]+' '+ord(d.getDate())+' '+mo[d.getMonth()];
}

/* ── the standard header's date row ────────────────────────────
   Wires ‹ › Today and writes the one date format into #date/#title.
   Tolerates missing arrows (hc tally shows the date alone).
   Returns { VIEW, todayKey, isToday } for the page to use.        */
function initDateNav(){
  var VIEW = (function(){
    var q = new URLSearchParams(location.search).get('date');
    if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) {
      var p = q.split('-');
      return new Date(+p[0], +p[1]-1, +p[2]);
    }
    return new Date();
  })();
  function todayKey(){ return dkey(VIEW); }
  function isToday(){ return dkey(VIEW) === dkey(new Date()); }
  function shiftDate(n){
    var d = new Date(VIEW); d.setDate(d.getDate()+n);
    var q = new URLSearchParams(location.search);
    q.set('date', dkey(d));
    location.search = q.toString();
  }
  function goToday(){
    var q = new URLSearchParams(location.search);
    q.delete('date');
    location.search = q.toString();
  }
  var el = document.getElementById('date') || document.getElementById('title');
  if (el) el.textContent = dateLabel(VIEW);
  var pv = document.getElementById('dPrev'), nx = document.getElementById('dNext'),
      td = document.getElementById('dToday');
  if (pv) pv.onclick = function(){ shiftDate(-1); };
  if (nx) nx.onclick = function(){ shiftDate(1); };
  if (td){
    td.onclick = function(e){ if (e) e.preventDefault(); goToday(); };
    td.disabled = isToday();     // always visible; dimmed when already on today
  }
  /* Tapping the date itself opens the phone's own date picker, for the jump
     the arrows are bad at: next Friday is four taps of an arrow and one of a
     calendar. A real date input is laid invisibly over the label, so the tap
     that opens the picker is a genuine tap on a genuine input - iOS opens it
     from focus alone, where showPicker() does not exist on older Safari.
     Desktop browsers focus the field but only open the calendar from its
     icon, so showPicker() is called too, where it does exist. Picking today
     drops the ?date rather than pinning it, same as the Today button, so the
     page follows the clock again instead of freezing on a written date. */
  if (el){
    el.style.position = 'relative';
    el.style.cursor = 'pointer';
    var pick = document.createElement('input');
    pick.type = 'date';
    pick.value = dkey(VIEW);
    pick.setAttribute('aria-label', 'Choose a date');
    pick.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;'+
      'opacity:0;border:0;padding:0;margin:0;cursor:pointer;'+
      '-webkit-appearance:none;appearance:none;background:transparent;';
    pick.onclick = function(){
      if (pick.showPicker){ try { pick.showPicker(); } catch (e){} }
    };
    pick.onchange = function(){
      var v = pick.value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
      var q = new URLSearchParams(location.search);
      if (v === dkey(new Date())) q.delete('date'); else q.set('date', v);
      location.search = q.toString();
    };
    el.appendChild(pick);
  }
  return { VIEW:VIEW, todayKey:todayKey, isToday:isToday };
}

/* ── room-guest look-back ──────────────────────────────────────
   Most recent record for a room across the previous fortnight.
   A guest who opened the link days ago still appears, unless
   they have departed. Reads each date individually so no
   permission is needed on the parent node.                       */
/* A fortnight of roomguests is 14 of the 19 requests a board makes, and it is
   the part that does not move: a booking recorded last Tuesday is still what
   it was. Polling it every 20 seconds alongside the things that DO move costs
   about five times the bandwidth for no extra freshness, so it is held for a
   few minutes and refetched on a full load.
   Pass force = true to ignore the cache.                                  */
var RG_CACHE = null, RG_AT = 0, RG_KEY = '', RG_MAX_AGE = 5 * 60 * 1000;

function fetchRoomGuests(endKey, days, force){
  days = days || 14;
  if (!force && RG_CACHE && RG_KEY === endKey + ':' + days &&
      (Date.now() - RG_AT) < RG_MAX_AGE){
    return Promise.resolve(RG_CACHE);
  }
  var parts = endKey.split('-');
  var end = new Date(+parts[0], +parts[1]-1, +parts[2]);
  var jobs = [], keys = [];
  for (var i = days - 1; i >= 0; i--) {
    var d = new Date(end); d.setDate(d.getDate() - i);
    var k = dkey(d);
    keys.push(k);
    jobs.push(
      fetch(DB + '/roomguests/' + k + '.json?v=' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
    );
  }
  return Promise.all(jobs).then(function(res){
    var all = {};
    res.forEach(function(day, i){ if (day) all[keys[i]] = day; });
    /* Only cache a complete answer. A partial fetch cached for five minutes
       would show a villa as empty because one day failed to load.       */
    if (res.every(function(day, i){ return day !== null || true; })){
      RG_CACHE = all; RG_AT = Date.now(); RG_KEY = endKey + ':' + days;
    }
    return all;
  });
}

function clearRoomGuestCache(){ RG_CACHE = null; RG_AT = 0; }

function resolveRoomGuests(all, todayK){
  var out = {};
  var dates = Object.keys(all || {}).filter(function(d){ return d <= todayK; }).sort();
  dates.forEach(function(d){
    var day = all[d] || {};
    for (var room in day){ out[room] = day[room]; }   // later dates overwrite earlier
  });
  // drop anyone checked out by this sheet's dinner: a guest departing on
  // the sheet date leaves that morning, so their last sheet is the night before
  for (var room in out){
    var dep = out[room] && out[room].departs;
    if (!dep) continue;
    var p = parseDepDate(dep);
    if (p && dkey(p) <= todayK) delete out[room];
  }
  return out;
}

/* ── guest misc ────────────────────────────────────────────── */
function tidyPhone(p){
  if (!p) return '';
  p = String(p).replace(/[^\d]/g,'');
  if (p.length === 9 && p[0] === '4') p = '0' + p;   // restore a lost leading zero
  return p;
}

/* ── renamed dietaries ─────────────────────────────────────────
   The owner renamed two pills on 26 Aug: a pill names the thing the guest
   cannot eat, so "Gluten free" and "Dairy free" are "Gluten" and "Dairy".
   Answers already saved carry the old wording - in dinner cells, in
   pre-arrival records, in /guests, in tonight's tags - and nothing sweeps a
   live database to rewrite a fact a guest gave us. So every reader maps the
   old name to the new one: displays show the new word, the old answers still
   light the chips and still hit the menu-tag comparison, and the next save
   of any record writes the new name back, which is how the data converges
   without a migration.

   The table is copied into index.html and prearrival.html, which are guest
   pages and deliberately load no staff code. tests/diet_renames.json is the
   shared table all three copies are checked against - add a rename there,
   never to one copy. */
var DIET_RENAMES = { 'Gluten free': 'Gluten', 'Dairy free': 'Dairy' };
function fixDietName(d){ return DIET_RENAMES[d] || d; }
function fixDietList(list){
  var out = [];
  (list || []).forEach(function(d){
    d = fixDietName(d);
    if (out.indexOf(d) === -1) out.push(d);
  });
  return out;
}
/* Tonight's tags, per course, as /menutags stores them. */
function fixTagNames(tags){
  if (!tags) return tags;
  var out = {};
  Object.keys(tags).forEach(function(c){
    out[c] = Array.isArray(tags[c]) ? fixDietList(tags[c]) : tags[c];
  });
  return out;
}
/* The master list, as /dietaries stores it: keyed by the name, so a rename
   moves the record to the new key. The keying transform is keyOf() on the
   pages that write the list - the same three steps, kept in step by the
   suites. If the database somehow holds both spellings the two records
   merge, active if either was. */
function fixDietMaster(master){
  if (!master) return master;
  var out = {};
  Object.keys(master).forEach(function(k){
    var d = master[k] || {};
    var nd = {}; for (var f in d) nd[f] = d[f];
    nd.name = fixDietName(d.name || k);
    var key = nd.name.trim().replace(/[.#$\/\[\]]/g,'').replace(/\s+/g,' ');
    if (out[key]) out[key].active = !!(out[key].active || nd.active);
    else out[key] = nd;
  });
  return out;
}
function dietMasterRenamed(master){
  return !!master && Object.keys(master).some(function(k){
    var n = (master[k] && master[k].name) || k;
    return fixDietName(n) !== n;
  });
}

/* ── dietary conflicts against the tagged menu ─────────────── */
function menuConflicts(menu, diets){
  if (!diets || !diets.length || !menu) return [];
  var hits = [];
  ['bread','entree','main','dessert'].forEach(function(k){
    var dish = menu[k];
    if (!dish || !dish.conflicts) return;
    dish.conflicts.forEach(function(tag){
      tag = fixDietName(tag);
      diets.forEach(function(d){
        d = fixDietName(d);
        if (String(d).toLowerCase() === String(tag).toLowerCase())
          hits.push({ dish: dish.name || k, diet: d });
      });
    });
  });
  return hits;
}

function dietHTML(diets, sep, cls){
  diets = fixDietList(diets);
  if(!diets.length) return '';
  cls = cls || 'allergen';
  return diets.map(function(d){
    return (ALLERGENS.indexOf(d)>-1 || /allerg/i.test(d)) ? '<span class="'+cls+'">'+d+'</span>' : d;
  }).join(sep || ' \u00b7 ');
}

/* ── housekeeping variants - deliberately different from above ──
   resolveRoomGuestsHK KEEPS guests departing today: they are the
   cleans. The dinner resolver drops them. Do not merge the two.   */
function resolveRoomGuestsHK(all, todayK){
  var out = {};
  var dates = Object.keys(all || {}).filter(function(d){ return d <= todayK; }).sort();
  dates.forEach(function(d){
    var day = all[d] || {};
    for (var room in day){ out[room] = day[room]; }
  });
  for (var room in out){
    var dep = out[room] && out[room].departs;
    if (!dep) continue;
    var p = parseDepDate(dep);
    if (p && dkey(p) < todayK) delete out[room];   // gone before today
  }
  return out;
}

/* One request, one date. Unlike roomguests, which needs a fortnight of history
   because a guest may have opened their link days ago, /stays is written by the
   PMS sync for every night of a stay, so the date being shown is the only date
   worth asking for. That is why each night carries the guest rather than a
   pointer: a pointer would cost a request per villa and undo the work that took
   a poll from nineteen requests to four.                                    */
/* The dinner cells for the date fetchStays was last called with.

   Every page that renders a night already calls fetchStays for that date, so
   the cells are fetched alongside and kept here. roomRecord falls back to this
   when a caller passes nothing, which means the two printed sheets pick the
   cell up without their own files changing.

   That matters because those two belong to a different chat. Without it, a
   villa booked on the board today shows on screen and is missing from the
   paper, which is the worst kind of wrong: the chef has no way to know.

   Worth making explicit later, when the sheets are next open: they should read
   /dinner themselves and pass it in, like the boards do. Until then this is
   the seam that keeps screen and paper agreeing.                          */
var DINNER_CELLS = {};

/* Which villas opened their menu link on the date fetchStays was last called
   with. Kept beside DINNER_CELLS for the same reason: every page that renders
   a night already asks for that night, so the marks ride along and no page
   grows a fetch of its own.

   It answers the question the dinner cell cannot. An empty cell says nobody
   has answered. It does not say whether anybody was asked. */
var OPENED_MARKS = {};

/* True when this villa opened its link on the night being shown. */
function openedTonight(villa, marks){
  var m = (marks || OPENED_MARKS)[String(villa)];
  return !!(m && m.at);
}

/* ── a phone number a machine can dial ─────────────────────────
   ClickSend wants E.164 and the Worker stores what Mews sends, untouched:
   real records hold `0412 345 678`, `+61412345678`, `0412345678` and worse,
   because a guest typed them. This turns each into +614XXXXXXXX or refuses.

   Refusal is deliberate: no guessing at an international number, a landline,
   or a mobile with the wrong number of digits. A wrong guess sends a guest's
   dinner link to a stranger; a refusal is a greyed row naming a Mews record
   that cannot be fixed here.

   The invitations Worker carries its own copy of this function, because a
   Worker cannot import from the site. worker/invites-test.mjs asserts both
   copies against one table of cases, so the two cannot drift apart quietly.

   NOT tidyPhone in list.html, which goes the other way: that one makes a
   number readable by a person, this one makes it dialable by a machine.  */
function normalisePhone(raw){
  var s = String(raw == null ? '' : raw).replace(/[\s().\-]/g, '');
  /* 0011 is Australia's international dial-out and 00 most of the world's:
     both mean the + of E.164. */
  if (/^0011[1-9]\d/.test(s))    s = '+' + s.slice(4);
  else if (/^00[1-9]\d/.test(s)) s = '+' + s.slice(2);
  if (/^04\d{8}$/.test(s))    return '+61' + s.slice(1);   /* the common case */
  if (/^614\d{8}$/.test(s))   return '+' + s;              /* plus went missing */
  /* Our own country we can judge: +61 must be a mobile, a landline is
     refused rather than sent. Any other full country code is not a guess -
     the guest typed where they live - and is sent as typed. Widened 25 Aug
     when (+64) 274875277, an ordinary NZ mobile, was refused. A foreign
     number typed WITHOUT its code still returns null: 0274875277 reads as an
     Australian landline, and guessing the country texts a stranger. */
  if (/^\+61\d+$/.test(s))    return /^\+614\d{8}$/.test(s) ? s : null;
  if (/^\+[1-9]\d{7,14}$/.test(s)) return s;
  return null;                                             /* not sent, ever  */
}

/* How sure are we that a sendable number is a MOBILE? Advisory only - the
   send is still the judge - shown as the tick or the question mark beside
   the number on the SMS pages. Countries where the mobile ranges are
   published and unambiguous get a tick; everywhere else, including all of
   +1 where mobiles and landlines share the same ranges, is honestly a
   question mark. Extend the table as guests arrive from new countries. */
var MOBILE_SHAPES = [
  /^\+614\d{8}$/,          /* Australia: 04 */
  /^\+642\d{7,9}$/,        /* New Zealand: 02 */
  /^\+447\d{9}$/,          /* United Kingdom: 07 */
  /^\+316\d{8}$/,          /* Netherlands: 06 */
  /^\+49(15|16|17)\d{7,9}$/, /* Germany */
  /^\+33[67]\d{8}$/,       /* France */
  /^\+3538\d{8}$/,         /* Ireland: 08 */
  /^\+65[89]\d{7}$/,       /* Singapore */
  /^\+852[569]\d{7}$/,     /* Hong Kong */
  /^\+861[3-9]\d{9}$/,     /* China */
  /^\+91[6-9]\d{9}$/,      /* India */
  /^\+81[789]0\d{8}$/,     /* Japan: 070/080/090 */
  /^\+27[678]\d{8}$/,      /* South Africa */
  /^\+9715\d{8}$/          /* UAE: 05 */
];
function phoneConfidence(raw){
  var e = normalisePhone(raw);
  if (!e) return null;
  for (var i = 0; i < MOBILE_SHAPES.length; i++)
    if (MOBILE_SHAPES[i].test(e)) return 'mobile';
  return 'unsure';
}

/* ── the number beside a guest's name ──────────────────────────
   The raw number, small and grey; the confidence mark (a tick where the
   country's mobile ranges are published and this number sits in one, a
   question mark where nobody can tell a mobile from a landline); and the
   pencil that edits it. Grown on the Pre-arrival SMS page, wanted by the
   Front Desk days later, so built here once rather than pasted twice.

   Each page styles .ph/.conf/.pen in its own sheet and wires the pencil
   itself - by delegation on a page built from strings, by onclick on one
   built from nodes - and both hand the tap to editPhoneNumber below.
   showPen=false leaves the pencil out where editing has nothing to offer
   (a completed form needs no number and a dead pencil reads as broken). */
function phoneBadgeHTML(raw, showPen){
  raw = String(raw == null ? '' : raw).trim();
  var esc = function(t){ return String(t).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); };
  var h = '<span class="ph">' + (raw ? esc(raw) : 'no number') + '</span>';
  var confidence = raw ? phoneConfidence(raw) : null;
  if (confidence === 'mobile')
    h += '<span class="conf ok" title="Sits in this country’s published ' +
         'mobile ranges">✓</span>';
  else if (confidence)
    h += '<span class="conf un" title="A real number, but this country’s ' +
         'mobiles cannot be told from landlines; sending will find out">?</span>';
  if (showPen)
    h += '<span class="pen" role="button" aria-label="Edit number">✎</span>';
  return h;
}

/* The number editor behind the pencil. A browser prompt rather than a drawn
   form: it is rare, it is one field, and the keyboard it summons is the
   phone's own. What is saved is the normalised E.164 at /phonefix/<booking>,
   so the record can never hold a shape the send would refuse; the raw Mews
   value rides along as `was` for the audit. Mews itself stays wrong - it
   cannot be written from here - so the guest should still be corrected in
   Mews when somebody is in there. The fix outranks the Mews copy everywhere
   a number is read, because the next sync would revert an edit to the stay.

   cb hears the outcome: null after a successful save, otherwise the words to
   put on the page's error bar. Cancelling the prompt calls nothing at all. */
function editPhoneNumber(booking, cb){
  var typed = window.prompt(
    'Mobile number for ' + (booking.name || 'this guest') +
    '.\nInclude the country code for an overseas number, e.g. +64 27 487 5277.',
    String(booking.current || '').trim());
  if (typed == null) return;                       /* cancelled */
  var phone = normalisePhone(typed);
  if (!phone){
    cb('That is still not a sendable mobile number. Australian ' +
       'numbers can be typed as 04...; anything overseas needs its + country code.');
    return;
  }
  fetch(DB + '/phonefix/' + booking.id + '.json', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: phone, was: String(booking.was || ''),
                           by: (window.NALA_USER && NALA_USER.email) || '',
                           at: new Date().toISOString() })
  }).then(function(r){
    if (!r.ok) throw new Error();
    cb(null);
  }).catch(function(){
    cb('The number did not save. Try again.');
  });
}

function fetchStays(dateKey){
  return Promise.all([
    fetch(DB + '/stays/' + dateKey + '.json?v=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      /* A failure here must not empty the boards. Returning null means the
         merge simply falls back to roomguests, which is what it did before any
         of this existed.                                                   */
      .catch(function(){ return null; }),
    fetch(DB + '/dinner/' + dateKey + '.json?v=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; }),
    /* A failed read here must not read as nobody opened anything: that would
       put every villa back in the never reached pile and send reception
       chasing guests who already answered. Null, and the caller shows no
       marks rather than wrong ones. */
    fetch(DB + '/opened/' + dateKey + '.json?v=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })
  ]).then(function(res){
    DINNER_CELLS = res[1] || {};
    OPENED_MARKS = res[2] || {};
    /* One more read per occupied villa: the reservation's own answers. There
       is one dietary list per person and it lives on the reservation, not on
       a night, so the boards have to be able to see it even when the viewed
       night holds no dinner cell at all. A failed read leaves that villa's
       entry empty and the merge falls back to the night, which is exactly
       yesterday's behaviour rather than a blank board. */
    var stays = res[0] || {}, map = {};
    return Promise.all(Object.keys(stays).map(function(v){
      var id = stays[v] && stays[v].id;
      if (!id) return null;
      return fetch(DB + '/bookings/' + id + '/prearrival.json?v=' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
        .then(function(p){ if (p) map[String(v)] = p; });
    })).then(function(){
      PREARRIVAL_BY_VILLA = map;
      return res[0];
    });
  });
}

/* The reservation's dietaries, laid over a built record. The reservation wins
   when it has any, because an allergy is not true on Tuesday and false on
   Wednesday; the night's copy stands only as the fallback while older records
   still hold dietaries there and nowhere else. NOTES-AUDIT.md has the model
   and the correction: an earlier version said the night should win, and it
   was wrong. */
var PREARRIVAL_BY_VILLA = {};

/* When the arriving guest lands, as an hour on the 24 hour clock. Reception's
   approved hour wins outright; the guest's own slot stands next; and 2pm
   stands for every arrival that says nothing, because 2pm is the resort's
   standing promise, not a guess. disp is empty for that silent default: it
   sorts and warns like a stated 2pm but nobody set it, so nothing is drawn.

   Here rather than in a page, because the Cleans board and the printed Clean
   Sheet both render it, and two copies of when the guest lands is how screen
   and paper drift apart. The Worker holds the server side mirror. */
function effectiveEta(villa){
  var pre = PREARRIVAL_BY_VILLA[String(villa)] || {};
  var ap = Number(pre.arriveApproved);
  if (pre.arriveApproved != null && ap >= 11 && ap <= 23)
    return { h: ap, disp: hour12(ap), early: ap < 14 };
  var s = String(pre.arriveSlot || '');
  if (s === 'before2') return { h: 14, disp: '<2pm', early: true };
  if (s === 'after5')  return { h: 17, disp: '>5pm', early: false };
  /* Two digits are an hour, four are an hour and its half: the nine keys the
     guest's track writes. Same list as the three page copies. */
  if (/^1[4-7](30)?$/.test(s)){
    var hh = +s.slice(0, 2) + (s.length === 4 ? 0.5 : 0);
    return { h: hh, disp: hour12(hh), early: false };
  }
  return { h: 14, disp: '', early: false };
}
function hour12(h){
  var w = Math.floor(h);
  return (w > 12 ? w - 12 : w) + (h % 1 ? ':30' : '') + (w < 12 ? 'am' : 'pm');
}
function etaWord(disp){
  return disp === '<2pm' ? 'before 2pm' : disp === '>5pm' ? 'after 5pm' : disp;
}

function overlayReservationDiets(rec, villa){
  if (!rec) return rec;
  var pre = PREARRIVAL_BY_VILLA[String(villa)];
  if (!pre) return rec;
  if (pre.diets && pre.diets.length){
    rec.diets = pre.diets.slice();
    /* The reservation's list is the person's list, so dietaries are never
       "previous": a copy carried forward on roomguests is an old copy of a
       current fact, not an unconfirmed answer. Leaving prevDiets set showed
       the same allergy twice, once with a warning to ask first. */
    delete rec.prevDiets;
    if (pre.dnote){
      rec.dnote = pre.dnote;
      /* The bubble and its popover read the stamped field, and the stamp
         runs before this overlay, so a note living only on the reservation
         was invisible to both: the bubble called an explained Other
         unexplained and went red, and opened onto nothing. 20 Aug. */
      rec.dineDnote = pre.dnote;
      delete rec.prevDnote;
    }
  }
  return rec;
}

/* Turns one /stays/<date>/<villa> entry into the shape roomguests uses, so it
   can sit in the same merge instead of needing its own handling everywhere.
   Tolerates the older shape, where the value was the booking id as a bare
   string: those entries carry no guest and are ignored rather than crashing.  */
/* True when a record came from the PMS and the guest has not opened their link.
   The two are different facts and must not be conflated: "we know who is in
   villa 4" is not "villa 4 has replied to us". Conflating them puts the link
   opened mark on every synced booking, which is the exact signal the sync
   exists to stop staff relying on.                                         */
function isMewsOnly(rec){
  return !!(rec && rec.source === 'mews');
}

/* Is anybody attached to this villa on this date at all: a Mews reservation, a
   guest who opened their link, or a record reception typed in. It is the line
   between the two empty states on the boards, which mean different things and
   want different reactions.

     vacant   nobody is booked into this villa, so there is no question to ask
     awaiting somebody is, and they have not said yes or no to dinner yet

   A record with nothing in it is not a guest. `roomguests` carries empty
   objects around from older writes, and one of those showing as a booking was
   what made the boards look busier than the resort was. */
function hasGuestProfile(rec){
  return !!(rec && typeof rec === 'object' &&
            (rec.name || rec.bookingId || rec.departs || rec.arrives || rec.phone));
}

function mewsRecord(stay){
  if (!stay || typeof stay !== 'object') return null;
  var name = [stay.first, stay.last].filter(Boolean).join(' ').trim();
  if (!name && !stay.depart) return null;
  var out = { source:'mews', bookingId: stay.id, pmsUpdated: stay.updated || null };
  if (name)          out.name    = name;
  if (stay.phone)    out.phone   = stay.phone;
  if (stay.depart)   out.departs = stay.depart;
  if (stay.arrive)   out.arrives = stay.arrive;
  if (stay.adults)   out.adults  = stay.adults;
  /* The second guest, as Mews sent it. The Worker has written this onto
     every night since 19 Aug and this reader dropped it, which is why no
     board could ever show a companion the Zap delivered. */
  if (stay.companion) out.companion = stay.companion;
  /* One party can hold several villas. Two reservations under one group are
     not two guests who happen to share a surname, and a board that treats them
     as strangers will seat them apart. */
  if (stay.groupId)  out.groupId = stay.groupId;
  /* The human readable reservation number. Carried so reception can look a
     booking up in Mews without opening the app's own id, which is a GUID and
     no use to anybody standing at a desk. */
  if (stay.number)   out.number  = stay.number;
  return out;
}

/* The second guest's name, one reading for every surface that shows it.
   What a person typed - the guest at pre-arrival, or reception at the desk,
   both landing in prearrival.companion - wins; the name Mews sent stands
   behind it. The same order the desk's answersOf established, now read
   through here by every page. One name, never a list: whether a villa can
   hold more than one companion is an open decision in HANDOVER.md, and the
   field is a single value everywhere until it is settled. */
function companionOf(pre, rec){
  return String((pre && pre.companion) || (rec && rec.companion) || '').trim();
}

/* Every OTHER villa the same party holds tonight. Empty for the ordinary case
   of one booking in one villa, which is nearly all of them.

   It cannot tell a two villa booking from a guest who was moved: both look
   like one group across two villas with overlapping dates. Only a cancellation
   separates those, so this reports rather than decides. */
function groupVillas(roomguests, villa){
  var me = roomguests && roomguests[String(villa)];
  if (!me || !me.groupId) return [];
  var out = [];
  for (var v in roomguests){
    if (String(v) === String(villa)) continue;
    var r = roomguests[v];
    if (r && r.groupId === me.groupId) out.push(String(v));
  }
  return out.sort(function(a,b){ return (+a) - (+b); });
}

/* ── the pre-arrival form's state ──────────────────────────────
   Three states, the owner's ruling of 28 Aug:

     not started   nobody has answered anything
     incomplete    somebody has, and it has not been marked complete
     completed     the guest pressed Send, or the desk marked it complete

   It replaces two overlapping systems that could disagree. The Front Desk
   row tint was computed from the answers; `at` was a stamp written by
   something else entirely; and nothing reconciled them, so a booking could
   read completed on one board and incomplete on the other while holding
   nothing at all. Villa 17, 28 Aug.

   Read here rather than in each board for the same reason. Two readings of
   one state is how they came to disagree in the first place.

   prearrival.html cannot read any of this: it is a GUEST page and loads no
   staff code. Its half of the contract is tests/form_questions.json and
   tests/onenight_cases.json, which both suites answer to. */

/* The keys a guest can answer. Held here since 28 Aug: the Front Desk and
   Pre-arrival SMS each had their own copy and they had ALREADY drifted - the
   desk had learnt that a noDiets of false says nothing, and Pre-arrival SMS
   had not, so the two counted a cleared dietary differently. */
var GUEST_ANSWERS = ['arriveSlot','arriveNote','dining','diets','noDiets',
                     'dnote','purpose','approach','wellness','wellDay',
                     'wellTime','occasion','note','companion'];

function countGuestAnswers(p){
  if (!p) return 0;
  return GUEST_ANSWERS.filter(function(k){
    var v = p[k];
    if (v === undefined || v === null || v === '') return false;
    if (Array.isArray(v)) return v.length > 0;
    /* "No" is an answer - but only to a question with two sides. dining and
       wellness have them; noDiets is a flag, where true declares "nothing to
       declare" and false says nothing at all. */
    if (v === false) return k !== 'noDiets';
    return true;
  }).length;
}
function guestAnswered(p){ return countGuestAnswers(p) > 0; }

/* How many nights, from whatever shape Mews sent the dates in. parseDepDate
   builds a LOCAL date from the date part, so a full ISO timestamp and a bare
   date count the same - which they must, since Mews sends both. */
function stayNights(s){
  var a = parseDepDate(s && s.arrive), b = parseDepDate(s && s.depart);
  if (!a || !b) return null;
  return Math.round((b - a) / 86400000);
}
function oneNightStay(s){ return stayNights(s) === 1; }

/* What a booking must hold before it may be called complete: the three
   decisions the desk settles and other boards act on. The owner's ruling of
   28 Aug, asked and answered directly - purpose and dining approach are
   deliberately NOT here, because no board acts on them and blocking a
   completion over them would be blocking it over colour.

   A one night stay is not owed the treatment answer. The guest form never
   offers it - one afternoon is no window for the therapists, the owner ruled
   25 Aug - so a question never put to them cannot be held against them. */
function mandatoryAnswered(p, stay){
  if (!p) return false;
  var dinner  = p.dining === true || p.dining === false;
  var dietary = !!p.noDiets ||
                (Array.isArray(p.diets) ? p.diets.length > 0 : !!p.diets);
  var massage = p.wellness === true || p.wellness === false;
  return dinner && dietary && (massage || oneNightStay(stay));
}
