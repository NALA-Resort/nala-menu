<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nala Villas">
<link rel="apple-touch-icon" href="nala-icon.png?v=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMO · Nala · Tonight's Numbers</title>
<style>
/* NALA staff UI - shared controls. See STYLEGUIDE.md.
   Pages declare <body class="tier-app"> or <body class="tier-print">.  */

:root {
  --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA; --red:#A8321E;
  /* Staff tools use the Apple system font: it is what every other app on the
     phone uses, its figures line up, and it is built for small sizes. The
     guest pages do NOT use these tokens - they carry the brand and set their
     own font, so this can change without touching them.                  */
  --ui-font:-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto,
            Helvetica, Arial, sans-serif;
  --num-font:var(--ui-font);
}

/* Double tap to zoom is a hazard on a board of tap targets: a quick second
   tap on a villa tile zooms the page instead of doing the thing. This turns
   that gesture off while LEAVING pinch zoom alone, so nobody who needs to
   magnify the page loses it. The old user-scalable=no meta does not do this;
   iOS ignores it on purpose.                                             */
body.tier-app, body.tier-print { touch-action:manipulation; }

/* tier surfaces used by controls */
.tier-app   { --ctl-bg:var(--cream); --ctl-bdr:var(--rule); --ctl-ink:var(--ink); }
.tier-print { --ctl-bg:#fff;         --ctl-bdr:#ddd;        --ctl-ink:#111;      }

/* ── one header row: [Today] [<] date [>] ....... [menu] ── */
.navwrap { position:relative; margin-left:auto; z-index:500; font-family:var(--ui-font); }
.navbtn  { border:1px solid var(--ctl-bdr); background:var(--ctl-bg);
           border-radius:8px; cursor:pointer; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:4px; padding:0;
           -webkit-tap-highlight-color:transparent; }
.navbtn span { display:block; width:16px; height:1.6px; background:var(--ctl-ink); }
.navdrop { display:none; position:absolute; right:0; top:42px; background:var(--ctl-bg);
           border:1px solid var(--ctl-bdr); border-radius:9px; min-width:132px;
           box-shadow:0 4px 14px rgba(0,0,0,.09); padding:5px 0; }
.navdrop.open { display:block; }
.navdrop a { display:block; padding:12px 18px; font-size:10px; letter-spacing:.14em;
             text-transform:uppercase; color:var(--ctl-ink); text-decoration:none;
             white-space:nowrap; }
/* Signing out is an action, not a destination, so it sits below a rule rather
   than reading as one more page in the list. It is never filtered by role:
   every login has to be able to get out.                                  */
.navdrop a.signout { border-top:1px solid var(--ctl-bdr); margin-top:5px;
                     padding-top:13px; color:var(--mid); }

/* ── floating footer ──────────────────────────────────────
   sticky pins it while scrolling long pages; the flex column
   below pins it to the screen bottom on short pages too      */
body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
body > .wrap { flex:1 0 auto; display:flex; flex-direction:column; width:100%; }
.wrap > .foot, body > .foot { margin-top:auto; }
.foot { position:sticky; bottom:0; z-index:40; display:flex; gap:8px; flex-wrap:wrap;
        background:var(--ctl-bg); border-top:1px solid var(--ctl-bdr); margin-top:18px;
        padding:10px 0 calc(10px + env(safe-area-inset-bottom)); }
.foot .btn { flex:1; text-align:center; white-space:nowrap; }
/* the row sits hard against the bottom of the screen: soften only the two
   corners that land in the phone's own rounded corners                     */
.foot .btn:first-child { border-bottom-left-radius:8px; }
.foot .btn:last-child  { border-bottom-right-radius:8px; }

/* ── standard header: kicker, then one date row ─────── */
.daterow { display:flex; align-items:center; gap:8px;
           margin-bottom:12px; font-family:var(--ui-font); }
.daterow .date { font-size:13px; font-weight:bold; letter-spacing:.1em;
                 text-transform:uppercase; color:var(--ctl-ink); white-space:nowrap;
                 padding:0 2px; }
.dnav { width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
        background:var(--ctl-bg); border:1px solid var(--ctl-bdr); border-radius:7px;
        font-size:16px; line-height:1; color:var(--ctl-ink); cursor:pointer; padding:0;
        -webkit-tap-highlight-color:transparent; }
.dnav:active { background:var(--ctl-bdr); }
.dnav.today { width:auto; padding:0 12px; font-size:9.5px; letter-spacing:.13em;
              text-transform:uppercase; }
.dnav.today:disabled { opacity:.35; cursor:default; }
.navbtn { width:42px; height:36px; }
/* page name on paper only - the screen row replaces it */
.printkick { display:none; }
@media print { .printkick { display:block; text-align:center; font-family:var(--ui-font);
  font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:#666;
  margin-bottom:8px; } }

/* ── information is plain typography, never boxed ───── */
.stats { display:flex; justify-content:center; gap:36px; margin:16px 0 6px;
         font-family:var(--ui-font); }
.stat { text-align:center; }
.stat-n { display:block; font-size:27px; line-height:1; color:var(--ctl-ink);
          font-family:var(--num-font); }
.stat-l { display:block; font-size:8px; letter-spacing:.2em; text-transform:uppercase;
          color:var(--mid); margin-top:6px; }
.stat.warn .stat-n { color:var(--red); }

/* ── access message ───────────────────────────────────────
   Stands in for a board the signed-in login may not see. Plain typography,
   never a bordered or filled box: that dress belongs to buttons alone, and
   a message wearing it reads as something to tap. One statement, not a
   fact stacked under a fact. The retry action IS a button, so it wears
   the page's .btn.                                                       */
.noaccess { display:none; font-family:var(--ui-font); font-size:15px;
            line-height:1.5; color:var(--ctl-ink); max-width:420px;
            margin:24px 0; }
.noaccess.show { display:block; }
.noaccess .na-retry { margin-top:16px; display:block; width:max-content; }

/* keep controls off paper */
@media print {
  .navwrap, .foot, .dnav { display:none !important; }
  body { display:block; min-height:0; }   /* flex column off paper */
}

</style>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA; --red:#A8321E;
          /* state palette: dining green, declined terracotta, vacant slate */
          --green:#5E7D67;  --green-t:rgba(122,160,130,.26);  --green-b:rgba(122,160,130,.65);
          --terra:#9E6455;  --terra-t:rgba(184,106,90,.16);   --terra-b:rgba(184,106,90,.45);
          --slate:#57575E;  --slate-t:rgba(87,87,94,.10);     --slate-b:rgba(87,87,94,.28); }
  body { background:var(--cream); color:var(--ink); font-family:var(--ui-font);
         padding:28px 24px 0; -webkit-tap-highlight-color:transparent; }
  .wrap { max-width:520px; margin:0 auto; }

  .errbar { position:fixed; top:0; left:0; right:0; z-index:50;
            background:#A8321E; color:#fff; padding:12px 18px;
            font-family:var(--ui-font); font-size:11px; line-height:1.5;
            transform:translateY(-100%); transition:transform .25s; }
  .errbar.show { transform:translateY(0); }


.menustate { text-align:center; margin-top:12px; }
  /* Both states are pills. The published one renders as an <a> and the
     unpublished as a <span>, so this must match either - selecting only
     span left the published state unstyled but for its background.     */
  .menustate > * { display:inline-block; border-radius:20px;
                   font-family:var(--ui-font); font-size:9px;
                   letter-spacing:.16em; text-transform:uppercase;
                   /* letter-spacing leaves a trailing space after the last
                      character, inside the box, which pushes the text off
                      centre. Take it back off the right padding.        */
                   padding:6px calc(14px - .16em) 6px 14px; }
  .menustate .yes { background:rgba(122,160,130,.22); color:#3F6B4C;
                    text-decoration:none; }
  .menustate .yes b { font-weight:normal; opacity:.75; }
  .menustate .no  { background:rgba(184,106,90,.18);  color:#8E4433; }


.sec { font-family:var(--ui-font); font-size:8px; letter-spacing:.3em;
         text-transform:uppercase; color:var(--mid); margin:26px 0 12px;
         display:flex; justify-content:space-between; align-items:baseline; }
  .sec a { color:var(--ink); text-decoration:none; border:1px solid var(--rule);
           font-size:9px; letter-spacing:.14em; padding:6px 12px; border-radius:2px;
           background:transparent; }
  .sec a.active { background:var(--ink); color:var(--cream); border-color:var(--ink); }

  /* room grid */
  .rooms { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .room {
    aspect-ratio:1; border:1px solid var(--rule); background:transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:var(--ui-font); cursor:pointer; padding:0; position:relative;
  }
  .room-n { font-size:13px; color:var(--ink); }
  .room-p { font-size:8px; color:var(--mid); margin-top:2px; min-height:10px; }
  .comb-note { display:flex; align-items:center; justify-content:space-between; gap:10px;
               border:1px solid var(--ink); border-radius:8px; padding:9px 12px; margin-bottom:12px;
               font-family:var(--ui-font); font-size:11px; letter-spacing:.04em; }
  .comb-undo { border:none; background:transparent; color:var(--red); cursor:pointer;
               font-family:var(--ui-font); font-size:10px; font-weight:bold;
               letter-spacing:.1em; text-transform:uppercase; padding:4px 0;
               -webkit-tap-highlight-color:transparent; }
  .room.in     { background:var(--green-t); border-color:var(--green-b); }
  .room.in .room-n { color:var(--ink); }
  .room.in .room-p { color:var(--green); }
  .room.out    { background:var(--terra-t); border-color:var(--terra-b); }
  .room.out .room-n { color:var(--ink); opacity:.6; text-decoration:line-through; }
  .room.vacant { border-style:solid; border-color:var(--slate-b);
                 background:var(--slate-t); }
  .room.vacant .room-n { color:var(--mid); }
  .room.await  { border-style:dashed; border-color:var(--mid); }

  /* source icon */
  .mark { position:absolute; top:4px; right:4px; width:10px; height:10px; opacity:.75; }
  .mark svg { width:100%; height:100%; display:block; }
  .mark.seen { opacity:.55; }
  .mark.seen svg { fill:none; stroke:var(--mid); }
  .room.in  .mark svg { fill:var(--green); stroke:var(--green); }
  .room.out .mark svg { fill:var(--terra); stroke:var(--terra); }

  .room.sel { outline:2px solid var(--ink); outline-offset:-2px; }
  .room.sel .room-n { font-weight:bold; }

  .selbar { position:fixed; left:0; right:0; bottom:0; z-index:40;
            background:var(--cream); border-top:1px solid var(--rule);
            padding:14px 20px calc(14px + env(safe-area-inset-bottom));
            transform:translateY(110%); transition:transform .22s; }
  .selbar.show { transform:translateY(0); }
  .selbar-inner { max-width:520px; margin:0 auto; }
  .selcount { font-family:var(--ui-font); font-size:10px;
              letter-spacing:.16em; text-transform:uppercase; color:var(--mid);
              text-align:center; margin-bottom:10px; }
  .selactions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .selbtn.comb { border:1px solid var(--ink); color:var(--ink); background:transparent; }
  .selbtn.comb:disabled { opacity:.35; }
  /* the make-up is a statement, not a label: sentence case and normal spacing
     so a full house still fits one line at 390pt (see STYLEGUIDE type scale) */
  .tablesline { text-align:center; margin-top:8px; font-family:var(--ui-font);
                font-size:11.5px; letter-spacing:.02em; color:var(--ink);
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* The ring is drawn as an overlay, the same way the room-tile group does it,
     so grouping a booking no longer narrows its rows by 24px and compresses
     everything inside. Layout width is identical grouped or not.          */
  .grpbox { position:relative; border:0; padding:0; margin:14px 0; }
  .grpbox::after { content:''; position:absolute; inset:-6px -9px;
                   border:1.2px solid var(--ink); border-radius:10px; pointer-events:none; }
  .tilegrp { display:grid; gap:6px; position:relative; }
  .tilegrp::after { content:''; position:absolute; inset:-3.5px;
                    border:1.2px solid var(--ink); border-radius:9px; pointer-events:none; }
  .grpbox .row:last-child { border-bottom:none; }
  .row.stubrow .row-name, .row.stubrow .row-sub { color:var(--mid); }
  .row.stubrow .row-sub { font-style:italic; }
  .selbtn { padding:13px 6px; border:1px solid transparent; color:#fff;
            font-family:var(--ui-font); font-size:11px;
            letter-spacing:.1em; text-transform:uppercase; cursor:pointer; }
  .selbtn.vac  { background:var(--slate); }
  .selbtn.din  { background:var(--green); }
  .selbtn.out  { background:var(--terra); }
  .selbtn.quiet{ background:transparent; border-color:var(--rule); color:var(--mid); }

  .legend { display:flex; gap:14px; justify-content:center; margin-top:12px;
            font-family:var(--ui-font); font-size:8px;
            letter-spacing:.12em; text-transform:uppercase; color:var(--mid); }
  .legend span { display:flex; align-items:center; gap:5px; }
  .sw { width:9px; height:9px; border:1px solid var(--rule); display:inline-block; }
  .sw.in { background:var(--green-t); border-color:var(--green-b); }
  .sw.out { background:var(--terra-t); border-color:var(--terra-b); }
  .sw.await { border-style:dashed; border-color:var(--mid); }
  .sw.vacant { border-color:var(--slate-b); background:var(--slate-t); }
  .legend2 { margin-top:7px; }
  .ico { width:11px; height:11px; display:inline-block; }
  .ico svg { width:100%; height:100%; display:block; fill:var(--mid); stroke:var(--mid); }
  #legSeen svg { fill:none; stroke-width:2.4; }

  /* rows */
  /* One line per booking: room, name, then pax and its controls hard right.
     The phone is not here - it is on the edit sheet, where it is used - so
     nothing competes for the width and no row can wrap. Dietary pills wrap
     onto a second line of their own beneath.                              */
  .row { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center;
         column-gap:10px; row-gap:0; padding:9px 0; border-bottom:1px solid var(--rule); }
  .row-main { flex:1 1 auto; min-width:0; }
  .row-name { font-size:14px; }
  /* The villa number is the thing staff scan for, so it leads the line at a
     larger size in ink, then a dash, then the guest name. The word "villa"
     is dropped - every row is a villa, so repeating it says nothing.     */
  .row-name .rm { font-family:var(--ui-font); font-size:15px;
                  font-weight:bold; letter-spacing:0; color:var(--ink); }
  .row-name .rm::after { content:' - '; font-weight:normal; color:var(--mid); }
  .row-name .tag { font-family:var(--ui-font); font-size:8px;
                   letter-spacing:.18em; text-transform:uppercase; color:var(--mid);
                   border:1px solid var(--rule); padding:2px 6px; margin-left:8px;
                   border-radius:10px; vertical-align:middle; }
  .row-sub { font-style:italic; font-size:11px; color:var(--mid); margin-top:8px; }
  .row-pax { font-family:var(--ui-font); font-size:12px; white-space:nowrap; }
  /* The bubble sits BEFORE the pax count so the pax figures line up down the
     list whether or not a booking carries a note.                         */
  .row-right { display:flex; align-items:center; gap:6px; white-space:nowrap;
               margin-left:auto; justify-content:flex-end; }
  .bub-slot { width:20px; flex:0 0 20px; }
  .edit { display:flex; align-items:center; justify-content:center;
          width:40px; height:40px; margin:-10px -10px -10px 0;
          opacity:.45; cursor:pointer; }
  .edit svg { width:14px; height:14px; display:block; fill:var(--mid); }
  .edit:active { opacity:.9; }
  .alrg { color:var(--red); font-style:normal; }
  /* An allergy is a solid red pill with the word "allergy" dropped, since the
     fill already says it. A preference is a tinted pill at full label. The
     pills take the whole row width, not just the half beside the pax count. */
  .nm { white-space:nowrap; }
  .dietline { flex:0 0 100%; margin:8px 0 0; display:flex; flex-wrap:wrap; gap:5px; }
  .dpill { font-family:var(--ui-font); font-size:11px; font-weight:bold;
           letter-spacing:.06em; text-transform:uppercase; padding:3px 8px;
           border-radius:11px; background:rgba(168,50,30,.12); color:var(--red); }
  .dpill-al { background:var(--red); color:#fff; }
  .row.conflict { border-left:3px solid var(--red); padding-left:10px;
                  background:rgba(168,50,30,.05); }
  /* Icon only, no box, in a fixed 20px slot that exists whether or not this
     booking has a note - otherwise the bubble's width shifts the pax count
     and the line height of every row that happens to carry a comment.    */
  .bub { width:20px; height:20px; border:0; background:transparent; padding:0;
         cursor:pointer; display:flex; align-items:center; justify-content:center;
         position:relative; }
  .bub::after { content:''; position:absolute; inset:-11px; }  /* 42px tap target */
  .bub svg { width:15px; height:15px; display:block; fill:var(--mid); }
  .bub.flag svg { fill:var(--red); }
  .pop-who { font-size:15px; margin-bottom:14px; padding-bottom:12px;
             border-bottom:1px solid var(--rule); }
  .pop-h { font-family:var(--ui-font); font-size:10px; letter-spacing:.18em;
           text-transform:uppercase; color:var(--mid); margin-bottom:6px; }
  .pop-h.dh { color:var(--red); }
  .pop-t { font-size:14px; line-height:1.45; margin-bottom:16px; }
  .empty { font-style:italic; color:var(--mid); font-size:12px; padding:8px 0; }

  .actions.hidden { visibility:hidden; }
  .actions { margin-top:34px; gap:10px;
             padding:12px 0 calc(12px + env(safe-area-inset-bottom)); }
  .actions .btn { flex:1 1 40%; text-align:center; white-space:nowrap; }
  .btn { flex:1; text-align:center; padding:13px; border:1px solid var(--ink);
         font-family:var(--ui-font); font-size:10px; letter-spacing:.15em;
         text-transform:uppercase; color:var(--ink); text-decoration:none;
         background:transparent; cursor:pointer; }
  .btn.solid { background:var(--ink); color:var(--cream); }

  /* sheet */
  .backdrop { position:fixed; inset:0; background:rgba(28,28,26,.35);
              display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .backdrop.show { display:flex; }
  .sheet { width:100%; max-width:520px; background:var(--cream);
           padding:26px 24px 34px; border-top:1px solid var(--rule);
           max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sheet h3 { font-family:var(--ui-font); font-size:11px; letter-spacing:.2em;
              text-transform:uppercase; color:var(--mid); font-weight:normal;
              text-align:center; margin-bottom:18px; }
  .opt { width:100%; padding:15px; margin-bottom:8px; border:1px solid transparent;
         font-family:var(--ui-font); font-size:12px;
         letter-spacing:.12em; text-transform:uppercase; color:#fff; cursor:pointer; }
  /* matches the room tile palette */
  .opt.solid { background:var(--green); border-color:var(--green); }   /* dining  - green */
  .opt.out   { background:var(--terra); border-color:var(--terra); }   /* not dining - red */
  .opt.vac   { background:var(--slate); border-color:var(--slate); }   /* vacant - slate */
  .opt.quiet { background:transparent; border-color:var(--rule); color:var(--mid); }
  .pax-row { display:flex; gap:6px; justify-content:center; margin:4px 0 16px; }
  .pax-fact { font:600 20px/1 var(--ui-font); color:var(--ink); }
  .pax { width:42px; height:42px; border:1px solid var(--rule); background:transparent;
         border-radius:50%; font-family:var(--ui-font); font-size:13px;
         color:var(--ink); cursor:pointer; }
  .pax.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:4px; }
  .chip { padding:7px 12px; border:1px solid var(--rule); background:transparent;
          border-radius:20px; font-family:var(--ui-font); font-size:10px;
          color:var(--mid); cursor:pointer; }
  .chip.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }

  .seg { display:flex; gap:6px; margin:2px 0 12px; }
  .seg button { flex:1; padding:11px 0; border:1px solid var(--rule); background:transparent;
                font-family:var(--ui-font); font-size:10px; letter-spacing:.12em;
                text-transform:uppercase; color:var(--mid); cursor:pointer; border-radius:6px; }
  .seg button.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .rm-row { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:2px 0 14px; }
  .rmp { height:40px; border:1px solid var(--rule); background:transparent;
         font-family:var(--ui-font); font-size:12px; color:var(--ink);
         cursor:pointer; border-radius:6px; }
  .rmp.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .gd { text-align:center; margin:-4px 0 14px; font-size:13px; line-height:1.55; }
  .gd .gd-sub { display:block; font-family:var(--ui-font); font-size:10.5px;
                color:var(--mid); letter-spacing:.03em; }
  .gd .gd-note { display:block; font-style:italic; font-size:12px; color:var(--mid); }

  .note-box { font-style:italic; font-size:13px; color:var(--mid); text-align:center;
              line-height:1.6; padding:0 4px 16px; }
  .sheet-label { font-family:var(--ui-font); font-size:8px; letter-spacing:.25em;
                 text-transform:uppercase; color:var(--mid); text-align:center; margin-bottom:8px; }
  .txt { width:100%; padding:12px; margin-bottom:8px; border:1px solid var(--rule);

<script>
(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });

  if (so) so.onclick=function(e){ e.preventDefault();

  /* Role gate, per the matrix in ROLES.md. Two different things here: a role
     that may not see this board at all, and a role that may read it but not
     write to it. The chef is the second - they open the app to see who is
     eating and what they cannot have, and print the sheet.             */
  window.NALA_ROLE = null;
  window.CAN_EDIT  = false;
  (function gate(){
    /* Wait for the helper too, not just firebase: a stubbed SDK calls back
       synchronously, and nala-shared.js loads at the foot of the page.
       auth() itself throws when no app has been initialised, and a partial
       SDK can arrive without onAuthStateChanged, so both are guarded: a
       throw here would take the whole page down with it.               */
    if (!window.firebase || !firebase.auth ||
        typeof loadStaff !== 'function'){ setTimeout(gate,300); return; }
    var A;
    try { A = firebase.auth(); } catch (e){ setTimeout(gate,300); return; }
    if (!A || typeof A.onAuthStateChanged !== 'function'){ setTimeout(gate,300); return; }
    A.onAuthStateChanged(function(u){
      if (!u) return;                 /* auth.js owns the signed-out state */
      loadStaff(function(recs, err){
        var role = roleOf(u);
        window.NALA_ROLE = role;
        window.CAN_EDIT  = can(role,'editBookings');
        window.NALA_NAVFILTER(role);
        showAccess(can(role,'resBoard'), err);
      });
    });
  })();


  /* The menu lists only the boards this role may open: offering a link that
     lands on "no access" is a door to nowhere. Cleans needs cleansBoard,
     the sheets need their own permission.                              */
  window.NALA_NAVFILTER = function(role){
    var need = { 'tally.html':'resBoard', 'list.html':'resSheet',
                 'cleaners.html':'cleansBoard', 'housekeeping.html':'cleansBoard',
                 'staff.html':'manageStaff' };
    var links = document.querySelectorAll('#navDrop a');
    for (var i=0;i<links.length;i++){
      if (links[i].className.indexOf('signout')>-1) continue;   /* never filtered */
      var href = (links[i].getAttribute('href')||'').split('?')[0];
      links[i].style.display = can(role, need[href]) ? '' : 'none';
    }
  };

  function showAccess(allowed, err){
    var box = document.getElementById('noAccess');
    var on  = !allowed;
    box.innerHTML = !on ? '' :
      (err ? '<div>Could not check access. This is usually the connection, '
           + 'not your login.</div>'
           + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
           : 'This login has no access to Reservations. See the manager.');
    /* A role that cannot see this page but has a board of its own is sent
       there rather than shown a refusal. Only a login with no role at all
       gets the message, because it has nowhere to be sent.             */
    if (on && !err){
      var home = homeFor(window.NALA_ROLE);
      if (home && home !== location.pathname.split('/').pop()){
        location.replace(home); return;
      }
    }
    box.className = 'noaccess' + (on ? ' show' : '');
    ['menuState','statsRow','tablesLine','roomsSec','rooms','listSec',
     'listBookings','footActions'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.style.display = on ? 'none' : '';

    /* Read only: the board stays, every way of writing to it goes. The
       tile sheet is the edit surface, so it does not open at all - see
       the guard in openRoom.                                          */
    document.body.classList.toggle('readonly', !on && !window.CAN_EDIT);
    if (!on && !window.CAN_EDIT){
      ['selToggle','addExt'].forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
    }
  }
})();

<script>
/* NALA shared helpers - one copy of the logic every staff page repeats.
   Plain globals, same names the pages already use, so page code reads
   unchanged. See STYLEGUIDE.md and AUDIT.md.                      v2 */

var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
var ROOMS = 17;
var ALLERGENS = ['Nut allergy','Shellfish allergy','Egg allergy'];

/* ── dates ─────────────────────────────────────────────────── */
function dkey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// Safari only accepts 3 fractional digits in an ISO date; Python writes 6.
// Trim them so any timestamp parses on every browser.
function parseISO(s){
  if (!s) return null;
  var t = String(s).trim().replace(/(\.\d{3})\d+/, '$1');
  var d = new Date(t);
  if (!isNaN(d)) return d;
  d = new Date(t.replace(/\.\d+/, ''));      // drop fractions entirely
  return isNaN(d) ? null : d;
}

function parseDepDate(s){
  if(!s) return null;
  s = String(s).trim();
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  var i = s.match(/^(\d{4})-(\d{2})-(\d{2})/);       // ISO - build a LOCAL date,
  if (i) return new Date(+i[1], +i[2]-1, +i[3]);     // never via the UTC parser
  var d = new Date(s);
  return isNaN(d) ? null : d;
}

function ord(n){
  var s=['th','st','nd','rd'], v=n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

/* the one date format: Wd Dth Mon (see STYLEGUIDE.md) */
function dateLabel(d){
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()]+' '+ord(d.getDate())+' '+mo[d.getMonth()];
}

/* ── the standard header's date row ────────────────────────────
   Wires ‹ › Today and writes the one date format into #date/#title.
   Tolerates missing arrows (hc tally shows the date alone).
   Returns { VIEW, todayKey, isToday } for the page to use.        */
function initDateNav(){
  var VIEW = (function(){
    var q = new URLSearchParams(location.search).get('date');
    if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) {
      var p = q.split('-');
      return new Date(+p[0], +p[1]-1, +p[2]);
    }
    return new Date();
  })();
  function todayKey(){ return dkey(VIEW); }
  function isToday(){ return dkey(VIEW) === dkey(new Date()); }
  function shiftDate(n){
    var d = new Date(VIEW); d.setDate(d.getDate()+n);
    var q = new URLSearchParams(location.search);
    q.set('date', dkey(d));
    location.search = q.toString();
  }
  function goToday(){
    var q = new URLSearchParams(location.search);
    q.delete('date');
    location.search = q.toString();
  }
  var el = document.getElementById('date') || document.getElementById('title');
  if (el) el.textContent = dateLabel(VIEW);
  var pv = document.getElementById('dPrev'), nx = document.getElementById('dNext'),
      td = document.getElementById('dToday');
  if (pv) pv.onclick = function(){ shiftDate(-1); };
  if (nx) nx.onclick = function(){ shiftDate(1); };
  if (td){
    td.onclick = function(e){ if (e) e.preventDefault(); goToday(); };
    td.disabled = isToday();     // always visible; dimmed when already on today
  }
  return { VIEW:VIEW, todayKey:todayKey, isToday:isToday };
}

/* ── room-guest look-back ──────────────────────────────────────
   Most recent record for a room across the previous fortnight.
   A guest who opened the link days ago still appears, unless
   they have departed. Reads each date individually so no
   permission is needed on the parent node.                       */
/* A fortnight of roomguests is 14 of the 19 requests a board makes, and it is
   the part that does not move: a booking recorded last Tuesday is still what
   it was. Polling it every 20 seconds alongside the things that DO move costs
   about five times the bandwidth for no extra freshness, so it is held for a
   few minutes and refetched on a full load.
   Pass force = true to ignore the cache.                                  */
var RG_CACHE = null, RG_AT = 0, RG_KEY = '', RG_MAX_AGE = 5 * 60 * 1000;

function fetchRoomGuests(endKey, days, force){
  days = days || 14;
  if (!force && RG_CACHE && RG_KEY === endKey + ':' + days &&
      (Date.now() - RG_AT) < RG_MAX_AGE){
    return Promise.resolve(RG_CACHE);
  }
  var parts = endKey.split('-');
  var end = new Date(+parts[0], +parts[1]-1, +parts[2]);
  var jobs = [], keys = [];
  for (var i = days - 1; i >= 0; i--) {
    var d = new Date(end); d.setDate(d.getDate() - i);
    var k = dkey(d);
    keys.push(k);
    jobs.push(
      fetch(DB + '/roomguests/' + k + '.json?v=' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
    );
  }
  return Promise.all(jobs).then(function(res){
    var all = {};
    res.forEach(function(day, i){ if (day) all[keys[i]] = day; });
    /* Only cache a complete answer. A partial fetch cached for five minutes
       would show a villa as empty because one day failed to load.       */
    if (res.every(function(day, i){ return day !== null || true; })){
      RG_CACHE = all; RG_AT = Date.now(); RG_KEY = endKey + ':' + days;
    }
    return all;
  });
}

function clearRoomGuestCache(){ RG_CACHE = null; RG_AT = 0; }

function resolveRoomGuests(all, todayK){
  var out = {};
  var dates = Object.keys(all || {}).filter(function(d){ return d <= todayK; }).sort();
  dates.forEach(function(d){
    var day = all[d] || {};
    for (var room in day){ out[room] = day[room]; }   // later dates overwrite earlier
  });
  // drop anyone checked out by this sheet's dinner: a guest departing on
  // the sheet date leaves that morning, so their last sheet is the night before
  for (var room in out){
    var dep = out[room] && out[room].departs;
    if (!dep) continue;
    var p = parseDepDate(dep);
    if (p && dkey(p) <= todayK) delete out[room];
  }
  return out;
}

/* ── guest misc ────────────────────────────────────────────── */
function tidyPhone(p){
  if (!p) return '';
  p = String(p).replace(/[^\d]/g,'');
  if (p.length === 9 && p[0] === '4') p = '0' + p;   // restore a lost leading zero
  return p;
}

/* ── dietary conflicts against the tagged menu ─────────────── */
function menuConflicts(menu, diets){
  if (!diets || !diets.length || !menu) return [];
  var hits = [];
  ['bread','entree','main','dessert'].forEach(function(k){
    var dish = menu[k];
    if (!dish || !dish.conflicts) return;
    dish.conflicts.forEach(function(tag){
      diets.forEach(function(d){
        if (String(d).toLowerCase() === String(tag).toLowerCase())
          hits.push({ dish: dish.name || k, diet: d });
      });
    });
  });
  return hits;
}

function dietHTML(diets, sep, cls){
  if(!diets||!diets.length) return '';
  cls = cls || 'allergen';
  return diets.map(function(d){
    return (ALLERGENS.indexOf(d)>-1 || /allerg/i.test(d)) ? '<span class="'+cls+'">'+d+'</span>' : d;
  }).join(sep || ' \u00b7 ');
}

/* ── housekeeping variants - deliberately different from above ──
   resolveRoomGuestsHK KEEPS guests departing today: they are the
   cleans. The dinner resolver drops them. Do not merge the two.   */
function resolveRoomGuestsHK(all, todayK){
  var out = {};
  var dates = Object.keys(all || {}).filter(function(d){ return d <= todayK; }).sort();
  dates.forEach(function(d){
    var day = all[d] || {};
    for (var room in day){ out[room] = day[room]; }
  });
  for (var room in out){
    var dep = out[room] && out[room].departs;
    if (!dep) continue;
    var p = parseDepDate(dep);
    if (p && dkey(p) < todayK) delete out[room];   // gone before today
  }
  return out;
}

/* One request, one date. Unlike roomguests, which needs a fortnight of history
   because a guest may have opened their link days ago, /stays is written by the
   PMS sync for every night of a stay, so the date being shown is the only date
   worth asking for. That is why each night carries the guest rather than a
   pointer: a pointer would cost a request per villa and undo the work that took
   a poll from nineteen requests to four.                                    */
function fetchStays(dateKey){
  return fetch(DB + '/stays/' + dateKey + '.json?v=' + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    /* A failure here must not empty the boards. Returning null means the merge
       simply falls back to roomguests, which is what it did before any of this
       existed.                                                             */
    .catch(function(){ return null; });
}

/* Turns one /stays/<date>/<villa> entry into the shape roomguests uses, so it
   can sit in the same merge instead of needing its own handling everywhere.
   Tolerates the older shape, where the value was the booking id as a bare
   string: those entries carry no guest and are ignored rather than crashing.  */
/* True when a record came from the PMS and the guest has not opened their link.
   The two are different facts and must not be conflated: "we know who is in
   villa 4" is not "villa 4 has replied to us". Conflating them puts the link
   opened mark on every synced booking, which is the exact signal the sync
   exists to stop staff relying on.                                         */
function isMewsOnly(rec){
  return !!(rec && rec.source === 'mews');
}

function mewsRecord(stay){
  if (!stay || typeof stay !== 'object') return null;
  var name = [stay.first, stay.last].filter(Boolean).join(' ').trim();
  if (!name && !stay.depart) return null;
  var out = { source:'mews', bookingId: stay.id };
  if (name)          out.name    = name;
  if (stay.phone)    out.phone   = stay.phone;
  if (stay.depart)   out.departs = stay.depart;
  if (stay.arrive)   out.arrives = stay.arrive;
  if (stay.adults)   out.adults  = stay.adults;
  return out;
}

/* Lays the PMS over the guest written records. Mews wins on identity and
   dates, because it is the authority on who is in a villa and when they leave;
   roomguests only knows what a guest happened to type after opening a link.

   Done here, at the roomguests layer, rather than inside roomRecord, because
   tally.html reads roomguests directly in eight places and does not call
   roomRecord at all. Two mechanisms would let the board and the sheet disagree
   about the same villa, which is the failure that looks plausible.

   It sits BELOW responses, which is correct rather than accidental: a response
   carries a name and a dinner answer but never a departure date, so Mews keeps
   the dates while a guest keeps the name they gave.                        */
function overlayStays(roomguests, stays){
  var out = Object.assign({}, roomguests || {});
  for (var villa in (stays || {})){
    var rec = mewsRecord(stays[villa]);
    if (!rec) continue;
    var had = out[String(villa)];
    var merged = Object.assign({}, had || {}, rec);
    /* source stays 'mews' ONLY when there was no guest written record to begin
       with. A guest who did open their link keeps that fact, so the link opened
       mark still means what it always meant. */
    if (had) delete merged.source;
    out[String(villa)] = merged;
  }
  return out;
}

/* one room, one record: staff override beats the guest's own answer,
   whoever opened the link fills the gaps.

   The PMS is already folded into roomguests by overlayStays before this runs,
   so this function is unchanged by the Mews work and stays the one place that
   knows the order of precedence.                                           */
function roomRecord(n, responses, manual, roomguests){
  var mk = 'room-'+n, m = manual[mk];
  var best = null;
  for (var k in responses){
    var g = responses[k];
    if (String(g.room) !== String(n)) continue;
    if (!best || (g.at||'') > (best.at||'')) best = g;
  }
  var known = roomguests[String(n)] || {};
  if (m && m.override) return Object.assign({}, known, best || {}, m, { room:String(n) });
  if (best) return Object.assign({}, known, best);
  if (m)    return Object.assign({}, known, m, { room:String(n) });
  if (known.name) return Object.assign({}, known, { room:String(n), status:null });
  return null;
}

/* clean = departing on the sheet date; service = staying on;
   verify = no usable data. The housekeeping rule, in one place.  */
function hkClassify(rec, todayK, hk){
  /* A manager can set the job for the day by hand - most often on a villa the
     booking data cannot confirm - and that choice beats what the dates imply.
     Stored at /hk/<date>/<villa>/kind so it expires with the day.          */
  if (hk && (hk.kind === 'clean' || hk.kind === 'svc' ||
             hk.kind === 'pre'   || hk.kind === 'vac')) return hk.kind;
  if (rec && rec.status === 'vacant') return 'vac';
  if (rec){
    var d = parseDepDate(rec.departs);
    var dk = d ? dkey(d) : null;
    if (dk === todayK) return 'clean';
    if (dk && dk > todayK) return 'svc';
    return 'ver';       // stale or missing departure
  }
  return 'ver';         // no data at all
}

/* ── roles and access ──────────────────────────────────────────
   Who may do what. The role comes from the record at /staff/<emailkey>,
   never from the address - the email only finds the record. Pages ask
   can(), never the email, so a permission changes in one place.
   Matrix and rationale in ROLES.md.                                   */

var STAFF_RECORDS = null;    /* the /staff map once loaded, null until then */

/* Firebase keys cannot hold a dot, so the key is the lowercased email with
   EVERY dot turned into a comma. Note the global regex: a plain
   replace('.', ',') changes only the first, which would key
   staff@nalaresort.com.au as staff@nalaresort,com.au and match nothing. */
function emailKey(email){
  return String(email || '').trim().toLowerCase().replace(/\./g, ',');
}

var ROLE_GRANTS = {
  admin:        ['cleansBoard','cleansMarks','setJob','resBoard','editBookings','resSheet','publishMenu','manageStaff'],
  chef:         ['resBoard','resSheet','publishMenu'],
  waiter:       ['cleansBoard','resBoard','editBookings','resSheet'],
  housekeeping: ['cleansBoard','cleansMarks'],
  /* A machine account, held by the Mews sync Worker. Deliberately empty: it
     grants nothing in the UI and lands on no page, so a human signing in as
     it gets the "see the manager" message rather than a half working board.
     Its actual permission lives in the rules, which name the role directly
     and let it write only bookings/<id>/pms and stays. Listed here because a
     role that exists in the database and not in the code is what the next
     session trips over.                                                  */
  sync:         []
};

function isRole(r){ return Object.prototype.hasOwnProperty.call(ROLE_GRANTS, r); }

/* The full access role was called "staff" until the word collided with the
   /staff node, the staff@ login and the "staff" tier of user generally. It is
   "admin" now. Records written before the rename still say staff, so they are
   read as admin rather than as nothing: renaming a role must never be the
   thing that locks the owner out. Drop this once no record says staff.   */
function normaliseRole(r){ return r === 'staff' ? 'admin' : r; }

/* null means no usable record, and no record is no access. Deliberately not
   the lowest role: a typo in an address would otherwise grant something. */
function roleOf(user){
  var e = user && (typeof user === 'string' ? user : user.email);
  if (!e || !STAFF_RECORDS) return null;
  var rec = STAFF_RECORDS[emailKey(e)];
  var r = normaliseRole(rec && rec.role);
  return isRole(r) ? r : null;
}

function can(role, what){
  var g = ROLE_GRANTS[normaliseRole(role)];
  return !!(g && g.indexOf(what) > -1);
}

/* Where a role should land. Housekeeping opening the app got the Reservations
   board, which they may not see, so their first screen was a refusal. A role
   that cannot see the page it arrived on is a routing problem, not an access
   one: send them to their own board instead of telling them off.        */
var ROLE_HOME = { admin:'tally.html', chef:'tally.html', waiter:'tally.html',
                  housekeeping:'cleaners.html' };
function homeFor(role){ return ROLE_HOME[normaliseRole(role)] || null; }

function setStaffRecords(map){
  STAFF_RECORDS = (map && typeof map === 'object') ? map : {};
  return STAFF_RECORDS;
}

/* Loads /staff once. On a network or permission failure the records stay
   null, which still grants nothing, but it is a DIFFERENT state from
   "signed in and not on the list" and the pages word it differently:
   telling someone to see the manager when the database simply did not
   answer sends them down the hall for nothing.                        */
function loadStaff(cb){
  fetch(DB + '/staff.json')
    .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
    .then(function(j){ cb(setStaffRecords(j), null); })
    .catch(function(err){ STAFF_RECORDS = null; cb(null, err); });
}

/* ── staying inside the home screen app ────────────────────────
   A page saved to the home screen opens without Safari's bars, which is the
   whole point of saving it. Tapping an ordinary link from there hands the
   next page back to Safari, bars and all, so the app view lasts exactly one
   screen. Navigating by script instead keeps it inside.

   Only runs in standalone mode, so nothing changes in an ordinary tab. Links
   that leave the site, open a new tab, or do something on the page rather
   than go somewhere are left alone.                                     */
(function(){
  /* navigator.standalone is a Safari property and is undefined in Chrome,
     where a saved page still opens without the bars. Asking only Safari
     meant this did nothing at all on half the phones, which is why the app
     view kept being handed back to the browser.                        */
  function inApp(){
    if (window.navigator && window.navigator.standalone) return true;
    try {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.matchMedia('(display-mode: fullscreen)').matches ||
             window.matchMedia('(display-mode: minimal-ui)').matches;
    } catch (e){ return false; }
  }
  if (!inApp()) return;
  document.addEventListener('click', function(e){
    var a = e.target;
    while (a && a.nodeName !== 'A') a = a.parentNode;
    if (!a || !a.getAttribute) return;
    var href = a.getAttribute('href');
    if (!href || href.charAt(0) === '#') return;        /* in-page, or an action */
    if (a.target && a.target !== '_self') return;       /* meant for a new tab */
    if (/^(mailto|tel|sms):/i.test(href)) return;
    if (a.host && a.host !== location.host) return;     /* off site, let it go */
    e.preventDefault();
    /* Routed through a replaceable function purely so this can be tested:
       no browser but Safari does the breakout being worked around here, so
       the only checkable part is that the link is taken over at all.   */
    (window.NALA_GO || function(u){ location.href = u; })(a.href);
  });
})();

/* ── notifications ─────────────────────────────────────────────
   A phone subscribes once, from a tap, and the subscription is stored under
   its own login. The sending is done by a worker that holds the signing key:
   nothing secret lives here. The public key below is meant to be public.

   iOS only allows this for a site added to the Home Screen. In an ordinary
   tab the browser reports no support at all, so the toggle says why rather
   than failing silently.                                                 */
var VAPID_PUBLIC = 'BEP_gBL_c7YGzV9EoU8Bv5DeA79I32NUxjGA2atk1239hSBZXEatGYrIfI7nofzLwdVZ1fWw1ycBZ1lWrKlOZGs';
var PUSH_URL = 'https://nala-push.ben-681.workers.dev';

function pushSupported(){
  return !!(window.navigator && 'serviceWorker' in navigator &&
            'PushManager' in window && 'Notification' in window);
}

/* A stable id per phone, so re-subscribing replaces that phone's record
   instead of leaving a dead one behind every time.                      */
function deviceId(){
  var k = 'nala-device';
  try {
    var v = localStorage.getItem(k);
    if (!v){ v = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
             localStorage.setItem(k, v); }
    return v;
  } catch (e){ return 'd-nostore'; }
}

function b64ToU8(base64){
  var pad = '='.repeat((4 - base64.length % 4) % 4);
  var s = (base64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  var raw = atob(s);
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

function subPath(user){
  return '/pushsubs/' + emailKey(user && user.email) + '/' + deviceId() + '.json';
}

/* Whether this phone is currently subscribed. Asked of the browser rather
   than of a saved flag, because the browser is the thing that decides: a
   subscription can be dropped by iOS without telling anyone.            */
function pushState(cb){
  if (!pushSupported()) return cb('unsupported');
  if (Notification.permission === 'denied') return cb('blocked');
  navigator.serviceWorker.getRegistration().then(function(reg){
    if (!reg) return cb('off');
    reg.pushManager.getSubscription().then(function(sub){ cb(sub ? 'on' : 'off'); },
                                          function(){ cb('off'); });
  }, function(){ cb('off'); });
}

function pushOn(user, role, cb){
  if (!pushSupported()) return cb('unsupported');
  navigator.serviceWorker.register('/sw.js').then(function(reg){
    return Notification.requestPermission().then(function(perm){
      if (perm !== 'granted') throw new Error('denied');
      return reg.pushManager.subscribe({
        userVisibleOnly: true,                 /* iOS requires this */
        applicationServerKey: b64ToU8(VAPID_PUBLIC)
      });
    });
  }).then(function(sub){
    var j = sub.toJSON();
    return fetch(DB + subPath(user), {
      method: 'PUT',
      body: JSON.stringify({ endpoint: j.endpoint, keys: j.keys,
                             role: role, at: new Date().toISOString() })
    });
  }).then(function(){ cb('on'); })
    .catch(function(e){ cb((e && e.message === 'denied') ? 'blocked' : 'failed'); });
}

/* Off means gone from the database as well: a record left behind would keep
   the phone on the list and the notification would arrive anyway.        */
function pushOff(user, cb){
  var done = function(){ cb('off'); };
  fetch(DB + subPath(user), { method: 'DELETE' }).catch(function(){}).then(function(){
    if (!pushSupported()) return done();
    navigator.serviceWorker.getRegistration().then(function(reg){
      if (!reg) return done();
      reg.pushManager.getSubscription().then(function(sub){
        if (!sub) return done();
        sub.unsubscribe().then(done, done);
      }, done);
    }, done);
  });
}

/* Tell the worker something happened. Deliberately not awaited by whatever
   called it: a notification that fails must never cost someone their mark,
   which is already saved by the time this runs.                          */
function notifyPush(event, villa, user){
  if (!PUSH_URL || !window.__idToken) return;
  try {
    fetch(PUSH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken: window.__idToken, event: event,
                             villa: villa, actor: emailKey(user && user.email) })
    }).catch(function(){});
  } catch (e){}
}

/* The notification settings, written by the app the first time an admin opens
   a board and finds none. Typing this into the console by hand was slow and
   easy to get wrong, and every new event type would mean doing it again.
   Only an admin may write /notify, which the rules enforce, so this quietly
   does nothing for everyone else.                                        */
var NOTIFY_DEFAULTS = {
  on: true,
  hours: { from: '07:30', to: '18:00' },
  events: {
    departed:  { housekeeping:true, admin:true, waiter:false, chef:false },
    available: { housekeeping:true, admin:true, waiter:false, chef:false },
    cleaned:   { housekeeping:true, admin:true, waiter:true,  chef:false },
    serviced:  { housekeeping:true, admin:true, waiter:true,  chef:false }
  }
};

function ensureNotifySettings(role){
  if (normaliseRole(role) !== 'admin') return;
  fetch(DB + '/notify.json')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(cfg){
      /* Only fill in what is missing. Overwriting would undo the manager's
         own choices every time a board loaded.                          */
      if (cfg && cfg.events && cfg.hours) return;
      var merged = {
        on:     (cfg && typeof cfg.on === 'boolean') ? cfg.on : NOTIFY_DEFAULTS.on,
        hours:  (cfg && cfg.hours) ? cfg.hours : NOTIFY_DEFAULTS.hours,
        events: (cfg && cfg.events) ? cfg.events : NOTIFY_DEFAULTS.events
      };
      return fetch(DB + '/notify.json', { method:'PUT', body: JSON.stringify(merged) });
    })
    .catch(function(){});
}

var MENU = null;      // tonight's tagged menu, for dietary conflict flags
var responses = {};   // keyed by phone (digital) or manual key
var cancelledExt = {};
var roomguests = {};
var manual = {};      // keyed by 'room-N' or 'ext-<id>'

function api(path, method, body){
  var o = { method: method||'GET' };
  if (body !== undefined) { o.headers={'Content-Type':'application/json'}; o.body=JSON.stringify(body); }
  return fetch(DB+path+'.json'+(method?'':'?v='+Date.now()), o)
    .then(function(r){
      if (!r.ok && method) {
        return r.text().then(function(t){
          showError('Not saved - the database rejected the change. ' +
                    'Check the Realtime Database rules allow writes.');
          var err = new Error(t); err.shown = true; throw err;
        });
      }
      return r.json();
    })
    .catch(function(e){
      if (method && !e.shown) showError('Not saved - no connection to the database.');
      throw e;
    });
}

var errTimer;
function showError(msg){
  var el = document.getElementById('errBar');
  el.textContent = msg;
  el.className = 'errbar show';
  clearTimeout(errTimer);
  errTimer = setTimeout(function(){ el.className='errbar'; }, 6000);
}

// a room's reservation details survive any status write, in any order
function withExtras(key, rec){
  var prev = manual[key];
  if (prev){
    ['name','phone','diets','note','dnote'].forEach(function(k){
      if (rec[k] === undefined && prev[k] !== undefined) rec[k] = prev[k];
    });
  }
  return rec;
}

// ── every /manual write goes through here: optimistic update,
//    rolled back if the database rejects it (same pattern as saveCombined)
function saveManual(key, rec){
  var had  = Object.prototype.hasOwnProperty.call(manual, key);
  var prev = manual[key];
  if (rec === undefined) delete manual[key]; else manual[key] = rec;
  var req = (rec === undefined)
    ? api('/manual/'+todayKey()+'/'+key, 'DELETE')
    : api('/manual/'+todayKey()+'/'+key, 'PUT', rec);
  req.catch(function(){
    if (had) manual[key] = prev; else delete manual[key];
    render();
  });
  return req;
}

// ── build a unified view keyed by room ─────────────────────
function roomState(n){
  var mk = 'room-'+n;
  var m  = manual[mk];

  // latest digital response for this room
  var best = null;
  for (var k in responses){
    var g = responses[k];
    if (String(g.room) !== String(n)) continue;
    if (!best || (g.at || '') > (best.g.at || '')) best = { src:'digital', key:k, g:g };
  }

  // A staff override wins on the fields it sets, but the guest's own answer is
  // merged underneath so nothing they told us is lost - their pre-menu
  // acknowledgement and their "no dietaries" confirmation both live there and
  // are never re-entered by staff. Same merge rule as roomRecord().
  if (m && m.override) {
    var g = best ? Object.assign({}, best.g, m) : m;
    return { src:'manual', key:mk, g:g, override:true, guest: best ? best.g : null };
  }
  if (best) return best;
  if (m) return { src:'manual', key:mk, g:m };
  return null;
}
