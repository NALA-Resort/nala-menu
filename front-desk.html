<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Nala &middot; Front Desk Arrival</title>
<link rel="stylesheet" href="nala-ui.css?v=12">
<style>
  :root { --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA; --red:#A8321E;
          --green:#E4EDE2; --greenb:#7E937A; --amber:#F6EAD5; --amberb:#C29A55;
          /* The same two the boards already use to mean dining and not. */
          --dine:#5E7D67; --nodine:#9E6455; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--ink); font-family:var(--ui-font);
         padding:calc(24px + env(safe-area-inset-top)) 18px 0;
         -webkit-tap-highlight-color:transparent; }

  .seclabel { font-size:11px; letter-spacing:.14em; text-transform:uppercase;
              color:var(--mid); margin:22px 0 8px; }

  /* One arrival. The whole row is the control surface, the same idea as the
     villa tile grid, which is the documented exception to "a bordered
     rectangle is a button". */
  .arr { display:flex; align-items:center; gap:12px; width:100%;
         background:none; border:1px solid var(--rule); border-radius:8px;
         padding:11px 13px; margin-bottom:7px; text-align:left;
         font-family:inherit; color:inherit; cursor:pointer; }

  /* The villa number is how reception finds the guest standing in front of
     them, so it carries tile weight. 20 on the type scale. */
  .arr-v { font-size:20px; min-width:30px; text-align:center; }
  .arr-mid { flex:1; min-width:0; }
  .arr-n { font-size:15px; white-space:nowrap; overflow:hidden;
           text-overflow:ellipsis; }
  /* Stay dates as the styleguide sets them: Tue 11-Fri 14. No ordinal, month
     omitted, one line, because a wrapped range doubles the row height. */
  .arr-s { font-size:11px; color:var(--mid); margin-top:2px; white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis; }

  /* Status is a tinted pill, never tappable; the row around it is the button.
     The pill carries the ANSWER rather than the word "confirmed", because
     confirmed means a dining status exists and it includes not dining. */
  .pill { font-size:11px; letter-spacing:.06em; text-transform:uppercase;
          padding:4px 9px; border-radius:11px; white-space:nowrap;
          border:1px solid transparent; }
  .pill.din  { background:var(--green); border-color:var(--greenb); }
  .pill.out  { background:none; border-color:var(--mid); color:var(--mid); }
  .pill.part { background:var(--amber); border-color:var(--amberb); }
  .pill.none { background:none; border-color:var(--rule); color:var(--mid);
               border-style:dashed; }

  /* Confirmed rows recede but stay legible: reception still has to find a
     guest who checked in an hour ago. */
  .arr.is-done { opacity:.68; }

  /* Attention turns the number red, never the frame. */
  #tileLeft.due .stat-n { color:var(--red); }

  /* The summary drops out of the row it belongs to, so it is inset and shares
     the row's left edge rather than floating as its own card. */
  .sum { border:1px solid var(--rule); border-top:none; border-radius:0 0 8px 8px;
         margin:-8px 0 7px; padding:12px 13px 13px; }
  .sum-r { display:flex; gap:10px; font-size:13px; line-height:1.5;
           padding:3px 0; align-items:baseline; }
  .sum-l { flex:0 0 88px; font-size:8px; letter-spacing:.2em; text-transform:uppercase;
           color:var(--mid); padding-top:3px; }
  .sum-v { flex:1; min-width:0; }
  .sum-v.none { color:var(--mid); font-style:italic; }
  .sum-btns { display:flex; gap:7px; margin-top:12px; }
  .sum-btns button { flex:1; padding:12px 0; border:1px solid var(--rule);
                     border-radius:6px; font-family:var(--ui-font); font-size:11px;
                     letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
                     background:transparent; color:var(--mid); }
  .sum-btns button.go { background:var(--green); border-color:var(--greenb);
                        color:var(--ink); }
  /* The row a summary is hanging from keeps its top corners only. */
  .arr.open { border-radius:8px 8px 0 0; margin-bottom:8px; }

  /* Whether they are eating, readable without opening anything. Only on rows
     that have a form: there is nothing to report about a guest who has not
     answered, and an icon there would be an answer we do not have. */
  .fork { width:15px; height:15px; flex:0 0 15px; opacity:.9; }
  .fork svg { width:100%; height:100%; display:block; }
  .fork.in  svg { fill:var(--dine); }
  .fork.out svg { fill:var(--nodine); }
  .fork.un  svg { fill:var(--mid); opacity:.6; }

  .empty { font-size:15px; color:var(--mid); font-style:italic; padding:4px 0 2px; }
  .spacer { height:40px; }
  #errBar { display:none; background:var(--red); color:#fff; font-size:13px;
            padding:9px 12px; border-radius:6px; margin-top:12px; }
  #errBar.show { display:block; }

  /* Sheet chrome and controls, matching tally.html exactly. Copied rather
     than reinvented: two screens with their own idea of a chip is how the
     app starts looking like two apps. */
  .backdrop { position:fixed; inset:0; background:rgba(28,28,26,.35);
              display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .backdrop.show { display:flex; }
  .sheet { width:100%; max-width:520px; background:var(--cream);
           padding:26px 24px 34px; border-top:1px solid var(--rule);
           max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sheet h3 { font-family:var(--ui-font); font-size:11px; letter-spacing:.2em;
              text-transform:uppercase; color:var(--mid); font-weight:normal;
              text-align:center; margin-bottom:18px; }
  .sheet-label { font-family:var(--ui-font); font-size:8px; letter-spacing:.25em;
                 text-transform:uppercase; color:var(--mid); text-align:center;
                 margin:16px 0 8px; }
  .opt { width:100%; padding:15px; margin-bottom:8px; border:1px solid transparent;
         border-radius:6px; font-family:var(--ui-font); font-size:11px;
         letter-spacing:.14em; text-transform:uppercase; color:var(--ink);
         cursor:pointer; }
  .opt.solid { background:var(--green); border-color:var(--greenb); }
  .opt.quiet { background:transparent; border-color:var(--rule); color:var(--mid); }
  .seg { display:flex; gap:6px; margin:2px 0 4px; }
  .seg button { flex:1; padding:11px 0; border:1px solid var(--rule); background:transparent;
                font-family:var(--ui-font); font-size:10px; letter-spacing:.12em;
                text-transform:uppercase; color:var(--mid); cursor:pointer; border-radius:6px; }
  .seg button.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .pax-row { display:flex; gap:6px; justify-content:center; margin:4px 0 4px; }
  .pax { width:42px; height:42px; border:1px solid var(--rule); background:transparent;
         font-family:var(--ui-font); font-size:14px; color:var(--ink);
         cursor:pointer; border-radius:6px; }
  .pax.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:4px; }
  .chip { padding:7px 12px; border:1px solid var(--rule); background:transparent;
          border-radius:20px; font-family:var(--ui-font); font-size:10px;
          color:var(--mid); cursor:pointer; }
  .chip.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .txt { width:100%; padding:12px; margin-bottom:8px; border:1px solid var(--rule);
         background:transparent; font-family:var(--ui-font); font-size:16px; color:var(--ink); }
  .txt::placeholder { color:var(--mid); font-style:italic; }
  .txt:focus { outline:none; border-color:var(--ink); }
  .gd { text-align:center; margin:-4px 0 6px; font-size:13px; line-height:1.55; }
  .gd .gd-sub { display:block; font-family:var(--ui-font); font-size:10.5px;
                color:var(--mid); letter-spacing:.03em; }
  .note-box { font-style:italic; font-size:13px; color:var(--mid); text-align:center;
              line-height:1.6; padding:0 4px 14px; }
</style>
</head>
<body class="tier-app">

<div class="daterow">
  <button class="dnav today" id="dToday">Today</button>
  <button class="dnav" id="dPrev">&#8249;</button>
  <div class="date" id="title"></div>
  <button class="dnav" id="dNext">&#8250;</button>
  <div class="navwrap" id="navWrap">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"><a href="tally.html">Reservations</a><a href="list.html">Reservations Sheet</a><a href="cleaners.html">Cleans</a><a href="housekeeping.html">Clean sheet</a><a href="staff.html">Settings</a><a href="#" class="signout" id="navSignout">Sign out</a></div>
  </div>
</div>

<div class="noaccess" id="noAccess"></div>

<div class="stats" id="statsRow">
  <div class="stat" id="tileLeft"><div class="stat-n" id="nLeft">&ndash;</div><div class="stat-l">To confirm</div></div>
  <div class="stat"><div class="stat-n" id="nArr">&ndash;</div><div class="stat-l">Arrivals today</div></div>
</div>

<div id="board"></div>
<div id="errBar"></div>
<div class="spacer"></div>

<div class="backdrop" id="backdrop">
  <div class="sheet" id="sheet"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=11"></script>
<script src="nala-shared.js?v=19"></script>
<script>
var DB  = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
var nav = initDateNav();     /* wires Today, the arrows and the title itself */
var ROWS = [];               /* [{ villa, stay, pre }] for the viewed date */

(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
  var so=document.getElementById('navSignout');
  if (so) so.onclick=function(e){ e.preventDefault();
    if (window.NALA_SIGNOUT) NALA_SIGNOUT(); else location.reload(); };
})();

function api(path){
  return fetch(DB + path + '.json?v=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); });
}

function err(msg){
  var e = document.getElementById('errBar');
  e.textContent = msg || '';
  e.className = msg ? 'show' : '';
}

/* Mews sends a full timestamp on some mappings and a bare date on others. */
function dkeyOf(v){
  var m = String(v || '').match(/^(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : null;
}

/* An arrival is a stay whose FIRST night is the date being viewed. /stays
   holds one row per night, so without this every in-house guest would sit on
   the arrivals list for the whole of their stay. */
function arrivingOn(dayStays, key){
  var out = [];
  for (var villa in (dayStays || {})){
    var s = dayStays[villa];
    /* Tolerates the older shape, where the value was a bare booking id. */
    if (!s || typeof s !== 'object' || !s.id) continue;
    if (dkeyOf(s.arrive) !== key) continue;
    out.push({ villa: String(villa), stay: s, pre: null });
  }
  return out.sort(function(a,b){ return (+a.villa) - (+b.villa); });
}

function nameOf(s){
  return (((s.first||'') + ' ' + (s.last||'')).trim()) || 'Guest';
}

function stayLabel(s){
  var a = parseDepDate(dkeyOf(s.arrive)), b = parseDepDate(dkeyOf(s.depart));
  if (!a || !b) return '';
  var D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return D[a.getDay()]+' '+a.getDate()+'-'+D[b.getDay()]+' '+b.getDate();
}

/* Confirmed means reception has been through it with the guest at the desk.
   That is NOT the same as the form being complete: a guest can fill in
   everything from their phone days earlier and still need confirming. */
function isConfirmed(p){ return !!(p && p.confirmedAt); }
function hasForm(p){ return !!(p && p.at); }

function pillFor(p){
  if (isConfirmed(p))
    return p.dining === false ? '<div class="pill out">Not dining</div>'
                              : '<div class="pill din">Dining</div>';
  return hasForm(p) ? '<div class="pill part">Form done</div>'
                    : '<div class="pill none">No form</div>';
}

function esc(t){
  return String(t).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
  });
}

function rowHTML(r){
  /* Before a guest arrives, when they are coming is the fact reception plans
     around, so it takes the second slot. Party size gives way to it rather
     than both fighting for the width and the ETA losing: it is one tap away in
     the summary, and an ETA truncated to "after..." helps nobody. */
  var bits = [stayLabel(r.stay)];
  var eta = r.pre && r.pre.arriveBy;
  if (eta) bits.push(esc(eta));
  else if (r.stay.adults)
    bits.push(r.stay.adults + (Number(r.stay.adults)===1 ? ' adult' : ' adults'));
  var open = OPEN === r.villa;
  return '<button class="arr'+(isConfirmed(r.pre)?' is-done':'')+(open?' open':'')+
         '" data-villa="'+r.villa+'">'+
         '<div class="arr-v">'+r.villa+'</div>'+
         '<div class="arr-mid">'+
           '<div class="arr-n">'+esc(nameOf(r.stay))+'</div>'+
           '<div class="arr-s">'+bits.join(' \u00b7 ')+'</div>'+
         '</div>'+forkFor(r.pre)+pillFor(r.pre)+'</button>'+
         (open ? summaryHTML(r) : '');
}

/* Which row is showing its summary. One at a time: two open summaries and the
   list stops being a list. */
var OPEN = null;

var APPROACH_LABEL = { most:'Dining in most nights', mix:'A mix of in and out',
                       out:'Mostly eating out' };

var ICON_FORK = '<svg viewBox="0 0 24 24" stroke-width="0">' +
  '<path d="M6.2 2.5v6a2.4 2.4 0 001.6 2.3V21h1.6v-10.2A2.4 2.4 0 0011 8.5v-6H9.6v5.2H8.7V2.5H7.3v5.2h-.9V2.5H6.2z"/>' +
  '<path d="M15.6 2.5c-1.5 0-2.5 1.9-2.5 5.1 0 2.4.7 3.9 1.8 4.3V21h1.6V2.5h-.9z"/></svg>';

/* Grey is a real answer here, not a missing one: a guest can open the form,
   fill in their allergies and leave the dinner question alone. Reception needs
   to see that it is still open rather than assume either way. */
function forkFor(p){
  if (!hasForm(p)) return '';
  var cls = p.dining === true ? 'in' : (p.dining === false ? 'out' : 'un');
  return '<span class="fork ' + cls + '">' + ICON_FORK + '</span>';
}

function dayLabel(key){
  var d = parseDepDate(key); if (!d) return key;
  var D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return D[d.getDay()] + ' ' + d.getDate();
}

/* The guest's answers, read back as sentences so reception can say them out
   loud and the guest can agree or not. Empty answers are shown as unanswered
   rather than hidden: a blank line is the thing reception needs to fill. */
function sumRow(label, value, empty){
  return '<div class="sum-r"><div class="sum-l">' + label + '</div>' +
         '<div class="sum-v' + (value ? '' : ' none') + '">' +
         (value || empty || 'Not answered') + '</div></div>';
}

function summaryHTML(r){
  var a = answersOf(r), h = '';

  h += sumRow('Dinner', a.dining === null ? '' :
        (a.dining ? 'Dining \u00b7 ' + a.pax +
          (a.pax === 1 ? ' guest' : ' guests') : 'Not dining'));

  var diet = a.noDiets ? 'No allergies to declare'
           : (a.diets.length ? esc(a.diets.join(' \u00b7 ')) : '');
  if (diet && a.dnote) diet += '<br><span style="color:var(--mid);font-style:italic">' +
                               esc(a.dnote) + '</span>';
  h += sumRow('Dietary', diet);

  if (a.arriveBy)  h += sumRow('Arriving', esc(a.arriveBy));
  if (a.purpose.length) h += sumRow('Purpose', esc(a.purpose.join(' \u00b7 ')));
  if (a.approach)  h += sumRow('Dining', esc(APPROACH_LABEL[a.approach] || a.approach));
  if (a.occasion)  h += sumRow('Occasion', esc(a.occasion));

  if (a.wellness !== null){
    var w = a.wellness ? 'Interested' : 'Not interested';
    if (a.wellness && a.wellDay)  w += ' \u00b7 ' + dayLabel(a.wellDay);
    if (a.wellness && a.wellTime) w += ' \u00b7 ' + esc(a.wellTime);
    h += sumRow('Wellness', w);
  }
  if (a.note) h += sumRow('Notes', esc(a.note));

  h += '<div class="sum-btns">' +
         '<button data-act="edit" data-villa="' + r.villa + '">Edit</button>' +
         '<button class="go" data-act="confirm" data-villa="' + r.villa + '">' +
         (isConfirmed(r.pre) ? 'Confirm again' : 'Confirm') + '</button>' +
       '</div>';
  return '<div class="sum">' + h + '</div>';
}

function render(){
  var todo = ROWS.filter(function(r){ return !isConfirmed(r.pre); });
  var done = ROWS.filter(function(r){ return  isConfirmed(r.pre); });

  document.getElementById('nArr').textContent  = ROWS.length;
  document.getElementById('nLeft').textContent = todo.length;
  document.getElementById('tileLeft').className = 'stat' + (todo.length ? ' due' : '');

  var h = '';
  if (!ROWS.length){
    h = '<div class="empty">No arrivals on this date.</div>';
  } else {
    h += '<div class="seclabel">To confirm</div>';
    h += todo.length ? todo.map(rowHTML).join('')
                     : '<div class="empty">All confirmed.</div>';
    if (done.length)
      h += '<div class="seclabel">Confirmed</div>' + done.map(rowHTML).join('');
  }
  document.getElementById('board').innerHTML = h;
}

/* One read per booking. /bookings cannot be listed, by design, so there is no
   cheaper shape: reading the node itself returns 401. Seventeen villas is the
   ceiling, and this runs on a date change rather than on a poll. */
function loadPrearrivals(rows){
  return Promise.all(rows.map(function(r){
    return api('/bookings/'+r.stay.id+'/prearrival')
      .then(function(p){ r.pre = p; })
      .catch(function(){ r.pre = null; });
  }));
}

function load(){
  var key = nav.todayKey();
  err('');
  api('/stays/'+key)
    .then(function(day){
      ROWS = arrivingOn(day, key);
      render();                     /* the list shows before the extra reads */
      return loadPrearrivals(ROWS).then(render);
    })
    .catch(function(){
      ROWS = []; render();
      err('Could not load arrivals. This is usually the connection.');
    });
}


/* ── the guest sheet ───────────────────────────────────────────
   One screen, two starting states. A guest who filled the form in from their
   phone arrives here prefilled; one who did not arrives here empty. Same
   fields, same confirm, which is what makes this edit rather than create.

   Reception's script is the order: verify the dietaries, verify tonight's
   dining against the real menu, amend, confirm. So those two sit at the top
   and the softer context sits below them.                                */

var DIETARIES = ['Gluten free','Dairy free','Vegetarian','Vegan','Pescatarian',
                 'Nut allergy','Shellfish allergy','Egg allergy'];

/* Advisory only. It exists so that when a guest cannot be reached, staff can
   judge whether they are the type to eat out. It never drives logic. */
var PURPOSE = ['Independent or business','Exploring the area',
               'Celebration','Short break','Rest and recovery'];
var APPROACH = [['most','Dining in most nights'],
                ['mix','A mix of in and out'],
                ['out','Mostly eating out']];

var bd = document.getElementById('backdrop');
var sheetEl = document.getElementById('sheet');
function showSheet(){ bd.className = 'backdrop show'; }
function closeSheet(){ bd.className = 'backdrop'; }
bd.onclick = function(e){ if (e.target === bd) closeSheet(); };

/* One reading of what is stored, used by the summary, the edit sheet and the
   confirm button alike. Three readings would be three chances to disagree
   about the same guest. */
function answersOf(r){
  var p = r.pre || {};
  return {
    dining:   p.dining === undefined ? null : !!p.dining,
    pax:      p.pax || r.stay.adults || 2,
    diets:    (p.diets || []).slice(),
    noDiets:  !!p.noDiets,
    dnote:    p.dnote || '',
    arriveBy: p.arriveBy || '',
    purpose:  (p.purpose || []).slice(),
    approach: p.approach || '',
    occasion: p.occasion || '',
    wellness: p.wellness === undefined ? null : !!p.wellness,
    wellDay:  p.wellDay || '',
    wellTime: p.wellTime || '',
    note:     p.note || ''
  };
}

function openGuest(r){
  var p = r.pre || {};
  var a = answersOf(r);

  var pax = a.pax;

  sheetEl.innerHTML =
    '<h3>Villa ' + r.villa + '</h3>' +
    '<div class="gd">' + esc(nameOf(r.stay)) +
      '<span class="gd-sub">' + stayLabel(r.stay) +
        (r.stay.adults ? ' \u00b7 ' + r.stay.adults +
          (Number(r.stay.adults)===1?' adult':' adults') : '') +
      '</span></div>' +
    (a.arriveBy ? '<div class="note-box">Told us they would arrive ' +
       esc(a.arriveBy) + '.</div>' : '') +
    (hasForm(p) ? '' :
      '<div class="note-box">No pre-arrival form. Fill it in together.</div>') +

    '<div class="sheet-label">Dining on arrival night</div>' +
    '<div class="seg">' +
      '<button id="sDin">Dining</button>' +
      '<button id="sOut">Not dining</button>' +
    '</div>' +
    '<div id="paxWrap"><div class="sheet-label">Guests at dinner</div>' +
      '<div class="pax-row" id="paxRow"></div></div>' +

    '<div class="sheet-label">Dietary requirements</div>' +
    '<div class="chips" id="dChips"></div>' +
    '<div class="chips" id="dNone"></div>' +
    '<input class="txt" id="fDnote" type="text" placeholder="Notes" autocomplete="off">' +

    '<div class="sheet-label">Purpose of visit</div>' +
    '<div class="chips" id="pChips"></div>' +

    '<div class="sheet-label">How they plan to dine</div>' +
    '<div class="chips" id="aChips"></div>' +

    '<div class="sheet-label">Special occasion</div>' +
    '<input class="txt" id="fOcc" type="text" placeholder="Birthday, anniversary" autocomplete="off">' +

    '<div class="sheet-label">Wellness or massage</div>' +
    '<div class="seg">' +
      '<button id="wYes">Interested</button>' +
      '<button id="wNo">Not interested</button>' +
    '</div>' +
    '<div id="wWrap">' +
      '<div class="sheet-label">Preferred day</div>' +
      '<div class="chips" id="wDays"></div>' +
      '<input class="txt" id="fWtime" type="text" placeholder="Preferred time" autocomplete="off" style="margin-top:8px">' +
    '</div>' +

    '<div class="sheet-label">Anything else</div>' +
    '<input class="txt" id="fNote" type="text" placeholder="Preferences, requests" autocomplete="off">' +

    '<button class="opt solid" id="sConfirm" style="margin-top:18px">Confirm</button>' +
    '<button class="opt quiet" id="sClose">Close</button>';

  document.getElementById('fDnote').value  = a.dnote;
  document.getElementById('fOcc').value    = a.occasion;
  document.getElementById('fNote').value   = a.note;
  document.getElementById('fWtime').value  = a.wellTime;

  function paintDining(){
    document.getElementById('sDin').className = a.dining === true  ? 'on' : '';
    document.getElementById('sOut').className = a.dining === false ? 'on' : '';
    /* Covers only mean something if they are eating. */
    document.getElementById('paxWrap').style.display = a.dining === true ? '' : 'none';
  }
  document.getElementById('sDin').onclick = function(){ a.dining = true;  paintDining(); };
  document.getElementById('sOut').onclick = function(){ a.dining = false; paintDining(); };

  function paintPax(){
    var box = document.getElementById('paxRow'); box.innerHTML = '';
    for (var i=1;i<=8;i++)(function(v){
      var b = document.createElement('button');
      b.className = 'pax' + (pax===v ? ' on' : ''); b.textContent = v;
      b.onclick = function(){ pax = v; paintPax(); };
      box.appendChild(b);
    })(i);
  }

  function paintDiets(){
    var box = document.getElementById('dChips'); box.innerHTML = '';
    DIETARIES.forEach(function(d){
      var b = document.createElement('button');
      b.className = 'chip' + (a.diets.indexOf(d)>-1 ? ' on' : ''); b.textContent = d;
      b.onclick = function(){
        var i = a.diets.indexOf(d);
        if (i>-1) a.diets.splice(i,1); else { a.diets.push(d); a.noDiets = false; }
        paintDiets(); paintNone();
      };
      box.appendChild(b);
    });
  }
  /* "None to declare" is a positive answer, not the absence of one. Without
     it, a guest who genuinely has no allergies is indistinguishable from one
     nobody asked, which is the whole reason reception is going through this. */
  function paintNone(){
    var box = document.getElementById('dNone'); box.innerHTML = '';
    var b = document.createElement('button');
    b.className = 'chip' + (a.noDiets ? ' on' : ''); b.textContent = 'No allergies to declare';
    b.onclick = function(){
      a.noDiets = !a.noDiets;
      if (a.noDiets) a.diets = [];
      paintDiets(); paintNone();
    };
    box.appendChild(b);
  }

  function paintPurpose(){
    var box = document.getElementById('pChips'); box.innerHTML = '';
    PURPOSE.forEach(function(t){
      var b = document.createElement('button');
      b.className = 'chip' + (a.purpose.indexOf(t)>-1 ? ' on' : ''); b.textContent = t;
      b.onclick = function(){
        var i = a.purpose.indexOf(t);
        if (i>-1) a.purpose.splice(i,1); else a.purpose.push(t);
        paintPurpose();
      };
      box.appendChild(b);
    });
  }
  function paintApproach(){
    var box = document.getElementById('aChips'); box.innerHTML = '';
    APPROACH.forEach(function(pair){
      var b = document.createElement('button');
      b.className = 'chip' + (a.approach===pair[0] ? ' on' : ''); b.textContent = pair[1];
      b.onclick = function(){ a.approach = (a.approach===pair[0] ? '' : pair[0]); paintApproach(); };
      box.appendChild(b);
    });
  }
  /* Only the nights they are actually here. Offering a day outside the stay is
     an appointment nobody can keep. Arrival and departure days are included:
     a treatment on the afternoon of arrival or the morning of departure is
     normal, and excluding them would be the app deciding for the spa. */
  function stayDays(){
    var out = [], a1 = parseDepDate(dkeyOf(r.stay.arrive)),
                  b1 = parseDepDate(dkeyOf(r.stay.depart));
    if (!a1 || !b1) return out;
    var D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for (var d = new Date(a1); d <= b1 && out.length < 30; d.setDate(d.getDate()+1))
      out.push({ key: dkey(d), label: D[d.getDay()] + ' ' + d.getDate() });
    return out;
  }
  function paintWellness(){
    document.getElementById('wYes').className = a.wellness === true  ? 'on' : '';
    document.getElementById('wNo').className  = a.wellness === false ? 'on' : '';
    /* A day and a time only mean something once they have said yes. */
    document.getElementById('wWrap').style.display = a.wellness === true ? '' : 'none';
    var box = document.getElementById('wDays'); box.innerHTML = '';
    stayDays().forEach(function(d){
      var b = document.createElement('button');
      b.className = 'chip' + (a.wellDay === d.key ? ' on' : ''); b.textContent = d.label;
      b.onclick = function(){ a.wellDay = (a.wellDay === d.key ? '' : d.key); paintWellness(); };
      box.appendChild(b);
    });
  }
  document.getElementById('wYes').onclick = function(){ a.wellness = true;  paintWellness(); };
  document.getElementById('wNo').onclick  = function(){ a.wellness = false; paintWellness(); };

  paintDining(); paintPax(); paintDiets(); paintNone();
  paintPurpose(); paintApproach(); paintWellness();

  document.getElementById('sClose').onclick = closeSheet;
  document.getElementById('sConfirm').onclick = function(){
    a.pax      = pax;
    a.dnote    = document.getElementById('fDnote').value.trim();
    a.occasion = document.getElementById('fOcc').value.trim();
    a.note     = document.getElementById('fNote').value.trim();
    a.wellTime = document.getElementById('fWtime').value.trim();
    save(r, a);
  };
  showSheet();
}

/* Writes the guest's own node, whoever typed it. No record of who filled it
   in: the chef reads one thing and does not care.

   PATCH rather than PUT, so a field this screen does not carry is left alone
   rather than deleted. `at` is set only if the form had never been started,
   so it keeps meaning "when the answers first existed". */
function save(r, a){
  var payload = {
    dining: a.dining, pax: a.dining ? a.pax : 0,
    diets: a.diets, noDiets: a.noDiets, dnote: a.dnote,
    arriveBy: a.arriveBy, purpose: a.purpose, approach: a.approach,
    occasion: a.occasion, wellness: a.wellness,
    wellDay: a.wellness ? a.wellDay : '', wellTime: a.wellness ? a.wellTime : '',
    note: a.note,
    confirmedAt: new Date().toISOString()
  };
  if (!hasForm(r.pre)) payload.at = payload.confirmedAt;

  var before = r.pre;
  r.pre = Object.assign({}, r.pre || {}, payload);   /* optimistic */
  OPEN = null;
  render(); closeSheet();

  fetch(DB + '/bookings/' + r.stay.id + '/prearrival.json', {
    method: 'PATCH', headers: { 'Content-Type':'application/json' },
    body: JSON.stringify(payload)
  }).then(function(res){
    if (!res.ok) throw new Error(res.status);
  }).catch(function(){
    r.pre = before; render();      /* put it back rather than lie about it */
    err('Could not save. Nothing was changed.');
  });
}

function rowFor(v){
  return ROWS.filter(function(x){ return x.villa === v; })[0];
}

document.getElementById('board').addEventListener('click', function(e){
  var t = e.target;
  if (!t.closest) return;

  /* Edit and Confirm inside an open summary. */
  var act = t.closest('.sum-btns button');
  if (act){
    var ra = rowFor(act.getAttribute('data-villa'));
    if (!ra) return;
    if (act.getAttribute('data-act') === 'edit') return openGuest(ra);
    /* Confirming from the summary saves exactly what is on screen. The guest
       just agreed to it out loud, so there is nothing to open and nothing to
       retype. */
    return save(ra, answersOf(ra));
  }

  var btn = t.closest('.arr');
  if (!btn) return;
  var r = rowFor(btn.getAttribute('data-villa'));
  if (!r) return;

  /* A guest who filled the form in gets it read back to them, and reception
     confirms or edits from there. A guest with nothing to read back goes
     straight to the form, because an empty summary says nothing. */
  if (!hasForm(r.pre)) return openGuest(r);
  OPEN = (OPEN === r.villa) ? null : r.villa;
  render();
});

/* Only the boards this role may open. Sign out is never filtered. */
function navFilter(role){
  var need = { 'tally.html':'resBoard', 'list.html':'resSheet',
               'cleaners.html':'cleansBoard', 'housekeeping.html':'cleansBoard',
               'staff.html':'manageStaff' };
  var links = document.getElementById('navDrop').getElementsByTagName('a');
  for (var i=0;i<links.length;i++){
    if (links[i].className.indexOf('signout') > -1) continue;
    var href = (links[i].getAttribute('href')||'').split('?')[0];
    links[i].style.display = can(role, need[href]) ? '' : 'none';
  }
}

function showAccess(allowed, e){
  var box = document.getElementById('noAccess');
  var on = !allowed;
  box.innerHTML = !on ? '' :
    (e ? '<div>Could not check access. This is usually the connection, '
       + 'not your login.</div>'
       + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
       : 'This login has no access to Front Desk Arrival. See the manager.');
  /* A role with a board of its own is sent there rather than shown a refusal.
     Only a login with no role at all gets the message. */
  if (on && !e){
    var home = homeFor(window.NALA_ROLE);
    if (home && home !== location.pathname.split('/').pop()){
      location.replace(home); return;
    }
  }
  box.className = 'noaccess' + (on ? ' show' : '');
  ['statsRow','board'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.style.display = on ? 'none' : '';
  });
  if (!on) load();
}

window.NALA_ROLE = null;
(function gate(){
  /* Wait for the helper too, not just firebase: a stubbed SDK calls back
     synchronously, and a partial SDK can arrive without onAuthStateChanged.
     auth() itself throws before an app is initialised, so it is guarded. */
  if (!window.firebase || !firebase.auth || typeof loadStaff !== 'function')
    return setTimeout(gate, 40);
  var A; try { A = firebase.auth(); } catch(e){ return setTimeout(gate, 40); }
  if (!A || !A.onAuthStateChanged) return setTimeout(gate, 40);
  A.onAuthStateChanged(function(u){
    if (!u) return;                 /* auth.js owns the signed-out state */
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role;
      window.NALA_USER = u;
      document.getElementById('navWrap').style.display = 'block';
      navFilter(role);
      showAccess(can(role, 'editBookings'), e);
    });
  });
})();
</script>
