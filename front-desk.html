<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nala Villas">
<link rel="apple-touch-icon" href="nala-icon.png?v=1">
<title>Nala &middot; Front Desk Arrival</title>
<link rel="stylesheet" href="nala-ui2.css?v=2">
<link rel="stylesheet" href="nala-ui.css?v=17">
<style>
  body { padding:calc(24px + env(safe-area-inset-top)) 18px 0; }
  

  .seclabel { font-size:var(--t2);
              color:var(--mid); margin:22px 0 8px; }

  /* One arrival. The whole row is the control surface, the same idea as the
     villa tile grid, which is the documented exception to "a bordered
     rectangle is a button". */
  .arr { display:flex; align-items:center; gap:12px; width:100%;
         background:none; border:1px solid var(--rule); border-radius:8px;
         padding:11px 13px; margin-bottom:7px; text-align:left;
         font-family:var(--ui-font); color:inherit; cursor:pointer; }

  /* The villa number is how reception finds the guest standing in front of
     them, so it carries tile weight. 20 on the type scale. */
  .arr-v { font-size:var(--t4); min-width:30px; text-align:center; }
  .arr-mid { flex:1; min-width:0; }
  .arr-n { font-size:var(--t3); white-space:nowrap; overflow:hidden;
           text-overflow:ellipsis; }
  /* The number, its confidence mark and the pencil, as the Pre-arrival SMS
     page draws them and from the same builder. On its own line rather than
     beside the name: this row also carries the fork and the link icons, so
     the name line clips at phone width and a clipped pencil cannot be
     tapped. ok wears --dine, the same ink the SMS page's --resgreen is. */
  .arr-p { font-size:var(--t2); color:var(--mid); margin-top:2px; }
  .arr-p .ph { font-weight:normal; }
  .arr-p .conf { margin-left:4px; }
  .arr-p .conf.ok { color:var(--dine); }
  .arr-p .conf.un { color:var(--mid); }
  .arr-p .pen { font-size:var(--t2); color:var(--mid); margin-left:5px;
                padding:2px 4px; cursor:pointer; }
  /* Stay dates as the styleguide sets them: Tue 11-Fri 14. No ordinal, month
     omitted, one line, because a wrapped range doubles the row height. */
  .arr-s { font-size:var(--t2); color:var(--mid); margin-top:2px; white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis; }
  /* When they are getting here is what reception plans the afternoon around,
     so it does not read as quietly as the stay length beside it. */
  .arr-s .eta { font-size:var(--t2); font-weight:600; color:var(--ink); }
  /* The count reads in the row's own amber, so it is the same fact as the
     tint said louder rather than a second signal to decode. */
  .arr-s .ans { color:#8A6A2F; font-weight:600; }

  /* Confirmed rows recede but stay legible: reception still has to find a
     guest who checked in an hour ago. */
  .arr.is-done { opacity:.68; }

  /* Four stats rather than two, so they sit closer than the shared default. */
  .stats { gap:22px; }
  /* The same three colours the fork icons use, so the number and the row it
     counts are read as one thing. */
  .stat-n.dine   { color:var(--dine); }
  .stat-n.nodine { color:var(--nodine); }
  .stat-n.unsure { color:var(--mid); }
  /* Arrived is a fraction: the number alone says nothing without the total,
     and reception is watching one climb towards the other. */
  .stat-n .of { font-size:var(--t3); color:var(--mid); }

  /* The summary drops out of the row it belongs to, so it is inset and shares
     the row's left edge rather than floating as its own card. */
  .sum { border:1px solid var(--rule); border-top:none; border-radius:0 0 8px 8px;
         margin:-8px 0 7px; padding:12px 13px 13px; }
  .sum-r { display:flex; gap:10px; font-size:var(--t2); line-height:1.5;
           padding:3px 0; align-items:baseline; }
  .sum-l { flex:0 0 88px; font-size:var(--t1);
           color:var(--mid); padding-top:3px; }
  .sum-v { flex:1; min-width:0; }
  .sum-v.none { color:var(--mid); font-style:italic; }
  .sum-btns { display:flex; gap:7px; margin-top:12px; }
  .sum-btns + .sum-btns { margin-top:7px; }
  .sum-btns button.wide { flex:1 1 100%; }
  .sum-btns button { flex:1; padding:12px 0; border:1px solid var(--rule);
                     border-radius:6px; font-family:var(--ui-font); font-size:var(--t2); cursor:pointer;
                     background:transparent; color:var(--mid); }
  .sum-btns button.go { background:var(--green); border-color:var(--greenb);
                        color:var(--ink); }
  /* The row a summary is hanging from keeps its top corners only. */
  .arr.open { border-radius:8px 8px 0 0; margin-bottom:8px; }

  /* Whether they are eating, readable without opening anything. Only on rows
     that have a form: there is nothing to report about a guest who has not
     answered, and an icon there would be an answer we do not have. */
  /* 28px, up from 19 on 28 Aug: the owner could not read it at a glance,
     and it was competing with a 20px villa number while carrying the one
     fact the row exists to show at speed - whether the kitchen is cooking
     for this villa tonight. The row has the height for it already; nothing
     else on the row moves. */
  .fork { width:28px; height:28px; flex:0 0 28px; opacity:1; }
  .fork svg { width:100%; height:100%; display:block; }
  .fork.in  svg { fill:var(--dine); }
  .fork.out svg { fill:var(--nodine); }
  /* Grey stays the quietest of the three - unknown promises nothing, the
     colour law - but .6 at this size was faint enough to be missed rather
     than merely quiet. */
  .fork.un  svg { fill:var(--mid); opacity:.75; }

  /* Opened the message and did not finish. Outlined rather than filled, so it
     reads as the absence of an answer rather than as one.

     Same icon as the Reservations board, deliberately. It means the same thing
     in both places: this guest received what we sent and has not replied. The
     two boards track DIFFERENT messages, the nightly dinner invite there and
     the pre-arrival link here, so an icon on one says nothing about the other.
     Any future message asking a guest for something follows the same rule, and
     the question each time is which screen the answer lands on, because that
     is the screen the icon belongs on. */
  .seen { width:15px; height:15px; flex:0 0 15px; opacity:.55; }
  .seen svg { width:100%; height:100%; display:block; fill:none; stroke:var(--mid); }

  /* The tint is how complete the answers are, ruled by the owner 26 Aug:
     grey when nobody has answered anything, amber when some answers exist,
     green only when every question the desk settles holds one. Grey is the
     colour law's light grey fill - unknown promises nothing - because an
     untouched guest is not work in progress, they are not started. It used
     to be amber, which made a row nobody had touched read the same as one
     half done. Kept very light so the villa number and the name still carry
     the row. */
  .arr.done-form { background:rgba(122,160,130,.11); border-color:rgba(122,160,130,.34); }
  .arr.todo-form { background:rgba(28,28,26,.045); border-color:var(--rule); }
  /* Started and not finished: amber, the colour law's in-progress, with a
     solid left edge to say somebody has met it halfway. */
  .arr.part-form { background:rgba(194,154,85,.11); border-color:rgba(194,154,85,.36);
                   border-left:3px solid rgba(194,154,85,.85); }
  .sum { background:rgba(122,160,130,.11); border-color:rgba(122,160,130,.34); }

  .empty { font-size:var(--t3); color:var(--mid); font-style:italic; padding:4px 0 2px; }
  .spacer { height:40px; }
  #errBar { display:none; background:var(--red); color:#fff; font-size:var(--t2);
            padding:9px 12px; border-radius:var(--r); margin-top:12px; }
  #errBar.show { display:block; }

  /* Sheet chrome and controls, matching tally.html exactly. Copied rather
     than reinvented: two screens with their own idea of a chip is how the
     app starts looking like two apps. */
  .backdrop { position:fixed; inset:0; background:rgba(28,28,26,.35);
              display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .backdrop.show { display:flex; }
  .sheet { width:100%; max-width:520px; background:var(--cream);
           padding:26px 24px 34px; border-top:1px solid var(--rule);
           max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sheet h3 { font-family:var(--ui-font); font-size:var(--t2); color:var(--mid); font-weight:normal;
              text-align:center; margin-bottom:18px; }
  .sheet-label { font-family:var(--ui-font); font-size:var(--t1); color:var(--mid); text-align:center;
                 margin:16px 0 8px; }
  .opt { width:100%; padding:15px; margin-bottom:8px; border:1px solid transparent;
         border-radius:6px; font-family:var(--ui-font); font-size:var(--t2); color:var(--ink);
         cursor:pointer; }
  .opt.solid { background:var(--green); border-color:var(--greenb); }
  .opt.quiet { background:transparent; border-color:var(--rule); color:var(--mid); }
  /* The button law (STYLEGUIDE.md): a control that walks back something the
     guest was told wears terracotta outline and asks first. Marking a form
     incomplete puts the guest back into To send on Pre-arrival SMS, where
     they can be messaged the link again, so it is that kind of button. */
  .opt.terra { background:transparent; border-color:var(--terra-b); color:var(--terra); }
  .opt.terra:active { background:var(--terra-t); }
  .opt:disabled { opacity:.4; cursor:default; }
  /* Why the primary is unavailable, said rather than left to be guessed at. */
  .opt-why { font-family:var(--ui-font); font-size:var(--t2); color:var(--mid);
             text-align:center; margin:-4px 0 10px; line-height:1.45; }
  .seg { display:flex; gap:6px; margin:2px 0 4px; }
  .seg button { flex:1; padding:11px 0; border:1px solid var(--rule); background:transparent;
                font-family:var(--ui-font); font-size:var(--t2); color:var(--mid); cursor:pointer; border-radius:6px; }
  .seg button.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  /* An answer that WAS chosen and has just been taken off. The fill goes,
     the dark border stays, so a deselect made by accident is visible as a
     gap where an answer used to be rather than as a blank nobody can tell
     from never-asked. Asked for by the owner 28 Aug.

     It lasts only as long as the sheet is open, which is deliberate and
     is the smaller half of the fix: the desk's answers are written into
     the guest's own fields, so once a deselect is SAVED the record no
     longer holds what was there before and there is nothing left to draw.
     Keeping it past a save means the desk's answers sitting beside the
     guest's rather than in them - the arriveApproved shape - which is its
     own change and was left for when it is wanted. */
  .seg button.was, .chip.was { border-color:var(--ink); color:var(--ink); }
  .pax-row { display:flex; gap:6px; justify-content:center; margin:4px 0 4px; }
  .pax { width:42px; height:42px; border:1px solid var(--rule); background:transparent;
         font-family:var(--ui-font); font-size:var(--t3); color:var(--ink);
         cursor:pointer; border-radius:var(--pill); }
  .pax.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:4px; }
  /* One dress for every row of choices on the sheet, ruled by the owner
     27 Aug once the two time rows proved it: the choices stand in a single
     rank and the RANK scrolls, rather than wrapping into a block that pushes
     the next question off the screen. A wrapped row costs vertical space,
     which is the scarce dimension on a phone held at a desk; a rail costs
     none and never changes height as the answers change.

     Written against `.rail` alone rather than `.chips.rail`, because the
     covers row is a `.pax-row` and wears the same dress: one rule, or the
     two rows drift. The rail scrolls itself; the sheet never scrolls
     sideways, which the suite asserts at all three widths. */
  .rail { flex-wrap:nowrap; overflow-x:auto;
          -webkit-overflow-scrolling:touch; padding-bottom:6px; }
  /* Two declarations on purpose, not a leftover. A plain `center` centres a
     row that fits - which is what the sheet's centred labels want - but when
     the row overflows it centres the overflow too, and the chips off the
     LEFT edge cannot be scrolled back to. `safe center` centres only while
     it fits and falls back to the start once it does not; a browser that
     does not know the keyword ignores the line and keeps flex-start, which
     is the safe half of the same bargain. */
  .rail { justify-content:flex-start; }
  .rail { justify-content:safe center; }
  .rail > * { flex:0 0 auto; white-space:nowrap; }
  .chip { padding:7px 12px; border:1px solid var(--rule); background:transparent;
          border-radius:20px; font-family:var(--ui-font); font-size:var(--t2);
          color:var(--mid); cursor:pointer; }
  .chip.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .txt { width:100%; padding:12px; margin-bottom:8px; border:1px solid var(--rule);
         background:transparent; font-family:var(--ui-font); font-size:var(--t3); color:var(--ink); }
  .txt::placeholder { color:var(--mid); font-style:italic; }
  .txt:focus { outline:none; border-color:var(--ink); }
  .gd { text-align:center; margin:-4px 0 6px; font-size:var(--t2); line-height:1.55; }
  .gd .gd-sub { display:block; font-family:var(--ui-font); font-size:var(--t2);
                color:var(--mid); }
  .note-box { font-style:italic; font-size:var(--t2); color:var(--mid); text-align:center;
              line-height:1.6; padding:0 4px 14px; }
  /* The one flag that sets itself, said under the tickable ones so nobody
     hunts for its chip: Luxury Escapes rides on the Mews rate. */
  .flag-src { font-family:var(--ui-font); font-size:var(--t1); color:var(--mid);
              text-align:center; margin:2px 0 4px; }
  /* What is missing, said in words. A button that silently does nothing is
     the worst of both. */
  .miss-note { display:none; font-size:var(--t2); color:var(--red); text-align:center;
               padding:2px 4px 8px; }
  .miss-note.show { display:block; }
  /* The menu did not exist when the guest answered, so this is the first
     chance anyone has had to notice. */
  .clash { display:block; color:var(--red); font-size:var(--t2); margin-top:3px; }
  .seg.miss button, .chips.miss .chip { border-color:var(--red); }
  /* The note is part of the answer when Other is chosen, so it can be the
     thing that is missing, and has to be able to say so. */
  .txt.miss { border-color:var(--red); }
</style>
</head>
<body class="tier-app ui2">

<div class="daterow">
  <button class="dnav today" id="dToday">Today</button>
  <button class="dnav" id="dPrev">&#8249;</button>
  <div class="date" id="title"></div>
  <button class="dnav" id="dNext">&#8250;</button>
  <div class="navwrap" id="navWrap">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"></div>
  </div>

<div class="stats" id="statsRow">
  <div class="stat" id="tileLeft"><div class="stat-n" id="nArr">&ndash;</div><div class="stat-l">Arrived</div></div>
  <div class="stat"><div class="stat-n dine" id="nIn">&ndash;</div><div class="stat-l">Dining</div></div>
  <div class="stat"><div class="stat-n nodine" id="nOut">&ndash;</div><div class="stat-l">Not dining</div></div>
  <div class="stat"><div class="stat-n unsure" id="nUn">&ndash;</div><div class="stat-l">Not sure</div></div>
</div>

<div id="board"></div>

  <div class="sheet" id="sheet"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=12"></script>
<script src="nala-shared.js?v=46"></script>
<script>
var DB  = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
var nav = initDateNav();     /* wires Today, the arrows and the title itself */
var ROWS = [];               /* [{ villa, stay, pre }] for the viewed date */

(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
})();

function api(path){
  return fetch(DB + path + '.json?v=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); });
}

function err(msg){
  var e = document.getElementById('errBar');
  e.textContent = msg || '';
  e.className = msg ? 'show' : '';
}

/* Mews sends a full timestamp on some mappings and a bare date on others. */
function dkeyOf(v){
  var m = String(v || '').match(/^(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : null;
}

/* An arrival is a stay whose FIRST night is the date being viewed. /stays
   holds one row per night, so without this every in-house guest would sit on
   the arrivals list for the whole of their stay. */
function arrivingOn(dayStays, key){
  var out = [];
  for (var villa in (dayStays || {})){
    var s = dayStays[villa];
    /* Tolerates the older shape, where the value was a bare booking id. */
    if (!s || typeof s !== 'object' || !s.id) continue;
    if (dkeyOf(s.arrive) !== key) continue;
    out.push({ villa: String(villa), stay: s, pre: null });
  }
  return sortRows(out);
}

/* Earliest expected arrival first, so the list reads in the order reception
   works through it. Guests who gave no time sort last rather than first:
   assuming an unknown is early would push a known 2pm arrival below it. */
function sortRows(rows){
  return rows.sort(function(a, b){
    var ta = etaIndex(a.pre && a.pre.arriveSlot);
    var tb = etaIndex(b.pre && b.pre.arriveSlot);
    if (ta >= 0 && tb >= 0 && ta !== tb) return ta - tb;
    if (ta >= 0 && tb <  0) return -1;
    if (ta <  0 && tb >= 0) return 1;
    return (+a.villa) - (+b.villa);
  });
}

function nameOf(s){
  return (((s.first||'') + ' ' + (s.last||'')).trim()) || 'Guest';
}

/* The number a row shows and the editor opens with: the desk's own fix when
   one exists, else what Mews sent. */
function phoneOf(r){
  return String((r.fix && r.fix.phone) || r.stay.phone || '').trim();
}

/* The pencil's editor, shared with the SMS pages: see editPhoneNumber in
   nala-shared.js for the prompt, the refusal and the /phonefix write. This
   page's part is only where the words land and what reloads after a save. */
function fixNumber(r){
  editPhoneNumber({
    id: r.stay.id,
    name: nameOf(r.stay) === 'Guest' ? '' : nameOf(r.stay),
    current: phoneOf(r),
    was: r.stay.phone || ''
  }, function(msg){
    err(msg || '');
    if (!msg) load();
  });
}

function stayLabel(s){
  var a = parseDepDate(dkeyOf(s.arrive)), b = parseDepDate(dkeyOf(s.depart));
  if (!a || !b) return '';
  var D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return D[a.getDay()]+' '+a.getDate()+'-'+D[b.getDay()]+' '+b.getDate();
}

/* How long they are staying, rather than when they leave. On an arrivals list
   the departure date is not the question: everyone on this screen arrives
   today, so the range's first half is the same on every row and only the
   second half carries anything. "3 nights" says the useful part in less
   space, and the full range is in the sheet for anyone who needs the date. */
function nightsLabel(s){
  var a = parseDepDate(dkeyOf(s.arrive)), b = parseDepDate(dkeyOf(s.depart));
  if (!a || !b) return '';
  var n = Math.round((b - a) / 86400000);
  if (n < 1) return '';
  return n + (n === 1 ? ' night' : ' nights');
}

/* Two facts now, and they were three until 28 Aug.

   formState   not started, incomplete or completed - nala-shared.js
   checkedInAt they have physically arrived and been checked in

   confirmedAt was the third: reception has been through the answers with
   them. Nothing ever read it - isConfirmed was defined and never called - and
   once the owner put the form's state on its own gated control, the button
   that wrote it had no job left either. Both are gone. The sections track
   arriving, because that is what the receptionist is working through. */
function isArrived(p){ return !!(p && p.checkedInAt); }
/* `at` ALONE is not a finished form. It says "the answers exist", and a
   record can hold it while holding none: check in stamps it honestly, having
   just required dining and dietary, but since 26 Aug every answer can be
   taken back again and nothing took the stamp with them. The summary's own
   Confirm arriving then re-stamps whatever is left, asking nothing.

   What that left on villa 17, 28 Aug: a booking reading Form completed on
   Pre-arrival SMS, so the link could never be sent again, and amber here,
   because anyAnswers said yes and fullAnswers said no - with no way back from
   either screen.

   So the stamp must be accompanied by an answer to be believed. A guest can
   never submit an empty form (the slot, the dinner and the dietary questions
   are all required), so a stamp with nothing beside it was never a guest's.
   Reading it this way heals the records already written as well as the ones
   to come: no repair pass, no button to press. Both write ends are fixed too,
   in save(). */
function hasForm(p){ return !!(p && p.at && guestAnswered(p)); }

/* Three states, not two, since the guest form began saving each page as it is
   left. Before that a record either existed or did not, and `at` alone said
   which. Now a guest can answer three questions, put the phone down and never
   come back, and those three answers are real and worth having.

   GUEST_ANSWERS, guestAnswered, oneNightStay, mandatoryAnswered and formState
   all moved to nala-shared.js on 28 Aug, when the owner replaced the two
   overlapping systems with one three state model. Pre-arrival SMS reads the
   same functions: two readings of one state is how the two boards came to
   disagree about villa 17. */

function startedForm(p){
  return !hasForm(p) && guestAnswered(p);
}

/* Any answer at all, wherever it came from - the guest's form or the desk. */
function anyAnswers(p){
  return guestAnswered(p);
}

/* What the guest was asked, and how to tell whether they answered it.
   Mirrors prearrival.html's own required list (missingOn) and the pages it
   hides on a one night stay, so the desk names exactly what that guest was
   offered and never a question they never saw. The two copies answer to one
   table, tests/form_questions.json, read by both suites - add a question
   there, not here.

   The reason this list is separate from GUEST_ANSWERS: that one asks "did
   anybody put anything in this record", and it is deliberately wide, holding
   free text and desk-only fields. This one is the questionnaire, and it has
   to be exactly the questionnaire. `occasion` is why they cannot be the same
   list - it was retired from the guest form on 23 Aug, folded into the notes
   box, and is desk-only now; naming it as missing would send reception
   chasing a question that no longer exists. */
/* In the form's own step order, so reception asks them back in the order the
   guest was walked through - and so the table can assert the order too. */
var FORM_QUESTIONS = [
  { key:'purpose',  label:'what kind of stay it is', askedOnOneNight:false,
    answered:function(p){ return !!p.purpose; } },
  { key:'arrival',  label:'their arrival time', askedOnOneNight:true,
    answered:function(p){ return !!p.arriveSlot; } },
  { key:'approach', label:'how often they plan to dine', askedOnOneNight:false,
    answered:function(p){ return !!p.approach; } },
  { key:'dining',   label:'whether they are dining', askedOnOneNight:true,
    answered:function(p){ return p.dining === true || p.dining === false; } },
  { key:'dietary',  label:'dietaries', askedOnOneNight:true,
    answered:function(p){ return !!p.noDiets ||
      (Array.isArray(p.diets) ? p.diets.length > 0 : !!p.diets); } },
  { key:'wellness', label:'treatments', askedOnOneNight:false,
    answered:function(p){ return p.wellness === true || p.wellness === false; } }
];

/* How many of the questions this guest was SHOWN they have answered, as the
   fraction reception reads off an amber row: "2/6 answered". Asked for by
   the owner 28 Aug, because amber said work-to-do without saying how much,
   and a row one answer short looked exactly like one nobody had touched.

   Both halves come from FORM_QUESTIONS, so the count cannot drift from the
   "still to ask" sentence built out of the same list - and the denominator
   is what THIS guest was asked, never a constant: a one night stay is shown
   three of the six, and scoring them out of six would mark them down for
   questions nobody put to them. */
function answeredCount(p, stay){
  var one = oneNightStay(stay), rec = p || {};
  var asked = FORM_QUESTIONS.filter(function(q){
    return !(one && !q.askedOnOneNight); });
  return { done: asked.filter(function(q){ return q.answered(rec); }).length,
           of:   asked.length };
}

/* The questions this guest was shown and has not answered, in the form's own
   order. Empty means nothing is outstanding, which is a different sentence
   at the desk and the whole reason this exists: a guest who answered every
   question and never pressed Send looks identical, in the record, to one who
   stopped halfway, and reception was told the same thing about both. */
function missingAnswers(p, stay){
  var one = oneNightStay(stay), rec = p || {};
  return FORM_QUESTIONS.filter(function(q){
    if (one && !q.askedOnOneNight) return false;   /* never put to them */
    return !q.answered(rec);
  }).map(function(q){ return q.label; });
}

/* The sheet's working answers in the record's own shape, so the state helpers
   can be asked about what is ON SCREEN rather than what is stored. That is
   what lets the Mark as completed button come alive under the finger as the
   last mandatory answer is tapped, with no save in between. */
function sheetAnswers(a){
  return {
    arriveSlot: a.arriveSlot, arriveNote: a.arriveNote,
    dining: a.dining, diets: a.diets, noDiets: a.noDiets, dnote: a.dnote,
    purpose: purposeText(a.purpose), approach: a.approach,
    wellness: a.wellness, note: a.note, companion: a.companion
  };
}

/* A list a person would say out loud: a, b and c. */
function andList(xs){
  if (xs.length <= 1) return xs[0] || '';
  return xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
}

/* The note above a part-finished form. Until 28 Aug it said "anything still
   blank is still unanswered" whatever the record held, so a form with every
   question answered - the guest simply never pressed Send - told reception to
   go looking for holes that were not there. Seen live, 28 Aug. */
function startedNote(p, stay){
  var miss = missingAnswers(p, stay);
  if (!miss.length)
    return 'They answered every question but never pressed Send, so the form '
         + 'is not marked finished. Nothing is outstanding: read it back and '
         + 'confirm.';
  return 'They started the form and did not finish it. Still to ask: '
       + andList(miss) + '. Their other answers are below.';
}

/* No pills on this screen. Every state a pill carried is already said once,
   and said better:

     how answered they are the row tint: green, amber or grey
     confirmed or not      which of the two sections the row is in
     dining or not         the fork icon, green, red or grey
     nothing came back     an amber row with no link icon

   The pills repeated all four. "FORM DONE" on a green row, and "Dining" beside
   a green fork, are the same fact twice in one row, which makes the reader
   check whether the two agree instead of just reading one.

   The link icon survives because it is the only thing here saying something
   the tint cannot: amber says no form, and the link icon says the message did
   reach them and they stopped partway, which is a different conversation from
   a guest who never saw it. */

/* Opened the pre-arrival link and answered nothing. It has nothing left to say
   once a form exists: a guest who submitted obviously opened it.

   Nor once one is under way. Until the guest form saved as it went, opened was
   the strongest signal short of finished, so this icon carried "the message
   reached them and they stopped partway". A part-finished form now says that,
   and says it better, with the answers to prove it. Left on both, the icon and
   the marked edge would be the same fact twice in one row, which is the thing
   the note above this section says the pills were removed for. */
function seenFor(p){
  if (!p || !p.openedAt || hasForm(p) || startedForm(p)) return '';
  return '<span class="seen">' + ICON_LINK + '</span>';
}

function esc(t){
  return String(t).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
  });
}

function rowHTML(r){
  /* Before a guest arrives, when they are coming is the fact reception plans
     around, so it takes the second slot. Party size gives way to it rather
     than both fighting for the width and the ETA losing: it is one tap away in
     the summary, and an ETA truncated to "after..." helps nobody.

     The slot only, never the note. Why they are early or late belongs in the
     summary, not squeezed into a row that already truncates. */
  /* One party holding more than one villa. Reception needs to know before
     they start, because the answers and the table are shared. */
  /* The other villas the same party holds today, from nala-shared.js since
     28 Aug: Pre-arrival SMS needed the same mark, and one wording read by
     both is the only way the two boards can agree about a party. */
  var withVillas = groupMatesText(r, ROWS);
  var bits = [nightsLabel(r.stay)];
  if (withVillas) bits.push(esc(withVillas));
  var i = etaIndex(r.pre && r.pre.arriveSlot);
  if (i >= 0) bits.push('<span class="eta">' + ETA_SLOTS[i][2] + '</span>');
  else if (r.stay.adults)
    bits.push(r.stay.adults + (Number(r.stay.adults)===1 ? ' adult' : ' adults'));
  var open = OPEN === r.villa;
  /* The state, not the answers. Ruled by the owner 28 Aug, superseding the
     ruling of 26 Aug that the tint read completeness: a board that colours
     one thing while the sheet's button decides another is two facts nobody
     reconciled, which is what let villa 17 read green here and amber on
     Pre-arrival SMS. Now grey, amber and green ARE not started, incomplete
     and completed, and formState is the only thing that says which. */
  var st = formState(r.pre, r.stay);
  var tint = st === 'completed' ? ' done-form'
           : st === 'incomplete' ? ' part-form' : ' todo-form';
  /* On an amber row only. Green has nothing left to count and grey has
     nothing counted yet, so on those it would be a number saying what the
     colour already says. */
  if (st === 'incomplete'){
    var n = answeredCount(r.pre, r.stay);
    bits.push('<span class="ans">' + n.done + '/' + n.of + ' answered</span>');
  }
  return '<button class="arr'+tint+(isArrived(r.pre)?' is-done':'')+(open?' open':'')+
         '" data-villa="'+r.villa+'">'+
         '<div class="arr-v">'+r.villa+'</div>'+
         '<div class="arr-mid">'+
           '<div class="arr-n">'+esc(nameOf(r.stay))+'</div>'+
           '<div class="arr-s">'+bits.join(' \u00b7 ')+'</div>'+
           /* The number, its confidence mark and the pencil, exactly as the
              Pre-arrival SMS rows carry them and from the same builder. On
              every row, arrived included: reception is the one who hears the
              right number, and the fix outranks Mews wherever one is read. */
           '<div class="arr-p">'+phoneBadgeHTML(phoneOf(r), true)+'</div>'+
         '</div>'+seenFor(r.pre)+forkFor(r.pre)+'</button>'+
         (open ? summaryHTML(r) : '');
}

/* Which row is showing its summary. One at a time: two open summaries and the
   list stops being a list. */
var OPEN = null;

var APPROACH_LABEL = { most:'Dining in most nights', mix:'A mix of in and out',
                       out:'Mostly eating out' };

var ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round">' +
  '<path d="M9.5 14.5l5-5"/>' +
  '<path d="M12.8 7.2l1.6-1.6a3.6 3.6 0 015.1 5.1l-1.6 1.6"/>' +
  '<path d="M11.2 16.8l-1.6 1.6a3.6 3.6 0 01-5.1-5.1l1.6-1.6"/></svg>';

/* Arrival time is a choice, not free text, and these six are in the order
   reception works through them. The two open ended ones carry a compulsory
   note, because "before 2pm" with no time is the answer that causes the
   problem it is warning about.

   Stored as the slot key, so the list orders exactly rather than by reading
   somebody's phrasing. Free text was tried and it parses "late morning" and
   "after 5pm" correctly often enough to be trusted and wrongly often enough
   to matter, which is the worst combination. */
/* Key, the guest's own wording, the short form for the row, and whether the
   slot wants a note. The middle column matches prearrival.html word for word,
   for the same reason as the purposes above. */
var ETA_SLOTS = [
  ['before2', 'Before 2pm',    'Before 2pm', true],
  ['14',      'Around 2pm',    '2pm',        false],
  ['1430',    'Around 2:30pm', '2:30pm',     false],
  ['15',      'Around 3pm',    '3pm',        false],
  ['1530',    'Around 3:30pm', '3:30pm',     false],
  ['16',      'Around 4pm',    '4pm',        false],
  ['1630',    'Around 4:30pm', '4:30pm',     false],
  ['17',      'Around 5pm',    '5pm',        false],
  ['after5',  'After 5pm',     'After 5pm',  true]
];
function etaIndex(slot){
  for (var i = 0; i < ETA_SLOTS.length; i++)
    if (ETA_SLOTS[i][0] === slot) return i;
  return -1;
}
function etaLabel(p){
  var i = etaIndex(p && p.arriveSlot);
  if (i < 0) return '';
  return p.arriveNote ? ETA_SLOTS[i][1] + ' \u00b7 ' + p.arriveNote : ETA_SLOTS[i][1];
}

var ICON_FORK = '<svg viewBox="0 0 24 24" stroke-width="0">' +
  '<path d="M6.2 2.5v6a2.4 2.4 0 001.6 2.3V21h1.6v-10.2A2.4 2.4 0 0011 8.5v-6H9.6v5.2H8.7V2.5H7.3v5.2h-.9V2.5H6.2z"/>' +
  '<path d="M15.6 2.5c-1.5 0-2.5 1.9-2.5 5.1 0 2.4.7 3.9 1.8 4.3V21h1.6V2.5h-.9z"/></svg>';

/* Every question on the pre-arrival form is mandatory, so a submitted form
   always carries a dining answer and "form done, dinner unanswered" cannot
   happen. Grey therefore means no form, and no form is not the absence of an
   answer: it is a tentative yes.

   The kitchen cooks for it. Oversupplying is the cheap mistake and
   undersupplying is not, and reception settles it at check-in either way. So
   every arrival carries a fork, and the grey ones are the ones still to be
   pinned down rather than the ones to be ignored.

   The undefined case is still handled rather than assumed away: a mandatory
   field is a rule in a form, not a guarantee from a database. */
function forkFor(p){
  var cls = (p && p.dining === true) ? 'in'
          : ((p && p.dining === false) ? 'out' : 'un');
  return '<span class="fork ' + cls + '">' + ICON_FORK + '</span>';
}

function dayLabel(key){
  var d = parseDepDate(key); if (!d) return key;
  var D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return D[d.getDay()] + ' ' + d.getDate();
}

/* The guest's answers, read back as sentences so reception can say them out
   loud and the guest can agree or not. Empty answers are shown as unanswered
   rather than hidden: a blank line is the thing reception needs to fill. */
function sumRow(label, value, empty){
  return '<div class="sum-r"><div class="sum-l">' + label + '</div>' +
         '<div class="sum-v' + (value ? '' : ' none') + '">' +
         (value || empty || 'Not answered') + '</div></div>';
}

function summaryHTML(r){
  var a = answersOf(r), h = '';

  /* First, directly under the name on the row above, because it is part of
     who is arriving rather than an answer they gave. Only when somebody has
     named one: an empty line here would read as a question for the guest,
     and the editor already asks it. */
  if (a.companion) h += sumRow('Second guest', esc(a.companion));

  h += sumRow('Dinner', a.dining === null ? '' :
        (a.dining ? 'Dining \u00b7 ' + a.pax +
          (a.pax === 1 ? ' guest' : ' guests') : 'Not dining'));

  var diet = a.noDiets ? 'No allergies to declare'
           : (a.diets.length ? esc(a.diets.join(' \u00b7 ')) : '');
  if (diet && a.dnote) diet += '<br><span style="color:var(--mid);font-style:italic">' +
                               esc(a.dnote) + '</span>';
  /* The one thing on this screen the guest could not have been told. Their
     form was filled in days before tonight's menu existed, so this is the
     first moment the two halves can be compared, and reception is holding the
     menu. It warns rather than blocks: they can settle it in conversation. */
  if (a.dining !== false){
    var clash = conflictsFor(a.diets);
    if (clash.length){
      var names = clash.map(function(c){ return c.course; })
        .filter(function(c,i,x){ return x.indexOf(c) === i; });
      diet += '<br><span class="clash">Tonight\u2019s ' + names.join(' and ') +
              ' contains ' + esc(clash.map(function(c){ return c.diet; })
                .filter(function(c,i,x){ return x.indexOf(c) === i; }).join(', ')) +
              '</span>';
    }
  }
  h += sumRow('Dietary', diet);

  if (etaLabel(r.pre)) h += sumRow('Arriving', esc(etaLabel(r.pre)));
  if (a.purpose.length) h += sumRow('Purpose', esc(a.purpose.join(' \u00b7 ')));
  if (a.approach)  h += sumRow('Dining', esc(APPROACH_LABEL[a.approach] || a.approach));
  if (a.occasion)  h += sumRow('Occasion', esc(a.occasion));

  /* The live spa state, not the form's opening ask. Until 27 Aug this row
     read only the prearrival answers, so nothing that happened on the Spa
     board - a booking, a suggestion, a decline - ever reached the sheet,
     and reception told a guest their booked massage was "Interested". The
     records at /spa/<booking> are the current truth; the form's answer
     stands in only while no record has been born from it, which is the
     spa board's own rule for the same ask. */
  var spa = r.spa || {}, spaLines = [], spaAnswered = false;
  Object.keys(spa).sort().forEach(function(tid){
    var t = spa[tid];
    if (!t || typeof t !== 'object' || !t.status) return;
    if (t.source === 'prearrival') spaAnswered = true;
    var two = t.qty === 2 ? 'Two massages \u00b7 ' : '';
    var when = (t.day ? dayLabel(t.day) : '') +
               (t.time ? ' \u00b7 ' + spaSlotLabel(t.time) : '');
    if (t.status === 'booked')
      spaLines.push(two + 'Booked \u00b7 ' + when +
                    (t.manual ? ' \u00b7 approved at the desk' : ''));
    else if (t.status === 'suggested')
      spaLines.push(two + 'Suggested ' + when + ' \u00b7 waiting on the guest');
    else if (t.status === 'requested')
      spaLines.push(two + 'Asked' +
                    (t.reqDay ? ' \u00b7 ' + dayLabel(t.reqDay) : '') +
                    (t.reqTime ? ' \u00b7 ' + esc(t.reqTime) : '') +
                    ' \u00b7 waiting on the masseuse');
    else if (t.status === 'declined')
      spaLines.push('Declined' + (t.note ? ' \u00b7 ' + esc(t.note) : '') +
                    (t.told ? ' \u00b7 guest told' : ' \u00b7 let the guest know'));
  });
  if (a.wellness === true && !spaAnswered){
    var w = 'Interested';
    if (a.wellDay)  w += ' \u00b7 ' + dayLabel(a.wellDay);
    if (a.wellTime) w += ' \u00b7 ' + esc(a.wellTime);
    spaLines.push(w + ' \u00b7 waiting on the masseuse');
  }
  if (spaLines.length) h += sumRow('Wellness', spaLines.join('<br>'));
  else if (a.wellness === false) h += sumRow('Wellness', 'Not interested');
  if (a.note) h += sumRow('Booking notes', esc(a.note));

  /* Only when one is on: an empty flags row is not a blank reception needs
     to fill, unlike the answers above, so it earns no line. */
  var fl = bookingFlagLabels(r.pms, r.bf);
  /* Escaped: the names are typed by an admin on Flag Settings, and this
     summary is otherwise built by concatenation - the staff-note lesson. */
  if (fl.length) h += sumRow('Booking flags', esc(fl.join(' \u00b7 ')));

  h += '<div class="sum-btns">' +
         '<button data-act="edit" data-villa="' + r.villa + '">Edit</button>' +
       '</div>' +
       /* Its own row and full width: it is the one that ends the interaction.
          Confirm arriving used to sit beside Edit. It is gone, 28 Aug: it
          stamped the form complete and it cleared checkedInAt, and once the
          owner moved the state onto its own gated control the only thing it
          still did was un-arrive a guest - a button called Confirm arriving
          whose one visible effect was to undo arriving. The undo it carried
          was real and is kept, on this button, where it belongs: check in is
          a toggle, so the way back from an accidental press is to press it
          again. */
       '<div class="sum-btns">' +
         '<button class="go wide" data-act="checkin" data-villa="' + r.villa + '">' +
         (isArrived(r.pre) ? 'Checked in &middot; tap to undo'
                           : 'Confirm &amp; check in') + '</button>' +
       '</div>';
  return '<div class="sum">' + h + '</div>';
}

function render(){
  var todo = ROWS.filter(function(r){ return !isArrived(r.pre); });
  var done = ROWS.filter(function(r){ return  isArrived(r.pre); });

  document.getElementById('nArr').innerHTML =
    done.length + '<span class="of">/' + ROWS.length + '</span>';

  /* Of everyone arriving today, how many are eating tonight. The three add up
     to the total on purpose: a guest with no form and a guest who skipped the
     dinner question are both unknown to the kitchen, however differently they
     got there, and a count that did not add up would send someone looking for
     the missing one. */
  var din = 0, out = 0, un = 0;
  ROWS.forEach(function(r){
    var d = r.pre && r.pre.dining;
    if (d === true) din++; else if (d === false) out++; else un++;
  });
  /* Not sure is a tentative yes, so the kitchen plans for din + un and only
     out is genuinely off the list. The three are still shown separately
     because how firm a number is matters as much as the number. */
  document.getElementById('nIn').textContent  = din;
  document.getElementById('nOut').textContent = out;
  document.getElementById('nUn').textContent  = un;

  var h = '';
  if (!ROWS.length){
    h = '<div class="empty">No arrivals on this date.</div>';
  } else {
    /* Arriving and Arrived rather than to confirm and confirmed. Confirming is
       what reception does; arriving is what the guest does, and the guest is
       what the receptionist is looking at when they scan this list. */
    h += '<div class="seclabel">Arriving</div>';
    h += todo.length ? todo.map(rowHTML).join('')
                     : '<div class="empty">Everyone has arrived.</div>';
    if (done.length)
      h += '<div class="seclabel">Arrived</div>' + done.map(rowHTML).join('');
  }
  document.getElementById('board').innerHTML = h;
}

/* Which of a guest's dietaries tonight's menu actually contains.

   The chef tags each course at publish time and those tags live at
   /menutags/<date>. Only explicit tags count: no keyword guessing, the same
   rule the guest page follows.

   Deliberately NOT shared with index.html's menuConflicts, and the reason
   matters before somebody "fixes" the duplication. index.html is guest tier
   and does not load nala-shared.js, by design, so a shared function would drag
   staff code onto a guest page. What keeps the two honest is that both compare
   the guest's dietaries against the same /menutags node: change what a
   conflict means and both have to change.

   This one names the course rather than the dish, because it does not read
   menu.json. Reception is standing in front of the guest holding the menu, so
   "the main contains Nut allergy" is enough to start the conversation. */
function conflictsFor(diets){
  var hits = [];
  if (!diets || !diets.length || !TAGS) return hits;
  ['bread','entree','main','dessert'].forEach(function(course){
    var tagged = TAGS[course];
    if (!tagged || !tagged.length) return;
    tagged.forEach(function(tag){
      diets.forEach(function(d){
        if (String(d).toLowerCase() === String(tag).toLowerCase())
          hits.push({ course: course, diet: d });
      });
    });
  });
  return hits;
}

/* One read per booking. /bookings cannot be listed, by design, so there is no
   cheaper shape: reading the node itself returns 401. Seventeen villas is the
   ceiling, and this runs on a date change rather than on a poll. */
function loadPrearrivals(rows){
  return Promise.all(rows.map(function(r){
    return Promise.all([
      api('/bookings/'+r.stay.id+'/prearrival').catch(function(){ return null; }),
      api('/bookings/'+r.stay.id+'/pms').catch(function(){ return null; }),
      /* A number fixed at the desk outranks the Mews copy: Mews cannot be
         corrected from here and its next sync would revert any edit made to
         the stay. The same record the SMS pages and the Worker read. */
      api('/phonefix/'+r.stay.id).catch(function(){ return null; }),
      /* The ticked booking flags. Read for every role because the summary
         shows the pills to everyone; only ticking is admin's. */
      api('/bookflags/'+r.stay.id).catch(function(){ return null; }),
      /* The treatments at /spa/<booking>: what actually happened to the
         guest's massage ask. Without this read the sheet could only ever
         repeat the form - found 27 Aug, when a massage the masseuse had
         booked still read "Interested" at the desk. */
      api('/spa/'+r.stay.id).catch(function(){ return null; })
    ]).then(function(res){ r.pre = res[0]; r.pms = res[1]; r.fix = res[2];
                           r.bf = res[3]; r.spa = res[4]; });
  }));
}

/* One row per booking, whatever /stays says.

   A guest moved between villas leaves an entry behind in the one they left.
   The Worker clears those, but only when the next event for that booking
   arrives, so anything stranded before that fix existed simply sits there.
   Seen live on 17 Aug: the same booking listed in villas 13, 14 and 15.

   /bookings/<id>/pms.villa is where Mews says they are and it is a single
   value, so it settles it. Where it disagrees with /stays, Mews wins. Where
   there is no pms to ask, the lowest villa is kept: arbitrary, but one row is
   right and three are not.

   Display defence, not a repair. The stale /stays entries stay until something
   clears them, and debug.html is where to see them. */
function oneRowPerBooking(rows){
  var pick = {};
  rows.forEach(function(r){
    var id = r.stay.id;
    if (!id) return;
    var kept = pick[id];
    if (!kept){ pick[id] = r; return; }
    var says = (r.pms && r.pms.villa) || (kept.pms && kept.pms.villa) || null;
    if (says != null) pick[id] = (String(r.villa) === String(says)) ? r : kept;
    else              pick[id] = (+r.villa < +kept.villa) ? r : kept;
  });
  var out = [], seen = {};
  rows.forEach(function(r){
    var id = r.stay.id;
    if (!id || seen[id]) return;
    seen[id] = true;
    out.push(pick[id]);
  });
  return out;
}

/* Tonight's cells, one request for the whole night. The desk needs these as
   well as the bookings, or an edit made on the Reservations board is invisible
   here and the next save from the desk quietly wipes it. */
function loadDinner(key, rows){
  return api('/dinner/'+key)
    .then(function(d){
      d = d || {};
      rows.forEach(function(r){ r.cell = d[r.villa] || null; });
    })
    .catch(function(){ rows.forEach(function(r){ r.cell = null; }); });
}

function load(){
  var key = nav.todayKey();
  err('');
  /* The tags belong to the night being viewed, so they move with the date. A
     failure here must not take the arrivals down with it: an unflagged allergy
     is bad, and a blank screen is worse. */
  api('/menutags/'+key)
    .then(function(t){ TAGS = fixTagNames(t); render(); })
    .catch(function(){ TAGS = null; });

  /* The chef's list, so reception offers what the kitchen recognises. The
     eight below were a fixed copy, which meant a dietary the chef added
     existed on the guest form and on the nightly form and nowhere at the one
     place a guest is standing in front of somebody: reception could only
     record it as a typed note, which no board counts and no filter finds.

     Common entries only. A "this menu only" entry warns about tonight's
     cooking, such as a chilli heat level, and belongs on the nightly form
     where the menu is already published. Check-in is not that moment.

     A failed read leaves the eight in place. They are the ordinary ones, so
     the desk degrades to what it did yesterday rather than to nothing. */
  api('/dietaries')
    .then(function(master){
      if (!master) return;
      var names = [];
      Object.keys(master).forEach(function(k){
        var d = master[k];
        if (d && d.active && (d.group || 'common') !== 'menu' &&
            (d.name || k) !== DIET_OTHER){
          var n = fixDietName(d.name || k);
          if (names.indexOf(n) === -1) names.push(n);
        }
      });
      if (names.length){ DIETARIES = names.sort(); render(); }
    })
    .catch(function(){});

  /* The admin's flag list, from Flag Settings, in its stored order. Only the
     active ones become chips; a name a booking carries that is no longer
     here is still painted by the sheet, selected, so a flag hidden or even
     deleted in Settings never silently unticks a booking. A failed read leaves an empty list and the sheet
     says where to define one. */
  api('/flags')
    .then(function(master){
      if (!master) return;
      var names = [];
      Object.keys(master).forEach(function(k){
        var d = master[k];
        if (d && d.active) names.push(d.name || k);
      });
      FLAGLIST = names.sort();
    })
    .catch(function(){});

  api('/stays/'+key)
    .then(function(day){
      ROWS = arrivingOn(day, key);
      render();                     /* the list shows before the extra reads */
      /* The arrival slots only exist once the per booking reads land, so the
         order is settled then rather than on the first paint. Sorting only in
         arrivingOn leaves the list in villa order forever, because every row
         has a null pre at that point. */
      return Promise.all([loadPrearrivals(ROWS), loadDinner(key, ROWS)])
        .then(function(){
          ROWS = sortRows(oneRowPerBooking(ROWS));
          render();
        });
    })
    .catch(function(){
      ROWS = []; render();
      err('Could not load arrivals. This is usually the connection.');
    });
}


/* ── the guest sheet ───────────────────────────────────────────
   One screen, two starting states. A guest who filled the form in from their
   phone arrives here prefilled; one who did not arrives here empty. Same
   fields, same confirm, which is what makes this edit rather than create.

   Reception's script is the order: verify the dietaries, verify tonight's
   dining against the real menu, amend, confirm. So those two sit at the top
   and the softer context sits below them.                                */

var DIETARIES = ['Gluten','Dairy','Vegetarian','Vegan','Pescatarian',
                 'Nut allergy','Shellfish allergy','Egg allergy'];

/* Not every allergy is on the list, and the list cannot grow to hold them all.
   Without this the only way past a required answer was "No allergies to
   declare", which is a lie, and it also wiped the note the real allergy had
   just been typed into: the note is cleared whenever that chip is on, because
   nothing to declare means nothing to write down.

   Stored as an ordinary dietary, so the chef's board, the sheet and the rules
   need no changes: they already carry a list of strings. It is the one entry
   that means read the note. */
var DIET_OTHER = 'Other';

/* Advisory only. It exists so that when a guest cannot be reached, staff can
   judge whether they are the type to eat out. It never drives logic. */
/* WORD FOR WORD the same as prearrival.html. Purpose is stored as the label
   itself, not as a key, so a list that differs by a single word silently
   throws the guest's answer away: they chose "A celebration", the desk offered
   "Celebration", nothing matched, the chip came up unselected and the next
   save dropped it. The guest's wording is the one kept, because it is what
   every record written so far already holds.

   coercion_test.js compares the two files, since nothing else can: this page
   loads nala-shared.js and the guest page deliberately does not, so the lists
   cannot be shared without putting staff code in a guest's browser. */
/* The guest's four, word for word: the label is the stored value and the
   coercion test holds the two lists together. Single select on both sides
   since 23 Aug, which also ends the joined string ever nearing the field's
   120 character ceiling. Old records show their retired labels as text. */
var PURPOSE = ['Mostly relaxing at Nala',
               'A mix of relaxing and exploring',
               'Mostly out exploring',
               'Working while I\u2019m here'];
/* Approach stores the key, so the labels are free to differ. They are matched
   anyway: reception reading the guest back a different sentence to the one
   they answered is how you lose their confidence at the desk. */
/* The guest's four, word for word, plus the two retired keys records
     still hold: painted only when a record carries one, so the desk never
     silently drops an old answer. */
var APPROACH = [['most',  'Most nights'],
                ['few',   'A few nights'],
                ['once',  'Probably just once'],
                ['unsure','Not sure yet']];
var APPROACH_OLD = { mix:'A mix of meals in and out', out:'We will mostly eat out' };

var bd = document.getElementById('backdrop');
var sheetEl = document.getElementById('sheet');
function showSheet(){ bd.className = 'backdrop show'; }
function closeSheet(){ bd.className = 'backdrop'; }
bd.onclick = function(e){ if (e.target === bd) closeSheet(); };

/* One rebuild of one row of choices. Here rather than in each painter
   because ten rows clear-and-refill the same way, and ten copies is how one
   of them gets forgotten - along with the null guard the flag row needs,
   being the only row a non-admin's sheet does not draw at all.

   It deliberately does NOT save and restore scrollLeft, though a scrolled
   rail jumping back to its start on every tap is exactly what you would
   expect. Measured instead of assumed, 27 Aug: a rail scrolled to 120px
   stays at 120px across a repaint with no help at all, because the clear
   and the refill happen in ONE task and the browser never lays out the
   empty row in between, so scrollLeft is never clamped. The guard was
   written first, then deleted when breaking it changed nothing - a test
   that cannot fail is worse than no test, and code that cannot be tested
   is a belief. If a painter ever refills asynchronously this stops being
   true, and that painter is where the fix belongs. */
function repaintRow(id, fill){
  var box = document.getElementById(id);
  if (!box) return;
  box.innerHTML = '';
  fill(box);
}

/* Put the chosen chip of every rail in view, once the sheet is on screen.
   Cannot run from the painters: while the backdrop is display:none every
   offset and width reads zero. A rail nobody has answered stays at its
   start, which is where its first choice is.

   Takes a root because two rails - the covers and the spa days - live inside
   blocks that are themselves hidden until the question above them is
   answered yes, so they measure zero on open and are centred again at the
   moment they appear. Rooted rather than global there, or revealing one
   block would drag every other rail back from wherever reception had
   scrolled it. */
function centreRails(root){
  Array.prototype.forEach.call((root || sheetEl).querySelectorAll('.rail'), function(box){
    var on = box.querySelector('.on');
    if (!on) return;
    box.scrollLeft = Math.max(0,
      on.offsetLeft - box.clientWidth / 2 + on.offsetWidth / 2);
  });
}

/* One reading of what is stored, used by the summary, the edit sheet and the
   confirm button alike. Three readings would be three chances to disagree
   about the same guest. */
function answersOf(r){
  var p = r.pre || {};
  /* Tonight's cell outranks the booking on the fields it holds, because the
     Reservations board edits the cell and the desk must not lose an edit made
     there.

     The bug this fixes: reception saved a dietary at check in, the kitchen
     added another on Reservations, and the next save from the desk wiped it,
     because the desk was reading the booking and the board was writing the
     cell. Two lists, one fact. */
  var c = r.cell || {};
  var haveCell = !!(c && c.status);
  var diets = fixDietList((haveCell && c.diets) ? c.diets : (p.diets || []));
  return {
    /* true and false are the only answers; undefined AND null read as
       unanswered. Null appears in the local optimistic copy when a save
       clears the question (the segments un-answer since 26 Aug), and
       reading it as false is exactly the invented Not dining the Save
       button was renamed over. */
    dining:   haveCell ? (c.status === 'in')
                       : (p.dining === true || p.dining === false
                            ? !!p.dining : null),
    pax:      haveCell ? (c.pax || r.stay.adults || 2)
                       : (p.pax || r.stay.adults || 2),
    diets:    diets,
    /* "No allergies to declare" is a dietary answer like any other, and it
       rides where the dietaries ride. The cell spells it `nodiet` - the
       guest page named it first and rules.json validates that name - and
       until 27 Aug this line asked the cell for a `noDiets` no cell has
       ever carried, so the first save after a cell existed read the pill
       back deselected and the next save wrote that deselection onto the
       booking. Only a cell that actually holds the key may outrank the
       booking, because a cell written before dinnerCell carried it says
       nothing either way; and a chosen dietary contradicts it from either
       node, so a non-empty list wins. */
    noDiets:  diets.length ? false
              : (haveCell && c.nodiet !== undefined) ? !!c.nodiet
              : !!p.noDiets,
    dnote:    (haveCell ? c.dnote : p.dnote) || '',
    /* The desk shows what the guest typed, falling back to what Mews holds:
       a name entered at booking is still the answer to the same question.
       That order now lives in companionOf, in nala-shared.js, because every
       board reads it and two readings of one fact is how they disagree. */
    companion: companionOf(p, r.pms),
    arriveSlot: p.arriveSlot || '',
    arriveNote: p.arriveNote || '',
    /* Reception's approved hour sits BESIDE the guest's slot, never in it:
       the slot is what the guest asked for, this is what reception agreed
       to, and collapsing the two loses the only record of who decided. */
    arriveApproved: (typeof p.arriveApproved === 'number' ? p.arriveApproved : null),
    purpose:  purposeList(p.purpose),
    approach: p.approach || '',
    note:     (haveCell && c.note !== undefined) ? c.note : (p.note || ''),
    occasion: p.occasion || '',
    wellness: p.wellness === true || p.wellness === false ? !!p.wellness : null,
    wellDay:  p.wellDay || '',
    wellTime: p.wellTime || '',
    wellQty:  p.wellQty === 2 ? 2 : 1,
    wellDur:  spaDur(p.wellDur) ? p.wellDur : 60,
    wellDur2: spaDur(p.wellDur2) ? p.wellDur2 : 60
  };
}

function openGuest(r){
  var p = r.pre || {};
  var a = answersOf(r);
  /* What the record held when this sheet was opened, frozen. Every painter
     below compares against it to mark an answer that has just been taken
     off - see the .was rule in the stylesheet. Copied, not referenced: `a`
     is the live working set and is edited in place by every chip. */
  var held = JSON.parse(JSON.stringify(a));
  /* Was this the answer on screen when the sheet opened, and is it not the
     answer now? One reading, so nine controls cannot disagree about it. */
  function lost(now, before){
    return before !== null && before !== undefined && before !== '' &&
           now !== before;
  }

  var pax = a.pax;

  sheetEl.innerHTML =
    '<h3>Villa ' + r.villa + '</h3>' +
    '<div class="gd">' + esc(nameOf(r.stay)) +
      /* The Mews reservation number, so anyone can cross-check this booking
         against the PMS without opening it. The GUID is the key, but nobody
         can read a GUID out over the phone. */
      (r.stay.number ? '<span class="gd-sub">Mews ' + esc(r.stay.number) + '</span>' : '') +
      '<span class="gd-sub">' + stayLabel(r.stay) +
        (r.stay.adults ? ' \u00b7 ' + r.stay.adults +
          (Number(r.stay.adults)===1?' adult':' adults') : '') +
      '</span></div>' +
    (etaLabel(p) ? '<div class="note-box">Told us they would arrive ' +
       esc(etaLabel(p).toLowerCase()) + '.</div>' : '') +
    (hasForm(p) ? '' : startedForm(p) ?
      '<div class="note-box">' + esc(startedNote(p, r.stay)) + '</div>' :
      '<div class="note-box">No pre-arrival form. Fill it in together.</div>') +

    /* The arrival time. The guest's form has always asked it and the desk
       could only read it back: there was no way to set it for a guest with no
       form, and no way to correct one who rang ahead to say they were running
       late. Same slots, same words, so reception and guest are answering the
       same question. */
    /* Who else is coming. For a booking of more than one, and the desk
       always gets the field even when Mews knows the name, because reception
       is the one who corrects it. Also whenever a name is already held: a
       booking Mews says is one adult can still carry a companion, and a name
       the desk cannot see is a name the desk cannot fix. */
    (Number(r.stay.adults) >= 2 || a.companion
      ? '<div class="sheet-label">Guest travelling with them</div>' +
        '<input class="txt" id="fCompanion" type="text" placeholder="Their name" autocomplete="off">'
      : '') +

    /* The booking flags: the facts that used to be typed into a note on
       every such booking. The list an admin defines on Flag Settings, a tick
       each, admin only - ticking a flag is a statement about the booking's
       standing, so it is fenced like the flag list itself. Everyone still
       sees the result in the summary and on the printed sheet. The one
       automatic flag is said in words, not offered as a chip: Luxury Escapes
       rides on the Mews rate and a tick could not turn it off. */
    (canFlags() ?
      '<div class="sheet-label">Booking flags</div>' +
      '<div class="chips rail" id="fkChips"></div>' +
      (rateFlagLabel(r.pms)
        ? '<div class="flag-src">Luxury Escapes - automatic, from the Mews rate</div>' : '')
      : '') +

    /* The internal note. Management only, both to read and to write, and it
       lives at /internal rather than under the booking because /bookings is
       readable by anybody holding a pre-arrival link. It is the one note a
       guest must never see, so it is the one that cannot live where the guest
       form can reach it. See NOTES-AUDIT.md. */
    (canInternal() ?
      '<div class="sheet-label">Staff notes, never shown to the guest</div>' +
      '<textarea class="txt" id="fInternal" rows="2" placeholder="For staff. The guest cannot see this."></textarea>'
      : '') +

    '<div class="sheet-label">Arriving</div>' +
    '<div class="chips rail" id="eChips"></div>' +
    '<div class="sheet-label" id="fEtaNoteLab" style="display:none">Arrival notes</div>' +
    '<input class="txt" id="fEtaNote" type="text" placeholder="Flight, ferry, anything to note" autocomplete="off" style="display:none">' +

    /* The guest asks, reception decides - but only where the slot track
       cannot already say it, the owner's ruling of 27 Aug. The early hours
       are deliberately not on the guest's form: offering 11am there would
       read as an invitation the resort then declines. Here they are
       reception's to give, so an early hour on the cleans board is
       authoritative: a person agreed to it. The hours behind "after 5pm"
       are the other case the slots cannot express, pinned rather than
       approved. Every hour in between IS a slot, so correcting it is
       tapping the slot above, and this row stays hidden. No guard against
       approving before the current guest departs, considered and declined
       by the owner: the red tile it causes is the prompt to chase the
       departure. */
    '<div class="sheet-label" id="apLab" style="display:none"></div>' +
    '<div class="chips rail" id="apChips" style="display:none"></div>' +

    '<div class="sheet-label">Dining on arrival night</div>' +
    '<div class="seg" id="diningSeg">' +
      '<button id="sDin">Dining</button>' +
      '<button id="sOut">Not dining</button>' +
    '</div>' +
    '<div class="miss-note" id="sMiss"></div>' +
    '<div id="paxWrap"><div class="sheet-label">Guests at dinner</div>' +
      '<div class="pax-row rail" id="paxRow"></div></div>' +

    '<div class="sheet-label">Dietary requirements</div>' +
    '<div class="chips rail" id="dChips"></div>' +
    '<div class="chips rail" id="dNone"></div>' +
    '<input class="txt" id="fDnote" type="text" placeholder="Dietary notes" autocomplete="off">' +

    '<div class="sheet-label">Purpose of visit</div>' +
    '<div class="chips rail" id="pChips"></div>' +

    '<div class="sheet-label">How they plan to dine</div>' +
    '<div class="chips rail" id="aChips"></div>' +

    '<div class="sheet-label">Special occasion</div>' +
    '<input class="txt" id="fOcc" type="text" placeholder="Birthday, anniversary" autocomplete="off">' +

    '<div class="sheet-label">Wellness or massage</div>' +
    '<div class="seg">' +
      '<button id="wYes">Interested</button>' +
      '<button id="wNo">Not interested</button>' +
    '</div>' +
    '<div id="wWrap">' +
      '<div class="sheet-label">Preferred day</div>' +
      '<div class="chips rail" id="wDays"></div>' +
      '<select class="txt" id="fWtime" aria-label="Preferred time" style="margin-top:8px"></select>' +
      '<div class="chips rail" id="fWqty" style="margin-top:8px"></div>' +
      '<div class="sheet-label" id="fWdurLab" style="display:none">First massage</div>' +
      '<select class="txt" id="fWdur" aria-label="Massage length" style="margin-top:8px"></select>' +
      '<div class="sheet-label" id="fWdur2Lab" style="display:none">Second massage</div>' +
      '<select class="txt" id="fWdur2" aria-label="Second massage length" style="margin-top:8px;display:none"></select>' +
    '</div>' +

    '<div class="sheet-label">Booking notes</div>' +
    '<input class="txt" id="fNote" type="text" placeholder="Preferences, requests" autocomplete="off">' +

    /* Save, not a second Confirm arriving. Renamed by the owner, 26 Aug,
       after the old wording did what it said: a sheet opened, changed
       nowhere and "confirmed" saved decisions nobody had made. Saving
       writes what is on the sheet and decides nothing; confirming is the
       summary's button, and checking in is the one below. */
    /* The state button, the owner's model of 28 Aug: Save writes answers and
       decides nothing, and THIS is the only control that moves a booking
       between incomplete and completed. It takes the solid slot because it is
       now the primary constructive action here; check in steps down to quiet,
       since at most one surface may wear solid (the button law) and checking
       a guest in is an arrival fact, not a decision about the form.

       It is a toggle, so its dress changes with it: solid to complete,
       terracotta outline to walk it back, and the walk-back confirms. */
    '<button class="opt" id="sMark" style="margin-top:18px"></button>' +
    '<div class="opt-why" id="sMarkWhy" style="display:none"></div>' +
    '<button class="opt quiet" id="sCheckin">Confirm and check in</button>' +
    '<button class="opt is-primary" id="sConfirm">Save</button>' +
    '<button class="opt quiet" id="sClose">Close</button>';

  document.getElementById('fDnote').value  = a.dnote;
  document.getElementById('fOcc').value    = a.occasion;
  document.getElementById('fNote').value   = a.note;
  /* A slot, not free text, since 25 Aug: the Spa board opens on the asked
     time, and a wish typed as words gave it nothing to open on. SPA_SLOTS
     is the one list; the stored value is the label every screen prints. A
     record from before the change keeps its words as one extra option, so
     reopening a card never silently wipes what the guest said. */
  (function(){
    var sel = document.getElementById('fWtime');
    var o = document.createElement('option');
    o.value = ''; o.textContent = 'Preferred time';
    sel.appendChild(o);
    SPA_SLOTS.forEach(function(t){
      var x = document.createElement('option');
      x.value = spaSlotLabel(t); x.textContent = spaSlotLabel(t);
      sel.appendChild(x);
    });
    if (a.wellTime && !spaSlotFromText(a.wellTime)){
      var lg = document.createElement('option');
      lg.value = a.wellTime; lg.textContent = a.wellTime;
      sel.appendChild(lg);
    }
    sel.value = spaSlotFromText(a.wellTime)
      ? spaSlotLabel(spaSlotFromText(a.wellTime)) : (a.wellTime || '');
  })();
  /* How many and how long, the same terms the guest form offers, from the
     one shared list. */
  function paintWellDurs(){
    ['fWdur', 'fWdur2'].forEach(function(id, i){
      var d = document.getElementById(id);
      d.innerHTML = '';
      SPA_DURS.forEach(function(x){
        var o = document.createElement('option');
        o.value = String(x.m);
        o.textContent = x.label;
        d.appendChild(o);
      });
      d.value = String(i === 0 ? a.wellDur : a.wellDur2);
    });
    var two = a.wellQty === 2;
    ['fWdur2', 'fWdurLab', 'fWdur2Lab'].forEach(function(id){
      document.getElementById(id).style.display = two ? '' : 'none';
    });
    repaintRow('fWqty', function(qbox){
      [1, 2].forEach(function(n){
        var b = document.createElement('button');
        b.className = 'chip' + (a.wellQty === n ? ' on' : '');
        b.textContent = n === 1 ? 'One massage' : 'Two massages';
        b.onclick = function(){ a.wellQty = n; paintWellDurs(); };
        qbox.appendChild(b);
      });
    });
  }
  paintWellDurs();

  function paintDining(){
    document.getElementById('sDin').className = a.dining === true  ? 'on'
      : (held.dining === true  && lost(a.dining, held.dining)  ? 'was' : '');
    document.getElementById('sOut').className = a.dining === false ? 'on'
      : (held.dining === false && lost(a.dining, held.dining)  ? 'was' : '');
    /* Covers only mean something if they are eating. */
    var pw = document.getElementById('paxWrap');
    var was = pw.style.display;
    pw.style.display = a.dining === true ? '' : 'none';
    /* Just revealed: its rail could not measure itself until now. */
    if (was === 'none' && pw.style.display === '') centreRails(pw);
  }
  /* Toggled, never assigned. These three elements carry a dress declared in
     the markup - `chips rail` on the dietary row - and rebuilding the whole
     class from a literal here silently undressed it: the row wrapped again
     the first time somebody answered a dietary, and only then. The miss mark
     is a state laid ON the dress, so it is added and removed as one class
     and the markup stays the one place a row's dress is decided. */
  function setMiss(el, on){ if (el) el.classList.toggle('miss', !!on); }
  function clearMiss(){
    document.getElementById('sMiss').classList.remove('show');
    setMiss(document.getElementById('diningSeg'), false);
    setMiss(document.getElementById('dChips'), false);
    /* And the note. flagMissing marks it for the Other-with-no-note refusal
       and nothing ever took the mark off again, so putting the answer right
       left the field looking wrong until the sheet was closed and reopened.
       It went unnoticed while check in refused for two other reasons as well;
       since 28 Aug this is the only refusal left, so it is the one mark
       anybody sees. */
    setMiss(document.getElementById('fDnote'), false);
  }
  /* Tapping the chosen answer again clears it, the way back every chip on
     this sheet already gives. Ruled by the owner, 26 Aug: every answer must
     be undoable, or a mis-tap can never be reverted to "nobody asked" - the
     only honest state for a question without an answer. */
  document.getElementById('sDin').onclick = function(){
    a.dining = (a.dining === true)  ? null : true;  clearMiss(); paintDining(); };
  document.getElementById('sOut').onclick = function(){
    a.dining = (a.dining === false) ? null : false; clearMiss(); paintDining(); };

  function paintPax(){
    repaintRow('paxRow', function(box){
      for (var i=1;i<=8;i++)(function(v){
        var b = document.createElement('button');
        b.className = 'pax' + (pax===v ? ' on' : ''); b.textContent = v;
        b.onclick = function(){ pax = v; paintPax(); };
        box.appendChild(b);
      })(i);
    });
  }

  function paintDiets(){
    repaintRow('dChips', function(box){
      DIETARIES.forEach(function(d){
        var b = document.createElement('button');
        b.className = 'chip' + (a.diets.indexOf(d)>-1 ? ' on'
          : (held.diets.indexOf(d) > -1 ? ' was' : '')); b.textContent = d;
        b.onclick = function(){
          var i = a.diets.indexOf(d);
          if (i>-1) a.diets.splice(i,1); else { a.diets.push(d); a.noDiets = false; }
          clearMiss(); paintDiets(); paintNone();
        };
        box.appendChild(b);
      });
    });
  }
  /* "None to declare" is a positive answer, not the absence of one. Without
     it, a guest who genuinely has no allergies is indistinguishable from one
     nobody asked, which is the whole reason reception is going through this.

     "Other" sits beside it because they are the two answers that are not on
     the list above, and they are opposites: one says there is nothing to
     write down, the other says the answer is only in the note. Choosing
     either clears the other. */
  function paintNone(){
    repaintRow('dNone', function(box){

    var none = document.createElement('button');
    none.className = 'chip' + (a.noDiets ? ' on' : '');
    none.textContent = 'No allergies to declare';
    none.onclick = function(){
      a.noDiets = !a.noDiets;
      if (a.noDiets) a.diets = [];
      clearMiss(); paintDiets(); paintNone();
    };
    box.appendChild(none);

    var other = document.createElement('button');
    other.className = 'chip' + (hasOther() ? ' on' : '');
    other.textContent = DIET_OTHER;
    other.onclick = function(){
      var i = a.diets.indexOf(DIET_OTHER);
      if (i > -1) a.diets.splice(i, 1);
      else { a.diets.push(DIET_OTHER); a.noDiets = false; }
      clearMiss(); paintDiets(); paintNone();
      /* The note IS the answer when this is on, so put the cursor in it
         rather than leaving somebody to find it. */
      if (hasOther()) { var f = document.getElementById('fDnote'); if (f) f.focus(); }
    };
    box.appendChild(other);
    });
  }
  function hasOther(){ return a.diets.indexOf(DIET_OTHER) > -1; }

  /* Tapping the chosen slot again clears it, because "we did ask and they did
     not know" is a real answer and there has to be a way back to it. */
  function paintEta(){
    var wantsNote = false;
    repaintRow('eChips', function(box){
      ETA_SLOTS.forEach(function(sl){
        var b = document.createElement('button');
        b.className = 'chip' + (a.arriveSlot === sl[0] ? ' on'
          : (held.arriveSlot === sl[0] && lost(a.arriveSlot, held.arriveSlot) ? ' was' : ''));
        b.textContent = sl[1];
        b.onclick = function(){
          a.arriveSlot = (a.arriveSlot === sl[0]) ? '' : sl[0];
          paintEta();
        };
        box.appendChild(b);
        if (a.arriveSlot === sl[0] && sl[3]) wantsNote = true;
      });
    });
    /* The note only appears for the two open ended slots, which is where the
       guest's form asks for it too: before 2pm and after 5pm are the ones that
       need a time attached to be worth anything. */
    var note = document.getElementById('fEtaNote');
    note.style.display = wantsNote ? '' : 'none';
    var lab = document.getElementById('fEtaNoteLab');
    if (lab) lab.style.display = wantsNote ? '' : 'none';
    if (!wantsNote) note.value = '';
    /* The hours reception may set depend on the slot, so the row below
       follows every slot change. Hoisted, so the first paint finds it. */
    paintApproved();
  }

  /* Only the hours the slot track cannot already say, the owner's ruling of
     27 Aug. This row offered every half hour 11am to 11pm and was a wall of
     twenty five chips with six real jobs: a guest who rang to move 4pm to
     half three is corrected by tapping 3:30pm on the slots above, so the
     mid-afternoon here was nineteen chips restating that row.

       before2  the early hours only reception can grant: 11am to 1:30pm,
                because 2pm is the standing promise and needs nobody's leave
       after5   the actual hour behind an open-ended answer: 5:30pm to 11pm,
                pinned for whoever waits at the desk
       else     nothing, and the row hides entirely

     A stored hour outside today's offer is still painted, selected - the
     purpose-chip lesson: a record from the wide-open days, or an approval
     whose slot has since changed, must never be silently dropped by the next
     save. Halves throughout; 14.5 was already legal in the rules. Tapping
     the chosen time again clears it, the same way back the slot chips give,
     and clearing leaves the guest's own slot untouched. */
  function approvedOffer(){
    var out = [], h;
    if (a.arriveSlot === 'before2') for (h = 11;   h <  14; h += 0.5) out.push(h);
    if (a.arriveSlot === 'after5')  for (h = 17.5; h <= 23; h += 0.5) out.push(h);
    if (typeof a.arriveApproved === 'number' && out.indexOf(a.arriveApproved) === -1)
      out.push(a.arriveApproved);
    return out.sort(function(x, y){ return x - y; });
  }
  function paintApproved(){
    var box = document.getElementById('apChips');
    var lab = document.getElementById('apLab');
    var offer = approvedOffer();
    box.style.display = offer.length ? '' : 'none';
    lab.style.display = offer.length ? '' : 'none';
    lab.textContent = a.arriveSlot === 'before2'
                        ? 'Early arrival, approved by reception'
                    : a.arriveSlot === 'after5'
                        ? 'Arriving at, as the guest told us'
                        : 'Approved arrival, kept from an earlier save';
    repaintRow('apChips', function(box){
      offer.forEach(function(hr){
        var b = document.createElement('button');
        var w = Math.floor(hr);
