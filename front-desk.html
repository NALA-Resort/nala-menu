        b.className = 'chip' + (a.arriveApproved === hr ? ' on' : '');
        b.textContent = (w > 12 ? w - 12 : w) + (hr % 1 ? ':30' : '') +
                        (w < 12 ? 'am' : 'pm');
        b.onclick = function(){
          a.arriveApproved = (a.arriveApproved === hr) ? null : hr;
          paintApproved();
        };
        box.appendChild(b);
      });
    });
  }

  function paintPurpose(){
    repaintRow('pChips', function(box){
      /* A record may hold a label from before the 23 Aug vocabulary. It is
         painted anyway, selected: invisible would mean the next save from
         here drops the guest's answer, which is the exact bug this suite's
         fixture remembers. Tapping a current label replaces it. */
      var offered = PURPOSE.concat(a.purpose.filter(function(t){
        return PURPOSE.indexOf(t) === -1; }));
      offered.forEach(function(t){
        var b = document.createElement('button');
        b.className = 'chip' + (a.purpose.indexOf(t)>-1 ? ' on'
          : (held.purpose.indexOf(t) > -1 ? ' was' : '')); b.textContent = t;
        b.onclick = function(){
          /* One answer replaces another; tapping it again clears it, the way
             back every desk chip gives. */
          a.purpose = (a.purpose.indexOf(t) > -1) ? [] : [t];
          paintPurpose();
        };
        box.appendChild(b);
      });
    });
  }
  function paintApproach(){
    repaintRow('aChips', function(box){
      var offered = APPROACH.slice();
      if (a.approach && APPROACH_OLD[a.approach])
        offered.push([a.approach, APPROACH_OLD[a.approach]]);
      offered.forEach(function(pair){
        var b = document.createElement('button');
        b.className = 'chip' + (a.approach===pair[0] ? ' on'
          : (held.approach === pair[0] && lost(a.approach, held.approach) ? ' was' : ''));
        b.textContent = pair[1];
        b.onclick = function(){ a.approach = (a.approach===pair[0] ? '' : pair[0]); paintApproach(); };
        box.appendChild(b);
      });
    });
  }
  /* Only the nights they are actually here. Offering a day outside the stay is
     an appointment nobody can keep. Arrival and departure days are included:
     a treatment on the afternoon of arrival or the morning of departure is
     normal, and excluding them would be the app deciding for the spa. */
  function stayDays(){
    var out = [], a1 = parseDepDate(dkeyOf(r.stay.arrive)),
                  b1 = parseDepDate(dkeyOf(r.stay.depart));
    if (!a1 || !b1) return out;
    var D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for (var d = new Date(a1); d <= b1 && out.length < 30; d.setDate(d.getDate()+1))
      out.push({ key: dkey(d), label: D[d.getDay()] + ' ' + d.getDate() });
    return out;
  }
  function paintWellness(){
    document.getElementById('wYes').className = a.wellness === true  ? 'on'
      : (held.wellness === true  && lost(a.wellness, held.wellness) ? 'was' : '');
    document.getElementById('wNo').className  = a.wellness === false ? 'on'
      : (held.wellness === false && lost(a.wellness, held.wellness) ? 'was' : '');
    /* A day and a time only mean something once they have said yes. */
    var ww = document.getElementById('wWrap');
    var wasHidden = ww.style.display === 'none';
    ww.style.display = a.wellness === true ? '' : 'none';
    repaintRow('wDays', function(box){
      stayDays().forEach(function(d){
        var b = document.createElement('button');
        b.className = 'chip' + (a.wellDay === d.key ? ' on'
          : (held.wellDay === d.key && lost(a.wellDay, held.wellDay) ? ' was' : ''));
        b.textContent = d.label;
        b.onclick = function(){ a.wellDay = (a.wellDay === d.key ? '' : d.key); paintWellness(); };
        box.appendChild(b);
      });
    });
    /* Just revealed: its rails could not measure themselves until now. */
    if (wasHidden && ww.style.display === '') centreRails(ww);
  }
  /* Same way back as the dining segment: tapping the chosen answer again
     un-asks the question. */
  document.getElementById('wYes').onclick = function(){
    a.wellness = (a.wellness === true)  ? null : true;  paintWellness(); };
  document.getElementById('wNo').onclick  = function(){
    a.wellness = (a.wellness === false) ? null : false; paintWellness(); };

  /* The flag chips: the admin's list from Flag Settings, plus any name this
     booking already carries that the list no longer offers - painted anyway,
     selected, so a flag hidden or deleted in Settings is not silently
     dropped by the next save. The purpose-chip lesson. Toggled here and only written on
     save, like every other answer on this sheet, so Close still discards. */
  var flags = ((r.bf && r.bf.flags) || []).slice();
  function paintFlags(){
    repaintRow('fkChips', function(box){
      var offered = FLAGLIST.concat(flags.filter(function(t){
        return FLAGLIST.indexOf(t) === -1; }));
      if (!offered.length){
        var d = document.createElement('div');
        d.className = 'flag-src';
        d.textContent = 'No flags defined yet. Add them under Settings, Flags.';
        box.appendChild(d);
        return;
      }
      offered.forEach(function(t){
        var b = document.createElement('button');
        b.className = 'chip' + (flags.indexOf(t) > -1 ? ' on' : '');
        b.textContent = t;
        b.onclick = function(){
          var i = flags.indexOf(t);
          if (i > -1) flags.splice(i, 1); else flags.push(t);
          paintFlags();
        };
        box.appendChild(b);
      });
    });
  }

  paintEta(); paintApproved(); paintDining(); paintPax(); paintDiets(); paintNone();
  paintPurpose(); paintApproach(); paintWellness(); paintFlags();
  document.getElementById('fEtaNote').value = a.arriveNote || '';
  var cEl = document.getElementById('fCompanion');
  if (cEl) cEl.value = a.companion || '';

  /* Fetched when the sheet opens rather than with the board: it is one guest's
     note, wanted by one person, and pulling it for every arrival on every
     render would be a request an hour for something nobody had asked to see. */
  var iEl = document.getElementById('fInternal');
  if (iEl){
    iEl.value = '';
    api('/internal/' + r.stay.id)
      .then(function(rec){
        rec = rec || {};
        /* The edited note if there is one, otherwise what Mews said. The
           original is kept in its own field so it is still there after
           somebody rewrites it.

           Tested for PRESENCE, not for truth. `rec.note || rec.fromMews` read
           a note deliberately emptied as a note never written, so clearing the
           box saved an empty string, the Mews original came back in its place,
           and the only way to make a note go away was to leave a character in
           it. An empty edited note is an answer: somebody decided this booking
           needs no note, and that decision outranks what Mews sent. */
        iEl.value = (rec.note === undefined || rec.note === null)
                      ? (rec.fromMews || '') : rec.note;
        iEl.dataset.was = iEl.value;
      })
      .catch(function(){});
  }
  paintEta();   /* again, so the note shows if the slot they chose wants one */

  document.getElementById('sClose').onclick = closeSheet;
  /* Both buttons read the sheet the same way. Save keeps what is on it and
     nothing more; Confirm and check in also stamps the record, because the
     guest is standing there agreeing to it. */
  function finish(arrived, mark){
    /* Read before checking, not after. The note is part of the answer when
       Other is chosen, and a check that runs before the field is read is
       checking the value from the last time the sheet was opened. */
    a.dnote = document.getElementById('fDnote').value.trim();
    a.arriveNote = document.getElementById('fEtaNote').value.trim();
    var cf = document.getElementById('fCompanion');
    a.companion = cf ? cf.value.trim() : (a.companion || '');

    /* Other with an empty note is not an incomplete answer, it is a wrong
       one: it tells the kitchen there is something to know and never says
       what. The only check that survives a save, because it is about an
       answer being wrong rather than missing.

       Check in used to demand dining and dietary here. It does not any more:
       the owner ruled 28 Aug that checking a guest in is a visual move of the
       tile, and a control that refuses is not a visual move. What that guard
       protected - a guest sent to their villa with the kitchen never hearing
       about the cover - is now the row's own colour, amber until the mandatory
       answers are in, and the gate on Mark as completed. */
    if (hasOther() && !a.dnote) return flagMissing(['othernote']);

    a.pax      = pax;
    a.occasion = document.getElementById('fOcc').value.trim();
    a.note     = document.getElementById('fNote').value.trim();
    a.wellTime = document.getElementById('fWtime').value.trim();
    a.wellDur = +document.getElementById('fWdur').value || 60;
    a.wellDur2 = +document.getElementById('fWdur2').value || 60;
    /* Handed to save() on the row rather than read from the sheet there,
       because save() also runs from the summary buttons with no sheet on
       screen. A leftover copy from an earlier save of this row is harmless:
       it matches what was stored, so the changed-test below skips it. Only
       an admin's sheet carries the chips, so only an admin sets this. */
    if (canFlags()) r._flags = flags;
    /* Marking completed cannot outrun the answers, even if something calls
       this past the disabled button. */
    if (mark === 'completed' &&
        !mandatoryAnswered(Object.assign({}, r.pre || {}, sheetAnswers(a)),
                           r.stay)){
      var m2 = [];
      if (a.dining === null) m2.push('dining');
      if (!a.noDiets && !a.diets.length) m2.push('dietary');
      return flagMissing(m2.length ? m2 : ['dining']);
    }
    /* Only check in confirms. Save is the third argument's false twice over:
       it neither checks in nor stamps anything. The fifth argument is the
       state, and it is the ONLY thing that moves it. */
    save(r, a, arrived, mark);
  }
  document.getElementById('sConfirm').onclick = function(){ finish(null, null); };
  /* The same toggle as the summary's, so the two surfaces cannot disagree
     about what pressing it does. */
  document.getElementById('sCheckin').textContent =
    isArrived(r.pre) ? 'Checked in \u00b7 tap to undo' : 'Confirm and check in';
  document.getElementById('sCheckin').onclick = function(){
    finish(!isArrived(r.pre), null); };

  /* The state control. Repainted from the sheet's own answers rather than the
     stored record, so ticking the last mandatory answer makes it available
     under the finger, without a save in between. */
  function paintMark(){
    var b = document.getElementById('sMark');
    var why = document.getElementById('sMarkWhy');
    if (!b) return;
    /* What the record WOULD hold if this sheet were saved now. */
    var asShown = Object.assign({}, r.pre || {}, sheetAnswers(a));
    var done = formState(r.pre, r.stay) === 'completed';
    var can  = mandatoryAnswered(asShown, r.stay);
    b.textContent = done ? 'Mark as incomplete' : 'Mark as completed';
    b.className = 'opt' + (done ? ' terra' : ' solid');
    b.disabled = !done && !can;
    if (b.disabled){
      var miss = missingAnswers(asShown, r.stay).filter(function(l){
        return l === 'whether they are dining' || l === 'dietaries' ||
               l === 'treatments';
      });
      why.textContent = miss.length
        ? 'Answer ' + andList(miss) + ' before this can be marked completed.'
        : 'Some answers are still missing.';
      why.style.display = '';
    } else {
      why.textContent = ''; why.style.display = 'none';
    }
  }
  paintMark();
  /* The answers are painted by six different functions and a chip row builds
     its buttons fresh each time, so threading a paintMark into each is how
     one of them comes to be missed. One listener on the sheet, after the
     handler that was tapped has run, catches every one of them. */
  sheetEl.addEventListener('click', function(){ setTimeout(paintMark, 0); });
  document.getElementById('sMark').onclick = function(){
    var done = formState(r.pre, r.stay) === 'completed';
    /* The walk-back confirms, the button law. Marking complete does not:
       a constructive button that needs a warning has the wrong label. */
    if (done && !confirm('Mark ' + nameOf(r.stay) +
        '\u2019s pre-arrival form incomplete? The link can be sent to them ' +
        'again from Pre-arrival SMS.')) return;
    finish(null, done ? 'incomplete' : 'completed');
  };

  /* Name what is missing and put it on screen, rather than a button that does
     nothing when pressed. */
  function flagMissing(which){
    var seg = document.getElementById('diningSeg');
    var chips = document.getElementById('dChips');
    /* Toggled rather than rebuilt, for setMiss's reason above. */
    setMiss(seg,   which.indexOf('dining') > -1);
    setMiss(chips, which.indexOf('dietary') > -1);
    var note = document.getElementById('fDnote');
    setMiss(note,  which.indexOf('othernote') > -1);
    var el = document.getElementById('sMiss');
    el.textContent = which.length === 2
      ? 'Ask about dinner and dietaries before confirming.'
      : which[0] === 'dining' ? 'Ask whether they are dining tonight.'
      : which[0] === 'othernote' ? 'Write the allergy in the notes, or it reaches nobody.'
      : 'Ask about dietaries, even to rule them out.';
    el.classList.add('show');
    (which.indexOf('dining') > -1 ? seg
       : which.indexOf('othernote') > -1 ? (note || chips) : chips)
      .scrollIntoView({ block:'center', behavior:'smooth' });
    if (which.indexOf('othernote') > -1 && note) note.focus();
  }
  showSheet();
  centreRails();
}

/* Writes the guest's own node, whoever typed it. No record of who filled it
   in: the chef reads one thing and does not care.

   PATCH rather than PUT, so a field this screen does not carry is left alone
   rather than deleted. `at` is set only if the form had never been started,
   so it keeps meaning "when the answers first existed". */
/* The one dinner cell, at /dinner/<date>/<villa>. Confirming at the desk IS
   the dinner reservation: there is no separate staff record and no bridge
   between two nodes, because there is only one node.

   Written to the date being viewed, which is the night they arrive. The
   nightly dinner request never goes out for an arrival night, since guests
   check in after 2pm, so nothing else will ever put them on that board.

   `by: 'staff'` is what stops a guest overwriting it afterwards. Whoever
   answers first sets the cell, and after that only staff can change it. */
function dinnerCell(r, a){
  var rec = {
    status:    a.dining ? 'in' : 'out',
    pax:       a.dining ? a.pax : 0,
    room:      String(r.villa),
    bookingId: r.stay.id,
    by:        'staff',
    at:        new Date().toISOString(),
    diets:     a.noDiets ? [] : a.diets,
    dnote:     a.noDiets ? '' : a.dnote,
    /* The answer itself, under the name the cell already uses (the guest
       page writes it, rules.json validates it). The cell outranks the
       booking when the sheet reads back, so an answer the cell does not
       carry is an answer the next open loses. */
    nodiet:    !!a.noDiets,
    note:      a.note || ''
  };
  /* Only when the PMS knows about this villa, so an unstamped vacant is not
     read as stale on the next render. */
  var kn = r.pre && r.stay.id ? r.stay : null;
  if (kn) rec.pmsUpdated = r.stay.updated || null;
  return rec;
}

/* `confirm` is what separates the sheet's Save from the two confirming
   buttons. Save writes the sheet as it stands and decides nothing; confirm
   and check in also stamp the record. The split exists because of the bug of
   26 Aug: the sheet's old Confirm arriving wrote dining:null and
   wellness:null for questions nobody had asked, the optimistic merge below
   read null as false, and a sheet opened and saved untouched came back with
   Not dining and Not interested selected - decisions nobody made. */
function save(r, a, arrived, mark){
  var payload = {
    diets: a.diets, dnote: a.dnote,
    arriveSlot: a.arriveSlot, arriveNote: a.arriveNote,
    /* null, not omission: a PATCH that leaves the key out cannot clear a
       previously approved hour, and null is how the clear reaches the
       database. */
    arriveApproved: (typeof a.arriveApproved === 'number' ? a.arriveApproved : null),
    purpose: purposeText(a.purpose), approach: a.approach,
    occasion: a.occasion, companion: a.companion,
    note: a.note
  };
  /* Only answers somebody actually gave. dining and wellness are null until
     asked, and null is not an answer: written for a guest nobody asked, it
     comes back through answersOf as false, which is how an untouched sheet
     grew a Not dining and a Not interested nobody chose. Omitted, the PATCH
     leaves the questions unanswered, which is what they are.

     But null IS written when the record already holds an answer, because
     since 26 Aug the segments un-answer: tapping the chosen side again is
     the way back from a mis-tap, and an omitted key cannot clear a stored
     true - the arriveApproved lesson. Null through a PATCH deletes the key,
     which puts the question back to "nobody asked". */
  var stored = r.pre || {};
  if (a.dining !== null){
    payload.dining = a.dining;
    payload.pax = a.dining ? a.pax : 0;
  } else if (stored.dining !== undefined && stored.dining !== null){
    payload.dining = null;
    payload.pax = null;
  }
  if (a.wellness !== null){
    payload.wellness = a.wellness;
    payload.wellDay = a.wellness ? a.wellDay : '';
    payload.wellTime = a.wellness ? a.wellTime : '';
    payload.wellQty = a.wellness ? a.wellQty : null;
    payload.wellDur = a.wellness ? a.wellDur : null;
    payload.wellDur2 = (a.wellness && a.wellQty === 2) ? a.wellDur2 : null;
  } else if (stored.wellness !== undefined && stored.wellness !== null){
    /* Un-answering takes the day, time and lengths with it: they only meant
       something while the answer stood. */
    payload.wellness = null;
    payload.wellDay = null; payload.wellTime = null;
    payload.wellQty = null; payload.wellDur = null; payload.wellDur2 = null;
  }
  /* noDiets true is an answer. noDiets false is only an answer when it is
     clearing a stored true or standing beside chosen dietaries; written for
     a guest nobody has asked, it stamps the question answered ("no" counts
     in GUEST_ANSWERS, deliberately) and paints an untouched row as started. */
  if (a.noDiets || a.diets.length || (r.pre && r.pre.noDiets !== undefined))
    payload.noDiets = a.noDiets;

  /* The stamp goes back with the last answer. `at` says the answers exist, so
     a record whose answers have all been taken back must not keep it - and it
     did: check in stamps `at` honestly (it refuses a blank sheet), but since
     26 Aug every answer can be un-answered, and nothing took the stamp with
     them. That is how villa 17 came to read Form completed on Pre-arrival SMS
     while holding nothing at all, with no way back from either board, 28 Aug.
     Null through the PATCH deletes the key, exactly as the answers above
     clear. */
  if (stored.at && !guestAnswered(Object.assign({}, stored, payload)))
    payload.at = null;

  /* The state, and the only thing that moves it. The owner's model of 28 Aug:
     editing and saving decide nothing, one control marks a form completed,
     the same control walks it back. `at` is where it lives - the guest's own
     Send has always written that field, so a form the guest finished and one
     the desk marked finished are the same fact, which is what they are. */
  if (mark === 'completed') payload.at = new Date().toISOString();
  else if (mark === 'incomplete') payload.at = null;

  /* Arrived, and nothing else. The owner's ruling of 28 Aug: checking a guest
     in is a visual move of the tile so reception can see who is here. It does
     not decide anything about the form, and it asks for nothing before it
     will move - a control that refuses is not a visual move.

     It is a toggle, which is where the undo lives now that Confirm arriving
     is gone: press it again and the guest goes back to Arriving. null means
     this save is not about arriving at all, so editing a checked-in guest's
     dietary cannot quietly un-arrive them.

     confirmedAt is no longer written by anything. It recorded that reception
     had been through the answers, and in the whole app nothing ever read it -
     isConfirmed was defined and never called. Values already in the database
     are left where they are; nothing reads those either.

     FUTURE: this is where the Mews reservation moves to Checked in, through
     the Connector API. Nothing writes back to Mews yet, so the app is the
     only record of it until that exists, and the undo will have to reverse
     that too rather than only the local field. */
  if (arrived === true) payload.checkedInAt = new Date().toISOString();
  else if (arrived === false) payload.checkedInAt = null;

  var before = r.pre, beforeCell = r.cell;
  r.pre  = Object.assign({}, r.pre || {}, payload);  /* optimistic */
  /* Only when there is a dining answer to show. Building the cell first and
     putting it back after would paint the guest as not dining for the frame
     between the two. Un-answering takes an existing cell WITH it: the cell
     can only say in or out, there is no third value, so the only honest
     board entry for "nobody knows any more" is no entry - the villa goes
     back to awaiting, which is what reverting a mistake means. */
  if (a.dining !== null) r.cell = dinnerCell(r, a);
  else if (beforeCell) r.cell = null;
  OPEN = null;
  /* The board still repaints at once - the desk reads it while the write is
     still in the air, and that has never been the part anybody waited for.
     What waits now is the SHEET: it holds until the write lands so its Save
     can say Saving and then Saved, and it closes on the way out. Closing it
     here, as this did until 27 Aug, took the only thing that could carry the
     answer off the screen a tenth of a second after the tap.
     The summary's own Confirm buttons live on the board, so this repaint
     replaces them and they keep answering the way they always have - by the
     row itself changing under the finger. */
  render();

  /* Both writes or neither. A confirmation the chef never sees is worse than
     one that visibly failed, so the guest is put back if either half is
     rejected rather than left looking confirmed on a board nobody else has. */
  /* No dining answer, no dinner cell. The cell has to say in or out, and there
     is no third value, so writing one for a guest nobody has asked yet would
     put them on the kitchen's board as not dining. That is a worse lie than
     silence: the board would show a decision nobody made. A partial save keeps
     everything else and leaves an unwritten cell unwritten; an un-answer of a
     cell that exists deletes it, for the same reason read the other way. */
  /* The internal note is its own write, to its own node, and deliberately not
     part of the both-or-neither pair below. It is management's private record
     and the guest's answers are the service's: a failure to save one must not
     roll back the other, and the note is never what the kitchen is waiting
     for. Only written when it changed, so opening a sheet and closing it does
     not stamp an edit nobody made. */
  var iNote = document.getElementById('fInternal');
  if (iNote && iNote.value.trim() !== (iNote.dataset.was || '').trim()){
    fetch(DB + '/internal/' + r.stay.id + '.json', {
      method: 'PATCH', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ note: iNote.value.trim(),
                             editedAt: new Date().toISOString(),
                             editedBy: window.NALA_ME || '' })
    }).catch(function(){});
  }

  /* The dietary onto the person as well as the booking. Quiet and outside the
     pair below for the same reason as the internal note: a mirror failing must
     not take tonight's answers with it. */
  rememberDietary(r.stay.id, payload.diets, payload.dnote);

  /* The booking flags, their own write to their own node and outside the
     both-or-neither pair: that pair is the guest's answers and the kitchen's
     cell, and a flag refused must not roll tonight's answers back. A PUT of
     the whole record, because the ticks ARE the record and the desk is its
     only writer. Skipped when nothing changed, so opening a sheet and
     confirming does not stamp an edit nobody made; a failure is SAID rather
     than swallowed, because a tick that silently failed reads forever after
     as a fact recorded. */
  if (r._flags){
    var was = JSON.stringify((r.bf && r.bf.flags) || []);
    if (JSON.stringify(r._flags) !== was){
      var bfBefore = r.bf;
      r.bf = { flags: r._flags.slice(),
               by: window.NALA_ME || '',
               at: new Date().toISOString() };          /* optimistic */
      fetch(DB + '/bookflags/' + r.stay.id + '.json', {
        method: 'PUT', headers: { 'Content-Type':'application/json' },
        body: JSON.stringify(r.bf)
      }).then(function(x){ if (!x.ok) throw new Error('flags'); })
        .catch(function(){
          r.bf = bfBefore;
          err('Could not save the booking flags. Everything else saved.');
        });
    }
  }

  var writes = [
    fetch(DB + '/bookings/' + r.stay.id + '/prearrival.json', {
      method: 'PATCH', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(payload)
    })
  ];
  if (a.dining !== null){
    writes.push(fetch(DB + '/dinner/' + nav.todayKey() + '/' + r.villa + '.json', {
      method: 'PUT', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(dinnerCell(r, a))
    }));
  } else if (beforeCell){
    /* The un-answer's other half. Inside the both-or-neither pair on
       purpose: a booking cleared while the cell stands would leave the
       kitchen acting on an answer the desk just took back. */
    writes.push(fetch(DB + '/dinner/' + nav.todayKey() + '/' + r.villa + '.json', {
      method: 'DELETE'
    }));
  }
  return saveFeedback(pressedButton(), function(){
    return Promise.all(writes).then(function(res){
      /* The STATUS goes into the error, not the bare word 'save'. The
         shared saveFailWords reads the message to tell a refusal - a
         permission, which needs the manager - from a write that never
         arrived, which needs another go; handed 'save' it could recognise
         neither, so a rules rejection at this desk read as "check the
         connection" and sent reception to the wrong remedy entirely. */
      var bad = res.filter(function(x){ return !x.ok; })[0];
      if (bad) throw new Error('save failed ' + bad.status);
    });
  }, {
    done:'Saved ✓', hold:400, then:closeSheet,
    fail:function(msg){
      if (!msg) return err('');          /* the clear, before the write */
      r.pre = before; r.cell = beforeCell;   /* put it back rather than lie */
      render();
      /* The reassurance is the half of this the desk actually acts on: a
         partial save would mean re-checking the record, and this was not
         one. */
      err(msg + ' Nothing was changed.');
    }
  });
}

function rowFor(v){
  return ROWS.filter(function(x){ return x.villa === v; })[0];
}

document.getElementById('board').addEventListener('click', function(e){
  var t = e.target;
  if (!t.closest) return;

  /* The pencil sits inside the row button, so it is claimed first: its tap
     edits the number and must not also open or close the summary. */
  var pen = t.closest('.pen');
  if (pen){
    var rowEl = pen.closest('.arr');
    var rp = rowEl && rowFor(rowEl.getAttribute('data-villa'));
    if (rp) fixNumber(rp);
    return;
  }

  /* Edit and Confirm inside an open summary. */
  var act = t.closest('.sum-btns button');
  if (act){
    var ra = rowFor(act.getAttribute('data-villa'));
    if (!ra) return;
    var what = act.getAttribute('data-act');
    if (what === 'edit') return openGuest(ra);
    /* Arrived, or not arrived. One fact, one button, and nothing else. */
    return save(ra, answersOf(ra), !isArrived(ra.pre), null);
  }

  var btn = t.closest('.arr');
  if (!btn) return;
  var r = rowFor(btn.getAttribute('data-villa'));
  if (!r) return;

  /* A guest who filled the form in gets it read back to them, and reception
     edits or checks in from there. A guest with nothing to read back goes
     straight to the form, because an empty summary says nothing.

     Deliberately still hasForm rather than the new formState: a booking that
     is incomplete only because one mandatory answer is missing still has
     answers worth reading back, and Mark as completed is one Edit away. */
  if (!hasForm(r.pre)) return openGuest(r);
  OPEN = (OPEN === r.villa) ? null : r.villa;
  render();
});

/* Only the boards this role may open. Sign out is never filtered. */
/* The shared filter, not a copy. Each of these pages carried its own with its
   own map, all written before nala-shared.js grew one, and none had been
   touched since: they knew nothing of Publish Menu, Dietary or the
   Notifications switch, and they hid whatever they did not recognise rather
   than leaving it alone. So those three vanished on exactly the pages that
   kept a copy and stayed on the pages that did not.

   One copy, and it leaves an unlisted link visible on purpose: a new page
   should be merely ungated until somebody says otherwise, not invisible until
   somebody remembers a second file. */
function navFilter(role){
  if (window.NALA_NAVFILTER) window.NALA_NAVFILTER(role);
}

function showAccess(allowed, e){
  var box = document.getElementById('noAccess');
  var on = !allowed;
  box.innerHTML = !on ? '' :
    (e ? '<div>Could not check access. This is usually the connection, '
       + 'not your login.</div>'
       + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
       : 'This login has no access to Front Desk Arrival. See the manager.');
  /* A role with a board of its own is sent there rather than shown a refusal.
     Only a login with no role at all gets the message. */
  if (on && !e){
    var home = homeFor(window.NALA_ROLE);
    if (home && home !== location.pathname.split('/').pop()){
      location.replace(home); return;
    }
  }
  box.className = 'noaccess' + (on ? ' show' : '');
  ['statsRow','board'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.style.display = on ? 'none' : '';
  });
  if (!on) load();
}

/* Who may see an internal note. Not can(), because there is no permission for
   it and inventing one would put a new row on the Settings grid for a thing
   nobody asked to delegate. Management is admin, manager and the legacy
   staff, as everywhere else on this page. */
function canInternal(){
  return window.NALA_ROLE === 'admin' || window.NALA_ROLE === 'manager' ||
         window.NALA_ROLE === 'staff';
}

/* Who may tick a booking flag. The owner's ruling, 26 Aug: admin only, a
   narrower gate than the staff note's - a manager reads the pills but does
   not set them. The legacy 'staff' role is the admin under its old name,
   which is what normaliseRole records. Not can(), for canInternal's reason:
   there is no permission for it and inventing one would put a row on the
   Settings grid for a thing nobody asked to delegate. */
function canFlags(){
  return normaliseRole(window.NALA_ROLE) === 'admin';
}

/* The active flag names from Flag Settings, loaded per date change. */
var FLAGLIST = [];

window.NALA_ROLE = null;
(function gate(){
  /* Wait for the helper too, not just firebase: a stubbed SDK calls back
     synchronously, and a partial SDK can arrive without onAuthStateChanged.
     auth() itself throws before an app is initialised, so it is guarded. */
  if (!window.firebase || !firebase.auth || typeof loadStaff !== 'function')
    return setTimeout(gate, 40);
  var A; try { A = firebase.auth(); } catch(e){ return setTimeout(gate, 40); }
  if (!A || !A.onAuthStateChanged) return setTimeout(gate, 40);
  A.onAuthStateChanged(function(u){
    if (!u) return;                 /* auth.js owns the signed-out state */
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role;
      window.NALA_USER = u;
      /* Who edited an internal note. Stored as the staff key, not the name, so
         a rename in Settings carries: the same lesson as the Cleans board. */
      window.NALA_ME   = staffKeyOf(u);
      document.getElementById('navWrap').style.display = 'block';
      navFilter(role);
      showAccess(can(role, 'editBookings'), e);
    });
  });
})();
</script>
