<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nala — Tonight's Menu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --cream: #F9F7F4; --ink: #1C1C1A; --mid: #999990; --rule: #E0E0DA; }

  html, body {
    width: 100%;
    min-height: 100%;
    background: var(--cream);
    font-family: Georgia, serif;
  }

  body { display: flex; justify-content: center; }

  .page {
    width: 100%;
    max-width: 440px;
    min-height: 100%;
    padding: 0 32px;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  header {
    text-align: center;
    padding: 5vh 0 2.5vh;
    border-bottom: 1px solid var(--rule);
  }

  .wordmark {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--mid);
  }

  #stateDefault {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 12px;
  }

  .soon { font-size: 18px; color: var(--ink); line-height: 1.5; }
  .note { font-style: italic; font-size: 12px; color: var(--mid); line-height: 1.6; }

  #stateMenu {
    display: none;
    flex-direction: column;
  }

  .menu-date {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.1em;
    color: var(--ink);
    text-align: center;
    text-transform: uppercase;
    padding: 1.5vh 0 0;
  }

  .spacer-top { flex: 2; }
  .spacer-mid { flex: 1; }
  .spacer-bot { flex: 2; }

  .course { text-align: center; }

  .course-label {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 7px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 3px;
  }

  .course-rule {
    width: 22px;
    height: 1px;
    background: var(--rule);
    margin: 3px auto 7px;
  }

  .dish-name {
    font-size: 18px;
    font-weight: normal;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .aus-tag {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 7px;
    color: var(--mid);
    vertical-align: super;
    margin-left: 3px;
  }

  .dish-desc {
    font-style: italic;
    font-size: 11px;
    color: var(--mid);
    line-height: 1.4;
  }

  footer {
    border-top: 1px solid var(--rule);
    text-align: center;
    padding: 2vh 0 4vh;
  }

  .pricing {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .pricing-note {
    font-style: italic;
    font-size: 10px;
    color: var(--mid);
  }

  /* ── RSVP ─────────────────────────────────────── */
  #rsvp { display: none; border-top: 1px solid var(--rule); padding: 3vh 0 4vh; }
  #rsvp.show { display: block; }

  .rsvp-greet {
    text-align: center;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 14px;
  }

  .rsvp-btns { display: flex; gap: 10px; }

  .rsvp-btn {
    flex: 1;
    padding: 13px 8px;
    border: 1px solid var(--rule);
    background: transparent;
    border-radius: 2px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .rsvp-btn.on { background: var(--ink); color: var(--cream); border-color: var(--ink); }

  .rsvp-detail { display: none; margin-top: 18px; }
  .rsvp-detail.show { display: block; }

  .field { margin-bottom: 16px; }

  .field-label {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 8px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 8px;
    text-align: center;
  }

  .pax-row { display: flex; gap: 6px; justify-content: center; }
  .pax {
    width: 38px; height: 38px;
    border: 1px solid var(--rule);
    background: transparent;
    border-radius: 50%;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .pax.on { background: var(--ink); color: var(--cream); border-color: var(--ink); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chip {
    padding: 7px 12px;
    border: 1px solid var(--rule);
    background: transparent;
    border-radius: 20px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 10px;
    color: var(--mid);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .chip.on { background: var(--ink); color: var(--cream); border-color: var(--ink); }

  .note-input {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--rule);
    background: transparent;
    border-radius: 2px;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 12px;
    color: var(--ink);
    resize: none;
  }
  .note-input::placeholder { color: var(--mid); }

  .save-btn {
    width: 100%;
    padding: 14px;
    margin-top: 6px;
    border: none;
    background: var(--ink);
    color: var(--cream);
    border-radius: 2px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .save-btn:disabled { opacity: 0.4; }

  .rsvp-status {
    text-align: center;
    font-style: italic;
    font-size: 12px;
    color: var(--mid);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="wordmark">Nala</div>
  </header>

  <div id="stateDefault">
    <div class="soon">Tonight's menu<br>coming soon</div>
    <div class="note">Our menu is updated daily. Please check back later.</div>
  </div>

  <div id="stateMenu">
    <div class="menu-date" id="menuDate"></div>
    <div class="spacer-top"></div>
    <div class="course">
      <div class="course-label">Bread</div>
      <div class="course-rule"></div>
      <div class="dish-name" id="breadName"></div>
      <div class="dish-desc" id="breadDesc"></div>
    </div>
    <div class="spacer-mid"></div>
    <div class="course">
      <div class="course-label">Entrée</div>
      <div class="course-rule"></div>
      <div class="dish-name" id="entreeName"></div>
      <div class="dish-desc" id="entreeDesc"></div>
    </div>
    <div class="spacer-mid"></div>
    <div class="course">
      <div class="course-label">Main</div>
      <div class="course-rule"></div>
      <div class="dish-name" id="mainName"></div>
      <div class="dish-desc" id="mainDesc"></div>
    </div>
    <div class="spacer-mid"></div>
    <div class="course">
      <div class="course-label">Dessert</div>
      <div class="course-rule"></div>
      <div class="dish-name" id="dessertName"></div>
      <div class="dish-desc" id="dessertDesc"></div>
    </div>
    <div class="spacer-bot"></div>
  </div>


  <div id="rsvp">
    <div class="rsvp-greet" id="rsvpGreet"></div>
    <div id="rsvpChoice">
      <div class="rsvp-btns">
        <button class="rsvp-btn" id="btnIn">Dining tonight</button>
        <button class="rsvp-btn" id="btnOut">Not tonight</button>
      </div>
      <div class="rsvp-detail" id="rsvpDetail">
        <div class="field">
          <div class="field-label">Guests</div>
          <div class="pax-row" id="paxRow"></div>
        </div>
        <div class="field">
          <div class="field-label">Dietary requirements</div>
          <div class="chips" id="dietChips"></div>
        </div>
        <div class="field">
          <div class="field-label">Anything else</div>
          <textarea class="note-input" id="noteInput" rows="2" placeholder="Celebrating something, arriving late…"></textarea>
        </div>
        <button class="save-btn" id="saveBtn">Confirm</button>
      </div>
    </div>
    <div class="rsvp-status" id="rsvpStatus" style="display:none"></div>
  </div>

  <footer>
    <div class="pricing">2 courses $105 &nbsp;&nbsp; 3 courses $125</div>
    <div class="pricing-note">Bread course included with both options</div>
  </footer>

</div>

<script>
  function setHeight() {
    document.querySelector('.page').style.height = window.innerHeight + 'px';
  }
  setHeight();
  window.addEventListener('resize', setHeight);
  window.addEventListener('orientationchange', function(){ setTimeout(setHeight, 150); });

  function showMenu(data) {
    document.getElementById('stateDefault').style.display = 'none';
    var sm = document.getElementById('stateMenu');
    sm.style.display = 'flex';

    document.getElementById('menuDate').textContent = data.date;

    ['bread','entree','main','dessert'].forEach(function(c) {
      var nameEl = document.getElementById(c + 'Name');
      nameEl.textContent = data[c].name;
      if (data[c].aus) {
        var tag = document.createElement('span');
        tag.className = 'aus-tag';
        tag.textContent = '(AUS)';
        nameEl.appendChild(tag);
      }
      document.getElementById(c + 'Desc').textContent = data[c].desc;
    });
  }

  // ── ALL DISPLAY LOGIC LIVES HERE ──────────────────────────
  // menu.json contains ONLY the four courses.
  // Publish time comes from the file's Last-Modified header.
  //
  // States:
  //   1. Menu has content, written today   -> show menu
  //   2. Menu is empty ("remove menu")     -> placeholder
  //   3. Menu written before today         -> placeholder

  function hasContent(d) {
    return ['bread','entree','main','dessert'].every(function(k){
      return d[k] && d[k].name && d[k].name.trim() !== '';
    });
  }

  function stillValid(lastModified) {
    if (!lastModified) return false;
    var published = new Date(lastModified);
    var expiry = new Date(published);
    expiry.setHours(24, 0, 0, 0);        // midnight ending the publish day
    return new Date() < expiry;
  }

  function dateLabel(lastModified) {
    var d = new Date(lastModified);
    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['January','February','March','April','May','June','July',
                  'August','September','October','November','December'];
    return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  fetch('menu.json?v=' + Date.now())
    .then(function(r){
      var lm = r.headers.get('Last-Modified');
      return r.json().then(function(data){ return { data: data, lastModified: lm }; });
    })
    .then(function(res) {
      if (!hasContent(res.data)) return;          // empty -> placeholder, no RSVP
      if (!stillValid(res.lastModified)) return;  // stale -> placeholder, no RSVP
      res.data.date = dateLabel(res.lastModified);
      showMenu(res.data);
      initRSVP();   // RSVP only exists when there is a menu to dine from
    })
    .catch(function(e){ console.log('Menu load error:', e); });

  // ══ RSVP ═══════════════════════════════════════════════════
  var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
  var CUTOFF_HOUR = 12;
  var DIETARIES = ['Gluten free','Dairy free','Vegetarian','Vegan','Pescatarian',
                   'Nut allergy','Shellfish allergy','Egg allergy'];

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function pastCutoff() { return new Date().getHours() >= CUTOFF_HOUR; }

  var qs = new URLSearchParams(location.search);
  var G = {
    phone: (qs.get('p')||'').replace(/\D/g,''),
    room:  qs.get('r')||'',
    name:  qs.get('n')||''
  };

  var state = { status:null, pax:2, diets:[], note:'' };

  function db(path, method, body) {
    var opts = { method: method || 'GET' };
    if (body) { opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
    return fetch(DB + path + '.json' + (method ? '' : '?v='+Date.now()), opts)
      .then(function(r){ return r.json(); });
  }

  function firstName(n) { return (n||'').trim().split(' ')[0]; }

  function buildPax() {
    var row = document.getElementById('paxRow');
    row.innerHTML = '';
    for (var i=1;i<=6;i++) {
      (function(n){
        var b = document.createElement('button');
        b.className = 'pax' + (state.pax===n ? ' on':'');
        b.textContent = n;
        b.onclick = function(){ state.pax=n; buildPax(); };
        row.appendChild(b);
      })(i);
    }
  }

  function buildChips() {
    var box = document.getElementById('dietChips');
    box.innerHTML = '';
    DIETARIES.forEach(function(d){
      var b = document.createElement('button');
      b.className = 'chip' + (state.diets.indexOf(d)>-1 ? ' on':'');
      b.textContent = d;
      b.onclick = function(){
        var i = state.diets.indexOf(d);
        if (i>-1) state.diets.splice(i,1); else state.diets.push(d);
        buildChips();
      };
      box.appendChild(b);
    });
  }

  function setChoice(s) {
    state.status = s;
    document.getElementById('btnIn').className  = 'rsvp-btn' + (s==='in' ? ' on':'');
    document.getElementById('btnOut').className = 'rsvp-btn' + (s==='out'? ' on':'');
    document.getElementById('rsvpDetail').className = 'rsvp-detail' + (s==='in' ? ' show':'');
    if (s==='out') save();
  }

  function save() {
    var payload = {
      status: state.status,
      pax: state.status==='in' ? state.pax : 0,
      note: state.status==='in' ? document.getElementById('noteInput').value.trim() : '',
      diets: state.diets,
      name: G.name,
      room: G.room,
      phone: G.phone,
      at: new Date().toISOString()
    };
    db('/responses/'+todayKey()+'/'+G.phone, 'PUT', payload);
    db('/guests/'+G.phone, 'PATCH', {
      name: G.name, room: G.room, diets: state.diets
    });
    showStatus(payload);
  }

  function showStatus(r) {
    document.getElementById('rsvpChoice').style.display = 'none';
    var el = document.getElementById('rsvpStatus');
    el.style.display = 'block';
    if (r.status === 'in') {
      el.innerHTML = 'Confirmed for ' + r.pax + (r.pax===1?' guest':' guests') + '.' +
        (pastCutoff() ? '' : '<br><a href="#" id="editLink" style="color:var(--mid)">Change</a>');
    } else {
      el.innerHTML = 'Noted — not dining tonight.' +
        (pastCutoff() ? '' : '<br><a href="#" id="editLink" style="color:var(--mid)">Change</a>');
    }
    var link = document.getElementById('editLink');
    if (link) link.onclick = function(e){
      e.preventDefault();
      el.style.display='none';
      document.getElementById('rsvpChoice').style.display='block';
    };
  }

  function initRSVP() {
    if (!G.phone) return;
    document.getElementById('rsvp').className = 'show';

    document.getElementById('btnIn').onclick  = function(){ setChoice('in'); };
    document.getElementById('btnOut').onclick = function(){ setChoice('out'); };
    document.getElementById('saveBtn').onclick = save;

    // load profile + tonight's response
    Promise.all([ db('/guests/'+G.phone), db('/responses/'+todayKey()+'/'+G.phone) ])
      .then(function(res){
        var profile = res[0] || {};
        var tonight = res[1];

        if (profile.diets) state.diets = profile.diets;
        if (!G.name && profile.name) G.name = profile.name;
        if (!G.room && profile.room) G.room = profile.room;

        var fn = firstName(G.name);
        document.getElementById('rsvpGreet').textContent =
          profile.name ? (fn ? 'Welcome back, ' + fn + ' — dining tonight?' : 'Dining tonight?')
                       : (fn ? fn + ', dining with us tonight?' : 'Dining tonight?');

        if (tonight) {
          state.status = tonight.status;
          state.pax = tonight.pax || 2;
          state.diets = tonight.diets || state.diets;
          buildPax(); buildChips();
          if (tonight.note) document.getElementById('noteInput').value = tonight.note;
          showStatus(tonight);
          if (pastCutoff()) return;
        } else {
          buildPax(); buildChips();
        }
      })
      .catch(function(){ buildPax(); buildChips(); });
  }


</script>
</body>
</html>
