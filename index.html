<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nala">
<meta property="og:title" content="Tonight's menu at NALA">
<meta property="og:description" content="This evening's menu, and let us know if you're dining with us.">
<meta property="og:url" content="https://menu.nalaresort.com/">
<meta property="og:image" content="https://menu.nalaresort.com/preview.png?v=4">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tonight's menu at NALA">
<meta name="twitter:description" content="This evening's menu, and let us know if you're dining with us.">
<meta name="twitter:image" content="https://menu.nalaresort.com/preview.png?v=4">
<title>Nala — Tonight's Menu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --cream: #F7F5F1; --paper: #FEFEFC; --ink: #14140F; --mid: #47473F; --rule: #CFCFC8; }

  /* One fluid step drives every size on the page.
     Keyed to viewport HEIGHT, because vertical fit is the constraint.
     667px tall (SE)      -> 14.5px  floor
     844px tall (13/14/15)-> 16px    unchanged from before
     932px tall (Pro Max) -> 17.5px  ceiling                        */
  html { font-size: clamp(14.5px, 1.89vh, 17.5px); }

  html, body {
    width: 100%;
    min-height: 100dvh;
    background: var(--cream);
    font-family: 'Raleway', Helvetica, Arial, sans-serif;
  }

  body { display: flex; justify-content: center; }

  /* Everything the guest sees lives in ONE container that is at least
     one screen tall: header, menu, pricing, RSVP. The menu row is the
     only flexible one, so it absorbs whatever slack is left over.

     min-height, not height: if the content genuinely needs more room
     (the details form, a short phone) the container grows and the page
     scrolls. It can never clip, and it can never leave dead space. */
  .page {
    width: 100%;
    max-width: 440px;
    /* bottom pad so the pricing never sits hard against the screen edge */
    padding: 0 clamp(20px, 7vw, 32px) clamp(14px, 3.2vh, 30px);
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto auto;   /* header | menu | pricing | rsvp */
  }

  header {
    text-align: center;
    padding: 3.7vh 0 1.6vh;
  }

  /* Sized in rem so the shrink-to-fit loop scales it with everything else. */
  .logo {
    width: 5rem;
    height: auto;
    display: block;
    margin: 0 auto 1.15rem;
  }

  #stateDefault {
    border-top: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 12px;
  }

  .soon { font-size: 1.25rem; color: var(--ink); line-height: 1.5; }
  .note { font-style: italic; font-weight: 400; font-size: 0.875rem; color: var(--mid); line-height: 1.6; }

  /* Welcome state - the check-in landing when no menu is live yet. */
  .w-greet {
    font-size: 1.375rem;
    color: var(--ink);
    line-height: 1.45;
  }
  .w-rule { width: 1.625rem; height: 1px; background: var(--rule); margin: 4px auto; }
  .w-body {
    font-style: italic;
    font-weight: 400;
    font-size: 0.9rem;
    color: var(--mid);
    line-height: 1.75;
    max-width: 30ch;
  }
  .w-hours {
    font-family: 'Raleway', Helvetica, Arial, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mid);
    line-height: 2.1;
  }

  #stateMenu {
    display: none;
    flex-direction: column;
  }

  .menu-date {
    font-family: 'Raleway', Helvetica, Arial, sans-serif;
    font-size: 0.84rem;
    font-weight: 400;
    letter-spacing: 0.22em;
    color: var(--mid);
    text-align: center;
    text-transform: uppercase;
  }

  /* The four courses sit in their own block, centred in whatever height
     is left after the date and the pricing. Gaps between courses are
     capped, so surplus height becomes even margin around the group
     instead of inflating the gaps. That is the difference between a
     composed menu and a stretched one. */
  /* The courses are a page of paper laid on the cream: bordered all
     round, square corners, inset from the screen edges. */
  .courses {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 1.05rem 1rem;
    margin: 0;
    background: var(--paper);
    border: 1px solid var(--rule);
  }
  .spacer-mid { flex: 1; min-height: 1.5rem; max-height: 2.9rem; }

  .course { text-align: center; }

  .course-label {
    font-family: 'Raleway', Helvetica, Arial, sans-serif;
    font-size: 0.531rem;
    font-weight: 500;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 5px;
    opacity: .85;
  }

  .course-rule {
    width: 1.625rem;
    height: 1px;
    background: var(--rule);
    margin: 4px auto 12px;
  }

  .dish-name {
    font-size: 1.125rem;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.25;
    margin-bottom: 5px;
  }

  .aus-tag {
    font-family: 'Raleway', Helvetica, Arial, sans-serif;
    font-size: 0.5rem;
    color: var(--mid);
    vertical-align: super;
    margin-left: 3px;
  }

  .dish-desc {
    font-style: italic;
    font-weight: 400;
    font-size: 0.781rem;
    color: var(--mid);
    line-height: 1.55;
  }

  footer {
    text-align: center;
    padding: 2.4vh 0 0;
  }

  .pricing {
    font-family: 'Raleway', Helvetica, Arial, sans-serif;
    font-size: 0.781rem;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .pricing-note {
    font-style: italic;
    font-weight: 400;
    font-size: 0.75rem;
    color: var(--mid);
  }

  /* ── RSVP ─────────────────────────────────────── */
  #rsvp {
    display:none;
    border-top:1px solid var(--rule);
    margin-top:5vh;
    padding:4.5vh 0 7vh;
  }
  #rsvp.show { display:block; }

  .r-q {
    text-align:center; font-size:1.125rem; color:var(--ink);
    margin-bottom:22px; line-height:1.4;
  }

  .r-btns { display:flex; gap:10px; }

  .r-btn {
    flex:1; padding:16px 8px; border-radius:10px;
    font-family:'Raleway',Helvetica,Arial,sans-serif; font-size:0.781rem; font-weight:500;
    letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    border:1px solid #B8B8B0; background:transparent; color:var(--ink);
  }
  .r-btn.primary { background:#8A5646; border-color:#8A5646; color:#FFF6F1; }
  .r-btn.danger  { background:#9E6455; border-color:#9E6455; color:#fff; }
  .r-btn.quiet   { color:var(--mid); }

  .field { margin-bottom:18px; }
  .field-label {
    font-family:'Raleway',Helvetica,Arial,sans-serif; font-size:0.5625rem; letter-spacing:.25em;
    text-transform:uppercase; color:var(--mid); margin-bottom:9px; text-align:center;
  }

  .pax-row { display:flex; gap:6px; justify-content:center; }
  .pax {
    width:2.5rem; height:2.5rem; border:1px solid var(--rule); background:transparent;
    border-radius:50%; font-family:'Raleway',Helvetica,Arial,sans-serif; font-size:0.8125rem;
    color:var(--ink); cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .pax.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }

  .chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .chip {
    padding:8px 13px; border:1px solid #C3C3BC; background:transparent;
    border-radius:20px; font-family:'Raleway',Helvetica,Arial,sans-serif; font-size:0.75rem;
    color:var(--ink); cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .chip.on { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .premenu-note {
    flex-basis:100%; text-align:center; font-style:italic; color:var(--mid);
    font-size:0.8rem; line-height:1.5; margin-bottom:6px;
  }
  .ack {
    flex-basis:100%; display:flex; align-items:flex-start; gap:11px; text-align:left;
    border:1px solid var(--rule); border-radius:10px; padding:13px 14px; margin-top:6px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .ack-box {
    flex:0 0 auto; width:19px; height:19px; border:1.5px solid var(--mid);
    border-radius:4px; margin-top:1px; position:relative;
  }
  .ack.on .ack-box { background:var(--ink); border-color:var(--ink); }
  .ack.on .ack-box::after {
    content:''; position:absolute; left:5px; top:1px; width:5px; height:10px;
    border:solid var(--cream); border-width:0 2px 2px 0; transform:rotate(42deg);
  }
  .ack-t {
    font-family:'Raleway',Helvetica,Arial,sans-serif; font-size:0.8rem;
    color:var(--ink); line-height:1.45;
  }
  .ack.miss { border-color:#9E6455; }
  .ack.miss .ack-box { border-color:#9E6455; }
  .chip-div {
    flex-basis:100%; display:flex; align-items:center; gap:10px;
    margin:4px 0 2px; color:var(--mid);
  }
  .chip-div::before, .chip-div::after { content:''; flex:1; border-top:1px solid var(--rule); }
  .chip-div span {
    font-family:'Raleway',Helvetica,Arial,sans-serif; font-size:0.62rem;
    letter-spacing:0.14em; text-transform:uppercase; white-space:nowrap;
  }

  .note-input {
    width:100%; padding:11px; border:1px solid var(--rule); background:transparent;
    border-radius:10px; font-family:'Raleway',Helvetica,Arial,sans-serif; font-style:italic;
    font-size:16px; color:var(--ink); resize:none; /* keep 16px literal: iOS zooms the page on focus below this */
  }
  .note-input::placeholder { color:var(--mid); }
  .cf { display:none; }
  .cf.show { display:block; }
  .cf-msg { font-family:'Raleway',Helvetica,Arial,sans-serif; font-size:0.8rem; line-height:1.55;
    color:#9E6455; border:1px solid #D8C0B8; border-radius:10px; padding:10px 12px;
    margin-bottom:8px; text-align:left; }
  .cf-msg b { font-weight:600; }
  .cf-input.miss { border-color:#9E6455; }

  .r-done { text-align:center; }
  .r-done-t { font-size:1.125rem; color:var(--ink); margin-bottom:8px; }
  .r-done-s { font-style:italic; font-weight:400; font-size:0.875rem; color:var(--mid); }
  /* Short screens: two-line dish descriptions were pushing past the fold
     on an SE. Tighten the spacer floors rather than the type. */
  /* Short screens (SE and similar): the same content has to fit a much
     smaller box, so the vertical budget is tightened. Type is untouched -
     only spacing gives way. */
  @media (max-height: 700px) {
    .courses      { padding: 0.5rem 0; }
    .spacer-mid   { min-height: 0.5rem; max-height: 1.4rem; }
    header        { padding: 2vh 0 0.9vh; }
    .logo         { width: 5.4rem; }
    .menu-date    { padding-bottom: 1.2vh; }
    .course-label { margin-bottom: 3px; }
    .course-rule  { margin: 3px auto 7px; }
    .dish-name    { margin-bottom: 3px; }
    footer        { padding-top: 1.8vh; }
    #rsvp         { margin-top: 3vh; padding: 2.8vh 0 4vh; }
    .r-q          { margin-bottom: 14px; }
    .r-btn        { padding: 11px 8px; }
  }

  /* Landscape phone: one screen is not achievable or desirable, so stop
     stretching to it and use settled spacing instead. */
  @media (orientation: landscape) and (max-height: 560px) {
    html { font-size: 15px; }
    .page { min-height: 0; display: block; }
    header { padding: 26px 0 14px; }
    .menu-date { padding-bottom: 14px; }
    .courses { padding: 18px 0; }
    .spacer-mid { flex: none; min-height: 22px; max-height: none; }
    footer { padding-top: 18px; }
  }

  .r-link {
    display:inline-block; margin-top:12px; font-family:'Raleway',Helvetica,Arial,sans-serif;
    font-size:0.625rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--mid); border-bottom:1px solid var(--rule);
    text-decoration:none; padding-bottom:2px; cursor:pointer;
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="menu-date" id="menuDate">Nala</div>
  </header>

  <div id="stateDefault">
    <div class="soon">Tonight's menu<br>coming soon</div>
    <div class="note">Our menu is updated daily. Please check back later.</div>
  </div>

  <div id="stateMenu">
    <div class="courses">
    <img class="logo" src="nala-logo.png" alt="Nala Resort">
    <div class="course">
      <div class="course-label">Bread</div>
      <div class="course-rule"></div>
      <div class="dish-name" id="breadName"></div>
      <div class="dish-desc" id="breadDesc"></div>
    </div>
    <div class="spacer-mid"></div>
    <div class="course">
      <div class="course-label">Entrée</div>
      <div class="course-rule"></div>
      <div class="dish-name" id="entreeName"></div>
      <div class="dish-desc" id="entreeDesc"></div>
    </div>
    <div class="spacer-mid"></div>
    <div class="course">
      <div class="course-label">Main</div>
      <div class="course-rule"></div>
      <div class="dish-name" id="mainName"></div>
      <div class="dish-desc" id="mainDesc"></div>
    </div>
    <div class="spacer-mid"></div>
    <div class="course">
      <div class="course-label">Dessert</div>
      <div class="course-rule"></div>
      <div class="dish-name" id="dessertName"></div>
      <div class="dish-desc" id="dessertDesc"></div>
    </div>
    </div><!-- /.courses -->
  </div>


  <footer id="pricingFoot" style="display:none">
    <div class="pricing">2 courses $105 &nbsp;&nbsp; 3 courses $125</div>
    <div class="pricing-note">Bread course included with both options</div>
  </footer>

  <div id="rsvp"></div>


</div>

<script>
  function showMenu(data) {
    setTimeout(function(){ if (window.scheduleFit) window.scheduleFit(); }, 0);
    // the logo participates in the height, so refit once it has loaded
    var lg = document.querySelector('.logo');
    if (lg && !lg.complete) lg.addEventListener('load', function(){
      if (window.scheduleFit) window.scheduleFit();
    });
    document.getElementById('stateDefault').style.display = 'none';
    var sm = document.getElementById('stateMenu');
    sm.style.display = 'flex';
    document.getElementById('pricingFoot').style.display = '';

    document.getElementById('menuDate').textContent = data.date;

    ['bread','entree','main','dessert'].forEach(function(c) {
      var nameEl = document.getElementById(c + 'Name');
      nameEl.textContent = data[c].name;
      if (data[c].aus) {
        var tag = document.createElement('span');
        tag.className = 'aus-tag';
        tag.textContent = '(AUS)';
        nameEl.appendChild(tag);
      }
      document.getElementById(c + 'Desc').textContent = data[c].desc;
    });
  }

  // ── ALL DISPLAY LOGIC LIVES HERE ──────────────────────────
  // menu.json contains ONLY the four courses.
  // Publish time comes from the file's Last-Modified header.
  //
  // States:
  //   1. Menu has content, written today   -> show menu
  //   2. Menu is empty ("remove menu")     -> placeholder
  //   3. Menu written before today         -> placeholder

  function hasContent(d) {
    return ['bread','entree','main','dessert'].every(function(k){
      return d[k] && d[k].name && d[k].name.trim() !== '';
    });
  }

  // menu.json carries its own publish time; Last-Modified is unreliable
  // because GitHub Pages rewrites it on every deploy of any file.

  // Safari only accepts 3 fractional digits in an ISO date; Python writes 6.
  // Trim them so any timestamp parses on every browser.
  function parseISO(s){
    if (!s) return null;
    var t = String(s).trim().replace(/(\.\d{3})\d+/, '$1');
    var d = new Date(t);
    if (!isNaN(d)) return d;
    d = new Date(t.replace(/\.\d+/, ''));      // drop fractions entirely
    return isNaN(d) ? null : d;
  }
  
  function publishTime(data, lastModified) {
    if (data && data.published) {
      var p = parseISO(data.published);
      if (p) return p;
    }
    return lastModified ? new Date(lastModified) : null;
  }

  function stillValid(published) {
    if (!published || isNaN(published)) return false;
    var expiry = new Date(published);
    expiry.setHours(24, 0, 0, 0);        // midnight ending the publish day
    return new Date() < expiry;
  }

  function dateLabel(when) {
    var d = new Date(when);
    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    return days[d.getDay()] + ' evening';
  }

  var MENU = null;   // tonight's menu, kept for dietary conflict checks
  fetch('menu.json?v=' + Date.now())
    .then(function(r){
      var lm = r.headers.get('Last-Modified');
      return r.json().then(function(data){ return { data: data, lastModified: lm }; });
    })
    .then(function(res) {
      if (!hasContent(res.data)) return;           // empty -> placeholder
      var pub = publishTime(res.data, res.lastModified);
      if (!stillValid(pub)) return;                // stale -> placeholder
      res.data.date = dateLabel(pub);
      MENU = res.data;
      if (MENU.dietaries && MENU.dietaries.length) DIETARIES = MENU.dietaries.slice();
      if (document.getElementById('chips')) paintChips();
      showMenu(res.data);
    })
    .catch(function(e){ console.log('Menu load error:', e); })
    .then(function(){ loadTags(); });   // menu or not, the dietary list still loads;

  // Dietary master list + tonight's dish tags live in Firebase,
  // written by the chef's tag page (tag.html).
  function loadTags(){
    Promise.all([
      fetch(DB + '/dietaries.json').then(function(r){ return r.json(); }),
      fetch(DB + '/menutags/' + todayKey() + '.json').then(function(r){ return r.json(); })
    ]).then(function(res){
      var master = res[0], tags = res[1];
      if (master){
        var names = [], groups = {};
        Object.keys(master).forEach(function(k){
          var d = master[k];
          if (d && d.active){ names.push(d.name || k); groups[d.name || k] = d.group || 'common'; }
        });
        if (names.length){
          names.sort(function(a,b){
            var ga = groups[a]==='menu'?1:0, gb = groups[b]==='menu'?1:0;
            return ga - gb || a.localeCompare(b);
          });
          DIETARIES = names;
          DIETGROUPS = groups;
          if (MENU) MENU.dietGroups = groups;
        }
      }
      if (tags && MENU){
        ['bread','entree','main','dessert'].forEach(function(c){
          if (MENU[c] && tags[c]) MENU[c].conflicts = tags[c];
        });
      }
      if (document.getElementById('chips')) paintChips();
      if (document.getElementById('cf')) updateConflict();
    }).catch(function(e){ console.log('Tag load error:', e); });
  }

  // ══ RSVP ═══════════════════════════════════════════════════
  var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
  var CUTOFF_HOUR = 12;
  var DIETARIES = ['Gluten free','Dairy free','Vegetarian','Vegan','Pescatarian',
                   'Nut allergy','Shellfish allergy','Egg allergy'];

  function todayKey(){
    var d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function pastCutoff(){ return new Date().getHours() >= CUTOFF_HOUR; }

  var qs = new URLSearchParams(location.search);
  var G = { phone:(qs.get('p')||'').replace(/\D/g,''), room:qs.get('r')||'',
            name:qs.get('n')||'', arrives:qs.get('a')||'', departs:qs.get('d')||'' };

  var DIETGROUPS = {};   // name -> 'common' | 'menu', from the chef's master list
  var state = { pax:2, diets:[], note:'', dnote:'', nodiet:false };

  // A dish lists the dietaries it conflicts with (tagged by the chef at publish).
  // Only explicit tags flag to the guest - no keyword guessing.
  function menuConflicts(diets){
    if (!diets || !diets.length || !MENU) return [];
    var hits = [];
    ['bread','entree','main','dessert'].forEach(function(k){
      var dish = MENU[k];
      if (!dish || !dish.conflicts) return;
      dish.conflicts.forEach(function(tag){
        diets.forEach(function(d){
          if (String(d).toLowerCase() === String(tag).toLowerCase())
            hits.push({ dish: dish.name || k, diet: d });
        });
      });
    });
    return hits;
  }

  function updateConflict(){
    var box = document.getElementById('cf'); if (!box) return;
    var hits = menuConflicts(state.diets);
    if (!hits.length){ box.className = 'field cf'; return; }
    var byDish = {};
    hits.forEach(function(h){ (byDish[h.dish] = byDish[h.dish] || []).push(h.diet); });
    var parts = Object.keys(byDish).map(function(dish){
      return '<b>' + dish + '</b> may not suit: ' + byDish[dish].join(', ');
    });
    document.getElementById('cfMsg').innerHTML =
      'A note on tonight\u2019s menu \u2014 ' + parts.join('. ') + '. ' +
      'Please tell us how you\u2019d like this handled and we\u2019ll look after you.';
    box.className = 'field cf show';
  }
  var panel = document.getElementById('rsvp');

  function db(path, method, body){
    var o = { method: method||'GET' };
    if (body) { o.headers={'Content-Type':'application/json'}; o.body=JSON.stringify(body); }
    return fetch(DB+path+'.json'+(method?'':'?v='+Date.now()), o)
      .then(function(r){
        if (!r.ok) {
          console.error('Nala DB ' + (method||'GET') + ' ' + path + ' failed: ' + r.status);
          if (method) window.__nalaWriteFailed = true;
        }
        return r.json();
      })
      .catch(function(e){
        console.error('Nala DB error', path, e);
        if (method) window.__nalaWriteFailed = true;
        throw e;
      });
  }

  // ── fit to screen ──────────────────────────────────────────
  // The CSS scale assumes a normal four-course menu. A chef can publish
  // anything, so if the content still will not fit, step the root size
  // down until it does. Everything is sized in rem, so one property
  // shrinks type and spacing together and the proportions hold.
  // Floor is 76% - below that it stops shrinking and the page scrolls,
  // which is the right trade rather than making it unreadable.
  var fitPending = false;
  function fitToScreen(){
    var el = document.documentElement;
    var a  = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')) return;

    // While the form is open the menu must not move at all: keep any
    // active type shrink, keep the locked height, just let the page grow.
    if (panel.getAttribute('data-step') === 'details') return;

    unlockMenu();                                 // fresh fit, fresh geometry
    el.style.fontSize = '';                       // release to the CSS clamp
    var base = parseFloat(getComputedStyle(el).fontSize);
    var size = base, floor = base * 0.66, guard = 0;
    while (el.scrollHeight > window.innerHeight + 1 && size > floor && guard++ < 40) {
      size -= base * 0.02;
      el.style.fontSize = size + 'px';
    }
    lockMenu();
  }

  // Freeze the menu paper at its settled height so a growing RSVP panel
  // can never re-divide the screen and squash it - the page simply gets
  // taller and scrolls instead.
  function unlockMenu(){
    var c = document.querySelector('.courses');
    if (c) c.style.minHeight = '';
    var sp = document.querySelectorAll('.spacer-mid');
    for (var i = 0; i < sp.length; i++) { sp[i].style.minHeight = ''; sp[i].style.maxHeight = ''; }
  }

  function lockMenu(){
    var c = document.querySelector('.courses');
    var sm = document.getElementById('stateMenu');
    if (!c || !sm || sm.style.display === 'none' || !c.offsetHeight) return;
    c.style.minHeight = c.offsetHeight + 'px';
    var sp = document.querySelectorAll('.spacer-mid');
    for (var i = 0; i < sp.length; i++) {
      sp[i].style.minHeight = sp[i].offsetHeight + 'px';
      sp[i].style.maxHeight = sp[i].offsetHeight + 'px';
    }
  }
  window.scheduleFit = scheduleFit;
  function scheduleFit(){
    if (fitPending) return;
    fitPending = true;
    requestAnimationFrame(function(){ fitPending = false; fitToScreen(); });
  }
  window.addEventListener('orientationchange', function(){ setTimeout(fitToScreen, 220); });

  function firstName(n){ return (n||'').trim().split(' ')[0]; }
  function toBottom(){
    requestAnimationFrame(function(){
      setTimeout(function(){ window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' }); }, 140);
    });
  }

  // ── steps ────────────────────────────────────────────────
  function stepChoose(){
    var fn = firstName(G.name);
    panel.innerHTML =
      '<div class="r-q">Will you be dining with us tonight?</div>'+
      '<div class="r-btns">'+
        '<button class="r-btn" id="bOut">Not tonight</button>'+
        '<button class="r-btn primary" id="bIn">Dining tonight</button>'+
      '</div>';
    document.getElementById('bIn').onclick  = stepDetails;
    document.getElementById('bOut').onclick = stepConfirmOut;
    panel.setAttribute('data-step','choose'); scheduleFit();
  }

  function stepConfirmOut(){
    panel.innerHTML =
      '<div class="r-q">Confirm you won\u2019t be dining tonight?</div>'+
      '<div class="r-btns">'+
        '<button class="r-btn quiet" id="bBack">Back</button>'+
        '<button class="r-btn danger" id="bYes">Confirm</button>'+
      '</div>';
    document.getElementById('bYes').onclick  = function(){ save('out'); };
    document.getElementById('bBack').onclick = stepChoose;
    panel.setAttribute('data-step','confirm'); scheduleFit();
    toBottom();
  }

  function stepDetails(){
    panel.innerHTML =
      '<div class="field"><div class="field-label">Guests</div><div class="pax-row" id="paxRow"></div></div>'+
      '<div class="field"><div class="field-label">Dietary requirements</div><div class="chips" id="chips"></div></div>'+
      '<div class="field cf" id="cf"><div class="cf-msg" id="cfMsg"></div>'+
        '<textarea class="note-input cf-input" id="dnote" rows="2" placeholder="Required \u2014 e.g. happy with an alternative dish"></textarea></div>'+
      '<div class="field"><div class="field-label">Anything else</div>'+
        '<textarea class="note-input" id="note" rows="2" placeholder="Celebrating something, arriving late\u2026"></textarea></div>'+
      '<div class="r-btns">'+
        '<button class="r-btn quiet" id="bBack">Back</button>'+
        '<button class="r-btn primary" id="bSave">Confirm</button>'+
      '</div>';
    if (state.note) document.getElementById('note').value = state.note;
    if (state.dnote) document.getElementById('dnote').value = state.dnote;
    paintPax(); paintChips(); updateConflict();
    document.getElementById('bSave').onclick = function(){ save('in'); };
    document.getElementById('bBack').onclick = stepChoose;
    panel.setAttribute('data-step','details'); scheduleFit();
    toBottom();
  }

  function stepDone(r){
    var body = r.status==='in'
      ? '<div class="r-done-t">Confirmed for '+r.pax+(r.pax===1?' guest':' guests')+'</div>'+
        '<div class="r-done-s">We look forward to seeing you.</div>'
      : '<div class="r-done-t">Noted \u2014 not dining tonight</div>'+
        '<div class="r-done-s">We hope to see you another evening.</div>';
    panel.innerHTML = '<div class="r-done">'+body+
      (pastCutoff() ? '' : '<a class="r-link" id="bEdit">Change</a>')+'</div>';
    var e = document.getElementById('bEdit');
    if (e) e.onclick = stepChoose;
    panel.setAttribute('data-step','done'); scheduleFit();
  }

  function paintPax(){
    var row = document.getElementById('paxRow'); row.innerHTML='';
    // a room answers for its own occupants only (larger parties are handled
    // by staff on the tally), so combined-room totals can't double-count
    var maxPax = G.room ? 2 : 4;
    if (state.pax > maxPax) state.pax = maxPax;
    for (var i=1;i<=maxPax;i++)(function(n){
      var b=document.createElement('button');
      b.className='pax'+(state.pax===n?' on':''); b.textContent=n;
      b.onclick=function(){ state.pax=n; paintPax(); };
      row.appendChild(b);
    })(i);
  }

  function chipEl(d){
    var b=document.createElement('button');
    b.className='chip'+(state.diets.indexOf(d)>-1?' on':''); b.textContent=d;
    b.onclick=function(){
      var i=state.diets.indexOf(d);
      if(i>-1) state.diets.splice(i,1);
      else { state.diets.push(d); state.nodiet=false; }
      paintChips(); updateConflict();
    };
    return b;
  }
  function paintChips(){
    var box = document.getElementById('chips'); box.innerHTML='';
    var groups = (MENU && MENU.dietGroups) ? MENU.dietGroups : DIETGROUPS;
    var common = [], menu = [];
    DIETARIES.forEach(function(d){
      if (groups[d]==='menu') menu.push(d); else common.push(d);
    });
    if (!MENU){
      // menu not out yet: confirming requires an explicit acknowledgment
      var pn=document.createElement('div'); pn.className='premenu-note';
      pn.textContent='Tonight\u2019s menu isn\u2019t published yet. If you\u2019d like to confirm now, please acknowledge below \u2014 or check back once the menu is out to add any dietaries.';
      box.appendChild(pn);
      var ack=document.createElement('div');
      ack.className='ack'+(state.nodiet?' on':''); ack.id='ack';
      ack.innerHTML='<span class="ack-box"></span>'+
        '<span class="ack-t">I have no allergies or dietary requirements to declare</span>';
      ack.onclick=function(){
        state.nodiet=!state.nodiet;
        if (state.nodiet) state.diets=[];
        paintChips(); updateConflict();
      };
      box.appendChild(ack);
      return;
    }
    common.forEach(function(d){ box.appendChild(chipEl(d)); });
    if (menu.length){
      var div=document.createElement('div'); div.className='chip-div';
      div.innerHTML='<span>Tonight\u2019s menu</span>';
      box.appendChild(div);
      menu.forEach(function(d){ box.appendChild(chipEl(d)); });
    }
  }

  function save(status){
    var noteEl = document.getElementById('note');
    if (noteEl) state.note = noteEl.value.trim();
    var dEl = document.getElementById('dnote');
    if (dEl) state.dnote = dEl.value.trim();
    var clash = menuConflicts(state.diets).length > 0;
    if (status==='in' && clash && !state.dnote){
      if (dEl){ dEl.classList.add('miss'); dEl.focus(); }
      return;   // a conflicting dietary needs a note before confirming
    }
    if (status==='in' && !MENU && !state.nodiet){
      var ackEl = document.getElementById('ack');
      if (ackEl){ ackEl.classList.add('miss'); ackEl.scrollIntoView({block:'center',behavior:'smooth'}); }
      return;   // pre-menu confirming requires the acknowledgment
    }
    if (status==='in' && !MENU) state.diets = [];   // acknowledged: none to declare
    if (!clash) state.dnote = '';   // diet was untoggled after typing
    var payload = {
      status: status,
      pax: status==='in' ? state.pax : 0,
      flag: status==='in' && clash,
      premenu: status==='in' && !MENU,
      nodiet: status==='in' && state.nodiet,
      note: status==='in' ? state.note : '',
      dnote: status==='in' ? state.dnote : '',
      diets: state.diets,
      name: G.name, room: G.room, phone: G.phone, arrives: G.arrives, departs: G.departs,
      at: new Date().toISOString()
    };
    db('/responses/'+todayKey()+'/'+G.phone, 'PUT', payload);
    // pre-menu, the acknowledgment covers tonight only - keep the guest's
    // standing dietaries on their profile for future nights
    var prof = { name:G.name, room:G.room, arrives:G.arrives, departs:G.departs };
    if (MENU) prof.diets = state.diets;
    db('/guests/'+G.phone, 'PATCH', prof);
    stepDone(payload);
  }

  function initRSVP(){
    if (!G.phone || !G.name) return;   // opt-in needs an identified guest
    panel.className = 'show';
    document.querySelector('.page').classList.add('has-rsvp');

    // record who is in this room as soon as the link is opened,
    // so staff-entered bookings still carry the guest's details
    if (G.room) {
      db('/roomguests/'+todayKey()+'/'+G.room, 'PUT', {
        name: G.name, phone: G.phone, arrives: G.arrives, departs: G.departs,
        at: new Date().toISOString()
      });
    }

    Promise.all([ db('/guests/'+G.phone), db('/responses/'+todayKey()+'/'+G.phone) ])
      .then(function(res){
        var profile = res[0] || {};
        var tonight = res[1];
        if (profile.diets) state.diets = profile.diets;
        if (!G.name && profile.name) G.name = profile.name;
        if (!G.room && profile.room) G.room = profile.room;
        if (!G.arrives && profile.arrives) G.arrives = profile.arrives;
        if (!G.departs && profile.departs) G.departs = profile.departs;

        if (tonight){
          state.pax   = Math.min(tonight.pax || 2, G.room ? 2 : 4);
          state.diets = tonight.diets || state.diets;
          state.note  = tonight.note || '';
          state.dnote = tonight.dnote || '';
          state.nodiet = !!tonight.nodiet;
          stepDone(tonight);
        } else {
          stepChoose();
        }
      })
      .catch(stepChoose);
  }

  initRSVP();   // independent of menu state


</script>
</body>
</html>
