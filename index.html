<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nala — Tonight's Menu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --cream: #F9F7F4; --ink: #1C1C1A; --mid: #999990; --rule: #E0E0DA; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--cream);
    font-family: Georgia, serif;
  }

  body { display: flex; justify-content: center; }

  .page {
    width: 100%;
    max-width: 440px;
    height: 100%;
    padding: 0 32px;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  header {
    text-align: center;
    padding: 5vh 0 2.5vh;
    border-bottom: 1px solid var(--rule);
  }

  .wordmark {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--mid);
  }

  #stateDefault {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 12px;
  }

  .soon { font-size: 18px; color: var(--ink); line-height: 1.5; }
  .note { font-style: italic; font-size: 12px; color: var(--mid); line-height: 1.6; }

  #stateMenu {
    display: none;
    flex-direction: column;
  }

  .menu-date {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.1em;
    color: var(--ink);
    text-align: center;
    text-transform: uppercase;
    padding: 1.5vh 0 0;
  }

  .spacer-top { flex: 2; }
  .spacer-mid { flex: 1; }
  .spacer-bot { flex: 2; }

  .course { text-align: center; }

  .course-label {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 7px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 3px;
  }

  .course-rule {
    width: 22px;
    height: 1px;
    background: var(--rule);
    margin: 3px auto 7px;
  }

  .dish-name {
    font-size: 18px;
    font-weight: normal;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .aus-tag {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 7px;
    color: var(--mid);
    vertical-align: super;
    margin-left: 3px;
  }

  .dish-desc {
    font-style: italic;
    font-size: 11px;
    color: var(--mid);
    line-height: 1.4;
  }

  footer {
    border-top: 1px solid var(--rule);
    text-align: center;
    padding: 2vh 0 4vh;
  }

  .pricing {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .pricing-note {
    font-style: italic;
    font-size: 10px;
    color: var(--mid);
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="wordmark">Nala</div>
  </header>

  <div id="stateDefault">
    <div class="soon">Tonight's menu<br>coming soon</div>
    <div class="note">Our menu is updated daily. Please check back later.</div>
  </div>

  <div id="stateMenu">
    <div class="menu-date" id="menuDate"></div>
    <div class="spacer-top"></div>
    <div class="course">
      <div class="course-label">Bread</div>
      <div class="course-rule"></div>
      <div class="dish-name" id="breadName"></div>
      <div class="dish-desc" id="breadDesc"></div>
    </div>
    <div class="spacer-mid"></div>
    <div class="course">
      <div class="course-label">Entrée</div>
      <div class="course-rule"></div>
      <div class="dish-name" id="entreeName"></div>
      <div class="dish-desc" id="entreeDesc"></div>
    </div>
    <div class="spacer-mid"></div>
    <div class="course">
      <div class="course-label">Main</div>
      <div class="course-rule"></div>
      <div class="dish-name" id="mainName"></div>
      <div class="dish-desc" id="mainDesc"></div>
    </div>
    <div class="spacer-mid"></div>
    <div class="course">
      <div class="course-label">Dessert</div>
      <div class="course-rule"></div>
      <div class="dish-name" id="dessertName"></div>
      <div class="dish-desc" id="dessertDesc"></div>
    </div>
    <div class="spacer-bot"></div>
  </div>

  <footer>
    <div class="pricing">2 courses $105 &nbsp;&nbsp; 3 courses $125</div>
    <div class="pricing-note">Both menus include bread</div>
  </footer>

</div>

<script>
  function setHeight() {
    document.querySelector('.page').style.height = window.innerHeight + 'px';
  }
  setHeight();
  window.addEventListener('resize', setHeight);
  window.addEventListener('orientationchange', function(){ setTimeout(setHeight, 150); });

  function showMenu(data) {
    document.getElementById('stateDefault').style.display = 'none';
    var sm = document.getElementById('stateMenu');
    sm.style.display = 'flex';

    document.getElementById('menuDate').textContent = data.date;

    ['bread','entree','main','dessert'].forEach(function(c) {
      var nameEl = document.getElementById(c + 'Name');
      nameEl.textContent = data[c].name;
      if (data[c].aus) {
        var tag = document.createElement('span');
        tag.className = 'aus-tag';
        tag.textContent = '(AUS)';
        nameEl.appendChild(tag);
      }
      document.getElementById(c + 'Desc').textContent = data[c].desc;
    });
  }

  // ── ALL DISPLAY LOGIC LIVES HERE ──────────────────────────
  // menu.json only carries data + a publish timestamp.
  // This file decides whether to show the menu or the placeholder.
  //
  // States:
  //   1. active === true  and now < midnight after publish  -> show menu
  //   2. active === false ("remove menu")                   -> placeholder
  //   3. now >= midnight after publish                      -> placeholder

  function expiryFrom(publishedISO) {
    // Midnight at the end of the day the menu was published
    var p = new Date(publishedISO);
    var e = new Date(p);
    e.setHours(24, 0, 0, 0);   // rolls to 00:00 next day
    return e;
  }

  function dateLabel(publishedISO) {
    var d = new Date(publishedISO);
    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['January','February','March','April','May','June','July',
                  'August','September','October','November','December'];
    return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  fetch('menu.json?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (!data.active) return;              // removed -> placeholder
      if (!data.published) return;           // no timestamp -> placeholder
      if (new Date() >= expiryFrom(data.published)) return;  // past midnight
      data.date = dateLabel(data.published); // label derived here, not sent
      showMenu(data);
    })
    .catch(function(e){ console.log('Menu load error:', e); });
</script>
</body>
</html>
