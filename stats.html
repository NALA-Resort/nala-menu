<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Nala · Statistics</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA;
          --green:#5E7D67; --red:#9E6455; }
  body { background:var(--cream); color:var(--ink); font-family:Georgia,serif;
         padding:28px 24px 60px; }
  .wrap { max-width:520px; margin:0 auto; }

  .wordmark { font-family:Helvetica,Arial,sans-serif; font-size:9px; letter-spacing:.45em;
              text-transform:uppercase; color:var(--mid); text-align:center; }
  .title { text-align:center; font-family:Helvetica,Arial,sans-serif; font-size:13px;
           font-weight:bold; letter-spacing:.1em; text-transform:uppercase; margin-top:6px; }
  .range { text-align:center; font-style:italic; font-size:12px; color:var(--mid); margin-top:6px; }

  .sec { font-family:Helvetica,Arial,sans-serif; font-size:8px; letter-spacing:.3em;
         text-transform:uppercase; color:var(--mid); margin:28px 0 12px; }

  .stat { display:flex; align-items:baseline; gap:10px; padding:11px 0;
          border-bottom:1px solid var(--rule); }
  .stat-name { flex:1; font-size:14px; }
  .stat-sub { font-style:italic; font-size:11px; color:var(--mid); }
  .stat-val { font-family:Helvetica,Arial,sans-serif; font-size:15px; white-space:nowrap; }

  .bar { height:5px; background:var(--rule); border-radius:3px; margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--green); }

  .headline { text-align:center; padding:22px 0 6px; }
  .headline .big { font-size:44px; line-height:1; }
  .headline .cap { font-family:Helvetica,Arial,sans-serif; font-size:8px;
                   letter-spacing:.25em; text-transform:uppercase; color:var(--mid); margin-top:8px; }

  .seemenus { text-align:center; margin:22px 0 4px; }
  .seemenus a { font-family:Helvetica,Arial,sans-serif; font-size:10px;
                letter-spacing:.18em; text-transform:uppercase; color:var(--mid);
                text-decoration:none; border-bottom:1px solid var(--rule);
                padding-bottom:3px; }

  .note { font-style:italic; font-size:12px; color:var(--mid); line-height:1.6;
          padding:10px 0; }

  .actions { margin-top:34px; display:flex; gap:10px; }
  .btn { flex:1; text-align:center; padding:13px; border:1px solid var(--ink);
         font-family:Helvetica,Arial,sans-serif; font-size:10px; letter-spacing:.15em;
         text-transform:uppercase; color:var(--ink); text-decoration:none;
         background:transparent; cursor:pointer; }
  .empty { font-style:italic; color:var(--mid); font-size:12px; padding:8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">Nala</div>
  <div class="title">Statistics</div>
  <div class="range" id="range">Loading…</div>

  <div class="headline">
    <div class="big" id="hCovers">–</div>
    <div class="cap">Average covers a night</div>
  </div>

  <!-- The question this page provokes: these are the aggregates, and the
       next thing anyone asks is what was actually on the menu that night. -->
  <div class="seemenus"><a href="past-menus.html">See the menu for any night &#8250;</a></div>

  <div class="sec">Take-up by main course</div>
  <div id="byProtein"></div>

  <div class="sec">Busiest nights</div>
  <div id="byDay"></div>

  <div class="sec">Dietary requirements</div>
  <div id="byDiet"></div>

  <div class="actions">
    <a class="btn" href="tally.html">Back</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=12"></script>
<script src="nala-shared.js?v=36"></script>
<script>
/* Reading only, no writes, but it is the resort's numbers and there was no
   gate on it at all until 18 Aug. Same audience as the Reservations board. */
(function gate(){
  if (!window.firebase || !firebase.auth ||
      typeof loadStaff !== 'function'){ setTimeout(gate,300); return; }
  var A;
  try { A = firebase.auth(); } catch (e){ setTimeout(gate,300); return; }
  if (!A || typeof A.onAuthStateChanged !== 'function'){ setTimeout(gate,300); return; }
  A.onAuthStateChanged(function(u){
    if (!u) return;
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role;
      if (can(role, 'resBoard') || e) return;
      document.querySelector('.wrap').style.display = 'none';
      var home = homeFor(role);
      if (home) location.replace(home);
    });
  });
})();

var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";
var LOOKBACK = 120;   // days

function dkey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysAgo(n){ var d = new Date(); d.setDate(d.getDate()-n); return dkey(d); }

/* Categorise a main course into a protein group.

   Two passes, and the order of them is the whole point. The animal is looked
   for first, the cut only afterwards, because cut names are shared: lamb rump
   was being counted as beef, pork cheek as beef, and a tuna steak would have
   gone the same way. Chef writes "Lamb rump, smoked eggplant", so the word
   that settles it is always there, just not always first.               */
var GROUPS = [
  ['Beef',        ['beef','wagyu','onyx','sirloin','striploin'],
                  ['steak','eye fillet','rib fillet','rump','tartare','brisket','cheek']],
  ['Lamb',        ['lamb'], []],
  ['Pork',        ['pork','porchetta'], ['belly']],
  ['Chicken',     ['chicken','poussin','quail'], []],
  ['Duck',        ['duck'], []],
  ['Fish',        ['barramundi','kingfish','snapper','cobia','perch','tuna','salmon','mahi','fish','trout','crudo'], []],
  ['Shellfish',   ['prawn','scallop','crab','oyster','lobster','squid','octopus','mussel'], []],
  ['Vegetarian',  ['mushroom','cabbage','eggplant','risotto','gnocchi','cauliflower','zucchini','panisse','chawanmushi','leek'], []]
];

function groupOf(name){
  var n = (name||'').toLowerCase();
  for (var pass=1; pass<=2; pass++){
    for (var i=0;i<GROUPS.length;i++){
      var words = GROUPS[i][pass];
      for (var j=0;j<words.length;j++){ if (n.indexOf(words[j]) > -1) return GROUPS[i][0]; }
    }
  }
  return 'Other';
}

/* One request a node, not one a day. This page used to fetch two nodes for
   each of 120 dates, which is 240 requests from a phone on resort wifi, and a
   dropped handful of them looked exactly like a quiet fortnight.

   A read that FAILS is not an empty node. That distinction cost hours on Clean
   Slate, which counted 0 records for four nodes it could not read and reported
   success. Here it would show a page of dashes and the words "no data", which
   reads as a quiet season rather than a broken permission.                  */
function readNode(path){
  return fetch(DB+path+'.json?v='+Date.now())
    .then(function(r){ return r.ok ? r.json() : { __failed: r.status }; })
    .catch(function(){ return { __failed: 0 }; });
}

function failure(node, res){
  return (res && res.__failed !== undefined) ? (node + ' (HTTP ' + res.__failed + ')') : null;
}

Promise.all([readNode('/dinner'), readNode('/responses'), readNode('/menuhistory')])
.then(function(res){
  var failed = [failure('dinner', res[0]), failure('responses', res[1]),
                failure('menuhistory', res[2])].filter(Boolean);
  if (failed.length){
    document.getElementById('range').textContent = 'Could not read the history';
    document.getElementById('byProtein').innerHTML =
      '<div class="note">The database would not return ' + failed.join(', ') +
      '. Nothing here is a count of zero: these numbers could not be read at ' +
      'all. Sign in as staff, and if that does not fix it paste the current ' +
      'rules.json into the Firebase console and press Publish.</div>';
    return;
  }

  var dinnerAll = res[0] || {}, respAll = res[1] || {}, menus = res[2] || {};
  var from = daysAgo(LOOKBACK - 1);

  /* Every date either node knows about, inside the window. The dates are
     sortable strings, so the window is a comparison rather than a calendar. */
  var dates = {};
  for (var k in dinnerAll) if (k >= from) dates[k] = true;
  for (var k in respAll)   if (k >= from) dates[k] = true;

  var nights = [];        // { date, group, covers, dining, replied, diets[] }

  Object.keys(dates).sort().forEach(function(date){
    /* One answer a villa. The dinner cell holds the whole answer and outranks
       anything left in the retired node, exactly as roomRecord treats it: the
       two are not merged, because a villa answered twice is one guest, and
       adding them together inflates every cover on this page. */
    var seen = {};
    var day = dinnerAll[date] || {};
    for (var v in day){
      var c = day[v];
      if (c && typeof c === 'object') seen[String(v)] = { rec: c, cell: true };
    }
    var rday = respAll[date] || {};
    for (var key in rday){
      var g = rday[key];
      if (!g || typeof g !== 'object') continue;
      var v = String(g.room || '');
      if (!v) continue;
      if (seen[v] && seen[v].cell) continue;
      if (seen[v] && (seen[v].rec.at || '') > (g.at || '')) continue;
      seen[v] = { rec: g, cell: false };
    }

    var covers = 0, dining = 0, replied = 0, diets = [];
    for (var v in seen){
      var r = seen[v].rec;
      /* A villa marked vacant is reception saying nobody is in it. It is not a
         guest declining dinner, and counting it as one drags every take-up
         figure towards zero on a half full week. */
      if (r.status !== 'in' && r.status !== 'out') continue;
      replied++;
      if (r.status === 'in'){ dining++; covers += (r.pax||1); }
      if (r.diets && r.diets.length) diets = diets.concat(r.diets);
    }
    if (!replied) return;

    nights.push({
      date: date,
      group: menus[date] ? groupOf(menus[date].main) : null,
      covers: covers, dining: dining, replied: replied, diets: diets
    });
  });

  if (!nights.length){
    document.getElementById('range').textContent = 'No data recorded yet';
    document.getElementById('byProtein').innerHTML =
      '<div class="note">Statistics build up as menus are published and guests reply. ' +
      'Come back after a few weeks of service.</div>';
    return;
  }

  document.getElementById('range').textContent =
    nights.length + (nights.length===1?' night':' nights') + ' recorded';

  // headline
  var totalCovers = nights.reduce(function(t,n){ return t+n.covers; }, 0);
  document.getElementById('hCovers').textContent = Math.round(totalCovers / nights.length);

  // by protein
  var byG = {};
  nights.forEach(function(n){
    if (!n.group) return;
    if (!byG[n.group]) byG[n.group] = { nights:0, dining:0, replied:0, covers:0 };
    var g = byG[n.group];
    g.nights++; g.dining += n.dining; g.replied += n.replied; g.covers += n.covers;
  });

  var rowsG = Object.keys(byG).map(function(k){
    var g = byG[k];
    return { name:k, rate: g.replied ? g.dining/g.replied : 0,
             avg: g.covers/g.nights, nights:g.nights };
  }).sort(function(a,b){ return b.rate - a.rate; });

  var elG = document.getElementById('byProtein');
  if (!rowsG.length){
    elG.innerHTML = '<div class="note">No menus recorded yet. This fills in from the next published menu onwards.</div>';
  } else {
    rowsG.forEach(function(r){
      var pct = Math.round(r.rate*100);
      elG.insertAdjacentHTML('beforeend',
        '<div class="stat"><div style="flex:1">'+
          '<div class="stat-name">'+r.name+'</div>'+
          '<div class="stat-sub">'+r.nights+(r.nights===1?' night':' nights')+
            ' \u00b7 '+r.avg.toFixed(1)+' covers avg</div>'+
          '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
        '</div><div class="stat-val">'+pct+'%</div></div>');
    });
  }

  // by weekday
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var byD = {};
  nights.forEach(function(n){
    var p = n.date.split('-');
    var wd = days[new Date(+p[0], +p[1]-1, +p[2]).getDay()];
    if (!byD[wd]) byD[wd] = { nights:0, covers:0 };
    byD[wd].nights++; byD[wd].covers += n.covers;
  });
  var rowsD = Object.keys(byD).map(function(k){
    return { name:k, avg: byD[k].covers/byD[k].nights, nights:byD[k].nights };
  }).sort(function(a,b){ return b.avg - a.avg; });

  var maxD = rowsD.length ? rowsD[0].avg : 1;
  var elD = document.getElementById('byDay');
  rowsD.forEach(function(r){
    elD.insertAdjacentHTML('beforeend',
      '<div class="stat"><div style="flex:1">'+
        '<div class="stat-name">'+r.name+'</div>'+
        '<div class="stat-sub">'+r.nights+(r.nights===1?' night':' nights')+'</div>'+
        '<div class="bar"><i style="width:'+Math.round(maxD ? r.avg/maxD*100 : 0)+'%"></i></div>'+
      '</div><div class="stat-val">'+r.avg.toFixed(1)+'</div></div>');
  });

  // dietaries
  var byDiet = {};
  nights.forEach(function(n){
    n.diets.forEach(function(d){ byDiet[d] = (byDiet[d]||0)+1; });
  });
  var rowsDiet = Object.keys(byDiet).map(function(k){
    return { name:k, n:byDiet[k] };
  }).sort(function(a,b){ return b.n - a.n; }).slice(0,8);

  var elDiet = document.getElementById('byDiet');
  if (!rowsDiet.length){
    elDiet.innerHTML = '<div class="empty">None recorded</div>';
  } else {
    var maxDiet = rowsDiet[0].n;
    rowsDiet.forEach(function(r){
      elDiet.insertAdjacentHTML('beforeend',
        '<div class="stat"><div style="flex:1">'+
          '<div class="stat-name">'+r.name+'</div>'+
          '<div class="bar"><i style="width:'+Math.round(r.n/maxDiet*100)+'%"></i></div>'+
        '</div><div class="stat-val">'+r.n+'</div></div>');
    });
  }
});
</script>
</body>
</html>
