<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nala Villas">
<link rel="apple-touch-icon" href="nala-icon.png?v=1">
<title>Nala &middot; Chat</title>
<link rel="stylesheet" href="nala-ui2.css?v=11">
<link rel="stylesheet" href="nala-ui.css?v=18">
<style>
  /* Built 29 Sep from mock-guest-contact.html, the owner's brief of that
     day: every guest by booking - Upcoming, In-house, Past - with one
     conversation each, SMS or WhatsApp, and every message they send sorted
     into no task or a task for a team. GUEST-CONTACT.md is the brief. The
     list's dress is the Pre-arrival SMS page's, copied rather than
     approximated, so the desk's boards read alike. */
  body { padding:calc(24px + env(safe-area-inset-top)) 18px 0; }

  /* Upcoming, In-house, Past: the Pre-arrival page's knob, one more job. */
  .knob { display:flex; border:1px solid var(--rule); border-radius:8px;
          overflow:hidden; margin-bottom:12px; }
  .knob button { flex:1; display:inline-flex; align-items:center; justify-content:center;
                 gap:6px; padding:9px 0; font-family:var(--ui-font); font-size:var(--t2);
                 background:none; border:none; color:var(--mid); cursor:pointer; }
  /* How many wait on the desk: the menu's action icon, the same dress. */
  .cnt { flex:0 0 auto; min-width:20px; height:20px; padding:0 6px;
         border-radius:var(--pill); background:var(--accent); color:var(--accent-ink);
         font-size:var(--t1); display:inline-flex; align-items:center;
         justify-content:center; font-variant-numeric:tabular-nums; }
  .cnt:empty { display:none; }
  .find { margin-bottom:2px; }
  .grp { font-size:var(--t1); color:var(--mid); margin:14px 2px 6px; }
  .empty { font-size:var(--t2); color:var(--mid); margin:14px 2px; line-height:1.5; }

  .vrow { display:flex; align-items:center; gap:12px; width:100%;
          border:1px solid var(--rule); border-radius:8px; padding:11px 13px;
          margin-bottom:7px; text-align:left; font-family:var(--ui-font);
          color:inherit; cursor:pointer; }
  .vrow .v { flex:0 0 auto; font-size:var(--t4); min-width:30px; text-align:center; }
  .vrow .mid { flex:1; min-width:0; }
  .vrow .l1 { gap:8px; }
  .vrow .nm { font-size:var(--t3); }
  .vrow .tm { font-size:var(--t2); color:var(--mid); margin-left:auto; }
  .vrow .l2 { display:flex; align-items:center; gap:8px; margin-top:3px; }
  /* A preview is a message cut short, like a name: it may trim. The time
     and the count beside it never do (the trim rule, STYLEGUIDE.md). */
  .vrow .pv { flex:1 1 auto; min-width:0; font-size:var(--t2); color:var(--mid);
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vrow .l3 { font-size:var(--t1); color:var(--mid); margin-top:3px; }
  .vrow .l3 .open { color:var(--law-amber-ink); }
  /* The states, colour-law tokens and nothing else (CLAUDE.md): a message
     nobody has sorted is work to do, white; a task still open is amber,
     chase this; only we have written is the waiting grey; nothing sent, or
     no number, is sunk. All sorted is plain white too, not the done green
     (the owner, 30 Sep: "Otherwise, all the cards would be green"): most
     conversations end sorted, so green would paint nearly the whole list
     and single nothing out. Its band, All done, tells it from New. */
  .vrow.b-task { background:var(--law-amber); border-color:var(--law-amber-b); }
  .vrow.b-none, .vrow.b-nophone { border-style:dashed; opacity:.62; }
  .vrow:disabled { cursor:default; }

  /* ── one conversation ── */
  .ctx { font-size:var(--t2); color:var(--mid); line-height:1.5; margin:-6px 2px 0; }
  .ctx a { color:var(--mid); }
  .evrow { display:flex; align-items:center; justify-content:space-between; gap:12px;
           margin:12px 2px 0; font-size:var(--t2); color:var(--mid); }
  /* The switch, blue when on: STYLEGUIDE.md's fifth thing that is not a
     button. It is the guest's consent, saved on press. */
  .sw { flex:0 0 auto; width:44px; height:26px; border:0; border-radius:var(--pill);
        background:var(--card); position:relative; cursor:pointer; }
  .sw::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px;
               border-radius:50%; background:var(--surface, #fff);
               box-shadow:0 1px 2px rgba(28,28,26,.25); transition:left .15s ease; }
  .sw.on { background:var(--accent); }
  .sw.on::after { left:21px; }
  /* The iPhone's own conversation (the owner, 30 Sep, with a screenshot of
     his Messages: "follow the iPhone standard", not a white bubble): the
     time centred over each stretch of talk, theirs on the iPhone's grey
     and ours on its blue, a tail on the last bubble of a run. Sides, not
     states: neither colour is one the law spends, and blue is no family
     colour_suite polices. The blue deepens to the foot of each bubble, as
     the iPhone's does down the screen; per bubble, not fixed to the
     screen, because Safari on the iPhone ignores a fixed background; and
     it is deepest from the tail's height down, so the tail matches the
     foot it curls from. */
  .day { text-align:center; font-size:var(--t1); color:#8E8E93; margin:20px 0 8px; }
  .day .dw { font-weight:600; }
  .msg { display:flex; flex-direction:column; max-width:80%; margin:0 0 12px; }
  .msg.in  { align-items:flex-start; margin-right:auto; margin-left:8px; }
  .msg.out { align-items:flex-end; margin-left:auto; margin-right:8px; }
  .msg.run { margin-bottom:3px; }
  .bub { position:relative; z-index:0; padding:8px 13px; border-radius:18px; font-size:var(--t3);
         line-height:1.36; overflow-wrap:anywhere; }
  .msg.in .bub  { background:#E9E9EB; color:#000; }
  .msg.out .bub { background:#0A84FF linear-gradient(#2A9DFC, #0A84FF calc(100% - 20px)); color:#fff; }
  /* the tail: a curl of the bubble's own colour, cut by the page's */
  .msg.end .bub::before, .msg.end .bub::after { content:''; position:absolute; z-index:-1;
                                                bottom:0; height:20px; }
  .msg.in.end .bub::before  { left:-7px; width:20px; background:#E9E9EB;
                              border-bottom-right-radius:15px; }
  .msg.in.end .bub::after   { left:-10px; width:10px; background:var(--ground, #fff);
                              border-bottom-right-radius:10px; }
  .msg.out.end .bub::before { right:-7px; width:20px; background:#0A84FF;
                              border-bottom-left-radius:15px; }
  .msg.out.end .bub::after  { right:-10px; width:10px; background:var(--ground, #fff);
                              border-bottom-left-radius:10px; }
  .meta { font-size:var(--t1); color:#8E8E93; margin-top:3px; padding:0 4px; }
  .meta .bad { color:var(--law-red); }
  .photo { display:block; max-width:210px; width:100%; min-height:40px; border-radius:10px;
           margin:0 0 8px; }
  .photo.wait { font-size:var(--t1); color:var(--mid); }

  /* What a guest's message became, under it. A tinted pill is a status and
     is never tapped; the buttons beside it are quiet rectangles, because
     Send stays the one primary on this screen (the button law). */
  .tri { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:6px 0 0 2px; }
  .tri .lbl { font-size:var(--t2); color:var(--mid); margin-right:2px; }
  /* A task's note: typed in the picker or on the open task, an editable
     surface (white) the width of the row, and read back under the pills. */
  .tri .tnote { flex:1 1 100%; min-height:40px; padding:8px 10px; border:1px solid var(--rule);
                border-radius:8px; background:#fff; font-family:var(--ui-font);
                font-size:var(--t2); color:var(--ink); }
  .tri .tnoterow { flex:1 1 100%; display:flex; flex-wrap:wrap; gap:6px; }
  .tri .tnoteline { flex:1 1 100%; font-size:var(--t2); line-height:1.4; color:var(--ink); }
  .tp { display:inline-flex; align-items:center; min-height:28px; padding:0 10px;
        border-radius:var(--pill); border:1px solid; font-size:var(--t2); }
  .tp.open { background:var(--law-amber); border-color:var(--law-amber-b); color:var(--law-amber-ink); }
  .tp.done { background:var(--law-save-bg); border-color:var(--law-save-bdr); color:var(--law-save-ink); }
  /* Task, No task, Done, Note: buttons, bordered as buttons are (the owner,
     30 Sep: "Creating a task is a button and should be bordered like a
     button"), square-cornered, so they read apart from the round status
     pills beside them, which are never tapped. */
  .sbtn { display:inline-flex; align-items:center; justify-content:center; min-height:36px;
          padding:0 14px; border:1px solid rgba(95,95,88,.4); border-radius:var(--r);
          background:var(--surface, #fff); font-family:var(--ui-font); font-size:var(--t2);
          color:var(--ink); cursor:pointer; }
  .sbtn.saving { background:var(--law-wait); color:var(--mid); }
  .trifail { flex-basis:100%; font-size:var(--t2); color:var(--law-red); }

  .compose { margin-top:18px; }
  .win { font-size:var(--t2); color:var(--mid); margin:0 2px 8px; line-height:1.45; }
  /* Templates sits on the line that says which way a message goes (the
     owner, 30 Sep: "we should have access to all the templates from the
     send area"). A button, so bordered as one. */
  .winrow { display:flex; align-items:flex-start; gap:10px; margin:0 2px 8px; }
  .winrow .win { flex:1; margin:0; }
  .winrow .sbtn { flex:0 0 auto; }
  .sheet .tg { font-size:var(--t2); font-weight:600; margin:16px 0 6px; }
  .sheet .tw { font-size:var(--t2); color:var(--mid); line-height:1.45; margin:0 0 6px; }
  .sheet .tbtns { display:flex; flex-wrap:wrap; gap:8px; }
  .win b { font-weight:600; color:var(--ink); }
  .compose textarea { min-height:96px; line-height:1.45; resize:vertical; display:block; }
  .tpls { display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 12px; }
  .chip { display:inline-flex; align-items:center; min-height:36px; padding:0 14px;
          border:1px solid var(--rule); border-radius:var(--pill);
          font-family:var(--ui-font); font-size:var(--t2); color:var(--ink); cursor:pointer; }
  .prev { margin:0 0 4px auto; }
  /* the approved words, before they go: the blue's tint, dashed, so a
     preview is never taken for a message already sent */
  .msg.out.prev .bub { background:linear-gradient(rgba(10,132,255,.1), rgba(10,132,255,.1)),
                         var(--surface, #fff); color:var(--ink); border:1px dashed #0A84FF; }
  /* Test mode is the attention colour: the page works, and nothing leaves
     for a guest. The Worker says so; this only repeats it. */
  .testbar { display:none; margin:0 0 12px; padding:10px 12px; border-radius:8px;
             background:var(--law-amber); border:1px solid var(--law-amber-b);
             color:var(--law-amber-ink); font-size:var(--t2); line-height:1.45; }
  .testbar.show { display:block; }
  /* The setup check (30 Sep), the admin's and the manager's: what the
     Worker finds wrong, in its words, while test mode is on or anything
     fails. A line to fix is failure's red; a working one the done green;
     the rest only so you know. */
  .setup { display:none; margin:0 0 12px; padding:12px 13px; border-radius:8px;
           border:1px solid var(--rule); background:var(--surface, #fff); }
  .setup.show { display:block; }
  body.paper .setup { box-shadow:var(--lift); }
  .setup .st { font-size:var(--t2); font-weight:600; margin-bottom:6px; }
  .setup .sr { display:flex; gap:8px; font-size:var(--t2); line-height:1.45; margin-top:5px; color:var(--ink); }
  .setup .sr .mk { flex:0 0 14px; text-align:center; font-weight:600; }
  .setup .sr.ok .mk { color:var(--law-save-ink); }
  .setup .sr.bad, .setup .sr.bad .mk { color:var(--law-red); }
  .setup .sr.info .mk, .setup .sr.info { color:var(--mid); }
  .setup .sbtn { margin-top:10px; }
  /* Delete, the admin's (30 Sep): tap a message for it, and a sheet asks
     first - the button law's terracotta, which always confirms. */
  .msg .bub { cursor:default; }
  .msg.pick-del .bub { outline:2px solid var(--law-terra-b); outline-offset:2px; }
  .delrow { display:flex; gap:6px; margin:6px 0 0; }
  .delrow .btn { width:auto; min-height:36px; padding:0 14px; font-size:var(--t2); }
  .backdrop { position:fixed; inset:0; background:rgba(28,28,26,.35); display:none;
              align-items:flex-end; z-index:50; }
  .backdrop.show { display:flex; }
  .sheet { background:var(--surface, #fff); width:100%; max-width:var(--appw); margin:0 auto;
           border-radius:14px 14px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
           max-height:88vh; overflow-y:auto; }
  .sheet .st { font-size:var(--t3); font-weight:600; margin-bottom:6px; }
  .sheet .sub { font-size:var(--t2); color:var(--mid); line-height:1.45; margin-bottom:14px; }
  .sheet .said { margin:0 0 16px; padding:8px 13px; border-radius:18px; background:#E9E9EB;
                 color:#000; font-size:var(--t3); line-height:1.36; overflow-wrap:anywhere;
                 white-space:pre-wrap; width:fit-content; max-width:85%; }
  .sheet .btn { margin-top:8px; }
  .sheet .err { font-size:var(--t2); color:var(--law-red); line-height:1.45; margin-top:10px; }
  #errBar { font-size:var(--t2); color:var(--law-red); margin:10px 2px; line-height:1.45; }
  /* A conversation's box and its Send sit at the END of the conversation,
     where the newest message is, not pinned to the screen: a pinned Send
     floated over the messages while the box it sends stayed out of sight.
     The page opens scrolled to the bottom instead. */
  #threadView .foot { position:static; margin-bottom:calc(12px + env(safe-area-inset-bottom)); }
  #sendErr { margin:8px 2px 0; }

/* ── paper ───────────────────────────────────────────────────────────
   The ground and its tokens live in nala-ui2.css. Every card and row is a
   solid white surface lifted off the paper, its state's tint drawn over the
   white, the same colour it always was; the sunk rows are white and not
   lifted, so they still recede (the owner, 27 Sep). */
body.paper .knob { background:var(--surface); }
body.paper .vrow { background:var(--surface); box-shadow:var(--lift); }
body.paper .vrow.b-task { background:var(--law-amber); }
body.paper .vrow.b-sent { background:linear-gradient(var(--law-wait), var(--law-wait)), var(--surface); }
body.paper .vrow.b-none, body.paper .vrow.b-nophone { background:var(--surface); box-shadow:none; }
body.paper .chip { background:var(--surface); }
body.paper .chip.on { background:linear-gradient(var(--sel-bg), var(--sel-bg)), var(--surface); }
</style>
</head>

<script>
var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";

/* The messenger: worker/guest-contact.js, a Worker of its own so the SMS
   pages' Worker and the texts they send are not touched while this is
   built and tested (the owner, 29 Sep). The page proposes; the Worker
   decides the channel, the 24 hours, the approved words and the test list. */

(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
})();
function navFilter(role){ if (window.NALA_NAVFILTER) NALA_NAVFILTER(role); }

/* ── the page in one paragraph ────────────────────────────────
   Two views on one page. The list: every guest by booking, the tab their
   dates put them in, the colour contactRowState gives their conversation.
   A conversation (?c=<number>): everything said to and by that guest, and
   under each of their messages what it became - no task, or a task for a
   team - with the box to answer below. Nothing here decides a state; the
   shared readers in nala-shared.js do, and the Worker decides what may go. */
var Q = new URLSearchParams(location.search);
var CK = /^[1-9][0-9]{7,14}$/.test(Q.get('c') || '') ? Q.get('c') : null;
var BK = /^[A-Za-z0-9-]{4,64}$/.test(Q.get('b') || '') ? Q.get('b') : null;
var TAB = { up:1, 'in':1, past:1 }[Q.get('t')] ? Q.get('t') : 'in';
var WINDOW_DAYS = 30;       /* how far Upcoming looks ahead and Past looks back */
var HELLO = null;           /* the Worker's hello: set up? WhatsApp? test mode? */
var DATA = null;            /* the list's reads */
var PICK = null;            /* the message whose Task picker is open */
var NOTEED = null;          /* 'team/task' whose note is being written */
var VIA = '';               /* 'sms' once the desk chose SMS over an approved message */
var TPL = 'question';       /* the approved message chosen */
var PICKT = null;           /* an SMS page's template, chosen to send from here */
var READFAIL = false;

function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; });
}
function plusDays(n){ var d = new Date(); d.setDate(d.getDate() + n); return dkey(d); }
function keyOf(s){ var d = parseDepDate(s); return d ? dkey(d) : ''; }
var WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayWords(key){
  var d = parseDepDate(key); if (!d) return '';
  return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MO[d.getMonth()];
}
/* When a message was: the time today, the weekday this week, else the day. */
function whenShort(iso){
  var d = parseISO(iso); if (!d) return '';
  var k = dkey(d);
  if (k === dkey(new Date())) return timeOf(iso);
  if (k > plusDays(-6)) return WD[d.getDay()];
  return d.getDate() + ' ' + MO[d.getMonth()];
}
function whoOf(email){
  var n = displayNameOf(email);
  return n ? n.split(/\s+/)[0] : '';
}
function prettyPhone(e){
  var m = /^\+614(\d{2})(\d{3})(\d{3})$/.exec(e || '');
  return m ? '04' + m[1] + ' ' + m[2] + ' ' + m[3] : String(e || '');
}

/* ── reading ─────────────────────────────────────────────────── */
function whole(path, q){
  return fetch(DB + path + '.json?' + (q ? q + '&' : '') + 'v=' + Date.now()).then(function(r){
    if (!r.ok) throw new Error(path + ' HTTP ' + r.status);
    return r.json();
  });
}
/* Every team's open tasks, the retired included: a team only retires with
   nothing open, and a list that could hide a task is worse than one more
   read. */
function openTasks(){
  return contactOpenTasks(contactTeams(SETTINGS, true).map(function(t){ return t.key; }));
}

/* The bookings in the window, off the nights (/stays), with the number the
   desk corrected (/phonefix) outranking Mews' copy - the SMS pages' rule.
   A booking's tab is its dates against today: arriving after today is
   Upcoming, leaving before today is Past, anything between is In-house,
   the morning of a departure included. */
function bookingsFrom(nights, fixes){
  var today = dkey(new Date()), out = {};
  Object.keys(nights || {}).sort().forEach(function(d){
    var villas = nights[d] || {};
    Object.keys(villas).forEach(function(v){
      var s = villas[v];
      if (!s || typeof s !== 'object' || !s.id) return;
      var b = out[s.id];
      if (!b) b = out[s.id] = { id: s.id, first: s.first || '', last: s.last || '',
                                raw: s.phone || '', arrive: keyOf(s.arrive) || d,
                                depart: keyOf(s.depart), villa: String(v), first_night: d,
                                last_night: d, adults: s.adults };
      b.last_night = d;
      if (d <= today) b.villa = String(v);   /* the villa they are in now */
    });
  });
  Object.keys(out).forEach(function(id){
    var b = out[id], fix = fixes && fixes[id];
    if (!b.depart) b.depart = dkey(new Date(parseDepDate(b.last_night).getTime() + 86400000));
    b.phoneRaw = String((fix && fix.phone) || b.raw || '').trim();
    b.ck = contactKey(b.phoneRaw);
    b.name = (b.first + ' ' + b.last).trim() || 'Guest';
    b.tab = b.arrive > today ? 'up' : b.depart < today ? 'past' : 'in';
  });
  return out;
}

/* Each read at its own pace: a guest's message can land any second, a
   booking moves only when the Mews sync runs, every five minutes. So two
   months of nights are read every five minutes, not with every poll, and
   the list reads only the threads that moved in its window - an open page
   must not pull the whole resort through the database every few seconds. */
var STAYS_MS = 5 * 60 * 1000;
var STAYS = null, STAYS_AT = 0;
var SETTINGS = null;        /* /contactsettings: the teams, read at the bookings' pace */
function loadStays(){
  if (STAYS && Date.now() - STAYS_AT < STAYS_MS) return Promise.resolve(STAYS);
  var from = plusDays(-WINDOW_DAYS), to = plusDays(WINDOW_DAYS);
  return Promise.all([
    whole('/stays', 'orderBy=' + encodeURIComponent('"$key"') +
          '&startAt=' + encodeURIComponent('"' + from + '"') +
          '&endAt=' + encodeURIComponent('"' + to + '"')),
    whole('/phonefix'), whole('/contactsettings')
  ]).then(function(res){
    var nights = {};
    Object.keys(res[0] || {}).forEach(function(d){
      if (d >= from && d <= to) nights[d] = res[0][d];
    });
    STAYS = bookingsFrom(nights, res[1] || {});
    SETTINGS = res[2] || {};
    STAYS_AT = Date.now();
    return STAYS;
  });
}
/* The threads that moved in the window. An older one, a guest from last
   season, is not the list's business: opening it reads it whole. */
function recentThreads(){
  var since = plusDays(-WINDOW_DAYS);
  return whole('/contact', 'orderBy=' + encodeURIComponent('"lastAt"') +
               '&startAt=' + encodeURIComponent('"' + parseDepDate(since).toISOString() + '"'))
    .then(function(j){
      var out = {};
      Object.keys(j || {}).forEach(function(ck){
        var d = j[ck] && parseISO(j[ck].lastAt);
        if (d && dkey(d) >= since) out[ck] = j[ck];
      });
      return out;
    });
}
/* The bookings first, for the teams they bring: which teams' tasks to read
   is theirs to say. After the first load they come from memory. */
function loadAll(){
  return loadStays().then(function(bookings){
    return Promise.all([recentThreads(), whole('/contactnew'), openTasks()]).then(function(res){
      DATA = { bookings: bookings, threads: res[0], fresh: res[1] || {}, tasks: res[2] };
      return DATA;
    });
  });
}

/* The open tasks of one guest, from whichever teams hold them. */
function tasksOf(ck){
  var out = [];
  contactTeams(SETTINGS, true).forEach(function(t){
    var m = (DATA.tasks || {})[t.key] || {};
    Object.keys(m).forEach(function(id){
      if (m[id].ck === ck) out.push({ team: t.key, id: id, rec: m[id] });
    });
  });
  return out;
}
function freshOf(ck){ return Object.keys((DATA.fresh || {})[ck] || {}).length; }

/* ── the list ────────────────────────────────────────────────── */
var ORDER = ['fresh','task','sent','done','none','nophone'];
var BAND = { fresh:'New', task:'Task open', sent:'Sent, no reply', done:'All done',
             none:'No messages', nophone:'No messages' };

function rowsOf(){
  var rows = [], seen = {};
  var today = dkey(new Date()), since = plusDays(-WINDOW_DAYS);
  Object.keys(DATA.bookings).forEach(function(id){
    var b = DATA.bookings[id];
    var t = b.ck ? DATA.threads[b.ck] : null;
    if (b.ck) seen[b.ck] = true;
    rows.push({ b: b, ck: b.ck, t: t, tab: b.tab,
                state: contactRowState(t, b.ck ? freshOf(b.ck) : 0,
                                       b.ck ? tasksOf(b.ck).length : 0, !!b.ck) });
  });
  /* A number on no booking in the window - a caller about dinner, a guest
     from months ago - still lands here, on In-house, its number for a name. */
  Object.keys(DATA.threads).forEach(function(ck){
    var t = DATA.threads[ck];
    if (seen[ck] || !t || !t.lastAt) return;
    var d = parseISO(t.lastAt);
    if (!d || dkey(d) < since) return;
    rows.push({ b: null, ck: ck, t: t, tab: 'in',
                state: contactRowState(t, freshOf(ck), tasksOf(ck).length, true) });
  });
  return rows;
}
function lastMs(r){ var d = r.t && parseISO(r.t.lastAt); return d ? d.getTime() : 0; }
function rowName(r){
  if (r.b) return r.b.name;
  return (r.t && r.t.profile) ? r.t.profile : prettyPhone(r.t && r.t.phone || '+' + r.ck);
}
function stayWords(r){
  var b = r.b;
  if (!b) return 'not on any booking';
  if (b.tab === 'up'){
    var n = Math.round((parseDepDate(b.depart) - parseDepDate(b.arrive)) / 86400000);
    return 'arrives ' + dayWords(b.arrive) + (n > 0 ? ' · ' + n + (n === 1 ? ' night' : ' nights') : '');
  }
  if (b.tab === 'past') return 'left ' + dayWords(b.depart);
  return 'leaves ' + dayWords(b.depart);
}
function chWord(t){
  if (!t) return '';
  if (t.optout) return 'Opted out';
  return (t.lastInCh === 'wa' || waAgreed(t)) ? 'WhatsApp' : 'SMS';
}
function rowHTML(r, showTab){
  var n = r.ck ? freshOf(r.ck) : 0, open = r.ck ? tasksOf(r.ck) : [];
  var pv = r.state === 'nophone' ? 'No mobile number on the booking'
         : !r.t || !r.t.lastAt ? 'Nothing sent yet'
         : (r.t.dir === 'out' ? 'You: ' : '') + (r.t.preview || '');
  var l3 = [];
  if (showTab) l3.push({ up:'Upcoming', 'in':'In-house', past:'Past' }[r.tab]);
  if (chWord(r.t)) l3.push(chWord(r.t));
  l3.push(stayWords(r));
  var teams = {};
  open.forEach(function(x){ teams[teamLabel(x.team, SETTINGS)] = true; });
  var openWords = Object.keys(teams).length
    ? ' · <span class="open">' + esc(Object.keys(teams).join(', ')) + ' open</span>' : '';
  return '<button class="vrow b-' + r.state + '" data-ck="' + esc(r.ck || '') +
         '" data-b="' + esc(r.b ? r.b.id : '') + '" data-state="' + r.state + '"' +
         (r.state === 'nophone' ? ' disabled' : '') + '>' +
    '<div class="v">' + esc(r.b ? r.b.villa : '?') + '</div><div class="mid">' +
    /* A name may trim; a number standing in for one never does. */
    '<div class="l1 trimrow"><span class="nm' + (r.b || (r.t && r.t.profile) ? ' trim' : '') + '">' +
    esc(rowName(r)) + '</span>' +
    '<span class="tm">' + esc(r.t ? whenShort(r.t.lastAt) : '') + '</span></div>' +
    '<div class="l2"><span class="pv">' + esc(pv) + '</span>' +
    (n ? '<span class="cnt">' + n + '</span>' : '') + '</div>' +
    '<div class="l3">' + esc(l3.join(' · ')) + openWords + '</div></div></button>';
}

function drawList(){
  var rows = rowsOf(), board = document.getElementById('board');
  var q = document.getElementById('find').value.trim().toLowerCase();
  var counts = { up:0, 'in':0, past:0 };
  rows.forEach(function(r){ if (r.state === 'fresh') counts[r.tab]++; });
  document.getElementById('cUp').textContent = counts.up || '';
  document.getElementById('cIn').textContent = counts['in'] || '';
  document.getElementById('cPast').textContent = counts.past || '';
  [].forEach.call(document.querySelectorAll('#knob button'), function(b){
    b.className = b.getAttribute('data-tab') === TAB && !q ? 'on' : '';
    b.setAttribute('aria-pressed', b.getAttribute('data-tab') === TAB && !q);
  });
  /* A search reaches all three tabs: a guest is found by name, villa or
     number wherever their dates put them. */
  var shown = rows.filter(function(r){
    if (!q) return r.tab === TAB;
    var hay = [rowName(r), r.b ? r.b.villa : '', r.ck || '',
               r.b ? r.b.phoneRaw : '', r.t && r.t.profile || ''].join(' ').toLowerCase();
    if (/^\d{1,2}$/.test(q)) return !!r.b && r.b.villa === q;
    return hay.indexOf(q) > -1 || (q.replace(/\D/g, '').length > 3 &&
           (r.ck || '').indexOf(q.replace(/\D/g, '').replace(/^0/, '')) > -1);
  });
  shown.sort(function(a, b){
    return ORDER.indexOf(a.state) - ORDER.indexOf(b.state) || lastMs(b) - lastMs(a) ||
           (+(a.b && a.b.villa) || 99) - (+(b.b && b.b.villa) || 99);
  });
  if (!shown.length){
    board.innerHTML = '<div class="empty">' + (q ? 'Nobody matches that.'
      : { up:'Nobody arriving in the next ' + WINDOW_DAYS + ' days.',
          'in':'Nobody in house.', past:'Nobody has left in the last ' + WINDOW_DAYS + ' days.' }[TAB]) + '</div>';
    return;
  }
  var h = '', band = null;
  shown.forEach(function(r){
    var name = BAND[r.state];
    if (name !== band){
      band = name;
      var n = shown.filter(function(x){ return BAND[x.state] === name; }).length;
      h += '<div class="grp">' + esc(name) + ' · ' + n + '</div>';
    }
    h += rowHTML(r, !!q);
  });
  board.innerHTML = h;
}
document.getElementById('knob').onclick = function(e){
  var b = e.target.closest('button'); if (!b) return;
  TAB = b.getAttribute('data-tab');
  document.getElementById('find').value = '';
  history.replaceState(null, '', 'guest-contact.html?t=' + TAB);
  drawList();
};
document.getElementById('find').oninput = function(){ if (DATA) drawList(); };
document.getElementById('board').onclick = function(e){
  var r = e.target.closest('.vrow'); if (!r || r.disabled) return;
  var q = 'c=' + r.getAttribute('data-ck') + (r.getAttribute('data-b') ? '&b=' + r.getAttribute('data-b') : '') +
          '&t=' + TAB;
  location.href = 'guest-contact.html?' + q;
};

/* ── one conversation ────────────────────────────────────────── */
var TH = { t: null, msgs: {}, fresh: {}, tasks: {}, b: null, sent: [] };

/* The booking this number belongs to: the one named in the address when it
   is this guest's, else the best the window holds - in house first, then
   the next arrival, then the latest departure. */
function bookingFor(ck){
  var all = STAYS || {}, pick = null;
  if (BK && all[BK] && all[BK].ck === ck) return all[BK];
  var rank = { 'in':0, up:1, past:2 };
  Object.keys(all).forEach(function(id){
    var b = all[id];
    if (b.ck !== ck) return;
    if (!pick || rank[b.tab] < rank[pick.tab] ||
        (b.tab === pick.tab && (b.tab === 'up' ? b.arrive < pick.arrive : b.depart > pick.depart))) pick = b;
  });
  return pick;
}

/* Every text the SMS pages sent this number - the pre-arrival form, spa
   reminders, the dinner invitations, an outside guest's invitation - so
   the whole stay reads in one place (the owner, 30 Sep: "every outgoing
   and incoming message including dinner invitations and pre-arrival
   form"). Read, never written: those pages own their records. A text sent
   again keeps the one it replaced under earlier (send-invites.js), so both
   are here. A number on no booking can only have been an outside guest,
   so its last fortnight of /extinvites is read instead. */
function smsPageSends(b, phone){
  var reads = [], kinds = [], today = dkey(new Date());
  function read(path, kind){
    reads.push(whole(path).catch(function(){ return null; })); kinds.push(kind);
  }
  var d, i;
  if (b){
    read('/previnvites/' + b.id, 'pre');
    read('/spareminders/' + b.id, 'spa');
    var end = b.depart < today ? b.depart : today;
    for (d = parseDepDate(b.arrive), i = 0; d && dkey(d) <= end && i < 14; i++){
      read('/invites/' + dkey(d), 'night'); d = new Date(d.getTime() + 86400000);
    }
  } else {
    for (d = parseDepDate(today), i = 0; d && i < 14; i++){
      read('/extinvites/' + dkey(d), 'night'); d = new Date(d.getTime() - 86400000);
    }
  }
  return Promise.all(reads).then(function(res){
    var out = [];
    function one(rec, kind){
      if (!rec || typeof rec !== 'object' || !rec.sentAt) return;
      if (rec.to && normalisePhone(rec.to) !== phone) return;
      out.push({ dir:'out', ch:'sms', body: rec.body || '', at: rec.sentAt, by: rec.by || '',
                 kind: kind, page: true,
                 status: rec.status === 'failed' ? 'failed'
                       : rec.delivery === 'failed' ? 'undelivered'
                       : rec.delivery === 'delivered' ? 'delivered' : 'sent',
                 err: rec.error || rec.deliveryText || '' });
    }
    function add(rec, kind){
      one(rec, kind);
      var was = rec && rec.earlier;
      if (was && typeof was === 'object')
        Object.keys(was).forEach(function(k){ one(was[k], kind); });
    }
    res.forEach(function(r, i){
      if (kinds[i] === 'pre') return add(r, 'Pre-arrival form');
      Object.keys(r || {}).forEach(function(k){
        add(r[k], kinds[i] === 'spa' ? 'Spa reminder' : 'Dinner invitation');
      });
    });
    return out;
  });
}

var SENT_AT = 0;             /* when the SMS pages' records were last read */
function loadThread(){
  return Promise.all([loadStays(), whole('/contact/' + CK), whole('/contactmsgs/' + CK),
                      whole('/contactnew/' + CK)]).then(function(res){
    TH.t = res[1] || null;
    TH.msgs = res[2] || {};
    TH.fresh = res[3] || {};
    TH.b = bookingFor(CK);
    /* Each task this guest's messages became, open or done, read by id. */
    var refs = [];
    Object.keys(TH.msgs).forEach(function(m){
      var ts = TH.msgs[m].tasks || {};
      Object.keys(ts).forEach(function(team){ refs.push([team, ts[team]]); });
    });
    return Promise.all(refs.map(function(r){
      return whole('/tasks/' + r[0] + '/' + r[1]).catch(function(){ return null; });
    })).then(function(recs){
      TH.tasks = {};
      refs.forEach(function(r, i){ TH.tasks[r[0] + '/' + r[1]] = recs[i]; });
      /* The SMS pages' records move only when those pages send: read at
         the bookings' pace. */
      if (TH.sent && Date.now() - SENT_AT < STAYS_MS) return TH.sent;
      return smsPageSends(TH.b, '+' + CK).then(function(sent){ SENT_AT = Date.now(); return sent; });
    }).then(function(sent){ TH.sent = sent; });
  });
}

function statusWords(m){
  var s = m.status || '';
  if (s === 'failed' || s === 'undelivered')
    return '<span class="bad">Not delivered' + (m.err ? ' · ' + esc(m.err) : '') + '</span>';
  if (s === 'read') return 'Read';
  if (s === 'delivered') return 'Delivered';
  if (s === 'sending') return 'Sending';
  return s ? 'Sent' : '';
}
function dayLabel(iso){
  var d = parseISO(iso); if (!d) return '';
  var k = dkey(d);
  if (k === dkey(new Date())) return 'Today';
  if (k === plusDays(-1)) return 'Yesterday';
  return dayWords(k);
}

function triHTML(id, m){
  if (m.dir !== 'in') return '';
  var h = '';
  if (PICK === id){
    /* A team this message already has a task with is not offered twice. */
    var had = m.tasks || {};
    /* What the team should know that the guest's words do not say (the
       owner, 29 Sep): optional, and editable on the task afterwards. */
    h = '<input class="tnote" id="tn-' + id + '" maxlength="300" ' +
        'placeholder="Note for the team (optional)" aria-label="Note for the team">' +
        '<span class="lbl">Task for</span>' + contactTeams(SETTINGS).filter(function(t){
      return !had[t.key]; }).map(function(t){
      return '<button class="sbtn" id="tm-' + id + '-' + t.key + '" data-act="team" data-m="' + id +
             '" data-team="' + t.key + '">' + esc(t.label) + '</button>';
    }).join('') + '<button class="sbtn" id="cx-' + id + '" data-act="cancel" data-m="' + id + '">Cancel</button>';
    return '<div class="tri">' + h + '<div class="trifail" id="tf-' + id + '"></div></div>';
  }
  if (TH.fresh[id]){
    return '<div class="tri"><button class="sbtn" id="nt-' + id + '" data-act="notask" data-m="' + id +
           '">No task</button><button class="sbtn" id="tk-' + id + '" data-act="pick" data-m="' + id +
           '">Task</button><div class="trifail" id="tf-' + id + '"></div></div>';
  }
  var ts = m.tasks || {}, notes = '';
  Object.keys(ts).forEach(function(team){
    var key = team + '/' + ts[team], rec = TH.tasks[key];
    if (rec && rec.state === 'done')
      h += '<span class="tp done">' + esc(teamLabel(team, SETTINGS)) + ' · done' +
           (rec.doneBy ? ' by ' + esc(whoOf(rec.doneBy)) : '') + '</span>';
    else if (rec)
      h += '<span class="tp open">' + esc(teamLabel(team, SETTINGS)) + ' · open</span>' +
           '<button class="sbtn" id="dn-' + id + '-' + team + '" data-act="done" data-m="' + id +
           '" data-team="' + team + '">Done</button>' +
           '<button class="sbtn" id="nb-' + id + '-' + team + '" data-act="note" data-m="' + id +
           '" data-team="' + team + '">' + (rec.note ? 'Edit note' : 'Note') + '</button>';
    if (!rec) return;
    if (NOTEED === key)
      notes += '<div class="tnoterow"><input class="tnote" id="te-' + id + '-' + team + '" maxlength="300" ' +
        'aria-label="Note for ' + esc(teamLabel(team, SETTINGS)) + '" value="' + esc(rec.note || '') + '">' +
        '<button class="sbtn" id="ns-' + id + '-' + team + '" data-act="notesave" data-m="' + id +
        '" data-team="' + team + '">Save note</button>' +
        '<button class="sbtn" data-act="notecancel" data-m="' + id + '">Cancel</button></div>';
    else if (rec.note)
      notes += '<div class="tnoteline"><span class="lbl">Note for ' + esc(teamLabel(team, SETTINGS)) +
        '</span> ' + esc(rec.note) + '</div>';
  });
  if (!Object.keys(ts).length && m.sorted)
    h += '<span class="tp done">No task · ' + esc(whoOf(m.sorted.by)) + '</span>';
  if (m.sorted)
    h += '<button class="sbtn" id="tk-' + id + '" data-act="pick" data-m="' + id + '">' +
         (Object.keys(ts).length ? 'Another task' : 'Task') + '</button>';
  return h ? '<div class="tri">' + h + notes + '<div class="trifail" id="tf-' + id + '"></div></div>' : '';
}

/* What a message was, when it was not typed here: the SMS pages' texts by
   their page, an approved WhatsApp message by its name. */
function kindOf(m){
  return m.page ? m.kind
       : m.kind === 'template' ? (CONTACT_TEMPLATES.filter(function(x){ return x.id === m.tpl; })[0] || {}).label || 'Approved message'
       : m.kind === 'fallback' ? 'Sent again by SMS: not on WhatsApp' : '';
}
/* end: the last bubble of a run, which takes the tail and says who sent it
   and how it went, as the iPhone says Delivered under its last. A failure
   is said under its own bubble, wherever it falls. */
function msgHTML(id, m, end){
  var kind = kindOf(m);
  var photos = '';
  Object.keys(m.media || {}).forEach(function(i){
    /* Drawn from the page's own copy once it has one, so a redraw does not
       fetch it again or blank it while it loads (the owner, 30 Sep: a
       guest's photo "flashing on and off"). */
    var got = PHOTOS[id + '/' + i];
    photos += got ? '<img class="photo" alt="Photo from the guest" src="' + got + '">'
            : got === null ? '<img class="photo" alt="A photo that could not be loaded">'
            : '<img class="photo wait" alt="Photo from the guest" data-m="' + esc(id) + '" data-i="' + esc(i) + '">';
  });
  var meta = [];
  if (kind) meta.push(esc(kind));
  if (m.dir === 'out' && m.by) meta.push(esc(whoOf(m.by)));
  meta.push(m.ch === 'wa' ? 'WhatsApp' : 'SMS');
  if (m.dir === 'out' && statusWords(m)) meta.push(statusWords(m));
  var bad = m.status === 'failed' || m.status === 'undelivered';
  var del = DELSEL === id && !m.page && isAdmin()
    ? '<div class="delrow"><button class="btn terra" id="dl-' + esc(id) + '" data-act="delask" data-m="' +
      esc(id) + '">Delete message</button><button class="btn" data-act="delcancel" data-m="' + esc(id) +
      '">Cancel</button></div>' : '';
  return '<div class="msg ' + (m.dir === 'in' ? 'in' : 'out') + (end ? ' end' : ' run') +
    (del ? ' pick-del' : '') + '" data-m="' + esc(id) + '">' +
    '<div class="bub">' + photos + esc(m.body).replace(/\n/g, '<br>') + '</div>' +
    (end || bad ? '<div class="meta">' + meta.join(' · ') + '</div>' : '') + del + triHTML(id, m) + '</div>';
}

var DRAWN = false;
/* What the conversation was last drawn from: the 8-second refresh redraws
   only when it has moved, so nothing on screen blinks for no reason. */
var DRAWN_SIG = '';
function threadSig(){
  return JSON.stringify([TH.t, TH.msgs, TH.tasks, TH.fresh, TH.sent, TH.b && TH.b.id, HELLO]);
}
function drawThread(){
  DRAWN_SIG = threadSig();
  /* Stay at the newest message if that is where the desk was reading. */
  var el = document.scrollingElement || document.documentElement;
  var atEnd = !DRAWN || el.scrollTop + window.innerHeight >= el.scrollHeight - 80;
  var t = TH.t || {}, b = TH.b, phone = '+' + CK;
  document.getElementById('title').textContent = b ? b.name : (t.profile || prettyPhone(phone));
  var ctx = b ? 'Villa ' + esc(b.villa) + ' · ' + esc(stayWords({ b: b })) +
                (b.adults ? ' · ' + b.adults + (b.adults === 1 ? ' guest' : ' guests') : '')
              : 'Not on any booking in the last or next ' + WINDOW_DAYS + ' days';
  ctx += '<br>' + esc(prettyPhone(phone)) + (b && canOpen(window.NALA_ROLE, 'guest.html')
         ? ' · <a href="guest.html?b=' + esc(b.id) + '">Guest profile</a>' : '');
  document.getElementById('ctx').innerHTML = ctx;
  var on = !!(t.wa && t.wa.on === true);
  var sw = document.getElementById('waSw');
  sw.className = 'sw' + (on ? ' on' : '');
  sw.setAttribute('aria-checked', on);
  /* Writing to us on WhatsApp is consent too (waAgreed), so a guest who
     did is said to have, whether or not anybody pressed the switch. */
  document.getElementById('waWords').textContent = on
    ? 'WhatsApp: asked for, ' + (t.wa.by ? whoOf(t.wa.by) + ' ' : '') + stampOf(t.wa.at)
    : t.lastInWa ? 'WhatsApp: they have written to us there'
    : 'WhatsApp: the guest asked for it';

  var all = Object.keys(TH.msgs).map(function(k){ return { id: k, m: TH.msgs[k] }; })
    .concat(TH.sent.map(function(m, i){ return { id: 'page' + i, m: m }; }));
  all.sort(function(a, b){
    var x = parseISO(a.m.at), y = parseISO(b.m.at);
    return ((x ? x.getTime() : 0) - (y ? y.getTime() : 0)) || (a.id < b.id ? -1 : 1);
  });
  /* The time over each stretch of talk, as the iPhone puts it: a new day,
     or an hour since the last message. A run is one side's messages in a
     stretch, the same sender and the same kind; a guest's message ends its
     own, since what it became is said under it. */
  var HOUR = 3600000, h = '';
  function ms(x){ var d = parseISO(x.m.at); return d ? d.getTime() : null; }
  function breaks(a, b){
    return !a || ms(a) == null || ms(b) == null || dayLabel(a.m.at) !== dayLabel(b.m.at) ||
           ms(b) - ms(a) >= HOUR;
  }
  all.forEach(function(x, i){
    if (breaks(all[i - 1], x))
      h += '<div class="day"><span class="dw">' + esc(dayLabel(x.m.at)) + '</span> ' +
           esc(timeOf(x.m.at)) + '</div>';
    var nx = all[i + 1];
    var run = !!nx && !breaks(x, nx) && x.m.dir === 'out' && nx.m.dir === 'out' &&
              (x.m.by || '') === (nx.m.by || '') && kindOf(x.m) === kindOf(nx.m) &&
              (x.m.ch || '') === (nx.m.ch || '');
    h += msgHTML(x.id, x.m, !run);
  });
  document.getElementById('msgs').innerHTML = h ||
    '<div class="empty">Nothing yet. Anything you send starts the conversation.</div>';
  loadPhotos();
  drawCompose();
  DRAWN = true;
  if (atEnd) window.scrollTo(0, el.scrollHeight);
}

/* Photos come through the Worker, which fetches them from Twilio with the
   account's credentials; the page never holds those. */
var PHOTOS = {};             /* 'message/index': the photo's object URL once fetched, null if it failed */
function loadPhotos(){
  [].forEach.call(document.querySelectorAll('img.photo.wait'), function(img){
    img.classList.remove('wait');
    var key = img.getAttribute('data-m') + '/' + img.getAttribute('data-i');
    if (key in PHOTOS) return;           /* already on its way */
    PHOTOS[key] = undefined;
    fetch(CONTACT_URL, { method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ idToken: window.__idToken, kind:'media', ck: CK,
                             m: img.getAttribute('data-m'), i: img.getAttribute('data-i') }) })
      .then(function(r){ if (!r.ok) throw new Error(); return r.blob(); })
      .then(function(b){ PHOTOS[key] = URL.createObjectURL(b); })
      .catch(function(){ PHOTOS[key] = null; })
      .then(function(){
        /* whichever copy of the img the page holds now */
        [].forEach.call(document.querySelectorAll('img.photo'), function(x){
          if (x.getAttribute('data-m') + '/' + x.getAttribute('data-i') !== key) return;
          if (PHOTOS[key]) x.src = PHOTOS[key]; else x.alt = 'A photo that could not be loaded';
        });
      });
  });
}

/* ── the SMS pages' templates, from the send area ───────────────
   The owner, 30 Sep: "we should have access to all the templates from the
   send area". Every set the Templates page keeps, each sent the way its
   own page sends it - through that page's Worker, INVITES_URL - so the
   page records it as sent, this conversation shows it, and nobody texts a
   guest a second time for want of knowing. The words are that page's,
   edited on Templates; the link is minted for this guest as it goes.

   Offered only where the page itself would send: the form to a guest
   still to arrive; tonight's menu to a villa in house tonight, once the
   menu is live (menuLive, the Invitations page's own gate); a spa reminder
   for a treatment in Spa reminders' own list (spaReminderRows) that has
   not begun. Anywhere else the sheet says why, in a line. */
var TSETS = [
  { key:'pre',  node:'/presmstemplates', name:'Pre-arrival form', page:'Pre-arrival SMS',
    how:'Goes by SMS as Pre-arrival SMS sends it, with this guest\u2019s own form link, and ' +
        'that page shows it as sent.' },
  { key:'menu', node:'/smstemplates', name:'Tonight\u2019s menu', page:'Invitations',
    how:'Goes by SMS as Invitations sends it, with this guest\u2019s own link to tonight\u2019s ' +
        'menu, and that page shows it as sent.' },
  { key:'spa',  node:'/spasmstemplates', name:'Spa reminder', page:'Spa reminders',
    how:'Goes by SMS as Spa reminders sends it, and that page shows it as sent.' }
];
var TOFFER = null;          /* what the sheet offered: set key -> templates, and the treatments */
function tmplList(db){
  return Object.keys(db || {}).map(function(k){
    var t = db[k] || {};
    return { id:k, label:String(t.label || k), body:String(t.body || ''), order:+t.order || 999 };
  }).filter(function(t){ return t.body; })
    .sort(function(a, b){ return a.order - b.order; });
}
/* The link as the guest will see it, before the Worker mints its token:
   the Templates page saves every link template with its marker at the end. */
function withLink(body, link){
  return /<(form|menu|link)>/.test(body) ? body.replace(/<(form|menu|link)>/, link)
                                          : body.replace(/\s*$/, '') + '\n' + link;
}
function templatesFor(b){
  var today = dkey(new Date());
  var tonight = !!b && b.first_night <= today && b.last_night >= today;
  var reads = TSETS.map(function(x){ return whole(x.node).catch(function(){ return undefined; }); });
  reads.push(b ? whole('/spa/' + b.id).catch(function(){ return undefined; }) : null);
  reads.push(b ? whole('/spareminders/' + b.id).catch(function(){ return undefined; }) : null);
  reads.push(tonight ? fetchMenuAnywhere(today) : null);
  return Promise.all(reads).then(function(r){
    var out = { sets:{}, why:{}, spa:[] };
    TSETS.forEach(function(x, i){
      out.sets[x.key] = tmplList(r[i]);
      if (r[i] === undefined) out.why[x.key] = 'The templates could not be read just now.';
      else if (!out.sets[x.key].length) out.why[x.key] = 'None saved yet. They are written on the Templates page.';
    });
    if (!out.why.pre && b.arrive < today) out.why.pre = 'Only before a guest arrives.';
    if (!out.why.menu){
      var m = r[5];
      if (!tonight) out.why.menu = 'Only for a guest in house tonight.';
      else if (m && m.failed) out.why.menu = 'Tonight\u2019s menu could not be checked just now.';
      else if (!menuLive(m)) out.why.menu = 'Tonight\u2019s menu is not published yet. It opens once the chef publishes.';
    }
    if (r[3] === undefined || r[4] === undefined) out.why.spa = out.why.spa || 'The spa bookings could not be read just now.';
    else {
      var spa = {}, rems = {}, bk = {};
      spa[b.id] = r[3] || {}; rems[b.id] = r[4] || {};
      bk[b.id] = { pms:{ first:b.first, last:b.last, phone:b.phoneRaw } };
      spaRemindDays().forEach(function(d){
        spaReminderRows(d, spa, rems, {}, bk, {}, Date.now()).forEach(function(row){
          if (row.state !== 'late' && row.state !== 'nophone') out.spa.push(row);
        });
      });
      if (!out.why.spa && !out.spa.length)
        out.why.spa = 'No treatment booked in the next ' + SPA_REMIND_DAYS + ' days.';
    }
    return out;
  });
}

/* Sent as its page sends it: the booking, the villa tonight, or the
   treatment, and the template's words; the Worker reads everything else
   itself and records the text where its page reads it. */
function sendTemplate(btn){
  var p = PICKT, b = TH.b, err = document.getElementById('sendErr');
  var req = { idToken: window.__idToken, template: p.id, body: p.body }, key;
  if (p.set === 'pre'){ req.kind = 'pre'; req.bookings = [b.id]; key = b.id; }
  else if (p.set === 'spa'){ req.kind = 'spa'; req.treatments = [{ b: b.id, t: p.tid }]; key = b.id + '/' + p.tid; }
  else { req.date = dkey(new Date()); req.villas = [String(b.villa)]; key = String(b.villa); }
  var late = '';
  saveFeedback(btn, function(){
    return fetch(INVITES_URL, { method:'POST', headers:{ 'Content-Type':'application/json' },
                                body: JSON.stringify(req) })
      .then(function(r){ return r.json().catch(function(){ return {}; })
        .then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        var one = res.j && res.j.results && res.j.results[key];
        var e;
        if (!res.ok || !one){
          e = new Error(res.j && res.j.error ? res.j.error : 'the sender did not answer'); e.said = true; throw e;
        }
        if (one.status === 'sent-unrecorded')
          late = 'Sent, but the record did not save, so ' +
                 (TSETS.filter(function(x){ return x.key === p.set; })[0] || {}).page + ' will not show it.';
        else if (one.status !== 'sent'){
          e = new Error(one.error || 'it did not send'); e.said = true; throw e;
        }
      });
  }, { busy:'Sending', done:'Sent', hold:400, fail: err,
       then: function(){ PICKT = null; SENT_AT = 0; var s = document.getElementById('sendBtn');
                         armSave(s); s.textContent = 'Send';
                         /* back to typing now: the refresh redraws only a
                            conversation that has moved */
                         drawCompose();
                         if (late){ err.textContent = late; err.classList.add('show'); }
                         refresh(); } });
}

/* ── sending ─────────────────────────────────────────────────── */
document.getElementById('sendBtn').onclick = function(){
  if (PICKT) return sendTemplate(this);
  var c = channelNow(), box = document.getElementById('msgBox');
  var err = document.getElementById('sendErr');
  var req = { idToken: window.__idToken, kind:'send', ck: CK, booking: TH.b ? TH.b.id : '' };
  if (c.ch === 'watpl') req.template = TPL;
  else {
    req.text = box.value.trim();
    if (!req.text){ err.textContent = 'Write the message first.'; err.classList.add('show'); return; }
    if (c.chosen) req.via = 'sms';
  }
  saveFeedback(this, function(){
    return fetch(CONTACT_URL, { method:'POST', headers:{ 'Content-Type':'application/json' },
                                body: JSON.stringify(req) })
      .then(function(r){ return r.json().catch(function(){ return {}; })
        .then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        if (!res.ok){
          var e = new Error(res.j && res.j.error ? res.j.error : 'the messenger did not answer');
          e.said = true; throw e;
        }
      });
  }, { busy:'Sending', done:'Sent', hold:400, fail: err,
       then: function(){ box.value = ''; VIA = ''; var s = document.getElementById('sendBtn');
                         armSave(s); s.textContent = 'Send'; refresh(); } });
};

/* ── the whole page ──────────────────────────────────────────── */
function refresh(){
  var err = document.getElementById('errBar');
  var p = CK ? loadThread().then(function(){ if (threadSig() !== DRAWN_SIG) drawThread(); })
             : loadAll().then(drawList);
  return p.then(function(){
    if (READFAIL){ err.textContent = ''; READFAIL = false; }
  }).catch(function(){
    READFAIL = true;
    err.textContent = 'Could not read the guests’ messages. This is usually the connection. ' +
                      'The page tries again by itself.';
  });
}
/* The setup check (30 Sep): the Worker checks each thing the setup steps
   set and says what is wrong. The admin's and the manager's; shown while
   test mode is on or anything fails, and gone once all works live. */
function setupCheck(){
  var r = normaliseRole(window.NALA_ROLE);
  if (r !== 'admin' && r !== 'manager') return;
  fetch(CONTACT_URL, { method:'POST', headers:{ 'Content-Type':'application/json' },
                       body: JSON.stringify({ idToken: window.__idToken, kind:'check' }) })
    .then(function(x){ return x.ok ? x.json() : null; })
    .catch(function(){ return null; })
    .then(function(j){ drawSetup(j && j.check); });
}
function drawSetup(items){
  var box = document.getElementById('setupBox');
  if (!items || !items.length){ box.className = 'setup'; box.innerHTML = ''; return; }
  var bad = items.filter(function(x){ return x.ok === false; }).length;
  if (!bad && !(HELLO && HELLO.test)){ box.className = 'setup'; box.innerHTML = ''; return; }
  box.innerHTML = '<div class="st">Setup check: ' + (bad ? bad + (bad === 1 ? ' thing' : ' things') +
      ' to fix' : 'everything is working') + '</div>' +
    items.map(function(x){
      var k = x.ok === true ? 'ok' : x.ok === false ? 'bad' : 'info';
      return '<div class="sr ' + k + '" data-k="' + esc(x.key) + '"><span class="mk">' +
        (x.ok === true ? '\u2713' : x.ok === false ? '\u2715' : '\u2022') + '</span><span>' +
        (x.at ? esc(stampOf(x.at)) + ': ' : '') + esc(x.say) + '</span></div>';
    }).join('') + '<button class="sbtn" id="setupAgain">Check again</button>';
  box.className = 'setup show';
  document.getElementById('setupAgain').onclick = function(){
    this.textContent = 'Checking'; this.disabled = true; setupCheck();
  };
}
function hello(){
  fetch(CONTACT_URL, { method:'POST', headers:{ 'Content-Type':'application/json' },
                       body: JSON.stringify({ idToken: window.__idToken, kind:'hello' }) })
    .then(function(r){ return r.ok ? r.json() : null; })
    .catch(function(){ return null; })
    .then(function(j){
      HELLO = j;
      var bar = document.getElementById('testBar');
      /* No answer at all: the Worker is not there yet - published before
         Twilio, the owner's plan, 29 Sep - or the connection is down. Said
         at the top, rather than left for Send to discover. */
      if (!j){
        bar.textContent = 'The messenger is not answering, so nothing can be sent just now. ' +
                          'Until the Worker and Twilio are set up, that is expected.';
        bar.className = 'testbar show';
      } else if (j.test){
        bar.textContent = 'Test mode: messages only go to the test phones. Guests receive nothing ' +
                          'until TEST_NUMBERS is removed in Cloudflare.';
        bar.className = 'testbar show';
      } else if (!j.ready){
        bar.textContent = 'Twilio is not set up yet, so nothing can be sent. Messages already ' +
                          'received still show.';
        bar.className = 'testbar show';
      }
      if (CK && TH.t !== undefined) drawCompose();
      setupCheck();
    });
}

/* New messages arrive by themselves: the list every 15 seconds, an open
   conversation every 8, and at once when the phone wakes the page. Never
   while the desk is typing into the box or choosing a team. */
function busy(){
  var box = document.getElementById('msgBox');
  return document.hidden || PICK || NOTEED || DELSEL ||
         document.getElementById('backdrop').className.indexOf('show') > -1 ||
         (document.activeElement === box && box.value);
}
setInterval(function(){ if (window.__idToken && !busy()) refresh(); }, CK ? 8000 : 15000);
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && window.__idToken) refresh();
});

function showAccess(allowed, e){
  var box = document.getElementById('noAccess');
  var on = !allowed;
  box.innerHTML = !on ? '' :
    (e ? '<div>Could not check access. This is usually the connection, '
       + 'not your login.</div>'
       + '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
       : 'This login has no access to Chat. See the manager.');
  if (on && !e){
    var home = homeFor(window.NALA_ROLE);
    if (home && home !== location.pathname.split('/').pop()){
      location.replace(home); return;
    }
  }
  box.className = 'noaccess' + (on ? ' show' : '');
  document.getElementById('listView').style.display = on || CK ? 'none' : '';
  document.getElementById('threadView').style.display = on || !CK ? 'none' : '';
  if (on) return;
  if (CK){
    var back = document.getElementById('backBtn');
    back.style.display = '';
    back.onclick = function(){ location.href = 'guest-contact.html?t=' + TAB; };
  }
  hello();
  refresh();
}

window.NALA_ROLE = null;
(function gate(){
  if (!window.firebase || !firebase.auth || typeof loadStaff !== 'function')
    return setTimeout(gate, 40);
  var A; try { A = firebase.auth(); } catch(e){ return setTimeout(gate, 40); }
  if (!A || !A.onAuthStateChanged) return setTimeout(gate, 40);
  A.onAuthStateChanged(function(u){
    if (!u) return;                 /* auth.js owns the signed-out state */
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role;
      window.NALA_USER = u;
      document.getElementById('navWrap').style.display = 'block';
      navFilter(role);
      /* editBookings, the SMS pages' gate and the Worker's. */
      showAccess(canOpen(role, 'guest-contact.html'), e);
    });
  });
})();
</script>
