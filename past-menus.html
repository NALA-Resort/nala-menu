<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nala Villas">
<link rel="apple-touch-icon" href="nala-icon.png?v=1">
<title>Nala &middot; Past Menus</title>
<link rel="stylesheet" href="nala-ui.css?v=17">
<style>
  :root { --cream:#F9F7F4; --ink:#1C1C1A; --mid:#999990; --rule:#E0E0DA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--ink); font-family:var(--ui-font);
         padding:calc(24px + env(safe-area-inset-top)) 18px 40px;
         -webkit-tap-highlight-color:transparent; }

  /* The menu of the night, set the way the guest saw it: the course label
     small and quiet, the dish in the serif the menu itself uses. A night is
     four lines, so it wants to read as a menu, not as a table of records. */
  .course { padding:16px 0; border-bottom:1px solid var(--rule); }
  .course:last-child { border-bottom:0; }
  .clabel { font-size:11px; letter-spacing:.14em; text-transform:uppercase;
            color:var(--mid); }
  .cname { font-family:Georgia, serif; font-size:19px; line-height:1.35; margin-top:5px; }
  .cname.none { font-family:var(--ui-font); font-size:14px; color:var(--mid);
                font-style:italic; }
  .cdesc { font-family:Georgia, serif; font-style:italic; font-size:14px;
           color:var(--mid); line-height:1.5; margin-top:5px; }

  .pubat { font-size:11px; color:var(--mid); margin-top:18px; line-height:1.5; }

  /* Nothing that night, which is a real answer and not a fault: the resort
     does not serve dinner every night, and a night with no menu should not
     look like a page that failed to load. */
  .empty { padding:40px 0; text-align:center; color:var(--mid); }
  .empty .big { font-family:Georgia, serif; font-size:17px; }
  .empty .sub { font-size:13px; margin-top:8px; line-height:1.5; }

  .err { padding:34px 0; text-align:center; color:var(--mid);
         font-size:13px; line-height:1.6; }
  .err .btn { margin-top:16px; display:inline-block; padding:11px 20px;
              border:1px solid var(--ink); border-radius:8px; color:var(--ink);
              background:transparent; font-family:var(--ui-font); font-size:11px;
              letter-spacing:.14em; text-transform:uppercase; cursor:pointer; }
</style>
</head>
<body class="tier-app">

<!-- The same date row as the sheets and the boards: Today, the arrows, and
     the label itself as the picker. initDateNav wires all four, so a page
     that wants a date does not reinvent one. -->
<div class="daterow">
  <button class="dnav today" id="dToday">Today</button>
  <button class="dnav" id="dPrev">&#8249;</button>
  <div class="date" id="title"></div>
  <button class="dnav" id="dNext">&#8250;</button>
  <div class="navwrap" id="navWrap" style="display:none">
    <button class="navbtn" id="navBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navdrop" id="navDrop"></div>
  </div>
</div>

<div class="noaccess" id="noAccess"></div>

<div id="board"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="auth.js?v=12"></script>
<script src="nala-shared.js?v=46"></script>
<script>
var DB = "https://nala-menu-default-rtdb.asia-southeast1.firebasedatabase.app";

var NAV = initDateNav();

(function(){
  var b=document.getElementById('navBtn'), d=document.getElementById('navDrop');
  b.onclick=function(e){ e.stopPropagation(); d.classList.toggle('open'); };
  document.addEventListener('click',function(){ d.classList.remove('open'); });
})();

var COURSES = [ ['bread','Bread'], ['entree','Entr\u00E9e'],
                ['main','Main'],   ['dessert','Dessert'] ];

function timeLabel(iso){
  var d = parseISO(iso);
  if (!d || isNaN(d)) return '';
  var h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  return (h % 12 || 12) + ':' + m + (h < 12 ? 'am' : 'pm');
}

function render(rec){
  var board = document.getElementById('board');
  board.innerHTML = '';

  if (rec && rec.__failed !== undefined){
    /* A read that FAILED is not a night without a menu. Clean Slate counted
       four unreadable nodes as zero and called it a success; here the same
       mistake would report a quiet night the kitchen actually cooked. */
    board.innerHTML =
      '<div class="err">Tonight\u2019s record could not be read \u2014 this is ' +
      'usually the connection or the login, not a missing menu.' +
      '<br><button class="btn" onclick="location.reload()">Try again</button></div>';
    return;
  }

  if (!rec || !COURSES.some(function(c){ return rec[c[0]] && String(rec[c[0]]).trim(); })){
    var future = NAV.VIEW > new Date() && !NAV.isToday();
    board.innerHTML =
      '<div class="empty"><div class="big">' +
      (future ? 'Not yet' : 'No menu recorded') + '</div>' +
      '<div class="sub">' +
      (future
        ? 'A menu is recorded on the night it is published, so this one has not happened yet.'
        : 'Either no dinner was served, or the menu was never published. ' +
          'Nights before the archive began will be blank too.') +
      '</div></div>';
    return;
  }

  COURSES.forEach(function(c){
    var name = rec[c[0]] ? String(rec[c[0]]).trim() : '';
    var html = '<div class="course"><div class="clabel">' + c[1] + '</div>' +
               '<div class="cname' + (name ? '' : ' none') + '"></div>';
    /* Only the main carries a description in the archive, so only the main
       shows one rather than four empty slots pretending otherwise. */
    if (c[0] === 'main' && rec.mainDesc && String(rec.mainDesc).trim())
      html += '<div class="cdesc"></div>';
    html += '</div>';
    board.insertAdjacentHTML('beforeend', html);
    var el = board.lastChild;
    el.querySelector('.cname').textContent = name || 'Not served';
    var d = el.querySelector('.cdesc');
    if (d) d.textContent = String(rec.mainDesc).trim();
  });

  /* When the chef actually published it. Useful for the question this page
     gets asked in an argument: was that Tuesday's menu or Wednesday's. */
  if (rec.published){
    var t = timeLabel(rec.published);
    if (t) board.insertAdjacentHTML('beforeend',
      '<div class="pubat">Published at ' + t + '</div>');
  }
}

function load(){
  var key = NAV.todayKey();
  fetch(DB + '/menuhistory/' + key + '.json?v=' + Date.now())
    .then(function(r){ return r.ok ? r.json() : { __failed: r.status }; })
    .catch(function(){ return { __failed: 0 }; })
    .then(render);
}

function showAccess(allowed, e){
  var box = document.getElementById('noAccess');
  var on = !allowed;
  box.innerHTML = !on ? '' :
    (e ? '<div>Could not check access. This is usually the connection, ' +
         'not your login.</div>' +
         '<button class="btn na-retry" onclick="location.reload()">Try again</button>'
       : 'This login has no access to Past Menus. See the manager.');
  if (on && !e){
    var home = homeFor(window.NALA_ROLE);
    if (home && home !== location.pathname.split('/').pop()){
      location.replace(home); return;
    }
  }
  box.className = 'noaccess' + (on ? ' show' : '');
  document.getElementById('board').style.display = on ? 'none' : '';
  if (!on) load();
}

window.NALA_ROLE = null;
(function gate(){
  if (!window.firebase || !firebase.auth || typeof loadStaff !== 'function')
    return setTimeout(gate, 40);
  var A; try { A = firebase.auth(); } catch(e){ return setTimeout(gate, 40); }
  if (!A || !A.onAuthStateChanged) return setTimeout(gate, 40);
  A.onAuthStateChanged(function(u){
    if (!u) return;                  /* auth.js owns the signed-out state */
    loadStaff(function(recs, e){
      var role = roleOf(u);
      window.NALA_ROLE = role;
      window.NALA_USER = u;
      document.getElementById('navWrap').style.display = 'block';
      if (window.NALA_NAVFILTER) NALA_NAVFILTER(role);
      /* The same audience as the statistics page and the boards: reading the
         resort's own record, no writes. The chef wants it most - it answers
         "when did we last do barramundi" - and resBoard already includes the
         chef, the waiters and the manager. */
      showAccess(can(role, 'resBoard'), e);
    });
  });
})();
</script>
</body>
</html>
