<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nala &middot; Mock &middot; Calendar, refined</title>
<style>
  /* THE DRESS ACROSS THE APP - Calendar. The whole house across the days,
     as the live page draws it: villa rows, day columns, each stay a bar
     tinted by its pre-arrival form's state - grey not started, amber
     incomplete, green completed, the ruled three states. Refined finish
     only: house scale, hairlines, soft corners, the today line kept.
     A mock: invented stays, local state, nothing saved. */
  :root {
    --cream:#F9F7F4; --card:#FFFFFF; --ink:#1B1B19; --mid:#5F5F58;
    --rule:#E6E6E1; --hair:rgba(28,28,26,.12);
    --todo:rgba(28,28,26,.10); --todo-b:rgba(28,28,26,.22);
    --part:#F6EAD5; --part-b:#C29A55; --part-ink:#8A6A2F;
    --done:#DCE7DD; --done-b:rgba(122,160,130,.65); --done-ink:#5E7D67;
    --t1:12px; --t2:14px; --t3:16px; --t4:20px; --t5:27px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--cream); color:var(--ink);
         font-family:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
         font-size:var(--t2); padding:calc(16px + env(safe-area-inset-top)) 18px 40px;
         max-width:430px; margin-inline:auto; font-variant-numeric:tabular-nums; }
  .crumb { font-size:11px; letter-spacing:.14em; text-transform:uppercase;
           color:var(--mid); margin-bottom:10px; }
  .daterow { display:flex; align-items:center; gap:8px; }
  .today { font-size:var(--t2); color:var(--mid); background:none;
           border:1px solid var(--hair); border-radius:10px; padding:7px 12px;
           font-family:inherit; min-height:36px; }
  .dn { width:36px; height:36px; border-radius:10px; border:1px solid var(--hair);
        background:none; font:inherit; font-size:15px; color:var(--ink);
        display:grid; place-items:center; }
  .date { font-size:var(--t4); font-weight:600; flex:1; text-align:center; }
  .nav { width:36px; height:36px; border-radius:10px; border:1px solid var(--hair);
         background:none; display:grid; place-items:center; }
  .nav span { display:block; width:15px; height:1.5px; background:var(--ink);
              margin:1.75px 0; border-radius:2px; }
  .stats { display:flex; justify-content:space-evenly; text-align:center;
           margin:22px 0 18px; }
  .st .n { font-size:var(--t5); font-weight:600; }
  .st .k { font-size:var(--t2); color:var(--mid); margin-top:2px; }

  .sheet { background:var(--card); border:1px solid var(--hair); border-radius:16px;
           overflow:hidden; }
  .mon { font-size:var(--t1); letter-spacing:.14em; text-transform:uppercase;
         color:var(--mid); text-align:center; padding:10px 0 2px; }
  .cal { display:grid; grid-template-columns:34px repeat(6,1fr); position:relative; }
  .dh { font-size:var(--t1); color:var(--mid); text-align:center; padding:6px 0 8px;
        border-bottom:1px solid var(--rule); }
  .dh b { color:var(--ink); font-weight:600; }
  .dh.now b { color:var(--done-ink); }
  .vh { font-size:var(--t1); color:var(--mid); text-align:center;
        border-bottom:1px solid var(--rule); border-right:1px solid var(--rule);
        padding:9px 0; }
  .cell { border-bottom:1px solid var(--rule); min-height:34px; position:relative; }
  .cal > .cell:nth-child(7n) { }
  .bar { position:absolute; top:6px; bottom:6px; border-radius:8px;
         border:1px solid; font-size:10.5px; display:flex; align-items:center;
         padding-left:7px; overflow:hidden; white-space:nowrap; }
  .bar.todo { background:var(--todo); border-color:var(--todo-b); color:var(--mid); }
  .bar.part { background:var(--part); border-color:var(--part-b); color:var(--part-ink); }
  .bar.done { background:var(--done); border-color:var(--done-b); color:var(--done-ink); }
  .nowline { position:absolute; top:0; bottom:0; width:2px;
             background:var(--mid); opacity:.5; z-index:1; }
  .legend { display:flex; flex-wrap:wrap; gap:5px 14px; font-size:var(--t1);
            color:var(--mid); margin:12px 2px 0; }
  .sw { display:inline-block; width:16px; height:9px; border-radius:5px;
        margin-right:5px; vertical-align:-1px; border:1px solid; }
  .sw.t { background:var(--todo); border-color:var(--todo-b); }
  .sw.p { background:var(--part); border-color:var(--part-b); }
  .sw.d { background:var(--done); border-color:var(--done-b); }
</style>
</head>
<body>
<div class="crumb">Nala &middot; the dress across the app &middot; nothing live</div>
<div class="daterow">
  <button class="today">Today</button>
  <button class="dn">&#8249;</button>
  <div class="date">Tue 15th Sep</div>
  <button class="dn">&#8250;</button>
  <button class="nav" aria-label="Menu"><span></span><span></span><span></span></button>
</div>

<div class="stats">
  <div class="st"><div class="n">14</div><div class="k">In house</div></div>
  <div class="st"><div class="n">3</div><div class="k">Arriving</div></div>
  <div class="st"><div class="n">2</div><div class="k">Departing</div></div>
</div>

<div class="sheet">
  <div class="mon">Sep 2026</div>
  <div class="cal" id="cal">
    <div class="dh"></div>
    <div class="dh">Sun <b>13</b></div><div class="dh">Mon <b>14</b></div>
    <div class="dh now">Tue <b>15</b></div><div class="dh">Wed <b>16</b></div>
    <div class="dh">Thu <b>17</b></div><div class="dh">Fri <b>18</b></div>
  </div>
</div>

<div class="legend">
  <span><i class="sw t"></i>Form not started</span>
  <span><i class="sw p"></i>Incomplete</span>
  <span><i class="sw d"></i>Completed</span>
</div>

<script>
/* Rows built by script so the bars can span days; a bar is a stay, its tint
   the form's state, exactly as the live board reads formState. */
(function(){
  var cal = document.getElementById('cal');
  // villa, then stays as [startCol 1-6, span, state, name]
  var rows = [
    [1,  [[1,4,'done','Harrington']]],
    [2,  [[2,5,'done','Petrova']]],
    [3,  [[1,3,'done','Whitfield']]],
    [4,  [[3,4,'part','Vik']]],
    [5,  [[1,2,'done','Chen'],[4,3,'todo','Moreau']]],
    [6,  [[2,3,'part','Nowak']]],
    [7,  [[1,6,'done','Raman']]],
    [9,  [[3,2,'part','Sato']]],
    [11, [[1,3,'done','Marino']]],
    [14, [[2,4,'done','Bianchi']]],
    [16, [[4,3,'todo','Lindt']]],
    [17, [[1,5,'done','Kovac']]]
  ];
  rows.forEach(function(r){
    var vh = document.createElement('div'); vh.className='vh'; vh.textContent=r[0];
    cal.appendChild(vh);
    var wrap = document.createElement('div');
    wrap.style.cssText='grid-column:2 / span 6; position:relative;';
    wrap.className='cell';
    r[1].forEach(function(s){
      var b = document.createElement('div');
      b.className='bar '+s[2];
      b.style.left = ((s[0]-1)/6*100) + '%';
      b.style.width = 'calc(' + (s[1]/6*100) + '% - 5px)';
      b.textContent = s[3];
      wrap.appendChild(b);
    });
    cal.appendChild(wrap);
  });
  /* the today line, through Tue 15 (column 3 of 6) */
  var line = document.createElement('div');
  line.className='nowline';
  line.style.left = 'calc(34px + (100% - 34px) * ' + (2.5/6) + ')';
  cal.appendChild(line);
})();
</script>
</body>
</html>
