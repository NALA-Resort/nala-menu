<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Nala — Printable Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --paper:#FFFFFF; --ink:#1C1C1A; --mid:#8A8A82; --rule:#D8D8D2; --bg:#E9E7E3; }

  body { background:var(--bg); font-family:'Raleway',Helvetica,Arial,sans-serif; padding:18px; }

  .bar { max-width:1050px; margin:0 auto 12px; display:flex; gap:8px; align-items:center;
         flex-wrap:wrap; }
  .btn { padding:11px 20px; background:var(--ink); color:#fff; border:none;
         font-family:'Raleway',sans-serif; font-size:10px; letter-spacing:.15em;
         text-transform:uppercase; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--ink); }
  .btn:disabled { opacity:.4; }
  .state { margin-left:auto; font-size:10px; letter-spacing:.12em;
           text-transform:uppercase; color:#777; }
  .hint { max-width:1050px; margin:0 auto 14px; font-size:11px; color:#7A7A72;
          font-style:italic; }

  #viewer { display:block; width:100%; max-width:1050px; height:78vh;
            margin:0 auto; border:none; background:#fff;
            box-shadow:0 2px 14px rgba(0,0,0,.14); }

  .stage { max-width:1050px; margin:0 auto; overflow:hidden; }
  .sheet { width:297mm; height:210mm; background:var(--paper);
           display:flex; position:relative;
           box-shadow:0 2px 14px rgba(0,0,0,.14); transform-origin:top left; }
  .half { width:50%; height:100%; padding:0 20mm; display:flex; flex-direction:column;
          align-items:center; justify-content:center; }
  .cut { position:absolute; top:0; bottom:0; left:50%; width:0;
         border-left:1px dashed #CFCFC9; }

  .menu { width:100%; text-align:center; }
  .course { margin-bottom:9mm; }
  .label { font-size:9px; font-weight:400; letter-spacing:.34em;
           text-transform:uppercase; color:var(--mid); margin-bottom:6px; }
  .rule { width:26%; height:1px; background:var(--rule); margin:6px auto 11px; }
  .dish { font-size:22px; font-weight:400; color:var(--ink); line-height:1.22;
          margin-bottom:6px; }
  .aus  { font-size:11px; color:var(--mid); vertical-align:super; margin-left:4px; }
  .desc { font-style:italic; font-weight:300; font-size:14px;
          color:var(--ink); line-height:1.4; }
  .foot { margin-top:6mm; }
  .price { font-size:13px; font-weight:400; letter-spacing:.02em;
           color:var(--ink); margin-bottom:6px; }
  .note  { font-style:italic; font-weight:300; font-size:12.5px; color:var(--mid); }
  .empty { font-style:italic; font-size:16px; color:var(--mid); }
</style>
</head>
<body>

<div class="bar">
  <a class="btn ghost" href="tally.html">Back</a>
  <button class="btn" id="pdfBtn" style="display:none">Open PDF</button>
  <span class="state" id="state">Preparing menu…</span>
</div>

<iframe id="viewer" title="Menu PDF"></iframe>

<!-- hidden layout used only to build the PDF -->
<div class="stage" id="stage" style="display:none">
  <div class="sheet" id="sheet">
    <div class="half"><div class="menu" id="menuA"></div></div>
    <div class="cut"></div>
    <div class="half"><div class="menu" id="menuB"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="raleway.js"></script>
<script>
var MENU = null;
var LABELS = { bread:'BREAD', entree:'ENTRÉE', main:'MAIN', dessert:'DESSERT' };
var ORDER  = ['bread','entree','main','dessert'];

function parseISO(s){
  if (!s) return null;
  var t = String(s).trim().replace(/(\.\d{3})\d+/, '$1');
  var d = new Date(t);
  if (!isNaN(d)) return d;
  d = new Date(t.replace(/\.\d+/, ''));
  return isNaN(d) ? null : d;
}
function esc(s){
  return String(s||'').replace(/[&<>]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c];
  });
}
function spaced(s){ return s.split('').join(' '); }

// commas from the kitchen become middle dots on the menu
function dots(s){ return String(s||'').replace(/\s*,\s*/g, ' · '); }

// title case for dish names, keeping small words down
var SMALL = ['and','with','of','de','a','the','in','on'];
function titled(s){
  return String(s||'').split(' ').map(function(w, i){
    var lw = w.toLowerCase();
    if (i > 0 && SMALL.indexOf(lw) > -1) return lw;
    if (/[A-Z]/.test(w.slice(1))) return w;          // leave XO, PX, AUS alone
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

// ── on-screen preview ─────────────────────────────────────
function buildHTML(m){
  var html = '';
  ORDER.forEach(function(k){
    var c = m[k] || {};
    if (!c.name) return;
    html +=
      '<div class="course">' +
        '<div class="label">' + spaced(LABELS[k]) + '</div>' +
        '<div class="rule"></div>' +
        '<div class="dish">' + esc(titled(c.name)) +
          (c.aus ? '<span class="aus">(AUS)</span>' : '') + '</div>' +
        (c.desc ? '<div class="desc">' + esc(dots(c.desc)) + '</div>' : '') +
      '</div>';
  });
  html +=
    '<div class="foot">' +
      '<div class="price">2 courses 105 &nbsp;&nbsp;&nbsp; 3 courses 125</div>' +
      '<div class="note">Both 2 and 3 course menus include bread</div>' +
    '</div>';
  return html;
}

function fitSheet(){
  var stage = document.getElementById('stage');
  var sheet = document.getElementById('sheet');
  var scale = Math.min(1, stage.clientWidth / (sheet.offsetWidth || 1));
  sheet.style.transform = 'scale(' + scale + ')';
  stage.style.height = ((sheet.offsetHeight || 1) * scale) + 'px';
}
window.addEventListener('resize', fitSheet);
window.addEventListener('orientationchange', function(){ setTimeout(fitSheet, 150); });

// ── PDF ───────────────────────────────────────────────────
function registerFonts(doc){
  doc.addFileToVFS('Raleway-Regular.ttf', RALEWAY.RalewayRegular);
  doc.addFont('Raleway-Regular.ttf', 'Raleway', 'normal');
  doc.addFileToVFS('Raleway-Italic.ttf', RALEWAY.RalewayItalic);
  doc.addFont('Raleway-Italic.ttf', 'Raleway', 'italic');
  doc.addFileToVFS('Raleway-Light.ttf', RALEWAY.RalewayLight);
  doc.addFont('Raleway-Light.ttf', 'RalewayLight', 'normal');
}

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function makePDF(open){
  if (!MENU) return;
  var doc = new jspdf.jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  registerFonts(doc);

  var W = 297, H = 210, COL = 108;
  var centres = [W * 0.25, W * 0.75];

  var courses = ORDER.filter(function(k){
    return MENU[k] && MENU[k].name && MENU[k].name.trim();
  });

  // measure to centre vertically
  function heightOf(k){
    var c = MENU[k], h = 0;
    h += 3.3 + 6.9;                                   // label step + rule step
    doc.setFont('Raleway','normal').setFontSize(16);
    h += doc.splitTextToSize(titled(c.name), COL).length * 7.2;
    if (c.desc){
      doc.setFont('Raleway','italic').setFontSize(10.5);
      h += doc.splitTextToSize(dots(c.desc), COL).length * 4.9;
    }
    return h + 9.5;                                   // gap after the course
  }

  // distance from the first label baseline to the last footer baseline
  var total = courses.reduce(function(t,k){ return t + heightOf(k); }, 0) + 1 + 5.4;
  var startY = (H - total) / 2 + 2;   // +2 lifts baselines to optical centre

  centres.forEach(function(cx){
    var y = startY;

    courses.forEach(function(k){
      var c = MENU[k];

      doc.setFont('Raleway','normal').setFontSize(6.8).setTextColor(138,138,130);
      doc.text(spaced(LABELS[k]), cx, y, { align:'center', charSpace:0 });
      y += 3.3;

      doc.setDrawColor(216).setLineWidth(0.22);
      doc.line(cx - 13, y, cx + 13, y);
      y += 6.9;

      doc.setFont('Raleway','normal').setFontSize(16).setTextColor(28,28,26);
      var lines = doc.splitTextToSize(titled(c.name), COL);
      lines.forEach(function(ln, idx){
        doc.text(ln, cx, y, { align:'center' });
        if (idx === lines.length - 1 && c.aus){
          var w = doc.getTextWidth(ln);
          doc.setFont('Raleway','normal').setFontSize(7).setTextColor(138,138,130);
          doc.text('(AUS)', cx + w/2 + 1.6, y - 2.9);
          doc.setFont('Raleway','normal').setFontSize(16).setTextColor(28,28,26);
        }
        y += 7.2;
      });

      if (c.desc){
        doc.setFont('Raleway','italic').setFontSize(10.5).setTextColor(28,28,26);
        doc.splitTextToSize(dots(c.desc), COL).forEach(function(ln){
          doc.text(ln, cx, y, { align:'center' });
          y += 4.9;
        });
      }

      y += 9.5;
    });

    y += 1;
    doc.setFont('Raleway','normal').setFontSize(10.5).setTextColor(28,28,26);
    doc.text('2 courses 105     3 courses 125', cx, y, { align:'center' });
    y += 5.4;
    doc.setFont('Raleway','italic').setFontSize(8.6).setTextColor(138,138,130);
    doc.text('Both 2 and 3 course menus include bread', cx, y, { align:'center' });
  });

  doc.setDrawColor(205).setLineWidth(0.2).setLineDashPattern([1.6,1.6], 0);
  doc.line(W/2, 0, W/2, H);

  var d = parseISO(MENU.published) || new Date();
  var stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
              '-' + String(d.getDate()).padStart(2,'0');

  var blob = doc.output('blob');
  var url = URL.createObjectURL(blob);

  if (open){
    var a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.download = 'Nala menu ' + stamp + '.pdf';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); }, 5000);
    return;
  }

  // show it in place
  document.getElementById('viewer').src = url;
  window.__pdfURL = url;
}

document.getElementById('pdfBtn').onclick = function(){ makePDF(true); };

// ── load ──────────────────────────────────────────────────
fetch('menu.json?v=' + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(m){
    m = m || {};
    MENU = m;
    var filled = ORDER.some(function(k){
      return m[k] && m[k].name && m[k].name.trim() !== '';
    });

    if (!filled){
      var msg = '<div class="empty">No menu published</div>';
      document.getElementById('menuA').innerHTML = msg;
      document.getElementById('menuB').innerHTML = msg;
      document.getElementById('state').textContent = 'Nothing to print';
      document.getElementById('viewer').style.display = 'none';
      document.getElementById('stage').style.display = 'block';
      fitSheet();
      return;
    }

    var html = buildHTML(m);
    document.getElementById('menuA').innerHTML = html;
    document.getElementById('menuB').innerHTML = html;

    var pub = parseISO(m.published);
    document.getElementById('state').textContent = pub
      ? 'Published ' + pub.toLocaleDateString([], {weekday:'long', day:'numeric', month:'short'}) +
        ' ' + pub.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})
      : '';

    // build and display the PDF
    setTimeout(function(){
      makePDF(false);
      // iOS can't reliably render a PDF inside a frame — offer the button as well
      if (isIOS()) document.getElementById('pdfBtn').style.display = 'inline-block';
    }, 60);
  })
  .catch(function(){
    document.getElementById('state').textContent = 'Could not load the menu';
  });
</script>
</body>
</html>
